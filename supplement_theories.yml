    book_check: Miles 2012 第 17 章對照：補 5 條邊；書中變數我們原本沒有的：Resource Acquisition、Strategic Response to Institutional Pressure、Institutional
      Entrepreneurship、Organizational Status、Field-level Variability。三種壓力→同形是書明寫（p.159–160）。External Dependence→Coercive Pressure
      對應書中「強制同形來自組織所依賴資源的持有者」；Environmental Uncertainty→Mimetic Pressure 對應「不確定該怎麼做時模仿成功組織」；Professionalization→Normative
      Pressure 對應「教育訓練、專業網絡」，三條都是依書的定義句拆出的前因，不是書以因果句寫的。順從→正當性、資源、存活來自 p.160（Oliver 1997；Yang & Konrad 2010）。Organizational
      Status 調節來自批評節 Phillips & Zuckerman（2001）：中階地位者最需要表現正當，高地位可偏離、低地位只求生存；書是對正當性約束的質疑，我畫成調節。Isomorphism→Firm Performance
      書說仍在爭論（p.162），不畫邊。Acquiescence 清單已有，是 Oliver（1991）五種回應之一，其餘四種（compromise、avoidance、defiance、manipulation）合併列為 Strategic
      Response to Institutional Pressure。測量節的專業承諾、子公司績效、可程式化與控制幅度量表都是應用研究的操作化，不是核心構念。
  T IDT Innovation Diffusion Theory:
    note: T IDT Innovation Diffusion Theory
    abbr: IDT
    zh: 創新擴散理論
    field: 組織／行銷
    edges:
    - [Relative Advantage, Adoption, +]
    - [Compatibility, Adoption, +]
    - [Complexity, Adoption, '-']
    - [Trialability, Adoption, +]
    - [Observability, Adoption, +]
    - [Trialability, Perceived Risk, '-']
    - [Perceived Risk, Adoption, '-']
    - [Communication, Adoption, +]
    - [Opinion Leader Influence, Adoption, +]
    - [Social Norm, Adoption, +]
    - [Innovativeness, Adoption, +]
    - [Communication, Observability, +]
    - [Cosmopolitan Orientation, Innovativeness, +]
    - [Change Agent Contact, Innovativeness, +]
    - [Media Use, Innovation Awareness, +]
    - [Cumulative Adoption, Adoption, +]
    desc: Rogers（1962／2003）：創新被採用的速度取決於採用者對相對優勢、相容性、複雜性、可試用性、可觀察性的感知，並透過傳播管道、意見領袖與社會系統規範在時間中擴散；個人創新性決定採用者類別。
    refs:
    - {title: Diffusion of innovations (Wikipedia), url: 'https://en.wikipedia.org/wiki/Diffusion_of_innovations'}
    - {title: 'Diffusion of Innovations (TheoryHub, Newcastle University)', url: 'https://open.ncl.ac.uk/theories/8/diffusion-of-innovations/'}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 9 章', url: ''}
    enrich_notes: 原五條保留（TheoryHub 確認四正一負）。補 Rogers 擴散四要素中的傳播管道、社會系統（規範、意見領袖）與採用者創新性；可試用性降低不確定性（Perceived Risk）是 Rogers 對 trialability
      的解釋機制。Adoption 在此代表採用率／採用決策，原理論的五階段歷程（知曉→說服→決定→實施→確認）無法畫成變數邊，略去。
    book_check: Miles 2012 第 9 章對照：補 4 條邊；書中變數我們原本沒有的：Adoption Rate、Innovation Awareness、Change Agent Contact、Cosmopolitan
      Orientation、Cumulative Adoption、Critical Mass、Overadoption、Re-invention。五個創新屬性→採用速度是書上明寫（複雜度為負，書寫成『簡單易懂』為正）。早知曉者的特徵：教育、社會地位、大眾媒體接觸、人際溝通管道、變革推動者接觸、社會參與、世界主義取向（Rogers
      1983），我把它們連到 Innovativeness／Innovation Awareness 是依『早知曉／早採用』的描述推的，書給的是相關側寫不是因果。擴散效應：採用者越多對他人的壓力越大（Cumulative Adoption→Adoption
      +），壓力過高會過度採用；臨界多數後擴散自我維持。我們的 Installed Base、Bandwagon Effect、Perceived Majority Support 是鄰近概念但分別屬網路效應與捷思，故另立 Cumulative
      Adoption。Opinion Leader Influence 在我們清單裡，但本章正文沒提意見領袖，只提人際溝通管道，所以沒畫邊。批評：假定所有創新都該採用、忽略拒絕與負面後果、『落後者』帶貶義、只看技術創新。量表：Pankratz
      等（2002）知覺屬性量表；London 等（1977）世界主義－在地主義量表；Borrego 等（2010）創新知曉量表。
  Technostress Model:
    abbr: TStress
    zh: 科技壓力模型
    field: 組織／IS
    desc: Tarafdar 等人（2007）與 Ragu-Nathan 等人（2008）提出科技壓力模型：超載、入侵、複雜、不安全、不確定五種壓力源造成科技壓力，降低工作滿意、承諾與生產力並提高角色壓力；素養促進、技術支援與參與促進三種抑制因素減緩。
    edges:
    - [Techno-overload, Technostress, +]
    - [Techno-invasion, Technostress, +]
    - [Techno-complexity, Technostress, +]
    - [Techno-insecurity, Technostress, +]
    - [Techno-uncertainty, Technostress, +]
    - [Technical Support, Technostress, '-']
    - [Literacy Facilitation, Technostress, '-']
    - [Involvement Facilitation, Technostress, '-']
    - [Technostress, Job Satisfaction, '-']
    - [Job Satisfaction, Affective Commitment, +]
    - [Technostress, Role Stress, +]
    - [Technostress, Job Performance, '-']
    - [Technostress, User Satisfaction, '-']
    - [Technostress, Continuance Intention, '-']
    refs:
    - {title: 'Ragu-Nathan, Tarafdar, Ragu-Nathan & Tu (2008) The Consequences of Technostress for End Users in Organizations
        (ISR, IDEAS record)', url: 'https://ideas.repec.org/a/inm/orisre/v19y2008i4p417-433.html'}
    - {title: 'Tarafdar, Tu, Ragu-Nathan & Ragu-Nathan (2007) The Impact of Technostress on Role Stress and Productivity (JMIS)',
      url: 'https://jmis-web.org/articles/932'}
    - {title: Hang et al. (2022) The moderating effects of technostress inhibitors on techno-stressors and employee well-being
        (PMC), url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC8784549'}
    enrich_notes: 原六條邊保留。補齊五種壓力源（Techno-insecurity、Techno-uncertainty 新造）與三種抑制因素（Literacy Facilitation、Involvement Facilitation
      新造；Technical Support 沿用）。Ragu-Nathan 等人（2008）的結果鏈是壓力源→工作滿意↓→組織承諾與持續承諾↓，以 Affective Commitment 代表組織承諾；Tarafdar 等人（2007）為科技壓力→角色壓力↑、生產力↓（Role
      Stress 新造，生產力以 Job Performance 代表）。原檔的 User Satisfaction 與 Continuance Intention 負向出自 Tarafdar 等人（2010）end-user satisfaction
      研究，保留。Ragu-Nathan 的抑制因素在原模型是直接作用於結果，不是調節；Hang 等人（2022）才測調節，此處維持直接邊。
  Status Quo Bias Theory:
    abbr: SQB
    zh: 現狀偏誤理論（使用者抗拒）
    field: IS
    desc: Kim 與 Kankanhalli（2009）以現狀偏誤解釋新系統上線前的使用者抗拒：轉換成本直接提高抗拒並經由降低感知價值間接提高抗拒，轉換利益提高感知價值而降低抗拒；同事意見與自我效能經由轉換成本作用，組織支持直接降低抗拒。
    edges:
    - [Switching Benefits, Perceived Value, +]
    - [Switching cost, Perceived Value, '-']
    - [Perceived Value, User Resistance, '-']
    - [Switching cost, User Resistance, +]
    - [Social Norm, Perceived Value, +]
    - [Social Norm, Switching cost, '-']
    - [Self-Efficacy, Switching cost, '-']
    - [Organizational Support, Switching cost, '-']
    - [Organizational Support, User Resistance, '-']
    refs:
    - {title: 'Kim & Kankanhalli (2009) Investigating User Resistance to Information Systems Implementation: A Status Quo
        Bias Perspective (MIS Quarterly, AISeL)', url: 'https://aisel.aisnet.org/misq/vol33/iss3/9'}
    - {title: 'Status Quo Bias in Users IS Adoption and Continuance Intentions: A Literature Review and Framework (arXiv)',
      url: 'https://arxiv.org/pdf/2212.03283'}
    enrich_notes: 原檔「Switching Benefits -> User Resistance (-)」與「Social Norm -> User Resistance (-)」改成原論文的中介結構：利益經由感知價值作用、同事意見（以名單中的
      Social Norm 代表 favorable colleague opinion）經由感知價值與轉換成本作用，摘要明示轉換成本中介同事意見與自我效能的效果，感知價值與組織支持直接降低抗拒。各前因→轉換成本的負向是依常見轉述（arXiv
      回顧與後續複製研究），原文 PDF 未能打開，方向待核。變數名維持名單的「Switching cost」拼法。
  Push-Pull-Mooring:
    abbr: PPM
    zh: 推拉繫住模型（轉換行為）
    field: 行銷／IS
    desc: Bansal、Taylor 與 St. James（2005）：借自移民研究，不滿意、低價值與低信任是推力，替代品吸引力與轉換利益是拉力，轉換成本、習慣、主觀規範與先前轉換經驗是繫住力；繫住力除直接作用外也調節推拉力對轉換意圖的影響。
