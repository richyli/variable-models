    - [Motivation, Systematic Processing, +]
    - [Ability, Systematic Processing, +]
    - [Need for Cognition, Systematic Processing, +]
    - [Systematic Processing, Heuristic Processing, '-']
    - [Heuristic Processing, Decision Error, +]
    - [Systematic Processing, Decision Accuracy, +]
    - [Domain Expertise, Heuristic Processing -> Decision Error, m]
    refs:
    - {title: Dual process theory - Wikipedia, url: 'https://en.wikipedia.org/wiki/Dual_process_theory'}
    - {title: 'Evans (2008) Dual-processing accounts of reasoning, judgment, and social cognition, Annual Review of Psychology
        59', url: 'https://researchportal.plymouth.ac.uk/en/publications/dual-processing-accounts-of-reasoning-judgment-and-social-cogniti/'}
    enrich_notes: Wikipedia 明寫：工作記憶負荷削弱系統二（De Neys 2006）、ELM 的動機與能力決定中央／周邊路徑、專家領域的系統一較準。Time Pressure 與 Need for Cognition
      兩條是常見實證版本，Wikipedia 未直接討論。Evans 提醒系統一不等於偏誤、系統二不等於正確，故 Domain Expertise 設為調節。
  Schema Theory:
    note: Schema Theory
    abbr: Schema
    name: Schema Theory
    zh: 基模理論
    field: 認知心理
    desc: Bartlett（1932）與 Piaget 提出：基模是由過去經驗組成的知識結構，引導注意、編碼與重建式回憶；與基模一致的訊息較易理解與記住，不一致者被忽略、扭曲或迫使基模調適（accommodation）。
    edges:
    - [Prior Knowledge Base, Schema Activation, +]
    - [Priming, Schema Activation, +]
    - [Schema Activation, Comprehension, +]
    - [Schema Activation, Recall, +]
    - [Schema Congruence, Recall, +]
    - [Schema Congruence, Memory Distortion, +]
    - [Schema Congruence, Schema Change, '-']
    - [Schema Activation, Stereotyping, +]
    refs:
    - {title: Schema (psychology) - Wikipedia, url: 'https://en.wikipedia.org/wiki/Schema_(psychology)'}
    - {title: Schema Theory In Psychology - Simply Psychology, url: 'https://www.simplypsychology.org/what-is-a-schema.html'}
    enrich_notes: 方向依兩來源明寫：先前經驗與啟動（priming）提高基模可及性；Bransford & Johnson（1972）標題提升理解與回憶；Brewer & Treyens（1981）回憶出不存在的書＝基模一致訊息的記憶扭曲；不一致訊息無法忽略時才調適（Schema
      Change 為負向）；刻板印象是基模的一種。
  Working Memory Theory:
    note: Working Memory Theory
    abbr: WMT
    name: Working Memory Theory
    zh: 工作記憶理論
    field: 認知心理
    desc: Baddeley 與 Hitch（1974）提出、Baddeley（2000）增補情節緩衝區：工作記憶由中央執行器、語音迴路、視覺空間畫板與情節緩衝區組成，各子系統容量有限；同一子系統的雙重作業互相干擾，複誦與組塊可延長保留並支撐理解與學習。
    edges:
    - [Working Memory Capacity, Comprehension, +]
    - [Working Memory Capacity, Learning Performance, +]
    - [Cognitive Load, Comprehension, '-']
    - [Modality Overlap, Dual-Task Interference, +]
    - [Dual-Task Interference, Learning Performance, '-']
    - [Rehearsal, Retention, +]
    - [Chunking, Working Memory Capacity, +]
    - [Working Memory Capacity, Retention, +]
    - [Prior Knowledge Base, Retention, +]
    refs:
    - {title: Baddeley's model of working memory - Wikipedia, url: 'https://en.wikipedia.org/wiki/Baddeley%27s_model_of_working_memory'}
    - {title: Working Memory Model (Baddeley and Hitch) - Simply Psychology, url: 'https://www.simplypsychology.org/working-memory.html'}
    enrich_notes: Wikipedia 明寫雙重作業干擾（同知覺域干擾較大）、複誦防止語音痕跡衰退、情節緩衝區連接長期記憶（故 Prior Knowledge Base -> Retention）。Simply Psychology
      補充六位數字負荷損害散文理解、語音迴路與字彙學習有關。容量上限（7±2）有爭議，未入邊。
  Dual Coding Theory, DCT:
    note: Dual Coding Theory, DCT
    abbr: DCod
    name: Dual Coding Theory
    zh: 雙碼理論
    field: 認知心理
    desc: Paivio（1971、1986）提出：認知由語文系統（logogens）與非語文意象系統（imagens）組成，兩者可透過參照連結互相啟動；訊息同時以語文與影像編碼時，記憶路徑加倍，故圖優效應與具體詞較易記住。
    edges:
    - [Verbal Presentation, Verbal Encoding, +]
    - [Pictorial Presentation, Mental Imagery, +]
    - [Concreteness, Mental Imagery, +]
    - [Mental Imagery, Verbal Encoding, +]
    - [Verbal Encoding, Mental Imagery, +]
    - [Verbal Encoding, Recall, +]
    - [Mental Imagery, Recall, +]
    - [Pictorial Presentation, Recall, +]
    refs:
    - {title: Dual-coding theory - Wikipedia, url: 'https://en.wikipedia.org/wiki/Dual-coding_theory'}
    - {title: Dual Coding Theory (Allan Paivio) - InstructionalDesign.org, url: 'https://www.instructionaldesign.org/theories/dual-coding/'}
    - {title: 'Clark & Paivio (1991) Dual Coding Theory and Education, Educational Psychology Review 3(3)', url: 'https://clark.faculty.uwinnipeg.ca/Clark/Publications/1991-Clark&Paivio-DCT&Educ.pdf'}
    enrich_notes: 雙向邊（Mental Imagery <-> Verbal Encoding）對應 InstructionalDesign.org 所述的參照處理（referential processing）。圖優效應與具體性效應為
      Wikipedia 明寫。Clark & Paivio 1991 的 abbr 避開既有 DCT（Dynamic Capabilities Theory），改用 DCod。
  CTML, Cognitive Theory of Multimedia Learning:
    note: CTML, Cognitive Theory of Multimedia Learning
    abbr: CTML
    name: Cognitive Theory of Multimedia Learning
    zh: 多媒體學習認知理論
    field: 教育心理
    desc: Mayer（1998、2001、2009）提出：學習者以視覺／圖像與聽覺／語文兩個容量有限的通道主動選取、組織並整合訊息；設計原則分三類——減少外在處理（連貫、訊號、冗餘、空間與時間鄰近）、管理必要處理（分段、預訓練、形式）、促進生成處理（個人化、聲音、具身）。
    edges:
    - [Multimedia Presentation, Learning Performance, +]
    - [Extraneous Material, Extraneous Load, +]
    - [Redundant On-screen Text, Extraneous Load, +]
    - [Signaling, Extraneous Load, '-']
    - [Spatial Contiguity, Extraneous Load, '-']
    - [Extraneous Load, Learning Performance, '-']
    - [Segmenting, Learning Performance, +]
    - [Pre-training, Learning Performance, +]
    - [Spoken Narration, Learning Performance, +]
    - [Conversational Style, Germane Load, +]
    - [Germane Load, Transfer of Learning, +]
    refs:
    - {title: Cognitive Theory of Multimedia Learning - Harvard CHDS tutorial (Mayer 2009 principles), url: 'https://repository.chds.hsph.harvard.edu/repository/3755/'}
    - {title: Cognitive Theory of Multimedia Learning - UBC Video Learning Hub, url: 'https://blogs.ubc.ca/videolearninghub/?p=564'}
    enrich_notes: 三類處理對應認知負荷理論的外在／內在／增生負荷，故沿用既有 Extraneous Load 與 Germane Load。多媒體原則（words + pictures 優於 words alone）為 UBC
      頁明寫；各原則分組依 Harvard 頁。保留／遷移兩種結果：主體用 Learning Performance，生成處理指向 Transfer of Learning。專家反轉效應未在所讀來源出現，未列調節。
  Construal level theory CLT:
    note: Construal level theory CLT
    abbr: ConLT
    name: Construal Level Theory
    zh: 解釋層次理論
    field: 社會心理
    desc: Trope 與 Liberman（1998、2010）提出：時間、空間、社會與假設性四種心理距離越遠，心智表徵越抽象（高層次解釋）；高層次解釋使人重視可欲性而非可行性、較願冒險、較能自我調節，訊息抽象度與距離相符時說服力較高。
    edges:
    - [Temporal Distance, Psychological Distance, +]
    - [Spatial Distance, Psychological Distance, +]
    - [Social Distance, Psychological Distance, +]
    - [Hypothetical Distance, Psychological Distance, +]
    - [Psychological Distance, Construal Level, +]
    - [Construal Level, Psychological Distance, +]
    - [Construal Level, Desirability Weighting, +]
    - [Construal Level, Feasibility Weighting, '-']
    - [Construal Level, Self-Regulation, +]
    - [Construal Level, Risk Seeking, +]
    - [Construal Level, Stereotyping, +]
    - [Construal Level, Message Abstractness -> Attitude, m]
    refs:
    - {title: Construal level theory - Wikipedia, url: 'https://en.wikipedia.org/wiki/Construal_level_theory'}
    - {title: 'Trope & Liberman (2010) Construal-Level Theory of Psychological Distance, Psychological Review 117(2) (PMC)',
      url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC3152826/'}
    enrich_notes: 距離與解釋層次互為因果是 Trope & Liberman 2010 明寫的雙向關係。可欲性／可行性權重、自我控制（Fujita & Roberts 2010）、冒險（距離遠較願冒險）、刻板化（社會距離）皆為
      Wikipedia 條目所列實證。abbr 避開既有 CLT（Cognitive Load Theory）。
  Regulatory Focus Theory:
    abbr: RFT
    name: Regulatory Focus Theory
    zh: 調節焦點理論
    field: 社會心理
    desc: Higgins（1997）提出：自我調節分為追求理想與獲益的促進焦點，以及守住義務與避免損失的預防焦點；前者偏好熱切策略、後者偏好警戒策略。Higgins（2000）進一步主張策略與焦點相符（調節適配）時會「感覺對了」，提高投入、價值感與說服效果。
    edges:
    - [Ideal Self-Guide, Promotion Focus, +]
    - [Ought Self-Guide, Prevention Focus, +]
    - [Gain Framing, Promotion Focus, +]
    - [Loss Framing, Prevention Focus, +]
    - [Promotion Focus, Eagerness Strategy, +]
    - [Prevention Focus, Vigilance Strategy, +]
    - [Promotion Focus, Risk Seeking, +]
    - [Regulatory Fit, Value, +]
    - [Regulatory Fit, Motivation, +]
    - [Regulatory Fit, Attitude, +]
    - [Promotion Focus, Gain Framing -> Attitude, m]
    - [Prevention Focus, Loss Framing -> Attitude, m]
    refs:
    - {title: Regulatory focus theory - Wikipedia, url: 'https://en.wikipedia.org/wiki/Regulatory_focus_theory'}
    - {title: Regulatory Focus Theory - The Decision Lab, url: 'https://thedecisionlab.com/reference-guide/management/regulatory-focus-theory'}
    - {title: 'Higgins, Shah & Friedman (1997) regulatory focus strength paper (Columbia PDF)', url: 'https://www.columbia.edu/cu/psychology/higgins/papers/higgins+%201997%20rfocus%20strength.pdf'}
    enrich_notes: 理想／應該自我引導與熱切／警戒策略取自搜尋到的 Self-Guide Strength Measure 與 Higgins 1997 摘要；調節適配提升投入、價值轉移與說服（grape juice 廣告）為
      Wikipedia 與 Decision Lab 明寫。Promotion -> Risk Seeking 是常見實證版本（促進焦點的風險偏誤），Decision Lab 僅間接提及。情緒結果（cheerfulness/dejection
      vs quiescence/agitation）來源未詳述，未入邊。
  Self-Perception Theory:
    abbr: SelfPT
    name: Self-Perception Theory
    zh: 自我知覺理論
    field: 社會心理
    desc: Bem（1967、1972）提出：人像旁觀者一樣，從自己的行為與情境推論自己的態度；當內在線索微弱或模糊、且缺乏外在誘因可解釋行為時，推論最強。可解釋得寸進尺效應與過度辯護效應，並與認知失調理論分工（Fazio et al.
      1977）。
    edges:
    - [Behavior, Attitude, +]
    - [Attitude Strength, Behavior -> Attitude, m]
    - [Insufficient Justification, Behavior -> Attitude, m]
    - [Initial Compliance, Self-Concept, +]
    - [Self-Concept, Behavioral Intention, +]
    - [Controlling Rewards, Intrinsic Motivation, '-']
    - [Behavior, Emotions, +]
    refs:
    - {title: Self-perception theory - Wikipedia, url: 'https://en.wikipedia.org/wiki/Self-perception_theory'}
    - {title: Daryl Bem - Wikipedia (1967 Psychological Review; 1972 Advances in Experimental Social Psychology), url: 'https://en.wikipedia.org/wiki/Daryl_Bem'}
    enrich_notes: 核心邊 Behavior -> Attitude 為理論主張；Attitude Strength 調節（既有態度弱才適用，Chaiken & Baldwin 1981）、外在誘因不足時推論較強（Bem 的 1
      元／20 元觀察者研究）皆 Wikipedia 明寫。得寸進尺拆成 Initial Compliance -> Self-Concept -> Behavioral Intention。過度辯護效應（Controlling Rewards
      -> Intrinsic Motivation）Wikipedia 僅列為相關主題，屬常見延伸。Behavior -> Emotions 來自 Laird 1974 臉部表情研究。
  Appraisal Theory of Emotion:
    abbr: AppT
    name: Appraisal Theory of Emotion
    zh: 情緒評估理論
    field: 情緒心理
    desc: Arnold（1960）、Lazarus（1991）與 Scherer（1984、2009）提出：情緒是對事件評估的結果——初級評估判斷目標相關與一致性，次級評估判斷責任歸屬與因應潛能；Scherer 再拆成相關、意涵、因應潛能、規範意義四組檢核，不同評估組合產生不同情緒與行動傾向。
    edges:
    - [Goal Relevance, Arousal, +]
    - [Novelty, Arousal, +]
    - [Goal Congruence, Valence, +]
    - [Responsibility Attribution, Anger, +]
    - [Coping Potential, Anxiety, '-']
    - [Norm Compatibility, Negative Emotional Arousal, '-']
    - [Reappraisal, Negative Emotional Arousal, '-']
    - [Anxiety, Avoidance Behavior, +]
    - [Valence, Approach Behavior, +]
    refs:
    - {title: Appraisal theory - Wikipedia, url: 'https://en.wikipedia.org/wiki/Appraisal_theory'}
    - {title: 'Scherer (2009) The dynamic architecture of emotion: Evidence for the component process model, Cognition and
        Emotion 23(7)', url: 'https://archive-ouverte.unige.ch/unige:97810'}
    enrich_notes: Wikipedia 明寫：目標相關度越高情緒越強；目標不一致且他人可歸責產生憤怒、無人可歸責偏向焦慮；再評估可改變情緒（Verduyn et al. 2011）。Scherer 四組檢核（relevance／implication／coping
      potential／normative significance）取自 2009 論文摘要與搜尋結果；Novelty 屬 relevance 檢核。情緒 -> 行動傾向兩條依理論的「情緒帶有行動準備」主張。
  Broaden-and-Build Theory:
    abbr: BBT
    name: Broaden-and-Build Theory
    zh: 擴展與建構理論
    field: 情緒心理
    desc: Fredrickson（1998、2001）提出：正向情緒（喜悅、興趣、滿足、驕傲、愛）會擴展當下的思考與行動範圍，進而累積身體、智識、社會與心理等長期資源；資源提升幸福感與韌性，形成向上螺旋，並能「抵銷」負向情緒殘留的生理影響。
    edges:
    - [Positive Emotions, Attentional Breadth, +]
    - [Positive Emotions, Creativity, +]
    - [Positive Emotions, Approach Behavior, +]
    - [Attentional Breadth, Personal Resources, +]
    - [Positive Emotions, Social Capital, +]
    - [Personal Resources, Well-being, +]
    - [Personal Resources, Resilience, +]
    - [Positive Emotions, Negative Emotional Arousal, '-']
    - [Well-being, Positive Emotions, +]
    - [Resilience, Positive Emotions, +]
    refs:
    - {title: Broaden-and-build - Wikipedia, url: 'https://en.wikipedia.org/wiki/Broaden-and-build'}
    - {title: 'Fredrickson (2001) The Role of Positive Emotions in Positive Psychology: The Broaden-and-Build Theory, American
        Psychologist 56(3) (PMC)', url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC3122271/'}
    enrich_notes: 擴展（行動清單實驗）、建構（九週慈心禪研究）、抵銷（2000 年心血管恢復研究）、向上螺旋皆兩來源明寫。回饋邊（Well-being -> Positive Emotions、Resilience -> Positive
      Emotions）即向上螺旋，形成循環。Gable & Harmon-Jones（2010）指出部分正向情緒反而窄化注意，Roth et al.（2024）發現擴展中介不成立，屬反面證據，未改方向但應在使用時注意。
  Affect Infusion Model:
    abbr: AIM
    name: Affect Infusion Model
    zh: 情感滲入模型
    field: 社會心理
    desc: Forgas（1995）提出：心情是否滲入判斷取決於處理策略——直接存取與動機式處理幾乎不受影響，捷思式處理把心情當作訊息（Schwarz & Clore 1983），實質式處理因心情啟動一致聯想而受影響最深；任務越複雜、不熟悉且個人相關，越走實質式處理。
    edges:
    - [Affect, Attitude, +]
    - [Systematic Processing, Affect -> Attitude, m]
    - [Heuristic Processing, Affect -> Attitude, m]
    - [Motivated Processing, Affect -> Attitude, m]
    - [Direct Access Processing, Affect -> Attitude, m]
    - [Task Complexity, Systematic Processing, +]
    - [Involvement, Systematic Processing, +]
    - [Information Processing Ability, Systematic Processing, +]
    - [Accuracy Motivation, Systematic Processing, +]
    - [Experience, Direct Access Processing, +]
    - [Affect, Systematic Processing, '-']
    refs:
    - {title: Affect infusion model - Wikipedia, url: 'https://en.wikipedia.org/wiki/Affect_infusion_model'}
    - {title: 'Faul & LaBar (2022) Mood-congruent memory revisited, Psychological Review 130(6) (PMC) - section on the AIM',
      url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC10076454/'}
    enrich_notes: 核心邊 Affect -> Attitude 代表心情一致判斷（mood-congruent judgment）；四種策略全部設為調節：實質式與捷思式放大、動機式與直接存取抑制（Faul & LaBar 2022
      明寫 direct access／motivated 下不太可能有偏誤）。策略決定因素（熟悉度、重要性、複雜度、認知能力、正確動機）取自 Wikipedia。Affect -> Systematic Processing 為負：Wikipedia
      寫正向心情偏捷思、負向心情偏實質。Systematic Processing 沿用既有變數對應 substantive processing。
  Transactional Model of Stress and Coping:
    abbr: TMSC
    name: Transactional Model of Stress and Coping
    zh: 壓力與因應的交互作用模型
    field: 健康心理
    desc: Lazarus 與 Folkman（1984）提出：壓力不是事件本身，而是個人與環境交互的結果——初級評估判斷事件是否構成傷害、威脅或挑戰，次級評估判斷自身因應資源是否足夠；需求超過資源即感受壓力，接著以問題焦點或情緒焦點因應，結果再回饋為重新評估。
    edges:
    - [Stressor, Perceived Threat, +]
    - [Perceived Threat, Perceived Stress, +]
    - [Challenge Appraisal, Perceived Stress, '-']
    - [Stress Coping Ability, Perceived Stress, '-']
    - [Social Support, Stress Coping Ability, +]
    - [Self-Efficacy, Stress Coping Ability, +]
    - [Perceived Stress, Problem-Focused Coping, +]
    - [Perceived Stress, Emotion-Focused Coping, +]
    - [Stress Coping Ability, Problem-Focused Coping, +]
    - [Problem-Focused Coping, Well-being, +]
    - [Emotion-Focused Coping, Negative Emotional Arousal, '-']
    - [Perceived Stress, Well-being, '-']
    - [Problem-Focused Coping, Perceived Threat, '-']
    refs:
    - {title: Transactional Model of Stress and Coping - AURA Lab (SIUE) theory page, url: 'https://aura-lab.siue.edu/theories/transactional-model-of-stress-and-coping/'}
    - {title: 'Richard Lazarus - Wikipedia (cognitive-mediational theory; Stress, Appraisal, and Coping 1984)', url: 'https://en.wikipedia.org/wiki/Richard_Lazarus'}
    enrich_notes: Stressor -> 初級評估 -> 次級評估 -> 壓力 -> 因應 -> 結果 -> 重新評估的迴路為 AURA Lab 頁明寫；Problem-Focused Coping -> Perceived
      Threat 的負向邊即重新評估回饋。社會支持作為因應資源（強化次級評估）為該頁所述；Self-Efficacy -> Stress Coping Ability 是常見實證版本。Stress Coping Ability 沿用既有變數代表次級評估的因應資源。Springer
      百科條目需登入，未能開啟。
  Strength Model of Self-Control:
    abbr: SMSC
    name: Strength Model of Self-Control
    zh: 自我控制強度模型（自我耗損）
    field: 社會心理
    desc: Baumeister 等（1998）提出、Baumeister、Vohs 與 Tice（2007）總結：自我控制像肌肉一樣消耗有限資源，先前的自我控制造成自我耗損，使後續無關作業的自我控制、堅持與利社會行為下降；動機與正向情緒可暫時抵銷。2016
      與 2021 年的多實驗室預註冊重複皆未發現效果。
    edges:
    - [Prior Self-Control Exertion, Ego Depletion, +]
    - [Ego Depletion, Self-Regulation, '-']
    - [Ego Depletion, Persistence, '-']
    - [Ego Depletion, Impulsive Choice, +]
    - [Ego Depletion, Helping Behavior, '-']
    - [Positive Emotions, Ego Depletion, '-']
    - [Motivation, Ego Depletion -> Self-Regulation, m]
    - [Belief in Unlimited Willpower, Ego Depletion -> Self-Regulation, m]
    refs:
    - {title: Ego depletion - Wikipedia, url: 'https://en.wikipedia.org/wiki/Ego_depletion'}
    - {title: 'Baumeister, Vohs & Tice (2007) The Strength Model of Self-Control, Current Directions in Psychological Science
        16(6)', url: 'https://www.psychologicalscience.org/journals/current-directions/j.1467-8721.2007.00534.x/'}
    enrich_notes: 主效果與五個結果（自我調節、堅持、衝動消費、利社會行為）皆 Wikipedia 明寫；動機／框架可暫時阻斷耗損為 2007 摘要明寫；正向情緒恢復（Tice et al. 2007）與意志力信念（Vohs et
      al. 2012）取自 Wikipedia。葡萄糖機制爭議大，未入邊。重要：Hagger et al. 2016 與 Vohs et al. 2021 多實驗室重複皆為零效果（d≈0.06），使用此模型時應在限制中交代。
  Need for Cognitive Closure:
    note: Need for Cognitive Closure
    abbr: NFCC
    name: Need for Cognitive Closure
    zh: 認知閉合需求
    field: 社會心理
    desc: Kruglanski 與 Webster（1994、1996）提出：認知閉合需求是對明確答案的渴望與對模糊的厭惡，既是穩定特質也可由情境（時間壓力、噪音、疲勞）喚起；透過急迫傾向（抓住）與持久傾向（凍結）縮短資訊搜尋，導致初始效應、刻板化、抗拒說服與創造力下降。
    edges:
    - [Time Pressure, Need for Cognitive Closure, +]
    - [Cognitive Load, Need for Cognitive Closure, +]
    - [Need for Cognitive Closure, Information Search Extent, '-']
    - [Need for Cognitive Closure, Heuristic Processing, +]
    - [Need for Cognitive Closure, Systematic Processing, '-']
    - [Need for Cognitive Closure, Primacy Effect, +]
    - [Need for Cognitive Closure, Stereotyping, +]
    - [Need for Cognitive Closure, Attitude Resistance, +]
    - [Need for Cognitive Closure, Creativity, '-']
    refs:
    - {title: Closure (psychology) - Wikipedia, url: 'https://en.wikipedia.org/wiki/Closure_(psychology)'}
    - {title: 'Kruglanski & Webster (1996) Motivated closing of the mind: Seizing and freezing, Psychological Review 103(2)
        - abstract page (UMD)', url: 'https://terpconnect.umd.edu/~hannahk/NFC-KW96.html'}
    enrich_notes: 結果邊（資訊搜尋縮減、依賴捷思、初始效應與同化、刻板化、抗說服、創造力低）為 Wikipedia 明寫；1996 摘要確認急迫／持久兩傾向與特質＋狀態雙重性質。情境前因（時間壓力、噪音、疲勞）在所讀兩頁未列細節，屬原論文的常見描述，此處以
      Time Pressure 與 Cognitive Load 代表。
  Information Processing Theory, IPT:
    note: Information Processing Theory, IPT
    abbr: IPT
    name: Information Processing Theory
    zh: 訊息處理理論
    field: 認知心理
    desc: Atkinson 與 Shiffrin（1968）與 Miller（1956）為核心：訊息依序經過感官登錄、短期（工作）記憶與長期記憶三個儲存庫，注意決定進入短期記憶、複誦與編碼決定轉入長期記憶、組塊擴大有限容量，執行控制調度整個流程。
    edges:
    - [Attention, Encoding, +]
    - [Cognitive Load, Attention, '-']
    - [Executive Control, Attention, +]
    - [Chunking, Working Memory Capacity, +]
    - [Working Memory Capacity, Encoding, +]
    - [Rehearsal, Retention, +]
    - [Encoding, Retention, +]
    - [Retention, Recall, +]
    - [Retrieval Cues, Recall, +]
    refs:
    - {title: Information processing theory - Wikipedia, url: 'https://en.wikipedia.org/wiki/Information_processing_theory'}
    - {title: 'The Atkinson-Shiffrin Model - Psychology: An Introduction (psywww.com, Chapter 06 Memory)', url: 'https://psywww.com/intropsych/ch06-memory/atkinson-shiffrin-model.html'}
    enrich_notes: 注意 -> 編碼、複誦 -> 保留、組塊 -> 容量、執行控制調度注意四條為 Wikipedia 明寫（該頁註明屬隱含而非正式因果陳述）。psywww 頁補充感官登錄時長與 Sperling 部分報告實驗。Craik
      & Lockhart 處理深度在所讀來源未出現，未入邊。Cognitive Load -> Attention 為常見實證版本。
  T IMT Impression Management Theory:
    note: T IMT Impression Management Theory
    abbr: IMT
    name: Impression Management Theory
    zh: 印象管理理論
    field: 社會心理
    desc: Goffman（1959）奠基、Leary 與 Kowalski（1990）提出兩成分模型：印象動機取決於印象與目標的相關性、結果的價值、以及現有與期望形象的落差；印象建構由自我概念、期望身分、角色限制、對象價值觀與現有社會形象決定，進而影響觀眾的喜好。
    edges:
    - [Goal Relevance of Impressions, Impression Motivation, +]
    - [Value of Desired Outcomes, Impression Motivation, +]
    - [Image Discrepancy, Impression Motivation, +]
    - [Mere Presence of Others, Impression Motivation, +]
    - [Self-Efficacy, Impression Motivation, +]
    - [Impression Motivation, Self-Presentation Behavior, +]
    - [Self-Concept, Self-Presentation Behavior, +]
    - [Role Expectations, Self-Presentation Behavior, +]
    - [Target Values, Self-Presentation Behavior, +]
    - [Self-Presentation Behavior, Interpersonal Attraction, +]
    - [Perceived Authenticity, Self-Presentation Behavior -> Interpersonal Attraction, m]
    refs:
    - {title: Impression management - Wikipedia, url: 'https://en.wikipedia.org/wiki/Impression_management'}
    - {title: 'Leary & Kowalski (1990) Impression management: A literature review and two-component model, Psychological Bulletin
        107(1) - Duke Scholars record', url: 'https://scholars.duke.edu/display/pub676864'}
    enrich_notes: 印象動機三因素與印象建構五因素取自 Leary & Kowalski 1990 摘要；被觀察（Mere Presence of Others）與自我效能提升動機、以及討好若被歸因為印象管理則評價轉負（故 Perceived
      Authenticity 為調節）取自 Wikipedia。Jones & Pittman（1982）五種策略與人資評等結果在所讀來源未出現，未入邊。
  CFT, Cognitive Fit Theory:
    note: CFT, Cognitive Fit Theory
    abbr: CFT
    name: Cognitive Fit Theory
    zh: 認知適配理論
    field: 資訊系統
    desc: Vessey（1991）提出：問題表徵（如圖形或表格）與任務（空間型或符號型）各自強調的訊息共同形成心智表徵；兩者處理歷程一致即為認知適配，使用者不必再轉換表徵就能取得所需訊息，決策因此更準確、更快。
    edges:
    - [Problem Representation, Mental Representation, +]
    - [Task Characteristics, Mental Representation, +]
    - [Problem Representation, Cognitive Fit, +]
    - [Task Characteristics, Problem Representation -> Cognitive Fit, m]
    - [Cognitive Fit, Mental Representation, +]
    - [Mental Representation, Decision Accuracy, +]
    - [Cognitive Fit, Decision Accuracy, +]
    - [Cognitive Fit, Decision Time, '-']
    refs:
    - {title: Cognitive fit theory - IS Theories wiki (theorizeit.org), url: 'https://is.theorizeit.org/wiki/Cognitive_fit_theory'}
    - {title: 'Vessey & Galletta (1991) Cognitive Fit: An Empirical Study of Information Acquisition, Information Systems
        Research 2(1)', url: 'https://ideas.repec.org/a/inm/orisre/v2y1991i1p63-84.html'}
    enrich_notes: theorizeit 頁明寫：表徵與任務相符 -> 一致的心智表徵 -> 不需轉換 -> 有效且有效率的解題。Vessey & Galletta 1991 發現符號型任務配合相符表徵時表現大幅提升、問題表徵對心智表徵的影響大於任務理解，故
      Problem Representation -> Mental Representation。任務型態（空間／符號）決定何種表徵適配，設為調節。Decision Time 為新變數，對應效率。
  Psychological Ownership Theory:
    abbr: POT
    name: Psychological Ownership Theory
    zh: 心理所有權理論
    field: 組織行為
    desc: Pierce、Kostova 與 Dirks（2001、2003）提出：心理所有權是把對象視為「我的」並納入延伸自我的狀態，根源於效能感、自我認同與歸屬之所三種動機，經由控制、深入了解、投入自我三條路徑形成；可帶來責任感與公民行為，也可能造成不願分享與抗拒改變。
    edges:
    - [Control, Psychological Ownership, +]
    - [Intimate Knowledge of Target, Psychological Ownership, +]
    - [Self-Investment, Psychological Ownership, +]
    - [Autonomy, Control, +]
    - [Psychological Ownership, Felt Obligation, +]
    - [Psychological Ownership, Organizational Citizenship Behavior, +]
    - [Psychological Ownership, Knowledge Sharing, '-']
    - [Psychological Ownership, User Resistance, +]
    refs:
    - {title: 'Pierce, Dirks & Kostova - Towards a Theory of Psychological Ownership in Organizations (UMN Conservancy working
        paper)', url: 'https://conservancy.umn.edu/server/api/core/bitstreams/338282fe-f840-443c-85bf-a4ad03125a2b/content'}
    - {title: 'Pierce, Kostova & Dirks (2003) The State of Psychological Ownership: Integrating and Extending a Century of
        Research, Review of General Psychology 7(1)', url: 'https://experts.umn.edu/en/publications/the-state-of-psychological-ownership-integrating-and-extending-a-/'}
    enrich_notes: 三條路徑（P5–P7）與自主、參與決策提高控制為工作論文明寫。結果面在工作論文只屬推測（願意犧牲、承擔責任 vs 不願分享資訊與決策權），2003 年回顧確認有正負兩類結果但摘要頁未列細項；OCB 與抗拒改變（Dirks,
      Cummings & Pierce 1996）為常見實證版本。Felt Obligation 沿用既有變數代表責任感。
  Optimal Distinctiveness Theory:
    abbr: ODT
    name: Optimal Distinctiveness Theory
    zh: 最適獨特性理論
    field: 社會心理
    desc: Brewer（1991）提出：人同時有融入群體的同化需求與有別於他人的區辨需求，兩者互相消長；群體越包容越能滿足歸屬但越不獨特，人會對同時提供歸屬感與獨特感的群體產生最強的認同與忠誠，過度去個人化或過度孤立都會促使人調整認同層級。
    edges:
    - [Group Inclusiveness, Perceived Belonging, +]
    - [Group Inclusiveness, Perceived Group Distinctiveness, '-']
    - [Perceived Belonging, Identification, +]
    - [Perceived Group Distinctiveness, Identification, +]
    - [Need for Assimilation, Perceived Belonging -> Identification, m]
    - [Need for Differentiation, Perceived Group Distinctiveness -> Identification, m]
    - [Depersonalization, Need for Differentiation, +]
    - [Perceived Self-Uniqueness, Need for Assimilation, +]
    - [Identification, Self-Esteem, +]
    refs:
    - {title: Optimal distinctiveness theory - Wikipedia, url: 'https://en.wikipedia.org/wiki/Optimal_distinctiveness_theory'}
    - {title: 4.5 Optimal Distinctiveness Theory - Social Theory (bookdown), url: 'https://bookdown.org/mike/social-theory/optimal-distinctiveness-theory.html'}
    - {title: 'Brewer (1991) The Social Self: On Being the Same and Different at the Same Time, PSPB 17(5) - record', url: 'https://citedrive.com/en/discovery/the-social-self-on-being-the-same-and-different-at-the-same-time/'}
    enrich_notes: A1（認同在能化解兩需求衝突的包容層級最強）、A3（獨特性依參照框架而定）、A4（最適點依兩需求相對強度）為 Wikipedia 與 bookdown 明寫；「一方過強另一方反彈」的平衡機制轉成 Depersonalization
      -> Need for Differentiation 與 Perceived Self-Uniqueness -> Need for Assimilation 兩條。原理論的倒 U 型關係以兩條反向邊加兩個調節近似。Identification
      -> Self-Esteem 取自 Brewer 認為自尊可直接來自社會認同。
  Learned Helplessness Theory:
    abbr: LHT
    name: Learned Helplessness Theory
    zh: 習得無助理論
    field: 情緒心理
    desc: Seligman 與 Maier（1967）提出、Abramson 等（1978）以歸因重構：反覆遭遇無法控制的負向事件使人預期未來也無法控制，導致被動、學習變差與憂鬱；內在、穩定、全面的歸因風格放大此效應。Maier 與
      Seligman（2016）改寫為：被動是預設反應，控制感才是學來的。
    edges:
    - [Uncontrollable Aversive Events, Perceived Uncontrollability, +]
    - [Perceived Uncontrollability, Expectation of Uncontrollability, +]
    - [Pessimistic Attributional Style, Perceived Uncontrollability -> Expectation of Uncontrollability, m]
    - [Expectation of Uncontrollability, Persistence, '-']
    - [Expectation of Uncontrollability, Motivation, '-']
    - [Expectation of Uncontrollability, Learning Performance, '-']
    - [Expectation of Uncontrollability, Depression, +]
    - [Expectation of Uncontrollability, Self-Esteem, '-']
    - [Prior Experience of Control, Expectation of Uncontrollability, '-']
    refs:
    - {title: Learned helplessness - Wikipedia, url: 'https://en.wikipedia.org/wiki/Learned_helplessness'}
    - {title: 'Maier & Seligman (2016) Learned Helplessness at Fifty: Insights from Neuroscience, Psychological Review 123(4)
        (PMC)', url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC4920136/'}
    enrich_notes: 原始鏈（偵測不可控 -> 預期不可控 -> 被動）為兩來源明寫；歸因風格（內在、穩定、全面）調節取自 Abramson et al. 1978。Prior Experience of Control 的負向邊對應
      Wikipedia 的「免疫」效果與 2016 年「控制感是學來的」主張。Self-Esteem 下降對應內在歸因的結果（1978 重構），Wikipedia 以自尊建立作為介入提及。2016 年版本主張原理論「方向反了」，使用時應說明採用哪一版。
  Anchoring and Adjustment Heuristic:
    abbr: Anchor
    name: Anchoring and Adjustment Heuristic
    zh: 錨定與調整捷思
    field: 認知捷思／判斷與決策
    desc: Tversky 與 Kahneman（1974）提出：人估計數值時從起始值（錨點）出發再調整，但調整通常不足，估計值因此偏向錨點；選擇可及性模型（Strack & Mussweiler, 1997）補充錨點會讓一致的資訊更容易被提取。
    edges:
    - [Anchor Value, Numerical Estimate, +]
    - [Anchor Value, Anchor-Consistent Information Accessibility, +]
    - [Anchor-Consistent Information Accessibility, Numerical Estimate, +]
    - [Anchor Value, Willingness to Pay, +]
    - [Anchor Value, Final Agreement Price, +]
    - [Cognitive Load, Anchor Value -> Numerical Estimate, m]
    - [Time Pressure, Anchor Value -> Numerical Estimate, m]
    - [Domain Expertise, Anchor Value -> Numerical Estimate, m]
    - [Positive Mood, Anchor Value -> Numerical Estimate, m]
    - [Forewarning, Anchor Value -> Numerical Estimate, m]
    refs:
    - {title: Anchoring effect (Wikipedia), url: 'https://en.wikipedia.org/wiki/Anchoring_effect'}
    - {title: Anchoring Bias & Adjustment Heuristic (Simply Psychology), url: 'https://www.simplypsychology.org/what-is-the-anchoring-bias.html'}
    enrich_notes: 主效果（錨點愈高估計愈高）與選擇可及性中介為來源明寫；Final Agreement Price 對應談判首次出價研究（Galinsky & Mussweiler）。調節方向：認知負荷、時間壓力使調整更不足（加強）；專業經驗略減弱但專家仍受影響；心情方向文獻不一致（早期說悲傷減弱、近期說悲傷加強），只標
      m；預警與金錢誘因幾乎無法消除效果。
  Availability Heuristic:
    abbr: Avail
    name: Availability Heuristic
    zh: 可得性捷思
    field: 認知捷思／判斷與決策
    desc: Tversky 與 Kahneman（1973）提出：人以「實例多容易想起來」來判斷事件的頻率或機率，因此生動、近期、媒體大量報導的事件會被高估；Schwarz 等人（1991）進一步區分提取的容易度與提取的內容兩種訊息來源。
    edges:
    - [Media Agenda Salience, Ease of Recall, +]
    - [Instance Vividness, Ease of Recall, +]
    - [Experience, Ease of Recall, +]
    - [Time Since Exposure, Ease of Recall, '-']
    - [Ease of Recall, Perceived Frequency, +]
    - [Perceived Frequency, Perceived Risk, +]
    - [Perceived Risk, Avoidance Behavior, +]
    - [Involvement, Ease of Recall -> Perceived Frequency, m]
    - [Topic Knowledge, Ease of Recall -> Perceived Frequency, m]
    refs:
    - {title: Availability heuristic (Wikipedia), url: 'https://en.wikipedia.org/wiki/Availability_heuristic'}
    - {title: 'The Availability Heuristic Revisited: Ease of Recall and Content of Recall (Cambridge, Heuristics and Biases
        chapter abstract)', url: 'https://www.cambridge.org/core/books/abs/heuristics-and-biases/availability-heuristic-revisited-ease-of-recall-and-content-of-recall-as-distinct-sources-of-information/326E492EBDC9BBA38F159B297B550443'}
    enrich_notes: 前因（媒體報導量、生動性、親身經驗、時間間隔）與主效果為來源明寫；Media Agenda Salience 沿用既有變數代表媒體報導量。Schwarz 的條件：處理動機低、且不質疑容易度的資訊價值時才依賴容易度，故以
      Involvement 與 Topic Knowledge 作減弱調節。Perceived Risk -> Avoidance Behavior 是常見實證延伸（風險知覺後果），非原始論文。
  Representativeness Heuristic:
    abbr: Repr
    name: Representativeness Heuristic
    zh: 代表性捷思
    field: 認知捷思／判斷與決策
    desc: Kahneman 與 Tversky（1972）提出：人以「個案與類別原型有多相似」來判斷它屬於該類別的機率，因而忽略基本率與樣本大小，產生基本率忽略、連言謬誤與刻板印象判斷。
    edges:
    - [Similarity to Prototype, Perceived Probability, +]
    - [Statistical Information, Perceived Probability, +]
    - [Similarity to Prototype, Statistical Information -> Perceived Probability, m]
    - [Similarity to Prototype, Social Categorization, +]
    - [Similarity to Prototype, Decision Error, +]
    - [Statistical Literacy, Similarity to Prototype -> Perceived Probability, m]
    - [Cognitive Load, Similarity to Prototype -> Perceived Probability, m]
    - [Base Rate Causal Relevance, Statistical Information -> Perceived Probability, m]
    refs:
    - {title: Representativeness heuristic (Wikipedia), url: 'https://en.wikipedia.org/wiki/Representativeness_heuristic'}
    - {title: Representativeness Heuristic (The Decision Lab), url: 'https://thedecisionlab.com/biases/representativeness-heuristic'}
    enrich_notes: Statistical Information 沿用既有變數代表基本率資訊；其對機率判斷的效果在理論上應為正，但實證上被相似度壓過（基本率忽略），故以 Similarity to Prototype 作減弱調節。統計訓練、基本率具因果關聯時會提高基本率使用，為來源明寫；認知負荷加強捷思依賴屬常見實證版本。
  Endowment Effect:
    abbr: Endow
    name: Endowment Effect
    zh: 稟賦效應
    field: 行為經濟學
    desc: Thaler（1980）命名、Kahneman、Knetsch 與 Thaler（1990）以馬克杯實驗驗證：人一旦擁有某物就給它更高價值，願意接受的賣價遠高於願意支付的買價，交易量低於 Coase 定理預測；以損失趨避與參考點依賴解釋。
    edges:
    - [Ownership, Reference Point, +]
    - [Ownership, Psychological Ownership, +]
    - [Ownership, Willingness to Accept, +]
    - [Psychological Ownership, Willingness to Accept, +]
    - [Loss Aversion, Willingness to Accept, +]
    - [Willingness to Accept, Trading Volume, '-']
    - [Ownership, Status Quo Continuation, +]
    - [Ownership Duration, Ownership -> Willingness to Accept, m]
    - [Emotional Attachment, Ownership -> Willingness to Accept, m]
    - [Experience, Ownership -> Willingness to Accept, m]
    - [Substitutability, Ownership -> Willingness to Accept, m]
    refs:
    - {title: Endowment effect (Wikipedia), url: 'https://en.wikipedia.org/wiki/Endowment_effect'}
    - {title: Endowment Effect (The Decision Lab), url: 'https://thedecisionlab.com/biases/endowment-effect'}
    enrich_notes: WTA>WTP 與交易量不足為原始論文明寫；心理擁有感路徑是後續解釋。Experience 代表市場經驗：List（2003）等交易員研究顯示減弱，但 Wikipedia 引用的狩獵採集社會研究顯示有市場接觸者效果反而較強，方向有爭議，只標
      m。可替代品、極短暫擁有、瑣碎物品時效果變弱。
  Mental Accounting:
    abbr: MentAcc
    name: Mental Accounting
    zh: 心理帳戶
    field: 行為經濟學
    desc: Thaler（1985, 1999）提出：人把金錢依來源與用途分到不同的心理帳戶各自記帳，違反金錢可替代性；購買的總效用等於取得效用加上交易效用（相對參考價的划算感），付款與消費脫鉤會降低付錢的痛感。
    edges:
    - [Price, Acquisition Utility, '-']
    - [Acquisition Utility, Purchase Intention, +]
    - [Price Difference from Reference, Transaction Utility, '-']
    - [Transaction Utility, Purchase Intention, +]
    - [Budget Category Depletion, Purchase Intention, '-']
    - [Payment Decoupling, Pain of Paying, '-']
    - [Pain of Paying, Discretionary Spending, '-']
    - [Windfall Income, Discretionary Spending, +]
    - [Prior Investment, Persistence, +]
    refs:
    - {title: Mental accounting (Wikipedia), url: 'https://en.wikipedia.org/wiki/Mental_accounting'}
    - {title: Thaler (1985) Mental Accounting and Consumer Choice (Fermat's Library), url: 'https://fermatslibrary.com/s/mental-accounting-and-consumer-choice'}
    enrich_notes: 取得效用、交易效用、家庭預算為 1985 年摘要明寫；Price Difference from Reference 沿用既有變數（實付價高於參考價時交易效用為負）。付款脫鉤與信用卡、預算類別用罄停止消費為
      Wikipedia 明寫；意外之財花得較隨意（house money）與沉沒成本帳戶來自搜尋結果的二手整理，屬常見實證版本。
  Intertemporal Choice Theory:
    note: Intertemporal Choice Theory
    abbr: HypDisc
    name: Intertemporal Choice / Hyperbolic Discounting
    zh: 跨期選擇與雙曲折現
    field: 行為經濟學／時間偏好
    desc: Ainslie 以雙曲線描述延遲報酬的貶值，Laibson（1997）以準雙曲 β-δ 模型形式化：人對眼前報酬有現時偏誤，近期折現陡、遠期折現平，因此偏好會隨時間反轉，造成拖延、儲蓄不足；有自覺者會使用承諾機制自我約束。
    edges:
    - [Reward Delay, Present Value of Reward, '-']
    - [Present Bias, Reward Delay -> Present Value of Reward, m]
    - [Reward Magnitude, Reward Delay -> Present Value of Reward, m]
    - [Present Value of Reward, Behavioral Intention, +]
    - [Present Bias, Preference Reversal, +]
    - [Present Bias, Procrastination, +]
    - [Present Bias, Savings Behavior, '-']
    - [Self-Control, Procrastination, '-']
    - [Present Bias Awareness, Commitment Device Use, +]
    - [Commitment Device Use, Savings Behavior, +]
    refs:
    - {title: Hyperbolic discounting (Wikipedia), url: 'https://en.wikipedia.org/wiki/Hyperbolic_discounting'}
    - {title: 'What is hyperbolic discounting and present bias? (eco3min)', url: 'https://eco3min.fr/en/hyperbolic-discounting-present-bias/'}
    enrich_notes: 延遲降低現值、現時偏誤造成偏好反轉與儲蓄不足、老練者（sophisticated）使用承諾機制為來源明寫。Reward Magnitude 調節（金額愈大折現率愈低的 magnitude effect）為跨期選擇文獻常見發現，兩個開過的來源未直接討論。Self-Control
      為常見實證延伸。
  Choice Overload:
    abbr: ChOver
    name: Choice Overload
    zh: 選擇超載
    field: 消費者行為／判斷與決策
    desc: Iyengar 與 Lepper（2000）提出、Chernev 等（2015）統合分析確認：選項過多會提高決策困難，降低滿意度與信心、增加後悔、延遲與轉換；效果只在選項集合複雜、偏好不確定、任務困難、以省力為目標時顯著。
    edges:
    - [Assortment Size, Decision Difficulty, +]
    - [Assortment Size, Choice Freedom, +]
    - [Decision Difficulty, Choice Deferral, +]
    - [Decision Difficulty, Decision Satisfaction, '-']
    - [Decision Difficulty, Regret, +]
    - [Decision Difficulty, Switching Intention, +]
    - [Decision Difficulty, Decision Confidence, '-']
    - [Choice Set Complexity, Assortment Size -> Decision Difficulty, m]
    - [Preference Uncertainty, Assortment Size -> Decision Difficulty, m]
    - [Effort Minimization Goal, Assortment Size -> Decision Difficulty, m]
    - [Domain Expertise, Assortment Size -> Decision Difficulty, m]
    - [Time Pressure, Assortment Size -> Decision Difficulty, m]
    refs:
    - {title: 'Chernev, Böckenholt & Goodman (2015) Choice overload: A conceptual review and meta-analysis (Kellogg)', url: 'https://www.kellogg.northwestern.edu/academics-research/research/detail/2015/when-product-assortment-leads-to-choice-overload-a-conceptual/'}
    - {title: Overchoice (Wikipedia), url: 'https://en.wikipedia.org/wiki/Overchoice'}
    enrich_notes: 四個調節變數與四種結果指標（滿意／信心、後悔、延遲、轉換）為 2015 年統合分析明寫；Scheibehenne 等（2010）統合分析整體效果近零，故效果依賴調節。Assortment Size -> Choice
      Freedom 對應 Iyengar & Lepper 的「多選項更享受過程」。專業熟悉度與時間壓力為 Wikipedia 列出的前提條件。
  Default Effect and Nudge Theory:
    abbr: Default
    name: Default Effect and Nudge Theory
    zh: 預設效應與推力理論
    field: 行為經濟學／選擇架構
    desc: Johnson 與 Goldstein（2003）以器官捐贈實證、Thaler 與 Sunstein 推力理論推廣：被設為預設的選項更容易被選中，機制是省力與惰性、把預設當成隱含推薦、以預設為參考點的損失趨避；效果大小高度依賴情境與框架。
    edges:
    - [Default Status of Option, Option Choice Share, +]
    - [Default Status of Option, Reference Point, +]
    - [Default Status of Option, Implied Endorsement, +]
    - [Implied Endorsement, Option Choice Share, +]
    - [Gain Framing, Option Choice Share, +]
    - [Option Choice Share, Behavior, +]
    - [Loss Aversion, Default Status of Option -> Option Choice Share, m]
    - [Switching cost, Default Status of Option -> Option Choice Share, m]
    - [Decision Difficulty, Default Status of Option -> Option Choice Share, m]
    - [Preference Strength, Default Status of Option -> Option Choice Share, m]
    - [Trust, Default Status of Option -> Implied Endorsement, m]
    refs:
    - {title: Default effect (Wikipedia), url: 'https://en.wikipedia.org/wiki/Default_effect'}
    - {title: 'Replication of Johnson & Goldstein (2003) default effects (Meta-Psychology, Linnaeus University)', url: 'https://open.lnu.se/index.php/metapsychology/article/view/3108'}
    enrich_notes: 三個機制（省力、隱含推薦、參考點損失趨避）為 Wikipedia 明寫，故以 Switching cost、Trust、Loss Aversion 作調節。Gain Framing 來自複製研究：正向框架提高同意率且預設效果依框架而定。Option
      Choice Share -> Behavior 標示「選擇」不等於「結果」（Defaults are not a panacea），實務上連結可能很弱。Preference Strength 減弱為常見實證版本。既有的 Status
      Quo Bias Theory 處理同一現象的使用者抗拒面，本理論聚焦選擇架構。
  Sunk Cost Fallacy:
    abbr: SunkCost
    name: Sunk Cost Fallacy
    zh: 沉沒成本謬誤
    field: 行為經濟學／判斷與決策
    desc: Arkes 與 Blumer（1985）提出：人在投入金錢、時間或心力之後更傾向繼續原本的行動，並高估計畫成功的機率，主要動機是不想顯得浪費；與 Staw 的承諾升高研究相接，個人責任會放大效果。
    edges:
    - [Prior Investment, Persistence, +]
    - [Prior Investment, Waste Aversion, +]
    - [Waste Aversion, Persistence, +]
    - [Prior Investment, Expectancy, +]
    - [Expectancy, Persistence, +]
    - [Prior Investment, Escalation of Commitment, +]
    - [Escalation of Commitment, Decision Error, +]
    - [Personal Responsibility for Decision, Prior Investment -> Escalation of Commitment, m]
    - [Accountability, Prior Investment -> Escalation of Commitment, m]
    - [Cognitive Load, Prior Investment -> Persistence, m]
    - [Anxiety, Prior Investment -> Persistence, m]
    refs:
    - {title: Sunk cost (Wikipedia), url: 'https://en.wikipedia.org/wiki/Sunk_cost'}
    - {title: Arkes & Blumer (1985) The Psychology of Sunk Cost (abstract summary), url: 'https://andrewclark.super.site/all-media/the-psychology-of-sunk-cost'}
    enrich_notes: Expectancy 沿用既有變數代表成功機率的主觀估計（Arkes & Blumer 發現有沉沒成本者高估成功率）。個人責任的調節有爭議：Staw & Fox 發現自己主導的計畫投入更多，Arkes & Blumer
      本身未發現一致差異，Simonson & Nye 發現問責減弱效果，故分別標 m。焦慮與認知負荷加強效果出自 Wikipedia 引用的 Dijkstra & Hong。
  Processing Fluency Theory:
    abbr: Fluency
    name: Processing Fluency Theory
    zh: 處理流暢性理論
    field: 社會認知／說服與訊息處理
    desc: Reber、Schwarz 與 Winkielman（2004）、Alter 與 Oppenheimer（2009）整合：刺激處理得愈容易（重複、清晰、易唸、典型），人愈覺得它熟悉、喜歡、為真、有把握；流暢感是後設認知線索，察覺來源即打折。
    edges:
    - [Mere Exposure, Processing Fluency, +]
    - [Perceptual Clarity, Processing Fluency, +]
    - [Pronounceability, Processing Fluency, +]
    - [Prototypicality, Processing Fluency, +]
    - [Processing Fluency, Perceived Truth, +]
    - [Processing Fluency, Liking, +]
    - [Processing Fluency, Perceived Familiarity, +]
    - [Processing Fluency, Decision Confidence, +]
    - [Processing Fluency, Systematic Processing, '-']
    - [Fluency Source Awareness, Processing Fluency -> Perceived Truth, m]
    - [Fluency Source Awareness, Processing Fluency -> Liking, m]
    refs:
    - {title: Processing fluency (Wikipedia), url: 'https://en.wikipedia.org/wiki/Processing_fluency'}
    - {title: Processing fluency theory (In-Mind glossary), url: 'https://in-mind.org/glossary/processing-fluency-theory'}
    enrich_notes: 重複、字體清晰、押韻、易唸為前因與真實感、喜好、熟悉感、信心為後果均為 Wikipedia 明寫；高流暢導致較淺處理亦明寫。Prototypicality 為 Reber 等人美感流暢理論的前因，Wikipedia
      未列。來源察覺（misattribution／discounting）調節為流暢性文獻的標準邊界條件，兩個來源只提到誤歸因。
  Mere Exposure Effect:
    abbr: MereExp
    name: Mere Exposure Effect
    zh: 單純曝光效應
    field: 社會認知／廣告與消費者行為
    desc: Zajonc（1968）提出：單純重複接觸一個刺激就足以提高對它的好感；Bornstein（1989）統合 208 個實驗（r = .26）指出效果在短暫呈現、刺激新穎、未察覺曝光、曝光與評價之間有延遲時較強，過度曝光則出現倒
      U 型下滑。
    edges:
    - [Exposure Frequency, Liking, +]
    - [Exposure Frequency, Processing Fluency, +]
    - [Processing Fluency, Liking, +]
    - [Exposure Frequency, Perceived Familiarity, +]
    - [Exposure Frequency, Satiation, +]
    - [Satiation, Liking, '-']
    - [Liking, Brand Attitude, +]
    - [Stimulus Complexity, Exposure Frequency -> Liking, m]
    - [Exposure Duration, Exposure Frequency -> Liking, m]
    - [Time Since Exposure, Exposure Frequency -> Liking, m]
    - [Exposure Awareness, Exposure Frequency -> Liking, m]
    - [Initial Stimulus Valence, Exposure Frequency -> Liking, m]
    refs:
    - {title: Mere-exposure effect (Wikipedia), url: 'https://en.wikipedia.org/wiki/Mere-exposure_effect'}
    - {title: 'Mere exposure effect: replication status (atticusli.com)', url: 'https://atticusli.com/replication-crisis/mere-exposure-effect/'}
    enrich_notes: 倒 U 型以 Exposure Frequency -> Satiation -> Liking 兩段表示（Montoya 等 2017）。調節方向：刺激複雜者較強、呈現短暫者較強、延遲（Time Since
      Exposure 沿用既有變數）較強、察覺曝光較弱、初始負向刺激不會變喜歡甚至產生抗拒，皆為來源明寫。流暢性中介來自 Wikipedia 處理流暢性條目。Liking -> Brand Attitude 為廣告應用的常見延伸，Wikipedia
      指廣告結果不一致、對新品牌最有效。
  Halo Effect:
    note: Halo Effect
    abbr: Halo
    name: Halo Effect
    zh: 月暈效應
    field: 社會認知
    desc: Thorndike（1920）命名、Nisbett 與 Wilson（1977）實驗確認：對人、品牌或產品的整體印象會外溢到彼此無關的個別屬性評價上，外貌吸引力、溫暖、品牌聲譽是常見觸發因素，負向版本為尖角效應。
    edges:
    - [Source Attractiveness, Overall Impression, +]
    - [Perceived Warmth, Overall Impression, +]
    - [Brand Reputation, Overall Impression, +]
    - [Overall Impression, Attribute Evaluation, +]
    - [Overall Impression, Perceived Quality, +]
    - [Overall Impression, Perceived Credibility, +]
    - [Attribute Evaluation, Purchase Intention, +]
    - [Positive Mood, Overall Impression -> Attribute Evaluation, m]
    - [Diagnostic Information Availability, Overall Impression -> Attribute Evaluation, m]
    - [Domain Expertise, Overall Impression -> Attribute Evaluation, m]
    - [Structured Rating Procedure, Overall Impression -> Attribute Evaluation, m]
    refs:
    - {title: Halo effect (Wikipedia), url: 'https://en.wikipedia.org/wiki/Halo_effect'}
    - {title: Halo Effect (Simply Psychology), url: 'https://www.simplypsychology.org/halo-effect.html'}
    enrich_notes: Source Attractiveness 沿用既有變數代表外貌吸引力（Dion 等 1972）。整體印象 -> 屬性評價為核心邊；品牌聲譽外溢（iPod 到其他產品）、健康月暈、績效考核為來源明寫的應用。正向心情加強出自
      Forgas（2011）；結構化量表、多位評分者、盲評可減弱為 Simply Psychology 明寫；資訊量與專業度減弱為常見實證版本。
  Negativity Bias:
    note: Negativity Bias
    abbr: NegBias
    name: Negativity Bias
    zh: 負向偏誤
    field: 社會認知／傳播效果
    desc: Rozin 與 Royzman（2001）與 Baumeister 等（2001）整理：同等強度下負向事件比正向事件更能吸引注意、更被記住、更影響印象與決策；負向資訊被視為更具診斷性，具有負向強度、陡峭梯度、負向支配與負向分化四特徵。
    edges:
    - [Negative Information Exposure, Attention Allocation, +]
    - [Negative Information Exposure, Arousal, +]
    - [Negative Information Exposure, Recall, +]
    - [Negative Information Exposure, Perceived Diagnosticity, +]
    - [Perceived Diagnosticity, Attitude Change, +]
    - [Negative Information Exposure, Overall Impression, '-']
    - [Negative Information Exposure, Trust, '-']
    - [Negative Information Exposure, Selective Exposure, +]
    - [Age, Negative Information Exposure -> Attention Allocation, m]
    - [Negative Emotional Arousal, Negative Information Exposure -> Overall Impression, m]
    refs:
    - {title: Negativity bias (Wikipedia), url: 'https://en.wikipedia.org/wiki/Negativity_bias'}
    - {title: Negativity Bias (The Decision Lab), url: 'https://thedecisionlab.com/biases/negativity-bias'}
    enrich_notes: Negative Information Exposure 的邊讀作「資訊愈負向，效果愈大」（相對於同強度正向資訊）。注意、記憶、印象、診斷性為來源明寫；生理喚起與新聞的關聯來自 Decision Lab 引用的
      17 國研究（Soroka 等）。Selective Exposure（偏好點選負面新聞）是常見實證版本，兩個來源只提到「壞消息賣得好」。年齡調節對應老年人的正向效應（Wikipedia 指仍有許多老人保有負向偏誤）。
  Primacy Effects:
    note: Primacy Effects
    abbr: PrimRec
    name: Primacy and Recency Effects
    zh: 初始效應與時近效應
    field: 認知心理學／印象形成
    desc: Ebbinghaus 發現、Murdock（1962）確立序列位置曲線：最先與最後出現的項目記得最好，前者靠複誦進入長期記憶，後者靠仍在短期記憶；Asch（1946）顯示在印象形成中最先出現的特質會主導整體印象。
    edges:
    - [Serial Position Earliness, Rehearsal Amount, +]
    - [Rehearsal Amount, Recall, +]
    - [Serial Position Earliness, Recall, +]
    - [Serial Position Recency, Short-Term Memory Availability, +]
    - [Short-Term Memory Availability, Recall, +]
    - [Serial Position Recency, Recall, +]
    - [Presentation Rate, Serial Position Earliness -> Rehearsal Amount, m]
    - [List Length, Serial Position Earliness -> Recall, m]
    - [Time Delay, Serial Position Recency -> Recall, m]
    - [Serial Position Earliness, Information Weight in Judgment, +]
    - [Information Weight in Judgment, Overall Impression, +]
    refs:
    - {title: Serial-position effect (Wikipedia), url: 'https://en.wikipedia.org/wiki/Serial-position_effect'}
    - {title: 'Serial Position Effect: Glanzer & Cunitz (1966) (Simply Psychology)', url: 'https://www.simplypsychology.org/primacy-recency.html'}
    enrich_notes: Presentation Rate 定義為呈現速度：愈快初始效應愈弱（慢速呈現提高早期項目回憶）；清單愈長初始效應愈弱；Time Delay 沿用既有變數代表回憶前的干擾延遲，30 秒即可消除時近效應但不影響初始效應（Glanzer
      & Cunitz 1966），兩者皆為來源明寫。Asch 印象形成的初始效應以 Information Weight in Judgment 中介表示。說服訊息的順序效果（先說／後說）兩個來源未涵蓋，未列入。
  Social Proof Theory:
    note: Social Proof Theory
    abbr: SocProof
    name: Social Proof
    zh: 社會認同／社會證據
    field: 社會影響／說服
    desc: Cialdini（1984）命名的資訊性社會影響：人在不確定如何行動時會參考他人的行為來判斷什麼是正確的，他人愈多、愈與自己相似影響愈大；評論數、按讚數等線索在線上放大此效果，也可能形成資訊瀑布讓群體過早收斂。
    edges:
    - [Review Volume, Descriptive Norm, +]
    - [Bandwagon Cues, Descriptive Norm, +]
    - [Number of Endorsers, Descriptive Norm, +]
    - [Descriptive Norm, Behavioral Intention, +]
    - [Descriptive Norm, Behavior, +]
    - [Descriptive Norm, Perceived Credibility, +]
    - [Descriptive Norm, Information Cascade, +]
    - [Information Cascade, Decision Accuracy, '-']
    - [Situational Uncertainty, Descriptive Norm -> Behavioral Intention, m]
    - [Perceived Similarity, Descriptive Norm -> Behavioral Intention, m]
    - [Involvement, Descriptive Norm -> Behavioral Intention, m]
    refs:
    - {title: Social proof (Wikipedia), url: 'https://en.wikipedia.org/wiki/Social_proof'}
    - {title: 'The 7 Principles of Persuasion: Social Proof (Influence at Work, Cialdini)', url: 'https://www.influenceatwork.com/7-principles-of-persuasion/'}
    enrich_notes: Descriptive Norm（他人實際怎麼做的知覺）為社會證據的核心構念，與既有 Social Norm／Subjective Norm 區分。不確定性與相似性兩大條件、捐款者名單長度（Number of
      Endorsers）、資訊瀑布為來源明寫；旅館毛巾研究顯示「相似他人怎麼做」最有效。Involvement 對應目擊任務「任務重要時從眾率 51% 對 35%」。既有的 Bandwagon Heuristic 處理線索層次，本理論處理規範知覺層次。
  Focus Theory of Normative Conduct:
    note: Focus Theory of Normative Conduct
    abbr: FTNC
    name: Focus Theory of Normative Conduct
    zh: 規範行為聚焦理論
    field: 社會影響／規範
    desc: Cialdini、Reno 與 Kallgren（1990）以五個亂丟垃圾田野實驗提出：規範只在當下被注意到（規範聚焦）時才影響行為，並區分描述性規範（多數人怎麼做）與指令性規範（多數人贊成什麼）；負向描述性規範會把不當行為正常化。
    edges:
    - [Norm Salience Cue, Normative Focus, +]
    - [Descriptive Norm, Behavior, +]
    - [Injunctive Norm, Behavior, +]
    - [Normative Focus, Descriptive Norm -> Behavior, m]
    - [Normative Focus, Injunctive Norm -> Behavior, m]
    - [Prior Behavior Frequency, Descriptive Norm -> Behavior, m]
    - [Injunctive Norm, Descriptive Norm -> Behavior, m]
    - [Injunctive Norm, Personal Norm, +]
    - [Personal Norm, Behavior, +]
    refs:
    - {title: 'Social Norms chapter, Open Social Psychology (FORRT)', url: 'https://forrt.org/open-social-psychology/chapter22.html'}
    - {title: 'Cialdini, Reno & Kallgren (1990) abstract (CBSM)', url: 'https://cbsm.com/articles/31496-a-focus-theory-of-normative-conduct-recycling-the-concept-of-norms-to-reduce-littering-in-public-pla'}
    enrich_notes: Behavior 指與規範一致的行為（如不亂丟）。規範聚焦為必要條件故以調節表示；Norm Salience Cue 涵蓋環境狀態（乾淨／髒亂）與他人示範行為。Prior Behavior Frequency
      調節對應 Schultz 等（2007）回彈效應：低於平均者得知平均值後反而增加用電，而指令性規範訊息可消除回彈，故 Injunctive Norm 也作調節。Personal Norm 路徑對應 FORRT 引用的統合分析：內化規範預測力更強。Reno
      等（1993）跨情境穩健性未在開過的來源中確認。
  Rational Choice Theory RCT:
    note: Rational Choice Theory RCT
    abbr: RCT
    name: Rational Choice Theory
    zh: 理性選擇理論
    field: 經濟學／社會學／犯罪學
    desc: 承自 Adam Smith，由 Becker（1976）、Coleman（1990）推廣到社會行為：個人有完整且可遞移的偏好，在資源與資訊限制下比較各選項的預期效益、成本與發生機率，選擇預期效用最高者；Simon 的有限理性是主要修正。
    edges:
    - [Benefit, Expected Utility, +]
    - [Perceived Cost, Expected Utility, '-']
    - [Outcome Probability, Expected Utility, +]
    - [Perceived Reward, Benefit, +]
    - [Sanction Severity, Perceived Cost, +]
    - [Expected Utility, Behavioral Intention, +]
    - [Behavioral Intention, Behavior, +]
    - [Resource Constraint, Expected Utility -> Behavioral Intention, m]
    - [Bounded Rationality, Expected Utility -> Behavioral Intention, m]
    - [Information Access, Bounded Rationality, '-']
    refs:
    - {title: Rational choice theory (Wikipedia), url: 'https://en.wikipedia.org/wiki/Rational_choice_theory'}
    - {title: Rational Choice Theory (Simply Psychology), url: 'https://www.simplypsychology.org/rational-choice-theory.html'}
    enrich_notes: RCT 是公理化框架而非實證模型，邊是依其假設翻成可檢驗形式：效益、成本、機率構成預期效用，預算限制與有限理性削弱效用對行為的預測。Sanction Severity 對應犯罪學應用（Cornish & Clarke
      的選擇結構），既有 Deterrence Theory 有更完整版本。
  Cultivation Theory:
    note: Cultivation Theory
    abbr: Cultiv
    name: Cultivation Theory
    zh: 涵化理論
    field: 傳播效果
    desc: Gerbner 與 Gross（1976）提出：長期大量收看電視會讓重度觀眾對社會現實的認知向電視世界靠攏，高估暴力犯罪、更不信任他人（險惡世界症候群）；1980 年加入主流化（不同背景觀眾趨同）與共鳴（內容與親身經驗吻合時加倍）。
    edges:
    - [Media Use, Perceived Frequency, +]
    - [Media Use, Mean World Belief, +]
    - [Media Use, Fear, +]
    - [Media Use, Trust, '-']
    - [Violent Content Exposure, Mean World Belief, +]
    - [Mean World Belief, Perceived Risk, +]
    - [Demographic Differences, Mean World Belief, +]
    - [Victimization Experience, Media Use -> Mean World Belief, m]
    - [Media Use, Demographic Differences -> Mean World Belief, m]
    - [Perceived Realism, Media Use -> Mean World Belief, m]
    - [Transportation, Media Use -> Mean World Belief, m]
    refs:
    - {title: Cultivation theory (Wikipedia), url: 'https://en.wikipedia.org/wiki/Cultivation_theory'}
    - {title: Cultivation Theory in Media (Simply Psychology), url: 'https://www.simplypsychology.org/cultivation-theory.html'}
    enrich_notes: Media Use 沿用既有變數代表收視量（重度對輕度觀眾）。Media Use -> Perceived Frequency 是第一序效果（高估犯罪、警察比例），Mean World Belief、Fear、Trust
      是第二序效果。主流化以「收視量削弱人口變項對信念的影響」的調節表示；共鳴以受害經驗加強表示。Perceived Realism 與 Transportation 為後續研究的促進條件，兩個來源只簡短提及。效果量小（2021 統合分析
      r 約 .10）且因果方向有爭議（恐懼者可能看更多電視），畫圖時應標示。既有 Violent Content Exposure 對應類型效果（地方新聞、警匪劇）。
  Framing Theory:
    note: Framing Theory
    abbr: Framing
    name: Framing Theory (Communication)
    zh: 框架理論（傳播學）
    field: 傳播效果／政治傳播
    desc: Entman（1993）定義：框架是選擇現實的某些面向並使之凸顯，以推動特定的問題定義、因果詮釋、道德評價與解方；Scheufele（1999）分框架建構與框架設定，Chong 與 Druckman（2007）指出效果取決於框架強度與競爭。
    edges:
    - [Routines, Frames, +]
    - [Frames, Media Attribute Salience, +]
    - [Media Attribute Salience, Issue Accessibility, +]
    - [Frames, Consideration Applicability, +]
    - [Consideration Applicability, Attitude, +]
    - [Issue Accessibility, Attitude, +]
    - [Frames, Responsibility Attribution, +]
    - [Attitude, Policy Support, +]
    - [Frame Strength, Frames -> Consideration Applicability, m]
    - [Conflicting Frames, Frames -> Consideration Applicability, m]
    - [Perceived Credibility, Frames -> Consideration Applicability, m]
    - [Topic Knowledge, Frames -> Consideration Applicability, m]
    - [Personal Values, Frames -> Consideration Applicability, m]
    refs:
    - {title: Framing (social sciences) (Wikipedia), url: 'https://en.wikipedia.org/wiki/Framing_(social_sciences)'}
    - {title: Notes on Chong & Druckman (2007) Framing Public Opinion in Competitive Democracies (adambrown.info), url: 'https://adambrown.info/p/notes/chong_and_druckman_framing_public_opinion_in_competitive_democracies'}
    enrich_notes: Frames 與 Media Attribute Salience 沿用既有變數；Routines -> Frames 是框架建構（新聞常規影響記者採用的框架）。效果機制採 Chong & Druckman
      的可用性、可及性、適用性三段，Wikipedia 指近期研究支持適用性勝過可及性，故 Issue Accessibility -> Attitude 較弱。Frames -> Responsibility Attribution 對應
      Iyengar 的情節式框架使觀眾歸咎個人。強框架才有效、競爭框架互相抵銷並在高政治知識者中出現對比效果為筆記明寫；來源可信度與價值觀調節為框架文獻的常見版本，Chong & Druckman 原文 PDF 抓取失敗未直接讀到。
  SOR Model:
    note: SOR Model
    abbr: SOR
    name: Stimulus-Organism-Response Model
    zh: 刺激－有機體－反應模型
    field: 環境心理學／消費者行為
    desc: Mehrabian 與 Russell（1974）在環境心理學提出、Jacoby（2002）修訂：外在環境或行銷刺激先改變個體的內在認知與情感狀態（愉悅、喚起、信任、知覺價值、心流），再由這些狀態驅動趨近或迴避反應；電商與氛圍研究常用。
    edges:
    - [Atmospheric Cues, Joy, +]
    - [Atmospheric Cues, Arousal, +]
    - [Perceived Site Quality, Trust, +]
    - [Perceived Site Quality, Perceived Value, +]
    - [Social Cues, Trust, +]
    - [Joy, Approach Behavior, +]
    - [Arousal, Approach Behavior, +]
    - [Joy, Arousal -> Approach Behavior, m]
    - [Joy, Avoidance Behavior, '-']
    - [Joy, Impulse Buying, +]
    - [Trust, Purchase Intention, +]
    - [Perceived Value, Purchase Intention, +]
    - [Flow, Purchase Intention, +]
    - [Task Complexity, Social Cues -> Trust, m]
    refs:
    - {title: 'A Systematic Review of the S-O-R Model Application in Consumer Purchase Behaviors (IMAGE journal, UNIRAZAK)',
      url: 'https://ojs.unirazak.edu.my/index.php/image/article/view/253'}
    - {title: 'Exploring consumers response to text-based chatbots in e-commerce: S-O-R with task complexity and disclosure
        (arXiv 2401.12247)', url: 'https://arxiv.org/abs/2401.12247'}
    enrich_notes: SOR 是後設框架，邊取系統性回顧列出的典型路徑：刺激（氛圍線索、網站品質、社會線索／聊天機器人友善度）、有機體（Joy 沿用既有變數代表 pleasure、Arousal、Trust、Perceived Value、Flow）、反應（趨近／迴避、購買意圖、衝動購買）。Joy
      調節 Arousal -> Approach 對應 Mehrabian-Russell 原始主張：喚起只在愉悅環境中提高趨近。Task Complexity 調節出自 arXiv 聊天機器人研究（任務複雜削弱友善度到信任）。Dominance
      構面因後續研究多半省略未列入。
  Innovation Resistance Theory IRT:
    note: Innovation Resistance Theory IRT
    abbr: IRT
    name: Innovation Resistance Theory
    zh: 創新抗拒理論
    field: 創新採用／消費者行為
    desc: Ram 與 Sheth（1989）提出：消費者抗拒創新是因為創新改變了令人滿意的現狀或與既有信念衝突，抗拒來源分為功能性障礙（使用、價值、風險）與心理性障礙（傳統、形象）；行銷者應診斷障礙來源並針對性化解，而非被動接受抗拒。
    edges:
    - [Usage Barrier, User Resistance, +]
    - [Value Barrier, User Resistance, +]
    - [Risk Barrier, User Resistance, +]
    - [Tradition Barrier, User Resistance, +]
    - [Image Barrier, User Resistance, +]
    - [User Resistance, Adoption, '-']
    - [Complexity, Usage Barrier, +]
    - [Relative Advantage, Value Barrier, '-']
    - [Perceived Risk, Risk Barrier, +]
    - [Habit, Tradition Barrier, +]
    - [Innovativeness, Value Barrier -> User Resistance, m]
    - [Self-Efficacy, Usage Barrier -> User Resistance, m]
    refs:
    - {title: 'Ram & Sheth (1989) Consumer Resistance to Innovations: The Marketing Problem and its Solutions (Emerald abstract)',
      url: 'https://www.emerald.com/insight/content/doi/10.1108/EUM0000000002542/full/html'}
    - {title: Alshallaqi et al. (2022) applying Ram & Sheth's IRT to productivity apps (Frontiers in Psychology), url: 'https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2022.961589/full'}
    enrich_notes: User Resistance 沿用既有變數代表消費者對創新的抗拒。五大障礙 -> 抗拒為原始摘要與 Frontiers 實證（價值 .37、形象 .31、傳統 .29、風險 .17）明寫；Complexity、Relative
      Advantage、Perceived Risk、Habit 到各障礙的前因是把障礙與 IDT／風險文獻接起來的常見做法。Frontiers 研究以「消費者特性」（態度、動機、社會影響、情緒）調節，此處以 Innovativeness
      與 Self-Efficacy 兩個既有變數代表。
  Cognitive Miser:
    note: Cognitive Miser
    abbr: CogMiser
    name: Cognitive Miser
    zh: 認知吝嗇者
    field: 社會認知
    desc: Fiske 與 Taylor（1984）提出：人的資訊處理容量有限，能走捷徑就走捷徑，以捷思與刻板印象省力，代價是系統性偏誤；1991 年修正為「有動機的策略家」，動機、利害與問責足夠時才投入費力思考，且與智力無關。
    edges:
    - [Cognitive Load, Heuristic Reliance, +]
    - [Time Pressure, Heuristic Reliance, +]
    - [Task Complexity, Heuristic Reliance, +]
    - [Working Memory Capacity, Heuristic Reliance, '-']
    - [Heuristic Reliance, Systematic Processing, '-']
    - [Heuristic Reliance, Social Categorization, +]
    - [Heuristic Reliance, Decision Error, +]
    - [Involvement, Systematic Processing, +]
    - [Accountability, Systematic Processing, +]
    - [Need for Cognition, Systematic Processing, +]
    - [Decision Stakes, Systematic Processing, +]
    - [Expectancy Violation, Systematic Processing, +]
    - [Domain Expertise, Heuristic Reliance -> Decision Error, m]
    refs:
    - {title: Cognitive miser (Wikipedia), url: 'https://en.wikipedia.org/wiki/Cognitive_miser'}
    enrich_notes: 只有一個來源成功開啟（Wikipedia），其餘候選頁（APA 字典、Britannica、ScienceDirect、館藏目錄）回 403 或空白；搜尋結果摘要另確認 Fiske & Taylor 1984
      命名與 Stanovich 2009 章節。容量限制、選擇複雜時更依賴捷思、專家用捷思有益新手有害、期望違反與無直覺答案時才啟動深思為 Wikipedia 明寫；動機、問責、利害、認知需求提高系統性處理是有動機策略家與 ELM／HSM
      的常見版本。
  Graphical perception theory:
    note: Graphical perception theory
    abbr: GraphPerc
    name: Graphical Perception Theory
    zh: 圖形知覺理論
    field: 資訊視覺化
    desc: Cleveland 與 McGill（1984）主張讀圖是一連串基本知覺作業，各視覺編碼通道的判讀準確度有固定排序：共同尺度上的位置最準，其次是非對齊位置、長度、角度，面積、體積與色彩飽和度最差；圖表應優先採用高排序的通道。
    edges:
    - [Encoding Channel Rank, Perceptual Judgment Accuracy, +]
    - [Common Scale Alignment, Perceptual Judgment Accuracy, +]
    - [Length Encoding, Estimation Error, +]
    - [Angle Encoding, Estimation Error, +]
    - [Area Encoding, Estimation Error, +]
    - [Color Saturation Encoding, Estimation Error, +]
    - [Perceptual Judgment Accuracy, Graph Comprehension, +]
    - [Estimation Error, Decision Accuracy, '-']
    refs:
    - {title: Graphical perception + layers (Cornell INFO 3312 slides), url: 'https://info3312.infosci.cornell.edu/slides/04-graphical-perception.html'}
    - {title: 'The Risks of Ranking: Revisiting Graphical Perception (arXiv)', url: 'https://arxiv.org/pdf/2212.10533'}
    enrich_notes: 排序（高→低）：共同尺度位置 > 非對齊位置 > 長度／方向／角度 > 面積 > 體積／曲率 > 明暗／色彩飽和度。Heer & Bostock（2010）以群眾外包重做，排序大致成立並補上圓形面積優於矩形面積。
  Gestalt Principles:
    note: Gestalt Principles
    abbr: Gestalt
    name: Gestalt Principles of Grouping
    zh: 完形組織原則
    field: 視知覺
    desc: Wertheimer、Koffka 與 Köhler（1912 起）提出知覺傾向把元素組織成簡潔整體（Prägnanz）；接近、相似、閉合、連續、共同命運、共同區域與連結等線索都會提高元素被知覺為同群的程度，與資料結構不一致時造成假性分群。
    edges:
    - [Element Proximity, Perceived Grouping, +]
    - [Element Similarity, Perceived Grouping, +]
    - [Closure Completion, Perceived Grouping, +]
    - [Good Continuation, Perceived Grouping, +]
    - [Common Fate Motion, Perceived Grouping, +]
    - [Common Region Enclosure, Perceived Grouping, +]
    - [Element Connectedness, Perceived Grouping, +]
    - [Figure-Ground Contrast, Perceived Grouping, +]
    - [Perceived Grouping, Graph Comprehension, +]
    - [Spurious Grouping, Graph Comprehension, '-']
    refs:
    - {title: Principles of grouping (Wikipedia), url: 'https://en.wikipedia.org/wiki/Principles_of_grouping'}
    - {title: Gestalt psychology (Wikipedia), url: 'https://en.wikipedia.org/wiki/Gestalt_psychology'}
    enrich_notes: 共同區域與連結兩條為 Palmer 與 Rock 後來補充（Wikipedia 完形心理學頁未列，分群原則頁有提到 Rock 與 Palmer）。
  Pre-Attentive Processing:
    note: Pre-Attentive Processing
    abbr: PreAtt
    name: Pre-attentive Processing
    zh: 前注意處理
    field: 視知覺
    desc: 源自 Treisman 的注意理論，Healey 與 Enns（2012）整理為視覺化原則：色彩、方向、大小、動態等單一特徵能在約 200 毫秒內平行偵測，與干擾物差異大即「跳出」，偵測時間不隨元素數增加；多特徵結合的目標則要逐一注意。
    edges:
    - [Feature Singleton, Pop-Out, +]
    - [Target-Distractor Difference, Pop-Out, +]
    - [Distractor Heterogeneity, Pop-Out, '-']
    - [Conjunction Target, Pop-Out, '-']
    - [Pop-Out, Search Time, '-']
    - [Pop-Out, Hit Rate, +]
    - [Display Size, Search Time, +]
    - [Pop-Out, Display Size -> Search Time, m]
    - [Conjunction Target, Search Time, +]
    refs:
    - {title: Healey & Enns (2012) Attention and Visual Memory in Visualization and Computer Graphics, url: 'https://healey.csc.ncsu.edu/publications/15783-attention-and-visual-memory-in-visualization-and-computer-graphics'}
