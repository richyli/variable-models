    - [Dissatisfaction, Switching Intention, +]
    - [Perceived Value, Switching Intention, '-']
    - [Trust, Switching Intention, '-']
    - [Relationship Commitment, Switching Intention, '-']
    - [Alternative Attractiveness, Switching Intention, +]
    - [Switching Benefits, Switching Intention, +]
    - [Switching cost, Switching Intention, '-']
    - [Habit, Switching Intention, '-']
    - [Subjective Norm, Switching Intention, +]
    - [Prior Behavior Frequency, Switching Intention, +]
    - [Switching cost, Alternative Attractiveness -> Switching Intention, m]
    - [Switching cost, Dissatisfaction -> Switching Intention, m]
    - [Switching Intention, Switching Behavior, +]
    refs:
    - {title: 'The push-pull-mooring model of consumer service switching: a meta-analytical review (JSTP 2025)', url: 'https://emerald.com/insight/content/doi/10.1108/JSTP-06-2024-0201'}
    - {title: Customer switching intention from home delivery to smart locker delivery (PPM application), url: 'https://businessperspectives.org/journals/innovative-marketing/issue-457/customer-switching-intention-from-home-delivery-to-smart-locker-delivery-evidence-from-vietnam'}
    enrich_notes: 保留原五條。依 Bansal 等的原始模型補推力（低價值、低信任、低承諾，皆沿用名單既有名稱）、拉力（轉換利益）、繫住力（主觀規範、先前轉換行為以 Prior Behavior Frequency 表示）。原模型主張繫住力調節推與拉；2025
      後設分析只支持拉力端部分受轉換成本調節，推力端未獲支持，兩條調節邊仍依原模型保留並在此註明。
  Commitment trust theory:
    note: Commitment trust theory
    abbr: KMV
    zh: 承諾－信任理論
    field: 行銷／關係行銷
