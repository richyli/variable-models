        PDF)', url: 'https://www.com.cuhk.edu.hk/images/content_people/publication/christine-journal-20171-gettingEmotional.pdf'}
    enrich_notes: 原 desc 空白，重寫。原第一條 Emotions→Behavioral Intention 無符號，依 Coombs 取負（Emotions 在此指憤怒；同情則反向）。危機類型以歸因理論的 Controllability
      與 Locus（名單既有）表示，內部且可控→責任高。補 Coombs（2004）危機歷史與先前聲譽對聲譽的直接效果、負面口碑（Word of Mouth 反向）、回應策略與責任的配適（Accommodative Response Strategy
      新造，涵蓋 diminish／rebuild）。荷蘭實驗發現責任與聲譽無關、情緒更核心，與模型不一致，此處仍依 Coombs 原模型。
  Attribution Theory:
    note: Attribution Theory
    abbr: AttrT
    zh: 歸因理論
    field: 社會心理
    edges:
    - [Locus, Responsibility Attribution, +]
    - [Controllability, Responsibility Attribution, +]
    - [Stability, Expectancy, +]
    - [Valence, Stability -> Expectancy, m]
    - [Locus, Emotions, +]
    - [Responsibility Attribution, Emotions, +]
    - [Valence, Emotions, +]
    - [Emotions, Behavior, +]
    - [Expectancy, Behavior, +]
    - [Locus, Self-Esteem, +]
    - [Locus, Self-Efficacy, +]
    - [Stability, Outcome Expectations, +]
    - [Responsibility Attribution, Punitive Response, +]
    - [Responsibility Attribution, Helping Behavior, '-']
    - [Consensus, Locus, '-']
    - [Distinctiveness, Locus, '-']
    - [Consistency, Locus, +]
    - [Outcome Expectations, Persistence, +]
    desc: Weiner（1985、1995）：人對成敗與他人行為的原因判斷落在內外歸因、穩定性、可控性三個維度；穩定性決定對未來結果的預期，內外歸因與可控性決定責任判斷與情緒（自尊、憤怒、同情、罪惡），預期與情緒再驅動行為。
    refs:
    - {title: 'An attributional theory of achievement motivation and emotion (Weiner, 1985; course copy)', url: 'https://eclass.uoa.gr/modules/document/file.php/PPP387/weinerAnattributionaltheory.pdf'}
    - {title: Attribution (psychology) (Wikipedia), url: 'https://en.wikipedia.org/wiki/Attribution_(psychology)'}
    - {title: 'The role of causal attributions in achievement: meta-analysis (Brun, Pansu & Dompnier, 2021)', url: 'https://serval.unil.ch/notice/serval:BIB_320FF9A6B3AF'}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 6 章', url: ''}
    enrich_notes: 原五條保留四條，刪掉 Stability → Responsibility Attribution：Weiner 的責任判斷由內外歸因與可控性決定，穩定性影響的是預期（expectancy of success），所以改接到既有變數
      Expectancy。Stability → Expectancy 的意思是「穩定原因使人預期同樣結果再發生」，正負要看結果好壞，故用 Valence（結果效價）調節；Valence → Emotions 是 Weiner 的結果依賴情緒（先於歸因）。Brun
      等（2021）的後設分析支持認知→預期→行動的序列。
    book_check: Miles 2012 第 6 章對照：補 9 條邊；書中變數我們原本沒有的：Globality、Intentionality、Task Difficulty、Luck、Consensus、Distinctiveness、Consistency、Helping
      Behavior、Punitive Response、Self-Serving Bias、Fundamental Attribution Error、Actor-Observer Effect、Group-Serving Bias。Locus
      在邊裡編碼為『內在程度』（越高越內在）。書上明寫：成功歸因於努力（內在）→驕傲、高自尊、高自我效能與成功期望；歸因於穩定原因→預期同樣結果再發生（失敗時變成無望感），所以 Stability→Outcome Expectations
      的正號指『期望與過去結果同向』，效價要另外處理；可控原因→判定他人該負責→責備、譴責、報復；不可控→幫助。Kelley 共變：三者皆高→外在歸因；共識低、特殊性低、一致性高→內在歸因，邊的正負是照此換算。心理後果→行為後果（努力與否）是書中七階段的最後一步，Persistence
      沿用既有名稱。四種偏誤是現象描述、無方向，只列變數不畫邊；群體自利偏誤（Goncalo 與 Duguid 2008）可延伸到組織層次。因果前因（過去績效、社會規範、期望）影響歸因類別但書未給方向，只列變數。我們的『Responsibility
      Attribution』『Locus』『Stability』『Controllability』應是從 SCCT 來的，正好可共用。量表：Dixon 等（2001）努力／能力／任務／策略／運氣歸因量表；Martinko 等（2007）歸因風格問卷。
  T Institutional Theory:
    note: T Institutional Theory
    abbr: InstT
    zh: 制度理論（同構壓力）
    field: 組織
    edges:
    - [Coercive Pressure, Adoption, +]
    - [Mimetic Pressure, Adoption, +]
    - [Normative Pressure, Adoption, +]
    - [External Dependence, Coercive Pressure, +]
    - [Environmental Uncertainty, Mimetic Pressure, +]
    - [Professionalization, Normative Pressure, +]
    - [Adoption, Isomorphism, +]
    - [Isomorphism, Legitimacy, +]
    - [Legitimacy, Organizational Survival, +]
    - [Legitimacy, Resource Concentration, +]
    - [Coercive Pressure, Isomorphism, +]
    - [Mimetic Pressure, Isomorphism, +]
    - [Normative Pressure, Isomorphism, +]
    - [Legitimacy, Resource Acquisition, +]
    - [Organizational Status, Isomorphism -> Legitimacy, m]
    desc: DiMaggio 與 Powell（1983）、Meyer 與 Rowan（1977）：組織為了取得合法性而非效率，會在強制、模仿、規範三種制度壓力下採用相同的結構與做法，形成同構；同構帶來合法性與存續，不確定性越高越傾向模仿。
    refs:
    - {title: DiMaggio & Powell (1983) The Iron Cage Revisited (PDF), url: 'https://Www.Gwern.net/doc/sociology/1983-dimaggio.pdf'}
    - {title: Institutional theory - Wikipedia, url: 'https://en.wikipedia.org/wiki/Institutional_theory'}
    - {title: Institutional theory - IS Theories wiki, url: 'https://is.theorizeit.org/wiki/Institutional_theory'}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 17 章', url: ''}
    enrich_notes: 保留原三條壓力→採用。依 DiMaggio & Powell 的三組假設補前因：資源依賴（External Dependence，沿用名單）→強制壓力、不確定性→模仿壓力、專業化→規範壓力；依 Meyer &
      Rowan 補採用→同構→合法性→存續與資源取得（用名單既有 Resource Concentration 代表資源流入）。原理論不談績效，DiMaggio & Powell 明說同構與效率無關，故不加績效邊。新造變數：Professionalization、Isomorphism、Legitimacy、Organizational
      Survival。
    book_check: Miles 2012 第 17 章對照：補 5 條邊；書中變數我們原本沒有的：Resource Acquisition、Strategic Response to Institutional Pressure、Institutional
      Entrepreneurship、Organizational Status、Field-level Variability。三種壓力→同形是書明寫（p.159–160）。External Dependence→Coercive Pressure
      對應書中「強制同形來自組織所依賴資源的持有者」；Environmental Uncertainty→Mimetic Pressure 對應「不確定該怎麼做時模仿成功組織」；Professionalization→Normative
      Pressure 對應「教育訓練、專業網絡」，三條都是依書的定義句拆出的前因，不是書以因果句寫的。順從→正當性、資源、存活來自 p.160（Oliver 1997；Yang & Konrad 2010）。Organizational
      Status 調節來自批評節 Phillips & Zuckerman（2001）：中階地位者最需要表現正當，高地位可偏離、低地位只求生存；書是對正當性約束的質疑，我畫成調節。Isomorphism→Firm Performance
      書說仍在爭論（p.162），不畫邊。Acquiescence 清單已有，是 Oliver（1991）五種回應之一，其餘四種（compromise、avoidance、defiance、manipulation）合併列為 Strategic
      Response to Institutional Pressure。測量節的專業承諾、子公司績效、可程式化與控制幅度量表都是應用研究的操作化，不是核心構念。
