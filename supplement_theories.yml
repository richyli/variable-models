    field: 媒介效果
    desc: Sundar（2008）MAIN 模型中的從眾捷思：按讚數、評論數、評分等代理（agency）線索讓使用者推論「大家都這樣認為」，不經細想就提高可信度判斷、態度與採用意圖；在低涉入、低動機的瀏覽情境下，這種捷思效果更強。
    edges:
    - [Review Volume, Bandwagon Cues, +]
    - [Agency Cues, Bandwagon Effect, +]
    - [Bandwagon Cues, Bandwagon Effect, +]
    - [Bandwagon Effect, Perceived Credibility, +]
    - [Bandwagon Effect, Attitude, +]
    - [Bandwagon Effect, Behavioral Intention, +]
    - [Perceived Credibility, Attitude, +]
    - [Attitude, Behavioral Intention, +]
    - [Involvement, Bandwagon Effect -> Attitude, m]
    refs:
    - {title: 'Following the herd: The influence of the bandwagon heuristic on e-commerce shoppers (arXiv 2505.14861)', url: 'https://arxiv.org/pdf/2505.14861'}
    - {title: 'Penn State Media Effects Research Lab: heuristic cues on users'' attitudes on a product review site', url: 'https://bellisario.psu.edu/medialab/research-article/examining-psychological-effects-of-heuristic-cues-on-users-attitudes-on-a-p'}
