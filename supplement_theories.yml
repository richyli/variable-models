    - [Personalization, Utilitarian Goal -> Preference for AI Recommender, m]
    - [Human-AI Hybrid Recommendation, Hedonic Goal -> Preference for AI Recommender, m]
    - [Preference for AI Recommender, Purchase Intention, +]
    refs:
    - {title: When Consumers Trust AI Recommendations—Or Resist Them (AMA), url: 'https://www.ama.org/2020/11/24/when-consumers-trust-ai-recommendations-or-resist-them/'}
    - {title: 'Artificial Intelligence in Utilitarian vs. Hedonic Contexts: The Word-of-Machine Effect (Bocconi IRIS record)',
      url: 'https://iris.unibocconi.it/handle/11565/4059096'}
    enrich_notes: 保留原三條邊。依 AMA 整理與原論文摘要補入機制變數 Perceived AI Competence（消費者對 AI 在功利／享樂領域能力的信念，名單外新造）作為中介，以及兩個邊界條件：需要量身訂做（Personalization，沿用名單）會逆轉功利目標下的
      AI 偏好；人機混合推薦（Human-AI Hybrid Recommendation，新造）消除享樂目標下的抗拒。原論文的 consider-the-opposite 介入只是去偏方法，未列為構念。Preference -> Purchase
      Intention 是常見下游延伸，非原論文主要依變數。
