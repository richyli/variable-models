    book_check: Miles 2012 第 22 章對照：補 8 條邊；書中變數我們原本沒有的：Interpersonal Justice、Informational Justice。書上的「overall justice perception」（Ambrose
      & Schminke 2009）對應我們既有 Perceived Fairness。Voice→Procedural Justice（有發言權就覺得程序公平）與 fair process effect（程序公平時不利結果仍被視為公平）為書上明寫（p200），後者寫成程序正義調節分配正義→公平知覺。公平→態度與績效為書上明寫（p204「attitudes
