      url: 'https://verdi.cs.ucl.ac.uk/constructDB/publications/gefen-trust-2003.html'}
    enrich_notes: 保留原四條。原理論只有「媒介線索 -> 社會臨場感 -> 溝通效果」三段，沒有正負號；方向依常見實證版本（Gunawardena 與 Zittle 1997 的滿意度、Gefen 與 Straub 2003／2004
      的信任與有用性）決定。IS Theories wiki 提到互動性與臨場感可能是倒 U 形，這裡簡化為正向。
