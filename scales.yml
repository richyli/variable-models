Reference Point:
  zh: ''
  scales:
  - name: Kahneman & Tversky (1979)
    source: Kahneman & Tversky (1979) Econometrica prospect theory——參考點多以操弄（框架、現狀、預期）設定，非量表；價格脈絡用 internal reference
