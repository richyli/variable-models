    - [Reciprocity, Normative Commitment, +]
    - [Affective Commitment, Turnover Intention, '-']
    - [Continuance Commitment, Turnover Intention, '-']
    - [Normative Commitment, Turnover Intention, '-']
    - [Affective Commitment, Organizational Citizenship Behavior, +]
    - [Affective Commitment, Job Performance, +]
    - [Affective Commitment, Well-being, +]
    - [Continuance Commitment, Job Performance, '-']
    - [Turnover Intention, Employee Retention, '-']
    refs:
    - {title: Organizational commitment - Wikipedia, url: 'https://en.wikipedia.org/wiki/Organizational_commitment'}
    - {title: The three-component model of organisational commitment (University of Szeged teaching text), url: 'https://eta.bibl.u-szeged.hu/1276/2/sportkultura_eng/www.jgypk.hu/tamop13e/tananyag_html/sportkultura_eng/the_threecomponent_model_of_organisational_commitment.html'}
    enrich_notes: 原七條邊保留。補前因：工作滿意→情感承諾（Wikipedia）、缺乏替代（以 Alternative Attractiveness 負向代表）→持續承諾、組織投資引發的互惠義務（Reciprocity）→規範承諾；後果：情感承諾正向預測績效、公民行為與福祉，持續承諾與這些結果呈負或零相關（Meyer
      et al. 2002 後設分析，依 Szeged 教學文本轉述）。Switching cost 在此代表 side bets／沉沒投資。
  T POS Perceived Organizational Support:
