    - [Subjective Norm, PU Perceived Usefulness, +]
    - [Subjective Norm, Behavioral Intention, +]
    desc: Davis（1989）、Davis、Bagozzi 與 Warshaw（1989）提出：使用者是否接受資訊科技取決於知覺有用性與知覺易用性，兩者經態度形成使用意圖、再轉為實際使用，易用性也會提高有用性；外部變數（系統設計、訓練、主觀規範等）只透過這兩個信念發揮作用。
