      SCA」（Barney & Clark 2007）寫成 Absorptive Capacity 調節。SCA→績效：書上把績效差異視為資源效率差異帶來的盈餘差距（p233）。Dynamic Capabilities→Resource
      Reconfiguration 出自 Teece et al.（1997）那段（p233）。批評：套套邏輯、難以否證、VRIN 既非必要亦非充分（p233–234）。Measuring Variables 列的是 Chandler
