    edges:
    - [Expectation, Perceived Quality, +]
    - [Expectation, Perceived Value, +]
    - [Expectation, User Satisfaction, +]
    - [Perceived Quality, Perceived Value, +]
    - [Perceived Quality, User Satisfaction, +]
    - [Perceived Value, User Satisfaction, +]
    - [User Satisfaction, Customer Complaints, '-']
    - [User Satisfaction, Customer Retention, +]
    - [Customer Complaints, Customer Retention, '-']
    - [Service Recovery, Customer Complaints -> Customer Retention, m]
    refs:
    - {title: 'Fornell et al. 1996, The American Customer Satisfaction Index: Nature, Purpose, and Findings (Cornell eCommons
        record)', url: 'https://ecommons.cornell.edu/entities/publication/b27cc5d8-88af-4440-9be9-334289c1364b'}
    - {title: American Customer Satisfaction Index (ACSI) explainer (QuestionPro), url: 'https://questionpro.com/american-customer-satisfaction-index-acsi.html'}
    - {title: ACSI model strengths and weaknesses (Verint blog), url: 'https://www.verint.com/blog/acsi-american-customer-satisfaction-index-model-strengths-and-weaknesses/'}
    enrich_notes: 原七條保留，補期望→滿意的直接邊（原模型有，但多項檢定顯示弱）與抱怨→忠誠。ACSI 原模型對抱怨→忠誠不預設符號，由補救系統決定；此處預設 −，並以服務補救為調節。批評者指出抱怨放錯位置、品質與價值可能直接影響忠誠，未採納改動。
  T SERVQUAL:
    note: T SERVQUAL
