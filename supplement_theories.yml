    - [TTF, Perceived Consequences, +]
    - [Perceived Consequences, Behavior, +]
    - [Social Norm, Behavior, +]
    - [Habit, Behavior, +]
    - [Facilitating Conditions, Behavior, +]
    desc: Goodhue 與 Thompson（1995）提出科技—績效鏈：任務特性、科技特性與個人能力共同決定任務科技適配，適配同時提高使用與個人績效，使用對績效的效果以適配為條件；使用另受社會規範、態度與期望結果等前因影響。
