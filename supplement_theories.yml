      補逆選擇。Connelly 的接收者回饋（feedback）迴圈沒有畫，因為它作用在信號者的後續行為，不在單期模型內。
  Theory of Interpersonal Behavior:
    abbr: TIB
    zh: 人際行為理論（Triandis）
    field: 社會心理／IS
    desc: Triandis（1977）提出：行為是意圖與習慣的加權和，再乘上促成條件；意圖由態度（知覺結果）、情感、社會因素（規範、角色、自我概念）決定，習慣由過去行為頻率累積，習慣越強意圖對行為的作用越弱。
    edges:
    - [Perceived Consequences, Behavioral Intention, +]
    - [Affect, Behavioral Intention, +]
    - [Social Norm, Behavioral Intention, +]
    - [Roles, Behavioral Intention, +]
    - [Self-Concept, Behavioral Intention, +]
    - [Prior Behavior Frequency, Habit, +]
    - [Behavioral Intention, Behavior, +]
    - [Habit, Behavior, +]
    - [Facilitating Conditions, Behavior, +]
    - [Facilitating Conditions, Behavioral Intention -> Behavior, m]
    - [Facilitating Conditions, Habit -> Behavior, m]
    - [Habit, Behavioral Intention -> Behavior, m]
    refs:
    - {title: Theory of Interpersonal Behavior (IS Theories wiki), url: 'https://is.theorizeit.org/wiki/Theory_of_Interpersonal_Behavior_(TIB)'}
    - {title: 'Habit and intention interaction review (UCL Discovery, spc3.12553)', url: 'https://discovery-pp.ucl.ac.uk/10107821/1/spc3.12553.pdf'}
    - {title: TIB applied to software piracy (Wits WIReDSpace), url: 'https://wiredspace.wits.ac.za/items/abf56858-94d8-4d4c-b176-edc76ce60411'}
    enrich_notes: 原六條保留。Triandis 的公式是 P = (wH·H + wI·I)·F，促成條件是乘項，所以除了保留直接邊也加上兩條調節邊；社會因素拆成規範、角色、自我概念三個子成分；補習慣的前因（過去行為頻率）與習慣—意圖交互（習慣越強意圖效果越弱），後者在
      2020 年 52 篇研究的回顧中結果混雜。
  T SCT Social Cognition Theory:
    note: T SCT Social Cognition Theory
