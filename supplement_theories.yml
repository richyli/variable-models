  Attribution Theory:
    note: Attribution Theory
    abbr: AttrT
    zh: 歸因理論
    field: 社會心理
    edges:
    - [Locus, Responsibility Attribution, +]
    - [Controllability, Responsibility Attribution, +]
    - [Stability, Expectancy, +]
    - [Valence, Stability -> Expectancy, m]
    - [Locus, Emotions, +]
