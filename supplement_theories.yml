    enrich_notes: 原四條保留，把「心理社會結果→個人價值」拆成經過工具性價值再到終極價值（Personal Values 在此指終極價值），並補屬性直接連到心理社會結果（階梯圖常見的跨層連結）。MEC 本身是認知結構模型，原文沒有「→購買意圖」這條，保留它是依常見實證版本（價值引導選擇）。
