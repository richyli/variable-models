    desc: Akerlof（1970）、Spence（1973）與 Stiglitz（1976）建立：交易一方資訊較多時，交易前產生逆選擇、交易後產生道德危機，使市場效率下降甚至崩解；有成本的訊號、篩選、監督與結果導向契約可以縮小資訊落差或抑制投機。
    refs:
    - {title: 'Wikipedia: Information asymmetry', url: 'https://en.wikipedia.org/wiki/Information_asymmetry'}
    - {title: 'Nobel Prize 2001 award ceremony speech (Akerlof, Spence, Stiglitz)', url: 'https://www.nobelprize.org/prizes/economic-sciences/2001/ceremony-speech/'}
    - {title: 'Economics Online: Using Asymmetric Information To Understand How Markets Work', url: 'https://economicsonline.co.uk/labour_markets/assymetricinfomrationinmarkets.html'}
    enrich_notes: 保留原五條。補 Moral Hazard -> Market Efficiency（−）讓兩種失靈都接到結果；補 Spence 的「訊號要有成本才可信」（Signal Cost -> Signal Credibility）；補代理理論慣用的兩個道德危機對策（Monitoring、Outcome-based
      Contract，皆為名單既有變數）；補資訊不對稱提高交易成本與投機行為（名單既有）。原理論沒有正負號的量化版本，方向依標準教科書敘述決定。
