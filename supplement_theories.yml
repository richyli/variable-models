    enrich_notes: 原六條保留，三個前因正是 Rhoades 與 Eisenberger（2002）meta-analysis 的分類。補上組織支持理論的核心中介「回報義務感」（Felt Obligation）與其三個結果，以及工作滿意、公民行為兩個常見結果。Kurtessis
