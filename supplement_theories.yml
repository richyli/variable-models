    - [Responsibility Attribution, Donation, +]
    - [Identified Victim, Perceived Efficacy, +]
    - [Perceived Efficacy, Donation, +]
    refs:
    - {title: Identifiable victim effect - Wikipedia, url: 'https://en.wikipedia.org/wiki/Identifiable_victim_effect'}
    - {title: 'Small, Loewenstein & Slovic (2007) Sympathy and callousness (PDF)', url: 'https://faculty.wharton.upenn.edu/wp-content/uploads/2012/04/Sympathy_and_callousness.pdf'}
    enrich_notes: 原第四條 [Deliberative Thinking, Emotions, m, Identified Victim] 格式反了，改寫成深思調節「可辨識受害者→情緒」。Emotions 在此指同情。依 Wikipedia
      補單一性效應（Number of Victims，新造，人數越多同情越淡）、知覺責任（Responsibility Attribution，此處指捐款者對受害者的責任感，非歸咎受害者）與知覺影響力（Perceived Efficacy）兩條中介；後者僅一篇研究支持，證據較弱。
