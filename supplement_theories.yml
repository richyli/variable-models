    - [Learning Pressure, AI Anxiety, +]
    - [Sociotechnical Blindness, AI Anxiety, +]
    - [AI Configuration Concern, AI Anxiety, +]
    - [AI Literacy, AI Anxiety, '-']
    - [Self-Efficacy, AI Anxiety, '-']
    - [AI Anxiety, Attitude, '-']
    - [AI Anxiety, Motivation, '-']
    - [AI Anxiety, Behavioral Intention, '-']
    - [AI Anxiety, AI Avoidance, +]
