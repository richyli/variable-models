Willingness to Pay:
  zh: ''
  scales:
  - name: 非態度量表；常見操作化：開放式陳述 WTP（contingent valuation）、Van Westendorp (1976)
    source: 非態度量表；常見操作化：開放式陳述 WTP（contingent valuation）、Van Westendorp (1976) Price Sensitivity Meter 四題、BDM 拍賣、CBC
