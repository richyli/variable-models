  "Psychological Contract Breach":
    abbr: PCB
    zh: 心理契約違反
    field: 組織行為
    desc: Robinson & Rousseau（1994）；Zhao et al.（2007）：知覺到組織未履行承諾引發違反感，降低滿意、承諾與公民行為，提高離職意圖。
    edges:
      - [Unmet Promises, Psychological Contract Breach, "+"]
      - [Psychological Contract Breach, Violation Feelings, "+"]
      - [Violation Feelings, Job Satisfaction, "-"]
      - [Violation Feelings, Affective Commitment, "-"]
      - [Violation Feelings, Turnover Intention, "+"]
      - [Violation Feelings, Organizational Citizenship Behavior, "-"]
  "Goal-Setting Theory":
    abbr: GST
    zh: 目標設定理論
    field: 組織行為
    desc: Locke & Latham（1990, 2002）：具體且困難的目標在承諾與回饋下提高績效；任務複雜度削弱效果。
    edges:
      - [Goal Specificity, Job Performance, "+"]
      - [Goal Difficulty, Job Performance, "+"]
