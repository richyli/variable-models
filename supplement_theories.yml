  T EVT Expectancy-Value:
    note: T EVT Expectancy-Value
    abbr: EVT
    zh: 期望價值理論
    field: ''
    edges:
    - [Past Performance, Self-Efficacy, +]
    - [Self-Efficacy, Expectancy, +]
    - [Social Environment, Expectancy, +]
    - [Social Environment, Value, +]
    - [Intrinsic Value, Value, +]
    - [Attainment Value, Value, +]
    - [Utility Value, Value, +]
    - [Perceived Cost, Value, '-']
    - [Expectancy, Motivation, +]
    - [Value, Motivation, +]
    - [Expectancy, Value -> Motivation, m]
    - [Motivation, Task Choice, +]
    - [Motivation, Persistence, +]
    - [Motivation, Learning Performance, +]
    desc: Atkinson（1957）奠基、Eccles 等人（1983）發展的期望價值理論主張，個人對成功的期望與對任務的主觀價值（成就、內在、效用價值與代價）共同決定選擇、堅持與表現；期望與價值又由先前成就、能力信念與社會化者的影響塑造。
    refs:
    - {title: Expectancy-value theory - Wikipedia, url: 'https://en.wikipedia.org/wiki/Expectancy-value_theory'}
    - {title: Wigfield & Eccles (2000) Expectancy-Value Theory of Achievement Motivation (PDF), url: 'https://eclass-b.uoa.gr/modules/document/file.php/PPP387/Expectancy_Value_Theory_of_Achievement_M.pdf'}
    - {title: 'Situated Expectancy-Value Theory (Eccles & Wigfield 2020, PDF)', url: 'https://msofc.org/wp-content/uploads/2022/08/2020-Situated-Expectancy-Value-Theory.pdf'}
    enrich_notes: 原檔四條邊有兩條符號空白的重複，合併為 Expectancy -> Motivation (+)、Value -> Motivation (+)。依 Eccles 模型補前因：先前成就與能力信念（以名單中的
      Past Performance、Self-Efficacy 代表）、社會化者與文化環境（以 Social Environment 代表）；主觀任務價值四成分 Intrinsic／Attainment／Utility Value 與
      Cost（Perceived Cost 沿用名單，方向為負）；結果為選擇、堅持、表現（Task Choice、Persistence 新造，Learning Performance 沿用）。期望×價值的乘積項（Nagengast et
      al. 2011）以 Expectancy 調節 Value -> Motivation 表示。Motivation 在原模型不是獨立構念，是沿用現有檔案的中介節點。
  T TOE Technology–Organization–Environment:
    note: T TOE Technology–Organization–Environment
    abbr: TOE
    zh: 科技－組織－環境架構
    field: ''
    edges:
    - [Relative Advantage, Technology, +]
    - [Compatibility, Technology, +]
    - [Complexity, Technology, '-']
