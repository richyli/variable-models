  Perceptual Load Theory:
    note: Perceptual Load Theory
    abbr: PLT
    name: Perceptual Load Theory
    zh: 知覺負荷理論
    field: 視知覺
    desc: Lavie（1995）主張知覺容量有限且會被用盡：相關刺激優先處理，剩餘容量自動流向干擾物。知覺負荷高時容量被目標耗盡，干擾物早期即被濾除；負荷低時干擾物被處理而造成干擾。Lavie 等（2004）補充工作記憶負荷反而增加干擾。
    edges:
    - [Perceptual Load, Spare Attentional Capacity, '-']
    - [Spare Attentional Capacity, Distractor Processing, +]
    - [Distractor Processing, Distractor Interference, +]
    - [Perceptual Load, Distractor Interference, '-']
    - [Working Memory Load, Distractor Interference, +]
    - [Distractor Interference, Reaction Time, +]
    - [Distractor Interference, Decision Accuracy, '-']
    - [Perceptual Load, Unexpected Object Noticing, '-']
    - [Distractor Salience, Perceptual Load -> Distractor Interference, m]
    refs:
    - {title: Perceptual load theory (Wikipedia), url: 'https://en.wikipedia.org/wiki/Perceptual_load_theory'}
    - {title: Lavie et al. (2004) Load theory of selective attention and cognitive control (Goldsmiths repository), url: 'https://research.gold.ac.uk/id/eprint/424'}
    enrich_notes: 批評：干擾物顯著性與注意範圍（zoom）可能才是真正機制；Benoni 與 Tsal（2013）指出知覺負荷從未被精確定義，有循環論證之虞。
  Signal Detection Theory:
    note: Signal Detection Theory
    abbr: SDT
    name: Signal Detection Theory
    zh: 訊號偵測理論
    field: 視知覺
    desc: Green 與 Swets（1966）把偵測判斷拆成敏感度與反應偏誤兩個獨立成分：訊號強度與雜訊決定可區辨度 d'，而事前機率與漏報／誤報的代價決定判準 c；判準越寬鬆，命中率與誤報率同時上升，判準變化不改變敏感度。
    edges:
    - [Signal Strength, Sensitivity, +]
    - [Noise Level, Sensitivity, '-']
    - [Sensitivity, Hit Rate, +]
    - [Sensitivity, False Alarm Rate, '-']
    - [Response Criterion, Hit Rate, '-']
    - [Response Criterion, False Alarm Rate, '-']
    - [Signal Prior Probability, Response Criterion, '-']
    - [Miss Cost, Response Criterion, '-']
    - [False Alarm Cost, Response Criterion, +]
    refs:
    - {title: Detection theory (Wikipedia), url: 'https://en.wikipedia.org/wiki/Detection_theory'}
    - {title: 'Signal Detection Theory tutorial (WISE, Claremont Graduate University)', url: 'https://wise.cgu.edu/wise-tutorials/tutorial-signal-detection-theory/signal-detection-summary-and-follow-up-questions/'}
    enrich_notes: d' = z(H) − z(F)；c = −[z(H) + z(F)] / 2；Response Criterion 取值越高代表越保守。四種結果：命中、漏報、誤報、正確拒絕。Wikipedia 另提到經驗、預期與疲勞會移動判準，但方向不定，未畫成邊。
  Fitts's Law:
    note: Fitts's Law
    abbr: Fitts
    name: Fitts's Law
    zh: 費茨定律
    field: 人機互動
    desc: Fitts（1954）以資訊理論類比指向動作：移動時間隨目標距離增加、隨目標寬度減少，兩者合成的難度指數與時間成線性關係；MacKenzie（1992）提出的 Shannon 形式成為人機互動界預測點選效率與介面配置的標準模型。
    edges:
    - [Target Distance, Index of Difficulty, +]
    - [Target Width, Index of Difficulty, '-']
    - [Index of Difficulty, Movement Time, +]
    - [Target Distance, Movement Time, +]
    - [Target Width, Movement Time, '-']
    - [Movement Time, Endpoint Error, '-']
    refs:
    - {title: Fitts's law (Wikipedia), url: 'https://en.wikipedia.org/wiki/Fitts%27s_law'}
    - {title: MacKenzie (1992) Fitts' law as a research and design tool in HCI (York University), url: 'https://www.yorku.ca/mack/hci1992.html'}
    enrich_notes: 原式 MT = a + b·log2(2D/W)；Shannon 形式 ID = log2(D/W + 1)，MT = a + b·ID；吞吐量 TP = ID/MT；有效寬度 We = 4.133·SDx
      處理速度－準確度取捨（ISO 9241-9）。
  Hick-Hyman Law:
    note: Hick-Hyman Law
    abbr: Hick
    name: Hick-Hyman Law
    zh: 希克－海曼定律
    field: 人機互動
    desc: Hick（1952）與 Hyman（1953）發現選擇反應時間與選項所含的資訊量成線性關係：等機率選項每增加一倍，反應時間約增加固定量；選項機率不均會降低資訊量，刺激－反應相容性高亦縮短時間。介面選單與導覽層級設計常據此推估。
    edges:
    - [Number of Alternatives, Stimulus Information Entropy, +]
    - [Choice Probability Inequality, Stimulus Information Entropy, '-']
    - [Stimulus Information Entropy, Choice Reaction Time, +]
    - [Number of Alternatives, Choice Reaction Time, +]
    - [Stimulus-Response Compatibility, Choice Reaction Time, '-']
    refs:
    - {title: Hick's law (Wikipedia), url: 'https://en.wikipedia.org/wiki/Hick%27s_law'}
    - {title: Hick-Hyman Law theory page (Virtual Labs IIT Guwahati), url: 'https://cpe-iitg.vlabs.ac.in/exp/hick-hymans-law/theory.html'}
    enrich_notes: RT = a + b·log2(n + 1)（等機率 n 個選項，+1 代表「是否要反應」的不確定）；一般式 RT = a + b·H，H = Σ p_i·log2(1/p_i + 1)。
  Stevens's Power Law:
    note: Stevens's Power Law
    abbr: Stevens
    name: Stevens's Power Law
    zh: 史蒂文斯冪定律
    field: 視知覺
    desc: Stevens（1957）以量值估計法主張知覺量是刺激物理量的冪函數，指數隨感覺向度而異：視覺長度約 1（線性）、面積約 0.7（低估大值）、亮度約 0.33–0.5、電擊 3.5；圖表以面積或亮度編碼數值時會系統性壓縮差異。
    edges:
    - [Stimulus Intensity, Perceived Magnitude, +]
    - [Modality Exponent, Stimulus Intensity -> Perceived Magnitude, m]
    - [Area Encoding, Estimation Error, +]
    - [Color Saturation Encoding, Estimation Error, +]
    - [Length Encoding, Estimation Error, '-']
    - [Estimation Error, Perceptual Judgment Accuracy, '-']
    refs:
    - {title: Stevens's power law (Wikipedia), url: 'https://en.wikipedia.org/wiki/Stevens%27s_power_law'}
    - {title: Stevens' Power Law (RIT Vision and Psychophysics course page), url: 'https://www.cis.rit.edu/people/faculty/montag/vandplite/pages/chap_6/ch6p10.html'}
    enrich_notes: ψ(I) = k·I^a。指數表（Stevens 1957）：視覺長度 1、視覺面積 0.7、亮度 0.33（5° 暗背景）～0.5（點光源）、響度 0.67、電擊 3.5。指數 < 1 為壓縮型，大值被低估。
  Weber-Fechner Law:
    note: Weber-Fechner Law
    abbr: Weber
    name: Weber-Fechner Law
    zh: 韋伯－費希納定律
    field: 視知覺
    desc: Weber 的實驗與 Fechner（1860）的推導指出：剛可察覺差異與基準刺激強度成固定比例（韋伯分數），因此知覺量約為刺激強度的對數函數。圖表上相同的絕對差距，在數值較大處較難被看出；此定律在極低與極高強度處失效。
    edges:
    - [Stimulus Intensity, Just Noticeable Difference, +]
    - [Weber Fraction, Just Noticeable Difference, +]
    - [Stimulus Intensity, Perceived Magnitude, +]
    - [Just Noticeable Difference, Difference Detection Rate, '-']
    - [Baseline Value Magnitude, Difference Detection Rate, '-']
    - [Difference Detection Rate, Perceptual Judgment Accuracy, +]
    refs:
    - {title: Weber–Fechner law (Wikipedia), url: 'https://en.wikipedia.org/wiki/Weber%E2%80%93Fechner_law'}
    - {title: 'What is the Weber-Fechner Law? (The Behavioral Scientist)', url: 'https://www.thebehavioralscientist.com/?p=5977'}
    enrich_notes: Weber：ΔI / I = k；Fechner：p = k·ln(S / S0)。1960 年代後多以 Stevens 冪定律取代對數律作為通則；韋伯分數例：重量約 2%、亮度約 8%（二手來源，僅示意）。
  Data-Ink ratio:
    note: Data-Ink ratio
    abbr: DataInk
    name: Data-Ink Ratio / Graphical Minimalism
    zh: 資料墨水比（圖表極簡主義）
    field: 資訊視覺化
    desc: Tufte（1983）主張圖表的墨水應盡量用於呈現資料：資料墨水佔總墨水的比例越高越好，網格、框線、立體效果等非資料墨水與多餘裝飾（chartjunk）應在合理範圍內刪除；資料墨水是「移除後訊息會改變」的部分，裝飾會增加雜訊並干擾判讀。
    edges:
    - [Data Ink, Data-Ink Ratio, +]
    - [Non-Data Ink, Data-Ink Ratio, '-']
    - [Chartjunk, Visual Clutter, +]
    - [Redundant Data Ink, Visual Clutter, +]
    - [Direct Labeling, Visual Clutter, '-']
    - [Visual Clutter, Cognitive Load, +]
    - [Visual Clutter, Graph Comprehension, '-']
    - [Data-Ink Ratio, Graph Comprehension, +]
    - [Lie Factor, Estimation Error, +]
    refs:
    - {title: Chart junk and data ink origins (EU Data Visualisation Guide), url: 'https://data.europa.eu/apps/data-visualisation-guide/chart-junk-and-data-ink-origins'}
    - {title: Clutter in charts (Nielsen Norman Group), url: 'https://www.nngroup.com/articles/clutter-charts/'}
    enrich_notes: Tufte 五原則：首重呈現資料、最大化資料墨水比、刪非資料墨水、刪多餘資料墨水、反覆修訂。反證：Bateman 等（2010）發現裝飾圖表記憶效果較好（本次未開到原文，僅依既有知識標註，見 _summary）。EU
      指南亦提到反對極簡風的「反運動」。
  Narrative Visualization:
    note: Narrative Visualization
    abbr: NarrVis
    name: Narrative Visualization
    zh: 敘事視覺化
    field: 資訊視覺化
    desc: Segel 與 Heer（2010）分析新聞與研究案例，提出敘事視覺化設計空間：七種類型與視覺敘事（結構、強調、轉場）及敘事結構（排序、互動、訊息）兩組策略，核心張力是作者主導的敘事流與讀者主導的互動探索，可用「馬丁尼杯」等混合結構平衡。
    edges:
    - [Narrative Ordering Strength, Author Control, +]
    - [Messaging Density, Author Control, +]
    - [Reader Interactivity, Author Control, '-']
    - [Reader Interactivity, Story Discovery, +]
    - [Story Discovery, User Engagement, +]
    - [Narrative Ordering Strength, Message Comprehension, +]
    - [Messaging Density, Message Comprehension, +]
    - [Visual Highlighting, Attentional Capture, +]
    - [Transition Guidance, Cognitive Load, '-']
    - [Hybrid Narrative Structure, Reader Interactivity -> Message Comprehension, m]
    refs:
    - {title: 'Narrative Visualization: Telling Stories with Data (UW Interactive Data Lab)', url: 'https://idl.uw.edu/papers/narrative'}
    - {title: Heer and Segel honored with IEEE VIS Test of Time Award (UW CSE News), url: 'https://news.cs.washington.edu/?p=30270'}
    - {title: Segel & Heer 2010 PDF, url: 'https://homes.cs.washington.edu/~jheer/files/narrative.pdf'}
    enrich_notes: 七類型：雜誌式、註解圖表、分割海報、流程圖、漫畫格、投影片秀、影片／動畫。三種混合結構：馬丁尼杯（先作者後讀者）、互動投影片（逐頁交替）、下鑽故事（讀者主導）。原文屬設計空間分析，結果變數的方向依後續實證常見版本（見
      _summary）。
  Visual Information-Seeking Mantra Shneiderman:
    note: Visual Information-Seeking Mantra Shneiderman
    abbr: VISM
    name: Visual Information-Seeking Mantra
    zh: 視覺資訊搜尋箴言
    field: 資訊視覺化
    desc: Shneiderman（1996）提出「先總覽，再縮放與過濾，最後按需顯示細節」作為視覺化介面的設計起點，並以七種資料型態對七種任務（總覽、縮放、過濾、按需細節、關聯、歷史、擷取）建立分類；搭配 100 毫秒內回應的動態查詢。
    edges:
    - [Overview Provision, Mental Model Formation, +]
    - [Zoom Capability, Information Access, +]
    - [Filter Capability, Visual Clutter, '-']
    - [Filter Capability, Cognitive Load, '-']
    - [Details-on-Demand, Information Access, +]
    - [Details-on-Demand, Visual Clutter, '-']
    - [Dynamic Query Responsiveness, Exploration Breadth, +]
    - [Mental Model Formation, Insight Generation, +]
    - [Exploration Breadth, Insight Generation, +]
    refs:
    - {title: The Eyes Have It (UMD DRUM record), url: 'https://drum.lib.umd.edu/items/155a868e-fb83-4115-9899-9187ea8c0498/full'}
    - {title: The Eyes Have It PDF (Utrecht University course copy), url: 'https://webspace.science.uu.nl/~telea001/uploads/VACourse/Shneiderman96.pdf'}
    enrich_notes: 原文把箴言定位為「起點」而非完整理論；結果端（心智模式、洞見）為常見的實證化寫法。
  Information Foraging Theory:
    note: Information Foraging Theory
    abbr: IFT
    name: Information Foraging Theory
    zh: 資訊覓食理論
    field: 人機互動
    desc: Pirolli 與 Card（1999）借最佳覓食理論解釋資訊搜尋：人會調整行為以最大化每單位努力的資訊獲得率。資訊氣味（連結標籤等近端線索）引導路徑選擇；片區產出遞減到低於環境平均時就離開；跨片區成本越低停留越短；食譜依價值／耗時比取捨。
    edges:
    - [Information Scent, Link Following, +]
    - [Information Scent, Path Selection Accuracy, +]
    - [Information Scent Accuracy, Backtracking, '-']
    - [Patch Yield Rate, Patch Residence Time, +]
    - [Between-Patch Cost, Patch Residence Time, +]
    - [Environment Average Gain Rate, Patch Leaving, +]
    - [Information Handling Time, Item Profitability, '-']
    - [Item Profitability, Information Diet Inclusion, +]
    - [Path Selection Accuracy, Information Gain Rate, +]
    - [Patch Residence Time, Patch Yield Rate -> Information Gain Rate, m]
    refs:
    - {title: Information foraging (Wikipedia), url: 'https://en.wikipedia.org/wiki/Information_foraging'}
    - {title: Information Foraging Theory (UX Tigers), url: 'https://www.uxtigers.com/post/information-foraging'}
    enrich_notes: 離開片區的判準為 Charnov 邊際價值定理：片區瞬時獲得率降到環境平均時離開。計算實作為 ACT-IF 產生式模型。
  graph comprehension theory:
    note: graph comprehension theory
    abbr: GraphComp
    name: Graph Comprehension Theory
    zh: 圖表理解理論
    field: 資訊視覺化
    desc: Pinker（1990）主張讀圖是把視覺陣列編碼成視覺描述，再經圖表基模轉譯為概念訊息，編碼與基模相符的訊息才能直接讀出；Shah 與 Hoeffner（2002）補充圖表視覺特徵、讀圖知識與內容先備期望三類因素共同決定理解。
    edges:
    - [Graph Format Familiarity, Graph Schema Availability, +]
    - [Graphical Literacy, Graph Schema Availability, +]
    - [Graph Schema Availability, Graph Comprehension, +]
    - [Axis Variable Assignment Match, Visual Description Directness, +]
    - [Encoding Channel Rank, Visual Description Directness, +]
    - [Visual Description Directness, Graph Comprehension, +]
    - [Visual Description Directness, Cognitive Load, '-']
    - [Cognitive Load, Graph Comprehension, '-']
    - [Topic Knowledge, Graph Comprehension, +]
    - [Data Expectation Bias, Graph Comprehension, '-']
    - [Working Memory Capacity, Graph Comprehension, +]
    refs:
    - {title: A Theory of Graph Comprehension (Steven Pinker publications), url: 'https://stevenpinker.com/publications/theory-graph-comprehension'}
    - {title: 'Shah & Hoeffner (2002) Review of Graph Comprehension Research (Deep Blue, University of Michigan)', url: 'https://deepblue.lib.umich.edu/items/e347a2b5-1625-442e-9fe3-d09575ad97df'}
    enrich_notes: Shah 與 Carpenter（1995）發現折線圖讀者主要描述 x–y 關係，第三變數（以線區分）的趨勢難以讀出，故變數在軸上的配置會改變能直接讀出的訊息。Pinker 全文（MIT 轉址 PDF）與 Shah
      & Hoeffner 全文本次未能開啟，依摘要與二手整理。
  Picture Superiority Effect:
    note: Picture Superiority Effect
    abbr: PSE
    name: Picture Superiority Effect
    zh: 圖優效應
    field: 視知覺
    desc: Paivio 與 Csapo（1973）等發現圖片比對應文字更容易被回憶與再認；雙碼理論解釋為圖片同時產生意象碼與語文碼、多一條檢索路徑，Nelson 則歸因於圖片知覺上更獨特且直接觸及語意。效應限於具體概念，圖片相似時消失。
    edges:
    - [Pictorial Presentation, Dual Coding, +]
    - [Pictorial Presentation, Mental Imagery, +]
    - [Pictorial Presentation, Perceptual Distinctiveness, +]
    - [Dual Coding, Recall, +]
    - [Mental Imagery, Recall, +]
    - [Perceptual Distinctiveness, Recognition Memory, +]
    - [Dual Coding, Recognition Memory, +]
    - [Concept Concreteness, Pictorial Presentation -> Recall, m]
    - [Inter-Item Similarity, Pictorial Presentation -> Recognition Memory, m]
    - [Response Deadline Length, Pictorial Presentation -> Recall, m]
    refs:
    - {title: Picture superiority effect (Wikipedia), url: 'https://en.wikipedia.org/wiki/Picture_superiority_effect'}
    - {title: Dual-coding theory (Wikipedia), url: 'https://en.wikipedia.org/wiki/Dual-coding_theory'}
    enrich_notes: 反應期限極短時效應可逆轉（文字較快）；層次處理論者指出語意處理指示下圖文回憶相近；流行文章「圖片記得多六倍」之類倍數不可信。
  inattentional blindness:
    note: inattentional blindness
    abbr: IB
    name: Inattentional Blindness
    zh: 不注意視盲
    field: 視知覺
    desc: Mack 與 Rock（1998）命名並主張「沒有注意就沒有意識知覺」；Simons 與 Chabris（1999）發現約半數專注數傳球的人沒看見走過的大猩猩。注意被主任務佔用越多、物體越不顯著、與注意集合越不相似、越不被預期，越容易漏看。
    edges:
    - [Primary Task Attentional Engagement, Unexpected Object Noticing, '-']
    - [Workload, Unexpected Object Noticing, '-']
    - [Stimulus Conspicuity, Unexpected Object Noticing, +]
    - [Similarity to Attended Set, Unexpected Object Noticing, +]
    - [Object Expectancy, Unexpected Object Noticing, +]
    - [Attentional Capacity, Unexpected Object Noticing, +]
    - [Age, Attentional Capacity, '-']
    - [Experience, Unexpected Object Noticing, +]
    - [Unexpected Object Noticing, Anomaly Detection, +]
    refs:
    - {title: Inattentional blindness (Wikipedia), url: 'https://en.wikipedia.org/wiki/Inattentional_blindness'}
    - {title: Gorillas in our midst (Simons & Chabris 1999) record, url: 'https://www.citedrive.com/en/discovery/gorillas-in-our-midst-sustained-inattentional-blindness-for-dynamic-events/'}
    enrich_notes: Most 等（2001）：與注意集合相似者較易被注意到。Drew、Võ 與 Wolfe（2013）放射科醫師讀 CT 時 83% 未見嵌入的大猩猩（單一研究）。Experience 邊：Wikipedia 稱任務經驗有助注意到意外事件，但也指出專家因知道該看什麼反而可能漏看，方向有爭議。
  Proximity Compatibility Principle:
    abbr: PCP
    name: Proximity Compatibility Principle
    zh: 鄰近相容原則
    field: 人因工程
    desc: Wickens 與 Carswell（1995）主張服務同一任務或心智運算的資訊應在知覺空間上靠近呈現：任務需整合多來源時，空間靠近、共用色彩、連線或合成單一物件的高顯示鄰近有利；任務只需聚焦單一來源時，整合式顯示反而造成干擾。
    edges:
    - [Task Integration Requirement, Task Proximity, +]
    - [Spatial Closeness, Display Proximity, +]
    - [Shared Color Coding, Display Proximity, +]
    - [Element Connectedness, Display Proximity, +]
    - [Object Integration, Display Proximity, +]
    - [Display Proximity, Visual Scanning Cost, '-']
    - [Visual Scanning Cost, Integration Task Performance, '-']
    - [Display Proximity, Integration Task Performance, +]
    - [Display Proximity, Focused Attention Task Performance, '-']
    - [Task Proximity, Display Proximity -> Integration Task Performance, m]
    refs:
    - {title: 'The Proximity Compatibility Principle: Its Psychological Foundation and Relevance to Display Design (TRID record)',
      url: 'https://trid.trb.org/View/452882'}
    - {title: Wickens & Carswell 1995 abstract (Synapse Social paper page), url: 'https://synapsesocial.com/papers/W2053229400'}
    enrich_notes: Human Factors 37(3), 473–494。交叉互動的描述來自 Wickens（1990）技術報告與後續整理，本次只開到摘要；三維航空顯示器與醫療診斷研究對原則僅部分支持。vault 無對應 note，id
      用理論名。
  Multiple Resource Theory:
    abbr: MRT
    name: Multiple Resource Theory
    zh: 多重資源理論
    field: 人因工程
    desc: Wickens（1980、2008）主張注意資源沿處理階段（知覺／認知 vs. 反應）、模態（視覺 vs. 聽覺）、處理碼（空間 vs. 語文）與視覺通道（中央 vs. 周邊）四向度分池；兩任務需求越高、資源重疊越多，分時效率越差。
    edges:
    - [Resource Demand, Dual-Task Interference, +]
    - [Resource Overlap, Dual-Task Interference, +]
    - [Modality Sharing, Resource Overlap, +]
    - [Processing Code Sharing, Resource Overlap, +]
    - [Processing Stage Sharing, Resource Overlap, +]
    - [Visual Channel Sharing, Resource Overlap, +]
    - [Experience, Resource Demand, '-']
    - [Resource Demand, Workload, +]
    - [Dual-Task Interference, Time-Sharing Efficiency, '-']
    - [Time-Sharing Efficiency, Dual-Task Performance, +]
    - [Resource Allocation Policy, Resource Demand -> Dual-Task Interference, m]
    refs:
    - {title: 'Education Theory Made Practical: Multiple Resource Theory (ICE Blog)', url: 'https://icenet.blog/2020/03/10/education-theory-made-practical-volume-4-part-6/'}
    - {title: 'Wickens (2008) Multiple Resources and Mental Workload, Human Factors 50(3) PDF', url: 'https://interruptions.net/literature/Wickens-HF08.pdf'}
    enrich_notes: 三個干擾決定因子：資源需求、資源重疊（衝突）、分配策略。Wickens 2008 PDF 本次只讀到檔案中繼資料（標題、作者、關鍵詞），四向度內容依 ICE Blog 與搜尋摘要整理；早期版本為三向度，視覺通道為後加。vault
      無對應 note，id 用理論名。
  Cognitive Offloading:
    note: Cognitive Offloading
    abbr: CogOff
    name: Cognitive Offloading
    zh: 認知卸載
    field: 認知心理學
    desc: Risko 與 Gilbert（2016）將認知卸載定義為以身體動作（寫備忘、拍照、使用工具）改變任務的資訊處理需求以降低認知負擔；人在認為卸載比靠自身能力更有效率時會卸載，但此判斷不一定準確；卸載可擴大表現，卻削弱對已卸載資訊的記憶。
