    enrich_notes: Healey 與 Enns 列出的前注意特徵：色相、亮度、方向、長度、大小、曲率、閃爍、動態、立體深度等；後續文獻質疑前注意／注意的二分，但作為搜尋效率的操作概念仍有用。
