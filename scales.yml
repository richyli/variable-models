Expectancy Violation:
  zh: ''
  scales:
  - name: Burgoon & Le Poire (1993)
    source: Burgoon & Le Poire (1993) Human Communication Research 20(1) 之 expectancy (dis)confirmation 量測；Afifi
      & Metts (1998) 以回憶事件編碼
    url: https://en.wikipedia.org/wiki/Expectancy_violations_theory
    verified: false
