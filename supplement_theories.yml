      −），以及需求滿足直接與經由動機兩條通往幸福感的路，與動機→持續行為。
    book_check: Miles 2012 第 28 章對照：補 8 條邊；書中變數我們原本沒有的：Need Satisfaction、Intrinsic Motivation、Extrinsic Motivation、Autonomous
      Motivation、Controlled Motivation、Amotivation、Causality Orientation、Intrinsic Aspirations、Extrinsic Aspirations、Mindfulness、Vitality、Anxiety、Depression。三需求滿足→績效、健康、幸福感為書上明寫（p247,
      p253）；為守 8 條上限未入邊但書上明寫：Need Satisfaction→Vitality「+」（能量來自需求滿足）、Need Satisfaction→Amotivation「-」（三需求皆未滿足→amotivation，p249）、Extrinsic
      Aspirations→Depression「+」（與 Anxiety 同段，p248）；Mindfulness→Autonomous Motivation「+」依 p249「從受控取向有目的地移向自主取向」推。內在／外在志向對幸福與焦慮憂鬱的效果出自
      Kasser & Ryan、Vansteenkiste et al.（p248）。Controlling Rewards→Intrinsic Motivation 負向：書上只在管理意涵節說為獎懲而做的行為在獎懲移除後就停止（p253），加上
      Measuring Variables 的 Stone et al.（2010）財務誘因效果不穩定，這條是依 SDT 標準主張補的，書上沒直接寫「獎賞削弱內在動機」。Autonomy、Competence、Relatedness 在我們清單裡已有，但沒有彙總的
      Need Satisfaction，也沒有動機連續體上的任何一個構念（內在／外在／自主／受控／無動機），這是最大的缺口。四種外在動機調節（整合、認同、內攝、外部）屬連續體的刻度，不另列變數。Measuring Variables：Gagné
      et al. 2010 工作動機量表、La Guardia et al. 2000 需求滿足量表、Elliot & McGregor 2001 成就目標問卷、Lin, Tsai & Chiu 2009（SDT＋ECT 顧客忠誠）、Stone
