      Variables 的 Niehoff & Moorman（1993）與 Skarlicki & Folger（1997）量表標題，方向是我依標題推的。書上另有批評：程序與分配正義相關極高、可能只是單一因子（p202）。Measuring
      Variables：Colquitt 2001 四構面量表、Niehoff & Moorman 1993 三構面量表、Gilliland 2008 公平容忍區、Skarlicki & Folger 1997 報復量表。
