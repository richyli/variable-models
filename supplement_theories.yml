    desc: Hirschman（1970）提出退出、發聲與忠誠：組織衰退引發的不滿可化為退出（轉向替代者）或發聲（抱怨以求改善），忠誠使人延後退出、提高發聲；替代選項多則退出，發聲成本與成功機會決定發聲，後續研究加上忽視成為 EVLN。
