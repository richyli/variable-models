    - [Shared Values, Trust, +]
    - [Communication, Trust, +]
    - [Opportunistic Behavior, Trust, '-']
    - [Trust, Relationship Commitment, +]
    - [Relationship Commitment, Acquiescence, +]
    - [Relationship Commitment, Customer Retention, +]
    - [Relationship Commitment, Cooperation, +]
    - [Trust, Cooperation, +]
    - [Trust, Functional Conflict, +]
    - [Trust, Behavioral Uncertainty, '-']
    refs:
    - {title: Morgan & Hunt (1994) The Commitment-Trust Theory of Relationship Marketing (constructDB abstract), url: 'https://verdi.cs.ucl.ac.uk/constructDB/publications/morgan-commitmenttrust-1994.html'}
    - {title: 'Antecedents and Consequences of Relationship Commitment and Trust (KMV replication, IIM Indore)', url: 'https://iimidr.ac.in/wp-content/uploads/2019/12/v2012-v4issue2-Antecedents-and-Consequences.pdf'}
    - {title: KMV model application (IMP Group paper), url: 'https://impgroup.org/wp-content/uploads/wpallimport/files/papers/5601.pdf'}
    enrich_notes: 依 KMV 原模型（五前因、兩中介、五結果）補完。刪原 Trust→Customer Retention：原模型中信任對離開傾向只經承諾中介。Propensity to leave 以名單既有 Customer
      Retention（反向）表示。Decision-making uncertainty 以名單既有 Behavioral Uncertainty 表示，概念略寬。新造：Relationship Termination Costs、Relationship
      Benefits、Acquiescence、Cooperation、Functional Conflict。符號依原文假設（H1–H13）。
