    desc: DePietro、Wiarda 與 Fleischer（1990，常被誤引為 Tornatzky 與 Fleischer）提出 TOE 架構：組織採用技術創新同時受技術脈絡（創新特性）、組織脈絡（規模、資源）與環境脈絡（競爭、法規）影響。
    refs:
    - {title: Technology-organization-environment framework - IS Theory (is.theorizeit.org), url: 'https://is.theorizeit.org/wiki/Technology-organization-environment_framework'}
    - {title: Technology–organization–environment framework - Wikipedia, url: 'https://en.wikipedia.org/wiki/Technology%E2%80%93organization%E2%80%93environment_framework'}
    - {title: Technology-Organization-Environment Meta-Review and Construct Analysis (HICSS), url: 'https://scholarspace.manoa.hawaii.edu/items/48cfe3e0-185d-468c-a20c-f3925b37d2ba'}
    enrich_notes: 原檔三條空符號邊與三條正號邊重複，合併為三條脈絡→採用正向邊。原架構只定義三個脈絡與其內涵（技術：內外部可用技術；組織：規模、集權、正式化、人力、閒置資源；環境：產業結構、競爭者、總體經濟、法規），沒有明示方向。這裡依
      IS 實證研究最常用的子構念版本（HICSS 後設回顧）展開：技術脈絡多沿用 DOI 的相對優勢、相容性、複雜性（複雜性為負）；組織脈絡為高層支持、規模、組織就緒度；環境脈絡為競爭壓力、交易夥伴壓力、法規支持（以 Regulation
      沿用名單，實證多做正向支持解）。Top Management Support、Organization Size、Organizational Readiness、Competitive Pressure、Trading Partner
      Pressure 為新造。注意出處常被誤引為 Tornatzky & Fleischer (1990)，實際章節作者是 DePietro, Wiarda & Fleischer。
