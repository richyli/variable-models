      - [Motivator Factors, Job Satisfaction, "+"]
      - [Job Satisfaction, Motivation, "+"]
      - [Job Dissatisfaction, Turnover Intention, "+"]
  "Equity Theory":
    abbr: EqT
    zh: 公平理論（Adams）
    field: 組織行為
    desc: Adams（1965）：投入／產出比與參照對象不相等時產生不公平感，個人會調整投入或離開。
    edges:
      - [Input-Outcome Ratio Discrepancy, Perceived Inequity, "+"]
      - [Perceived Inequity, Motivation, "-"]
      - [Perceived Inequity, Job Satisfaction, "-"]
      - [Perceived Inequity, Turnover Intention, "+"]
      - [Perceived Inequity, Distributive Justice, "-"]
