      Equivocality -> Media Richness）與不確定性驅動資訊量（新造 Information Amount Required）兩條原始命題；Daft, Lengel & Trevino（1987）發現媒介與模糊性相配的管理者績效較高，故加
      Communication Effectiveness -> Job Performance。原理論是配適（fit）命題，這裡用「調節」表示配適。
    book_check: Miles 2012 第 19 章對照：補 8 條邊；書中變數我們原本沒有的：Media-Task Fit、Perceived Media Richness、Critical Mass、Information Processing
      Ability、Media Naturalness、Synchronicity、Reprocessability、Channel Capacity、Content Timeliness、Content Accuracy、Content
      Adaptability。核心主張是適配（fit）：豐富度對溝通效果的影響依任務模糊度而定（模糊訊息需豐富媒介、明確訊息用精簡媒介即可，p.176），所以畫成 Task Equivocality 調節，而不是豐富度直接為正；Media-Task
      Fit→Job Performance 對應 p.176–177「善用媒介的經理人較有效」。四個媒介特性→豐富度是 Daft & Lengel（1984）的定義拆解。Experience→Perceived Media Richness
      來自 Carlson & Zmud（1999）channel expansion（p.177），Experience 沿用既有名稱但書中分成通道、主題、組織脈絡、共同參與者四種經驗。Critical Mass→Adoption（Markus
      1987）、Social Norm→Media Use（Fulk 等社會影響模型、Markus 1994）出自批評節。Media Richness→Motivation 為正、→Information Processing Ability
      為負是 Robert & Dennis（2005）的悖論（p.178）。Media Naturalness→Cognitive Load 為負出自 Kock（2005、2009）：愈不像面對面，認知努力、模糊與生理激發愈高（p.178）。Lan
      & Sie（2010）的四個內容面向與 Mohan 等（2009）的同步性、可再處理性、通道容量只列為缺的變數，書沒給因果。我們清單已有 Media Richness、Task Equivocality、Feedback Immediacy、Multiple
      Cues、Language Variety、Personal Focus、Social Presence，覆蓋度高。
