  T MRT Media Richness Theory:
    note: T MRT Media Richness Theory
    abbr: MRT
    zh: 媒介豐富度理論
    field: 組織傳播
    edges:
    - [Feedback Immediacy, Media Richness, +]
    - [Multiple Cues, Media Richness, +]
    - [Language Variety, Media Richness, +]
    - [Personal Focus, Media Richness, +]
    - [Task Equivocality, Media Richness, +]
    - [Task Uncertainty, Information Amount Required, +]
    - [Media Richness, Communication Effectiveness, +]
    - [Task Equivocality, Media Richness -> Communication Effectiveness, m]
    - [Communication Effectiveness, Job Performance, +]
    - [Task Uncertainty, Media Richness -> Communication Effectiveness, m]
    - [Media-Task Fit, Job Performance, +]
    - [Experience, Perceived Media Richness, +]
    - [Critical Mass, Adoption, +]
    - [Social Norm, Media Use, +]
    - [Media Richness, Motivation, +]
    - [Media Richness, Information Processing Ability, '-']
    - [Media Naturalness, Cognitive Load, '-']
    desc: Daft 與 Lengel（1984, 1986）提出：媒介依回饋即時性、多重線索、語言多樣性與個人化程度分出豐富度高低；任務模糊性高時要用豐富媒介協商共同意義，不確定性高時只需增加資訊量，媒介與任務相配才能提升溝通效能與管理績效。
    refs:
    - {title: 'IS Theories wiki: Media richness theory', url: 'https://is.theorizeit.org/wiki/Media_richness_theory'}
    - {title: 'Daft & Lengel (1986) Organizational Information Requirements, Media Richness and Structural Design', url: 'https://collablab.northwestern.edu//CollabolabDistro/nucmc/DaftAndLengel-OrgInfoReq-MediaRichnessAndStructuralDesign-MngmtSci-1986.pdf'}
    - {title: 'Wikipedia: Media richness theory', url: 'https://en.wikipedia.org/wiki/Media_richness_theory'}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 19 章', url: ''}
    enrich_notes: 保留原有兩條。補上 Daft & Lengel 的四個豐富度判準（新造 Feedback Immediacy、Multiple Cues、Language Variety、Personal Focus）作為媒介豐富度的前因；補上模糊性驅動媒介選擇（Task
      Equivocality -> Media Richness）與不確定性驅動資訊量（新造 Information Amount Required）兩條原始命題；Daft, Lengel & Trevino（1987）發現媒介與模糊性相配的管理者績效較高，故加
      Communication Effectiveness -> Job Performance。原理論是配適（fit）命題，這裡用「調節」表示配適。
    book_check: Miles 2012 第 19 章對照：補 8 條邊；書中變數我們原本沒有的：Media-Task Fit、Perceived Media Richness、Critical Mass、Information Processing
      Ability、Media Naturalness、Synchronicity、Reprocessability、Channel Capacity、Content Timeliness、Content Accuracy、Content
      Adaptability。核心主張是適配（fit）：豐富度對溝通效果的影響依任務模糊度而定（模糊訊息需豐富媒介、明確訊息用精簡媒介即可，p.176），所以畫成 Task Equivocality 調節，而不是豐富度直接為正；Media-Task
      Fit→Job Performance 對應 p.176–177「善用媒介的經理人較有效」。四個媒介特性→豐富度是 Daft & Lengel（1984）的定義拆解。Experience→Perceived Media Richness
      來自 Carlson & Zmud（1999）channel expansion（p.177），Experience 沿用既有名稱但書中分成通道、主題、組織脈絡、共同參與者四種經驗。Critical Mass→Adoption（Markus
      1987）、Social Norm→Media Use（Fulk 等社會影響模型、Markus 1994）出自批評節。Media Richness→Motivation 為正、→Information Processing Ability
      為負是 Robert & Dennis（2005）的悖論（p.178）。Media Naturalness→Cognitive Load 為負出自 Kock（2005、2009）：愈不像面對面，認知努力、模糊與生理激發愈高（p.178）。Lan
      & Sie（2010）的四個內容面向與 Mohan 等（2009）的同步性、可再處理性、通道容量只列為缺的變數，書沒給因果。我們清單已有 Media Richness、Task Equivocality、Feedback Immediacy、Multiple
      Cues、Language Variety、Personal Focus、Social Presence，覆蓋度高。
  T SPT Social Presence Theory:
