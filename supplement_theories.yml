      頁未列、依 Quality Gurus 整理頁與一般教科書版本；只列名單有的 Word of Mouth 與 Communication。服務品質→滿意→忠誠／口碑與服務品質→行為意圖（Zeithaml, Berry & Parasuraman
      1996）是最常見的下游實證版本，非 1988 量表論文本身的命題。
