    enrich_notes: 原五條邊保留。van Doorn 等人的概念模型分顧客面（滿意、信任／承諾、認同、目標與資源、成本效益）、公司面（品牌、聲譽、規模）與脈絡面前因，以及顧客、公司、社會三層後果；兩篇原文 PDF 均無法解析，前因清單依摘要與搜尋摘要。Brodie
      等人主張投入與信任、承諾互為因果（迭代歷程），此處以 Customer Engagement -> Trust (+) 表示回饋，與 Trust -> Customer Engagement 形成環；畫圖若不允許環可刪回饋邊。涉入（Involvement）是
