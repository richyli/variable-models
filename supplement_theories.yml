    edges:
    - [Conjunction Search Requirement, Serial Attention Deployment, +]
    - [Serial Attention Deployment, Search Time, +]
    - [Display Size, Search Time, +]
    - [Conjunction Search Requirement, Display Size -> Search Time, m]
    - [Focused Attention, Feature Binding Accuracy, +]
    - [Divided Attention, Feature Binding Accuracy, '-']
    - [Feature Binding Accuracy, Illusory Conjunctions, '-']
    - [Prior Knowledge Base, Illusory Conjunctions, '-']
    - [Illusory Conjunctions, Perceptual Judgment Accuracy, '-']
    refs:
    - {title: Feature integration theory (Wikipedia), url: 'https://en.wikipedia.org/wiki/Feature_integration_theory'}
    - {title: Treisman & Gelade 1980 PDF (Princeton course archive), url: 'https://www.cs.princeton.edu/courses/archive/spring08/cos598B/Readings/TreismanGelade1980.pdf'}
