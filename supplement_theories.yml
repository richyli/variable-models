    - [Consistency, Locus, +]
    - [Outcome Expectations, Persistence, +]
    desc: Weiner（1985、1995）：人對成敗與他人行為的原因判斷落在內外歸因、穩定性、可控性三個維度；穩定性決定對未來結果的預期，內外歸因與可控性決定責任判斷與情緒（自尊、憤怒、同情、罪惡），預期與情緒再驅動行為。
    refs:
    - {title: 'An attributional theory of achievement motivation and emotion (Weiner, 1985; course copy)', url: 'https://eclass.uoa.gr/modules/document/file.php/PPP387/weinerAnattributionaltheory.pdf'}
    - {title: Attribution (psychology) (Wikipedia), url: 'https://en.wikipedia.org/wiki/Attribution_(psychology)'}
    - {title: 'The role of causal attributions in achievement: meta-analysis (Brun, Pansu & Dompnier, 2021)', url: 'https://serval.unil.ch/notice/serval:BIB_320FF9A6B3AF'}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 6 章', url: ''}
    enrich_notes: 原五條保留四條，刪掉 Stability → Responsibility Attribution：Weiner 的責任判斷由內外歸因與可控性決定，穩定性影響的是預期（expectancy of success），所以改接到既有變數
      Expectancy。Stability → Expectancy 的意思是「穩定原因使人預期同樣結果再發生」，正負要看結果好壞，故用 Valence（結果效價）調節；Valence → Emotions 是 Weiner 的結果依賴情緒（先於歸因）。Brun
      等（2021）的後設分析支持認知→預期→行動的序列。
    book_check: Miles 2012 第 6 章對照：補 9 條邊；書中變數我們原本沒有的：Globality、Intentionality、Task Difficulty、Luck、Consensus、Distinctiveness、Consistency、Helping
      Behavior、Punitive Response、Self-Serving Bias、Fundamental Attribution Error、Actor-Observer Effect、Group-Serving Bias。Locus
      在邊裡編碼為『內在程度』（越高越內在）。書上明寫：成功歸因於努力（內在）→驕傲、高自尊、高自我效能與成功期望；歸因於穩定原因→預期同樣結果再發生（失敗時變成無望感），所以 Stability→Outcome Expectations
      的正號指『期望與過去結果同向』，效價要另外處理；可控原因→判定他人該負責→責備、譴責、報復；不可控→幫助。Kelley 共變：三者皆高→外在歸因；共識低、特殊性低、一致性高→內在歸因，邊的正負是照此換算。心理後果→行為後果（努力與否）是書中七階段的最後一步，Persistence
      沿用既有名稱。四種偏誤是現象描述、無方向，只列變數不畫邊；群體自利偏誤（Goncalo 與 Duguid 2008）可延伸到組織層次。因果前因（過去績效、社會規範、期望）影響歸因類別但書未給方向，只列變數。我們的『Responsibility
      Attribution』『Locus』『Stability』『Controllability』應是從 SCCT 來的，正好可共用。量表：Dixon 等（2001）努力／能力／任務／策略／運氣歸因量表；Martinko 等（2007）歸因風格問卷。
