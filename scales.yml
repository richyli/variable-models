Customer Complaints:
  zh: ''
  scales:
  - name: ACSI（Fornell et al. 1996）complaint behavior：是否曾向公司抱怨（二分）；複雜版
    source: ACSI（Fornell et al. 1996）complaint behavior：是否曾向公司抱怨（二分）；複雜版用 Singh (1988) J. Marketing 52(1) 抱怨意圖三構面（voice
