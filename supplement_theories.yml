    enrich_notes: 沒有單一經典模型，這是依多篇實證整合的常見版本：擬人化→社會臨場感→擬社會互動是 CASA 傳統的標準鏈（Chakraborty & Kwon 2021；Tsai et al. 2024）；真實感（Perceived
