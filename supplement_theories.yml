  # ───────── 核心商業理論：組織行為 ─────────
  "Three-Component Commitment Model":
    abbr: TCM
    zh: 組織承諾三成分模型
    field: 組織行為
    desc: Meyer & Allen（1991）：情感、持續與規範承諾各有前因，共同降低離職意圖。
    edges:
      - [Perceived Organizational Support, Affective Commitment, "+"]
      - [Switching cost, Continuance Commitment, "+"]
      - [Socialization, Normative Commitment, "+"]
      - [Affective Commitment, Turnover Intention, "-"]
      - [Continuance Commitment, Turnover Intention, "-"]
      - [Normative Commitment, Turnover Intention, "-"]
      - [Affective Commitment, Organizational Citizenship Behavior, "+"]
  "T POS Perceived Organizational Support":
    note: "T POS Perceived Organizational Support"
    abbr: POS
    zh: 知覺組織支持
    field: 組織行為
    edges:
      - [Fairness, Perceived Organizational Support, "+"]
      - [Supervisor Support, Perceived Organizational Support, "+"]
