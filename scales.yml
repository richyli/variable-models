      2002）或 Need for Cognition。 未找到公開題項。
Complexity:
  zh: ''
  scales:
  - name: Thompson, Higgins & Howell (1991)
    source: Thompson, Higgins & Howell (1991) MIS Quarterly 15(1) complexity 四題；或 Moore & Benbasat (1991) ISR 2(3)
      PCI ease of use（Rogers 之 complexity 的反向）
    url: https://verdi.cs.ucl.ac.uk/constructDB/publications/moore-development-1991.html
    verified: false
