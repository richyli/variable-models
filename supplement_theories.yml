    - {title: SIDE (SIUE AURA Lab theories page), url: 'https://aura-lab.siue.edu/theories/social-identity-model-of-deindividuation-effects-side/'}
    enrich_notes: 原四條保留。認知面補上 Postmes 等（2001）的關鍵條件：匿名只有在已有共同群體認同時才提高社會認同凸顯（用 Shared Group Identity 調節），並加入去個人化→依群體規範行為的中介鏈。策略面補匿名→（對外團體）表達群體規範行為，受外團體權力調節。Social
      Identity → Out-group 為負，意思是對外團體的評價與認同下降，沿用原始寫法。
