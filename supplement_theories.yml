      url: 'https://research-repository.griffith.edu.au/items/64a7c122-1445-4b9a-958d-be0d5223724d'}
    - {title: 'IDEAS/RePEc record, International Journal of Information Management 49, 157–169', url: 'https://ideas.repec.org/a/eee/ininma/v49y2019icp157-169.html'}
    - {title: 'AIDUA applied in Indian hospitality (PMC, 含完整假設清單)', url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC8685740'}
    enrich_notes: 原本用 Perceived Ease of Use 代替努力期望並標 PEOU -> Emotions 為負，這是符號錯置：AIDUA 的 Effort Expectancy 定義為「與 AI 互動所需的心理努力」（題項如「很難理解和使用」），是易用性的反面，所以改用新構念
      Effort Expectancy，負向才成立；同理 Perceived Anthropomorphism -> Effort Expectancy 在原文是正向（越像人越費力），原本標 PA -> PEOU 為正也已改。依 PMC
      整理的 11 條假設補齊全部路徑；willingness to accept 對應 Behavioral Intention，objection to use 對應名單裡的 User Resistance。
  Uncanny Valley:
    abbr: Uncanny
    zh: 恐怖谷（非線性，此處簡化為高擬人段）
    field: AI
    desc: 森政弘（1970）：人造物的擬人程度愈高，好感愈高，但接近真人卻不完全像時好感驟降、產生詭異感，到真正的人才回升；會動的物體讓這個谷更深。此處只畫高擬人區段，詭異感再傳到對 AI 的信任與使用意圖。
    edges:
    - [Perceived Anthropomorphism, Eeriness, +]
    - [Perceived Anthropomorphism, Affinity, +]
    - [Eeriness, Affinity, '-']
    - [Motion, Perceived Anthropomorphism -> Eeriness, m]
    - [Eeriness, Trust in AI, '-']
    - [Eeriness, Behavioral Intention, '-']
    - [Affinity, Trust in AI, +]
    - [Affinity, Behavioral Intention, +]
    refs:
    - {title: Uncanny Valley Theory (IS Theories wiki), url: 'https://is.theorizeit.org/wiki/Uncanny_Valley_Theory'}
    - {title: Uncanny valley (Britannica), url: 'https://www.britannica.com/topic/uncanny-valley'}
    - {title: 'The uncanny valley: existence and explanations (Wang, Lilienfeld & Rochat, 2015)', url: 'https://www.frontiersin.org/articles/10.3389/fpsyg.2015.00883/pdf'}
    enrich_notes: 原理論是非線性曲線（人似度 × 好感），沒有正負號；依使用者既有做法只取谷底前的高擬人區段，所以擬人程度→詭異感為正。新增森政弘原文的兩個要件：好感（Affinity，Mori 的 shinwakan）與動態（Motion）加深效應的調節。Affinity
      與 Eeriness 都接到信任與意圖，是後來人機互動實證的常見延伸，非 1970 原文。Wang 等（2015）指出實證證據不一致，整條曲線在群體平均資料中不一定出現。
  Explainable AI Trust Model:
    abbr: XAI
    zh: 可解釋 AI 與信任
    field: AI
    desc: Shin（2021）整理 XAI 使用者研究：使用者能否理解解釋（可因性）是解釋品質的前因；解釋品質提高對透明、公平與可問責的知覺，三者共同建立對 AI 的信任，信任再帶來對 AI 表現的正面評價與採用；但解釋越多也會增加使用者的認知負荷。
    edges:
    - [Causability, Explanation Quality, +]
    - [Explanation Quality, Perceived Transparency, +]
    - [Explanation Quality, Fairness, +]
    - [Explanation Quality, Perceived Accountability, +]
    - [Explanation Quality, Trust in AI, +]
    - [Perceived Transparency, Trust in AI, +]
    - [Fairness, Trust in AI, +]
    - [Perceived Accountability, Trust in AI, +]
    - [Trust in AI, Performance Expectancy, +]
    - [Trust in AI, Behavioral Intention, +]
    - [Trust in AI, Reliance on Automation, +]
    - [Explanation Quality, Cognitive Load, +]
    refs:
    - {title: 'Shin (2021) The effects of explainability and causability on perception, trust, and acceptance, IJHCS 146',
      url: 'https://zuscholars.zu.ac.ae/works/3421'}
    - {title: 'Is Trust Correlated With Explainability in AI? A Meta-Analysis (arXiv 2504.12529)', url: 'https://arxiv.org/pdf/2504.12529'}
    - {title: Donghee Shin bepress profile, url: 'https://works.bepress.com/donghee-shin/20'}
    enrich_notes: 保留原四條。Explanation Quality 對應 Shin 的 explainability，新造 Causability（使用者理解解釋的程度）為其前因。Shin 的 FAT（fairness、accountability、transparency）用名單既有的
      Fairness、Perceived Accountability、Perceived Transparency。Shin 的「perceived performance」用名單既有的 Performance Expectancy
      代替。Explanation Quality -> Cognitive Load 不是 Shin 的路徑，來自其他 XAI 使用者研究，保留但標示。2025 年統合分析指出解釋與信任的相關整體為正但異質性高。
  FAccT Perceptions Model:
    abbr: FAccT
    zh: 公平、可問責、透明的感知模型
    field: AI
    desc: Shin（2020）：使用者對演算法推薦的公平、可問責、透明與可解釋的感知，透過捷思式與系統式雙重歷程形成信任，信任再提高知覺有用性與滿意，最後影響對演算法決策的態度與使用意圖。
    edges:
    - [Perceived Fairness, Trust in AI, +]
    - [Perceived Accountability, Trust in AI, +]
    - [Perceived Transparency, Trust in AI, +]
    - [Perceived Transparency, Perceived Explainability, +]
    - [Perceived Explainability, Trust in AI, +]
    - [Trust in AI, PU Perceived Usefulness, +]
    - [Trust in AI, User Satisfaction, +]
    - [Trust in AI, Behavioral Intention, +]
    - [PU Perceived Usefulness, Behavioral Intention, +]
    - [User Satisfaction, Behavioral Intention, +]
    - [Systematic Processing, Perceived Explainability -> Trust in AI, m]
    refs:
    - {title: 'User perceptions of algorithmic decisions in the personalized AI system (Shin, 2020, JOBEM)', url: 'https://zuscholars.zu.ac.ae/works/3842'}
    - {title: 'Role of fairness, accountability, and transparency in algorithmic affordance (Shin & Park, 2019)', url: 'https://zuscholars.zu.ac.ae/works/3003'}
    - {title: Trust in AI and its role in the acceptance of AI technologies (arXiv 2203.12687), url: 'https://arxiv.org/pdf/2203.12687'}
    enrich_notes: 原四條保留。Shin 2020 的構面是 FATE 四項而非 FAT 三項，補上可解釋性，並依該文把透明當作可解釋性的前因。摘要只確認信任→有用性與態度，滿意與意圖的中介鏈是 Shin 系列研究（2019、2021）的常見寫法，全文未開啟。雙重歷程以
      Systematic Processing 當調節表示：系統式處理者更看重可解釋性。
  AI Anxiety Model:
    abbr: AIAnx
    zh: AI 焦慮
    field: AI
    desc: Wang 與 Wang（2022）發展 AI 焦慮量表，含學習、工作取代、社會技術盲點、AI 配置四個面向；常見實證版本中，AI 素養與自我效能降低焦慮，焦慮則削弱對 AI 的態度、學習動機與使用意圖，並導向迴避。
