    - [Elite Polarization, Affective Polarization, +]
    - [Selective Exposure, Partisan Media Exposure, +]
    - [Partisan Media Exposure, Affective Polarization, +]
    - [Social Network Use, Affective Polarization, +]
    - [Cross-cutting Exposure, Affective Polarization, '-']
    - [Superordinate Identity, Affective Polarization, '-']
    - [Affective Polarization, Social Distance, +]
    - [Affective Polarization, Trust, '-']
    - [Affective Polarization, Out-group Discrimination, +]
    - [Affective Polarization, Political Participation, +]
    refs:
