    - {title: TIB applied to software piracy (Wits WIReDSpace), url: 'https://wiredspace.wits.ac.za/items/abf56858-94d8-4d4c-b176-edc76ce60411'}
    enrich_notes: 原六條保留。Triandis 的公式是 P = (wH·H + wI·I)·F，促成條件是乘項，所以除了保留直接邊也加上兩條調節邊；社會因素拆成規範、角色、自我概念三個子成分；補習慣的前因（過去行為頻率）與習慣—意圖交互（習慣越強意圖效果越弱），後者在
      2020 年 52 篇研究的回顧中結果混雜。
