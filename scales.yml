Joy:
  zh: ''
  scales:
  - name: Agarwal & Karahanna (2000)
    source: Agarwal & Karahanna (2000) MISQ cognitive absorption 之 heightened enjoyment（HMSAM 之 joy 沿用）；一般愉悅用 perceived
      enjoyment（Davis, Bagozzi & Warshaw 1992；van der Heijden 2004）
    url: https://is.theorizeit.org/wiki/Hedonic-motivation_system_adoption_model_(HMSAM)
    verified: false
    items:
    - I have fun interacting with [system].
    - Using [system] provides me with a lot of enjoyment.
    - I enjoy using [system].
    - Using [system] bores me.（反向）
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree
    reliability: 原文各構面 α 多高於 .80（依記憶）
    context: ''
    notes: 題項依記憶轉述。情緒式 joy 可用 PANAS 的 PA 或 SAM valence。
Need for Cognition:
  zh: ''
  scales:
  - name: Cacioppo, Petty & Kao (1984)
    source: Cacioppo, Petty & Kao (1984) J. Personality Assessment 48(3), Need for Cognition Scale 18 題短版（原 Cacioppo
      & Petty 1982 為 34 題）
    url: https://www.testable.org/scale/nfc-need-for-cognition-scale
    verified: true
    items:
    - I would prefer complex to simple problems.
    - I like to have the responsibility of handling a situation that requires a lot of thinking.
    - Thinking is not my idea of fun.（反向）
    - I would rather do something that requires little thought than something that is sure to challenge my thinking
      abilities.（反向）
    - I find satisfaction in deliberating hard and for long hours.
    - I only think as hard as I have to.（反向）
    - The notion of thinking abstractly is appealing to me.
    - It's enough for me that something gets the job done; I don't care how or why it works.（反向）
    scale: 5-point, 1 = extremely uncharacteristic of me … 5 = extremely characteristic（原版 9 點 -4 到 +4）；9 題反向
    reliability: 原文 α = .90；後續一般樣本 .91–.94
    context: ''
    notes: 題項為原句。另有 6 題版（Lins de Holanda Coelho et al. 2020）。
Overall Impression:
  zh: ''
  scales:
  - name: 無單一標準量表；月暈效應研究以整體評價題（單題或語意差異）量測，例如 Nisbett & Wilson (1977)
    source: 無單一標準量表；月暈效應研究以整體評價題（單題或語意差異）量測，例如 Nisbett & Wilson (1977)、Landy & Sigall (1974) 的 1–9 整體評分
    url: https://en.wikipedia.org/wiki/Halo_effect
