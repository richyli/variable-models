      Advantage，這是實證文獻最常檢驗的位置（環境動態性越高，動態能力越值錢）。補三群能力的先後順序（2024 年實證：感知 -> 把握 -> 轉型）、吸收能力為感知的前因、以及創新績效與企業績效兩個結果。原理論是概念框架，方向依常見實證版本決定。
    book_check: Miles 2012 第 10 章對照：補 6 條邊；書中變數我們原本沒有的：Operational Capabilities、Learning Capability、Integrating Capability、Coordinating
      Capability、Path Dependence、Asset Position、Technical Fitness、Evolutionary Fitness。書上明寫：歷史與先前路徑決定目前的位置與資產基礎→組織流程；感知機會→投入（把握）→重組能力→新路徑／位置／資產→持續競爭優勢（Teece
      2007）；動態能力修改資源基礎與營運能力（Helfat 等 2007），營運能力負責賺錢，所以 DC→Operational Capabilities→Firm Performance 的鏈是依此整理；技術適應（功能／成本）與演化適應（對外求生）是兩把尺。Pavlou
      與 El Sawy（2011）的感知→學習→整合→協調鏈只列變數，與 Teece 三步並存不重畫。環境動盪的調節是我推的：書中理論前提是能力要匹配動盪環境，但 Winter（2003）主張環境變化時臨機（ad hoc）解題可能更便宜，所以方向未定、只標
      m。『Environmental Uncertainty』沿用既有名稱代表 turbulence；Exploration／Exploitation 沿用 Ambidex 既有名稱（書引 March 1991）。批評：定義不清且套套邏輯（成功者有
      DC、有 DC 者成功）、與吸收能力等概念重疊、量測多用遠端代理且橫斷面（Arend 與 Bromiley 2009）。量表：Pavlou 與 El Sawy（2011）；Kale 與 Singh（2007）聯盟能力；Wu 等（2010）營運能力。
