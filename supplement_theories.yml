    desc: Rosenstock（1974）、Janz 與 Becker（1984）：對疾病的易感性與嚴重性感知合成威脅感，威脅感、行動的利益與障礙、行動線索與自我效能（1988 加入）共同決定是否採取預防性健康行為；人口與知識等修正因素透過這些信念起作用。
