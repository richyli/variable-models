    - [Working Memory Capacity, Cognitive Offloading, '-']
    - [Cognitive Offloading, Cognitive Load, '-']
    - [Cognitive Offloading, Task Performance, +]
    - [Cognitive Offloading, Memory for Offloaded Information, '-']
    - [Metacognitive Accuracy, Perceived Internal Ability -> Cognitive Offloading, m]
    refs:
    - {title: 'Using the Outside World to Save on Brainpower (Neuroscience News, on Risko & Gilbert 2016)', url: 'https://neurosciencenews.com/metacognition-technology-4857'}
    - {title: 'Risko & Gilbert (2016) Cognitive Offloading, UCL Discovery record', url: 'https://discovery.ucl.ac.uk/1508770/'}
    enrich_notes: Trends in Cognitive Sciences 20(9), 676–688。長期後果尚無足夠研究。UCL Discovery 頁本次回 403，書目資訊取自搜尋結果。
  Distributed Cognition:
    abbr: DCog
