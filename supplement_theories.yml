    enrich_notes: 把原本籠統的 Value 拆成 Stern 的三種價值取向：生物圈與利他為正、利己為負（Steg 等 2005 的檢定結果；利他價值對 NEP 的直接效果在部分研究不顯著）。其餘五條因果鏈與原資料相同。Stern
