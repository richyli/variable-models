      p224「依知覺到的承諾履行而行動」、p229「未得到預期結果→低落的態度與行為」，Breach→Job Satisfaction／Job Performance 負向是我把後者具體化。Breach→Trust 負向與 Breach→Violation
      Feelings 來自 References to Know 的 Robinson（1996）與 Measuring Variables 的 Robinson & Morrison（2000）標題，方向依題名推。Turnover Intention
      書上未直接提，依「low employee attitudes and behaviors」推，屬弱推論。Socialization／Mutuality→Fulfillment（Reciprocity→Fulfillment「+」同理，為守
      8 條上限未入邊）依 p224 契約由入職前因素、在職經驗（orientation、socialization、training）形塑，且理想上互惠與相互同意，屬概念性邊。四種契約型態（p225）為類別變數，無法畫成有向邊。Measuring
      Variables：Robinson & Morrison 2000 五題違反量表、Dabos & Rousseau 2004、Rousseau 2000 PCI。
  Goal-Setting Theory:
    abbr: GST
    zh: 目標設定理論
    field: 組織行為
    desc: Locke 與 Latham（1990、2002）提出：具體且困難的目標透過導向注意、動員努力、持續投入與尋找策略四個機制提高績效，但前提是目標承諾、回饋與自我效能到位；任務越複雜目標效果越弱，績效帶來滿意又回頭強化承諾，形成高績效循環。
    edges:
    - [Goal Specificity, Job Performance, +]
    - [Goal Difficulty, Job Performance, +]
    - [Goal Difficulty, Effort, +]
    - [Effort, Job Performance, +]
    - [Goal Difficulty, Task Strategies, +]
    - [Task Strategies, Job Performance, +]
    - [Goal Commitment, Goal Difficulty -> Job Performance, m]
    - [Feedback, Goal Specificity -> Job Performance, m]
    - [Task Complexity, Goal Difficulty -> Job Performance, m]
    - [Self-Efficacy, Goal Difficulty -> Job Performance, m]
    - [Self-Efficacy, Goal Commitment, +]
    - [Self-Efficacy, Goal Difficulty, +]
    - [Job Performance, Job Satisfaction, +]
    - [Job Satisfaction, Goal Commitment, +]
    - [Feedback, Goal Difficulty -> Job Performance, m]
    - [Ability, Goal Difficulty -> Job Performance, m]
    - [Goal Difficulty, Persistence, +]
    - [Goal Importance, Goal Commitment, +]
    - [Expectancy, Goal Commitment, +]
    - [Goal Difficulty, Unethical Behavior, +]
    - [Goal Attainment, Self-Efficacy, +]
    refs:
    - {title: 'Locke and Latham 2002, Building a Practically Useful Theory of Goal Setting and Task Motivation (American Psychologist,
        PDF)', url: 'https://home.ubalt.edu/tmitch/642/articles syllabus/locke pract goal setting 2002 am psy.pdf'}
    - {title: 'Goal-Setting Theory: Locke and Latham Explained (Rework)', url: 'https://resources.rework.com/libraries/leadership/goal-setting-theory'}
    - {title: 'Locke and Latham 2006, New Directions in Goal-Setting Theory (Current Directions in Psychological Science,
        PDF)', url: 'https://home.ubalt.edu/tmitch/642/Articles syllabus/locke latham new dir GS curr dir psy sci 2006.pdf'}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 15 章', url: ''}
    enrich_notes: 原六條保留。補 2002 模型圖的中介機制（努力、任務策略；注意導向與持續投入併入前兩者以控制邊數）、自我效能作為調節與作為自設目標難度的前因，以及高績效循環（績效→滿意→承諾）。任務複雜度的調節方向為削弱，以
      m 表示。原典 PDF 為掃描影像無法解析，模型內容依 Rework 整理頁與搜尋摘要。
    book_check: Miles 2012 第 15 章對照：補 7 條邊；書中變數我們原本沒有的：Goal Importance、Goal Rationale Explanation、Number of Goals、Attention
      Direction、Unethical Behavior、Risk Taking、Goal Attainment。書中「task performance」對應我們既有的 Job Performance（清單沒有 Task Performance）。四個調節：書寫「績效在承諾高、有回饋、有能力時更高」「任務複雜度使效果變弱」（p.144–145），Task
      Complexity 的調節方向是負（效果變弱）。Goal Difficulty→Effort／Persistence 與「引導注意」是書明寫的三個機制（p.143），Attention Direction 清單沒有。Expectancy
      是用既有名稱對應書中「相信目標可達成」（attainable）；Goal Importance 對應「相信目標重要」（p.144）。Goal Difficulty→Unethical Behavior 與 Goal Attainment→Self-Efficacy
      來自批評節（Ordoñez et al. 2009；未達目標會降低自我效能，p.146）。Goal Rationale Explanation 來自 p.144：自設目標若經主管解釋理由，效果與指派目標相當，粗暴指派則績效較低。Number
      of Goals 來自批評：多目標時人只專注一個。我們清單已有 Goal Conflict，書中沒明寫此構念。測量節的 goal orientation、achievement goal 量表屬成就目標理論，不是 Locke 的目標設定，未列。
  Two-Factor Theory:
    abbr: Herzberg
    zh: 雙因子理論
    field: 組織行為
    desc: Herzberg、Mausner 與 Snyderman（1959）：保健因子（薪資、政策、監督、工作條件）不足造成不滿但充足不會帶來滿意；激勵因子（成就、肯定、責任、成長）才產生滿意與內在動機；滿意與不滿是兩條獨立連續體。
    edges:
    - [Hygiene Factors, Job Dissatisfaction, '-']
    - [Motivator Factors, Job Satisfaction, +]
    - [Job Enrichment, Motivator Factors, +]
    - [Job Satisfaction, Motivation, +]
    - [Motivation, Job Performance, +]
    - [Job Dissatisfaction, Turnover Intention, +]
    - [Job Satisfaction, Turnover Intention, '-']
    refs:
    - {title: Herzberg's Two-Factor Theory of Motivation-Hygiene (Simply Psychology), url: 'https://www.simplypsychology.org/herzbergs-two-factor-theory.html'}
    - {title: Herzberg's Two-Factor Theory (Structural Learning), url: 'https://structural-learning.com/post/herzbergs-two-factor-theory'}
    - {title: Herzberg's Motivation Theory (Expert Program Management), url: 'https://expertprogrammanagement.com/herzbergs-motivation-theory-two-factor-theory/'}
    enrich_notes: 原四條保留。補上 Herzberg 的處方（工作豐富化→激勵因子）、動機→績效（Herzberg 主張但原研究未量測）與滿意降低離職意圖。理論的核心主張「保健因子對滿意無效、激勵因子對不滿無效」是零效果，有向圖畫不出來，只能在此註明。後設分析（Simply
      Psychology 引 2025 回顧）顯示兩類因子與滿意的相關其實都存在（.42 對 .36），雙連續體的嚴格版本證據不足。
  Equity Theory:
    abbr: EqT
    zh: 公平理論（Adams）
    field: 組織行為
    desc: Adams（1965）：人將自己的投入／產出比與參照對象比較，比率不等即感到不公平；不公平越大緊張越強，個人會降低投入、要求更多產出、扭曲認知或離開以恢復平衡，因此不公平降低動機、滿意與績效並提高離職意圖。
    edges:
    - [Input-Outcome Ratio Discrepancy, Perceived Inequity, +]
    - [Perceived Inequity, Distributive Justice, '-']
    - [Perceived Inequity, Inequity Distress, +]
    - [Inequity Distress, Motivation, '-']
    - [Perceived Inequity, Job Satisfaction, '-']
    - [Perceived Inequity, Job Performance, '-']
    - [Perceived Inequity, Turnover Intention, +]
    - [Inequity Distress, Exit, +]
    - [Perceived Inequity, Customer Complaints, +]
    refs:
    - {title: Equity theory - Wikipedia, url: 'https://en.wikipedia.org/wiki/Equity_theory'}
    - {title: 'Hofmans, Individual differences in equity models (PDF)', url: 'https://www.uv.es/psicologica/articulos3.12/5_Hofmans.pdf'}
    enrich_notes: 保留原五條，但 Perceived Inequity→Motivation 改經由緊張（Inequity Distress，新造）中介。Perceived Inequity 與 Distributive Justice
      概念上互為反面，保留原邊但提醒畫圖時可能重複。方向依少給（underpayment）情境：Adams 指出多給引發罪惡感、可能反而提高努力，故 Job Performance 的負號只適用少給。Exit 與 Customer Complaints
      為行銷／服務版本常見的恢復公平行為。
  Job Demands-Resources Model:
    abbr: JD-R
    zh: 工作要求－資源模式
    field: 組織行為
    desc: Demerouti 等人（2001）、Bakker 與 Demerouti（2007）提出：工作要求經由健康損耗歷程導致耗竭與健康問題，工作資源經由動機歷程帶來投入與績效；資源可緩衝要求的傷害，且在高要求下更能激發投入，個人資源與工作塑造再形成增益螺旋。
    edges:
    - [Job Demands, Burnout, +]
    - [Job Resources, Burnout, '-']
    - [Job Resources, Work Engagement, +]
    - [Self-Efficacy, Work Engagement, +]
    - [Job Resources, Job Demands -> Burnout, m]
    - [Job Demands, Job Resources -> Work Engagement, m]
    - [Burnout, Well-being, '-']
    - [Burnout, Job Performance, '-']
    - [Burnout, Turnover Intention, +]
    - [Work Engagement, Job Performance, +]
    - [Work Engagement, Turnover Intention, '-']
    - [Job Performance, Job Resources, +]
    refs:
    - {title: JD-R model summary (FourWeekMBA), url: 'https://fourweekmba.com/jd-r-model'}
    - {title: 'Job demands-resources model: designing and delegating well', url: 'https://people-shift.com/articles/job-demands-resources-model-designing-and-delegating-well/'}
    - {title: Kinnunen et al. 2011 JD-R test (Mannheim repository), url: 'https://madoc.bib.uni-mannheim.de/30363/1/kinnunen_et_al_2011_Job_demands_resources.pdf'}
    enrich_notes: 保留原六條。補健康損耗歷程的結果（Well-being）、資源對耗竭的直接負向、第二個交互作用（高要求下資源更能激發投入，Bakker 等人 2007 的因應假設）、個人資源（以名單裡的 Self-Efficacy
      代表）與 2017 版的增益螺旋（績效回饋到資源，經工作塑造）。原 2007 文獻未直接取得，依次級來源整理。
  Privacy Calculus Model:
    note: Privacy Calculus Model
    abbr: PCM
    zh: 隱私計算模型（依 PCM 標籤推測）
    field: ''
    edges:
    - [Privacy Concern, Perceived Risk, +]
    - [Privacy Concern, Behavioral Intention, '-']
    - [Perceived Risk, Behavioral Intention, '-']
    - [PU Perceived Usefulness, Behavioral Intention, +]
    - [Trust, Perceived Risk, '-']
    - [Trust, Behavioral Intention, +]
    - [Personalization, PU Perceived Usefulness, +]
    - [Information Sensitivity, Perceived Risk -> Behavioral Intention, m]
    - [Behavioral Intention, Behavior, +]
    desc: Culnan 與 Armstrong（1999）、Dinev 與 Hart（2006）建立：使用者揭露個人資料前會權衡知覺風險與預期效益，隱私顧慮推高風險並壓低揭露意圖，信任與有用性能抵銷風險；意圖再轉為實際揭露行為。
    refs:
    - {title: 'Dinev & Hart (2006) An Extended Privacy Calculus Model for E-Commerce Transactions, ISR 17(1)', url: 'https://ideas.repec.org/a/inm/orisre/v17y2006i1p61-80.html'}
    - {title: 'UCL Security Construct DB: Dinev 2006 extended privacy calculus', url: 'https://verdi.cs.ucl.ac.uk/constructDB/publications/dinev-extended-2006.html'}
    - {title: PMC article applying privacy calculus (situation-specific risk-benefit assessment), url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC4583554'}
    enrich_notes: 原資料有四條空符號的重複邊，已合併並補方向。補 Dinev & Hart 的信任（降風險、提意圖）與顧慮直接壓低意圖；效益端沿用名單既有的 PU Perceived Usefulness，加 Personalization
      為效益前因（個人化－隱私弔詭文獻常見）；新造 Information Sensitivity 作調節。注意 Dinev & Hart 2006 原文是 Perceived Risk -> Privacy Concern，這裡沿用資料既有與
      APCO 慣用的 Privacy Concern -> Perceived Risk 方向。
  T SEF Self-Efficacy Theory:
    note: T SEF Self-Efficacy Theory
    abbr: SEF
    zh: 自我效能理論
    field: ''
    edges:
    - [Past Performance, Self-Efficacy, +]
    - [Vicarious Exp, Self-Efficacy, +]
    - [Social Persuasion, Self-Efficacy, +]
    - [Emotions, Self-Efficacy, '-']
    - [Self-Efficacy, Outcome Expectations, +]
    - [Self-Efficacy, Goal Commitment, +]
    - [Self-Efficacy, Persistence, +]
    - [Self-Efficacy, Behavior, +]
    - [Outcome Expectations, Behavior, +]
    - [Persistence, Behavior, +]
    - [Behavior, Past Performance, +]
    - [Behavior, Individual Impact, +]
    - [Behavior, Benefit, +]
    desc: Bandura（1977）提出：自我效能是對自己能否完成某行為的信念，來自精熟經驗、替代經驗、言語說服與生理情緒狀態四種來源，前三者提高效能、焦慮喚起降低效能；效能決定是否嘗試、投入多少努力與堅持，並與結果預期共同預測行為。
    refs:
    - {title: 'Bandura (1977) Self-Efficacy: Toward a Unifying Theory of Behavioral Change (SuSanA library record)', url: 'https://www.susana.org/en/knowledge-hub/resources-and-publications/library/details/4524'}
    - {title: 'Simply Psychology: Bandura''s Self-Efficacy Theory of Motivation', url: 'https://www.simplypsychology.org/self-efficacy.html'}
    - {title: 'UCL Security Construct DB: Bandura self-efficacy 1977', url: 'https://verdi.cs.ucl.ac.uk/constructDB/publications/bandura-selfefficacy-1977.html'}
    enrich_notes: 原資料有五條空符號邊與五條帶符號邊重複，已合併去重。Emotions 代表生理與情緒喚起，依 Bandura 的敘述畫成負向（焦慮喚起被解讀為脆弱）。補結果預期、目標與堅持（新造 Persistence）三個效能的下游機制，以及
      Behavior -> Past Performance 的精熟經驗回饋環。Behavior -> Individual Impact 與 Behavior -> Benefit 不是 Bandura 的構念，來自資料庫原本的 IS
      應用模型，保留但在此標示。
  T Absorptive Capacity Theory:
    note: T Absorptive Capacity Theory
    abbr: ACT
    zh: 吸收能力理論
    field: ''
    edges:
    - [Knowledge, Absorptive Capacity, +]
    - [R&D Investment, Absorptive Capacity, +]
    - [Absorptive Capacity, Potential Absorptive Capacity, +]
    - [Potential Absorptive Capacity, Realized Absorptive Capacity, +]
    - [Social Integration Mechanisms, Potential Absorptive Capacity -> Realized Absorptive Capacity, m]
    - [Realized Absorptive Capacity, Innovation Performance, +]
    - [Realized Absorptive Capacity, Knowledge Transfer, +]
    - [Realized Absorptive Capacity, Competitive Advantage, +]
    - [Innovation Performance, Firm Performance, +]
    - [Knowledge Transfer, Firm Performance, +]
    - [Environmental Uncertainty, Realized Absorptive Capacity -> Innovation Performance, m]
    - [Prior Knowledge Base, Absorptive Capacity, +]
    - [External Knowledge Availability, Absorptive Capacity, +]
    - [Knowledge Acquisition Cost, Absorptive Capacity, '-']
    - [Rival Interdependence, Absorptive Capacity, '-']
    - [Absorptive Capacity, Innovation Performance, +]
    - [Absorptive Capacity, Competitive Advantage, +]
    - [Absorptive Capacity, Prior Knowledge Base, +]
    - [Pace of Technological Change, Absorptive Capacity -> Firm Performance, m]
    desc: Cohen 與 Levinthal（1990）：組織辨識、吸收並應用外部新知識的能力，取決於既有相關知識與持續的研發投入；Zahra 與 George（2002）再分為潛在（獲取、消化）與實現（轉化、利用）兩段，實現段才真正帶來創新與競爭優勢。
    refs:
    - {title: Absorptive capacity theory (IS Theories wiki), url: 'https://is.theorizeit.org/wiki/Absorptive_capacity_theory'}
    - {title: Absorptive capacity (Wikipedia), url: 'https://en.wikipedia.org/wiki/Absorptive_capacity'}
    - {title: 'Absorptive capacity: antecedents, models and outcomes (Van den Bosch et al., ERIM 2003)', url: 'https://repub.eur.nl/pub/334/ERS-2003-035-STR.pdf'}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 1 章', url: ''}
    enrich_notes: 原本兩條邊重複（一條無符號），合併成一條 Knowledge（即先備相關知識）→ Absorptive Capacity。新增 Cohen–Levinthal 的研發投入前因、Zahra–George 的潛在／實現兩段與社會整合機制調節、Zou
      等（2018）統合分析的結果：吸收能力對財務績效的效果完全由創新與知識移轉中介，環境動態性為負向調節。總構念 Absorptive Capacity → Potential Absorptive Capacity 這條是為了讓舊節點接上新結構而設的從屬關係。
    book_check: Miles 2012 第 1 章對照：補 8 條邊；書中變數我們原本沒有的：Acquisition Capability、Assimilation Capability、Transformation Capability、Exploitation
      Capability、Prior Knowledge Base、External Knowledge Availability、Knowledge Acquisition Cost、Rival Interdependence、Pace
      of Technological Change。書上明寫：知識基礎是吸收前提（無基礎者 locked-out）；吸收能力→創新、彈性、績效、競爭優勢；可取得知識量（+）與吸收成本（-）影響取得誘因；對手受益越多則本廠商誘因越低（書中用詞是
      mediator，但描述的是直接負向影響，此處寫成負向邊）；吸收成功會自我強化（回饋邊 AC→知識基礎）。PACAP→RACAP 是 Zahra 與 George 的主張，Todorova 與 Durisin（2007）反對線性關係並主張加回『辨識價值』步驟與回饋迴圈。技術變遷速度的調節來自書末『進一步研究建議』第
      1 條，不是已驗證結果。四個子能力是 PACAP／RACAP 的下位構念，我們清單只有上位兩項。書中『Measuring Variables』只列量表來源（Flatten et al. 2011；Jimenez-Barrionuevo
      et al. 2011 等），未列題項。
  T SIMCA Social identity model of collective action:
    note: T SIMCA Social identity model of collective action
    abbr: SIMCA
    zh: 集體行動的社會認同模型
    field: ''
    edges:
    - [Social Identity, Perceived Injustice, +]
    - [Social Identity, Collective Efficacy, +]
    - [Social Identity, Behavior, +]
    - [Perceived Injustice, Behavior, +]
    - [Collective Efficacy, Behavior, +]
    - [Perceived Injustice, Emotions, +]
    - [Emotions, Behavior, +]
    - [Identity Politicization, Social Identity -> Behavior, m]
    - [Social Norm, Behavior, +]
    desc: van Zomeren、Postmes 與 Spears（2008）整合 182 個效果量：群體認同、知覺不公與集體效能各自直接預測集體行動，而認同同時是不公感與效能感的前因；帶情緒（群體憤怒）的不公與政治化的認同效果更強。
    refs:
    - {title: 'Toward an integrative Social Identity Model of Collective Action (Psychological Bulletin 2008, VU portal PDF)',
      url: 'https://research.vu.nl/ws/portalfiles/portal/2391519/Van%20Zomeren%20Psychological%20Bulletin%20134%284%29%202008.pdf'}
    - {title: SIMCA summary (Climate Advocacy Lab), url: 'https://www.climateadvocacylab.org/resource/toward-integrative-social-identity-model-collective-action-quantitative-research-synthesis/'}
    enrich_notes: 原七條中兩條無符號的（Social Norm → Collective Efficacy、Collective Efficacy → Behavior）：後者與有符號的重複，合併；前者是 Rees 與 Bamberg（2014）的延伸版，但該文把社會規範當集體行動的直接前因而非效能的前因，故改為
      Social Norm → Behavior。補上情感性不公（以 Emotions 即群體憤怒中介）與政治化認同的調節。Behavior 在此代表集體行動（意圖）。
  IS Continuance Model:
    note: IS Continuance Model
    abbr: ISCM
    zh: 資訊系統持續使用模型
    field: ''
    edges:
    - [Expectation, Confirmation of Expectations, '-']
    - [Confirmation of Expectations, PU Perceived Usefulness, +]
    - [Confirmation of Expectations, User Satisfaction, +]
    - [PU Perceived Usefulness, User Satisfaction, +]
    - [PU Perceived Usefulness, Continuance Intention, +]
    - [User Satisfaction, Continuance Intention, +]
    - [Continuance Intention, Behavior, +]
    desc: Bhattacherjee（2001）把期望確認理論搬到資訊系統：使用後的期望獲得確認會提高知覺有用性與滿意，有用性也提高滿意，滿意與有用性共同決定持續使用意圖；持續使用與初次採用是不同的決策。
    refs:
