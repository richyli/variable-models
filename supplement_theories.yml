  Actor-Network Theory:
    abbr: AN
    zh: 行動者網絡理論
    field: 社會學／科技與社會研究（STS）
    desc: Callon（1986）、Latour（2005）提出：人與非人實體都只在與其他實體的關係組合中取得形態與特性；網絡經轉譯四時刻（問題化、利益鎖定、徵召、動員）建立，研究者只應描述，不預設「社會」為解釋。
    edges:
    - [Translation Effectiveness, Actor Enrollment, +]
    - [Actor Enrollment, Network Alignment, +]
    - [Network Alignment, Firm Performance, +]
    refs:
    - {title: 'Callon (1986). Some elements of a sociology of translation: Domestication of the scallops and the fishermen
        of St. Brieuc Bay. In Law (Ed.), Power, action, and belief (pp. 196–223). Routledge.', url: ''}
    - {title: 'Latour (2005). Reassembling the social: An introduction to actor-network-theory. Oxford University Press.',
      url: ''}
    - {title: 'Latour (1999). On recalling ANT. In Law & Hassard (Eds.), Actor network theory and after (pp. 15–25). Blackwell.',
      url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 2 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 2 章。這一章是描述取向理論，書中明言它拒絕變數化與因果解釋，『Measuring Variables』只列民族誌訪談與設計研究方法（Smith 2010；Kraal 2007），沒有量表。三條邊全部是我依書末『進一步研究建議』第
      2、3、10 條（有效轉譯→行動者結果；徵召與對齊→期望或非期望結果；增減行動者→組織對齊／失準→績效）推出的，正負號是我推的，書未給方向。書中四時刻用詞為 problematization、profit-sharing、enrollment、mobilization（Callon
      原文第二項為 interessement，書寫成 profit-sharing，沿用書）。本理論與我們清單任何理論無對應，與 TOE／IDT 僅題材相鄰。
  Agenda Setting Theory:
    abbr: AS
    zh: 議題設定理論
    field: 傳播／公共政策
    desc: McCombs 與 Shaw（1972）：媒體報導議題的頻率與篇幅決定公眾認為哪些議題重要（第一層）；媒體呈現的議題屬性再影響公眾如何理解該議題（第二層）。框架與促發是機制，需求導向與負面情緒內容是條件。
    edges:
    - [Media Agenda Salience, Public Agenda Salience, +]
    - [Media Attribute Salience, Public Attribute Perception, +]
    - [Framing, Public Agenda Salience, +]
    - [Media Agenda Salience, Issue Accessibility, +]
    - [Involvement, Need for Orientation, +]
    - [Issue Uncertainty, Need for Orientation, +]
    - [Need for Orientation, Media Agenda Salience -> Public Agenda Salience, m]
    - [Negative Emotional Arousal, Public Agenda Salience, +]
    - [Corporate Political Activity, Policy Agenda, +]
    refs:
    - {title: 'McCombs & Shaw (1972). The agenda-setting function of mass media. Public Opinion Quarterly, 36, 176–187.',
      url: ''}
    - {title: 'McCombs (2004). Setting the agenda: The mass media and public opinion. Polity Press.', url: ''}
    - {title: 'Dearing & Rogers (1996). Communication concepts 6: Agenda-setting. Sage.', url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 4 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 4 章。書上明寫：報導頻率／時間長短與公眾認為議題重要的程度相關（第一層，關鍵變數是公眾注意）；媒體呈現的議題屬性影響公眾知覺的屬性（第二層，關鍵變數是認知與情感理解）；框架＝選擇＋凸顯，提高顯著性就提高被處理與記住的機率；促發效應＝大量報導的議題更容易被回想；需求導向＝興趣越高、不確定越高，越需要媒體提供資訊（Weaver
      1977, 1980），其作為調節是我依此推的；Miller（2007）發現引發悲傷與恐懼的內容使人認為議題具全國重要性；企業經由資助、遊說、作證、廣告公關影響政策議程。『Involvement』沿用既有名稱代表議題興趣；『Org
      Reputation』對應書中的企業聲譽議題。本章『Measuring Variables』只列政治知識量表（Shaker 2009）與網路使用動機量表（Roy 2009），沒有議題顯著性的直接量表。我們清單有沉默螺旋、第三人效果、U&G
      等傳播理論但沒有議題設定，是明顯缺口；『Perceived Media Influence on Others』不是同一概念。
  Attachment Theory:
    abbr: A
    zh: 依附理論
    field: 發展心理／組織行為
    desc: Bowlby（1969）、Ainsworth（1967）：早期依附經驗形成對自我與他人的內在運作模式，長期影響成人人際關係與壓力調節；依焦慮與迴避兩軸分安全、焦慮、疏離、恐懼四型，並與職場信任、自尊、領導與倫理行為有關。
    edges:
    - [Attachment Anxiety, Self-Esteem, '-']
    - [Attachment Avoidance, Trust, '-']
    - [Secure Attachment, Stress Coping Ability, +]
    - [Secure Attachment, Helping Behavior, +]
    - [Attachment Anxiety, Job Satisfaction, '-']
    - [Attachment Anxiety, Leadership Effectiveness, '-']
    - [Attachment Avoidance, Prosocial Motivation to Lead, '-']
    - [Attachment Avoidance, Unethical Behavior, +]
    refs:
    - {title: 'Bowlby (1969). Attachment and loss: Vol. 1. Attachment. Basic Books.', url: ''}
    - {title: 'Mikulincer & Shaver (2007). Attachment in adulthood: Structure, dynamics, and change. Guilford Press.', url: ''}
    - {title: 'Bowlby (1988). A secure base: Clinical applications of attachment theory. Routledge.', url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 5 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 5 章。書上明寫：安全型信任他人、能應付壓力、較有同情心並助人（Mikulincer 等 2005）；焦慮（preoccupied）型信任他人但不信任自己、低自尊、依薪資選工作而工作與生涯滿意低；疏離（dismissing）型不信任他人、最常剝削欺騙他人且對不倫理情境最冷漠（Albert
      與 Horowitz 2009）；恐懼型低自尊、不自我揭露、不接受上司指令。領導：依附焦慮的領導者較自利、任務情境表現差；依附迴避的領導者利社會領導動機低、追隨者社會情緒功能與長期心理健康較差。依附與離職意圖、情緒調節有關（Richards
      與 Schat 2011）但書未給方向，所以未畫邊。正負號依四型描述換算到焦慮／迴避兩個連續軸，是我整理的。我們的『Emotional Attachment』是品牌／情感依附，不是依附型態，故不沿用。量表：Fraley 等（2000）ECR-R
      成人依附自陳量表、Smith 等（1999）團體依附量表、Bodie 等（2011）。
  Balance Theory:
    abbr: B
    zh: 平衡理論
    field: 社會心理／態度一致性
    desc: Heider（1946, 1958）、Newcomb（1953）：人把對他人與對象的情感組織成一致狀態；p-o-x 三元組符號乘積為負即不平衡，引起緊張與負面情緒，人會改變情感或脫離關係以恢復平衡；單純曝光也會改變態度。
    edges:
    - [Triad Imbalance, Dissonance, +]
    - [Triad Imbalance, Arousal, +]
    - [Triad Imbalance, Attitude Change, +]
    - [Triad Imbalance, Unit Relationship Change, +]
    - [Interpersonal Attraction, Attitude Agreement, +]
    - [Mere Exposure, Attitude, +]
    - [Anticipated Interaction, Interpersonal Attraction, +]
    refs:
    - {title: Heider (1958). The psychology of interpersonal relations. Wiley., url: ''}
    - {title: 'Heider (1946). Attitudes and cognitive organization. Journal of Psychology, 21, 107–112.', url: ''}
    - {title: 'Newcomb (1953). An approach to the study of communicative acts. Psychological Review, 60, 393–404.', url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 7 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 7 章。書上明寫：不平衡→不確定、緊張、想改變、負面情緒、生理激發（Burdick 與 Burnes 1958 等），並與 Festinger 的失調相連，故沿用我們的 Dissonance
      與 Arousal；兩種恢復手段是改變情感（→Attitude Change）或改變／離開單位關係；人會把態度向喜歡的人對齊（Chaiken 與 Eagly 1983）；單純曝光提升態度（Zajonc 1968a）；有未來互動機會時對陌生人的知覺會改變（Insko
      與 Adewole 1979），我寫成正向是推的。批評：Zajonc（1968b）認為吸引與同意效應本身就能解釋資料，Cacioppo 與 Petty（1981）發現三種判斷時間不同、可能是獨立歷程。我們清單有 CDT（認知失調），是同一一致性理論家族但不是同一理論；『Affinity』『Source
      Attractiveness』與人際吸引不同義故未沿用。量表：McCroskey 與 McCain（1974）人際吸引量表；Insko 與 Adewole（1979）一致／愉快／和諧量表；Homburg 與 Stock（2005）銷售情境平衡題項。
  Control Theory:
    abbr: C
    zh: 控制理論（控制論）
    field: 動機／自我調節
    desc: Wiener（1948）奠基、Carver 與 Scheier（1981）、Klein（1989）推到人的行為：回饋迴路（標準、感測、比較、效應）是自我調節單位；人把實際表現與標準比較，知覺落差就產生動機並改變行為縮小落差。
    edges:
    - [Performance Standard, Perceived Performance Discrepancy, +]
    - [Feedback, Perceived Performance Discrepancy, +]
    - [Perceived Performance Discrepancy, Motivation, +]
    - [Perceived Performance Discrepancy, Effort, +]
    - [Effort, Job Performance, +]
    - [Job Performance, Perceived Performance Discrepancy, '-']
    - [Discrepancy Magnitude, Perceived Performance Discrepancy -> Effort, m]
    refs:
    - {title: 'Carver & Scheier (1982). Control theory: A useful conceptual framework for personality—social, clinical, and
        health psychology. Psychological Bulletin, 92, 111–135.', url: ''}
    - {title: 'Klein (1989). An integrated control theory model of work motivation. Academy of Management Review, 14, 150–172.',
      url: ''}
    - {title: 'Carver & Scheier (1981). Attention and self-regulation: A control theory approach to human behavior. Springer.',
      url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 8 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 8 章。書上明寫的機制：標準與實際表現比較→有落差才行動（負回饋迴路），落差知覺是動機來源（管理意涵節：people are motivated when they see discrepancies）；行動縮小落差後迴路閉合，所以
      Job Performance→落差為負向回饋邊。『Feedback』沿用既有名稱，對應感測器／訊號。Performance Standard→落差的正號是推的（標準越高、同樣表現下落差越大）；落差太大會放棄（Discrepancy
      Magnitude 調節）來自『進一步研究建議』第 8 條，不是已驗證結果；迴路依重要性排階層（Powers 1973）只列變數未畫邊。批評：太機械、忽略正回饋、不解釋標準從哪來、忽略訊號的意義（Fellenz 1997；Locke
      1991）。我們清單有 GST 目標設定理論（Goal Difficulty、Goal Specificity、Goal Commitment）與 SDT，是鄰近理論但沒有控制理論本身；既有『Control』『Feedback』『Monitoring』可部分共用。量表：Snell（1992）輸入／行為／產出控制問卷；Kuhl（1994）ACS-90
      行動－狀態導向；Brown 等（1999）SRQ 自我調節問卷；Deci 與 Ryan（1985）GCOS。
  Efficient Market Theory:
    abbr: EM
    zh: 效率市場理論
    field: 財務
    desc: Fama（1970）定義效率市場為證券價格隨時完全反映可得資訊的市場，分弱式、半強式、強式三類資訊；價格變動源於不可預期的新資訊（隨機漫步），因此無法長期打敗市場。De Bondt 與 Thaler（1985）的過度反應研究開啟行為財務，指出心理因素、流行與雜訊交易會使價格偏離。
    edges:
    - [Information Access, Market Efficiency, +]
    - [Unexpected Information, Security Price Change, +]
    - [Market Efficiency, Abnormal Return, '-']
    - [Investor Overreaction, Security Price Change, +]
    - [Self-Confidence, Investor Overreaction, +]
    - [Noise Trading, Market Efficiency, '-']
    - [Bounded Rationality, Market Efficiency, '-']
    - [Past Performance, Risk Tolerance, +]
    refs:
    - {title: 'Fama, E. F. (1970). Efficient capital markets: A review of theory and empirical work. Journal of Finance, 25,
        383–417.', url: ''}
    - {title: 'De Bondt, W. F. M., & Thaler, R. (1985). Does the stock market overreact? Journal of Finance, 40, 793–805.',
      url: ''}
    - {title: 'Fama, E. F. (1991). Efficient capital markets: II. Journal of Finance, 46, 1575–1617.', url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 11 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 11 章。書上明寫：價格反映可得資訊（資訊→效率）、新資訊才使價格變動、效率市場下交易規則無超額報酬、雜訊交易與心理因素使價格偏離、較自信的投資人更會過度反應（p.114「may」語氣，書列為推測）。Past
      Performance→Risk Tolerance 出自「Suggestions for Further Research」第 7 條（風險容忍度在高報酬後上升），是研究建議不是定論。Bounded Rationality 是我用既有名稱對應書中「投資人資訊處理能力有限、有偏誤」；Information
      Access 對應書中「available information」。測量節列的 Opinion Leadership、Information-seeking、Uncertainty Orientation、Impact of Event
      量表與理論主體關係鬆散，Opinion Leader Influence 沿用既有名稱，Information Seeking 與 Uncertainty Orientation 列為缺。Calendar Anomaly（一月效應、週一效應）書中有描述但沒給因果，只列變數不畫邊。我們清單的
      Market Efficiency 已存在，但理論本身不在 our_theories.txt。
  Ethical Theory:
    abbr: E
    zh: 倫理理論
    field: 倫理／組織行為
    desc: 倫理理論說明行為在什麼條件下算「對」（Brady & Hart, 2007）。書分品格倫理（Aristotle、孔子）與行為倫理，後者再分目的論／效益主義（Bentham、Mill）、義務論（Kant 定言令式）與直覺主義（Ross
      1930 的 prima facie duties）；組織研究主要比較形式主義與效益主義兩種倫理架構如何影響倫理兩難的決策。
    edges:
    - [Ethical Framework, Ethical Decision, +]
    - [Gender, Perceived Ethical Framework of Others, +]
    - [Ethical Climate, Ethical Behavior, +]
    refs:
    - {title: 'Kant, I. (1993). Groundwork of the metaphysics of morals (3rd ed., J. W. Ellington, Trans.). Hackett. (Original
        work published 1785)', url: ''}
    - {title: 'Mill, J. S. (1998). Utilitarianism (R. Crisp, Ed.). Oxford University Press. (Original work published 1863)',
      url: ''}
    - {title: 'Rawls, J. (1971). A theory of justice. Belknap Press.', url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 12 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 12 章。這一章是規範性理論，書本身沒有「X 影響 Y」的實證主張，所以邊很少。三條邊的來源：(1) 書 p.121 說多種分類法（Brady 1985、Kohlberg 1984）描述「underlie
      ethical decisions」的倫理架構，我把它畫成架構→決策，符號 + 只表示「有影響」；(2) p.122 Schminke 等研究：男性被知覺為較效益主義、女性較形式主義，這是「知覺到的」性別差異，不是行為差異；(3)
      Ethical Climate 來自測量節的 Victor & Cullen（1988）與 Arnaud（2010）量表，書正文沒說明它與行為的關係，氣候→行為的正向是我依量表用途推的。書還說經理人常用「社會共識」取代倫理推理（p.124），只列
      Social Consensus Reliance 為變數不畫邊。我們清單有 Distributive/Procedural/Interactional Justice 與 Fairness，可和 Rawls 的正義論接上，但書沒把
      Rawls 寫成變數。
  Field Theory:
    abbr: F
    zh: 場域理論（力場理論）
    field: 社會心理／組織變革
    desc: Lewin（1943、1951）借物理學的場概念，主張行為是當下「生活空間」中所有並存且相互依賴之力的函數：驅動力與抑制力決定行為是否改變、改變多少，互相拉扯的力產生心理張力並驅動減少張力的目標導向行為；組織場域研究（Martin
      2003）則以行動者在場域中的相對位置解釋其行動。
    edges:
    - [Driving Forces, Behavior Change, +]
    - [Restraining Forces, Behavior Change, '-']
    - [Restraining Forces, Psychological Tension, +]
    - [Psychological Tension, Motivation, +]
    - [Valence, Approach Behavior, +]
    - [Valence, Avoidance Behavior, '-']
    - [Field Position, Behavior, +]
    refs:
    - {title: 'Lewin, K. (1951). Field theory in social science (D. Cartwright, Ed.). Harper & Brothers.', url: ''}
    - {title: 'Lewin, K. (1943). Defining the “field at a given time.” Psychological Review, 50, 292–310.', url: ''}
    - {title: 'Martin, J. L. (2003). What is field theory? American Journal of Sociology, 109, 1–49.', url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 13 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 13 章。書上明寫：驅動力與抑制力決定行為改變是否發生與程度（p.128）；相互抗衡的力產生心理張力，張力產生減少張力的動機（p.128，Houston et al. 1998）；正向整體力的物件被趨近、負向被迴避（p.128，Diamond
      1992）。Valence 沿用既有名稱對應書中「overall positive/negative force」。Restraining Forces→Psychological Tension 是我依「countervailing
      forces create tension」推的，書寫的是「所有抗衡之力」而非只有抑制力。Field Position→Behavior 來自組織場域那段（p.130「行動可由其在場域中的相對位置解釋」），符號 + 只表示有影響。批評節指出理論是套套邏輯、不可否證，邊的實證效力弱。測量節只有
      Sauder（2008）的院長排名量表與 Riordan（1993）的家族目標量表，與核心構念對不上，沒採用。
  Game Theory:
    abbr: G
    zh: 賽局理論
    field: 經濟學／策略
    desc: Von Neumann 與 Morgenstern（1944）以紙牌、棋類為原型，分析多個理性自利的參與者在互相依賴的策略賽局中如何選擇；核心概念為參與者、策略、結果、報酬與均衡，Nash（1951）均衡指每人在對手行動下都已取得最佳結果。假設完全資訊與理性，Harsanyi
      延伸到不完全資訊賽局。
    edges:
    - [Payoff, Strategy Choice, +]
    - [Information Asymmetry, Prediction Accuracy, '-']
    - [Expected Future Interaction, Cooperation, +]
    - [Reciprocity, Cooperation, +]
    - [Commitment Credibility, Cooperation, +]
    - [Trust, Cooperation, +]
    - [Group Size, Cooperation, '-']
    - [Group-based Pay, Free Riding, +]
    refs:
    - {title: 'Von Neumann, J., & Morgenstern, O. (1944). Theory of games and economic behavior. Princeton University Press.',
      url: ''}
    - {title: 'Nash, J. (1951). Non-cooperative games. Annals of Mathematics, 54, 286–295.', url: ''}
    - {title: 'Schelling, T. C. (1960). The strategy of conflict. Harvard University Press.', url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 14 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 14 章。理論主體是形式模型，書沒寫成變數間的因果，大部分邊來自「Implications for Managers」一節（p.140–141）：知道未來要互動最能促進合作、設定互惠、可信承諾（限制自己未來選項）、主動給予信任換取信任、小團體比大團體容易合作、以團體努力計薪會誘發搭便車。Payoff→Strategy
      Choice 是理性參與者極大化報酬的基本假設。Information Asymmetry→Prediction Accuracy 來自批評節（p.137）：有完全資訊時預測最準，一方資訊有限時較不準；用 Information Asymmetry
      這個既有名稱反向對應書中「complete information」。Bounded Rationality 對應批評節「參與者不總是理性」。Perceived Fairness 書說是強烈動機（p.141），沒給明確目標變數，未畫邊。測量節（微笑價值、社會價值取向、預測準確度）與理論本體關係鬆散。
  Image Theory:
    abbr: I
    zh: 意象理論
    field: 決策／組織行為
    desc: Beach 與 Mitchell（1987、1990）提出的描述性決策理論，主張人多以直覺、快速、非分析的方式決策：以價值意象、軌跡意象、策略意象三種基模構成決策框架，先用相容性測試篩除違反標準的選項（違反數超過拒絕門檻即淘汰），再用獲利性測試在存活選項中選擇；進展決策則檢查現行計畫是否朝目標推進。
    edges:
    - [Number of Violations, Option Adoption, '-']
    - [Rejection Threshold, Number of Violations -> Option Adoption, m]
    - [Image Compatibility, Option Adoption, +]
    - [Option Profitability, Option Adoption, +]
    - [Progress toward Goal, Status Quo Continuation, +]
    - [Optimism, Status Quo Continuation, +]
    - [Leader-Image Compatibility, Job Satisfaction, +]
    - [Leader-Image Compatibility, Affective Commitment, +]
    refs:
    - {title: 'Beach, L. R. (1990). Image theory: Decision making in personal and organizational contexts. Wiley.', url: ''}
    - {title: 'Mitchell, T. R., & Beach, L. R. (1990). “. . . Do I love thee? Let me count . . .” Toward an understanding
        of intuitive and automatic decision making. Organizational Behavior and Human Decision Processes, 47, 1–20.', url: ''}
    - {title: 'Beach, L. R. (1998). Image theory: Theoretical and empirical foundations. Erlbaum.', url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 16 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 16 章。篩選階段只看違反（p.152–153）：違反數達拒絕門檻即淘汰，所以畫成違反數→採用為負、門檻為調節。相容性與獲利性兩個測試是書明寫的；Option Profitability
      是獲利性測試的對象（選項達成後的吸引力，測量節 Beach et al. 1996 稱 object attractiveness）。進展決策：只要現行計畫對軌跡意象有進展就維持現狀，不相容太大才換方向（p.153）。Optimism→Status
      Quo Continuation 來自 p.153「決策者有自然偏誤以樂觀看待現況、高估現況與軌跡仍相容的證據」，Optimism 沿用既有名稱但書中是「bias」不是特質。Leader-Image Compatibility 兩條邊來自
      Dunegan（2003）對追隨者滿意與承諾的研究（p.153），書只說「examined the influence」，正向是依測量節量表用途推的；Affective Commitment 用既有名稱對應書中 commitment。三種意象本身是結構不是因果變數，列為缺的構念但不畫邊。
  Knowledge-Based Theory:
    abbr: KB
    zh: 知識基礎理論（知識基礎觀點）
    field: 策略管理
    desc: Kogut 與 Zander（1992）、Grant（1996）主張組織之所以存在，是因為它比市場更能有效整合與運用個人持有的知識；知識是最具策略價值的資源，默會知識難以編碼、模仿，因此是競爭優勢來源。Grant 提出規則、順序、例規、團體問題解決四種整合機制，皆依賴共同知識。
    edges:
    - [Knowledge Codifiability, Knowledge Transfer, +]
    - [Tacit Knowledge, Resource Inimitability, +]
    - [Resource Inimitability, Competitive Advantage, +]
    - [Common Knowledge, Knowledge Integration, +]
    - [Hierarchical Complexity, Knowledge Sharing, '-']
    - [Knowledge Integration, Competitive Advantage, +]
    - [Absorptive Capacity, Firm Performance, +]
    - [Knowledge Protection, Firm Performance, +]
    - [Intellectual Capital, Competitive Advantage, +]
    refs:
    - {title: 'Grant, R. M. (1996). Toward a knowledge-based theory of the firm. Strategic Management Journal, 17(Winter Special
        Issue), 109–122.', url: ''}
    - {title: 'Kogut, B., & Zander, U. (1992). Knowledge of the firm, combinative capabilities, and the replication of technology.
        Organization Science, 3, 384–397.', url: ''}
    - {title: 'Nonaka, I. (1994). A dynamic theory of organizational knowledge creation. Organization Science, 5, 14–37.',
      url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 18 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 18 章。書上明寫：默會知識不易取得、複製成本高（p.168）→ 用既有的 Resource Inimitability 接到 Competitive Advantage（p.169「知識存量帶來差異效率與競爭優勢」）；更會尋找、吸收、利用新知識的公司績效較好（p.168，Martin-de-Castro
      2011）→ 用既有的 Absorptive Capacity；能保護外顯知識的公司績效較好（Liebeskind 1996）；四種整合機制都依賴共同知識（p.169）；複雜層級阻礙共同知識分享（p.170）。Knowledge Codifiability→Knowledge
      Transfer 來自測量節 Kogut & Zander（1993）的可編碼性、可教性、複雜性量表，書正文只說默會知識只能靠觀察練習學得，方向是依該文獻推的。Intellectual Capital（人力、結構、關係資本）書說與創造運用知識的能力有關，沒明確因果，→Competitive
      Advantage 是依「Suggestions for Further Research」第 5 條推的。Complexity 沿用既有名稱對應 Kogut & Zander 的 complexity 量表，但我們的 Complexity
      原本是 IDT 構念，語意不同需留意。Centralization（IT 決策集中）出自 Kearns & Sabherwal（2007）量表，未畫邊。我們清單有 Knowledge、Knowledge Sharing、Knowledge
      Transfer、Absorptive Capacity、Causal Ambiguity，但理論本身不在 our_theories.txt；與 RBV、ACT、DCT 相鄰，建議合併判斷是否另立。
  Mental Models Theory:
    abbr: MM
    zh: 心智模式理論
    field: 認知／決策／團隊
    desc: Johnson-Laird（1983）與 Gentner 與 Stevens（1983）主張人用簡化的內在知識結構理解並與世界互動：人通常只建構一個自認為真的模式並在其中推理，因而忽略模式外的可能；組織研究假設心智模式愈準確、愈完整的經理人與組織績效愈高，團隊研究則顯示共享心智模式提升團隊績效（Mohammed
      et al. 2010）。
    edges:
    - [Mental Model Accuracy, Firm Performance, +]
    - [Mental Model Completeness, Firm Performance, +]
    - [Shared Mental Model, Team Performance, +]
    - [Working Memory Capacity, Mental Model Formation, +]
    - [Single-Model Reliance, Alternative Consideration, '-']
    - [Single-Model Reliance, Confirmatory Information Search, +]
    - [Single-Model Reliance, Decision Error, +]
    - [Mental Model Accuracy, Decision Error, '-']
    refs:
    - {title: 'Johnson-Laird, P. N. (1983). Mental models. Harvard University Press.', url: ''}
    - {title: 'Gentner, D., & Stevens, A. L. (Eds.). (1983). Mental models. Erlbaum.', url: ''}
    - {title: 'Johnson-Laird, P. N. (1980). Mental models in cognitive science. Cognitive Science, 4, 71–115.', url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 20 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 20 章。書上明寫：能建構並使用準確心智模式的組織較成功、對自身能力與環境原則理解更完整準確的經理人績效更高（p.183，Cockburn et al. 2000；Gary &
      Wood 2011）；共享心智模式對團隊績效有大量正向支持（p.185，Mathieu et al. 2008）；記憶好的人較易形成心智模式（p.185，Westbrook 2006）→ 用既有的 Working Memory Capacity
      對應「good memories」，嚴格說書講的是一般記憶不是工作記憶。依賴單一模式→不考慮替代方案、只搜尋支持該行動的資訊、忽略機會成本（p.184–185）；Three Mile Island 例子是推到 Decision Error
      的依據，書沒用「decision error」一詞。Confirmatory Information Search 與既有的 Selective Exposure 概念相近但那是媒體使用脈絡，故另列。Team Performance
      清單沒有（只有 Job Performance、Firm Performance）。測量節的機會成本量表（Friedman & Neumann 1980）、團隊心智模式相似度與準確度量表（Lim & Klein 2006；Smith-Jentsch
      et al. 2005）支持 Shared Mental Model 與 Mental Model Accuracy 兩個構念。理論本身與 CLT、Bounded Rationality 相鄰，但不在 our_theories.txt。
  Organizational Ecology Theory:
    abbr: OE
    zh: 組織生態理論
    field: 組織
    desc: Hannan 與 Freeman（1977, 1989）提出。以族群為分析層次，解釋為何有這麼多（或這麼少）種組織：族群密度同時驅動正當化與競爭，決定組織的創立率與死亡率；年齡、規模、通才／專才策略與制度連結影響存活。
    edges:
    - [Population Density, Legitimacy, +]
    - [Population Density, Rivalry Intensity, +]
    - [Legitimacy, Founding Rate, +]
    - [Rivalry Intensity, Organizational Survival, '-']
    - [Organization Age, Organizational Survival, +]
    - [Organization Size, Organizational Survival, +]
    - [Generalist Strategy, Organizational Survival, +]
    - [Environmental Uncertainty, Generalist Strategy -> Organizational Survival, m]
    refs:
    - {title: 'Hannan, M. T., & Freeman, J. (1977). The population ecology of organizations. American Journal of Sociology,
        82, 929–964.', url: ''}
    - {title: 'Hannan, M. T., & Freeman, J. (1989). Organizational ecology. Harvard University Press.', url: ''}
    - {title: 'Hannan, M. T., & Freeman, J. (1984). Structural inertia and organizational change. American Sociological Review,
        49, 149–164.', url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 21 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 21 章。密度依賴（density dependence）：書上明寫密度→正當化↑→創立增、失敗減；密度→競爭↑→死亡增（p192）。年齡、規模與存活正向、通才較專才長壽、與制度連結較長壽皆書上明寫（p193–194）；年齡效果書上另提「青春期負債」呈倒
      U，邊只取主效果。為守住 8 條上限，未入邊但書上有的關係：Legitimacy→Organizational Survival「+」（正當化升高則失敗減少）、Interorganizational Ties→Organizational
      Survival「+」（與制度連結者較長壽，p194）、Structural Inertia→Organizational Survival「-」（後者是我依「liability of obsolescence」推的）。環境波動的典型期間調節通才／專才優勢（p193）為書上明寫，對應我們的
      Environmental Uncertainty。書中「competition」對應我們既有 Rivalry Intensity；「ties to societal institutions」沿用 Interorganizational
      Ties，但嚴格說是制度連結。Measuring Variables 一節只列一個「satisfaction with present community scale」（Carpenter 1977），與理論核心構念無關，故變數以正文為準。
  Role Theory:
    abbr: R
    zh: 角色理論
    field: 組織／社會學
    desc: Biddle（1979）系統化，源自 Linton、Mead、Merton、Goffman。人被社會化去扮演與社會位置相連、帶有期望且持續存在的角色；功能論看角色為社會加諸的期望，互動論看角色為互動中不斷協商製造；管理上的核心構念是角色衝突與角色模糊。
    edges:
    - [Socialization, Role Expectations, +]
    - [Role Conflict, Role Stress, +]
    - [Role Ambiguity, Role Stress, +]
    - [Role Conflict, Job Performance, '-']
    - [Role Ambiguity, Job Performance, '-']
    - [Role Stress, Intrinsic Motivation, '-']
    - [Role Stress, Creativity, '-']
    - [Task Complexity, Role Conflict, +]
    refs:
    - {title: 'Biddle, B. J. (1979). Role theory: Expectations, identities, and behaviors. Academic Press.', url: ''}
    - {title: 'Biddle, B. J. (1986). Recent developments in role theory. Annual Review of Sociology, 12, 67–92.', url: ''}
    - {title: 'Rizzo, J. R., House, R. J., & Lirtzman, S. I. (1970). Role conflict and ambiguity in complex organizations.
        Administrative Science Quarterly, 15, 150–163.', url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 27 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 27 章。正文大多是定義與學派對照，可畫的因果集中在管理意涵節：角色衝突造成壓力並降低績效（p245）為書上明寫；角色模糊→績效負向是我依「確保沒有角色模糊」那段推的。Role
      Stress→Intrinsic Motivation／Creativity 出自 Measuring Variables 的 Coelho, Augusto & Lages（2011）標題（角色壓力與內在動機中介脈絡因素→第一線員工創造力），方向依該文一般結論推，書上沒明寫。Task
      Complexity→Role Conflict 來自 Suggestions for Further Research 第 10 條（工作複雜度如何影響角色衝突與模糊），是待驗證的提問不是定論。Role Flexibility／Role
      Permeability（Hall & Richter 1988）為多重角色觀點的構念，書上無因果敘述。Rizzo et al. 1970 雖只在 Measuring Variables 出現，但它是角色衝突／模糊量表的來源，故列入
      key_refs。我們既有 Role Stress 與 Roles 兩項，但缺其下位構念 Role Conflict 與 Role Ambiguity。
  Sensemaking Theory:
    abbr: S
    zh: 意義建構理論
    field: 組織
    desc: Weick（1979, 1995）提出。人如何注意到事件、賦予事件意義、並讓共識建構的意義影響現在與未來行動；意義來自把當下線索放進過去社會化而來的框架，過程具認同建構、回溯、促成、社會性、持續、擷取線索、合理性優於準確性七項特徵。
    edges:
    - [Extracted Cues, Shared Meaning, +]
    - [Frames, Shared Meaning, +]
    - [Environmental Scanning, Interpretation, +]
    - [Interpretation, Strategic Action, +]
    - [Strategic Action, Firm Performance, +]
    - [Environmental Uncertainty, Sensegiving, +]
    - [Sensegiving, Shared Meaning, +]
    - [Conflicting Frames, Firm Performance, '-']
    refs:
    - {title: 'Weick, K. E. (1995). Sensemaking in organizations. Sage.', url: ''}
    - {title: 'Weick, K. E., Sutcliffe, K. M., & Obstfeld, D. (2005). Organizing and the process of sensemaking. Organization
        Science, 16, 409–421.', url: ''}
    - {title: 'Weick, K. E. (1979). The social psychology of organizing (2nd ed.). Addison-Wesley.', url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 29 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 29 章。這是歷程／詮釋型理論，書上的主體是定義（線索、框架、七特徵、六種框架、Maitlis 四型）而不是變數間的假設，所以邊少且多為流程序列而非統計因果。線索＋框架→意義（p256「what
      makes sense is a cue inside a frame」）為書上明寫。掃描→詮釋→行動→結果為 Thomas, Clark & Gioia（1993）的連鎖（p257），書上稱為「general process」，我把它畫成序列邊；最後一段到績效以
      Firm Performance 承接。模糊、不可預測的議題或多方利害關係人出現時領導者才進行 sensegiving（p257）→寫成 Environmental Uncertainty→Sensegiving。衝突框架（paradox）抑制績效出自
      Luscher & Lewis（2008）那段（p258）。Maitlis（2005）的 animation×control 是分類軸不是因果，列為變數但不畫邊。Enactment、Plausibility 是特徵性構念，無法給方向。Social
      Identity 沿用我們既有名稱對應書上「identity construction」，但書上指的也包括組織認同。Measuring Variables 多半是個案研究的量表（Gioia & Thomas 1996 形象／認同／資訊處理；Grant,
      Dutton & Rosso 2008 員工支持方案；Ibarra & Andrews 1993 網絡中心性與鄰近性；Thomas, Clark & Gioia 1993 正向獲益與可控性），Network Centrality 來自
      Ibarra & Andrews 標題，書上未寫其方向故不入邊。
  Social Comparison Theory:
    abbr: SC
    zh: 社會比較理論
    field: 社會心理
    desc: Festinger（1954）提出：人有維持穩定、準確自我評價與保護自尊的需求，缺乏客觀標準時便以他人的意見與能力評估自己，偏好與相似者比較。後續擴充為向上／向下比較、同化／對比結果，以及社會比較傾向的個別差異。
    edges:
    - [Objective Standard Availability, Social Comparison, '-']
    - [Self-Evaluation Uncertainty, Social Comparison, +]
    - [Social Comparison Orientation, Social Comparison, +]
    - [Perceived Similarity, Social Comparison, +]
    - [Role Stress, Upward Comparison, +]
    - [Upward Comparison, Job Satisfaction, +]
    - [Upward Comparison, Job Performance, +]
    - [Downward Comparison, Job Performance, '-']
    refs:
    - {title: 'Festinger, L. (1954). A theory of social comparison. Human Relations, 7, 117–140.', url: ''}
    - {title: 'Buunk, A. P., & Gibbons, F. X. (2007). Social comparison: The end of a theory and the emergence of a field.
        Organizational Behavior and Human Decision Processes, 102, 3–21.', url: ''}
    - {title: 'Suls, J., & Wheeler, L. (Eds.). (2000). Handbook of social comparison. Plenum/Kluwer.', url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 32 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 32 章。我們清單沒有這個理論；既有的 Comparison with Own Judgment 是演算法建議情境的變數，不是同一構念。書上明寫：客觀資訊不可得才比較、不確定／高壓／競爭情境下比較、相似者為比較對象、Brown
      et al.（2007）角色模糊＋任務自主＋核心自我評價→向上比較→工作滿意與情感承諾（為控制邊數，Autonomy、Core Self-Evaluations→Upward Comparison 與 Upward Comparison→Affective
      Commitment 三條正向邊未列，可依此補）。Role Stress 沿用我們清單（書上是 role ambiguity，屬其子構面）。向上／向下比較對績效的方向書上說兩者皆可能正可能負，這裡依管理者啟示節（向上比較→改善、向下比較→鬆懈）取號，應標為有爭議。Measuring
      一節只有社會比較傾向量表與「成為向上比較對象之敏感度」量表。
  Social Facilitation Theory:
    abbr: SF
    zh: 社會助長理論
    field: 社會心理
    desc: Triplett（1898）觀察、Zajonc（1965）理論化：他人在場（觀眾或共事者）提高喚起水準並強化優勢反應，簡單或熟練的任務表現變好、困難任務變差。後續以評價焦慮、分心－衝突與窒息機制解釋，並延伸到電子監控與虛擬觀眾。
    edges:
    - [Mere Presence of Others, Arousal, +]
    - [Arousal, Dominant Response, +]
    - [Task Complexity, Mere Presence of Others -> Job Performance, m]
    - [Evaluation Apprehension, Effort, +]
    - [Distraction, Attentional Conflict, +]
    - [Attentional Conflict, Cognitive Load, +]
    - [Performance Pressure, Self-Focused Attention, +]
    - [Self-Focused Attention, Job Performance, '-']
    refs:
    - {title: 'Zajonc, R. B. (1965). Social facilitation. Science, 149, 269–274.', url: ''}
    - {title: 'Guerin, B. (1993). Social facilitation. Cambridge University Press.', url: ''}
    - {title: 'Aiello, J. R., & Douthitt, E. A. (2001). Social facilitation from Triplett to electronic performance monitoring.
        Group Dynamics, 5, 163–180.', url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 34 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 34 章。我們清單沒有這個理論。書上明寫：他人在場→喚起（驅力）→優勢反應；任務簡單時表現升、困難時降（故以 Task Complexity 當調節）；評價焦慮下人只是更努力（mere
      effort）；他人在場造成分心→注意衝突→認知超載（表現降）或喚起升（表現升），兩條路徑並存，Cognitive Load→Job Performance 負向與 Mere Presence→Distraction 正向未列以控制邊數；高壓→自我意識→逐步監控技能→窒息；工作記憶高者反而更受壓力傷害（可補
      Working Memory Capacity 調節 Performance Pressure→Job Performance）；電子監控與虛擬人也有助長效果（Monitoring→Arousal 正向未列）。Arousal→Job
      Performance 依修正驅力理論是倒 U，不畫成單一邊。Job Performance 是沿用我們的名稱，書上是 task performance。Measuring 節只有思考控制問卷與 Spielberger 狀態焦慮量表，與理論核心構念對不太上，故
      State Anxiety 列入但無邊。批評節指出 Bond & Titus（1983）發現評價焦慮影響很小、單純在場效果很弱。
  Social Network Theory:
    abbr: SN
    zh: 社會網絡理論
    field: 社會學／組織
    desc: Granovetter（1973）、Burt（1992）等發展：人因彼此連結而想法與行為相似，分析行動者之間的連帶結構即可解釋其行為。核心概念為關係、鑲嵌、結構型態與網絡的社會效用；弱連帶跨接網絡、結構洞與經紀位置帶來資訊與控制優勢。
    edges:
    - [Network Centrality, Structural Social Capital, +]
    - [Tie Strength, Bridging Social Capital, '-']
    - [Structural Holes, Information Access, +]
    - [Brokerage, Control, +]
    - [Embeddedness, Trust, +]
    - [Embeddedness, Knowledge Transfer, +]
    - [Small-World Structure, Innovation Performance, +]
    - [Normative Pressure, Adoption, +]
    refs:
    - {title: 'Granovetter, M. (1973). The strength of weak ties. American Journal of Sociology, 78, 1360–1380.', url: ''}
    - {title: 'Kilduff, M., & Brass, D. J. (2010). Organizational social network research: Core ideas and key debates. Academy
        of Management Annals, 4, 317–357.', url: ''}
    - {title: 'Burt, R. (2005). Brokerage and social closure. Oxford University Press.', url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 36 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 36 章。我們清單只有 T Social Capital Theory 與 T Network Effects，前者是本理論的近親但不等同（社會資本是結果，網絡結構是前因），後者是經濟學概念，故判定為缺。書上明寫：中心位置最有利、人經由網絡位置獲得社會資本、連帶強度由時間／情感強度／互信／互惠決定、局部橋全是弱連帶、鑲嵌連帶比臂距連帶更利於信任／資訊傳遞／解題、結構洞帶來資訊與資源的優勢進而擴大控制機會、小世界網絡提升協作與創造力但過頭會反轉（Uzzi
      & Spiro, 2005，故 Small-World→Innovation Performance 是倒 U，暫標正）。Normative Pressure→Adoption 來自 Measuring 節 Frank et al.（2004）social
      pressure to use computers 與創新擴散，沿用我們的名稱。Tie Strength→Bridging Social Capital 取負號是把「弱連帶跨接」改寫成連續變數。
  Structuration Theory:
    abbr: S
    zh: 結構化理論
    field: 社會學
    desc: Giddens（1984）提出：社會結構（規則與資源）既是行動的媒介也是其結果（結構二重性），透過反覆實踐而存在。表意、支配、正當化三種結構經詮釋基模、設施、規範三種模態對應溝通、權力、制裁三種互動；人為本體安全感執行常規。
    edges:
    - [Social Structure, Routines, +]
    - [Routines, Social Structure, +]
    - [Routines, Ontological Security, +]
    - [Routines, Self-Esteem, +]
    - [Routines, Institutionalization, +]
    - [Critical Situations, Routines, '-']
    refs:
    - {title: 'Giddens, A. (1984). The constitution of society: Outline of the theory of structuration. Polity Press.', url: ''}
    - {title: 'Giddens, A. (1979). Central problems in social theory: Action, structure, and contradiction in social analysis.
        Macmillan.', url: ''}
    - {title: 'Poole, M. S. (1996). The structuration of group decisions. In R. Y. Hirokawa & M. S. Poole (Eds.), Communication
        and group decision making (2nd ed., pp. 114–146). Sage.', url: ''}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 39 章', url: ''}
    enrich_notes: 來源：Miles 2012 第 39 章。我們清單沒有這個理論，也沒有 DeSanctis & Poole（1994）的調適性結構化理論（AST）。這是詮釋性社會理論，核心主張是結構與行動的遞迴二重性，不是可檢定的單向因果，所以邊少且皆為書上敘述的改寫：結構促成並約束行為、執行常規強化結構（雙向，各畫一邊）、人為取得本體安全感與自我認同／自尊而執行常規、常規深植後成為傳統再成為制度、關鍵情境打斷常規並改變傳統與制度。Power
      指 Giddens 的一般性權力互動，我們清單只有 Stakeholder Power、Out-group Power 等特定權力，故列缺。Informal Sanctions 沿用我們名稱對應 sanction 互動；Social
      Norm 對應 norms 模態；Communication 沿用既有。Measuring 節給的是 AST 的 faithfulness of appropriation 量表（Chin et al., 1997）、強結構化理論問題（Greenhalgh
      & Stones, 2010）與規則資源理解問題，與主幹構念無直接對應。批評節：Archer 認為理論保留而非超越結構／行動二分，Anderson 批評以語言類比社會結構不當。
  Dual-Process Theory:
