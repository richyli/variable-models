# 補充的常見理論（2026-10-16）
# 這些理論在 vault 裡沒有獨立的理論 note（有 note 的用 note: 指回去），結構是依教科書／原始論文整理的標準版本，
# 頁面上一律畫虛線並標「補充理論」。每條邊：[來源, 目標, 符號]；符號 + / - ；調節寫成 [調節變數, "來源 -> 目標", m]。
# 變數名稱盡量沿用 vault 既有變數（Perceived Severity、Skepticism、Crisis Responsibility…），新變數會以虛線灰框顯示。

