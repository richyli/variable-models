    desc: Festinger（1957）：兩個以上互相衝突的認知會產生失調這種不舒服的驅力，人會改變態度或行為、增添新認知、選擇性接觸一致訊息來消除它；認知愈重要、選擇愈自由、理由愈不充分，失調愈強。
    refs:
    - {title: Cognitive Dissonance Theory (EBSCO Research Starters), url: 'https://ebsco.com/research-starters/social-sciences-and-humanities/cognitive-dissonance-theory'}
    - {title: Cognitive Dissonance outline (A First Look at Communication Theory), url: 'https://www.afirstlook.com/edition-11/theory-resources/by-type/outline/Cognitive-Dissonance'}
    - {title: 'Selective exposure and cognitive dissonance (International Journal of Communication, 2021)', url: 'https://ijoc.org/index.php/ijoc/article/download/14184/3512'}
    enrich_notes: 原有四條全部保留。補上 Festinger 的失調強度決定因素（認知重要性當調節、理由不充分即 Festinger–Carlsmith 1959 的 1 美元效果）、失調是心理不適（Discomfort）的來源，以及三種消除途徑（改態度、改行為、選擇性接觸）回頭降低失調的負向回饋邊。Dissonance
      → Behavior 指改變行為以求一致。
