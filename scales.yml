      than expected…）。
Goal Commitment:
  zh: ''
  scales:
  - name: Hollenbeck, Klein, O'Leary & Wright (1989)
    source: Hollenbeck, Klein, O'Leary & Wright (1989) J. Applied Psychology 74(6) 九題；Klein, Wesson, Hollenbeck,
      Wright & DeShon (2001) OBHDP 85(1) 建議五題版（KUT）
    url: https://db.arabpsychology.com/scales/goal-commitment-measure/
    verified: false
    items:
    - It's hard to take this goal seriously.（反向）
    - Quite frankly, I don't care if I achieve this goal or not.（反向）
    - I am strongly committed to pursuing this goal.
    - It wouldn't take much to make me abandon this goal.（反向）
    - I think this is a good goal to shoot for.
    - It's unrealistic for me to expect to reach this goal.（反向；九題版）
    - I am willing to put forth a great deal of effort beyond what I'd normally do to achieve this goal.（九題版）
    scale: 5-point, 1 = strongly disagree, 5 = strongly agree
    reliability: α .70–.89（九題版）
    context: ''
    notes: 九題為原句；前五題即 Klein et al. (2001) 五題版（組合依記憶，開啟頁面未列五題版）。
Individual Impact:
  zh: ''
  scales:
  - name: DeLone & McLean (1992, 2003) 六構面之 individual impact／net bene
    source: DeLone & McLean (1992, 2003) 六構面之 individual impact／net benefits；題項常用 Torkzadeh & Doll (1999) Omega
      27(3) 或 Davis (1989) 式績效題
    url: https://en.wikipedia.org/wiki/Information_systems_success_model
    verified: false
