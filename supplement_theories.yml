    field: 資訊視覺化
    desc: Hullman、Resnick 與 Adar（2015）提出假設結果圖：以動畫逐幀呈現從分布抽出的個別結果，讓讀者用計數等頻率式推理讀出機率，不需統計背景。比較兩、三個變數大小時，HOPs 遠比誤差棒與小提琴圖準確；單變數時三者相近。
    edges:
    - [Animated Outcome Draws, Frequency-Based Reasoning, +]
    - [Frequency-Based Reasoning, Probability Estimation Accuracy, +]
    - [Animated Outcome Draws, Comparison Accuracy, +]
    - [Static Error Bars, Comparison Accuracy, '-']
    - [Distribution Variance, Probability Estimation Accuracy, '-']
