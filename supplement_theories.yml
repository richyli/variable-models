        of Marketing 68(4)', url: 'https://experts.illinois.edu/en/publications/the-price-is-unfair-a-conceptual-framework-of-price-fairness-perc/'}
    - {title: Paperguide summary of The Price is Unfair!, url: 'https://paperguide.ai/papers/06e80161-779c-40a1-9c88-2e954942f9f0/'}
    - {title: 'Haga (2023) review organizing price fairness research with the Xia et al. framework, Marketing Journal (DOAJ)',
      url: 'https://doaj.org/article/16f40c2014904cfab8053218d741e6f5'}
    enrich_notes: 保留原六條。補 Xia 等框架裡的交易相似度（新造 Transaction Similarity，調節價差到公平感）、買賣關係（用名單既有 Trust）、知覺價值，以及負面結果（抱怨、負面口碑；Word of
      Mouth 正向代表不公平時負面口碑增加）。原文全文本次只拿到摘要，框架細節依最常被引用的版本整理。
  T SCE Switching Cost Effect:
