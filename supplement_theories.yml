  "Perceived Value Model":
    abbr: PVal
    zh: 知覺價值模型（Zeithaml）
    field: 行銷／消費者
    desc: Zeithaml（1988）：知覺價值是「得到的」與「付出的」之間的權衡，由知覺品質與知覺犧牲（價格、時間、心力）決定。
    edges:
      - [Perceived Quality, Perceived Value, "+"]
      - [Perceived Sacrifice, Perceived Value, "-"]
      - [Price, Perceived Quality, "+"]
      - [Price, Perceived Sacrifice, "+"]
      - [Perceived Value, Purchase Intention, "+"]
  "Price Fairness Model":
    abbr: PFair
    zh: 價格公平（雙重權利原則）
    field: 行銷／定價
    desc: Kahneman, Knetsch & Thaler（1986）；Xia, Monroe & Cox（2004）：與參考價格的落差、賣方動機歸因與交易相似性決定公平感，公平感影響滿意與購買。
    edges:
      - [Price Difference from Reference, Perceived Price Fairness, "-"]
      - [Seller Cost Justification, Perceived Price Fairness, "+"]
      - [Seller Profit Motive Attribution, Perceived Price Fairness, "-"]
      - [Perceived Price Fairness, User Satisfaction, "+"]
      - [Perceived Price Fairness, Purchase Intention, "+"]
      - [Dynamic Pricing, Price Difference from Reference, "+"]
  "T SCE Switching Cost Effect":
    note: "T SCE Switching Cost Effect"
    abbr: SCE
    zh: 轉換成本效應
    field: 行銷／顧客
    edges:
      - [Procedural Switching Cost, Switching cost, "+"]
      - [Financial Switching Cost, Switching cost, "+"]
