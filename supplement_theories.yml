  Exit, Voice, Loyalty:
    note: Exit, Voice, Loyalty
    abbr: EVL
    zh: 退出、發聲與忠誠（Hirschman）
    field: 組織經濟／顧客
    edges:
    - [Dissatisfaction, Exit, +]
    - [Dissatisfaction, Voice, +]
    - [Dissatisfaction, Neglect, +]
    - [Consumer Loyalty, Exit, '-']
    - [Consumer Loyalty, Voice, +]
    - [Alternative Attractiveness, Exit, +]
    - [Alternative Attractiveness, Voice, '-']
    - [Voice Cost, Voice, '-']
    - [Perceived Influence, Voice, +]
    - [Voice, Service Recovery, +]
    - [Service Recovery, User Satisfaction, +]
    - [Service Recovery, Exit, '-']
    - [Consumer Loyalty, Service Recovery -> Exit, m]
    desc: Hirschman（1970）提出退出、發聲與忠誠：組織衰退引發的不滿可化為退出（轉向替代者）或發聲（抱怨以求改善），忠誠使人延後退出、提高發聲；替代選項多則退出，發聲成本與成功機會決定發聲，後續研究加上忽視成為 EVLN。
    refs:
    - {title: 'Exit, Voice, and Loyalty Model - Wikipedia', url: 'https://en.wikipedia.org/wiki/Exit,_Voice,_and_Loyalty_Model'}
    - {title: 'Testing Hirschman''s exit, voice, and loyalty model: citizen and provider responses to decline in public health
        services (Exeter repository)', url: 'https://ore.exeter.ac.uk/repository/handle/10871/125289'}
    - {title: 'Huefner & Hunt (1994) Extending the Hirschman Model: When Voice and Exit Don''t Tell the Whole Story (JCSDCB)',
      url: 'https://jcsdcb.com/index.php/JCSDCB/article/view/599'}
    enrich_notes: 原六條邊保留。Hirschman 原書是論述式沒有正負號；方向依最常見的實證轉述：替代選項多則退出而非發聲（故 Alternative Attractiveness -> Voice 為負）、發聲成本（Voice
      Cost，新造）降低發聲、預期影響力（Perceived Influence，新造）提高發聲；忠誠延後退出並提高發聲是 Hirschman 的核心命題，雖然 Exeter 的調查實驗未找到忠誠的調節證據，但找到供應者回應提高滿意、降低退出且效果受忠誠強化，故補
      Service Recovery 的兩條邊與忠誠調節。Neglect（新造）來自 Rusbult 等人的 EVLN 擴充。Wikipedia 條目把模型寫成公民—政府賽局，此處採顧客／組織版本。
  Three-Component Commitment Model:
    abbr: TCM
    zh: 組織承諾三成分模型
    field: 組織行為
    desc: Meyer 與 Allen（1991）提出組織承諾三成分模型：情感承諾（想留）來自工作經驗與組織支持，持續承諾（必須留）來自離開代價與缺乏替代，規範承諾（應該留）來自社會化與互惠；三者皆降低離職意圖，只有情感承諾穩定預測績效與公民行為。
