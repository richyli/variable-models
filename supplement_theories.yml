    enrich_notes: 保留原五條。TRI 本身是量表而非因果模型，原文只有四面向構成科技準備度；對結果變項的路徑依 Lin、Shih 與 Sher（2007）的 TRAM 整合模型與 Blut 與 Wang（2020）後設分析（準備度影響使用意圖與實際使用）決定。
