    enrich_notes: 原五條保留。補 Zeithaml 的線索層（內在線索如成分、外在線索如品牌、價格屬外在線索）、非貨幣犧牲（時間、心力）與最終購買。價格的雙重角色（既抬高品質也抬高犧牲）在原模型就存在，淨效果不定，這點來源都有提到。
