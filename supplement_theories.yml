    - {title: Umbrella Summary - Psychological Contract Breach (QIC-WD), url: 'https://www.qic-wd.org/sites/default/files/Umbrella%20Summary%20-%20Psychological%20Contract%20Breach%20091020.pdf'}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 25 章', url: ''}
    enrich_notes: 保留原六條。依 Morrison & Robinson 的解讀歷程補兩個調節（互動公平、把責任歸給組織會放大違反情緒），並補員工警覺（以 Monitoring 表示）提高察覺違約。Zhao 等的後設分析確認情緒中介且對行為效果較弱，故加
      Trust 與 Job Performance。Perceived Organizational Support 的調節在系統性回顧中只被列出而無一致結果，保留但證據弱。
    book_check: Miles 2012 第 25 章對照：補 6 條邊；書中變數我們原本沒有的：Psychological Contract Fulfillment、Mutuality、Transactional Contract、Relational
      Contract、Balanced Contract、Transitional Contract。我們清單只有 PCB（違反）這一支，書講的是整個心理契約理論，故 in_our_list 記為有、但建議補「履行」端的構念。正文多為定義性描述；明確的因果只有
      p224「依知覺到的承諾履行而行動」、p229「未得到預期結果→低落的態度與行為」，Breach→Job Satisfaction／Job Performance 負向是我把後者具體化。Breach→Trust 負向與 Breach→Violation
      Feelings 來自 References to Know 的 Robinson（1996）與 Measuring Variables 的 Robinson & Morrison（2000）標題，方向依題名推。Turnover Intention
