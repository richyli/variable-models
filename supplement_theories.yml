      8 條上限未入邊）依 p224 契約由入職前因素、在職經驗（orientation、socialization、training）形塑，且理想上互惠與相互同意，屬概念性邊。四種契約型態（p225）為類別變數，無法畫成有向邊。Measuring
      Variables：Robinson & Morrison 2000 五題違反量表、Dabos & Rousseau 2004、Rousseau 2000 PCI。
