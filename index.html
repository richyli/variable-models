  --node:#ffffff;--node-line:#9aa3b2;--node-ink:#1d2330;--ghost:#f1f2f5;--ghost-ink:#8a93a3;

}

  --bg:#12151b;--panel:#1a1e27;--ink:#e6e9ef;--muted:#99a1b0;--line:#2a303c;--line2:#3a4150;
  --accent:#7ea2ff;--accent-ink:#0e1424;--sel:#4a3a05;--sel-line:#e3b23c;--sim:#4a2a12;--sim-line:#f08a4b;

  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#12151b;--panel:#1a1e27;--ink:#e6e9ef;--muted:#99a1b0;--line:#2a303c;--line2:#3a4150;
  --accent:#7ea2ff;--accent-ink:#0e1424;--sel:#4a3a05;--sel-line:#e3b23c;--sim:#4a2a12;--sim-line:#f08a4b;
  --node:#232834;--node-line:#5b6473;--node-ink:#e6e9ef;--ghost:#1e222b;--ghost-ink:#6d7686;
  --pos:#5ccf8a;--neg:#f07b7b;--mod:#b89cf0;--seed:#6d7686;--chip:#243151;--chip-ink:#a9c0ff;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.top h1{font-size:16px;margin:0;white-space:nowrap;cursor:pointer}.top h1:hover{color:var(--accent)}
.top .tg{border:1px solid var(--line2);background:transparent;border-radius:6px;padding:3px 8px;cursor:pointer;color:var(--muted);font-size:12px}.top .tg:hover{color:var(--ink)}
.top .meta{color:var(--muted);font-size:12px;white-space:nowrap}
.pair{display:flex;align-items:center;gap:6px;flex:1;max-width:900px;min-width:0}
.pair .arrow{color:var(--muted);font-size:18px;flex:none}
.search{position:relative;flex:1;min-width:0}
.search.to input{border-style:dashed}
.search.to.on input{border-style:solid}
.search input::-webkit-search-cancel-button{display:none}
.search input{width:100%;padding:8px 36px 8px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.search .clr{position:absolute;right:6px;top:5px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}
.dd{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;display:none;z-index:9}
.dd.open{display:block}
.dd .it{padding:7px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.dd .it:hover,.dd .it.act{background:var(--chip)}.dd .it.ghost>span:first-child{color:var(--ghost-ink)}
.dd .it .al{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd .it .n{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0;min-height:calc(100vh - 53px)}
.layout.noside{grid-template-columns:minmax(0,1fr)}.layout.noside .side{display:none}
.side .legend{padding:6px 12px;color:var(--muted);font-size:11px;line-height:1.4}
.side{border-right:1px solid var(--line);background:var(--panel);overflow:auto;max-height:calc(100vh - 53px);position:sticky;top:53px}
.side .grp{padding:6px 12px 2px;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;border-top:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.side .v{display:flex;align-items:center;gap:6px;padding:4px 12px;cursor:pointer;font-size:13px}
.side .v:hover{background:var(--chip)}
.side .v.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--sel-line)}
.side .v .cnt{margin-left:auto;color:var(--muted);font-size:11px}
.side .v.ghost{color:var(--muted);box-shadow:inset 3px 0 0 var(--line2)}.side .v.ghost span:first-child{opacity:.85}
.main{padding:12px 16px 40px;min-width:0}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr);gap:12px;margin-bottom:10px}
.hero .card{max-height:270px;overflow:auto}
.hero.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.hero .back{font-size:12px;margin:0 0 6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:600}
.hero .name{font-size:20px;font-weight:700;margin:0 0 4px;line-height:1.2;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.hero .name a{font-size:12px;font-weight:500;white-space:nowrap}
.hero .desc{color:var(--muted);font-size:12px;margin:6px 0 0;max-height:3.2em;overflow:hidden}
.hero .papers{margin-top:6px;font-size:12px;display:flex;flex-wrap:wrap;gap:4px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-size:12px;border:1px solid transparent;cursor:pointer}
.chip.plain{background:var(--ghost);color:var(--ink);cursor:default}
.chip.ghost{background:var(--ghost);color:var(--ink);border:1px dashed var(--node-line)}
.chip:not(.plain):hover{filter:brightness(.93)}
.chip.sim{background:var(--sim);color:var(--ink);border-color:var(--sim-line)}
.chip.th{background:var(--panel);border-color:var(--line2);color:var(--ink)}
.chip.th b{color:var(--accent)}.chip.th.sup{border-style:dashed}
.tidx{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.tidx .fld{display:flex;gap:10px;align-items:baseline}
.tidx .fh{font-size:12px;font-weight:600;color:var(--muted);flex:none;width:92px;text-align:right}
.tidx .chips{gap:4px 6px}
.links a{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{display:flex;align-items:baseline;gap:10px;margin:12px 0 8px;flex-wrap:wrap}
.sec h2{font-size:15px;margin:0;white-space:nowrap}
.sec .hint{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));grid-auto-flow:dense;gap:12px}
.model{display:flex;flex-direction:column;min-height:200px}
.model.wide{grid-column:1 / -1 !important}
.model .cv{overflow-x:auto;overflow-y:hidden;flex:1;display:flex;align-items:center}
.model .cv svg{flex:none}
.model .cv.fit svg{max-width:100%;height:auto}
.model .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.model .hd .ab{font-weight:700;font-size:15px;color:var(--accent);cursor:pointer}.model .hd .ab:hover{text-decoration:underline}
.model .hd .nm{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.model .hd .lv{font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:0 5px;white-space:nowrap}
.model .hd .lv.sup{border-style:dashed;color:var(--sim-line);border-color:var(--sim-line)}
.model .hd .tools{margin-left:auto;display:flex;gap:4px;white-space:nowrap}
.model .hd button{border:1px solid var(--line2);background:transparent;border-radius:6px;padding:1px 7px;font-size:11px;cursor:pointer;color:var(--muted)}
.model .hd button:hover{color:var(--ink);border-color:var(--ink)}.model .hd button[aria-pressed="true"]{background:var(--chip);color:var(--chip-ink);border-color:var(--chip-ink)}
.model svg{display:block}
.model .ft{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px;align-items:center}
.model .ft .k{display:inline-flex;align-items:center;gap:4px}
.model .ft i{display:inline-block;width:18px;height:0;border-top:2px solid var(--seed)}
.model .ft i.solid{border-top-style:solid;border-color:var(--node-line)}
.model .ft i.dash{border-top-style:dashed}
.model .ft i.mod{border-top-style:dotted;border-color:var(--mod)}
.model .ft i.hot{border-top-width:3px;border-color:var(--accent)}
.model .ft b.sw{display:inline-block;width:14px;height:10px;border-radius:3px;border:1.5px solid var(--sel-line);background:var(--sel)}
.model .ft b.sw.sim{border-color:var(--sim-line);background:var(--sim)}
.model .ft b.sw.ghost{border:1px dashed var(--node-line);background:var(--ghost)}
.model .ft a{margin-left:auto}
.node{cursor:pointer}
.node rect{fill:var(--node);stroke:var(--node-line);stroke-width:1.2}
.node text{fill:var(--node-ink);font-size:12px;pointer-events:none}
.node:hover rect{stroke:var(--accent);stroke-width:2}
.node.sel rect{fill:var(--sel);stroke:var(--sel-line);stroke-width:2.2}
.node.sim rect{fill:var(--sim);stroke:var(--sim-line);stroke-width:1.8}
.node.path rect{stroke:var(--accent);stroke-width:1.8}
.node.dst rect{fill:var(--chip);stroke:var(--accent);stroke-width:2.4}
.chip.dst{background:var(--chip);border-color:var(--accent);color:var(--chip-ink)}
.model .ft b.sw.dst{border-color:var(--accent);background:var(--chip)}
.dim{opacity:.35}
.node.ghost rect{fill:var(--ghost);stroke-dasharray:3 3}
.node.ghost text{fill:var(--ghost-ink)}
.edge{fill:none;stroke:var(--node-line);stroke-width:1.4}
.edge.seed{stroke-dasharray:6 4;stroke:var(--seed)}
.edge.neg{stroke:var(--neg)}
.edge.mod{stroke:var(--mod);stroke-dasharray:2 3}
.edge.hot{stroke-width:2.6;stroke:var(--accent)}
.edge.hot.neg{stroke:var(--neg)}
.elab.dim{opacity:.35}.elab.big{font-size:14px}
.elab{font-size:11px;fill:var(--muted)}
.elab.pos{fill:var(--pos);font-weight:700}.elab.neg{fill:var(--neg);font-weight:700}.elab.mod{fill:var(--mod)}
.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line2);border-radius:10px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl td,.tbl th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl .chip{white-space:nowrap}.tbl .ths{display:flex;flex-wrap:wrap;gap:3px;align-items:center}.tbl td:first-child{width:1%;white-space:nowrap}
.tbl th{color:var(--muted);font-weight:600;white-space:nowrap}
.kbd{font-size:11px;color:var(--muted)}
@media (max-width:1100px){.hero{grid-template-columns:1fr 1fr}.hero .card:last-child{grid-column:1/-1}}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}.side{display:none}
  .hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}
  .top{flex-wrap:wrap;gap:8px}.top .meta{display:none}.top .tg{display:none}.pair{max-width:none;flex-basis:100%;flex-wrap:wrap}.search{flex-basis:100%}.pair .arrow{display:none}
  .hero.two{grid-template-columns:1fr}.tidx .fh{width:auto;text-align:left}
  .main{padding:10px 16px 40px}
}

el of collective action"}], "variables": ["Behavior", "Collective Efficacy", "Perceived Injustice", "Social Identity", "Social Norm"], "supplement": false, "field": ""}, {"id": "T Social Capital Theory", "abbr": "SocCap", "name": "Capital Theory", "zh": "社會資本理論", "level": "社會層級", "desc": "社會資本理論主張，個人或組織的資源不僅來自於自身，也依賴於社會網絡中的關係和互動。 社會資本包括以下三個主要構面： 結構資本（Structural Capital）**：社會網絡的結構（如聯繫的數量與模式）。 --> T Structural Holes Theory 關係資本（Relational Capital）**：網絡中的信任、義務和認同。 認知資本（Cognitive Capital）**：共同的語言與文化理解。 在資訊管理中，社會資本理論用於解釋組織內部與外部如何利用社會網絡來促進知識分享與合作。 範…", "images": 0, "notes": [{"name": "T Social Capital Theory"}], "variables": ["Bonding Social Capital", "Bridging Social Capital", "Information Access", "Social Network Use", "Social Support", "Well-being"], "supplement": false, "field": "社會學／CMC"}, {"id": "T Social Identity Theory", "abbr": "SIT", "name": "Social Identity Theory", "zh": "社會認同理論", "level": "", "desc": "", "images": 2, "notes": [{"name": "T Social Identity Theory"}], "variables": ["In-group", "Personal Identify", "Social Categorization", "Social Groups Distinction", "Social Identity", "Social Norm"], "supplement": false, "field": ""}, {"id": "T SPT Social Presence Theory", "abbr": "SPT", "name": "Social Presence Theory", "zh": "社會臨場感理論", "level": "個人層級", "desc": "Social Presence Theory (SPT)，中文常翻譯為「社會臨場理論」，最初由 **John Short**、**Ederyn Williams** 和 **Bruce Christie** 在 1976 年提出。該理論探討在媒介溝通過程中，不同媒介如何影響參與者之間的互動與「社會臨場感」的程度，即感知彼此「同在」的程度。 3. **溝通效果（Communication Effectiveness） 社會臨場感的高低會影響溝通的效率、互動滿意度以及任務完成效果： 高社會臨場感**可促進團隊合作、提…", "images": 2, "notes": [{"name": "T SPT Social Presence Theory"}], "variables": ["Behavioral Intention", "Media Richness", "Social Presence", "Trust", "User Satisfaction"], "supplement": false, "field": "傳播／電商"}, {"id": "T TOE Technology–Organization–Environment", "abbr": "TOE", "name": "Technology–Organization–Environment Framework", "zh": "科技－組織－環境架構", "level": "組織層級", "desc": "科技–組織–環境框架 (Technology–Organization–Environment Framework, TOE) 主要 function renderSvg(tid, selId, simSet, dstId = null, pathSet = null) {

function fitGrids() {
  const main = $('main'); const mw = main.clientWidth - 32;
  const cols = mw >= 1150 ? 4 : mw >= 760 ? 3 : mw >= 520 ? 2 : 1;
  document.documentElement.style.setProperty('--cols', cols);
  const colPx = (mw - 12 * (cols - 1)) / cols;
  for (const card of document.querySelectorAll('.model')) {
    const svg = card.querySelector('svg'); if (!svg) { card.style.gridColumn = `span ${Math.min(cols, 2)}`; continue; }
    const w = +svg.dataset.w + 30; // 卡片左右內距
    let span = Math.min(cols, Math.max(1, Math.ceil(w / (colPx + 12) / 1.25))); // 容許縮 25% 以內，不多佔一欄
    if (card.classList.contains('wide')) span = cols;
    card.style.gridColumn = `span ${span}`;
    const avail = span * colPx + 12 * (span - 1) - 30;
    card.querySelector('.cv').classList.toggle('fit', w - 30 > avail && (w - 30) <= avail * 1.4); // 差 40% 內就縮，再寬就橫向捲
    card.dataset.span = span;
  }
  // 同一列只有一張卡 → 撐滿整列（空白收進卡內）
  for (const grid of document.querySelectorAll('.grid')) {
    const rows = {};
    for (const c of grid.querySelectorAll('.model')) (rows[Math.round(c.offsetTop)] ||= []).push(c);
    for (const cs of Object.values(rows)) if (cs.length === 1 && +cs[0].dataset.span < cols) cs[0].style.gridColumn = `span ${cols}`;
  }
}

  const relChips = related.map(({ o, n }) => `<span class="chip th ${o.supplement ? 'sup' : ''}" data-topen="${esc(o.id)}" title="${esc(o.zh || o.name)}；共用 ${n} 個變數"><b>${esc(o.abbr)}</b> ${n}</span>`).join('') || '<span class="hint">沒有共用變數的理論</span>';
  const field = (t.field || '').split('／')[0];
  const sameField = field ? D.theories.filter(o => o.id !== tid && (o.field || '').split('／')[0] === field).map(o => `<span class="chip th ${o.supplement ? 'sup' : ''}" data-topen="${esc(o.id)}" title="${esc(o.zh || o.name)}"><b>${esc(o.abbr)}</b></span>`).join('') : '';
  const back = sel ? `<p class="back"><a href="#v=${encodeURIComponent(sel)}" data-id="${esc(sel)}">← 回到 ${esc(V[sel].label)}</a></p>` : `<p class="back"><a href="#" id="backHome">← 回到首頁</a></p>`;
  return `<div class="hero two">
    <section class="card">${back}<h2>${t.supplement ? '補充理論（作者筆記裡沒有；結構依教科書／原始論文整理）' : '作者筆記裡的理論'}${field ? '　' + esc(t.field) : ''}${t.level ? '　' + esc(t.level) : ''}</h2><p class="name"><span>${esc(t.abbr)}</span><span class="hint" style="font-size:14px;font-weight:400">${esc(t.name)}${t.zh ? '　' + esc(t.zh) : ''}</span></p>
      ${t.desc ? `<p class="desc" style="max-height:none">${esc(t.desc)}</p>` : ''}</section>
    <section class="card"><h2>這個模型的變數（${t.variables.length}）<span class="hint" style="font-weight:400">　點一個改成以它為中心</span></h2><div class="chips">${vars}</div>
      <h2 style="margin-top:10px">共用變數最多的理論<span class="hint" style="font-weight:400">　數字＝共用幾個</span></h2><div class="chips">${relChips}</div>
      ${sameField ? `<h2 style="margin-top:10px">同領域（${esc(field)}）</h2><div class="chips">${sameField}</div>` : ''}</section>
  </div>
  <div class="grid">${modelCard(tid, sel, new Set(sel ? V[sel].similar : []))}</div>`;
}
function openTheory(tid, push = true) {
  if (!T[tid]) return;
  dst = null; $('q2').value = ''; $('toBox').classList.remove('on'); closeDD(); closeDD2();
  if (push) history.pushState({}, '', '#t=' + encodeURIComponent(tid) + (sel ? '&v=' + encodeURIComponent(sel) : ''));
  renderSide(); $('main').innerHTML = renderTheory(tid); fitGrids(); window.scrollTo({ top: 0 });
  document.getElementById('backHome')?.addEventListener('click', e => { e.preventDefault(); goHome(); });
}
function renderPair(x, y) {
  const reach = reachableFrom(x.id)[y.id] || new Set();
  const tids = D.theories.map(t => t.id).filter(t => reach.has(t));
  const direct = D.edges.filter(e => e.sign !== 'm' && e.src === x.id && e.dst === y.id);
  const mids = new Set();
  for (const t of tids) for (const n of (pathNodes(t, x.id, y.id) || [])) if (n !== x.id && n !== y.id) mids.add(n);
  const dg = new Map();
  for (const e of direct) { const k = e.theory || ''; const g = dg.get(k) || { signs: new Set(), src: new Set() }; if (e.sign) g.signs.add(e.sign); g.src.add(e.source === 'seed' ? '補充的邊' : '筆記：' + (e.note || '')); dg.set(k, g); }
  const directRows = dg.size ? [...dg].map(([k, g]) => `<span class="chip th ${k && T[k]?.supplement ? 'sup' : ''}" data-tid="${esc(k)}" title="${esc([...g.src].join('；'))}"><b>${esc(k ? (T[k]?.abbr || k) : '其他筆記')}</b> ${[...g.signs].map(x => x === '-' ? '<span style="color:var(--neg)">−</span>' : '<span style="color:var(--pos)">+</span>').join(' ')}</span>`).join('') : '<span class="hint">沒有直接的邊，只有經過中介的路徑</span>';
  const midChips = mids.size ? [...mids].map(n => `<span class="chip" data-id="${esc(n)}">${esc(V[n]?.label || n)}</span>`).join('') : '<span class="hint">—（全是直接相連）</span>';
  const thChips = tids.map(t => `<span class="chip th" data-tid="${esc(t)}"><b>${esc(T[t].abbr)}</b> ${esc(T[t].zh || T[t].name)}</span>`).join('') || '<span class="hint">沒有模型同時含這兩個變數的路徑</span>';
  let html = `<div class="hero">
    <section class="card"><h2>關係</h2><p class="name"><span class="chip" data-id="${esc(x.id)}" style="font-size:16px;background:var(--sel);color:var(--ink);border-color:var(--sel-line)">${esc(x.label)}</span><span class="hint">→</span><span class="chip dst" data-id="${esc(y.id)}" style="font-size:16px">${esc(y.label)}</span></p>
      <h2 style="margin-top:8px">直接的邊（${direct.length}）</h2><div class="chips">${directRows}</div></section>
    <section class="card"><h2>有這條路徑的模型（${tids.length}）<span class="hint" style="font-weight:400">　點了捲到那張圖</span></h2><div class="chips">${thChips}</div></section>
    <section class="card"><h2>路徑上的中介變數（${mids.size}）</h2><div class="chips">${midChips}</div>
      <p class="hint" style="margin:8px 0 0">點圖上或這裡的變數＝改以它當自變數、依變數不變（點到依變數本身則只看它）；清掉右邊的依變數就回到單一變數檢視。</p></section>
  </div>`;
  html += `<div class="sec"><h2>有這條路徑的模型</h2><span class="hint">不在路徑上的節點與邊已淡化</span></div>`;
  html += tids.length ? `<div class="grid">${tids.map(t => modelCard(t, x.id, new Set(), null, y.id)).join('')}</div>` : `<div class="empty">沒有模型能從 ${esc(x.label)} 走到 ${esc(y.label)}。</div>`;
  return html;
}
function nbTable(nb) {
  if (!nb.length) return '<span class="hint">—</span>';
  // 依「方向＋另一端變數」合併，理論排成同一列的小 chip
  const groups = new Map();
  for (const e of nb) {
    const other = e.mod === sel ? e.dst : (e.src === sel ? e.dst : e.src);
    const dir = e.sign === 'm' || e.mod === sel ? 'mod' : (e.src === sel ? 'out' : 'in');
    const k = dir + '|' + other; const g = groups.get(k) || { dir, other, signs: new Set(), ths: new Map(), notes: new Set() };
    if (e.sign && e.sign !== 'm') g.signs.add(e.sign);
    if (e.theory) g.ths.set(e.theory, (g.ths.get(e.theory) || '') + (e.source === 'seed' ? '補充的標準結構' : '來源：' + (e.note || '')));
    if (e.note) g.notes.add(e.note);
    groups.set(k, g);
  }
  const order = { out: 0, in: 1, mod: 2 };
  const rows = [...groups.values()].sort((a, b) => order[a.dir] - order[b.dir] || b.ths.size - a.ths.size).map(g => {
    const dirTxt = g.dir === 'out' ? '影響 →' : g.dir === 'in' ? '← 受影響於' : '調節';
    const sign = [...g.signs].map(s => s === '+' ? '<span style="color:var(--pos)">+</span>' : '<span style="color:var(--neg)">−</span>').join(' ') || '<span class="hint">·</span>';
    const ths = [...g.ths].map(([t, src]) => `<span class="chip th" data-tid="${esc(t)}" title="${esc(src)}"><b>${esc(T[t]?.abbr || t)}</b></span>`).join('');
    const notes = [...g.notes].join('、');
    return `<tr title="${esc(notes ? '來源 note：' + notes : '')}"><td class="hint">${dirTxt}</td><td><div class="ths"><span class="chip" data-id="${esc(g.other)}">${esc(V[g.other]?.label || g.other)}</span><span style="min-width:12px;text-align:center">${sign}</span>${ths || '<span class="hint">無理論標籤</span>'}</div></td></tr>`;
  });
  return `<div style="max-height:170px;overflow:auto"><table class="tbl"><thead><tr><th>方向</th><th>變數　符號　在哪些理論</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

/* ---------- 右邊（依變數）下拉 ---------- */
let dd2Idx = -1;
function dstCandidates() {
  if (!sel) return sortedVars.filter(v => targets.has(v.id)).map(v => ({ v, n: 0 }));
  const r = reachableFrom(sel);
  return sortedVars.filter(v => r[v.id]).map(v => ({ v, n: r[v.id].size }));
}
function openDD2(f) {
  const q = f.trim().toLowerCase();
  const list = dstCandidates().filter(({ v }) => !q || matches(v, q)).slice(0, 400);
  $('dd2').innerHTML = (sel ? `<div class="it" style="cursor:default"><span class="al">從 ${esc(V[sel].label)} 出發到得了的變數（${dstCandidates().length}）</span></div>` : `<div class="it" style="cursor:default"><span class="al">先選左邊的自變數，這裡會縮小成到得了的變數</span></div>`) +
    (list.map(({ v, n }, i) => `<div class="it ${i === 0 ? 'act' : ''} ${v.unlinked ? 'ghost' : ''}" data-id="${esc(v.id)}"><span>${esc(v.label)}</span><span class="al">${esc(v.aliases.slice(0, 3).join('・'))}</span><span class="n">${n ? n + ' 個模型' : ''}</span></div>`).join('') || '<div class="it"><span class="al">沒有符合的變數</span></div>');
  $('dd2').classList.add('open'); dd2Idx = list.length ? 0 : -1;
}
function closeDD2() { $('dd2').classList.remove('open'); }
$('q2').addEventListener('input', e => openDD2(e.target.value));
$('q2').addEventListener('focus', e => { e.target.select(); openDD2(''); });
$('q2').addEventListener('keydown', e => {
  const its = [...$('dd2').querySelectorAll('.it[data-id]')];
  if (e.key === 'ArrowDown') { dd2Idx = Math.min(its.length - 1, dd2Idx + 1); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { dd2Idx = Math.max(0, dd2Idx - 1); e.preventDefault(); }
  else if (e.key === 'Enter') { if (its[dd2Idx]) pickDst(its[dd2Idx].dataset.id); return; }
  else if (e.key === 'Escape') { closeDD2(); return; }
  else return;
  its.forEach((x, i) => x.classList.toggle('act', i === dd2Idx)); its[dd2Idx]?.scrollIntoView?.({ block: 'nearest' });
});
function pickDst(id) {
  if (!sel) { // 還沒選左邊：先記成待選依變數，左邊只列能走到它的自變數
    const srcs = sortedVars.filter(v => reachableFrom(v.id)[id]);
    pendingDst = id; $('q2').value = V[id].label; $('toBox').classList.add('on'); closeDD2(); renderMain(); $('q').focus(); openDD('');
    $('dd').innerHTML = `<div class="it" style="cursor:default"><span class="al">能走到 ${esc(V[id].label)} 的自變數（${srcs.length}）</span></div>` + srcs.map((v, i) => `<div class="it ${i === 0 ? 'act' : ''}" data-id="${esc(v.id)}" data-then="${esc(id)}"><span>${esc(v.label)}</span><span class="n">${reachableFrom(v.id)[id].size} 個模型</span></div>`).join('');
    ddIdx = srcs.length ? 0 : -1;
    return;
  }
  selectDst(id);
}
$('clr2').addEventListener('click', () => { pendingDst = null; if (sel) selectDst(null); else { $('q2').value = ''; $('toBox').classList.remove('on'); renderMain(); } $('q2').focus(); openDD2(''); });
function updatePlaceholder() { $('q2').placeholder = sel ? `依變數：從 ${V[sel].label} 到得了的 ${dstCandidates().length} 個` : '依變數：選了自變數後只剩到得了的'; }

/* ---------- 搜尋下拉 ---------- */
let ddIdx = -1;
function openDD(f) {
  const q = f.trim().toLowerCase();
  const list = sortedVars.filter(v => !q || matches(v, q)).sort((a, b) => (b.theories.length > 0) - (a.theories.length > 0)).slice(0, 400);
  $('dd').innerHTML = list.map((v, i) => `<div class="it ${i === 0 ? 'act' : ''} ${v.unlinked ? 'ghost' : ''}" data-id="${esc(v.id)}"><span>${esc(v.label)}</span><span class="al">${esc(v.aliases.slice(0, 4).join('・'))}</span><span class="n">${v.theories.length ? v.theories.length + ' 個模型' : ''}</span></div>`).join('') || '<div class="it"><span class="al">沒有符合的變數</span></div>';
  $('dd').classList.add('open'); ddIdx = list.length ? 0 : -1;
}
function closeDD() { $('dd').classList.remove('open'); }
$('q').addEventListener('input', e => { openDD(e.target.value); renderSide(e.target.value); });
$('q').addEventListener('focus', e => { e.target.select(); openDD(e.target.value === (sel ? V[sel].label : '') ? '' : e.target.value); });
$('q').addEventListener('keydown', e => {
  const its = [...$('dd').querySelectorAll('.it[data-id]')];
  if (e.key === 'ArrowDown') { ddIdx = Math.min(its.length - 1, ddIdx + 1); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { ddIdx = Math.max(0, ddIdx - 1); e.preventDefault(); }
  else if (e.key === 'Enter') { const it = its[ddIdx]; if (it) { if (it.dataset.then) { select(it.dataset.id, false); selectDst(it.dataset.then); } else select(it.dataset.id); } return; }
  else if (e.key === 'Escape') { closeDD(); return; }
  else return;
  its.forEach((x, i) => x.classList.toggle('act', i === ddIdx)); its[ddIdx]?.scrollIntoView?.({ block: 'nearest' });
});
$('clr').addEventListener('click', () => { $('q').value = ''; renderSide(''); $('q').focus(); openDD(''); });
function goHome() { sel = null; dst = null; pendingDst = null; history.pushState({}, '', location.pathname); updatePlaceholder(); $('q').value = ''; $('q2').value = ''; $('toBox').classList.remove('on'); closeDD(); closeDD2(); renderSide(); renderMain(); fitGrids(); window.scrollTo({ top: 0 }); }
$('home').addEventListener('click', goHome);
$('tgside').addEventListener('click', () => { const l = document.querySelector('.layout'); l.classList.toggle('noside'); const on = !l.classList.contains('noside'); $('tgside').setAttribute('aria-pressed', on); try { localStorage.setItem('vt-side', on ? '1' : '0'); } catch (e) {} fitGrids(); });
try { if (localStorage.getItem('vt-side') === '0') { document.querySelector('.layout').classList.add('noside'); $('tgside').setAttribute('aria-pressed', 'false'); } } catch (e) {}
document.addEventListener('click', e => {
  const it2 = e.target.closest('#dd2 .it[data-id]'); if (it2) { pickDst(it2.dataset.id); return; }
  const it = e.target.closest('#dd .it[data-id]'); if (it) { if (it.dataset.then) { select(it.dataset.id, false); selectDst(it.dataset.then); } else select(it.dataset.id); return; }
  if (!e.target.closest('.search')) { closeDD(); closeDD2(); }
  const sv = e.target.closest('.side .v'); if (sv) { select(sv.dataset.id); return; }
  const nd = e.target.closest('.node'); if (nd) { select(nd.dataset.id, true, nd.dataset.id !== dst); return; }
  const ch = e.target.closest('.chip[data-id]'); if (ch) { select(ch.dataset.id); return; }
  const to = e.target.closest('[data-topen]'); if (to) { openTheory(to.dataset.topen); return; }
  const th = e.target.closest('.chip[data-tid]'); if (th) { const c = document.querySelector(`.model[data-tid="${CSS.escape(th.dataset.tid)}"]`); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); else openTheory(th.dataset.tid); return; }
  const j = e.target.closest('[data-jump]'); if (j) { e.preventDefault(); document.getElementById(j.dataset.jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const b = e.target.closest('button[data-act="wide"]'); if (b) { const c = b.closest('.model'); c.classList.toggle('wide'); b.setAttribute('aria-pressed', c.classList.contains('wide')); fitGrids(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList?.contains('node')) select(e.target.dataset.id); if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); } });
function parseHash() { const m = location.hash.match(/#v=([^&]*)(?:&to=([^&]*))?/); const tm = location.hash.match(/#t=([^&]*)/); const vm = location.hash.match(/[#&]v=([^&]*)/); return { id: m ? decodeURIComponent(m[1]) : (vm ? decodeURIComponent(vm[1]) : ''), to: m && m[2] ? decodeURIComponent(m[2]) : '', t: tm ? decodeURIComponent(tm[1]) : '' }; }
function route(h) { if (h.t && T[h.t]) { sel = (h.id && V[h.id]) ? h.id : null; $('q').value = sel ? V[sel].label : ''; openTheory(h.t, false); } else if (h.id && V[h.id]) { dst = (h.to && V[h.to]) ? h.to : null; select(h.id, false, true); } else { sel = null; dst = null; $('q').value = ''; $('q2').value = ''; $('toBox').classList.remove('on'); renderSide(); renderMain(); fitGrids(); } }
window.addEventListener('popstate', () => route(parseHash()));

$('meta').textContent = `${D.variables.length} 個變數・${D.theories.length} 個模型・${D.edges.length} 條邊・${D.generated}`;
renderSide();
route(parseHash());
fitGrids();
</script>
