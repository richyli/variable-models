    desc: Wason 與 Evans（1974）提出、Kahneman（2011）普及：思考分為快速、自動、低耗能的系統一與緩慢、受控、依賴工作記憶的系統二；認知負荷高、動機或能力不足時系統一主導，較易出現捷思偏誤。
