Role Stress:
  zh: ''
  scales:
  - name: Rizzo, House & Lirtzman (1970)
    source: Rizzo, House & Lirtzman (1970) Administrative Science Quarterly 15(2) role conflict (8 題) 與 role ambiguity
      (6 題)
