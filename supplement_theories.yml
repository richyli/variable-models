    - [Trust, Transaction Cost, '-']
    desc: Coase（1937）開端、Williamson（1975、1985）系統化的交易成本經濟學主張：在有限理性與投機傾向下，資產專屬性、不確定性與交易頻率愈高，市場交易的搜尋、議約與監督成本愈高，廠商因此改採層級治理（垂直整合）。
    refs:
    - {title: Transaction cost - Wikipedia, url: 'https://en.wikipedia.org/wiki/Transaction_cost'}
    - {title: 'The economics of organization: The transaction cost approach (AcaWiki summary of Williamson 1981)', url: 'https://acawiki.org/The_economics_of_organization:_The_transaction_cost_approach'}
    - {title: The Treatment of Frequency in Transaction Cost Economics (Organizations and Markets), url: 'https://organizationsandmarkets.com/2006/09/06/the-treatment-of-frequency-in-transaction-cost-economics/'}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 40 章', url: ''}
    enrich_notes: 原六條邊保留。補兩個行為假設：有限理性（Bounded Rationality，新造）與投機；資產專屬性造成套牢（hold-up）風險，故同時提高投機機會與交易成本；資訊不對稱→投機沿用名單。Williamson
      把資產專屬性當最重要維度，不確定性與頻率主要在專屬性高時才推向層級治理，故另加兩條調節邊；頻率的定義在文獻中分歧（同一夥伴重複交易 vs 該類交易在市場上的常見程度），此處採 Williamson 原意（頻率高才值得負擔專屬治理結構的成本）。
    book_check: Miles 2012 第 40 章對照：補 5 條邊；書中變數我們原本沒有的：Contract Complexity、Relational Governance、Bilateral Dependency、Transaction
      Misalignment。與我們的 Transaction Cost（TCE）同一理論，核心變數幾乎都在。書上明寫：一方持有專屬資產即引發機會主義行為並需要昂貴契約保障（Poppo & Zenger, 1998）；交易成本低的企業績效較高（Williamson,
      1985）；雙邊依賴使各方脆弱而建立保值治理結構；多單位多目標造成交易錯位而損害績效（Bidwell, 2010；Transaction Misalignment→Firm Performance 負向未列）；信任降低交易成本並改善績效（Dyer
      & Chu, 2003，Measuring 節）；大企業官僚成本與管理錯誤使整合較不划算（Hart, 1988；Organization Size→Hierarchical Governance 負向未列）。資產專屬性、不確定性、頻率→層級治理的方向書上只說「這些差異幫助企業決定治理結構」，正號依
      Williamson 標準命題推（Transaction Frequency→Hierarchical Governance 正向未列）。Outcome Measurability 沿用我們名稱對應 Poppo & Zenger（2002）的
      measurement difficulty（反向），Perceived Reputation 對應 Carson et al.（2003）的 assessing reputations，Environmental Uncertainty
      涵蓋 John & Weitz（1988）的 volume uncertainty。Relational Governance（Dyer, 1997）書中有討論但無明確因果邊。批評節：Ghoshal & Moran 指出機會主義假設有自我實現預言問題。
