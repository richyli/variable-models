      本身，書中的利益清單都是接在彙總構念上，故列為缺。社會資本「取決於成員在關係網絡中的位置」（p264）寫成 Network Centrality→Social Capital。利益清單（職涯成功、高階薪酬、求職、招募、產品創新、資源交換、較低離職率、較低組織失敗率、成長、創業、供應商關係、跨公司學習；Adler
      & Kwon 2002；Florin et al. 2003，p264–265）為書上明寫，我挑五項對應既有或新變數入邊，Knowledge Transfer 對應「interfirm learning」。負面後果（排外、過度要求、限制自由、向下拉平）書上明寫（p265），入邊一條；Uzzi（1997）過度鑲嵌抑制知識流動、Hansen（2002）跨單位連結有維持成本亦書上明寫。Hansen（2002）跨單位連結有維持成本（Interorganizational
      Ties→Tie Maintenance Cost「+」）為守 8 條上限未入邊。Trust／Reciprocity／Cooperation／Norms 在 Fulkerson & Thompson（2008）分類裡屬「normative
      social capital」的成分，是構成關係不是因果，故不畫邊。書上另有重要批評：套套邏輯、因果方向不明、與 trust／membership／community 區分不清、幾乎無法測量（p266–267）。Measuring
      Variables：Onyx & Bullen 2000 一般社會資本量表、Kritsotakis et al. 2008 SCQ-G。
