    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 38 章', url: ''}
    enrich_notes: 原本「Task Uncertainty -> Structure-Environment Fit (-)」刪除：任務不確定本身不會降低契合，契合是結構與情境是否相配，不是任一情境變數的函數；改成任務不確定提高對有機式結構的需求（Burns
      & Stalker 的機械式／有機式對照）。新增 Woodward 的技術→結構、Donaldson／SAGE 條目的規模→專業化與正式化（小組織低專業化、大組織高專業化績效最佳，故以規模調節專業化→績效）。契合→績效是理論核心，Drazin
      & Van de Ven 的互動觀把環境不確定當調節變數，這裡同時列出「Fit -> Performance」主效果與環境不確定的調節，供畫圖時擇一。Organization Size、Formalization、Centralization、Specialization
      為名單外新造變數。
    book_check: Miles 2012 第 38 章對照：補 6 條邊；書中變數我們原本沒有的：Task Interdependence、Technology Routineness、Organizational Integration、Strategic
      Type、Strategic Choice。與我們的 T Contingency Theory 視為同一理論。書上明寫：契合→績效較高（Nadler & Tushman, 1980）；小組織配低官僚、大組織配高官僚（Child, 1975，故
      Organization Size→Formalization 正，嚴格說是契合關係而非因果）；任務不確定性升高時正式化降、分權升（Donaldson, 2001）；分化越大越需要整合機制（Lawrence & Lorsch）；Hage（1965）集權＋正式規則＋低複雜→效率最大（Centralization→Operational
      Efficiency 正向未列）、相反結構→創新；Burns & Stalker 機械式對有機式對應穩定對動盪環境（Environmental Uncertainty→Organic Structure Need 正向未列）；Perrow／Thompson／Woodward
      以技術與任務相依性論有機結構需求。管理者啟示節明寫「結構對績效的影響取決於技術水準」，故以 Technology 作調節。Strategic Type（Miles & Snow 四型）與 Strategic Choice（Child,
      1972）為書中概念但無明確因果邊。Perceived Fairness 只出現在 Measuring 節 Schminke et al.（2002），無邊。批評節：契合概念被指套套邏輯、理論被指決定論。
  T Economies of Scale and Scope:
    note: T Economies of Scale and Scope
    abbr: EoS
    zh: 規模與範疇經濟
    field: 組織經濟
    edges:
    - [Output Volume, Average Cost, '-']
    - [Fixed Cost Share, Output Volume -> Average Cost, m]
    - [Product Scope, Average Cost, '-']
    - [Shared Inputs, Product Scope -> Average Cost, m]
    - [Average Cost, Competitive Advantage, '-']
    - [Output Volume, Entry Barriers, +]
    - [Competitive Advantage, Firm Performance, +]
    - [Average Cost, Price, +]
    desc: 規模經濟為古典經濟學概念，範疇經濟由 Panzar 與 Willig（1977、1981）命名：產量增加或產品種類增加都能攤薄固定成本、共用投入，使平均成本下降，進而形成成本優勢與進入障礙。
    refs:
    - {title: Economies of scope (Wikipedia), url: 'https://en.wikipedia.org/wiki/Economies_of_scope'}
    - {title: 'Economies of Scale and Scope (Introduction to Economic Analysis, Saylor)', url: 'https://rachel.core2learn.org/modules/en-saylor/content/saylordotorg.github.io/text_introduction-to-economic-analysis/s11-02-economies-of-scale-and-scope.html'}
    - {title: Economies of Scale and Scope (Wiley chapter 2), url: 'https://catalogimages.wiley.com/images/db/pdf/9780470373606.ch02.pdf'}
    enrich_notes: 原有四條都保留；原本的調節邊寫法 [Fixed Cost Share, Average Cost, m, Output Volume] 改成本格式，意思不變（固定成本比例愈高，規模效果愈強）。新增範疇經濟的機制：共用投入（Shared
      Inputs）是 Panzar–Willig 定義中聯合生產省成本的來源，當作 Product Scope → Average Cost 的調節。規模經濟形成進入障礙是 Porter 五力中的標準連結。這是經濟學定義不是實證模型，方向依成本函數的定義寫。
  CBBE:
    note: CBBE
    abbr: CBBE
    zh: 顧客基礎品牌權益（Keller）
    field: 行銷／品牌
    edges:
    - [Brand Awareness, Brand Image, +]
    - [Brand Associations, Brand Image, +]
    - [Association Strength Favorability and Uniqueness, Brand Image, +]
    - [Brand Awareness, Brand Equity, +]
    - [Brand Image, Brand Equity, +]
    - [Brand Image, Brand Attitude, +]
    - [Brand Image, Brand Feelings, +]
    - [Brand Attitude, Brand Resonance, +]
    - [Brand Feelings, Brand Resonance, +]
    - [Brand Resonance, Consumer Loyalty, +]
    - [Brand Equity, Brand Attitude, +]
    - [Brand Attitude, Purchase Intention, +]
    - [Brand Equity, Consumer Loyalty, +]
    desc: Keller（1993）提出顧客基礎品牌權益：品牌知識（品牌知名度＋品牌形象，即聯想的強度、偏好與獨特性）對消費者回應行銷的差異效果；後續品牌共鳴金字塔依顯著性→表現與意象→判斷與感受→共鳴逐層建立，頂端是忠誠與投入。
    refs:
    - {title: Brand Resonance Model (Keller) summary (Umbrex), url: 'https://umbrex.com/?p=241605'}
    - {title: 'Keller 1993, Conceptualizing, Measuring, and Managing Customer-Based Brand Equity (Duke course PDF)', url: 'https://faculty.fuqua.duke.edu/~moorman/Marketing-Strategy-Seminar-2015/Session
        3/Keller.pdf'}
    - {title: 'Inventing the Edge: Kevin Lane Keller (Tuck School)', url: 'https://tuck.dartmouth.edu/news/articles/inventing-the-edge-kevin-lane-keller'}
    enrich_notes: 原六條保留。1993 版的核心是品牌知識＝知名度＋形象，形象由聯想的強度、偏好與獨特性構成，已補上後者。金字塔（1998 教科書）以 Brand Image 對應「表現與意象」、Brand Attitude
      對應「判斷」、新增 Brand Feelings 對應「感受」、Brand Resonance 為頂層再接忠誠。知名度→形象是金字塔中顯著性作為地基的意思。原典 PDF 未能解析，1993 定義依摘要與多個二手來源。
  Brand Attitude Model:
    abbr: Aad
    zh: 廣告態度→品牌態度→購買意圖
    field: 行銷／廣告
    desc: MacKenzie、Lutz 與 Belch（1986）提出雙中介假說：廣告態度不只直接轉移為品牌態度，還會經由品牌認知間接影響品牌態度，品牌態度再決定購買意圖；廣告可信度、喜好度與對廣告主的態度是廣告態度的主要前因，涉入程度決定認知路徑與情感路徑何者較強。
    edges:
    - [Ad Credibility, Attitude toward the Ad, +]
    - [Ad Likeability, Attitude toward the Ad, +]
    - [Ad Cognitions, Attitude toward the Ad, +]
    - [Attitude toward the Advertiser, Attitude toward the Ad, +]
    - [Attitude toward the Ad, Brand Cognitions, +]
    - [Attitude toward the Ad, Brand Attitude, +]
    - [Brand Cognitions, Brand Attitude, +]
    - [Involvement, Attitude toward the Ad -> Brand Attitude, m]
    - [Brand Attitude, Purchase Intention, +]
    refs:
    - {title: Attitude-toward-the-ad models (Wikipedia), url: 'https://en.wikipedia.org/wiki/Attitude-toward-the-ad_models'}
    - {title: 'Dual mediation replication in social advertising (Marchand, Laval working paper, IDEAS record)', url: 'https://ideas.repec.org/p/fth/lavadm/98-010.html'}
    - {title: 'Involvement and the Aad -> Ab path (Korean study, earticle)', url: 'https://www.earticle.net/Article/A113945'}
    enrich_notes: 保留原六條。補 1986 原模型的 Ad Cognitions（廣告認知 -> 廣告態度）、MacKenzie 與 Lutz（1989）的廣告主態度前因，以及涉入的調節（高涉入時品牌認知路徑較強、低涉入時廣告態度直接路徑較強）。
  Hierarchy of Effects:
    abbr: HoE
    zh: 效果層級模式（AIDA／Lavidge-Steiner）
    field: 行銷／廣告
    desc: Lavidge 與 Steiner（1961）提出：廣告讓消費者依序經過知曉、知識（認知）、喜好、偏好、確信（情感）到購買（行為）六個階段，每一階段是下一階段的前提；低涉入產品時階段順序會改變（先行為後態度），這是後續學者的主要修正。
    edges:
    - [Advertising Exposure, Brand Awareness, +]
    - [Brand Awareness, Knowledge, +]
    - [Knowledge, Brand Attitude, +]
    - [Brand Attitude, Brand Preference, +]
    - [Brand Preference, Conviction, +]
    - [Conviction, Purchase Intention, +]
    - [Purchase Intention, Purchase, +]
    - [Involvement, Knowledge -> Brand Attitude, m]
    refs:
    - {title: 'Monash Marketing Dictionary: Hierarchy of Effects Models', url: 'https://www.monash.edu/business/marketing/marketing-dictionary/h/hierarchy-of-effects-models'}
    - {title: 'Corporate Finance Institute: Hierarchy of Effects', url: 'https://corporatefinanceinstitute.com/learn/resources/management/hierarchy-of-effects'}
    - {title: 'FourWeekMBA: Hierarchy of Effects Model', url: 'https://fourweekmba.com/hierarchy-of-effects-model'}
    enrich_notes: 原本把偏好直接接到購買意圖，少了 Lavidge-Steiner 的「確信」階段，改成 Brand Preference -> Conviction -> Purchase Intention（新造 Conviction），並補廣告曝光（新造
      Advertising Exposure）為起點。Brand Attitude 對應「liking」。原模型是階段模型沒有正負號，依最常見實證版本全畫正向；Involvement 調節表示低涉入時認知到情感的順序會被打亂（Vaughn
      FCB 方格等修正）。
  Service-Profit Chain:
    abbr: SPC
    zh: 服務利潤鏈
    field: 行銷／服務
    desc: Heskett、Jones、Loveman、Sasser 與 Schlesinger（1994）：內部服務品質帶來員工滿意，員工滿意提高留任與生產力，兩者決定對顧客的外部服務價值，價值帶來顧客滿意與忠誠，忠誠驅動營收成長與獲利。
    edges:
    - [Internal Service Quality, Job Satisfaction, +]
    - [Job Satisfaction, Employee Retention, +]
    - [Job Satisfaction, Employee Productivity, +]
    - [Employee Retention, Service Quality, +]
    - [Employee Productivity, Service Quality, +]
    - [Service Quality, Perceived Value, +]
    - [Perceived Value, User Satisfaction, +]
    - [User Satisfaction, Consumer Loyalty, +]
    - [Consumer Loyalty, Firm Performance, +]
    refs:
    - {title: Service–profit chain (Wikipedia), url: 'https://en.wikipedia.org/wiki/Service%E2%80%93profit_chain'}
    - {title: 'The service-profit chain: an empirical analysis in high-contact service industries (Yee et al., PolyU)', url: 'https://ira.lib.polyu.edu.hk/bitstream/10397/13129/1/Yee_Service-profit_Chain_High-contact.pdf'}
    - {title: Service-profit chain test in a UK retailer (Warwick WRAP), url: 'https://wrap.warwick.ac.uk/id/eprint/12767'}
    enrich_notes: 原七條保留，補上原圖中缺的員工生產力分支（滿意→生產力→外部服務價值）。Service Quality 在此對應原文的 external service value 之前段，Perceived Value 對應外部服務價值，Firm
      Performance 合併營收成長與獲利。實證支持不一：香港 210 家服務店支持多數連結，英國單一零售商研究找不到員工滿意的驅動效果。
  T Means-End Chain Theory:
    note: T Means-End Chain Theory
    abbr: MEC
    zh: 手段目的鏈
    field: 行銷／消費者
    edges:
    - [Product Attributes, Functional Consequences, +]
    - [Product Attributes, Psychosocial Consequences, +]
    - [Functional Consequences, Psychosocial Consequences, +]
