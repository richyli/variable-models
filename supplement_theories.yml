    - {title: Investigating the role of health belief model on seat belt use for front seat passengers on urban and rural
        roads — NTNU Open, url: 'https://ntnuopen.ntnu.no/ntnu-xmlui/handle/11250/3066457'}
    - {title: 伊朗 Khomein 機車騎士安全帽使用與知覺障礙研究（SUMS）, url: 'https://journals.sums.ac.ir/article_44262_bbe0d5d0cd0f6b2fcccd40302924e27c.pdf'}
    enrich_notes: |-
      原六條中易感性與嚴重性改為經由 Perceived Threat（既有變數）中介，這是 Rosenstock–Strecher–Becker 圖的標準畫法；其餘直接邊保留。行動線索在標準圖中同時推升威脅感與直接觸發行為，兩條都畫。Knowledge → Perceived Susceptibility 代表修正因素透過信念作用。NCBI 頁面有瀏覽器驗證未能讀入，StatPearls 回 403，構念清單依搜尋摘要；2026 年系統性回顧指出各構念預測力中等且隨行為不同。
      只補交通安全的應用邊，HBM 主體構念沿用既有變數。安全帶四條來自泰國與伊朗兩筆橫斷研究；安全帽只找到知覺障礙（悶熱、聽力、價格）的證據，Perceived Health Benefits→Helmet Use 是 HBM 通行版本的延伸。最後兩條是 Haddon 事故中階段的保護效果。
  Extended Parallel Process Model:
    abbr: EPPM
    zh: 延伸平行歷程模式
    field: 健康傳播
    desc: Witte（1992）提出：恐懼訴求先引發威脅評估（嚴重性、易感性），威脅夠高才引發恐懼並進入效能評估（反應效能、自我效能）；效能高於威脅時走危險控制、接受訊息並改變行為，效能低時走恐懼控制、以否認、迴避與反彈來壓抑恐懼而拒絕訊息。
    edges:
    - [Perceived Severity, Perceived Threat, +]
    - [Perceived Susceptibility, Perceived Threat, +]
    - [Response Efficacy, Perceived Efficacy, +]
    - [Self-Efficacy, Perceived Efficacy, +]
    - [Perceived Threat, Fear, +]
    - [Perceived Threat, Danger Control, +]
    - [Perceived Efficacy, Danger Control, +]
    - [Perceived Threat, Perceived Efficacy -> Danger Control, m]
    - [Fear, Fear Control, +]
    - [Perceived Efficacy, Fear Control, '-']
    - [Danger Control, Behavior, +]
    - [Fear Control, Avoidance Behavior, +]
    - [Fear Control, Reactance, +]
    refs:
    - {title: 'Wikipedia: Extended parallel process model', url: 'https://en.wikipedia.org/wiki/Extended_parallel_process_model'}
    - {title: Witte (1992) Putting the Fear Back into Fear Appeals (CBSM summary), url: 'https://cbsm.com/articles/32473-putting-the-fear-back-into-fear-appeals-the-extended-parallel-process-model'}
    - {title: 'Popova (2012) EPPM review, Health Education & Behavior', url: 'https://journals.sagepub.com/doi/pdf/10.1177/1090198111418108'}
    enrich_notes: 保留原八條。補威脅決定反應強度（Perceived Threat -> Danger Control）、威脅必須先超過門檻效能才起作用（畫成 Perceived Threat 調節 Perceived Efficacy
      -> Danger Control），以及兩條路徑的行為結果（危險控制 -> 行為；恐懼控制 -> 防衛性迴避與心理反彈，皆為名單既有變數）。Popova（2012）回顧指出 EPPM 各命題未獲一致支持，此處仍依原模型畫。
  ELM:
    note: ELM
    abbr: ELM
    zh: 推敲可能性模式
    field: 說服
    edges:
    - [Involvement, Motivation, +]
    - [Need for Cognition, Motivation, +]
    - [Knowledge, Ability, +]
    - [Distraction, Ability, '-']
    - [Motivation, Elaboration, +]
    - [Ability, Elaboration, +]
    - [Argument Quality, Attitude, +]
    - [Elaboration, Argument Quality -> Attitude, m]
    - [Peripheral Cues, Attitude, +]
    - [Elaboration, Peripheral Cues -> Attitude, m]
    - [Source Attractiveness, Peripheral Cues, +]
    - [Perceived Credibility, Peripheral Cues, +]
    - [Elaboration, Attitude Strength, +]
    - [Attitude, Behavioral Intention, +]
    desc: Petty 與 Cacioppo（1986）提出推敲可能性模式：動機與能力決定受眾推敲訊息的程度，高推敲者走中央路徑，由論點品質改變態度且態度持久、抗反駁、能預測行為；低推敲者走周邊路徑，靠來源吸引力、可信度等周邊線索形成短暫態度。
    refs:
    - {title: Elaboration likelihood model - Wikipedia, url: 'https://en.wikipedia.org/wiki/Elaboration_likelihood_model'}
    - {title: Elaboration likelihood model - IS Theory (is.theorizeit.org), url: 'https://is.theorizeit.org/wiki/Elaboration_likelihood_model'}
    - {title: Elaboration Likelihood Model - A First Look at Communication Theory, url: 'https://www.afirstlook.com/edition-11/theory-resources/by-type/outline/Elaboration-Likelihood-Model'}
    enrich_notes: 原五條邊保留並改成規定格式。依 Wikipedia 與 afirstlook 補完整結構：動機（由涉入／個人相關性與認知需求驅動；Need for Cognition 新造）與能力（由先備知識提高、由分心／時間壓力降低；Distraction
      新造）共同決定推敲程度。推敲程度正向調節 Argument Quality -> Attitude、負向調節 Peripheral Cues -> Attitude（調節邊不帶正負，於此說明）。周邊線索以來源吸引力與來源可信度（Perceived
      Credibility，沿用名單）為代表。中央路徑態度的持久、抗反駁、能預測行為以 Elaboration -> Attitude Strength (+) 概括，再接 Attitude -> Behavioral Intention
      (+)。is.theorizeit.org 條目只列 argument quality、peripheral cues、elaboration likelihood 三個自變數與 attitude change 依變數，未列調節，故調節關係依
      Wikipedia 與教科書。Opportunity 併入 Ability（Wikipedia 指出學者有的另列、有的併入）。
  Heuristic-Systematic Model:
    abbr: HSM
    zh: 捷思－系統式處理模式
    field: 說服
    desc: Chaiken（1980）：人以最省力方式達到足夠的判斷信心；動機、能力與涉入高時進行系統式處理，論點品質主導態度且態度較穩固；否則依賴捷思線索，捷思並可與系統式處理並存或使其偏向。
    edges:
    - [Motivation, Systematic Processing, +]
    - [Ability, Systematic Processing, +]
    - [Involvement, Motivation, +]
    - [Sufficiency Threshold, Systematic Processing, +]
    - [Heuristic Cues, Attitude, +]
    - [Argument Quality, Attitude, +]
    - [Systematic Processing, Argument Quality -> Attitude, m]
    - [Systematic Processing, Heuristic Cues -> Attitude, m]
    - [Heuristic Cues, Systematic Processing, +]
    - [Systematic Processing, Attitude Strength, +]
    refs:
    - {title: Heuristic-systematic model of information processing - Wikipedia, url: 'https://en.wikipedia.org/wiki/Heuristic-systematic_model_of_information_processing'}
    - {title: 'Chaiken & Ledgerwood, The heuristic-systematic model (chapter PDF)', url: 'https://agipubs.faculty.ucdavis.edu/wp-content/uploads/sites/212/2015/03/Chaiken-Ledgerwood-in-press.pdf'}
    - {title: Heuristic-Systematic Model - SAGE Encyclopedia of Communication Theory, url: 'https://sk.sagepub.com/ency/edvol/embed/communicationtheory/chpt/heuristicsystematic-model'}
    enrich_notes: 保留原四條。補充分原則：期望的信心門檻（Sufficiency Threshold，新造）越高越系統處理。論點品質→態度受系統處理調節（正向增強）；捷思線索→態度受系統處理調節（削弱，attenuation
      hypothesis，調節方向為負，以 m 記）。偏向假設（bias hypothesis）指捷思會引導系統處理的方向，以 Heuristic Cues→Systematic Processing + 粗略表示，嚴格說是影響其內容而非量。
  Source Credibility Theory:
    abbr: SCred
    zh: 來源可信度理論
    field: 說服
    desc: Hovland 與 Weiss（1951）提出，Ohanian（1990）擴充：來源的專業性、可信賴性與吸引力構成知覺可信度，高可信度來源減少反駁、促成態度改變與購買意圖；效果在低涉入時較強，並隨時間減弱（睡眠者效應）。
    edges:
    - [Source Expertise, Perceived Credibility, +]
    - [Source Trustworthiness, Perceived Credibility, +]
    - [Source Attractiveness, Perceived Credibility, +]
    - [Perceived Credibility, Counterarguing, '-']
    - [Perceived Credibility, Attitude, +]
    - [Perceived Credibility, Purchase Intention, +]
    - [Attitude, Behavioral Intention, +]
    - [Involvement, Perceived Credibility -> Attitude, m]
    - [Time Since Exposure, Perceived Credibility -> Attitude, m]
    refs:
    - {title: 'Wikipedia: Source credibility', url: 'https://en.wikipedia.org/wiki/Source_credibility'}
    - {title: 'SAGE Encyclopedia of Deception: Source credibility', url: 'https://sk.sagepub.com/ency/edvol/embed/encyclopedia-of-deception/chpt/source-credibility'}
    - {title: Crano (2025) Sydney Symposium chapter on source credibility, url: 'https://sydneysymposium.unsw.edu.au/2025/chapters/CranoSSSP2025.pdf'}
    enrich_notes: 保留原五條。補 Hovland 學派的機制（高可信度降低反駁）、Ohanian 代言人研究的購買意圖結果、ELM 提出的涉入度調節（來源線索在低涉入時更有效），以及 Hovland & Weiss 1951
      年發現的睡眠者效應（新造 Time Since Exposure 調節）。原文 Hovland & Weiss 1951 與 Ohanian 1990 未實際打開，依百科與回顧章節整理。
  Persuasion Knowledge Model:
    abbr: PKM
    zh: 說服知識模式
    field: 行銷傳播
    desc: Friestad 與 Wright（1994）提出：人會累積關於說服者目標與手法的「說服知識」，與代理人知識、主題知識並用來因應說服企圖；一旦辨識出說服意圖，訊息意義改變，引發懷疑與反駁，進而降低廣告與品牌評價。
    edges:
    - [Sponsorship Disclosure, Persuasion Knowledge, +]
    - [Agent Knowledge, Persuasion Knowledge, +]
    - [Persuasion Knowledge, Skepticism, +]
    - [Persuasion Knowledge, Counterarguing, +]
    - [Topic Knowledge, Counterarguing, +]
    - [Persuasion Knowledge, Ad Credibility, '-']
    - [Skepticism, Attitude toward the Ad, '-']
    - [Skepticism, Brand Attitude, '-']
    - [Skepticism, Purchase Intention, '-']
    - [Brand Attitude, Purchase Intention, +]
    refs:
    - {title: 'The Persuasion Knowledge Model: How People Cope with Persuasion Attempts (JCR 1994, IDEAS record)', url: 'https://ideas.repec.org/a/oup/jconrs/v21y1994i1p1-31.html'}
    - {title: Thirty years of persuasion knowledge research (EBSCO research starter), url: 'https://www.ebsco.com/articles/psychology/c9759af5-e5be-50f2-ab9e-566095a32bdd/thirty-years-of-persuasion-knowledge-research-from-demonstrating-effects-to-building-theory-to-increasing-applicability'}
    enrich_notes: 原四條保留。原模型是三個知識結構（說服知識、代理人知識、主題知識）互動的歷程模型，沒有正負號；此處依廣告揭露研究的常見實證版本定向：揭露啟動說服知識，說服知識引發懷疑與反駁，再壓低廣告態度、品牌態度與購買意圖。主題知識在原典與說服知識平行，不是其前因，所以接到反駁而非接到說服知識。
  Psychological Reactance Theory:
    abbr: PRT
    zh: 心理抗拒理論
    field: 說服
    desc: Brehm（1966）提出：當人感到行為自由受威脅，會產生抗拒的動機狀態，以恢復自由，結果常是對說服訊息採取相反態度與行為；Dillard 與 Shen（2005）進一步把抗拒操作化為憤怒與反駁思考交織的單一潛在構念。
    edges:
    - [Threat to Freedom, Reactance, +]
    - [Freedom Importance, Reactance, +]
    - [Trait Reactance, Threat to Freedom -> Reactance, m]
    - [Autonomy, Reactance, '-']
    - [Reactance, Anger, +]
    - [Reactance, Counterarguing, +]
    - [Reactance, Attitude, '-']
    - [Reactance, Behavioral Intention, '-']
    - [Attitude, Behavioral Intention, +]
    refs:
    - {title: 'Psychological reactance and persuasive health communication: A test and extension of the intertwined model
        (Rains & Turner 2007, Arizona record)', url: 'https://experts.arizona.edu/en/publications/psychological-reactance-and-persuasive-health-communication-a-tes/'}
    - {title: 'Comparing Separate Process and Intertwined Models for Reactance (Kim, Levine & Allen 2013)', url: 'https://scholar.korea.ac.kr/handle/2021.sw.korea/105992'}
    - {title: Reactance meta-analysis context (PMC), url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC4675534/'}
    enrich_notes: 保留原四條。補 Brehm 原理論的另一前因「自由的重要性」與特質抗拒的調節；依 Dillard 與 Shen（2005）交織模型把憤怒與反駁思考列為抗拒的兩個指標（畫成 Reactance 指向兩者，意思是測量指標而非因果結果）。Autonomy
      -> Reactance 的負向對應「強調自主／選擇的訊息可降低抗拒」這條常見實證結果（如 Miller 等人 2007 的恢復性附言），不在 Brehm 原文。
  Expectancy Violations Theory:
    abbr: EVioT
    zh: 期望違反理論
    field: 人際傳播
    desc: Burgoon（1978）：人對他人行為有源自社會規範與關係的期望，行為偏離期望會引發喚起並把注意力轉向違反者；違反的正負評價取決於行為本身與傳播者的酬賞價值，進而決定人際吸引、可信度與互惠或補償反應。
    edges:
    - [Social Norm, Expectation, +]
    - [Expectancy Violation, Arousal, +]
    - [Arousal, Violation Valence, +]
    - [Communicator Reward Valence, Violation Valence, +]
    - [Communicator Reward Valence, Expectancy Violation -> Violation Valence, m]
    - [Violation Valence, Attitude, +]
    - [Violation Valence, Perceived Credibility, +]
    - [Violation Valence, Reciprocity, +]
    - [Violation Valence, Communication Effectiveness, +]
    refs:
    - {title: Expectancy violations theory - Wikipedia, url: 'https://en.wikipedia.org/wiki/Expectancy_violations_theory'}
    - {title: Expectancy Violations Theory - EBSCO Research Starters, url: 'https://www.ebsco.com/research-starters/communication-and-mass-media/expectancy-violations-theory'}
    - {title: A First Look at Communication Theory - EVT outline, url: 'https://afirstlook.com/edition-10/theory-resources/by-type/outline/Expectancy-Violations-Theory'}
    enrich_notes: 保留原三條。Arousal→Violation Valence 表示喚起觸發對違反的解讀與評價歷程（Wikipedia 第 3–5 步），以 + 表示喚起越強評價越極化。Burgoon 指出酬賞價值在違反意義曖昧時才主導解讀，故加調節邊。結果端依
      Wikipedia 列的吸引（Attitude）、可信度、互惠／補償（正違反→互惠，以 Reciprocity 表示）、說服（Communication Effectiveness）。Social Norm→Expectation
      來自期望的來源。
  Spiral of Silence:
    abbr: SoS
    zh: 沉默螺旋
    field: 政治傳播
    desc: Noelle-Neumann（1974）提出：人以準統計感知偵測意見氣候，認為自己屬少數者因害怕孤立而不願公開表態，少數聲音退縮使多數看來更強，形成自我強化的沉默螺旋；媒體與人際環境是意見氣候的主要來源。
    edges:
    - [Media Portrayal of Opinion Climate, Perceived Majority Support, +]
    - [Social Environment, Perceived Majority Support, +]
    - [Perceived Majority Support, Willingness to Speak Out, +]
    - [Perceived Majority Support, Fear of Isolation, '-']
    - [Fear of Isolation, Willingness to Speak Out, '-']
    - [Fear of Isolation, Perceived Majority Support -> Willingness to Speak Out, m]
    - [Willingness to Speak Out, Perceived Majority Support, +]
    - [Issue Moral Loading, Perceived Majority Support -> Willingness to Speak Out, m]
    refs:
    - {title: Spiral of silence (Wikipedia), url: 'https://en.wikipedia.org/wiki/Spiral_of_silence'}
    - {title: Spiral of Silence (SIUE AURA Lab theory page), url: 'https://aura-lab.siue.edu/theories/spiral-of-silence/'}
    - {title: 'Bringing Reference Groups Back: Agent-based Modeling of the Spiral of Silence (arXiv)', url: 'https://arxiv.org/pdf/1401.6106'}
    enrich_notes: 原三條全部保留。新增兩個意見氣候的來源（媒體描繪、人際環境／參考團體），以及螺旋本身的回饋邊（表態意願→他人感知的多數支持），這條回饋是理論的核心動態，畫成有向圖時會形成循環，屬刻意。害怕孤立同時當前因與調節變數：低害怕孤立者（hardcore）不受意見氣候影響。議題道德負載為理論的適用邊界，以調節邊表示。
  Third-Person Effect:
    abbr: TPE
    zh: 第三人效果
    field: 媒介效果
    desc: Davison（1983）提出：人們普遍認為大眾媒體對他人的影響大於對自己（知覺成分），而這種自他落差會進一步驅動行動（行為成分），最常見的是支持對媒體內容的管制；訊息越不受歡迎、他人與自己的社會距離越遠，落差越大。
    edges:
    - [Social Distance, Perceived Media Influence on Others, +]
    - [Message Undesirability, Perceived Media Influence on Others, +]
    - [Message Undesirability, Perceived Media Influence on Self, '-']
    - [Self-Enhancement Motivation, Perceived Media Influence on Self, '-']
    - [Perceived Exposure of Others, Perceived Media Influence on Others, +]
    - [Perceived Media Influence on Others, Third-Person Perception, +]
    - [Perceived Media Influence on Self, Third-Person Perception, '-']
    - [Third-Person Perception, Support for Censorship, +]
    - [Perceived Media Influence on Others, Support for Censorship, +]
    - [Perceived Media Influence on Self, Support for Censorship, '-']
    refs:
    - {title: Third-person effect (Wikipedia), url: 'https://en.wikipedia.org/wiki/Third-person_effect'}
    - {title: The Third-Person Effect 40 Years After Davison Penned It (Penn State record), url: 'https://pure.psu.edu/en/publications/the-third-person-effect-40-years-after-davison-penned-it-what-we-/'}
    - {title: Third-person effect (SAGE Encyclopedia of Political Communication), url: 'https://sk.sagepub.com/ency/edvol/embed/politicalcommunication/chpt/thirdperson-effect'}
    enrich_notes: 保留原三條。依 Perloff（1999）、Paul 等人（2000）與 Sun、Pan 與 Shen（2008）兩篇後設分析補上：自他落差本身作為中介構念（Third-Person Perception），以及三個最常見的前因——訊息不受歡迎程度（最強的調節因素，受歡迎訊息會翻轉成第一人效果）、自我提升動機、他人暴露量的知覺。原理論的行為成分只說「會採取行動」，支持管制是最常被操作化的結果，故採用。
  Bandwagon Heuristic:
    abbr: Bandwagon
