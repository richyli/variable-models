      Donaldson 與 Preston 的規範性論點不含方向，整個結構是依「顯著性模型＋工具性觀點」的常見實證版本組出來的；Wikipedia 也指出工具性主張的實證結果並非一致。
    book_check: Miles 2012 第 37 章對照：補 5 條邊；書中變數我們原本沒有的：Stakeholder Integration、Stakeholder Knowledge、Stakeholder Interaction、Managerial
      Discretion、Corporate Social Performance、Stakeholder Satisfaction、Shareholder Wealth、Observed Unethical Behavior。書上明寫：讓利害關係人參與決策是倫理要求也是策略資源，帶來競爭優勢（Cennamo
      et al., 2009；Plaza-Ubeda et al., 2010）；工具觀點主張考慮利害關係人的公司在獲利、穩定、成長上較成功；企業須優先注意有權力、正當性、急迫需求者（Rowley, 1997，即 Mitchell et
      al. 顯著性模型）；利害關係人整合含知識、互動、調適行為三構面（Plaza-Ubeda et al., 2010 量表）。Stakeholder Salience→Stakeholder Integration 是我由「優先注意顯著者」推的。Stakeholder
      Integration→Shareholder Wealth 負號是批評節的主張（利潤被犧牲），屬爭議邊。Managerial Discretion（Hambrick & Finkelstein, 1987；Phillips et
      al., 2010）是管理者依利害關係人意願行事的權力、自由與能力，可當 Stakeholder Pressure→Stakeholder Integration 的調節，未列入邊。Observed Unethical Behavior
      與 Corporate Citizenship 只出現在 Measuring 節，無邊。
