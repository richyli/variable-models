    desc: 組織正義理論整合 Adams（1965）、Thibaut 與 Walker（1975）、Bies 與 Moag（1986）：員工對分配結果、決策程序與人際對待的公平感知，分別預測工作滿意、組織承諾、信任、公民行為、績效與離職意圖。
