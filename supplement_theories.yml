    - {title: AI Anxiety Scale (AIAS) summary page, url: 'https://psytests.org/cyber/aiasen.html'}
    - {title: Development and validation of an artificial intelligence anxiety scale (JALT event listing citing Wang and Wang
        2022), url: 'https://events.jalt.org/event/73/contributions/2461/'}
    - {title: AI anxiety and attitudes scores table (BMC Nursing 2025), url: 'https://bmcnurs.biomedcentral.com/articles/10.1186/s12912-025-03490-2/tables/2'}
    enrich_notes: 原五條保留。Wang 與 Wang 的四個面向是量表的構面而非前因，原資料已把前兩個當前因接入，此處補齊另外兩個（社會技術盲點、AI 配置）並一致當作形成性來源。原典的結果變數是「動機性學習行為」（以 Motivation
      表示，方向負）；對態度的負向關聯來自後續實證（對 AI 態度與四個子量表皆負相關）。自我效能一條是常見擴充。原始論文全文未能開啟，結構依二手來源彙整。
  TTAT Technology Threat Avoidance Theory:
    note: TTAT Technology Threat Avoidance Theory
    abbr: TTAT
    zh: 科技威脅迴避理論
    field: 資安／AI
    edges:
    - [Perceived Susceptibility, Perceived Threat, +]
    - [Perceived Severity, Perceived Threat, +]
    - [Perceived Severity, Perceived Susceptibility -> Perceived Threat, m]
    - [Perceived Threat, Avoidance Motivation, +]
    - [Safeguard Effectiveness, Avoidance Motivation, +]
    - [Safeguard Cost, Avoidance Motivation, '-']
    - [Self-Efficacy, Avoidance Motivation, +]
    - [Safeguard Effectiveness, Perceived Threat -> Avoidance Motivation, m]
    - [Perceived Threat, Emotion-Focused Coping, +]
    - [Safeguard Effectiveness, Emotion-Focused Coping, '-']
    - [Social Norm, Avoidance Motivation, +]
    - [Risk Tolerance, Avoidance Motivation, '-']
    - [Avoidance Motivation, Avoidance Behavior, +]
    desc: Liang 與 Xue（2009）提出科技威脅迴避理論：使用者先做威脅評估（易感性×嚴重性→感知威脅），再做因應評估（防護措施有效性、成本與自我效能）；認為威脅可避免時產生迴避動機並採取主動迴避行為，認為無法避免時則轉向情緒導向因應。
    refs:
    - {title: Technology Threat Avoidance Theory (TTAT) - IS Theory (is.theorizeit.org), url: 'https://is.theorizeit.org/wiki/Technology_Threat_Avoidance_Theory_(TTAT)'}
    - {title: 'Liang & Xue (2009) Avoidance of Information Technology Threats: A Theoretical Perspective (constructDB record)',
      url: 'https://verdi.cs.ucl.ac.uk/constructDB/publications/liang-avoidance-2009.html'}
    enrich_notes: 原七條邊保留。補原論文的兩層結構：易感性×嚴重性的交互（以嚴重性調節易感性→威脅）；因應評估決定可避免性，可避免走問題導向（迴避動機→迴避行為），不可避免走情緒導向因應（Emotion-Focused Coping，新造）。威脅×防護有效性的調節是
      Liang & Xue（2010）實證版本的命題，is.theorizeit.org 頁未提，保留但標註。Social influence 與 risk tolerance 只在 wiki 資訊框列為自變數、未說明關係，依常理給正／負（Risk
      Tolerance 新造；社會影響以 Social Norm 代表）。
  Word-of-Machine Effect:
    abbr: WoM-AI
    zh: 機器之言效應
    field: AI
    desc: Longoni 與 Cian（2022）提出：消費者相信 AI 擅長評估功能性屬性、人類擅長評估享樂性屬性，因此功利目標凸顯時偏好 AI 推薦者，享樂目標凸顯時抗拒 AI；需要個人化、採人機混合推薦或提醒反向思考時效應減弱或反轉。
    edges:
    - [Utilitarian Goal, Perceived AI Competence, +]
    - [Hedonic Goal, Perceived AI Competence, '-']
    - [Perceived AI Competence, Preference for AI Recommender, +]
    - [Utilitarian Goal, Preference for AI Recommender, +]
