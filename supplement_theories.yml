    - [Skepticism, Green Trust, '-']
    - [Green Perceived Value, Green Trust, +]
    - [Green Trust, Purchase Intention, +]
    - [Green Perceived Risk, Purchase Intention, '-']
    - [Green Perceived Value, Purchase Intention, +]
    - [Skepticism, Purchase Intention, '-']
    refs:
    - {title: 'Greenwash and Green Trust: The Mediation Effects of Green Consumer Confusion and Green Perceived Risk (IDEAS
        record, JBE 114(3))', url: 'https://ideas.repec.org/a/kap/jbuset/v114y2013i3p489-500.html'}
    - {title: PhilArchive record, url: 'https://philarchive.org/rec/CHEGAG'}
    - {title: Tamkang University faculty record (Yu-Shan Chen), url: 'https://teacher.tku.edu.tw/StfFdDtl.aspx?tid=400002'}
    enrich_notes: 保留原七條。Chen 與 Chang（2013）原模型只有漂綠、困惑、風險、信任四構念；Skepticism 與 Purchase Intention 是常見擴充，分別來自 Leonidou 與 Skarmeas（2017）、Chen
      與 Chang（2012）的綠色購買意圖模型，連帶補 Green Perceived Value。
  Product Lifetime Labelling Effects:
    abbr: PLL
    zh: 產品壽命標示效果
    field: 永續行銷
    desc: Jacobs 與 Hörisch（2022）等歐盟生態設計研究指出：標示產品預期壽命會提高消費者對耐用度與品質的感知，進而提升購買意圖與付費意願；效果隨標示壽命拉長而遞減，且會削弱既有品牌的影響力，標示可信度與消費者的懷疑程度是邊界條件。
    edges:
    - [Product Lifetime Labelling, Perceived Durability, +]
    - [Perceived Credibility, Product Lifetime Labelling -> Perceived Durability, m]
    - [Skepticism, Product Lifetime Labelling -> Perceived Durability, m]
    - [Perceived Durability, Perceived Quality, +]
    - [Perceived Durability, Perceived Value, +]
    - [Perceived Quality, Purchase Intention, +]
    - [Perceived Durability, Purchase Intention, +]
    - [Perceived Value, Willingness to Pay, +]
    - [Price, Purchase Intention, '-']
    - [Product Lifetime Labelling, Brand Image -> Purchase Intention, m]
    refs:
    - {title: Jacobs & Hörisch (2022) The importance of product lifetime labelling for purchase decisions (Business Strategy
        and the Environment), url: 'https://xreiss.efri.uniri.hr/article.php?id=67358'}
    - {title: 'EESC study: The influence of lifespan labelling on consumers', url: 'https://www.eesc.europa.eu/sites/default/files/resources/docs/16_123_duree-dutilisation-des-produits_complet_en.pdf'}
    enrich_notes: 原四條邊保留，調節邊改成規定格式（Skepticism 調節標示→耐用度感知）。補：標示可信度（Perceived Credibility，沿用名單）與懷疑一樣是調節；耐用度→價值→付費意願（Willingness
      to Pay，新造）對應 EESC 研究「九成受訪者願為多兩年壽命付更多錢」；價格負向是 conjoint 設計的對照屬性；「標示削弱既有品牌影響」寫成 Product Lifetime Labelling 調節 Brand Image
      -> Purchase Intention。Jacobs & Hörisch 的遞減效果（非線性）無法用符號表示，在此註明。
  Signaling theory:
