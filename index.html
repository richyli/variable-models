}

  --bg:#12151b;--panel:#1a1e27;--ink:#e6e9ef;--muted:#99a1b0;--line:#2a303c;--line2:#3a4150;
  --accent:#7ea2ff;--accent-ink:#0e1424;--sel:#4a3a05;--sel-line:#e3b23c;--sim:#4a2a12;--sim-line:#f08a4b;

  --pos:#5ccf8a;--neg:#f07b7b;--mod:#b89cf0;--seed:#6d7686;--chip:#243151;--chip-ink:#a9c0ff;

}}
:root[data-theme="dark"]{
  --bg:#12151b;--panel:#1a1e27;--ink:#e6e9ef;--muted:#99a1b0;--line:#2a303c;--line2:#3a4150;
  --accent:#7ea2ff;--accent-ink:#0e1424;--sel:#4a3a05;--sel-line:#e3b23c;--sim:#4a2a12;--sim-line:#f08a4b;
  --node:#232834;--node-line:#5b6473;--node-ink:#e6e9ef;--ghost:#1e222b;--ghost-ink:#6d7686;
  --pos:#5ccf8a;--neg:#f07b7b;--mod:#b89cf0;--seed:#6d7686;--chip:#243151;--chip-ink:#a9c0ff;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.top h1{font-size:16px;margin:0;white-space:nowrap;cursor:pointer}.top h1:hover{color:var(--accent)}
.top .tg{border:1px solid var(--line2);background:transparent;border-radius:6px;padding:3px 8px;cursor:pointer;color:var(--muted);font-size:12px}.top .tg:hover{color:var(--ink)}
.top .meta{color:var(--muted);font-size:12px;white-space:nowrap}
.search{position:relative;flex:1;max-width:560px}
.search input::-webkit-search-cancel-button{display:none}
.search input{width:100%;padding:8px 36px 8px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.search .clr{position:absolute;right:6px;top:5px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}
.dd{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;display:none;z-index:9}
.dd.open{display:block}
.dd .it{padding:7px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.dd .it:hover,.dd .it.act{background:var(--chip)}.dd .it.ghost>span:first-child{color:var(--ghost-ink)}
.dd .it .al{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd .it .n{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0;min-height:calc(100vh - 53px)}
.layout.noside{grid-template-columns:minmax(0,1fr)}.layout.noside .side{display:none}
.side .legend{padding:6px 12px;color:var(--muted);font-size:11px;line-height:1.4}
.side{border-right:1px solid var(--line);background:var(--panel);overflow:auto;max-height:calc(100vh - 53px);position:sticky;top:53px}
.side .grp{padding:6px 12px 2px;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;border-top:1px solid var(--line)}
.side .v{display:flex;align-items:center;gap:6px;padding:4px 12px;cursor:pointer;font-size:13px}
.side .v:hover{background:var(--chip)}
.side .v.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--sel-line)}
.side .v .cnt{margin-left:auto;color:var(--muted);font-size:11px}
.side .v.ghost{color:var(--ghost-ink)}
.main{padding:12px 16px 40px;min-width:0}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr);gap:12px;margin-bottom:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:600}
.hero .name{font-size:20px;font-weight:700;margin:0 0 4px;line-height:1.2;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.hero .name a{font-size:12px;font-weight:500;white-space:nowrap}
.hero .desc{color:var(--muted);font-size:12px;margin:6px 0 0;max-height:3.2em;overflow:hidden}
.hero .papers{margin-top:6px;font-size:12px;display:flex;flex-wrap:wrap;gap:4px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-size:12px;border:1px solid transparent;cursor:pointer}
.chip.plain{background:var(--ghost);color:var(--ink);cursor:default}
.chip.sim{background:var(--sim);color:var(--ink);border-color:var(--sim-line)}
.chip.th{background:var(--panel);border-color:var(--line2);color:var(--ink)}
.chip.th b{color:var(--accent)}
.links a{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{display:flex;align-items:baseline;gap:10px;margin:12px 0 8px;flex-wrap:wrap}
.sec h2{font-size:15px;margin:0;white-space:nowrap}
.sec .hint{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));grid-auto-flow:dense;gap:12px}
.model{display:flex;flex-direction:column;min-height:200px}
.model.wide{grid-column:1 / -1 !important}
.model .cv{overflow-x:auto;overflow-y:hidden;flex:1;display:flex;align-items:center}
.model .cv svg{flex:none}
.model .cv.fit svg{max-width:100%;height:auto}
.model .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.model .hd .ab{font-weight:700;font-size:15px}
.model .hd .nm{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.model .hd .lv{font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:0 5px;white-space:nowrap}
.model .hd .tools{margin-left:auto;display:flex;gap:4px;white-space:nowrap}
.model .hd button{border:1px solid var(--line2);background:transparent;border-radius:6px;padding:1px 7px;font-size:11px;cursor:pointer;color:var(--muted)}
.model .hd button:hover{color:var(--ink);border-color:var(--ink)}.model .hd button[aria-pressed="true"]{background:var(--chip);color:var(--chip-ink);border-color:var(--chip-ink)}
.model svg{display:block}
.model .ft{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px;align-items:center}
.model .ft .k{display:inline-flex;align-items:center;gap:4px}
.model .ft i{display:inline-block;width:18px;height:0;border-top:2px solid var(--seed)}
.model .ft i.solid{border-top-style:solid;border-color:var(--node-line)}
.model .ft i.dash{border-top-style:dashed}
.model .ft i.mod{border-top-style:dotted;border-color:var(--mod)}
.model .ft i.hot{border-top-width:3px;border-color:var(--accent)}
.model .ft b.sw{display:inline-block;width:14px;height:10px;border-radius:3px;border:1.5px solid var(--sel-line);background:var(--sel)}
.model .ft b.sw.sim{border-color:var(--sim-line);background:var(--sim)}
.model .ft b.sw.ghost{border:1px dashed var(--node-line);background:var(--ghost)}
.model .ft a{margin-left:auto}
.node{cursor:pointer}
.node rect{fill:var(--node);stroke:var(--node-line);stroke-width:1.2}
.node text{fill:var(--node-ink);font-size:12px;pointer-events:none}
.node:hover rect{stroke:var(--accent);stroke-width:2}
.node.sel rect{fill:var(--sel);stroke:var(--sel-line);stroke-width:2.2}
.node.sim rect{fill:var(--sim);stroke:var(--sim-line);stroke-width:1.8}
.node.ghost rect{fill:var(--ghost);stroke-dasharray:3 3}
.node.ghost text{fill:var(--ghost-ink)}
.edge{fill:none;stroke:var(--node-line);stroke-width:1.4}
.edge.seed{stroke-dasharray:6 4;stroke:var(--seed)}
.edge.neg{stroke:var(--neg)}
.edge.mod{stroke:var(--mod);stroke-dasharray:2 3}
.edge.hot{stroke-width:2.6;stroke:var(--accent)}
.elab{font-size:11px;fill:var(--muted)}
.elab.pos{fill:var(--pos);font-weight:700}.elab.neg{fill:var(--neg);font-weight:700}.elab.mod{fill:var(--mod)}
.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line2);border-radius:10px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl td,.tbl th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl .chip{white-space:nowrap}.tbl .ths{display:flex;flex-wrap:wrap;gap:3px;align-items:center}.tbl td:first-child{width:1%;white-space:nowrap}
.tbl th{color:var(--muted);font-weight:600;white-space:nowrap}
.kbd{font-size:11px;color:var(--muted)}
@media (max-width:1100px){.hero{grid-template-columns:1fr 1fr}.hero .card:last-child{grid-column:1/-1}}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}.side{display:none}
  .hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}
  .top{flex-wrap:wrap;gap:8px}.top .meta{display:none}.search{max-width:none;flex-basis:100%}
  .main{padding:10px 16px 40px}
}
</style>

 null, "mod": null, "noteUrl": ""}, {"src": "Service Quality", "dst": "Behavior", "sign": "+", "theory": "T DMIS Delone and McLean IS Success Model", "source": "seed", "note": null, "mod": null, "noteUrl": ""}, {"src": "Service Quality", "dst": "User Satisfaction", "sign": "+", "theory": "T DMIS Delone and McLean IS Success Model", "source": "seed", "note": null, "mod": null, "noteUrl": ""}, {"src": "Behavior", "dst": "User Satisfaction", "sign": "+", "theory": "T DMIS Delone and McLean IS Success Model", "source": "seed", "note": null, "mod": null, "noteUrl": ""}, {"src": "Behavior", "dst": "Individual Impact", "sign": "+", "theory": "T DMIS Delone and McLean IS Success Model", "source": "seed", "note": null, "mod": null, "noteUrl": ""}, {"src": "User Satisfaction", "dst": "Individual Impact", "sign": "+", "theory": "T DMIS Delone and McLean IS Success Model", "source": "seed", "note": null, "mod": null, "noteUrl": ""}, {"src": "Individual Impact", "dst": "Organizational Impact", "sign": "+", "theory": "T DMIS Delone and McLean IS Success Model", "source": "seed", "note": null, "mod": null, "noteUrl": ""}], "relNotes": [{"name": "Donation Attitude ++ Actual Donation", "url": "obsidian://open?vault=Zettel&file=-work/Notes/%E6%A6%82%E5%BF%B5%E8%88%87%E7%90%86%E8%AB%96/Donation%20Attitude%20%2B%2B%20Actual%20Donation"}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const V = Object.fromEntries(D.variables.map(v => [v.id, v]));
const T = Object.fromEntries(D.theories.map(t => [t.id, t]));
const edgesByTheory = {};
for (const e of D.edges) { (edgesByTheory[e.theory || '_none'] ||= []).push(e); }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (id) => document.getElementById(id);
const varCount = {};
for (const v of D.variables) varCount[v.id] = v.theories.length;
const sortedVars = D.variables.slice().sort((a, b) => a.label.localeCompare(b.label, 'en'));

/* ---------- 排版：分層 DAG ---------- */
function layoutTheory(tid) {
  const E = (edgesByTheory[tid] || []);
  const nodes = new Set();
  for (const e of E) { nodes.add(e.src); nodes.add(e.dst); if (e.mod) nodes.add(e.mod); }
  for (const vid of (T[tid]?.variables || [])) nodes.add(vid);
  const ids = [...nodes];
  const out = {}, inn = {};
  ids.forEach(i => { out[i] = new Set(); inn[i] = new Set(); });
  const dir = E.filter(e => e.sign !== 'm');
  for (const e of dir) { if (e.src !== e.dst) { out[e.src].add(e.dst); inn[e.dst].add(e.src); } }
  // 去環（DFS back edges）
  const state = {}, back = new Set();
  const dfs = (u) => { state[u] = 1; for (const w of out[u]) { if (state[w] === 1) back.add(u + '→' + w); else if (!state[w]) dfs(w); } state[u] = 2; };
  ids.forEach(i => { if (!state[i]) dfs(i); });
  const succ = {}, pred = {};
  ids.forEach(i => { succ[i] = [...out[i]].filter(w => !back.has(i + '→' + w)); });
  ids.forEach(i => { pred[i] = []; });
  ids.forEach(i => succ[i].forEach(w => pred[w].push(i)));
  // 最長路徑分層
  const layer = {}; const memo = {};
  const depth = (u) => { if (memo[u] != null) return memo[u]; memo[u] = 0; let d = 0; for (const p of pred[u]) d = Math.max(d, depth(p) + 1); memo[u] = d; return d; };
  ids.forEach(i => layer[i] = depth(i));
  // 調節變數：放在它作用的邊的上一層
  for (const e of E.filter(e => e.sign === 'm' && e.mod)) { layer[e.mod] = Math.max(0, Math.min(layer[e.src], layer[e.dst])); }
  // 沒有邊的節點：放第 0 層
  const maxL = Math.max(0, ...Object.values(layer));
  const cols = []; for (let i = 0; i <= maxL; i++) cols.push([]);
  ids.forEach(i => cols[layer[i]].push(i));
  // barycenter 排序兩輪
  const pos = {}; cols.forEach(c => c.forEach((n, k) => pos[n] = k));
  for (let r = 0; r < 3; r++) {
    for (let l = 1; l <= maxL; l++) {
      cols[l].sort((a, b) => bary(a, pred) - bary(b, pred)); cols[l].forEach((n, k) => pos[n] = k);
    }
    for (let l = maxL - 1; l >= 0; l--) {
      cols[l].sort((a, b) => bary(a, succ) - bary(b, succ)); cols[l].forEach((n, k) => pos[n] = k);
    }
  }
  function bary(n, nb) { const a = nb[n]; if (!a.length) return pos[n]; return a.reduce((s, x) => s + pos[x], 0) / a.length; }
  // 幾何
  const label = (id) => (V[id]?.label || id);
  const lines = (id) => wrap(label(id), 14);
  const W = {}; ids.forEach(i => { W[i] = Math.max(72, Math.min(170, 12 + 7.2 * Math.max(...lines(i).map(s => s.length)))); });
  const colW = []; for (let l = 0; l <= maxL; l++) colW[l] = Math.max(...cols[l].map(i => W[i]), 72);
  const gapX = 46, rowH = 50, padX = 10, padY = 12;
  const H = Math.max(...cols.map(c => c.length)) * rowH + padY * 2;
  const xs = []; let x = padX; for (let l = 0; l <= maxL; l++) { xs[l] = x; x += colW[l] + gapX; }
  const Wtot = x - gapX + padX;
  const P = {};
  cols.forEach((c, l) => { const top = (H - c.length * rowH) / 2; c.forEach((n, k) => { const h = lines(n).length > 1 ? 40 : 30; P[n] = { x: xs[l] + (colW[l] - W[n]) / 2, y: top + k * rowH + (rowH - h) / 2, w: W[n], h, l }; }); });
  return { ids, E, P, W: Wtot, H, back, lines };
}
function wrap(s, n) { if (s.length <= n) return [s]; const w = s.split(' '); const a = []; let cur = ''; for (const x of w) { if ((cur + ' ' + x).trim().length > n && cur) { a.push(cur); cur = x; } else cur = (cur + ' ' + x).trim(); } if (cur) a.push(cur); return a.slice(0, 2).map((t, i) => (i === 1 && a.length > 2) ? t + '…' : t); }

function renderSvg(tid, selId, simSet) {
  const L = layoutTheory(tid);
  const { P } = L;
  let s = `<svg viewBox="0 0 ${L.W} ${L.H}" width="${Math.round(L.W * 1.1)}" height="${Math.round(L.H * 1.1)}" data-w="${Math.round(L.W * 1.1)}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(T[tid]?.abbr || tid)} 概念圖">`;
  s += `<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>`;
  const edgeKey = e => e.src + '→' + e.dst;
  const mid = {};
  for (const e of L.E.filter(e => e.sign !== 'm')) {
    const a = P[e.src], b = P[e.dst]; if (!a || !b) continue;
    const hot = (e.src === selId || e.dst === selId);
    let d, mx, my;
    if (b.l > a.l) { // 向右
      const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2; const c = (x2 - x1) / 2;
      d = `M${x1} ${y1}C${x1 + c} ${y1} ${x2 - c} ${y2} ${x2} ${y2}`; mx = (x1 + x2) / 2; my = (y1 + y2) / 2 - 4;
    } else { // 同層或回頭：從上方繞
      const x1 = a.x + a.w / 2, y1 = a.y, x2 = b.x + b.w / 2, y2 = b.y; const up = Math.min(y1, y2) - 34;
      d = `M${x1} ${y1}C${x1} ${up} ${x2} ${up} ${x2} ${y2}`; mx = (x1 + x2) / 2; my = up + 10;
    }
    mid[edgeKey(e)] = { x: mx, y: my };
    const cls = ['edge', e.source === 'seed' ? 'seed' : '', e.sign === '-' ? 'neg' : '', hot ? 'hot' : ''].join(' ');
    const title = `${V[e.src]?.label || e.src} → ${V[e.dst]?.label || e.dst}${e.sign ? ' (' + e.sign + ')' : ''}　來源：${e.source === 'seed' ? '補充的標準結構' : e.note}`;
    s += `<path class="${cls}" d="${d}" marker-end="url(#ar)"><title>${esc(title)}</title></path>`;
    if (e.sign) s += `<text class="elab ${e.sign === '-' ? 'neg' : 'pos'}" x="${mx}" y="${my}" text-anchor="middle">${e.sign === '-' ? '−' : '+'}</text>`;
  }
  for (const e of L.E.filter(e => e.sign === 'm')) {
    const m = P[e.mod || e.src], tgt = mid[(e.mod ? e.src : e.src) + '→' + e.dst] || mid[e.src + '→' + e.dst]; if (!m || !tgt) continue;
    const x1 = m.x + m.w / 2, y1 = m.y + m.h; s += `<path class="edge mod" d="M${x1} ${y1}L${tgt.x} ${tgt.y + 6}" marker-end="url(#ar)"><title>調節</title></path>`;
    s += `<text class="elab mod" x="${(x1 + tgt.x) / 2 + 6}" y="${(y1 + tgt.y) / 2}">調節</text>`;
  }
  for (const id of L.ids) {
    const p = P[id]; const v = V[id]; const cls = ['node', id === selId ? 'sel' : '', simSet.has(id) ? 'sim' : '', (!v || v.unlinked) ? 'ghost' : ''].join(' ');
    const ls = L.lines(id); const tip = v ? [v.label, ...(v.aliases || [])].join(' ／ ') : id;
    s += `<g class="${cls}" data-id="${esc(id)}" tabindex="0" role="button"><title>${esc(tip)}${(!v || v.unlinked) ? '（沒有 note）' : ''}</title><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="6"/>`;
    ls.forEach((t, i) => { s += `<text x="${p.x + p.w / 2}" y="${p.y + (ls.length > 1 ? 16 + i * 14 : 19)}" text-anchor="middle">${esc(t)}</text>`; });
    s += `</g>`;
  }
  return s + '</svg>';
}

function modelCard(tid, selId, simSet, note) {
  const t = T[tid] || { id: tid, abbr: tid, name: '', variables: [] };
  const E = edgesByTheory[tid] || [];
  const nSeed = E.filter(e => e.source === 'seed').length, nNote = E.length - nSeed;
  const nl = (t.notes || []);
  const noteLinks = nl.length ? `<a href="${nl[0].url}" title="${esc(nl[0].path)}">↗ ${esc(nl[0].name)}</a>${nl.length > 1 ? `<span class="hint" title="${esc(nl.slice(1).map(n => n.name).join('、'))}"> +${nl.length - 1}</span>` : ''}` : '';
  const hasGhost = (t.variables || []).some(x => !V[x] || V[x].unlinked);
  const svg = E.length ? renderSvg(tid, selId, simSet) : `<div class="chips" style="padding:8px 0">${(t.variables || []).map(x => `<span class="chip ${x === selId ? '' : 'plain'}" data-id="${esc(x)}">${esc(V[x]?.label || x)}</span>`).join('')}<span class="hint" style="align-self:center">note 裡只標了變數、沒有寫邊</span></div>`;
  return `<section class="card model" data-tid="${esc(tid)}">
    <div class="hd"><span class="ab">${esc(t.abbr)}</span><span class="nm" title="${esc(t.name)}">${esc(t.name)}${t.zh ? '　' + esc(t.zh) : ''}</span>${t.level ? `<span class="lv">${esc(t.level)}</span>` : ''}
      <span class="tools"><button data-act="wide" title="放大到整列" aria-pressed="false">⤢ 整列</button></span></div>
    ${note ? `<div class="kbd">${note}</div>` : ''}
    <div class="cv">${svg}</div>
    <div class="ft">${selId && (t.variables || []).includes(selId) ? `<span class="k"><b class="sw"></b>目前變數</span><span class="k"><i class="hot"></i>連到它的邊</span>` : ''}${(t.variables || []).some(x => simSet.has(x)) ? `<span class="k"><b class="sw sim"></b>類似變數</span>` : ''}${nNote ? `<span class="k"><i class="solid"></i>note 裡的邊 ${nNote}</span>` : ''}${nSeed ? `<span class="k"><i class="dash"></i>補充結構 ${nSeed}</span>` : ''}${E.some(e => e.sign === 'm') ? `<span class="k"><i class="mod"></i>調節</span>` : ''}${hasGhost ? `<span class="k"><b class="sw ghost"></b>沒有 note</span>` : ''}${noteLinks ? `<span style="margin-left:auto">${noteLinks}</span>` : ''}</div>
  </section>`;
}

/* ---------- 模型卡依圖的自然寬度跨欄 ---------- */
function fitGrids() {
  const main = $('main'); const mw = main.clientWidth - 32;
  const cols = mw >= 1150 ? 4 : mw >= 760 ? 3 : mw >= 520 ? 2 : 1;
  document.documentElement.style.setProperty('--cols', cols);
  const colPx = (mw - 12 * (cols - 1)) / cols;
  for (const card of document.querySelectorAll('.model')) {
    const svg = card.querySelector('svg'); if (!svg) { card.style.gridColumn = `span ${Math.min(cols, 2)}`; continue; }
    const w = +svg.dataset.w + 30; // 卡片左右內距
    let span = Math.min(cols, Math.max(1, Math.ceil(w / (colPx + 12) / 1.25))); // 容許縮 25% 以內，不多佔一欄
    if (card.classList.contains('wide')) span = cols;
    card.style.gridColumn = `span ${span}`;
    const avail = span * colPx + 12 * (span - 1) - 30;
    card.querySelector('.cv').classList.toggle('fit', w - 30 > avail && (w - 30) <= avail * 1.4); // 差 40% 內就縮，再寬就橫向捲
  }
}
window.addEventListener('resize', () => fitGrids());

/* ---------- 畫面 ---------- */
let sel = null;
function select(id, push = true) {
  if (!V[id]) return;
  sel = id;
  if (push) history.pushState({ id }, '', '#v=' + encodeURIComponent(id));
  $('q').value = V[id].label; closeDD();
  renderSide(); renderMain(); fitGrids();
  document.querySelector('.main')?.scrollTo?.(0, 0); window.scrollTo({ top: 0 });
}
function renderSide(filter = '') {
  const f = filter.trim().toLowerCase();
  let html = '', last = '';
  for (const v of sortedVars) {
    if (f && !matches(v, f)) continue;
    const g = /^[A-Za-z]/.test(v.label) ? v.label[0].toUpperCase() : '＃';
    if (g !== last) { html += `<div class="grp">${g}</div>`; last = g; }
    html += `<div class="v ${v.id === sel ? 'sel' : ''} ${v.unlinked ? 'ghost' : ''}" data-id="${esc(v.id)}" title="${esc([v.label, ...v.aliases].join(' ／ '))}"><span>${esc(v.label)}</span><span class="cnt">${v.theories.length || ''}</span></div>`;
  }
  $('side').innerHTML = '<div class="legend">數字＝出現的模型數；灰字＝沒有 note</div>' + (html || '<div class="empty">沒有符合的變數</div>');
  document.querySelector('.side .v.sel')?.scrollIntoView?.({ block: 'nearest' });
}
function matches(v, f) { return v.label.toLowerCase().includes(f) || v.aliases.some(a => a.toLowerCase().includes(f)) || v.theories.some(t => T[t] && (T[t].abbr.toLowerCase() === f || (/[一-鿿]/.test(f) && (T[t].zh || '').includes(f)))) || (v.desc || '').toLowerCase().includes(f); }

function renderMain() {
  const m = $('main');
  if (!sel) {
    m.innerHTML = `<div class="hero"><section class="card" style="grid-column:1/-1"><p class="name">先選一個變數</p><p class="desc">用上方搜尋框或左側清單選一個變數，右邊會列出它出現的理論模型（概念圖）。圖上每個變數都可以點，點了就跳到那個變數；名稱不同但意思相同的變數（例如 Use 與 Behavior）已合併成同一個節點。</p></section></div>
      <div class="sec"><h2>所有理論模型</h2><span class="hint">點圖上任何變數開始</span></div>
      <div class="grid">${D.theories.map(t => modelCard(t.id, null, new Set())).join('')}</div>`;
    fitGrids();
    return;
  }
  const v = V[sel];
  const simSet = new Set(v.similar);
  const inModels = v.theories.filter(t => T[t]);
  const simModels = D.theories.filter(t => !inModels.includes(t.id) && t.variables.some(x => simSet.has(x))).map(t => t.id);
  const nb = D.edges.filter(e => e.src === sel || e.dst === sel || e.mod === sel);
  const aliasChips = v.aliases.length ? v.aliases.map(a => `<span class="chip plain">${esc(a)}</span>`).join('') : '<span class="hint">沒有登記別名</span>';
  const simChips = v.similar.length ? v.similar.map(s => `<span class="chip sim" data-id="${esc(s)}">${esc(V[s]?.label || s)}</span>`).join('') : '<span class="hint">沒有登記類似變數</span>';
  const thChips = inModels.map(t => `<span class="chip th" data-tid="${esc(t)}"><b>${esc(T[t].abbr)}</b> ${esc(T[t].zh || T[t].name)}</span>`).join('') || '<span class="hint">沒有掛到任何理論</span>';
  const noteLinks = v.notes.map(n => `<a href="${n.url}" title="開 Obsidian：${esc(n.path)}">↗ ${v.notes.length > 1 ? esc(n.name) : '開 note'}</a>`).join('');
  const paperLinks = v.papers.map(p => v.paperUrls[p] ? `<a href="${v.paperUrls[p]}">↗ ${esc(p)}</a>` : `<span class="hint">${esc(p)}</span>`).join('');
  let html = `<div class="hero">
    <section class="card"><h2>變數</h2><p class="name"><span>${esc(v.label)}</span>${v.unlinked ? '<span class="hint">（沒有 note）</span>' : noteLinks}</p>
      <div class="chips">${aliasChips}</div>
      ${v.desc ? `<p class="desc" title="${esc(v.desc)}">${esc(v.desc)}</p>` : ''}
      ${paperLinks ? `<div class="papers"><span class="hint">提到的論文：</span>${paperLinks}</div>` : ''}</section>
    <section class="card"><h2>出現在這些理論（${inModels.length}）<span class="hint" style="font-weight:400">　點了捲到那張圖</span></h2><div class="chips">${thChips}</div>
      <h2 style="margin-top:10px">類似變數（${v.similar.length}）${simModels.length ? `<a href="#sim" class="hint" style="font-weight:400;color:var(--accent)" data-jump="sim">　↓ ${simModels.length} 個模型用到</a>` : ''}</h2><div class="chips">${simChips}</div></section>
    <section class="card links"><h2>直接相關的變數（${nb.length} 條邊）</h2>${nbTable(nb)}</section>
  </div>`;
  html += `<div class="sec"><h2>理論模型</h2><span class="hint">黃色＝這個變數；橘色＝類似變數；點任何節點就跳過去</span></div>`;
  html += inModels.length ? `<div class="grid">${inModels.map(t => modelCard(t, sel, simSet)).join('')}</div>` : `<div class="empty">這個變數的 note 裡沒有標理論（#T_xxx 或 [[T …]]）。</div>`;
  html += `<div class="sec" id="sim"><h2>使用類似變數的模型</h2><span class="hint">這些模型沒有 ${esc(v.label)}，但有它的類似變數</span></div>`;
  html += simModels.length ? `<div class="grid">${simModels.map(t => { const hit = T[t].variables.filter(x => simSet.has(x)).map(x => V[x]?.label || x); return modelCard(t, null, simSet, '類似變數：' + esc(hit.join('、'))); }).join('')}</div>` : `<div class="empty">沒有。要讓這一區有東西，在 variable_aliases.yml 的 similar 區登記類似變數。</div>`;
  m.innerHTML = html;
}
function nbTable(nb) {
  if (!nb.length) return '<span class="hint">—</span>';
  // 依「方向＋另一端變數」合併，理論排成同一列的小 chip
  const groups = new Map();
  for (const e of nb) {
    const other = e.mod === sel ? e.dst : (e.src === sel ? e.dst : e.src);
    const dir = e.sign === 'm' || e.mod === sel ? 'mod' : (e.src === sel ? 'out' : 'in');
    const k = dir + '|' + other; const g = groups.get(k) || { dir, other, signs: new Set(), ths: new Map(), notes: new Set() };
    if (e.sign && e.sign !== 'm') g.signs.add(e.sign);
    if (e.theory) g.ths.set(e.theory, (g.ths.get(e.theory) || '') + (e.source === 'seed' ? '補充的標準結構' : '來源：' + (e.note || '')));
    if (e.note) g.notes.add(e.note);
    groups.set(k, g);
  }
  const order = { out: 0, in: 1, mod: 2 };
  const rows = [...groups.values()].sort((a, b) => order[a.dir] - order[b.dir] || b.ths.size - a.ths.size).map(g => {
    const dirTxt = g.dir === 'out' ? '影響 →' : g.dir === 'in' ? '← 受影響於' : '調節';
    const sign = [...g.signs].map(s => s === '+' ? '<span style="color:var(--pos)">+</span>' : '<span style="color:var(--neg)">−</span>').join(' ') || '<span class="hint">·</span>';
    const ths = [...g.ths].map(([t, src]) => `<span class="chip th" data-tid="${esc(t)}" title="${esc(src)}"><b>${esc(T[t]?.abbr || t)}</b></span>`).join('');
    const notes = [...g.notes].join('、');
    return `<tr title="${esc(notes ? '來源 note：' + notes : '')}"><td class="hint">${dirTxt}</td><td><div class="ths"><span class="chip" data-id="${esc(g.other)}">${esc(V[g.other]?.label || g.other)}</span><span style="min-width:12px;text-align:center">${sign}</span>${ths || '<span class="hint">無理論標籤</span>'}</div></td></tr>`;
  });
  return `<div style="max-height:170px;overflow:auto"><table class="tbl"><thead><tr><th>方向</th><th>變數　符號　在哪些理論</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

/* ---------- 搜尋下拉 ---------- */
let ddIdx = -1;
function openDD(f) {
  const q = f.trim().toLowerCase();
  const list = sortedVars.filter(v => !q || matches(v, q)).slice(0, 60);
  $('dd').innerHTML = list.map((v, i) => `<div class="it ${i === 0 ? 'act' : ''} ${v.unlinked ? 'ghost' : ''}" data-id="${esc(v.id)}"><span>${esc(v.label)}</span><span class="al">${esc(v.aliases.slice(0, 4).join('・'))}</span><span class="n">${v.theories.length ? v.theories.length + ' 個模型' : ''}</span></div>`).join('') || '<div class="it"><span class="al">沒有符合的變數</span></div>';
  $('dd').classList.add('open'); ddIdx = list.length ? 0 : -1;
}
function closeDD() { $('dd').classList.remove('open'); }
$('q').addEventListener('input', e => { openDD(e.target.value); renderSide(e.target.value); });
$('q').addEventListener('focus', e => { e.target.select(); openDD(e.target.value === (sel ? V[sel].label : '') ? '' : e.target.value); });
$('q').addEventListener('keydown', e => {
  const its = [...$('dd').querySelectorAll('.it[data-id]')];
  if (e.key === 'ArrowDown') { ddIdx = Math.min(its.length - 1, ddIdx + 1); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { ddIdx = Math.max(0, ddIdx - 1); e.preventDefault(); }
  else if (e.key === 'Enter') { if (its[ddIdx]) select(its[ddIdx].dataset.id); return; }
  else if (e.key === 'Escape') { closeDD(); return; }
  else return;
  its.forEach((x, i) => x.classList.toggle('act', i === ddIdx)); its[ddIdx]?.scrollIntoView?.({ block: 'nearest' });
});
$('clr').addEventListener('click', () => { $('q').value = ''; renderSide(''); $('q').focus(); openDD(''); });
function goHome() { sel = null; history.pushState({}, '', location.pathname); $('q').value = ''; closeDD(); renderSide(); renderMain(); window.scrollTo({ top: 0 }); }
$('home').addEventListener('click', goHome);
$('tgside').addEventListener('click', () => { const l = document.querySelector('.layout'); l.classList.toggle('noside'); const on = !l.classList.contains('noside'); $('tgside').setAttribute('aria-pressed', on); try { localStorage.setItem('vt-side', on ? '1' : '0'); } catch (e) {} fitGrids(); });
try { if (localStorage.getItem('vt-side') === '0') { document.querySelector('.layout').classList.add('noside'); $('tgside').setAttribute('aria-pressed', 'false'); } } catch (e) {}
document.addEventListener('click', e => {
  const it = e.target.closest('.dd .it[data-id]'); if (it) { select(it.dataset.id); return; }
  if (!e.target.closest('.search')) closeDD();
  const sv = e.target.closest('.side .v'); if (sv) { select(sv.dataset.id); return; }
  const nd = e.target.closest('.node'); if (nd) { select(nd.dataset.id); return; }
  const ch = e.target.closest('.chip[data-id]'); if (ch) { select(ch.dataset.id); return; }
  const th = e.target.closest('.chip[data-tid]'); if (th) { const c = document.querySelector(`.model[data-tid="${CSS.escape(th.dataset.tid)}"]`); c?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const j = e.target.closest('[data-jump]'); if (j) { e.preventDefault(); document.getElementById(j.dataset.jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const b = e.target.closest('button[data-act="wide"]'); if (b) { const c = b.closest('.model'); c.classList.toggle('wide'); b.setAttribute('aria-pressed', c.classList.contains('wide')); fitGrids(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList?.contains('node')) select(e.target.dataset.id); if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); } });
window.addEventListener('popstate', () => { const id = decodeURIComponent((location.hash.match(/#v=(.*)$/) || [])[1] || ''); if (id && V[id]) select(id, false); else { sel = null; $('q').value = ''; renderSide(); renderMain(); } });

$('meta').textContent = `${D.variables.length} 個變數・${D.theories.length} 個模型・${D.edges.length} 條邊・${D.generated}`;
const init = decodeURIComponent((location.hash.match(/#v=(.*)$/) || [])[1] || '');
renderSide();
if (init && V[init]) select(init, false); else renderMain();
fitGrids();
</script>
</body>
