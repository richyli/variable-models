    - [General Self-Efficacy, Feedback -> Self-Efficacy, m]
    desc: Bandura（1986, 2004）提出：個人認知、行為與環境三者交互決定；自我效能是核心，透過精熟經驗與觀察學習建立，直接提高行為並影響結果預期與目標設定，社會環境的助力與阻力也會影響效能、預期與行為，行為反過來改變環境與效能。
    refs:
    - {title: 'IS Theories wiki: Social cognitive theory', url: 'https://is.theorizeit.org/wiki/Social_cognitive_theory'}
    - {title: 'Bandura (2004) Health promotion by social cognitive means, Health Education & Behavior 31(2)', url: 'https://pubmed.ncbi.nlm.nih.gov/15090118/'}
    - {title: 'Simply Psychology: Albert Bandura''s Social Cognitive Theory', url: 'https://www.simplypsychology.org/social-cognitive-theory.html'}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 31 章', url: ''}
    enrich_notes: 保留原五條。原理論是三元交互決定論，沒有單向正負號；這裡採 Bandura（2004）健康促進版的核心決定因子結構（知識、自我效能、結果預期、目標、社會結構助力與阻力），Bandura 的「goals」用名單既有的
      Goal Commitment。社會環境同時含助力（+）與阻力（−），統一畫成正向、把阻力視為反向計分。Behavior -> Past Performance -> Self-Efficacy 表達精熟經驗的回饋環。
    book_check: Miles 2012 第 31 章對照：補 8 條邊；書中變數我們原本沒有的：Observational Learning、General Self-Efficacy、Reinforcement、Self-Regulation、Personal
      Agency、Moral Disengagement。我們清單另有 T SEF Self-Efficacy Theory，與本章重疊，自我效能相關變數已在。書上明寫：自我效能→努力與持續性、新行為需獎賞才持續、自我獎賞者表現較佳。相互決定論（行為↔環境↔認知三者雙向）是前提而非可檢定的單向邊，故未畫，若要畫可加
      Behavior↔Environment 雙向。Job Performance→Self-Efficacy 來自批評節 Vancouver et al.（2001, 2002）的反向發現，書上明寫。GSE 調節環境回饋對任務自我效能的影響，是批評節引述其他研究者的說法，非
      Bandura 本人。Measuring 一節只給自我效能量表（GSE、集體效能、知覺一般自我效能）與 moral disengagement，故 Moral Disengagement 列為書中構念但無邊。
