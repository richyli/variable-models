    desc: Coombs（2007）：利害關係人依危機類型（可控性、內外歸因）、危機歷史與先前關係聲譽歸因組織責任；責任越高越損害聲譽、引發憤怒，聲譽與情緒決定購買意圖與負面口碑；回應策略要與責任程度相配，責任越高越需彌補型策略。
    refs:
    - {title: Situational crisis communication theory - Wikipedia, url: 'https://en.wikipedia.org/wiki/Situational_crisis_communication_theory'}
