    - {title: 'Impure Altruism and Donations to Public Goods: A Theory of Warm-Glow Giving (EJ 1990)', url: 'https://stafforini.com/works/andreoni-1990-impure-altruism-donations/'}
    enrich_notes: 原四條保留（捐款→溫暖光輝是效用來源的回饋邊，與理論一致）。新增模型最核心的比較靜態：政府供給（他人供給）排擠私人捐款，而溫暖光輝越強排擠越不完全，以調節邊呈現。同理心→溫暖光輝依 Andreoni、Rao
