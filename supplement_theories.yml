    desc: Tajfel 與 Turner（1979）：人把自己與他人歸入群體，群體成員身分成為自我概念的一部分；為了取得正向獨特性，人會偏袒內團體、貶抑外團體以維持自尊；群體界線能否滲透與地位是否穩定、正當，決定採取流動、創意或競爭策略。
    refs:
    - {title: Social identity theory - Wikipedia, url: 'https://en.wikipedia.org/wiki/Social_identity_theory'}
    - {title: 'Social Identity Theory (Tajfel & Turner, 1979) - Simply Psychology', url: 'https://www.simplypsychology.org/social-identity-theory.html'}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 35 章', url: ''}
    enrich_notes: 原 desc 空白，重寫。原六條有三條無方向且 Social Identity→Social Categorization 與 Social Categorization→Social Identity 互相矛盾，刪前者，保留分類→認同。Social
      Groups Distinction 解讀為分類造成的群間差異誇大（accentuation）。Personal Identify（名單既有拼法）→Social Identity 取負號，表示個人認同顯著時社會認同較不顯著（salience
      trade-off）。原邊 Social Identity→In-group 改成新造的 In-group Favoritism，並補 Out-group Derogation、Self-Esteem（自尊假說：偏袒提高自尊、自尊受威脅促進偏袒；Wikipedia
      註明證據混雜）。Group Boundary Permeability 為 Tajfel & Turner 的社會結構調節變數。Social Identity→Behavioral Intention 為 IS／行銷實證版本常見結果（群體行為）。
    book_check: Miles 2012 第 35 章對照：補 5 條邊；書中變數我們原本沒有的：Identity Salience、Multiple Identities、Intergroup Competition、Group
      Cohesion、Identity Distress。我們清單另有 SIMCA 與 SIDE，兩者延伸自本理論。書上明寫：正向社會認同來自內外團體有利比較、最小團體實驗中分配偏袒內團體、Mael & Ashforth（1992）校友認同→捐款／招募／出席／滿意（Identification→Donation
      正向未列）、認同→凝聚／合作／利他／忠誠／承諾、某認同顯著時行為依該團體規範（故 Identity Salience 作調節）。Perceived Reputation 沿用我們名稱，書上是 perceived organizational
      prestige；Intergroup Competition 對應 perceived organizational competition 量表，兩者皆是 Mael & Ashforth 模型的認同前因（書只列量表，前因方向是我依該模型補的；Intergroup
      Competition→Identification 正向未列）。In-group Favoritism→Self-Esteem 的方向依理論假設 1、2 推。Turnover Intention 對應 Scott et al.（1999）intent
      to leave。批評節：Rabbie 等人發現改變結果控制感後反而偏袒外團體。
