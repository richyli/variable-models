    - {title: Social exchange theory (Wikipedia), url: 'https://en.wikipedia.org/wiki/Social_exchange_theory'}
    - {title: 'Social exchange theory: Systematic review and future directions (Frontiers in Psychology 2022)', url: 'https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2022.1015921/full'}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 33 章', url: ''}
    enrich_notes: 原五條保留。SET 是框架不是固定模型，此處採關係行銷／組織研究的常見實證版本：互惠與公平規範建立信任，信任與報酬成本評估決定承諾，承諾導向持續與公民行為；替代選擇吸引力對應 Thibaut 與 Kelley
      的替代比較水準及 Emerson 的依賴概念。Emerson 的權力—依賴分支（依賴→權力）未畫入。
    book_check: Miles 2012 第 33 章對照：補 5 條邊；書中變數我們原本沒有的：Social Exchange Relationship、Economic Exchange Relationship、Relationship
      Satisfaction、Perceived Job Security。書上明寫：持續獲得回報提高互信與承諾（通則 3）、穩定互惠與交換規模漸擴產生信任、信任升高後才有大額交換、各方滿意度是未來交換的首要決定因素、未履行互惠義務會招致社會制裁（可補
      Reciprocity→Informal Sanctions 負向邊，未列）。Alternative Attractiveness→Relationship Commitment 的負號由通則 2「與替代關係比較成本效益」推出。POS→OCB
      與 Knowledge Sharing 來自 Measuring 節列的 Wayne et al.（1997）、Bartol et al.（2009），後者標題明寫 perceived job security 為社會交換→知識分享的調節；管理者啟示節則寫成主效果（高工作保障者才分享知識）。Social
      Exchange Relationship／Economic Exchange Relationship 對應 Shore et al.（2006）量表。
