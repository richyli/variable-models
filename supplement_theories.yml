    desc: Burnham、Frels 與 Mahajan（2003）：轉換成本分程序（時間心力）、財務（可量化損失）、關係（心理與認同損失）三類，由產品複雜度、使用廣度與轉換經驗等決定；轉換成本降低轉換意圖、提高留存，並調節滿意對留存的效果。
