# 常用構念的量表題項（2026-10-19 起）。鍵＝變數 id；每份量表：name／source／url／definition／items／scale／reliability／context／notes。
# 改完重跑 python tools/variable_model_tool.py 會重產 questionnaires.html。
Behavioral Intention:
  zh: 行為意圖
  scales:
  - name: UTAUT Behavioral Intention (Venkatesh et al. 2003)
    source: 'Venkatesh, V., Morris, M. G., Davis, G. B., & Davis, F. D. (2003). User acceptance of information technology: Toward a unified view. MIS Quarterly, 27(3), 425–478.'
    url: https://eclass.hmu.gr/modules/document/file.php/DSH314/006%20%CE%97%CE%B3%CE%B5%CF%83%CE%AF%CE%B1%20%CE%BA%CE%B1%CE%B9%20%CE%B1%CE%BB%CE%BB%CE%B1%CE%B3%CE%AE%2014%20%CE%99%CE%B1%CE%BD%202026/Venkatesh%202003_UTAUT.pdf
    definition: 使用者打算在未來一段期間內使用該系統的意圖；UTAUT 把它當成使用行為的直接前因。
    items:
    - 'BI1: I intend to use the system in the next <n> months.'
    - 'BI2: I predict I would use the system in the next <n> months.'
    - 'BI3: I plan to use the system in the next <n> months.'
    scale: 7-point scale（論文只說「1 為負向端、7 為正向端」，所有構念皆用七點量表；後續研究多用 strongly disagree–strongly agree）
    reliability: ICR = .92 / .90 / .90（Study 1，T1／T2／T3，N = 215）；.89 / .88 / .90（Study 2 跨組織驗證）
    context: 四個組織導入新資訊系統的員工，訓練後（T1）、導入後一個月（T2）、三個月（T3）三波施測；使用行為另以系統紀錄的使用時長測量
    notes: 原文 Table 16 標示此三題「adapted from Davis et al. (1989)」。<n> 由研究者填入期間（常見 6 個月）。改編時「the system」換成具體系統名；遠距精神醫療的改編版（PMC8977602）把 BI2 改成 I predict I will use…，α = .975。三題高度同質，常見縮短版只留 BI1＋BI3。
  - name: UTAUT2 Behavioral Intention (Venkatesh, Thong & Xu 2012)
    source: 'Venkatesh, V., Thong, J. Y. L., & Xu, X. (2012). Consumer acceptance and use of information technology: Extending the unified theory of acceptance and use of technology. MIS Quarterly, 36(1),
      157–178.'
    url: https://moodle2.units.it/pluginfile.php/427815/mod_resource/content/1/consumer%20acceptance%20of%20technologies_Venkatesh%202012.pdf
    definition: 消費者情境下，繼續使用某項科技的意圖（措辭已從「採用」改成「持續使用」）。
    items:
    - BI1. I intend to continue using mobile Internet in the future.
    - BI2. I will always try to use mobile Internet in my daily life.
    - BI3. I plan to continue to use mobile Internet frequently.
    scale: 7-point Likert, strongly disagree–strongly agree
    reliability: 論文表 1 報告所有反映性量表 ICR ≥ .75、AVE > .70（N = 1,512）；BI 個別數值見原文 Table 1
    context: 香港 1,512 位行動上網消費者，兩階段線上調查，第一波後四個月再收使用資料
    notes: 適合「已在使用、問要不要繼續用」的情境；研究初次採用時應改回 UTAUT 2003 版。BI2「always try to use」語意偏習慣，改編到低頻率行為時常被拿掉。使用行為用六種應用的使用頻率做成形成性指標（見 Behavior）。
  - name: TPB Intention (Ajzen; Fishbein & Ajzen 2010 questionnaire guide)
    source: 'Ajzen, I. (n.d.). Constructing a theory of planned behavior questionnaire. University of Massachusetts Amherst（依 Fishbein, M., & Ajzen, I. (2010). Predicting and changing behavior: The reasoned
      action approach. Psychology Press 附錄）。'
    url: https://people.umass.edu/aizen/pdf/tpb.measurement.pdf
    definition: 意圖是行為的直接前因；題項必須與行為準則（target, action, context, time）完全相容，並以自我指向的方式陳述。
    items:
    - I intend to exercise for at least 20 minutes, three times per week for the next three months.
    scale: 7-point bipolar adjective scale, likely (1)–unlikely (7)（指南建議每個構念 5–6 題，各以七點雙極形容詞量尺作答）
    reliability: 指南未報告數值；要求前測後各構念內部一致性要高（高 α），並以 CFA 檢查區辨效度，必要時刪 1–2 題
    context: 範例行為為術後病人未來三個月每週運動三次、每次 20 分鐘；屬問卷建構指南，不是單一實證研究
    notes: 指南只示範一題意圖題；實務上常見的另外幾種句型（I plan to…／I will try to…／I expect to…）在本指南正文沒有列出，改編時請自行依 TACT 原則改寫並保持與行為題同一時間框架。
  - name: TAM self-predicted future usage / behavioral expectation (Davis 1989, Study 2)
    source: Davis, F. D. (1989). Perceived usefulness, perceived ease of use, and user acceptance of information technology. MIS Quarterly, 13(3), 319–340.
    url: https://parsmodir.com/wp-content/uploads/2018/11/TAM-Davis-1989.pdf
    definition: 受測者對自己未來是否會經常使用某系統的自我預測（Davis 稱為 behavioral expectation，引 Warshaw & Davis 1985）。
    items:
    - Assuming Pendraw would be available on my job, I predict that I will use it on a regular basis in the future.
    scale: 兩個 7-point 量尺：一個 likely–unlikely，另一個反向極性 improbable–probable
    reliability: 原文未對此題報告信度；與 perceived usefulness 的相關 r = .85（pooled, n = 80）
    context: 40 位 MBA 學生在實驗室試用兩套繪圖軟體（Chart-Master、Pendraw）後作答
    notes: Davis (1989) 本身沒有三題式 BI 量表；常被引用的「I intend to use…」三題出自 Davis, Bagozzi & Warshaw (1989, Management Science 35(8), 982–1003)，本次找不到可開啟的全文，題項未能逐字確認；UTAUT 2003 明寫其 BI 三題改編自該文。Davis 1989 的 PU／PEOU
      在 Study 2 用 extremely likely–extremely unlikely 七點量尺。
Behavior:
  zh: 實際行為／使用行為
  scales:
  - name: TAM self-reported current usage (Davis 1989, Study 1)
    source: Davis, F. D. (1989). Perceived usefulness, perceived ease of use, and user acceptance of information technology. MIS Quarterly, 13(3), 319–340.
    url: https://parsmodir.com/wp-content/uploads/2018/11/TAM-Davis-1989.pdf
    definition: 使用者自陳目前使用某系統的頻率。
    items:
    - Participants were asked to self-report their degree of current usage of electronic mail and XEDIT on six-position categorical scales with boxes labeled "Don't use at all," "Use less than once each
      week," "Use about once each week," "Use several times a week," "Use about once each day," and "Use several times each day."
    scale: 六格類別量尺：Don't use at all / Use less than once each week / Use about once each week / Use several times a week / Use about once each day / Use several times each day
    reliability: 單題，無信度；與 perceived usefulness r = .63、與 ease of use r = .45（pooled n = 184）
    context: IBM Canada 員工使用 PROFS 電子郵件（n = 109）與 XEDIT 編輯器（n = 75）
    notes: 是單一自陳頻率題，不是多題量表。常見改編：加一題「每週使用時數」或改成 7 點 never–several times a day。Davis, Bagozzi & Warshaw (1989) 另以 14 週後的實際使用衡量，本次未取得全文。
  - name: UTAUT Use Behavior — system-log duration (Venkatesh et al. 2003)
    source: 'Venkatesh, V., Morris, M. G., Davis, G. B., & Davis, F. D. (2003). User acceptance of information technology: Toward a unified view. MIS Quarterly, 27(3), 425–478.'
    url: https://eclass.hmu.gr/modules/document/file.php/DSH314/006%20%CE%97%CE%B3%CE%B5%CF%83%CE%AF%CE%B1%20%CE%BA%CE%B1%CE%B9%20%CE%B1%CE%BB%CE%BB%CE%B1%CE%B3%CE%AE%2014%20%CE%99%CE%B1%CE%BD%202026/Venkatesh%202003_UTAUT.pdf
    definition: 實際使用行為，以系統紀錄的使用時長（duration of use）客觀測量。
    items:
    - Actual usage behavior was measured as duration of use via system logs.
    scale: 客觀指標（使用時長），非問卷題
    reliability: 不適用（客觀紀錄）
    context: 四個組織導入新系統後六個月內的系統紀錄；論文提到因網路可用性影響，使用量指標對環境敏感
    notes: UTAUT 原版沒有自陳使用行為題；拿不到系統紀錄的研究通常改用 Davis 1989 的頻率題或 UTAUT2 的頻率索引。
  - name: UTAUT2 Use — frequency index across applications (Venkatesh, Thong & Xu 2012)
    source: 'Venkatesh, V., Thong, J. Y. L., & Xu, X. (2012). Consumer acceptance and use of information technology: Extending the unified theory of acceptance and use of technology. MIS Quarterly, 36(1),
      157–178.'
    url: https://moodle2.units.it/pluginfile.php/427815/mod_resource/content/1/consumer%20acceptance%20of%20technologies_Venkatesh%202012.pdf
    definition: 使用行為＝使用種類（variety）與頻率的形成性複合指標。
    items:
    - 'Please choose your usage frequency for each of the following:'
    - a) SMS
    - b) MMS
    - c) Ringtone and logo download
    - d) Java games
    - e) Browse websites
    - f) Mobile e-mail
    scale: 7-point frequency scale, never–many times per day
    reliability: 形成性指標，不報 α；六個指標的權重介於 .2 與 .40
    context: 香港行動上網消費者，第一波調查後四個月再測使用
    notes: 改編時把六個應用換成研究情境的功能清單；論文自承行為錨定量尺可能有較高共同方法變異。
  - name: TPB self-reported behavior / past behavior (Ajzen questionnaire guide)
    source: Ajzen, I. (n.d.). Constructing a theory of planned behavior questionnaire. University of Massachusetts Amherst（依 Fishbein & Ajzen 2010 附錄）。
    url: https://people.umass.edu/aizen/pdf/tpb.measurement.pdf
    definition: 行為以事後自陳是否在指定期間內做出與意圖題完全相同定義的行為來測量。
    items:
    - In the past three months, I have exercised for at least 20 minutes, three times per week.
    - Three months following administration of the questionnaire (or another period as defined by the behavioral criterion), the participants are recontacted and asked to report whether they had exercised
      for at least 20 min, three times per week for the past three months.
    scale: 過去行為題：7-point false (1)–true (7)；追蹤行為題：依行為準則回報是否做到（指南未給固定格式）
    reliability: 指南未報告
    context: 問卷建構指南範例（術後病人運動行為）
    notes: 行為題與意圖題的 TACT 四要素必須一致；指南提醒範例中的過去行為發生在手術前，未必能預測未來行為。
Trust:
  zh: 信任
  scales:
  - name: Mayer & Davis (1999) Trust / Ability–Benevolence–Integrity (ABI) scales
    source: 'Mayer, R. C., & Davis, J. H. (1999). The effect of the performance appraisal system on trust for management: A field quasi-experiment. Journal of Applied Psychology, 84(1), 123–136.'
    url: https://iri.hse.ru/data/808/479/1225/Oct%2012%20The%20Effect%20of%20the%20Performance%20App..gement%20A%20field%20quasi-experiment.pdf
    definition: 信任＝願意讓自己暴露在受信任者的行動之下（willingness to be vulnerable）；可信度由能力、善意、正直三因素構成（Mayer, Davis & Schoorman 1995）。
    items:
    - '[Ability] Top management is very capable of performing its job.'
    - '[Ability] Top management is known to be successful at the things it tries to do.'
    - '[Ability] Top management has much knowledge about the work that needs done.'
    - '[Ability] I feel very confident about top management''s skills.'
    - '[Ability] Top management has specialized capabilities that can increase our performance.'
    - '[Ability] Top management is well qualified.'
    - '[Benevolence] Top management is very concerned about my welfare.'
    - '[Benevolence] My needs and desires are very important to top management.'
    - '[Benevolence] Top management would not knowingly do anything to hurt me.'
    - '[Benevolence] Top management really looks out for what is important to me.'
    - '[Benevolence] Top management will go out of its way to help me.'
    - '[Integrity] Top management has a strong sense of justice.'
    - '[Integrity] I never have to wonder whether top management will stick to its word.'
    - '[Integrity] Top management tries hard to be fair in dealings with others.'
    - '[Integrity] Top management''s actions and behaviors are not very consistent. (reverse-scored)'
    - '[Integrity] I like top management''s values.'
    - '[Integrity] Sound principles seem to guide top management''s behavior.'
    - '[Trust] If I had my way, I wouldn''t let top management have any influence over issues that are important to me. (reverse-scored)'
    - '[Trust] I would be willing to let top management have complete control over my future in this company.'
    - '[Trust] I really wish I had a good way to keep an eye on top management. (reverse-scored)'
    - '[Trust] I would be comfortable giving top management a task or problem which was critical to me, even if I could not monitor their actions.'
    - '[Propensity] One should be very cautious with strangers.'
    - '[Propensity] Most experts tell the truth about the limits of their knowledge.'
    - '[Propensity] Most people can be counted on to do what they say they will do.'
    - '[Propensity] These days, you must be alert or someone is likely to take advantage of you.'
    - '[Propensity] Most salespeople are honest in describing their products.'
    - '[Propensity] Most repair people will not overcharge people who are ignorant of their specialty.'
    - '[Propensity] Most people answer public opinion polls honestly.'
    - '[Propensity] Most adults are competent at their jobs.'
    scale: '5-point Likert: 1 Disagree strongly / 2 Disagree / 3 Neither agree nor disagree / 4 Agree / 5 Agree strongly'
    reliability: Ability α = .85 (Wave 2) / .88 (Wave 3)；Benevolence .87 / .89；Integrity .82 / .88；Propensity .55 / .66；Trust .59 / .60。Schoorman, Mayer & Davis (1996) 原始較長版本（10/12/13/7/4 題）α = .93 / .95
      / .96 / .71 / .82
    context: 一家公司員工評價公司高階管理團隊，14 個月三波現場準實驗（績效考核制度變更前後）
    notes: Trust 四題 α 偏低（.59–.60），作者歸因於題數少；後續研究常只用 ABI 三個可信度分量表、不用 Trust 四題。改編到 AI／機器人時（arXiv 2301.09011）把「top management」換成對象，Integrity 的 justice／fairness 題與「go out of its way」題因不適用被刪。跨文化研究指出 Ability／Benevolence
      部分題項在集體主義樣本解讀不同。
  - name: Trust in Automation Scale, TIAS (Jian, Bisantz & Drury 2000)
    source: Jian, J.-Y., Bisantz, A. M., & Drury, C. G. (2000). Foundations for an empirically determined scale of trust in automated systems. International Journal of Cognitive Ergonomics, 4(1), 53–71.
    url: https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1582880/full
    definition: 人對自動化系統的信任與不信任，視為同一向度的兩極（由信任相關詞彙的群集分析產生 12 題）。
    items:
    - The system is deceptive. (reverse-scored)
    - The system behaves in an underhanded manner. (reverse-scored)
    - I am suspicious of the system's intent, action, or output. (reverse-scored)
    - I am wary of the system. (reverse-scored)
    - The system's action will have a harmful or injurious outcome. (reverse-scored)
    - I am confident in the system.
    - The system provides security.
    - The system has integrity.
    - The system is dependable.
    - The system is reliable.
    - I can trust the system.
    - I am familiar with the system.
    scale: 7-point, 1 = Not at all, 7 = Extremely
    reliability: 原始論文未報告 α；McGrath et al. (2025) 以 AI 助理為對象 12 題 α = .94（Study 1）、.95（Study 3）
    context: 原始研究以問卷字詞評定建立量表，未在特定系統上驗證；McGrath et al. 2025 以 AI 助理為對象重新驗證
    notes: 題項取自 McGrath, Lack, Tisch & Duenser (2025, Frontiers in Artificial Intelligence, 8, 1582880) Table 1 的重製，原始 DTIC 報告與期刊全文本次打不開。前五題為不信任題需反向計分；Spain et al. (2008) 發現信任／不信任兩個相關因素；Gutzwiller et al.
      (2019) 指出量表有正向偏誤；第 12 題（familiar）常被認為不是信任題而拿掉。短版 S-TIAS 三題：I am confident in the system / The system is reliable / I can trust the system（α = .97）。
  - name: Trusting beliefs & trusting intentions, e-commerce (McKnight, Choudhury & Kacmar 2002)
    source: 'McKnight, D. H., Choudhury, V., & Kacmar, C. (2002). Developing and validating trust measures for e-commerce: An integrative typology. Information Systems Research, 13(3), 334–359.'
    url: https://ideas.repec.org/a/inm/orisre/v13y2002i3p334-359.html
    definition: Trusting beliefs＝相信對方具備可被信任的屬性（competence、benevolence、integrity）；trusting intentions＝願意依賴對方（willingness to depend、subjective probability of depending）。另有 disposition to trust 與 institution-based
      trust，共 16 個子構念。
    items: []
    scale: 原文為 7-point Likert（依 ideas.repec 摘要頁無法確認錨點）
    reliability: 本次未取得全文，未確認數值
    context: 以假想的法律諮詢網站（legal advice Web site）為刺激物的驗證研究
    notes: 題項未能逐字取得：Semantic Scholar 指向的開放取用檔 msu.edu/~mcknig26/Measures.pdf 已隨 MSU AFS 退役而失效，INFORMS、ResearchGate、Semantic Scholar 頁面皆回 403；只留摘要頁。改編時注意 competence／benevolence／integrity 三個 belief 各 3–4
      題、trusting intentions 分兩個子構念，後續研究（如 McKnight et al. 2011 trust in technology）把 benevolence 改成 helpfulness、competence 改成 functionality。需要原題請由圖書館取得 ISR 全文附錄。
  - name: Trust in online vendor (Gefen 2000; Gefen, Karahanna & Straub 2003)
    source: 'Gefen, D. (2000). E-commerce: The role of familiarity and trust. Omega, 28(6), 725–737.；Gefen, D., Karahanna, E., & Straub, D. W. (2003). Trust and TAM in online shopping: An integrated model.
      MIS Quarterly, 27(1), 51–90.'
    url: https://ideas.repec.org/a/eee/jomega/v28y2000i6p725-737.html
    definition: 消費者相信線上賣家（研究中為 Amazon.com）誠實、可靠、關心顧客且可預測的信念；Gefen 2003 把它與 TAM 整合。
    items: []
    scale: 7-point, strongly agree (1)–strongly disagree (7)（搜尋摘要所引 Gefen 2000 的描述，未在全文核對）
    reliability: Gefen 2000（搜尋摘要所引）：trust in the vendor α = .90、familiarity .91、disposition to trust .85、purchase intentions .78、inquiry intentions .91（N = 217）
    context: Gefen 2000：217 位潛在使用者，情境為在 Amazon.com 查詢與購買書籍；Gefen 2003：MBA 學生對 Amazon.com 的線上購書
    notes: 兩篇全文皆打不開（ScienceDirect／JSTOR 付費；terry.uga.edu 的 PDF 被 Cloudflare 擋、ResearchGate 與 academia.edu 回 403），題項未逐字取得，只留 Drexel esploro 與 ideas.repec 的書目頁（Gefen 2003 書目頁：https://researchdiscovery.drexel.edu/esploro/outputs/journalArticle/Trust-and-TAM-in-online-shopping/991019168361704721）。Gefen
      2003 的 familiarity、disposition to trust、trust、purchase intention 題皆沿用 Gefen 2000；需要原題請由圖書館取得。
Purchase Intention:
  zh: 購買意圖
  scales:
  - name: Willingness to buy (Dodds, Monroe & Grewal 1991)
    source: Dodds, W. B., Monroe, K. B., & Grewal, D. (1991). Effects of price, brand, and store information on buyers' product evaluations. Journal of Marketing Research, 28(3), 307–319.
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8987512/
    definition: 在給定價格、品牌、商店資訊下，買者願意購買該產品的程度（willingness to buy）。
    items:
    - If I were going to buy a bicycle, the probability of buying this model is
    - The probability that I would consider buying this bicycle is
    - At the price shown, I would consider buying the product
    - The likelihood of purchasing this laptop is…
    - The likelihood of ever using this laptop is…
    - My desire to own this laptop is…
    scale: 原文為 7-point 雙極量尺（very low–very high 類）；arXiv 2504.05359 的改編版用 5-point bipolar very low–very high；PMC8987512 的改編版用 7-point Likert strongly disagree–strongly agree
    reliability: 原文數值未核對；Sweeney, Soutar & Johnson (1999) 以其中三題測 willingness-to-buy α = .95；arXiv 2504.05359 改編版三題負荷 .723–.915
    context: 原始研究為實驗室實驗，受試者評估計算機與立體聲耳機在不同價格／品牌／商店條件下的品質、價值與購買意願
    notes: 本次找不到可開啟的 JMR 原文，題項來自兩個二手重製頁：前三題取自 Terblanche, Boshoff & Human-Van Eck (2022, PMC8987512) Table 7 標示的「Original three-item scale」，該表把來源合併標為 Capella et al. 2010、Dodds et al. 1991、Grewal et al.
      1998a/b，「bicycle」顯示已是後續改編，第三題在該表只看到改編後句型（At the price shown, I would consider buying the … featured in the advertisement）；後三題取自 arXiv 2504.05359（Dodds 1991 量表改編到筆電）。原始五題的逐字版本請核對 JMR 原文或 Bruner 的 Marketing
      Scales Handbook。
  - name: Purchase Intention, 5-item semantic differential (Spears & Singh 2004)
    source: Spears, N., & Singh, S. N. (2004). Measuring attitude toward the brand and purchase intentions. Journal of Current Issues & Research in Advertising, 26(2), 53–66.
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10904944/
    definition: 個人有意識地計畫去努力購買某品牌的程度（在 attitude-toward-the-ad 架構下與品牌態度區分）。
    items:
    - I will never/definitely buy this brand
    - I definitely do not intend to buy/definitely intend to buy this brand
    - I have very low/high purchase interest
    - I would definitely not buy/definitely buy it
    - I would probably not/probably buy it
    scale: 原文為 7-point 雙極（semantic differential）量尺；Shanbhogue & Ranjith (2024, PMC10904944) 改用 5-point Likert strongly disagree–strongly agree
    reliability: 原文數值未核對（全文付費）；Shanbhogue & Ranjith (2024) 改編版 α = .941（全球品牌）／.945（本土品牌），CR = .952／.957
    context: 原始研究以廣告實驗驗證品牌態度與購買意圖量表的心理計量特性；重製頁為印度消費者對全球／本土品牌
    notes: 題項取自 PMC10904944 Table 1 的重製（Taylor & Francis 原文頁回 403）。原量表應以雙極形容詞方式呈現（例：Definitely do not intend to buy — Definitely intend to buy），改成 Likert 同意度會失去語意差異格式。同文的品牌態度五題（unappealing/appealing、bad/good、unpleasant/pleasant、unfavorable/favorable、unlikable/likable）常與之配套使用。
User Satisfaction:
  zh: 使用者／顧客滿意
  scales:
  - name: IS Continuance Model satisfaction (Bhattacherjee 2001)
    source: 'Bhattacherjee, A. (2001). Understanding information systems continuance: An expectation-confirmation model. MIS Quarterly, 25(3), 351–370.'
    url: https://dm.its.msstate.edu/cob/mw156/intellcont/VedadiWarkentin2016_AISTRR2_7_ContinuanceMobileBanking-1.pdf
    definition: 使用者對先前使用資訊系統整體經驗的情感反應（滿意／不滿意），是持續使用意圖的主要前因。
    items:
    - How do you feel about your overall experience of mobile banking applications use?
    - Very dissatisfied/Very satisfied
    - Very displeased/Very pleased
    - Very frustrated/Very contented
    - Absolutely terrible/Absolutely delighted
    - '[Continuance intention] I intend to continue using mobile banking applications rather than discontinue its use.'
    - '[Continuance intention] My intentions are to continue using mobile banking applications than use any alternative means (traditional or web-based banking).'
    - '[Continuance intention] If I could, I would like to discontinue my use of mobile banking applications (reverse coded).'
    - '[Confirmation] My experience with using mobile banking applications was better than what I expected.'
    - '[Confirmation] The service level provided by mobile banking applications was better than what I expected.'
    - '[Confirmation] Overall, most of my expectations from using mobile banking applications were confirmed.'
    scale: 滿意：7-point semantic differential（四組雙極形容詞）；持續意圖與確認：7-point agree/disagree Likert
    reliability: Vedadi & Warkentin (2016) 複製研究（N = 256 大學生）：Satisfaction CR = .959、Continuance Intention .856、Confirmation .809；Bhattacherjee 2001 原始數值未核對（JSTOR 付費）
    context: 原始研究為線上銀行（online banking services, OBS）使用者；本頁題項取自 Vedadi & Warkentin (2016, AIS Transactions on Replication Research, 2, Paper 7) 把 OBS 改成 mobile banking applications 的複製版
    notes: 原文題幹為 How do you feel about your overall experience of online banking use?，改編時只換系統名、四組形容詞不動。滿意四題改編自 Oliver (1980) 與 Spreng, MacKenzie & Olshavsky (1996) 的語意差異格式。持續意圖第三題是反向題，部分後續研究因負荷低刪除。
  - name: End-User Computing Satisfaction, EUCS (Doll & Torkzadeh 1988)
    source: Doll, W. J., & Torkzadeh, G. (1988). The measurement of end-user computing satisfaction. MIS Quarterly, 12(2), 259–274.
    url: https://aisel.aisnet.org/cgi/viewcontent.cgi?article=1150&context=icis2000
    definition: 終端使用者對特定應用系統的滿意度，由內容、正確性、格式、易用性、及時性五個面向構成的二階構念。
    items:
    - C1. Does the system provide the precise information you need?
    - C2. Does the information content meet your needs?
    - C3. Does the system provide reports that seem to be just about exactly what you need?
    - C4. Does the system provide sufficient information?
    - A1. Is the system accurate?
    - A2. Are you satisfied with the accuracy of the system?
    - F1. Do you think the output is presented in a useful format?
    - F2. Is the information clear?
    - E1. Is the system user friendly?
    - E2. Is the system easy to use?
    - T1. Do you get the information you need in time?
    - T2. Does the system provide up-to-date information?
    scale: '原版 5-point, almost never–almost always；Chin & Lee (2000) 改用 7-point: never / almost never / some of the time / about half of the time / most of the time / almost always / always'
    reliability: 原文整體 α 未在本次來源核對；Doll, Xia & Torkzadeh (1994) 以 409 人 CFA 支持五個一階因素＋一個二階因素；Torkzadeh & Doll (1991) 報告再測信度
    context: 原始研究為 44 家公司 618 位終端使用者；題項取自 Chin & Lee (2000, ICIS Proceedings, Paper 57) Table 1 的逐字重製
    notes: 改編時把「the system」換成具體系統名（例：Does the CAS provide the precise information you need?）。Timeliness 兩題在網站情境常不穩定（Timeliness 需另行修訂）；Chin & Lee 另加整體滿意題 How would you rate your satisfaction with the use
      of the system?（very dissatisfied–very satisfied，-3 至 +3）可作總體滿意的單題。
  - name: ACSI customer satisfaction, 3-item index (Fornell et al. 1996)
    source: 'Fornell, C., Johnson, M. D., Anderson, E. W., Cha, J., & Bryant, B. E. (1996). The American Customer Satisfaction Index: Nature, purpose, and findings. Journal of Marketing, 60(4), 7–18.'
    url: https://en.wikipedia.org/wiki/American_Customer_Satisfaction_Index
    definition: 顧客滿意為潛在變數，由整體滿意、期望落差（expectancy disconfirmation）、與理想比較三題在結構方程模型中加權而成。
    items:
    - Using a scale from 1 to 10, where 1 means Very Dissatisfied and 10 means Very Satisfied, rate your overall satisfaction.
    - Using a scale from 1 to 10, where 1 means Falls Short of Your Expectations and 10 means Exceeds Your Expectations, how well does your experience meet your expectations?
    - Using a scale from 1 to 10, where 1 means Not Very Close to the Ideal and 10 means Very Close to the Ideal, how close was your experience to your "ideal" experience?
    scale: 1–10；三題錨點分別為 Very dissatisfied–Very satisfied、Falls short of your expectations–Exceeds your expectations、Not very close to the ideal–Very close to the ideal
    reliability: ACSI 不報 α；三題權重由 PLS 結構模型估計並換算為 0–100 指數
    context: 美國跨產業顧客滿意指數；題幹取自 CFI Group 為 NASA Planetary Data System 做的 ACSI 方法使用者調查（2020）
    notes: 題幹來源 https://pds.nasa.gov/home/NASAPDSUserSatisfaction2020final2.pdf （CFI Group 版本，另有以產品名代入的版本：how satisfied are you with PDS overall? / how does PDS compare to your expectations? / how does
      PDS compare to this ideal?）。Wikipedia 頁只列錨點。自行使用時常見簡化算法 (Satisfaction + Expectancy + Ideal − 3) / 27 × 100，與官方加權指數不同。
  - name: Satisfaction, expectancy-disconfirmation model (Oliver 1980)
    source: Oliver, R. L. (1980). A cognitive model of the antecedents and consequences of satisfaction decisions. Journal of Marketing Research, 17(4), 460–469.
    url: https://en.wikipedia.org/wiki/Expectation_confirmation_theory
    definition: 滿意是期望與期望落差（disconfirmation）的函數，並影響後續態度與購買意圖。
    items: []
    scale: 原文為六題 Likert 格式整體滿意題（二手文獻描述），錨點未核對
    reliability: α = .82（二手文獻轉述 Oliver 1980 六題內部一致性）
    context: 流感疫苗接種者與未接種者的兩階段現場研究
    notes: 原文在 SAGE 付費牆後（回 403），逐字題項未取得；本次只開到 Wikipedia 的理論頁與二手描述。後續多數研究並不直接沿用 Oliver 1980 原題，而是用 Oliver 的語意差異格式（Bhattacherjee 2001 四題即此類）或 Oliver (1997/2010) Satisfaction 專書中的量表。
Attitude:
  zh: 態度
  scales:
  - name: TPB 態度直接測量（Ajzen 語意差異題，Constructing a TPB Questionnaire）
    source: Ajzen, I.（n.d.）。Constructing a theory of planned behavior questionnaire. 作者自行發布之方法文件（依據 Fishbein & Ajzen, 2010, Predicting and changing behavior 附錄）
    url: https://people.umass.edu/aizen/pdf/tpb.measurement.pdf
    definition: 對執行某特定行為（含目標、行動、情境、時間四要素）的整體好惡評價，分工具性（instrumental）與經驗性（experiential）兩面向。
    items:
    - 'My exercising for at least 20 minutes, three times per week for the next three months would be: bad :___1__:___2__:___3__:___4__:___5__:___6__:___7___: good'
    - 'My exercising for at least 20 minutes, three times per week for the next three months would be: pleasant :___1__:___2__:___3__:___4__:___5__:___6__:___7___: unpleasant'
    scale: 7-point bipolar adjective (semantic differential) scales；文件建議每個構念 5–6 題，前測後保留內部一致性高的題
    reliability: 原文件未報信度（屬方法指引）；二手改編研究常見 α > .85（例：Boudreau & Godin 2009 法語加拿大糖尿病樣本 8 組形容詞對 α = .93，僅自搜尋摘要得知，未開啟原表）
    context: 範例行為為術後病人「未來三個月每週運動三次、每次至少 20 分鐘」，示範如何把題幹寫到與行為準則完全相容
    notes: 文件只示範 bad/good（工具性）與 pleasant/unpleasant（經驗性）兩對；改編時須把題幹改成自己定義的行為（含時間與情境），並兼顧工具性與經驗性兩類形容詞對。常見補充對：harmful/beneficial、worthless/valuable、unenjoyable/enjoyable、foolish/wise。注意正負向錨點要左右交錯以防反應定勢；極端詞（extremely）有無皆可，但同一份問卷要一致。
  - name: Attitude toward using（IS 採用情境；Taylor & Todd 1995 / Davis 式語意差異題）
    source: 'Taylor, S., & Todd, P. A.（1995）。Understanding information technology usage: A test of competing models. Information Systems Research, 6(2), 144–176'
    url: https://isri.sciencesphere.org/index.php?o=model&m=DTPB
    definition: 個人對使用某資訊系統（此處為 Computing Resource Center, CRC）所持的正負向評價。
    items:
    - Using the CRC is a (bad/good) idea.
    - Using the CRC is a (foolish/wise) idea.
    - I (dislike/like) the idea of using the CRC.
    - 'Using the CRC would be: (unpleasant/pleasant).'
    scale: 7-point bipolar (semantic differential) scale（ISRI 整理頁標示 0–7；原文為 7 點）
    reliability: ISRI 整理頁未列；原文報告之 α 未能從可開啟來源核對（依記憶約 .85–.90，未驗證，勿直接引用）
    context: 商學院學生使用校內 Computing Resource Center；同篇論文同時檢驗 TAM、TPB、DTPB 三模型
    notes: 題項取自 ISRI（Information Systems Research Indicators）二手整理頁，非出版社頁；ISRI 第一題印成 (bad I good) 為排版錯誤，此處改回斜線。此組題即 TAM 系統的 attitude toward using 標準寫法，Davis, Bagozzi & Warshaw (1989, Management Science)
      原版題幹為 All things considered, my using [system] in my job is … 配 good/bad 等形容詞對，但 Davis 原文 PDF 為掃描影像、無法逐字核對，未列入。Hsieh, Rai & Keil (2008) 改編版（同 ISRI 頁）：All things considered, using the Internet TV is
      extremely negative … extremely positive / extremely bad … extremely good / extremely harmful … extremely helpful。TAM2 以後（Venkatesh & Davis 2000）已拿掉 attitude 構念，改編 TAM 時要先決定要不要保留。
  - name: Attitude toward the ad / brand（Aad、Ab；MacKenzie & Lutz 1989）
    source: MacKenzie, S. B., & Lutz, R. J.（1989）。An empirical examination of the structural antecedents of attitude toward the ad in an advertising pretesting context. Journal of Marketing, 53(2), 48–65
    url: https://api.semanticscholar.org/graph/v1/paper/DOI:10.1177/002224298905300204?fields=title,abstract,year,venue
    definition: Aad：在特定一次曝光情境中，對特定廣告刺激做出有利或不利反應的傾向（a predisposition to respond in a favorable or unfavorable manner to a particular advertising stimulus during a particular exposure occasion）。
    items: []
    scale: 7-point semantic differential（依多篇二手引述）
    reliability: 未能從可開啟來源核對
    context: 廣告前測（pretesting）情境，受試者看電視廣告後評價廣告與品牌
    notes: 本份只確認了出處與定義，題項原文無法從任何可開啟來源逐字取得（JSTOR/SAGE 全文、MSU 論文庫 429、CSU 論文庫 403 皆打不開）。文獻常引的 Aad 形容詞對為 good/bad、favorable/unfavorable、pleasant/unpleasant，Ab 常用 good/bad、favorable/unfavorable、satisfactory/unsatisfactory，但這些未經原文核對，建議上線前補查
      Bruner《Marketing Scales Handbook》。可核對的近親量表：Muehling (1987) 的「對廣告整體態度」三題 My attitude toward advertising is Good/Bad, Favorable/Unfavorable, Positive/Negative（7 點語意差異；見 https://pdfs.semanticscholar.org/32a1/2612992cc30dd31e14f9814799886b9b7a17.pdf
      ），以及 MacKenzie, Lutz & Belch (1986) 的單題 To what extent do you like or dislike this ad（7 點 like/not like）。
Cognitive Load:
  zh: 認知負荷
  scales:
  - name: Paas 單題心智努力評定量表（Mental Effort Rating Scale）
    source: 'Paas, F. G. W. C.（1992）。Training strategies for attaining transfer of problem-solving skills in statistics: A cognitive-load approach. Journal of Educational Psychology, 84(4), 429–434'
    url: https://learninglab.uni-due.de/node/13339
    definition: 學習者在剛完成的學習活動或解題中，主觀感受到所投入的心智努力（mental effort），作為整體認知負荷的指標。
    items:
    - 'Please choose the category (1, 2, 3, 4, 5, 6, 7, 8, or 9) that applies to you: In the lecture that just finished I invested'
    scale: 9-point scale：1 = very, very low mental effort; 2 = very low mental effort; 3 = low mental effort; 4 = rather low mental effort; 5 = neither low nor high mental effort; 6 = rather high mental
      effort; 7 = high mental effort; 8 = very high mental effort; 9 = very, very high mental effort
    reliability: 重測信度 r = .90（Learning Lab 整理頁，引 Paas 1992）；單題無法算 α
    context: 統計學解題訓練實驗，每題解完後即時作答；上列題幹為 Leppink et al. (2013) Appendix 2 引用 Paas 題目的講課版本
    notes: 題幹依情境改寫（例：In solving or studying the preceding problem I invested …），九個錨點不要改。常見變體：Castro-Alonso 等人改成 1 = extremely small amount 到 9 = extremely large amount；也有人改問 difficulty（very, very easy …
      very, very difficult，見 Ayres 2006 / Leppink 2013 Appendix 2 第 2 題），但「努力」與「難度」是不同構念，報告時要分清。單題量表無法區分內在／外在／增生負荷，要分型就用 Leppink。
  - name: Leppink 等人三類型認知負荷量表（10 題）
    source: Leppink, J., Paas, F., Van der Vleuten, C. P. M., Van Gog, T., & Van Merriënboer, J. J. G.（2013）。Development of an instrument for measuring different types of cognitive load. Behavior Research
      Methods, 45(4), 1058–1072
    url: https://link.springer.com/content/pdf/10.3758/s13428-013-0334-1.pdf
    definition: 依認知負荷理論分成內在負荷（IL，題材本身的複雜度）、外在負荷（EL，教學呈現造成的負荷）、增生負荷（GL，投入在學習與理解上的負荷）三類。
    items:
    - The topic/topics covered in the activity was/were very complex.
    - The activity covered formulas that I perceived as very complex.
    - The activity covered concepts and definitions that I perceived as very complex.
    - The instructions and/or explanations during the activity were very unclear.
    - The instructions and/or explanations were, in terms of learning, very ineffective.
    - The instructions and/or explanations were full of unclear language.
    - The activity really enhanced my understanding of the topic(s) covered.
    - The activity really enhanced my knowledge and understanding of statistics.
    - The activity really enhanced my understanding of the formulas covered.
    - The activity really enhanced my understanding of concepts and definitions.
    scale: 11-point：0 (not at all the case) 到 10 (completely the case)；指導語：All of the following questions refer to the activity (lecture, class, discussion session, skills training or study session) that
      just finished.
    reliability: α = .81（IL，題 1–3）、.75（EL，題 4–6）、.82（GL，題 7–10）；Study I 為 56 位心理與健康科學博士生統計課；CFA 另以三班大學部統計課（n = 171、136、148）確認
    context: 大學統計課（講課、討論、技能訓練）結束後立即施測
    notes: 題 2、3、8、9 寫死「formulas」「statistics」，用到其他學科要改詞；作者 2014 年已出通用版（Leppink et al. 2014，Learning and Instruction）：ICL 四題、ECL 四題、GCL 四題，每類各加一題 I invested a very high mental effort in …。第三因素是否真的是 germane
      load 有爭議（原文 GL 分數與學習表現關聯不如預期，作者後來也承認可能只是「自評理解程度」），引用時要交代。Krieglstein 等人 2022 年後設分析整理了各研究 α（多數 IL .70–.96、EL .40–.91、GL .70–.96），EL 題在部分樣本偏低。
  - name: NASA-TLX（Task Load Index）
    source: 'Hart, S. G., & Staveland, L. E.（1988）。Development of NASA-TLX (Task Load Index): Results of empirical and theoretical research. In P. A. Hancock & N. Meshkati (Eds.), Human mental workload
      (Advances in Psychology, Vol. 52, pp. 139–183). Amsterdam: North-Holland'
    url: https://ntrs.nasa.gov/api/citations/20000021487/downloads/20000021487.pdf
    definition: 主觀工作負荷（workload）：由心智需求、體力需求、時間需求、自評表現、努力、挫折六個子量表加權平均而得的整體負荷分數。
    items:
    - 'MENTAL DEMAND (Low/High): How much mental and perceptual activity was required (e.g., thinking, deciding, calculating, remembering, looking, searching, etc.)? Was the task easy or demanding, simple
      or complex, exacting or forgiving?'
    - 'PHYSICAL DEMAND (Low/High): How much physical activity was required (e.g., pushing, pulling, turning, controlling, activating, etc.)? Was the task easy or demanding, slow or brisk, slack or strenuous,
      restful or laborious?'
    - 'TEMPORAL DEMAND (Low/High): How much time pressure did you feel due to the rate or pace at which the tasks or task elements occurred? Was the pace slow and leisurely or rapid and frantic?'
    - 'EFFORT (Low/High): How hard did you have to work (mentally and physically) to accomplish your level of performance?'
    - 'PERFORMANCE (Good/Poor): How successful do you think you were in accomplishing the goals of the task set by the experimenter (or yourself)? How satisfied were you with your performance in accomplishing
      these goals?'
    - 'FRUSTRATION LEVEL (Low/High): How insecure, discouraged, irritated, stressed and annoyed versus secure, gratified, content, relaxed and complacent did you feel during the task?'
    scale: 每個子量表為 0–100 的視覺類比線（21 格、每格 5 分），兩端錨點 Low/High（Performance 為 Good/Poor）；原版另做 15 組兩兩比較算權重，加權後得 0–100 總分
    reliability: 原文件未報 α（各子量表為單題）；Hart (2006) 回顧指出 Raw TLX（不加權）與加權版高度相關
    context: NASA Ames 航空／模擬操作任務的工作負荷評估，後廣泛用於人因、醫療、HCI
    notes: 以上題目文字取自 NASA 技術備忘錄 NASA-TLX v1.0 使用手冊 Appendix A 的子量表定義（OCR 文字已校正標點）。紙本評定表常見簡化問法 How mentally demanding was the task? 等，屬後來的紙本版。常見改編：Raw TLX（RTLX，省略配對加權）、只取 Mental Demand 與 Effort 當認知負荷指標（教育研究常見）、把
      Physical Demand 拿掉。Performance 子量表方向與其他相反（Good 在左），分析前要注意是否反向。Wikipedia 條目 https://en.wikipedia.org/wiki/NASA-TLX 另有整理。
Job Performance:
  zh: 工作績效
  scales:
  - name: Williams & Anderson 1991 角色內行為（IRB）＋組織公民行為（OCBI／OCBO）
    source: Williams, L. J., & Anderson, S. E.（1991）。Job satisfaction and organizational commitment as predictors of organizational citizenship and in-role behaviors. Journal of Management, 17(3), 601–617
    url: https://scales.arabpsychology.com/?p=324709
    definition: 角色內行為（in-role behavior）指正式工作說明書要求、且為獎酬制度所認可的行為；OCBI 為對特定個人有益的公民行為，OCBO 為對組織整體有益的公民行為。
    items:
    - Adequately completes assigned duties.
    - Fulfills responsibilities specified in job description.
    - Performs tasks that are expected of him/her.
    - Meets formal performance requirements of the job.
    - Engages in activities that will directly affect his/her performance evaluation.
    - Neglects aspects of the job he/she is obligated to perform.
    - Fails to perform essential duties.
    - Helps others who have been absent.
    - Helps others who have heavy work loads.
    - Assists supervisor with his/her work (when not asked).
    - Takes time to listen to co-workers' problems and worries.
    - Goes out of way to help new employees.
    - Takes a personal interest in other employees.
    - Passes along information to co-workers.
    - Attendance at work is above the norm.
    - Gives advance notice when unable to come to work.
    - Takes undeserved work breaks.
    - Great deal of time spent with personal phone conversations.
    - Complains about insignificant things at work.
    - Conserves and protects organizational property.
    - Adheres to informal rules devised to maintain order.
    scale: 5-point Likert（1 = Strongly disagree … 5 = Strongly agree；整理頁所載，原文由主管評）
    reliability: 整理頁彙整：IRB α = .80–.94、OCBI α = .61–.88、OCBO α = .70–.75；原文 127 位主管評部屬
    context: 美國企業員工，由直屬主管評定；原始設計為主管他評，後續多改為自評
    notes: 題項取自二手整理頁（scales.arabpsychology.com），順序為 IRB 7 題（含 2 題反向：Neglects…、Fails…）、OCBI 7 題、OCBO 7 題（含 3 題反向：Takes undeserved work breaks、Great deal of time…、Complains…）。後續 IRT 研究指出 OCBO 的反向題實際上測的是反生產工作行為（CWB）而非
      OCB，許多研究因此拿掉這 3 題；短版常只用 IRB 前 4–5 題正向題。自評時「him/her」改「I」。本量表是「工作績效」研究中最常用的角色內績效自評／他評工具。
  - name: Goodman & Svyantek 1999 任務績效與脈絡績效量表
    source: 'Goodman, S. A., & Svyantek, D. J.（1999）。Person–organization fit and contextual performance: Do shared values matter. Journal of Vocational Behavior, 55(2), 254–275'
    url: https://europeanproceedings.com/pdf/article/10.15405/epsbs.2019.12.03.29
    definition: 任務績效（task performance）為職務核心技術工作的熟練程度；脈絡績效（contextual performance）為支持組織社會與心理環境的自發行為，含利他（altruism）與盡責（conscientiousness）兩子面向。
    items:
    - Helps other employees with their work when they have been absent.
    - Takes initiative to orient new employees to the department even though it is not a part of his/her job description.
    - Achieves the objectives of the job.
    - Performs well in the overall job by carrying out tasks as expected.
    scale: 7-point Likert（原版；Bağcı & Ünal 2019 土耳其版改 6 點 1 = Strongly Disagree … 6 = Strongly Agree）
    reliability: 原文 α 未能核對；Bağcı & Ünal (2019) 486 位公立醫院員工與其主管自評／他評，MTMM 支持兩因素區辨效度
    context: 美國企業員工，由同事或主管評；後續常用於自評＋主管評配對設計
    notes: 只找到 4 題（europeanproceedings 的 MTMM 研究引述的例題），原量表共 25 題：前 16 題為脈絡績效（利他 7 題＋盡責 9 題），後 9 題為任務績效。原文全文（Elsevier）及重印全題項的論文庫均打不開（403），上線前要補齊。常見縮短版只用 altruism 7 題＋task 9 題（共 16 題），盡責面向因與 OCBO 重疊常被拿掉。
  - name: Individual Work Performance Questionnaire（IWPQ 1.0，Koopmans 2014）
    source: 'Koopmans, L., Bernaards, C. M., Hildebrandt, V. H., de Vet, H. C. W., & van der Beek, A. J.（2014）。Construct validity of the Individual Work Performance Questionnaire. Journal of Occupational
      and Environmental Medicine, 56(3), 331–337；美式英文版見 Koopmans, L.（2015）。Individual Work Performance Questionnaire instruction manual. Amsterdam: TNO Innovation for Life – VU University Medical Center'
    url: https://publications.tno.nl/publication/34643651/pRdMkJME/koopmans-2015-iwpq.pdf
    definition: 個人工作績效為「與組織目標相關的行為或行動」（Campbell, 1990），分任務績效、脈絡績效、反生產工作行為三個面向，只測行為不測結果。
    items:
    - I was able to plan my work so that I finished it on time.
    - I kept in mind the work result I needed to achieve.
    - I was able to set priorities.
    - I was able to carry out my work efficiently.
    - I managed my time well.
    - On my own initiative, I started new tasks when my old tasks were completed.
    - I took on challenging tasks when they were available.
    - I worked on keeping my job-related knowledge up-to-date.
    - I worked on keeping my work skills up-to-date.
    - I came up with creative solutions for new problems.
    - I took on extra responsibilities.
    - I continually sought new challenges in my work.
    - I actively participated in meetings and/or consultations.
    - I complained about minor work-related issues at work.
    - I made problems at work bigger than they were.
    - I focused on the negative aspects of situation at work instead of the positive aspects.
    - I talked to colleagues about the negative aspects of my work.
    - I talked to people outside the organization about the negative aspects of my work.
    scale: 5-point，回溯期 past 3 months；任務與脈絡績效：0 = Seldom、1 = Sometimes、2 = Regularly、3 = Often、4 = Always；反生產工作行為：0 = Never、1 = Seldom、2 = Sometimes、3 = Regularly、4 = Often
    reliability: 荷蘭版（n = 1,424）：任務績效 PSI .81／α .78、脈絡績效 PSI .85、CWB PSI .74（手冊 Table 1）；美式英文版 α = .79、.83、.89（三個量表依序）；西班牙版 α = .83、.87、.77（Ramos-Villagrasa et al. 2019）
    context: 荷蘭各行業員工（藍領、白領、粉領皆有），自評；美式英文版經跨文化調適後在美國工作者驗證
    notes: 題項為 TNO 手冊第 7 節 American-English version 逐字；荷蘭原版英譯（Koopmans 2014 博士論文）措辭略不同（例：I managed to plan my work so that it was done on time / I complained about unimportant matters at work），引用時要註明用的是哪個版本。原
      47 題版還有「適應性績效」面向，1.0 版已併入脈絡績效。三個量表分開計分（各取平均 0–4），不建議加總成單一總分。學術用途免費，商業用途須向 TNO/VUmc 取得授權。
Self-Efficacy:
  zh: 自我效能
  scales:
  - name: Computer Self-Efficacy（CSE；Compeau & Higgins 1995）
    source: 'Compeau, D. R., & Higgins, C. A.（1995）。Computer self-efficacy: Development of a measure and initial test. MIS Quarterly, 19(2), 189–211'
    url: https://learninglab.uni-due.de/node/13917
    definition: 個人對自己有能力使用電腦完成工作的判斷（不是指某個特定軟體技能，而是對完成整體任務的能力信念）。
    items:
    - I could complete the job using the software package… if there was no one around to tell me what to do as I go.
    - I could complete the job using the software package… if I had never used a package like it before.
    - I could complete the job using the software package… if I had only the software manuals for reference.
    - I could complete the job using the software package… if I had seen someone else using it before trying it myself.
    - I could complete the job using the software package… if I could call someone for help if I got stuck.
    - I could complete the job using the software package… if someone else had helped me get started.
    - I could complete the job using the software package… if I had a lot of time to complete the job for which the software was provided.
    - I could complete the job using the software package… if I had just the built-in help facility for assistance.
    - I could complete the job using the software package… if someone showed me how to do it first.
    - I could complete the job using the software package… if I had used similar packages before this one to do the same job.
    scale: 兩段式：先答 Yes/No（能不能做到），答 Yes 再評信心 1 = Not at all confident、5 = Moderately confident、10 = Totally confident（10 點）
    reliability: α = .80（Learning Lab 整理頁所載）；Bao et al. (2013) 中國行動學習樣本 α = .911
    context: 加拿大知識工作者（原文 n ≈ 1,020 位 Financial Post 500 企業經理人與專業人員郵寄問卷）
    notes: 題項對照 Learning Lab 附件 PDF 與 Bao, Xiong, Hu & Kibelloh (2013, Journal of Educational Computing Research 49(1), 111–132；預印本 https://arxiv.org/pdf/1402.4211 ）附錄，兩者一致（附件第 4 題漏印 trying，此處依 Bao 版）。Marakas
      等人批評此量表測的是「一般 CSE」，與特定任務的「特定 CSE」要分開；研究手機 App 或 AI 工具時通常自編特定 CSE 題（I believe I have the ability to …）。多數後續研究省略 Yes/No 那一段，直接用 10 點信心評分。題幹 software package 可依情境改成具體系統名。
  - name: General Self-Efficacy Scale（GSE；Schwarzer & Jerusalem 1995）
    source: 'Schwarzer, R., & Jerusalem, M.（1995）。Generalized Self-Efficacy scale. In J. Weinman, S. Wright, & M. Johnston (Eds.), Measures in health psychology: A user''s portfolio. Causal and control
      beliefs (pp. 35–37). Windsor, UK: NFER-NELSON'
    url: http://userpage.fu-berlin.de/~health/engscal.htm
    definition: 一般性自我效能：相信自己能應付各領域中新的或困難的任務、能因應逆境的樂觀自我信念。
    items:
    - I can always manage to solve difficult problems if I try hard enough.
    - If someone opposes me, I can find the means and ways to get what I want.
    - It is easy for me to stick to my aims and accomplish my goals.
    - I am confident that I could deal efficiently with unexpected events.
    - Thanks to my resourcefulness, I know how to handle unforeseen situations.
    - I can solve most problems if I invest the necessary effort.
    - I can remain calm when facing difficulties because I can rely on my coping abilities.
    - When I am confronted with a problem, I can usually find several solutions.
    - If I am in trouble, I can usually think of a solution.
    - I can usually handle whatever comes my way.
    scale: 4-point：1 = Not at all true、2 = Hardly true、3 = Moderately true、4 = Exactly true；加總 10–40，無反向題
    reliability: 作者網頁：23 國樣本 α = .76–.90，多數在 .80 後段；德國五個樣本 α = .82–.93；Scholz et al. (2002) 25 國 n = 19,120 國際平均 29.55
    context: 一般成人與青少年；原為 1979 年德文 20 題版，1981 年縮為 10 題，英文版 1995 年出版；已有 30 餘種語言版（含中文）
    notes: 題項取自作者 Ralf Schwarzer 的 FU Berlin 官方頁；PsyToolkit 版（ https://psytoolkit.org/survey-library/generalized-self-efficacy-gse.html ）第 3、5、8、9、10 題措辭略有出入（少了 usually 等字），引用時以作者頁為準。非商業研究免申請授權，但要註明出處。有些研究改成
      5 點或 7 點，與常模比較時要換算。中文版已由 Zhang & Schwarzer (1995) 發表。
  - name: New General Self-Efficacy Scale（NGSE；Chen, Gully & Eden 2001）
    source: Chen, G., Gully, S. M., & Eden, D.（2001）。Validation of a new general self-efficacy scale. Organizational Research Methods, 4(1), 62–83
    url: https://sparqtools.org/mobility-measure/new-general-self-efficacy-scale/
    definition: 個人對自己在各種情境中達成表現的整體能力信念（one's belief in one's overall competence to effect requisite performances across a wide variety of achievement situations）。
    items:
    - I will be able to achieve most of the goals that I have set for myself.
    - When facing difficult tasks, I am certain that I will accomplish them.
    - In general, I think that I can obtain outcomes that are important to me.
    - I believe I can succeed at most any endeavor to which I set my mind.
    - I will be able to successfully overcome many challenges.
    - I am confident that I can perform effectively on many different tasks.
    - Compared to other people, I can do most tasks very well.
    - Even when things are tough, I can perform quite well.
    scale: 5-point Likert：1 = Strongly disagree … 5 = Strongly agree；取平均
    reliability: 二手整理頁報 α = .85–.90（scales.arabpsychology.com）；原文兩國（美國、以色列）多個樣本信度高、且比 Sherer 等人的 SGSE 更單向度，但原文確切 α 無法從可開啟頁面核對
    context: 美國與以色列大學生與軍人（管理／組織心理學情境），用來預測各種任務的特定自我效能
    notes: 題項對照 SPARQ 與 UCSD EMERGE 兩頁一致（EMERGE 第 1 題為 that I have set、第 4 題為 almost any；SPARQ 第 1 題 that I set、第 4 題 most any——以原文為準者建議採 EMERGE 版）。與 GSE 的差別：NGSE 由 14 題池篩出 8 題、單因素、題目全為「能達成目標／克服挑戰」的 can-do
      語氣；GSE 混有因應（coping）成分。組織行為研究偏用 NGSE，健康心理學偏用 GSE。
  - name: Bandura 自我效能量表編製指引（領域專屬量表的通用格式）
    source: 'Bandura, A.（2006）。Guide for constructing self-efficacy scales. In F. Pajares & T. Urdan (Eds.), Self-efficacy beliefs of adolescents (Vol. 5, pp. 307–337). Greenwich, CT: Information Age Publishing'
    url: https://readingmatrix.com/files/21-1jkbwrqn.pdf
    definition: 自我效能是對自己「能夠」（can do）組織並執行達成特定成果所需行動的能力判斷，必須針對特定功能領域量身編題，不存在通用題項。
    items:
    - The items should be phrased in terms of can do rather than will do. Can is a judgment of capability; will is a statement of intention.（Bandura 2006, p. 308）
    - Participants record the strength of their efficacy beliefs on a 100-point scale, ranging in 10-unit intervals from 0 (Cannot do); through intermediate degrees of assurance, 50 (Moderately certain
      can do); to complete assurance, 100 (Highly certain can do).（Bandura 2006, p. 312）
    scale: 0–100、每 10 分一格（0 = Cannot do；50 = Moderately certain can do；100 = Highly certain can do）；亦可用 0–10 的 11 點版，但 Bandura 反對 5 點或 7 點（區辨力不足）
    reliability: 不適用（指引非固定量表）
    context: 方法指引；範例量表（學業、自我調節學習、社交等）附於該章
    notes: 本條不是量表，而是編題規則；Bandura 原章 PDF 各鏡像（uky.edu、emory.edu）已失效，引文取自 Reading Matrix 期刊文章（Wyatt 2021 評述）逐字引用的頁碼。編題要點：題目列出不同難度等級的任務（graded difficulty）、避免「will」、避免天花板效應、先讓受試者練習評分、量表要與結果變項的領域對齊。學生常見錯誤是拿 GSE
      這類一般量表去預測特定行為，Bandura 明確反對。
Firm Performance:
  zh: 公司績效
  scales:
  - name: Venkatraman & Ramanujam 1986 企業績效測量架構（分類基模，非題項量表）
    source: 'Venkatraman, N., & Ramanujam, V.（1986）。Measurement of business performance in strategy research: A comparison of approaches. Academy of Management Review, 11(4), 801–814（本條引用其 1985 年 Illinois
      工作論文版）'
    url: https://ideals.illinois.edu/items/29400/bitstreams/97934/data.pdf
    definition: 企業績效是多維構念：最窄的「財務績效」（銷售成長、獲利、EPS 等）包在較寬的「營運績效」（市占、品質、新產品、行銷效能）之內，再外層是「組織效能」；測量途徑依「財務 vs 營運指標」×「初級 vs 次級資料」分成十類。
    items: []
    scale: 不適用（架構論文）；作者主張同時納入財務與營運指標、並用多重資料來源
    reliability: 不適用
    context: 策略管理實證研究的績效操作化回顧
    notes: 這篇是後續所有「主觀自評績效」量表的理論出處，自評量表設計時應交代涵蓋的是哪一層（財務／營運／效能）。工作論文版與 AMR 正式版內容一致，正式版頁碼 801–814。常被一起引用的是 Dess & Robinson (1984) 證明主觀自評績效與客觀財務數據顯著相關，用來合理化自評做法。
  - name: Delaney & Huselid 1996 知覺組織績效／知覺市場績效
    source: Delaney, J. T., & Huselid, M. A.（1996）。The impact of human resource management practices on perceptions of organizational performance. Academy of Management Journal, 39(4), 949–969
    url: https://www.markhuselid.com/pdfs/articles/1996_AMJ_Delaney_Huselid.pdf
    definition: 受訪高階主管將本組織過去三年的表現與同業其他組織相比所做的主觀評價；組織績效面向涵蓋品質、創新、人才、顧客與員工關係，市場績效面向涵蓋行銷、銷售成長、獲利與市占。
    items:
    - How would you compare the organization's performance over the past 3 years to that of other organizations that do the same kind of work? What about... Quality of products, services, or programs?
    - How would you compare the organization's performance over the past 3 years to that of other organizations that do the same kind of work? What about... Development of new products, services, or programs?
    - How would you compare the organization's performance over the past 3 years to that of other organizations that do the same kind of work? What about... Ability to attract essential employees?
    - How would you compare the organization's performance over the past 3 years to that of other organizations that do the same kind of work? What about... Ability to retain essential employees?
    - How would you compare the organization's performance over the past 3 years to that of other organizations that do the same kind of work? What about... Satisfaction of customers or clients?
    - How would you compare the organization's performance over the past 3 years to that of other organizations that do the same kind of work? What about... Relations between management and other employees?
    - How would you compare the organization's performance over the past 3 years to that of other organizations that do the same kind of work? What about... Relations among employees in general?
    - Compared to other organizations that do the same kind of work, how would you compare the organization's performance over the last 3 years in terms of... Marketing?
    - Compared to other organizations that do the same kind of work, how would you compare the organization's performance over the last 3 years in terms of... Growth in sales?
    - Compared to other organizations that do the same kind of work, how would you compare the organization's performance over the last 3 years in terms of... Profitability?
    - Compared to other organizations that do the same kind of work, how would you compare the organization's performance over the last 3 years in terms of... Market share?
    scale: 4-point Likert：1 = worse … 4 = much better（原文 Table 1 標示 range 1–4）
    reliability: 知覺組織績效 7 題 α = .85（N = 590）；知覺市場績效 4 題 α = .86（N = 373，僅上市公司）
    context: 美國 1991 年 National Organizations Survey（GSS 特別模組），590 家營利與非營利組織，由人資或高階主管回答
    notes: 前 7 題與後 4 題是兩個分開的量表，不要合併；市場績效量表只適用營利組織。後續 Rasch 分析（二手引述）指出原兩因素結構不佳，三因素（internal／external／market）較合理。台灣研究改編時常把「past 3 years」改成「過去一年」，並改 5 點或 7 點；也常只取 Quality、New products、Customer satisfaction
      三題加市場績效 4 題。本頁所列題幹依原文表格，What about… 與 in terms of… 為原文題幹的接續語。
  - name: Wiklund & Shepherd 2005 小企業主觀績效（相對競爭者的財務與成長指標）
    source: 'Wiklund, J., & Shepherd, D.（2005）。Entrepreneurial orientation and small business performance: A configurational approach. Journal of Business Venturing, 20(1), 71–91'
    url: https://link.springer.com/content/pdf/10.1007/s11846-011-0062-9.pdf
    definition: 小企業績效以成長（銷售成長率、員工成長）與財務績效（毛利、獲利、現金流）兩類指標合併衡量，由企業主／CEO 相對於競爭者自評。
    items:
    - sales growth rate
    - employee growth
    - gross margin
    - profitability
    - cash flow
    scale: 原文：財務三項為 7-point、相對於競爭者（much less than our competitors … much more than our competitors）；成長兩項以兩個時間點的實際數字計算（依 Kraus et al. 2012 的複製研究描述，原文全文未能開啟）
    reliability: 原文 α 未能核對；Kraus, Rigtering, Hughes & Hosman (2012, Review of Managerial Science) 荷蘭 164 家 SME 複製研究改用 5 點（1 = extremely bad performance … 5 = excellent performance）自評
    context: 瑞典小企業（原文 n = 413，依複製研究所述），CEO 郵寄問卷，兩波資料
    notes: 只找到五個指標名稱，不是完整題幹（原文 JBV 全文與複製研究的 ResearchGate 頁都打不開）；指標名稱取自 Kraus et al. (2012) 第 4 節逐字。同作者 2003 年 SMJ 論文（Knowledge-based resources, entrepreneurial orientation, and the performance of SMEs,
      24(13), 1307–1314）用同一套指標。改編時常見做法是列 8–10 個指標（加 market share、customer satisfaction、new product success）請受訪者相對競爭者或相對預期打分，但那些加項不是 Wiklund & Shepherd 的原設計，標示出處時要分清。
Involvement:
  zh: 涉入
  scales:
  - name: Personal Involvement Inventory（PII，20 題原版）
    source: Zaichkowsky, J. L.（1985）。Measuring the involvement construct。Journal of Consumer Research，12(3)，341–352
    url: https://academic.oup.com/jcr/article/12/3/341/1820588
    definition: 個人依其內在需求、價值與興趣，對某對象所知覺到的個人相關性（a person's perceived relevance of the object based on inherent needs, values, and interests）。
    items: []
    scale: 7-point semantic differential（20 組兩極形容詞對）
    reliability: α 平均 .90–.95（跨學生／上班族樣本與手錶、運動鞋、即溶咖啡、彩色電視等多種產品）；三週重測 .90（García et al. 1996 轉述 Zaichkowsky 1985 的數字）
    context: 美國消費者對產品類別（牛仔褲、汽車、即溶咖啡等）的涉入
    notes: 20 題原版的逐字形容詞對未在本次打開的任何來源中完整取得（JCR 原文僅訂閱者可讀；García, Olea, Ponsoda & Scott 1996 Psicothema 8(2) 337–349 只提供西班牙語改編版，見 https://www.psicothema.com/pdf/32.pdf ）。原文主因素佔共同變異 65%（牛仔褲）到 100%（即溶咖啡）。後續研究批評題項冗餘且單一向度（Mittal
      1989；McQuarrie & Munson 1987），作者本人於 1994 年縮為 10 題（見下一筆）。改編時注意：此量表測的是「對物／類別」的持久涉入，不是購買決策涉入。
  - name: Revised Personal Involvement Inventory（RPII，10 題修訂版）
    source: 'Zaichkowsky, J. L.（1994）。The personal involvement inventory: Reduction, revision, and application to advertising。Journal of Advertising，23(4)，59–70'
    url: https://learninglab.uni-due.de/node/13959
    definition: 個人依其內在需求、價值與興趣，對某對象所知覺到的個人相關性；修訂版同時涵蓋認知（cognitive）與情感（affective）兩個面向。
    items:
    - important – unimportant
    - boring – interesting
    - relevant – irrelevant
    - exciting – unexciting
    - means nothing – means a lot
    - appealing – unappealing
    - fascinating – mundane
    - worthless – valuable
    - involving – uninvolving
    - not needed – needed
    scale: 7-point semantic differential（題幹「To me, [object] is:」；UNT TAT 計分說明採 7 格；learninglab 資料庫則登錄為 9-point，兩來源不一致）
    reliability: α = .91–.96（learninglab 資料庫轉述原文）
    context: 廣告與產品涉入；修訂版驗證情境為廣告
    notes: 題項逐字取自 UNT 的 TAT 問卷計分文件 https://iittl.unt.edu/sites/default/files/instruments/scoringtat1_1.pdf （該文件標為「Zaichkowsky (1985) Modified PII」，但 10 組形容詞對與 1994 年修訂版一致；文件中第 5 題印為「means nothings」，應為排版錯誤）。反向題：形容詞對負向在左者（boring,
      means nothing, worthless, not needed）需反向計分；TAT 文件列的反向題號是依其自身左右排列而定。常見改編：Celuch & Taylor（1999, JCSDCB 12）在四種服務情境再縮為 8 題，仍維持認知／情感二因素（ https://www.jcsdcb.com/index.php/JCSDCB/article/view/175 ）；Foxall
      & Pallister（1998）用於金融服務。
  - name: Consumer Involvement Profile（CIP）
    source: Laurent, G., & Kapferer, J.-N.（1985）。Measuring consumer involvement profiles。Journal of Marketing Research，22(1)，41–53
    url: https://faculty.essec.edu/research/11670-measuring-consumer-involvement-profiles
    definition: 涉入不是單一程度而是一組剖面：由興趣（interest／perceived importance）、愉悅（pleasure）、符號價值（sign）、風險重要性（risk importance）、誤購機率（risk probability）五個前因構成。
    items: []
    scale: Likert 同意度量尺（原文為法語題項；點數未在打開的來源中確認）
    reliability: 原文信度未在打開的來源中取得；網路彙整頁轉述各面向 α .72–.90，未經核對
    context: 法國家庭主婦（207 位訪談；後擴至 14 個產品類別）
    notes: 英語逐字題項未取得：原文題項為法語，Kapferer & Laurent（1993，Psychology & Marketing 10(4) 347–355）附原始法語題項。五個面向的定義取自 Hosseini et al. 在 African Journal of Business Management 的整理表（ https://academicjournals.org/journal/AJBM/article-full-text-pdf/3303CB615327
      ）：interest＝對產品類別的個人興趣／意義／重要性；pleasure＝產品的享樂價值；sign＝產品表達自我的程度；risk importance＝錯誤選擇之負面後果的重要性；risk probability＝做出錯誤選擇的主觀機率。改編時注意：美國樣本常見 interest 與 pleasure 合併成單一因素（Jain & Srinivasan 1990 只抽出四因素）；Jain
      & Srinivasan 1990 的 New Involvement Profile（NIP）是以 CIP 為基礎的「第二代」語意差異版本，Almeida & Düsenberg（2014，RBGN 16(50) 75–95， https://rbgn.emnuvens.com.br/RBGN/article/download/959/pdf_41/15733 ）給的是巴西葡語回譯英文，不是原始英文。
  - name: Purchase-Decision Involvement scale（PDI）
    source: Mittal, B.（1989）。Measuring purchase-decision involvement。Psychology & Marketing，6(2)，147–162
    url: https://www.emerald.com/insight/content/doi/10.1108/02652329810228181/full/html
    definition: 消費者在一次購買決策任務上所投入的興趣與關切程度（the interest and concern that an individual brings to bear on the purchase decision task）；屬情境式／購買涉入，與 PII 的持久涉入區分。
    items: []
    scale: 7-point bipolar（4 題，原文 Figure 1, p. 152）
    reliability: α = .77（房貸購買者）–.87（退休金購買者）（Foxall & Pallister 1998，英國 N=308，用的是 Mittal 改為 4 題＋3 題產品重要性的 7 題版）
    context: 一般消費品的購買決策；後續多用於金融服務、觀光活動
    notes: 逐字題項未在打開的來源取得。Warnick & Bojanic（2010，USDA GTR-NRS-P-94， https://research.fs.usda.gov/download/treesearch/40358.pdf ）描述四題分別測：(1) 對市面上有哪些類型與品牌的在乎程度；(2) 各類型／品牌之間的差異程度；(3) 做出正確選擇的重要性；(4) 對選擇結果的關切程度。Mittal（1995）指出「品牌差異」那一題誤差過大，後續研究常刪除；Foxall
      & Pallister 1998 也發現該題 item-total 相關僅 .21–.37。Foxall & Pallister 的 7 題版另含「important to me」「matters a great deal」「important part of my life」三題產品重要性（Table II 為圖檔，未能逐字取得）。
Motivation:
  zh: 動機
  scales:
  - name: Intrinsic Motivation Inventory（IMI）— Interest/Enjoyment 分量表
    source: 'Ryan, R. M.（1982）。Control and information in the intrapersonal sphere: An extension of cognitive evaluation theory。Journal of Personality and Social Psychology，43，450–461；量表全文由 selfdeterminationtheory.org
      發布；效度研究 McAuley, E., Duncan, T., & Tammen, V. V.（1989）。Psychometric properties of the Intrinsic Motivation Inventory in a competitive sport setting。Research Quarterly for Exercise and Sport，60，48–58'
    url: https://selfdeterminationtheory.org/wp-content/uploads/2022/02/IMI_Complete.pdf
    definition: 參與者對某一目標活動的主觀經驗；其中 interest/enjoyment 分量表被視為內在動機的自陳測量（the self-report measure of intrinsic motivation）。
    items:
    - I enjoyed doing this activity very much
    - This activity was fun to do.
    - I thought this was a boring activity. (R)
    - This activity did not hold my attention at all. (R)
    - I would describe this activity as very interesting.
    - I thought this activity was quite enjoyable.
    - While I was doing this activity, I was thinking about how much I enjoyed it.
    scale: 7-point（1 = not at all true, 4 = somewhat true, 7 = very true）
    reliability: 官方文件未報 α；載明 McAuley, Duncan & Tammen（1989）CFA 支持效度，題項入選標準為因素負荷 ≥ .60 且交叉負荷 < .40
    context: 實驗室情境下受試者完成某項活動（拼圖、閱讀教材等）後的事後測量
    notes: 全套 45 題共 7 個分量表（interest/enjoyment、perceived competence、effort/importance、pressure/tension、perceived choice、value/usefulness、relatedness），研究者依問題自選分量表並隨機排序；官方說明允許把「this activity」改成具體活動而不影響信效度。(R)
      題反向計分（8 − 原分）。常用版本：22 題 Task Evaluation Questionnaire（interest/enjoyment 為第 1, 5, 8, 10, 14(R), 17, 20 題，另含 perceived competence、perceived choice、pressure/tension）；9 題閱讀版；25 題內化研究版。官方提醒自陳 interest
      與行為指標相關僅約 .4，且每個因素超過 4 題後增量 R 很小。題項另見 https://psytests.org/sdt/imien-bl.html 。
  - name: Situational Motivation Scale（SIMS）
    source: 'Guay, F., Vallerand, R. J., & Blanchard, C.（2000）。On the assessment of situational intrinsic and extrinsic motivation: The Situational Motivation Scale (SIMS)。Motivation and Emotion，24(3)，175–213'
    url: https://psytests.org.ru/sdt/simsen-bl.html
    definition: 個人在特定時刻、特定情境下從事某活動的動機（motivation toward a particular activity at a specific moment or within a particular situation），區分內在動機、認同調節、外在調節與無動機。
    items:
    - Why are you currently engaged in this activity? — Because I think that this activity is interesting.
    - Because I am doing it for my own good.
    - Because I am supposed to do it.
    - There may be good reasons to do this activity, but personally I don't see any.
    - Because I think that this activity is pleasant.
    - Because I think that this activity is good for me.
    - Because it is something that I have to do.
    - I do this activity but I am not sure if it is worth it.
    - Because this activity is fun.
    - By personal decision.
    - Because I don't have any choice.
    - I don't know; I don't see what this activity brings me.
    - Because I feel good when doing this activity.
    - Because I believe that this activity is important for me.
    - Because I feel that I have to do it.
    - I do this activity, but I am not sure it is a good thing to pursue it.
    scale: 7-point（1 = Corresponds not at all, 2 = Corresponds a very little, 3 = Corresponds a little, 4 = Corresponds moderately, 5 = Corresponds enough, 6 = Corresponds a lot, 7 = Corresponds exactly）
    reliability: 原文各分量表 α 未在打開的來源取得（Springer 原文頁需登入）
    context: 教育與體育活動情境；大學生樣本
    notes: 四個分量表各 4 題，依題意歸類：intrinsic motivation（1, 5, 9, 13）、identified regulation（2, 6, 10, 14）、external regulation（3, 7, 11, 15）、amotivation（4, 8, 12, 16）；此對應依原量表慣例，psytests 頁面本身未標示。Standage, Treasure,
      Duda & Prusak（2003, J Sport & Exercise Psychology）在體育情境刪 2 題成 14 題版並只得到部分恆等性；挪威、西班牙（12 題版）、葡萄牙、印尼驗證也多建議刪題。改編時「this activity」換成具體活動。
  - name: Perceived Enjoyment（內在動機）／Perceived Usefulness（外在動機）
    source: Davis, F. D., Bagozzi, R. P., & Warshaw, P. R.（1992）。Extrinsic and intrinsic motivation to use computers in the workplace。Journal of Applied Social Psychology，22(14)，1111–1132
    url: https://www.scirp.org/reference/referencespapers?referenceid=2021926
    definition: 知覺享樂（perceived enjoyment）＝使用電腦系統這項活動本身被知覺為令人愉快的程度，與工具價值無關（the extent to which the activity of using a computer system is perceived to be personally enjoyable in its own right aside from
      the instrumental value of the technology）；知覺有用性＝外在動機。
    items: []
    scale: 7-point Likert（依 TAM 系列慣例；本次未從原文核對）
    reliability: 原文信度未在打開的來源取得
    context: 職場電腦使用：Study 1 文書處理軟體、Study 2 商業繪圖程式；有用性對使用意圖 β = .68／.79，享樂 β = .16／.15，兩者合計解釋意圖變異 62%／75%
    notes: 逐字題項未取得（Wiley 原文頁被擋）。定義句引自 Roca & Gagné（2008，Computers in Human Behavior， https://selfdeterminationtheory.org/SDT/documents/2008_RocaGagne_CHP.pdf ）轉述。常見改編版：Turel, Serenko & Giles（2011, MIS Quarterly）附錄以「Using
      eBay.com is enjoyable / pleasurable / fun / exciting / interesting」五題標註出自 Davis et al. 1992（此為搜尋結果摘要，未打開原附錄）。改編時注意：此量表是 TAM 脈絡的「享樂」單一面向，與 SDT 的內在動機概念不同；Venkatesh（2000）把 enjoyment 當成 ease of use 的前因，UTAUT2
      改名 hedonic motivation。
  - name: Work Preference Inventory（WPI）
    source: 'Amabile, T. M., Hill, K. G., Hennessey, B. A., & Tighe, E. M.（1994）。The Work Preference Inventory: Assessing intrinsic and extrinsic motivational orientations。Journal of Personality and Social
      Psychology，66(5)，950–967'
    url: https://people.uncw.edu/caropresoe/edn203/203_Spring_09/Amabile_WPI_&_scoring.doc
    definition: 個人對工作的內在動機取向（因挑戰、好奇、樂趣、自我表達而工作）與外在動機取向（因報酬、評價、他人認可、他人指令而工作）的穩定傾向。
    items:
    - I am not that concerned about what other people think of me.
    - I prefer having someone set clear goals for me in my work.
    - The more difficult the problem, the more I enjoy trying to solve it.
    - I am keenly aware of the goals I have for getting good grades.
    - I want my work to provide me with opportunities for increasing my knowledge and skills.
    - To me, success means doing better than other people.
    - I prefer to figure things out for myself.
    - No matter what the outcome of a project, I am satisfied if I feel I gained a new experience.
    - I enjoy relatively simple, straightforward tasks.
    - I am keenly aware of the GPA goals I have for myself.
    - Curiosity is the driving force behind much of what I do.
    - I'm less concerned with what work I do than what I get for it.
    - I enjoy tackling problems that are completely new to me.
    - I prefer work I know I can do well over work that stretches my abilities.
    - I'm concerned about how other people are going to react to my ideas.
    - I seldom think about grades and awards.
    - I'm more comfortable when I get to set my own goals.
    - I believe there is no point in doing a good job if nobody else knows about it.
    - I am strongly motivated by the grades I can earn.
    - It is important for me to be able to do what I most enjoy.
    - I prefer working on projects with clearly specified procedures.
    - As long as I can do what I enjoy, I'm not that concerned about exactly what grades or awards I can earn.
    - I enjoy doing work that is so absorbing that I forget about everything else.
    - I am strongly motivated by the recognition I can earn from other people.
    - I have to feel that I'm earning something for what I do.
    - I enjoy trying to solve complex problems.
    - It is important for me to have an outlet for self-expression.
    - I want to find out how good I really can be at my work.
    - I want other people to find out how good I really can be at my work.
    - What matters most to me is enjoying what I do.
    scale: 4-point（1 = never or almost never true of me, 4 = always or almost always true of me）
    reliability: 原文 α 未在打開的來源取得
    context: 美國大學生（本份為學生版，題項提到 grades／GPA）；另有工作成人版
    notes: UNCW 課程網頁轉載的是大學生版（college student version）；原文另有成人版把 grades／GPA 改為 salary／promotion 等職場字眼，本次未取得成人版逐字題項。計分：Intrinsic＝3+5+7+8+9(R)+11+13+14(R)+17+20+23+26+27+28+30；Extrinsic＝1(R)+2+4+6+10+12+15+16(R)+18+19+21+22(R)+24+25+29；文件載男女平均分別約
      45 與 39。Intrinsic 下再分 challenge／enjoyment，Extrinsic 下再分 outward／compensation 次量表（依原文；次量表題號本次未核對）。文件中含撇號的題項（12, 15, 17, 22, 25）因文字抽取略去撇號，此處依句意還原「I'm」。
Social Norm:
  zh: 社會規範／主觀規範／社會影響
  scales:
  - name: TPB 主觀規範直接測量（injunctive＋descriptive）
    source: 'Ajzen, I.（2006／無年份）。Constructing a theory of planned behavior questionnaire（依 Fishbein, M., & Ajzen, I.（2010）。Predicting and changing behavior: The reasoned action approach。New York: Psychology
      Press 附錄）'
    url: https://people.umass.edu/aizen/pdf/tpb.measurement.pdf
    definition: 主觀規範＝個人知覺到的社會壓力（perceived social pressure），由規範信念匯集而成；分指令性（important others approve）與描述性（people like me do it）兩面。
    items:
    - Most people who are important to me approve of my exercising for at least 20 minutes, three times per week for the next three months. (agree 1 – 7 disagree)
    - Most people like me exercised for at least 20 minutes, three times per week in the three months following their major surgery (unlikely 1 – 7 likely)
    scale: 7-point bipolar adjective scale（agree–disagree；unlikely–likely）
    reliability: 文件未報 α；要求每構念先用 5–6 題做前測，依內部一致性與區辨效度刪至合適題數
    context: 範例行為：術後病人未來三個月每週運動三次、每次 20 分鐘
    notes: Ajzen 的做法是模板不是固定量表：題項必須與行為準則在目標、行動、情境、時間（TACT）四要素上完全相容，且以第一人稱自述。文件另提供「間接測量」——先以開放式引出規範參照對象（誰會贊成／反對、誰會／不會做），再用「規範信念 × 遵從動機」加總。改編時把「exercising for at least 20 minutes…」整段換成自己的行為定義；不要只留「Most people
      who are important to me think I should…」而漏掉描述性那一面。
  - name: UTAUT Social Influence（SI，4 題）
    source: 'Venkatesh, V., Morris, M. G., Davis, G. B., & Davis, F. D.（2003）。User acceptance of information technology: Toward a unified view。MIS Quarterly，27(3)，425–478'
    url: https://verdi.cs.ucl.ac.uk/constructDB/publications/venkatesh-user-2003.html
    definition: 個人知覺到重要他人認為他／她應該使用新系統的程度（the degree to which an individual perceives that important others believe he or she should use the new system）。
    items:
    - People who influence my behavior think that I should use the system.
    - People who are important to me think that I should use the system.
    - The senior management of this business has been helpful in the use of the system.
    - In general, the organization has supported the use of the system.
    scale: Likert 同意度量尺（原文附錄未標示點數；UTAUT 系列慣用 7 點）
    reliability: ICR = .88（T1）、.94（T2）、.92（T3）（N = 215，縱貫三波）
    context: 四家組織導入新資訊系統的員工，自願與強制使用情境皆有
    notes: 四題分別來自 TAM2／TPB 的 subjective norm（SN1, SN2）與 MPCU 的 social factors（SF2, SF4）；原文 Table 11 另列 image 三題但未納入最終 SI。原文發現 SI 只在強制使用情境、且在使用早期顯著，自願情境不顯著；性別、年齡、經驗、自願性皆調節其效果。題項逐字取自 MIS Quarterly 原文附錄（JSTOR
      版 PDF）；verdi 頁只有書目。改編時把「the system」換成具體系統；後兩題預設組織脈絡，消費者研究常只用前兩題。
  - name: 指令性／描述性規範直接測量（Cialdini 焦點理論取向）
    source: 'Cialdini, R. B., Reno, R. R., & Kallgren, C. A.（1990）。A focus theory of normative conduct: Recycling the concept of norms to reduce littering in public places。Journal of Personality and Social
      Psychology，58(6)，1015–1026；題項模板取自 Warner, L. A., Cantrell, M. S., & Diaz, J. M.（2022）。Social norms for behavior change: A synopsis（AEC745／WC406）。UF/IFAS Extension'
    url: https://edis.ifas.ufl.edu/publication/WC406/pdf
    definition: 指令性規範（injunctive norms）＝他人贊成或反對什麼（what others want us to do or want us to avoid doing）；描述性規範（descriptive norms）＝他人實際做什麼（what others do）。
    items:
    - Most people who are important to me want me to…. (this is a direct measure of injunctive norms)
    - Most people who are like me do…. (this is a direct measure of descriptive norms)
    - Most of my colleagues want me to…. (this is an expectancy-based injunctive normative belief)
    - Most of my family members want me to…. (this is an expectancy-based injunctive normative belief)
    - Most of my colleagues do…. (this is an expectancy-based descriptive normative belief)
    - Most of my family members do…. (this is an expectancy-based descriptive normative belief)
    scale: Likert 同意度（Strongly agree – Strongly disagree；點數由研究者決定）
    reliability: 模板文件未報 α
    context: 環境行為（草坪澆水、節能）推廣；Cialdini 1990 原文為五個亂丟垃圾現場的實驗操弄，不是量表
    notes: Cialdini, Reno & Kallgren 1990（ https://public.websites.umich.edu/~prestos/Consumption/pdfs/Cialdinietal1990.pdf ）只提供概念區分與實驗操弄，沒有自陳量表；文獻中「Cialdini 式」題項多為上述直接測量模板，再依 TACT 原則填入具體行為。Warner et al.
      另列第三種「價值期望」框架：加權「遵從動機」（指令性）或「對參照群體的認同」（描述性）。改編時注意：描述性規範也常改用行為估計（「你認為有多少百分比的人會…」）而非同意度；指令性與描述性兩者可能方向相反，要分開測、分開報。
Job Satisfaction:
  zh: 工作滿意
  scales:
  - name: Minnesota Satisfaction Questionnaire — Short Form（MSQ-SF，20 題）
    source: 'Weiss, D. J., Dawis, R. V., England, G. W., & Lofquist, L. H.（1967）。Manual for the Minnesota Satisfaction Questionnaire。Minnesota Studies in Vocational Rehabilitation，22。Minneapolis: University
      of Minnesota'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12692551/
    definition: 員工對工作各個面向（工作本身、主管、同事、薪酬、升遷、工作條件等）的滿意程度；可分內在滿意、外在滿意與整體滿意。
    items:
    - Being able to keep busy all the time
    - The chance to work alone on the job
    - The chance to do different things from time to time
    - The chance to be “somebody” in the community
    - The way my boss handles his/her workers
    - The competence of my supervisor in making decisions
    - Being able to do things that do not go against my conscience
    - The way my job provides for steady employment
    - The chance to do things for other people
    - The chance to tell people what to do
    - The chance to do something that makes use of my abilities
    - The way company policies are put into practice
    - My pay and the amount of work I do
    - The chances for advancement on this job
    - The freedom to use my own judgment
    - The chance to try my own methods of doing the job
    - The working conditions
    - The way my co-workers get along with each other
    - The praise I get for doing a good job
    - The feeling of accomplishment I get from the job
    scale: 5-point（Very Dissatisfied / Dissatisfied / Neither Satisfied nor Dissatisfied / Satisfied / Very Satisfied；題幹「On my present job, this is how I feel about…」）
    reliability: α = .935（20 題整體；羅馬尼亞私立醫療機構員工，Pîrvu et al. 2026 驗證研究）；該研究引述波蘭研究 .892、希臘裔塞浦路斯研究 .955
    context: 美國職業復健研究；一般員工對現職的滿意
    notes: 題項逐字取自 PMC 文章附錄 Table A1 的英文原題欄（羅馬尼亞語譯文並列）。原手冊將 20 題分為 intrinsic（常見計分為第 1–4、7–11、15、16、20 題）與 extrinsic（5、6、12、13、14、19）兩分量表與 general satisfaction（全 20 題），但本次未打開手冊，分配請以 Vocational Psychology
      Research（University of Minnesota）官方版為準；官方網站 https://vpr.psych.umn.edu/node/26 需授權取得量表。短版是從長版 20 個分量表各取相關最高的一題而成。羅馬尼亞研究 EFA 得到三因素（Task Enrichment、Autonomy Satisfaction、Supervisory Relationships）並建議刪
      8 題，顯示內／外在二分在非美國樣本不一定成立。
  - name: Brayfield–Rothe Index of Job Satisfaction（18 題）
    source: Brayfield, A. H., & Rothe, H. F.（1951）。An index of job satisfaction。Journal of Applied Psychology，35(5)，307–311
    url: https://db.arabpsychology.com/?p=168327
    definition: 員工對工作整體的態度／感受（overall job satisfaction），不分面向。
    items:
    - My job is like a hobby to me.
    - My job is usually interesting enough to keep me from getting bored.
    - It seems that my friends are more interested in their jobs.
    - I consider my job rather unpleasant.
    - I enjoy my work more than my leisure time.
    - I am often bored with my job.
    - I feel fairly well satisfied with my present job.
    - Most of the time I have to force myself to go to work.
    - I am satisfied with my job for the time being.
    - I feel that my job is no more interesting than others I could get.
    - I definitely dislike my work.
    - I feel that I am happier in my work than most other people.
    - Most days I am enthusiastic about my work.
    - Each day of work seems like it will never end.
    - I like my job better than the average worker does.
    - My job is pretty uninteresting.
    - I find real enjoyment in my work.
    - I am disappointed that I ever took this job.
    scale: 5-point Likert（Strongly Agree / Agree / Undecided / Disagree / Strongly Disagree）；總分 18–90
    reliability: 奇偶折半 r = .77，Spearman-Brown 校正後 .87（1951 年原始樣本：231 位女性辦公室員工）
    context: 美國辦公室員工與夜校學生
    notes: 題項取自網路彙整頁（二手整理，原頁另列一題不計分的範例題「There are some conditions concerning my job that could be improved.」）。正向題為第 1, 2, 5, 7, 9, 12, 13, 15, 17 題，其餘 9 題反向計分（依 Hindi 改編版 JSS-18 的計分說明， https://ijip.in/wp-content/uploads/2023/09/18.01.368.20231103.pdf
      ）。原文以 Thurstone 法從 246 題篩選。最常用的縮短版是 Judge et al. 1998 的 5 題版（見下一筆）。
  - name: Brayfield–Rothe 5 題縮短版（Judge et al. 1998）
    source: 'Judge, T. A., Locke, E. A., Durham, C. C., & Kluger, A. N.（1998）。Dispositional effects on job and life satisfaction: The role of core evaluations。Journal of Applied Psychology，83(1)，17–34'
    url: https://www.questionpro.com/a/q/organization-behaviour-3324860
    definition: 整體工作滿意（overall job satisfaction）的情感式自評。
    items:
    - I feel fairly well satisfied with my present job.
    - Most days I am enthusiastic about my work.
    - Each day of work seems like it will never end.
    - I find real enjoyment in my work.
    - I consider my job rather unpleasant.
    scale: 5-point Likert（strongly agree – strongly disagree）；部分研究用 7 點
    reliability: 原文 α 未在打開的來源取得；土耳其驗證研究（N = 253）單因素、α = .929（搜尋結果轉述，未打開原文）
    context: 美國與以色列員工的核心自我評價研究
    notes: 五題逐字沿用 Brayfield & Rothe 1951 原題；第 3 題「Each day of work seems like it will never end」與第 5 題「I consider my job rather unpleasant」反向計分。QuestionPro 範本頁只列前四題且第一題印成「I feel fairly satisfied with my
      present job」，此處依 1951 原題。Judge 的官方量表頁 http://www.timothy-judge.com/JS2.htm 本次被 Cloudflare 擋下未能打開。Thompson & Phua（2012）另提出 4 題 Brief Index of Affective Job Satisfaction（BIAJS），本次未取得題項。
  - name: Michigan Organizational Assessment Questionnaire — Job Satisfaction Subscale（MOAQ-JSS，3 題）
    source: 'Cammann, C., Fichman, M., Jenkins, D., & Klesh, J.（1983）。Assessing the attitudes and perceptions of organizational members。In S. E. Seashore, E. E. Lawler, P. H. Mirvis, & C. Cammann（Eds.），Assessing
      organizational change: A guide to methods, measures, and practices（pp. 71–138）。New York: Wiley'
    url: https://www.qic-wd.org/sites/default/files/Umbrella%20Summary%20-%20Job%20Satisfaction%20111523_1.pdf
    definition: 整體工作滿意（global job satisfaction）。
    items:
    - All in all, I am satisfied with my job
    - In general, I don't like my job
    - In general, I like working here
    scale: 7-point Likert（strongly disagree – strongly agree；依網路彙整頁，本次未打開原書）
    reliability: 各研究 α 介於 .67–.95；Bowling & Hammond（2008）後設分析樣本加權平均內部一致性 .84（以上皆為搜尋結果轉述，未打開原文）
    context: 美國組織變革評估（密西根大學 ISR 品質工作研究計畫，1970 年代中期）
    notes: 題項逐字取自 QIC-WD 的 Job Satisfaction Umbrella Summary（該文件把出處標為 Lawler, Cammann, Nadler & Jenkins 1975 的 MOAQ 進度報告；多數文獻引 Cammann et al. 1983 Table 4-2, p. 84）。第 2 題反向計分。Bowling & Hammond 2008（Journal
      of Vocational Behavior 73, 63–77）的後設分析支持其與工作壓力源、組織知覺等的構念效度。優點是極短，適合放進長問卷；缺點是三題中有一題問「working here」偏組織而非工作本身。Paul Spector 的量表庫頁 https://paulspector.com/assessments/assessment-archive/job-attitudes/michigan-organizational-assessment-questionnaire-moaq/
      提供 docx 原檔。
  - name: Job Descriptive Index（JDI，72 題五面向）
    source: 'Smith, P. C., Kendall, L. M., & Hulin, C. L.（1969）。The measurement of satisfaction in work and retirement: A strategy for the study of attitudes。Chicago: Rand McNally'
    url: https://www.bgsu.edu/arts-and-sciences/psychology/services/job-descriptive-index/measures.html
    definition: 對工作五個面向（工作本身、薪資、升遷機會、主管、同事）的描述式滿意；受訪者不是直接說多滿意，而是勾選形容詞是否描述該面向。
    items:
    - 'Work on Present Job: Fascinating'
    - 'Work on Present Job: Routine'
    - 'Work on Present Job: Satisfying'
    - 'Work on Present Job: Boring'
    - 'Work on Present Job: Good'
    - 'Work on Present Job: Creative'
    - 'Work on Present Job: Respected'
    - 'Work on Present Job: Hot'
    - 'Work on Present Job: Pleasant'
    - 'Work on Present Job: Useful'
    - 'Work on Present Job: Tiresome'
    - 'Work on Present Job: Healthful'
    - 'Work on Present Job: Challenging'
    - 'Work on Present Job: On your feet'
    - 'Work on Present Job: Frustrating'
    - 'Work on Present Job: Simple'
    - 'Work on Present Job: Endless'
    - 'Work on Present Job: Gives a sense of accomplishment'
    - 'Pay: Income adequate for normal expenses'
    - 'Pay: Barely live on income'
    - 'Pay: Bad'
    - 'Pay: Satisfactory profit sharing'
    - 'Pay: Income provides luxuries'
    - 'Pay: Insecure'
    - 'Pay: Less than I deserve'
    - 'Pay: Highly paid'
    - 'Pay: Underpaid'
    - 'Promotion: Good opportunities'
    - 'Promotion: Opportunity somewhat limited'
    - 'Promotion: Promotion on ability'
    - 'Promotion: Dead-end job'
    - 'Promotion: Good chance for promotion'
    - 'Promotion: Unfair promotion'
    - 'Promotion: Infrequent'
    - 'Promotion: Regular promotions'
    - 'Promotion: Fairly good chance'
    - 'Co-workers: Stimulating'
    - 'Co-workers: Slow'
    - 'Co-workers: Ambitious'
    - 'Co-workers: Stupid'
    - 'Co-workers: Responsible'
    - 'Co-workers: Fast'
    - 'Co-workers: Intelligent'
    - 'Co-workers: Easy to make enemies'
    - 'Co-workers: Talk too much'
    - 'Co-workers: Smart'
    - 'Co-workers: Lazy'
    - 'Co-workers: Unpleasant'
    - 'Co-workers: No privacy'
    - 'Co-workers: Narrow interests'
    - 'Co-workers: Loyal'
    - 'Co-workers: Hard to meet'
    - 'Supervision: Asks my advice'
    - 'Supervision: Hard to please'
    - 'Supervision: Impolite'
    - 'Supervision: Praises good work'
    - 'Supervision: Tactful'
    - 'Supervision: Influential'
    - 'Supervision: Up-to-date'
    - 'Supervision: Doesn''t supervise'
    - 'Supervision: Quick tempered'
    - 'Supervision: Tells me where I stand'
    - 'Supervision: Annoying'
    - 'Supervision: Stubborn'
    - 'Supervision: Knows job well'
    - 'Supervision: Bad'
    - 'Supervision: Intelligent'
    - 'Supervision: Leaves me on my own'
    - 'Supervision: Around when needed'
    - 'Supervision: Lazy'
    scale: Adjective checklist：每個形容詞勾 Y（描述）／N（不描述）／?（不確定）；正向詞 Y = 3、? = 1、N = 0，負向詞反向（計分規則依 JDI 手冊，本次未打開手冊）
    reliability: α：work .83–.94、promotion .81–.95、co-workers .82–.96，supervision 兩個研究亦 > .80；pay 在兩個研究低於 .80（Brannick, Kelly & McCarthy 1983，四個愛爾蘭樣本）
    context: 美國一般員工；本次題項來源為 1969 年原版用於愛爾蘭樣本
    notes: '逐字題項取自 Brannick, Kelly & McCarthy（1983）。Measuring job satisfaction: The reliability of the Job Descriptive Index in diverse Irish sample populations。Irish Business and Administrative Research，5(1)，94–（
      https://mural.maynoothuniversity.ie/id/eprint/21045/ ），表內列 work 18、pay 9、promotion 9、co-workers 18、supervision 18，合計 72 題；co-workers 第 2 題與第 15 題在 PDF 文字層缺漏（本次只抽出 16 題，故 co-workers 面向少 2 題）。BGSU JDI
      Research Group 持有版權，1985／1997／2009 年修訂版替換了若干題（例如 work 面向改含 Dull、Awful、Important、Interesting、Uses my abilities），並加上 18 題 Job in General（JIG）整體量表；另有 25 題縮短版 aJDI（每面向 5 題，Stanton et al. 2002）。改編前應向 BGSU
      索取現行版與常模，不要直接用 1969 年詞表。'
Perceived Credibility:
  zh: 知覺可信度／來源可信度
  scales:
  - name: Ohanian Source Credibility Scale（15 組兩極形容詞）
    source: Ohanian, R.（1990）。Construction and validation of a scale to measure celebrity endorsers' perceived expertise, trustworthiness, and attractiveness。Journal of Advertising，19(3)，39–52
    url: https://researchcommons.waikato.ac.nz/server/api/core/bitstreams/b7b47d35-e8c1-4bdc-9382-860385a73c44/content
    definition: 名人代言人被知覺到的三個來源特質：吸引力（attractiveness）、可信賴性（trustworthiness；消費者對來源客觀誠實提供資訊的信心）、專業性（expertise）。
    items:
    - 'Attractiveness: unattractive – attractive'
    - 'Attractiveness: not classy – classy'
    - 'Attractiveness: ugly – beautiful'
    - 'Attractiveness: plain – elegant'
    - 'Attractiveness: not sexy – sexy'
    - 'Trustworthiness: not dependable – dependable'
    - 'Trustworthiness: dishonest – honest'
    - 'Trustworthiness: unreliable – reliable'
    - 'Trustworthiness: insincere – sincere'
    - 'Trustworthiness: untrustworthy – trustworthy'
    - 'Expertise: not an expert – expert'
    - 'Expertise: inexperienced – experienced'
    - 'Expertise: unknowledgeable – knowledgeable'
    - 'Expertise: unqualified – qualified'
    - 'Expertise: unskilled – skilled'
    scale: 7-point semantic differential（每個面向 5 組）
    reliability: 原文 α 未在打開的來源取得（網路轉述 expertise .885）。紐西蘭運動員代言複驗（Waikato 論文，四位名人各一樣本）：attractiveness .89–.93、trustworthiness .96–.98、expertise .93–.97；Clow, James & Stanley 2008（Marketing Management Journal
      18(2)，大學生 N = 560，信用卡廣告）用 5／5／4 題子集：expertise .872、trustworthiness .829、attractiveness .849
    context: 美國消費者對名人代言人的評價（原文以多個樣本建構）
    notes: 三個面向分開計分，不合成單一總分。常見改編：刪除 attractiveness（企業或媒體來源研究常只用 expertise＋trustworthiness）；Clow et al. 2008 把 attractiveness 減為 4 組（去掉 classy）並另加 similarity、liking；印度驗證研究刪 2 題後才達收斂／區辨效度；香港研究擴成 attractiveness、trustworthiness、expertise、familiarity、likability
      五因素。Ohanian 1991 後續發現只有 expertise 顯著預測購買意圖。
  - name: Source Credibility Measure（McCroskey & Teven 1999，18 題三面向）
    source: 'McCroskey, J. C., & Teven, J. J.（1999）。Goodwill: A reexamination of the construct and its measurement。Communication Monographs，66(1)，90–103'
    url: https://www.jamescmccroskey.com/measures/source_credibility.htm
    definition: 來源可信度（ethos）的三個面向：能力（competence）、善意／關懷（goodwill／caring）、可信賴性（trustworthiness）。
    items:
    - Intelligent – Unintelligent
    - Untrained – Trained
    - Cares about me – Doesn't care about me
    - Honest – Dishonest
    - Has my interests at heart – Doesn't have my interests at heart
    - Untrustworthy – Trustworthy
    - Inexpert – Expert
    - Self-centered – Not self-centered
    - Concerned with me – Not concerned with me
    - Honorable – Dishonorable
    - Informed – Uninformed
    - Moral – Immoral
    - Incompetent – Competent
    - Unethical – Ethical
    - Insensitive – Sensitive
    - Bright – Stupid
    - Phony – Genuine
    - Not understanding – Understanding
    scale: 7-point semantic differential（1 與 7 = 非常強烈、2 與 6 = 強烈、3 與 5 = 稍弱、4 = 未定）
    reliability: α 通常 .80–.94（官方量表頁）
    context: 官方範例指示語為評量自己的主管（manager／most recent supervisor）；原文用於一般人際與公眾人物來源
    notes: 計分：Competence＝1, 2, 7, 11, 13, 16；Caring/Goodwill＝3, 5, 8, 9, 15, 18；Trustworthiness＝4, 6, 10, 12, 14, 17；反向題為 1, 3, 4, 5, 8, 9, 10, 11, 12, 16（官方頁以粗體標示，但粗體與形容詞左右排列看來不一致，使用前請對照原文）。三個面向分別計算，不要加總；因面向相關高，官方建議不要用逐步迴歸。常見改編：教師可信度研究（Teacher
      Credibility Scale）沿用同 18 題；網路來源研究常只取 competence 與 trustworthiness 12 題。
  - name: Meyer 新聞可信度指標（Credibility Index，5 題）
    source: 'Meyer, P.（1988）。Defining and measuring credibility of newspapers: Developing an index。Journalism Quarterly，65(3)，567–574'
    url: https://aejmc.us/wp-content/uploads/sites/29/2012/09/Journalism-Quarterly-1986-Gaziano-451-62.pdf
    definition: 新聞媒體（報紙）的可信度／可相信性（believability），由公平、無偏、完整、正確、可信賴五個面向構成。
    items:
    - Is fair or unfair
    - Is biased or unbiased
    - Tells the whole story or doesn't tell the whole story
    - Is accurate or inaccurate
    - Can or cannot be trusted
    scale: 兩極語意差異式題（原文點數未在打開的來源確認；後續研究多用 5 點或 7 點）
    reliability: 原文 α 未在打開的來源取得；後續應用：McComas & Trumbo（2001, Risk Analysis 21(3)）報告跨多次應用皆穩定可靠；2023 年一項研究 α = .85 並稱與 Meyer 原始結果相近（搜尋結果轉述，未打開原文）
    context: 美國報紙讀者對當地日報的評價
    notes: 五題逐字取自 Gaziano & McGrath（1986）。Measuring the concept of credibility。Journalism Quarterly，63(3)，451–462 的 Table 1（12 題可信度因素），Meyer 1988 即從中挑出這五題組成指標；West（1994, JMCQ）以共變結構模型確認此五題為有效可靠的媒體可信度測量（Hanimann
      et al. 2023 IJOC 回顧， https://ijoc.org/index.php/ijoc/article/download/18815/3992 ）。Meyer 原文另主張 believability 與 community affiliation 兩個面向。改編時注意：此量表測的是「媒體／管道」可信度，不是單則訊息；1951–2018 年文獻回顧指出 accurate、believable、credible、fair、trustworthy
      五詞同時出現在訊息、媒體、來源三類量表，導致構念邊界模糊。
  - name: Message Credibility Scale（Appelman & Sundar 2016，3 題）
    source: 'Appelman, A., & Sundar, S. S.（2016）。Measuring message credibility: Construction and validation of an exclusive scale。Journalism & Mass Communication Quarterly，93(1)，59–79'
    url: https://pure.psu.edu/en/publications/measuring-message-credibility-construction-and-validation-of-an-e/
    definition: 個人對傳播內容真實性的判斷（an individual's judgment of the veracity of the content of communication），與來源可信度、媒體可信度區分。
    items:
    - accurate
    - authentic
    - believable
    scale: 請受訪者評定每個形容詞「描述該內容的程度」（rate how well the adjectives describe the content）；後續研究多用 7 點
    reliability: 原文 α／CR 未在打開的來源取得（Sage 與 ScienceDirect 頁面被擋）
    context: 美國成人閱讀新聞訊息（線上實驗）
    notes: 原文以 CFA 從較多候選形容詞（含 complete、concise、consistent、well-presented、objective、representative、no spin、expert、will have impact、professional 等）中收斂為三題；Huschens et al.（2023，arXiv 2309.02524）轉述原文共提出 10 個指標但建議以三形容詞為核心。改編時注意：三題是形容詞評定不是陳述句，題幹要寫清楚評的是「這則內容」；若同時測來源可信度，建議搭配
      McCroskey & Teven 或 Ohanian，不要把 trustworthy 混進訊息題。2022 年 COVID-19 社群媒體研究（Frontiers in Psychology 13:940903）用改編版時 α 僅 .44，顯示在青少年與短訊息情境可能不穩。
PU Perceived Usefulness:
  zh: 知覺有用性
  scales:
  - name: Davis (1989) Perceived Usefulness 六題原版（TAM）
    source: Davis, F. D.（1989）。Perceived usefulness, perceived ease of use, and user acceptance of information technology。MIS Quarterly，13(3)，319–340。doi:10.2307/249008
    url: https://measuringu.com/?p=536
    definition: 個人相信使用某一系統會提升其工作績效的程度
    items:
    - Using [this product] in my job would enable me to accomplish tasks more quickly.
    - Using [this product] would improve my job performance.
    - Using [this product] in my job would increase my productivity.
    - Using [this product] would enhance my effectiveness on the job.
    - Using [this product] would make it easier to do my job.
    - I would find [this product] useful in my job.
    scale: 7-point；Study 1 用 agree/disagree Likert，Study 2 用 likelihood（extremely likely – extremely unlikely，各點皆有標籤）
    reliability: α = .98（usefulness）、.94（ease of use）；兩個研究合計 152 位使用者、四套應用程式（摘要所報）
    context: 組織內員工與 MBA 學生評估辦公室軟體（電子郵件、文書編輯、繪圖等）；題項中的 [this product] 原文為受測系統名稱（如 CHART-MASTER）
    notes: measuringu.com 整理頁標註第 2、3、4、6 題是後續 TAM 延伸（TAM2／TAM3）沿用的四題；反向題在 Study 1 因降低信度被刪除。改編時把 [this product] 換成系統名稱、把 my job 換成情境（如 my studies、my daily life）即可，PMC 等改編版多依此做法。摘要出處另見 https://verdi.cs.ucl.ac.uk/constructDB/publications/davis-perceived-1989.html
  - name: TAM2 Perceived Usefulness 四題版（Venkatesh & Davis 2000）
    source: 'Venkatesh, V., & Davis, F. D.（2000）。A theoretical extension of the technology acceptance model: Four longitudinal field studies。Management Science，46(2)，186–204。doi:10.1287/mnsc.46.2.186.11926'
    url: https://measuringu.com/?p=536
    definition: 個人相信使用某一系統會提升其工作績效的程度（沿用 Davis 1989 定義）
    items:
    - Using [this product] would improve my job performance.
    - Using [this product] in my job would increase my productivity.
    - Using [this product] would enhance my effectiveness on the job.
    - I would find [this product] useful in my job.
    scale: 7-point Likert（strongly disagree – strongly agree）
    reliability: 原文信度未能從開放來源核對
    context: 四個組織、四套系統（N = 156）的縱貫田野研究，含自願與強制使用情境，三個時點施測
    notes: 此處題項是 measuringu 頁面標註「後續 TAM 延伸沿用」的 Davis 四題原文；TAM2 附錄實際用現在式措辭（Using the system improves my performance in my job 等），本次無法從可開啟的來源逐字核對，引用時請以原文附錄為準。Springer 補充檔（https://media.springernature.com/original/springer-static/esm/art%3A10.1007%2Fs12525-022-00593-5/MediaObjects/12525_2022_593_MOESM1_ESM.pdf）將
      Using the system in my job would increase my productivity 歸於 Moore & Benbasat (1991) 的 relative advantage、再由 Venkatesh et al. (2003) 收入。常見縮短版就是這四題，後續 UTAUT 又改成下列四題。
  - name: UTAUT Performance Expectancy 四題（Venkatesh et al. 2003）
    source: 'Venkatesh, V., Morris, M. G., Davis, G. B., & Davis, F. D.（2003）。User acceptance of information technology: Toward a unified view。MIS Quarterly，27(3)，425–478。doi:10.2307/30036540'
    url: https://media.springernature.com/original/springer-static/esm/art%3A10.1007%2Fs12525-022-00593-5/MediaObjects/12525_2022_593_MOESM1_ESM.pdf
    definition: 個人相信使用系統有助於其獲得工作績效增益的程度
    items:
    - I would find the system useful in my job.
    - Using the system enables me to accomplish tasks more quickly.
    - Using the system increases my productivity.
    - If I use the system, I will increase my chances of getting a raise.
    scale: 7-point Likert（strongly disagree – strongly agree）
    reliability: Kaphzan 等（2022，Frontiers in Psychiatry，以色列精神科醫師對遠距精神醫療）五點版 α = .858；Revisiting UTAUT for the Age of AI（arXiv 2510.15142，改成 AI 版）α = .81
    context: 四個組織導入新系統的員工（縱貫）；PE 題項整合自 Davis 的 PU、Moore & Benbasat 的 relative advantage、Compeau & Higgins 的 outcome expectations
    notes: 四題分別來自 PU（useful in my job）、relative advantage（accomplish tasks more quickly）、job-fit／PU（increase my productivity）與 outcome expectations（getting a raise）。第 4 題「加薪」在學生、自願使用或非職場情境常被刪掉或改寫（如 improve
      my grades），改編時注意。Europe PMC 全文可見題項與 α：https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8977602/fullTextXML ；AI 改編版見 https://arxiv.org/pdf/2510.15142 附錄。
Perceived Value:
  zh: 知覺價值
  scales:
  - name: Dodds, Monroe & Grewal (1991) Perceived Value（價格—品質—價值模型）
    source: Dodds, W. B., Monroe, K. B., & Grewal, D.（1991）。Effects of price, brand, and store information on buyers' product evaluations。Journal of Marketing Research，28(3)，307–319。doi:10.2307/3172866
    url: https://vtechworks.lib.vt.edu/handle/10919/54284
    definition: 消費者在所示價格下，對產品「付出與所得」的整體權衡判斷（value for the money）
    items:
    - 'This [product] is a: (very good value for the money – very poor value for the money)'
    - 'At the price shown this [product] is: (very economical – very uneconomical)'
    - I would consider this [product] to be a good buy. (strongly agree – strongly disagree)
    - 'The price shown for this [product] is: (very acceptable – very unacceptable)'
    - This [product] appears to be a bargain. (strongly agree – strongly disagree)
    scale: 7-point 語意差異法與 Likert 混用（各題兩端錨定如上）
    reliability: Dodds 1985 博士論文（同一套工具）報多題指標 Cronbach's α 介於 .892–.958；後續引用研究常報 value 三題版 α ≈ .85
    context: 5（價格）×3（品牌）×3（商店）受試者間實驗，學生樣本，刺激物為商務用口袋計算機與 SONY Walkman 隨身聽，價格以標示牌呈現
    notes: '題項逐字取自 Dodds (1985) Virginia Tech 博士論文第 198 頁 Table 41（1991 JMR 文章即由此論文發展，題項相同；[product] 原文為 Business Use Pocket Calculator 或 SONY WALKMAN FM stereo cassette headset player）。同一表另有 willingness
      to buy 題（The likelihood that I would purchase this … is: very high – very low；If I were going to buy a …, I would consider buying this model at the price shown；At the price shown, I would consider
      buying the …）。常見縮短版只取前三題（value for the money、economical、good buy）。博士論文 PDF：https://vtechworks.lib.vt.edu/bitstreams/5cd86f45-801f-494c-9db8-c314ee5b0500/download'
  - name: PERVAL（Sweeney & Soutar 2001）
    source: 'Sweeney, J. C., & Soutar, G. N.（2001）。Consumer perceived value: The development of a multiple item scale。Journal of Retailing，77(2)，203–220。doi:10.1016/S0022-4359(01)00041-0'
    url: https://eprints.lancs.ac.uk/id/eprint/55470
    definition: 消費者對耐久財的多面向價值知覺，分為品質／績效、情感、價格／金錢價值、社會四個構面
    items: []
    scale: 7-point Likert（strongly disagree – strongly agree）
    reliability: 原文各構面信度未能從開放來源核對
    context: 澳洲零售消費者評估耐久財（電器等），19 題四構面
    notes: 本次只找到結構資訊：原版 19 題、四構面（quality、emotional、price/value for money、social）；Walsh, Shiu & Hassan（2014，Journal of Business Research，67(3)，260–267）以原始資料發展 12 題與 8 題短版，Walsh, Kilian & Buxel（2007，Advances
      in Consumer Research，35，688–689）在德國複製並提 12 題版。逐字題項未在任何可開啟的開放來源中取得（ScienceDirect、ResearchGate、PMC 皆被擋），引用前請從 Journal of Retailing 原文附錄或 Walsh et al. (2014) 附錄抄錄。注意與 Petrick (2002) 的 SERV-PERVAL（服務版，含
      is reasonably priced、has outstanding quality 等）是不同工具，不要混用。
  - name: Sirdeshmukh, Singh & Sabol (2002) 關係交換中的 Value 四題
    source: Sirdeshmukh, D., Singh, J., & Sabol, B.（2002）。Consumer trust, value, and loyalty in relational exchanges。Journal of Marketing，66(1)，15–37。doi:10.1509/jmkg.66.1.15.18449
    url: https://www.msi.org/wp-content/uploads/2020/06/MSI_Report_01-116.pdf
    definition: 消費者對維持與服務提供者持續關係之「利益減去成本」的知覺（沿用 Zeithaml 1988）
    items:
    - 'For the prices you pay for clothing items at this store, would you say shopping at this store is a: (Very poor deal – Very good deal)'
    - 'For the time you spent in order to shop at this store, would you say shopping at this store is: (Highly unreasonable – Highly reasonable)'
    - 'For the effort involved in shopping at this store, would you say shopping at this store is: (Not at all worthwhile – Very worthwhile)'
    - How you would rate your overall shopping experience at this store? (Extremely poor value – Extremely good value)
    scale: 10-point 語意差異法
    reliability: α = .92（零售與航空兩個情境皆為 .92）
    context: 零售（常去的百貨公司購買主要服飾，N = 246）與航空（常搭航空公司的非商務旅行，N = 113）兩個關係型服務情境的郵寄問卷
    notes: 題項逐字取自 MSI Working Paper 01-116（2001）附錄 1（零售版）；附錄 2 航空版把 clothing items at this store 換成 traveling with this airline、shopping 換成 travelling。作者說明題項改編自 Grisaffe & Kumar (1998) 與 Dodds et al. (1991)，四題分別對應價格、時間、心力三種犧牲與整體價值。改編時保留「付出面（價格／時間／心力）＋整體」四題結構即可，10
      點量尺可改 7 點。
Decision Accuracy:
  zh: 決策正確性
  scales:
  - name: Cognitive Fit 任務表現操作化：決策正確率與決策時間（Vessey 1991）
    source: 'Vessey, I.（1991）。Cognitive fit: A theory-based analysis of the graphs versus tables literature。Decision Sciences，22(2)，219–240；Vessey, I., & Galletta, D.（1991）。Cognitive fit: An empirical study
      of information acquisition。Information Systems Research，2(1)，63–84。doi:10.1287/isre.2.1.63'
    url: https://arxiv.org/pdf/2204.11405
    definition: 問題解決表現以決策輸出的正確性（accuracy）與速度（time）衡量；任務與資訊呈現方式契合時兩者皆較佳
    items:
    - 客觀指標 1：Accuracy —— 受試者在每一題（spatial 或 symbolic 任務，如從圖或表讀出某月存款／提款金額、比較趨勢）的答案是否與正確答案相符，計正確題數或正確率
    - 客觀指標 2：Time —— 從呈現刺激到作答完成的秒數（反應時間）
    - 當代同型操作化（Faas et al. 2024, arXiv 2410.07728，人機協作無人機交接任務）：Decision accuracy was calculated for each participant as the percentage of selected actions that led to a successful outcome（未作答計為錯誤）；Decision
      time was measured as the time after participants saw the available actions until they chose a specific action.
    scale: 客觀指標：正確率（0–100%）與秒數；非自陳量尺
    reliability: 不適用（客觀行為指標）
    context: 實驗室實驗，受試者看圖或表回答資訊擷取題；Samuel 等（2022，Int. J. Information Management，65，102505）回顧指出 cognitive fit 研究一貫以 accuracy and speed of decision output 為依變項
    notes: Vessey 原文全文（Decision Sciences／ISR）未能從開放來源開啟，操作化描述取自 Samuel 等（2022）的回顧與 Faas 等（2024）的當代實作。改編要點：每題要有唯一正解才能算 accuracy；time 通常取對數或與 accuracy 合併成效率指標；多數研究報兩者分開的結果，因為 fit 對 accuracy 與 time 的效果不一定同向。
  - name: Häubl & Trifts (2000) 線上購物決策品質（客觀＋主觀）
    source: 'Häubl, G., & Trifts, V.（2000）。Consumer decision making in online shopping environments: The effects of interactive decision aids。Marketing Science，19(1)，4–21。doi:10.1287/mksc.19.1.4.15178'
    url: https://thesis.eur.nl/pub/9836/Peeters%20Rob%20J.Y.%20%28266481%29.pdf
    definition: 以消費者是否選到（或考慮到）非被支配（non-dominated）方案、事後是否換選，以及對決定的信心，衡量購買決策品質
    items:
    - 客觀指標 1：考慮集合中非被支配方案的比例（share of non-dominated alternatives in the consideration set）；被支配＝至少有另一方案在所有屬性上都不比它差且至少一項更好
    - 客觀指標 2：最終選擇是否為非被支配方案（0/1）
    - 客觀指標 3：事後換選（switching）—— 完成購買決定後給予換選機會，是否改選另一方案（0 = No，1 = Yes）；換選視為初始決策品質不佳
    - 主觀指標：對購買決定的信心（confidence in the purchase decision），單題 7-point Likert（1 = strongly disagree，7 = strongly agree）
    scale: 客觀指標為比例／二元；主觀信心題為 7-point Likert
    reliability: 不適用（單題與客觀指標）
    context: 模擬線上商店的實驗，操弄推薦代理人（RA）與比較矩陣（CM）；Peeters（2011，Erasmus 碩士論文）沿用同一組指標（TV 與筆電兩類產品，confidence 與 switch）
    notes: 原文全文未能開啟，指標說明取自 Peeters (2011) 第 4.2 節與第 5 章對 Häubl & Trifts 的整理。使用非被支配法必須在刺激物中刻意混入已知被支配與非被支配方案；若方案屬性無法客觀排序，改用換選率或信心。Aksoy 等（2011）指出主觀信心是客觀品質的弱代理，兩者最好並列報告。
  - name: Aksoy, Cooil & Lurie (2011) 決策品質指標分類（preference-dependent／preference-independent／subjective）
    source: Aksoy, L., Cooil, B., & Lurie, N. H.（2011）。Decision quality measures in recommendation agents research。Journal of Interactive Marketing，25(2)，110–122。doi:10.1016/j.intmar.2011.01.001
    url: https://ideas.repec.org/a/eee/joinma/v25y2011i2p110-122.html
    definition: 決策品質＝所選方案相對於受試者偏好或客觀屬性的優劣，分成依偏好（preference-dependent）、不依偏好（preference-independent）與主觀三類指標
    items:
    - Preference-dependent：所選方案的相對效用（relative utility，依受試者事前陳述的屬性權重計算所選方案效用，與可得最佳方案效用相比）
    - Preference-independent：所選方案各屬性值加總（sum of the chosen alternative's attribute values），或是否為非被支配方案
    - Subjective：受試者自陳的決策品質／信心／滿意
    scale: 客觀指標為連續值；主觀指標為 Likert 自陳
    reliability: 摘要指出 relative utility 與屬性值加總兩個客觀指標解釋客觀決策品質的大部分變異；主觀指標是客觀指標的弱代理但有增量資訊
    context: 模擬各種推薦代理人的實驗資料
    notes: 全文未開啟，分類與結論取自摘要頁。做公開查詢頁時可用此三分法當「決策正確性」的操作化地圖：有正解的任務用符合率（Vessey 類）、有偏好的選擇任務用 relative utility、再加一條主觀信心題。本次沒有找到經驗證的多題「perceived decision quality」自陳量表（Niese 等 2026 CAIS 與 Vaezi 2019 博士論文有此構念，但 PDF
      被擋，題項未能取得）。
Environmental Uncertainty:
  zh: 環境不確定性
  scales:
  - name: Jaworski & Kohli (1993) Market Turbulence／Technological Turbulence（Mwiru 2017 改編版）
    source: 'Jaworski, B. J., & Kohli, A. K.（1993）。Market orientation: Antecedents and consequences。Journal of Marketing，57(3)，53–70。doi:10.2307/1251854'
    url: https://journals.udsm.ac.tz/index.php/bmr/article/view/1054/980
    definition: 市場動盪＝顧客組成與偏好的變動速度；技術動盪＝產業技術變動的速度
    items:
    - 'Technological turbulence: Technological changes provide opportunities in our industry'
    - 'Technological turbulence: It is difficult to forecast technology in the next two years'
    - 'Technological turbulence: Many new product ideas result from technology breakthrough'
    - 'Technological turbulence: Technological development in our industry are rather minor'
    - 'Market turbulence: New customers tend to have new needs'
    - 'Market turbulence: New customers tend to look for the new products all the time'
    scale: 原文 7-point Likert（1 = strongly disagree，7 = strongly agree）；Mwiru (2017) 改編版為 agree/disagree Likert
    reliability: Mwiru（2017，Business Management Review，坦尚尼亞 178 家服務業）所有量表 α > .80；原文各量表 α 未能從開放來源核對
    context: 美國企業策略事業單位的郵寄問卷（兩組樣本），作為市場導向—績效關係的調節變項；此處題項取自坦尚尼亞服務業（旅館、旅行社、保險）改編版
    notes: 本次只找到改編版題項（技術動盪 4 題、市場動盪 2 題），且 Mwiru 的表格可能未列全市場動盪題；原文附錄（市場動盪與技術動盪各約 4–6 題，含 customers' product preferences change quite a bit over time、the technology in our industry is changing rapidly 等常見引用句）未能從
      JSTOR 以外的來源開啟，逐字引用請回原文。Technological development … are rather minor 為反向題。原文另有 competitive intensity 子量表。
  - name: Miller & Friesen (1982) Environmental Dynamism 五題（Miller & Dröge 1986 所用 Khandwalla 系統）
    source: 'Miller, D., & Friesen, P. H.（1982）。Innovation in conservative and entrepreneurial firms: Two models of strategic momentum。Strategic Management Journal，3(1)，1–25；Miller, D., & Dröge, C.（1986）。Psychological
      and traditional determinants of structure。Administrative Science Quarterly，31(4)，539–560。doi:10.2307/2392963'
    url: https://cejsh.icm.edu.pl/cejsh/element/bwmeta1.element.baztech-327f7dec-e9ef-4baf-b657-5b1f16ff9c82/c/Kwiotkowska_dynamish_org_kwart_3_2018.pdf
    definition: 環境動態性＝顧客與競爭者行為的不可預測性、市場趨勢與產業創新的變動速度（Miller 1987）
    items:
    - Changes in marketing practices are frequent.
    - The ageing rate of products/services is very fast.
    - Competitors' behaviour is unpredictable.
    - The supply of products/services and customers' behaviour are unpredictable.
    - The pace of changes in the production/service provision technology is very fast
    scale: 7-point（1 = I definitely do not agree … 7 = I definitely agree）；Miller 原版為 7-point 對偶陳述語意差異法
    reliability: 原文信度未能從開放來源核對
    context: Miller & Dröge (1986) 以加拿大魁北克中小企業 CEO 問卷，將不確定性（dynamism／heterogeneity／hostility）作為結構的傳統決定因素；此處題項取自 Kwiotkowska（2018，Organization and Management Quarterly，波蘭企業）
    notes: Miller & Dröge (1986) 原文未列題項於開放來源；其 uncertainty 量表承襲 Khandwalla (1977) 與 Miller & Friesen (1982) 的 dynamism 題組。此處五題是 Kwiotkowska 由波蘭文問卷回譯的英文，非 Miller & Friesen 原句（原句常被引為 Our firm must rarely
      change its marketing practices to keep up with the market and competitors … 等對偶陳述，本次未能核對）。Kwiotkowska 同表另有 hostility（Khandwalla 1 題＋Miller & Friesen 2 題）與 complexity（Miller 1987 1 題）。引用時標明為改編版。
  - name: Dess & Beard (1984) 環境面向的檔案指標：Dynamism／Munificence／Complexity
    source: Dess, G. G., & Beard, D. W.（1984）。Dimensions of organizational task environments。Administrative Science Quarterly，29(1)，52–73。doi:10.2307/2393080
    url: https://www.redalyc.org/pdf/3372/337228638003.pdf
    definition: 任務環境以產業層級的客觀統計描述：動態性（不穩定）、豐饒度（成長）、複雜度（集中）
    items:
    - Dynamism（instability）：產業出貨值（value of shipments）、價格—成本邊際、總就業人數、附加價值等序列的離散程度——標準差（或原文：以時間為自變項迴歸該序列後，迴歸斜率的標準誤）除以該序列平均值
    - Munificence（growth）：同一組序列對時間迴歸的斜率係數除以序列平均值；另加事業單位數的年均成長率
    - Complexity（concentration）：產業銷售、附加價值、就業人數、事業單位數在各人口普查分區的地理集中度（各分區值平方和除以總值平方）
    scale: 客觀指標（產業層級；以美國製造業普查資料計算，通常取 5 年窗）
    reliability: 不適用；Porto 等（2008，BASE Revista de Administração e Contabilidade da Unisinos）以 1997–2002 美國 466 個製造業部門複製，因素結構獲得支持
    context: 美國製造業四位數 SIC 產業，1968–1977 普查資料
    notes: 操作化清單取自 Porto, Brito, Silva & Bataglia 的複製研究 Quadro 1（Adaptado de Dess e Beard 1984）；該表的 dynamism 用「標準差／平均」，Dess & Beard 原文與 Keats & Hitt、Misangyi 等的慣用做法是「對時間迴歸的斜率標準誤／平均」（去趨勢後的波動），兩者不同，引用時要說明用哪一種。Sharfman
      & Dean (1991) 批評此法遺漏若干理論面向並提出修訂指標。
  - name: Duncan (1972) Perceived Environmental Uncertainty（simple–complex × static–dynamic）
    source: Duncan, R. B.（1972）。Characteristics of organizational environments and perceived environmental uncertainty。Administrative Science Quarterly，17(3)，313–327。doi:10.2307/2392145
    url: https://www.emerald.com/insight/content/doi/10.1108/00251740210441090/full/html
    definition: 決策單位對環境因素資訊不足、不知決策後果、無法對環境影響賦予機率的知覺；環境以簡單—複雜（因素數量）與靜態—動態（因素變動）兩軸描述
    items: []
    scale: Likert 式題項；第一與第二個不確定性面向各六題（二手文獻描述），例題為「how often do you believe that the information you have about this factor is adequate for decision making?」
    reliability: 多篇回顧指出 Duncan (1972) 與 Lawrence & Lorsch (1967) 量表信度不足；Gerloff 等（1991，Journal of Management，118 位專案經理）以 Duncan 工具得到對應 Milliken 狀態／效果／反應不確定性的三因素
    context: 美國製造與研發組織的 22 個決策單位，對五個外部（顧客、供應商、競爭者、社會政治、技術）與三個內部環境成分評估
    notes: 原文題項未能從開放來源取得（ASQ 全文與 Dulz 1976 密西根州立大學博士論文附錄皆被擋）；emerald 的回顧文章只描述兩軸與成分，rasch.org 的 Yanes-Estévez 等（2006）則用 Duncan 架構以 Rasch 模型重估。改編時多數後續研究改用 Miller (1993) 的 PEU 或 Milliken 三類不確定性，而非 Duncan 原題。
Persistence:
  zh: 堅持
  scales:
  - name: Grit Scale（Grit-O）Perseverance of Effort 子量表（Duckworth et al. 2007）
    source: 'Duckworth, A. L., Peterson, C., Matthews, M. D., & Kelly, D. R.（2007）。Grit: Perseverance and passion for long-term goals。Journal of Personality and Social Psychology，92(6)，1087–1101。doi:10.1037/0022-3514.92.6.1087'
    url: https://www.gwern.net/doc/psychology/personality/conscientiousness/2007-duckworth.pdf
    definition: 恆毅力＝對長期目標的堅持與熱情；perseverance of effort 子向度指面對逆境仍持續努力、把事情做完的傾向
    items:
    - I have achieved a goal that took years of work.
    - I have overcome setbacks to conquer an important challenge.
    - I finish whatever I begin.
    - Setbacks don't discourage me.
    - I am a hard worker.
    - I am diligent.
    scale: 5-point（1 = not at all like me，5 = very much like me）
    reliability: Study 1（1,545 位 25 歲以上成人）：總量表 α = .85，Consistency of Interests α = .84，Perseverance of Effort α = .78；Study 2 總量表 α = .79
    context: 成人網路樣本、常春藤大學生、西點軍校學員、全國拼字比賽選手等六個研究
    notes: Grit-O 共 12 題，另一子向度 Consistency of Interests 六題皆反向計分：I often set a goal but later choose to pursue a different one／New ideas and new projects sometimes distract me from previous ones／I become
      interested in new pursuits every few months／My interests change from year to year／I have been obsessed with a certain idea or project for a short time but later lost interest／I have difficulty maintaining
      my focus on projects that take more than a few months to complete。量表受 APA 版權保護。原文作者以總分為主要指標，但後設分析（Credé et al. 2017）顯示 perseverance of effort 的預測力高於 consistency，單獨用 PE 子量表測「堅持」是常見做法。Grit-S 刪掉 I have
      achieved a goal that took years of work 與 I have overcome setbacks to conquer an important challenge 兩題。
  - name: Short Grit Scale（Grit-S）Perseverance of Effort 四題（Duckworth & Quinn 2009）
    source: Duckworth, A. L., & Quinn, P. D.（2009）。Development and validation of the Short Grit Scale (Grit-S)。Journal of Personality Assessment，91(2)，166–174。doi:10.1080/00223890802634290
    url: https://www.testable.org/scale/grit-s-short-grit-scale
    definition: 同 Grit-O；八題短版，兩子向度各四題
    items:
    - Setbacks don't discourage me
    - I am a hard worker
    - I finish whatever I begin
    - I am diligent
    scale: 5-point（1 = Not like me at all，2 = Not much like me，3 = Somewhat like me，4 = Mostly like me，5 = Very much like me）
    reliability: 總分 α = .73–.83（發展樣本）；Perseverance of Effort α = .60–.78，Consistency of Interest α = .73–.79；Credé 等（2017）後設分析 46 個樣本平均 α 總分 .79、PE .71、CI .74；青少年一年再測 r = .68
    context: 成人與青少年多樣本（含西點軍校、拼字比賽）
    notes: Consistency of Interest 四題（反向）：New ideas and projects sometimes distract me from previous ones／I have been obsessed with a certain idea or project for a short time but later lost interest／I often
      set a goal but later choose to pursue a different one／I have difficulty maintaining my focus on projects that take more than a few months to complete。計分：反向題以 6 減原分，各子向度取平均。無公開常模切點。edutechwiki 另列兩版對照：https://edutechwiki.unige.ch/en/Grit
  - name: Multidimensional Persistence Scale（MPS；Howard & Crayne 2019）
    source: 'Howard, M. C., & Crayne, M. P.（2019）。Persistence: Defining the multidimensional construct and creating a measure。Personality and Individual Differences，139，77–89。doi:10.1016/j.paid.2018.11.005'
    url: https://aquila.usm.edu/fac_pubs/17860
    definition: 堅持＝為達成目標而忍受困難的傾向，分為 persistence despite difficulty（PDD）、persistence despite fear（PDF）與 inappropriate persistence（IP，為無價值目標仍持續）三向度
    items:
    - PDD（例題）：Even if something is hard, I will keep trying at it.
    - PDF（例題）：If something is scary, I will do it anyways.
    - IP（例題）：I will keep trying at something, even if I know my actions are worthless.
    scale: 5-point Likert（土耳其版：1 = Kesinlikle Katılmıyorum／strongly disagree，5 = Kesinlikle Katılıyorum／strongly agree）
    reliability: Howard & Murry（2020，TPM，27(2)，271–277）施測 15 題 MPS：PDF α = .93、PDD α = .83、IP α = .79；Gülbahar 土耳其版（13 題）：PDD .95、PDF .94、IP .80
    context: 六個研究發展的自陳量表；後續用於成人線上樣本與土耳其大學生
    notes: 本次只找到三題例題（各向度一題，取自 Howard & Murry 2020 的方法節）。原文 PAID 全文與 ResearchGate 皆被擋，完整題項請回原文附錄或向作者索取。題數在不同來源不一致：Howard & Murry 說 15 題，土耳其版 13 題（PDD 第 1–5 題、PDF 第 6–10 題、IP 第 11–13 題），原文另有 Goal Time Preference
      補充量表。改編時注意 IP 是「不當堅持」，與 grit 的 perseverance 方向相反，不能加總；Howard & Murry 證明 Courage Measure 與 PDF 幾乎同構（HTMT = .98）。土耳其版全文：https://acikerisim.gelisim.edu.tr/xmlui/handle/11363/6462
  - name: 行為式任務堅持：無解字謎（unsolvable anagrams）與習得無助典範
    source: Feather, N. T., & Simon, J. G.（1971）。Attribution of responsibility and valence of outcome in relation to initial confidence。Journal of Personality and Social Psychology，18(2)，173–188；Määttänen,
      I. 等（2021）。Evidence for a behaviourally measurable perseverance trait in humans。Behavioral Sciences，11(9)，123。doi:10.3390/bs11090123
    url: https://www.millisecond.com/library/unsolvableanagrams
    definition: 堅持＝在無法成功或令人不快的任務上持續投入的時間或嘗試次數
    items:
    - 客觀指標 1：Time on task —— 受試者在無解（或困難）字謎上自願花費的時間（秒），Määttänen 等指出這是文獻中最常用的堅持指標
    - 客觀指標 2：Attempted solutions —— 測驗階段提交的解答次數（the number of submitted solutions for the test）
    - 客觀指標 3：Proportion correct —— 可解題的正確比例（the proportion correctly solved test anagrams），用以區分能力與堅持
    - 程序（Millisecond 版）：5 題練習字謎後接 15 題測驗字謎，其中三分之一無解，每題限時 30 秒，並告知至少答對 8 題才算通過；以練習難度 × 測驗難度做 2×2 設計
    scale: 客觀行為指標（秒數、次數、比例）
    reliability: Määttänen 等（2021，N = 54）以六項行為任務（冷壓、握力、無解字謎、無解語文推理、穿針、無聊影片）得到兩因素結構，共解釋表現時間 37.3% 變異；無解字謎是唯一較受疲勞（depletion）而非特質解釋的任務
    context: 實驗室個別施測；源自 Seligman 習得無助研究中「先經歷不可控失敗、再觀察是否放棄」的典範
    notes: Seligman (1975) 原始論文未在本次開啟，習得無助與字謎堅持的連結取自 Millisecond 與 Määttänen 等的文獻回顧。使用時要注意：(1) 堅持時間會與疲勞、對任務可解性的判斷混淆（在明知無解的題上堅持可能是不理性而非恆毅力）；(2) 需搭配可解題以分離能力；(3) 時間上限（如 30 秒／題）會截斷分布。Behavioral Sciences 全文：https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8468401/

Behavioral Intention:
  zh: 行為意圖
  scales:
  - name: UTAUT Behavioral Intention (Venkatesh et al. 2003)
    source: 'Venkatesh, V., Morris, M. G., Davis, G. B., & Davis, F. D. (2003). User acceptance of information technology: Toward a unified view. MIS Quarterly, 27(3), 425–478.'
    url: https://eclass.hmu.gr/modules/document/file.php/DSH314/006%20%CE%97%CE%B3%CE%B5%CF%83%CE%AF%CE%B1%20%CE%BA%CE%B1%CE%B9%20%CE%B1%CE%BB%CE%BB%CE%B1%CE%B3%CE%AE%2014%20%CE%99%CE%B1%CE%BD%202026/Venkatesh%202003_UTAUT.pdf
    definition: 使用者打算在未來一段期間內使用該系統的意圖；UTAUT 把它當成使用行為的直接前因。
    items:
    - 'BI1: I intend to use the system in the next <n> months.'
    - 'BI2: I predict I would use the system in the next <n> months.'
    - 'BI3: I plan to use the system in the next <n> months.'
    scale: 7-point scale（論文只說「1 為負向端、7 為正向端」，所有構念皆用七點量表；後續研究多用 strongly disagree–strongly agree）
    reliability: ICR = .92 / .90 / .90（Study 1，T1／T2／T3，N = 215）；.89 / .88 / .90（Study 2 跨組織驗證）
    context: 四個組織導入新資訊系統的員工，訓練後（T1）、導入後一個月（T2）、三個月（T3）三波施測；使用行為另以系統紀錄的使用時長測量
    notes: 原文 Table 16 標示此三題「adapted from Davis et al. (1989)」。<n> 由研究者填入期間（常見 6 個月）。改編時「the system」換成具體系統名；遠距精神醫療的改編版（PMC8977602）把 BI2 改成 I predict I will use…，α = .975。三題高度同質，常見縮短版只留 BI1＋BI3。
  - name: UTAUT2 Behavioral Intention (Venkatesh, Thong & Xu 2012)
    source: 'Venkatesh, V., Thong, J. Y. L., & Xu, X. (2012). Consumer acceptance and use of information technology: Extending the unified theory of acceptance and use of technology. MIS Quarterly, 36(1),
      157–178.'
    url: https://moodle2.units.it/pluginfile.php/427815/mod_resource/content/1/consumer%20acceptance%20of%20technologies_Venkatesh%202012.pdf
    definition: 消費者情境下，繼續使用某項科技的意圖（措辭已從「採用」改成「持續使用」）。
    items:
    - BI1. I intend to continue using mobile Internet in the future.
    - BI2. I will always try to use mobile Internet in my daily life.
    - BI3. I plan to continue to use mobile Internet frequently.
    scale: 7-point Likert, strongly disagree–strongly agree
    reliability: 論文表 1 報告所有反映性量表 ICR ≥ .75、AVE > .70（N = 1,512）；BI 個別數值見原文 Table 1
    context: 香港 1,512 位行動上網消費者，兩階段線上調查，第一波後四個月再收使用資料
    notes: 適合「已在使用、問要不要繼續用」的情境；研究初次採用時應改回 UTAUT 2003 版。BI2「always try to use」語意偏習慣，改編到低頻率行為時常被拿掉。使用行為用六種應用的使用頻率做成形成性指標（見 Behavior）。
  - name: TPB Intention (Ajzen; Fishbein & Ajzen 2010 questionnaire guide)
    source: 'Ajzen, I. (n.d.). Constructing a theory of planned behavior questionnaire. University of Massachusetts Amherst（依 Fishbein, M., & Ajzen, I. (2010). Predicting and changing behavior: The reasoned
      action approach. Psychology Press 附錄）。'
    url: https://people.umass.edu/aizen/pdf/tpb.measurement.pdf
    definition: 意圖是行為的直接前因；題項必須與行為準則（target, action, context, time）完全相容，並以自我指向的方式陳述。
    items:
    - I intend to exercise for at least 20 minutes, three times per week for the next three months.
    scale: 7-point bipolar adjective scale, likely (1)–unlikely (7)（指南建議每個構念 5–6 題，各以七點雙極形容詞量尺作答）
    reliability: 指南未報告數值；要求前測後各構念內部一致性要高（高 α），並以 CFA 檢查區辨效度，必要時刪 1–2 題
    context: 範例行為為術後病人未來三個月每週運動三次、每次 20 分鐘；屬問卷建構指南，不是單一實證研究
    notes: 指南只示範一題意圖題；實務上常見的另外幾種句型（I plan to…／I will try to…／I expect to…）在本指南正文沒有列出，改編時請自行依 TACT 原則改寫並保持與行為題同一時間框架。
  - name: TAM self-predicted future usage / behavioral expectation (Davis 1989, Study 2)
    source: Davis, F. D. (1989). Perceived usefulness, perceived ease of use, and user acceptance of information technology. MIS Quarterly, 13(3), 319–340.
    url: https://parsmodir.com/wp-content/uploads/2018/11/TAM-Davis-1989.pdf
    definition: 受測者對自己未來是否會經常使用某系統的自我預測（Davis 稱為 behavioral expectation，引 Warshaw & Davis 1985）。
    items:
    - Assuming Pendraw would be available on my job, I predict that I will use it on a regular basis in the future.
    scale: 兩個 7-point 量尺：一個 likely–unlikely，另一個反向極性 improbable–probable
    reliability: 原文未對此題報告信度；與 perceived usefulness 的相關 r = .85（pooled, n = 80）
    context: 40 位 MBA 學生在實驗室試用兩套繪圖軟體（Chart-Master、Pendraw）後作答
    notes: Davis (1989) 本身沒有三題式 BI 量表；常被引用的「I intend to use…」三題出自 Davis, Bagozzi & Warshaw (1989, Management Science 35(8), 982–1003)，本次找不到可開啟的全文，題項未能逐字確認；UTAUT 2003 明寫其 BI 三題改編自該文。Davis 1989 的 PU／PEOU
      在 Study 2 用 extremely likely–extremely unlikely 七點量尺。
Behavior:
  zh: 實際行為／使用行為
  scales:
  - name: TAM self-reported current usage (Davis 1989, Study 1)
    source: Davis, F. D. (1989). Perceived usefulness, perceived ease of use, and user acceptance of information technology. MIS Quarterly, 13(3), 319–340.
    url: https://parsmodir.com/wp-content/uploads/2018/11/TAM-Davis-1989.pdf
    definition: 使用者自陳目前使用某系統的頻率。
    items:
    - Participants were asked to self-report their degree of current usage of electronic mail and XEDIT on six-position categorical scales with boxes labeled "Don't use at all," "Use less than once each
      week," "Use about once each week," "Use several times a week," "Use about once each day," and "Use several times each day."
    scale: 六格類別量尺：Don't use at all / Use less than once each week / Use about once each week / Use several times a week / Use about once each day / Use several times each day
    reliability: 單題，無信度；與 perceived usefulness r = .63、與 ease of use r = .45（pooled n = 184）
    context: IBM Canada 員工使用 PROFS 電子郵件（n = 109）與 XEDIT 編輯器（n = 75）
    notes: 是單一自陳頻率題，不是多題量表。常見改編：加一題「每週使用時數」或改成 7 點 never–several times a day。Davis, Bagozzi & Warshaw (1989) 另以 14 週後的實際使用衡量，本次未取得全文。
  - name: UTAUT Use Behavior — system-log duration (Venkatesh et al. 2003)
    source: 'Venkatesh, V., Morris, M. G., Davis, G. B., & Davis, F. D. (2003). User acceptance of information technology: Toward a unified view. MIS Quarterly, 27(3), 425–478.'
    url: https://eclass.hmu.gr/modules/document/file.php/DSH314/006%20%CE%97%CE%B3%CE%B5%CF%83%CE%AF%CE%B1%20%CE%BA%CE%B1%CE%B9%20%CE%B1%CE%BB%CE%BB%CE%B1%CE%B3%CE%AE%2014%20%CE%99%CE%B1%CE%BD%202026/Venkatesh%202003_UTAUT.pdf
    definition: 實際使用行為，以系統紀錄的使用時長（duration of use）客觀測量。
    items:
    - Actual usage behavior was measured as duration of use via system logs.
    scale: 客觀指標（使用時長），非問卷題
    reliability: 不適用（客觀紀錄）
    context: 四個組織導入新系統後六個月內的系統紀錄；論文提到因網路可用性影響，使用量指標對環境敏感
    notes: UTAUT 原版沒有自陳使用行為題；拿不到系統紀錄的研究通常改用 Davis 1989 的頻率題或 UTAUT2 的頻率索引。
  - name: UTAUT2 Use — frequency index across applications (Venkatesh, Thong & Xu 2012)
    source: 'Venkatesh, V., Thong, J. Y. L., & Xu, X. (2012). Consumer acceptance and use of information technology: Extending the unified theory of acceptance and use of technology. MIS Quarterly, 36(1),
      157–178.'
    url: https://moodle2.units.it/pluginfile.php/427815/mod_resource/content/1/consumer%20acceptance%20of%20technologies_Venkatesh%202012.pdf
    definition: 使用行為＝使用種類（variety）與頻率的形成性複合指標。
    items:
    - 'Please choose your usage frequency for each of the following:'
    - a) SMS
    - b) MMS
    - c) Ringtone and logo download
    - d) Java games
    - e) Browse websites
    - f) Mobile e-mail
    scale: 7-point frequency scale, never–many times per day
    reliability: 形成性指標，不報 α；六個指標的權重介於 .2 與 .40
    context: 香港行動上網消費者，第一波調查後四個月再測使用
    notes: 改編時把六個應用換成研究情境的功能清單；論文自承行為錨定量尺可能有較高共同方法變異。
  - name: TPB self-reported behavior / past behavior (Ajzen questionnaire guide)
    source: Ajzen, I. (n.d.). Constructing a theory of planned behavior questionnaire. University of Massachusetts Amherst（依 Fishbein & Ajzen 2010 附錄）。
    url: https://people.umass.edu/aizen/pdf/tpb.measurement.pdf
    definition: 行為以事後自陳是否在指定期間內做出與意圖題完全相同定義的行為來測量。
    items:
    - In the past three months, I have exercised for at least 20 minutes, three times per week.
    - Three months following administration of the questionnaire (or another period as defined by the behavioral criterion), the participants are recontacted and asked to report whether they had exercised
      for at least 20 min, three times per week for the past three months.
    scale: 過去行為題：7-point false (1)–true (7)；追蹤行為題：依行為準則回報是否做到（指南未給固定格式）
    reliability: 指南未報告
    context: 問卷建構指南範例（術後病人運動行為）
    notes: 行為題與意圖題的 TACT 四要素必須一致；指南提醒範例中的過去行為發生在手術前，未必能預測未來行為。
Trust:
  zh: 信任
  scales:
  - name: Mayer & Davis (1999) Trust / Ability–Benevolence–Integrity (ABI) scales
    source: 'Mayer, R. C., & Davis, J. H. (1999). The effect of the performance appraisal system on trust for management: A field quasi-experiment. Journal of Applied Psychology, 84(1), 123–136.'
    url: https://iri.hse.ru/data/808/479/1225/Oct%2012%20The%20Effect%20of%20the%20Performance%20App..gement%20A%20field%20quasi-experiment.pdf
    definition: 信任＝願意讓自己暴露在受信任者的行動之下（willingness to be vulnerable）；可信度由能力、善意、正直三因素構成（Mayer, Davis & Schoorman 1995）。
    items:
    - '[Ability] Top management is very capable of performing its job.'
    - '[Ability] Top management is known to be successful at the things it tries to do.'
    - '[Ability] Top management has much knowledge about the work that needs done.'
    - '[Ability] I feel very confident about top management''s skills.'
    - '[Ability] Top management has specialized capabilities that can increase our performance.'
    - '[Ability] Top management is well qualified.'
    - '[Benevolence] Top management is very concerned about my welfare.'
    - '[Benevolence] My needs and desires are very important to top management.'
    - '[Benevolence] Top management would not knowingly do anything to hurt me.'
    - '[Benevolence] Top management really looks out for what is important to me.'
    - '[Benevolence] Top management will go out of its way to help me.'
    - '[Integrity] Top management has a strong sense of justice.'
    - '[Integrity] I never have to wonder whether top management will stick to its word.'
    - '[Integrity] Top management tries hard to be fair in dealings with others.'
    - '[Integrity] Top management''s actions and behaviors are not very consistent. (reverse-scored)'
    - '[Integrity] I like top management''s values.'
    - '[Integrity] Sound principles seem to guide top management''s behavior.'
    - '[Trust] If I had my way, I wouldn''t let top management have any influence over issues that are important to me. (reverse-scored)'
    - '[Trust] I would be willing to let top management have complete control over my future in this company.'
    - '[Trust] I really wish I had a good way to keep an eye on top management. (reverse-scored)'
    - '[Trust] I would be comfortable giving top management a task or problem which was critical to me, even if I could not monitor their actions.'
    - '[Propensity] One should be very cautious with strangers.'
    - '[Propensity] Most experts tell the truth about the limits of their knowledge.'
    - '[Propensity] Most people can be counted on to do what they say they will do.'
    - '[Propensity] These days, you must be alert or someone is likely to take advantage of you.'
    - '[Propensity] Most salespeople are honest in describing their products.'
    - '[Propensity] Most repair people will not overcharge people who are ignorant of their specialty.'
    - '[Propensity] Most people answer public opinion polls honestly.'
    - '[Propensity] Most adults are competent at their jobs.'
    scale: '5-point Likert: 1 Disagree strongly / 2 Disagree / 3 Neither agree nor disagree / 4 Agree / 5 Agree strongly'
    reliability: Ability α = .85 (Wave 2) / .88 (Wave 3)；Benevolence .87 / .89；Integrity .82 / .88；Propensity .55 / .66；Trust .59 / .60。Schoorman, Mayer & Davis (1996) 原始較長版本（10/12/13/7/4 題）α = .93 / .95
      / .96 / .71 / .82
    context: 一家公司員工評價公司高階管理團隊，14 個月三波現場準實驗（績效考核制度變更前後）
    notes: Trust 四題 α 偏低（.59–.60），作者歸因於題數少；後續研究常只用 ABI 三個可信度分量表、不用 Trust 四題。改編到 AI／機器人時（arXiv 2301.09011）把「top management」換成對象，Integrity 的 justice／fairness 題與「go out of its way」題因不適用被刪。跨文化研究指出 Ability／Benevolence
      部分題項在集體主義樣本解讀不同。
  - name: Trust in Automation Scale, TIAS (Jian, Bisantz & Drury 2000)
    source: Jian, J.-Y., Bisantz, A. M., & Drury, C. G. (2000). Foundations for an empirically determined scale of trust in automated systems. International Journal of Cognitive Ergonomics, 4(1), 53–71.
    url: https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1582880/full
    definition: 人對自動化系統的信任與不信任，視為同一向度的兩極（由信任相關詞彙的群集分析產生 12 題）。
    items:
    - The system is deceptive. (reverse-scored)
    - The system behaves in an underhanded manner. (reverse-scored)
    - I am suspicious of the system's intent, action, or output. (reverse-scored)
    - I am wary of the system. (reverse-scored)
    - The system's action will have a harmful or injurious outcome. (reverse-scored)
    - I am confident in the system.
    - The system provides security.
    - The system has integrity.
    - The system is dependable.
    - The system is reliable.
    - I can trust the system.
    - I am familiar with the system.
    scale: 7-point, 1 = Not at all, 7 = Extremely
    reliability: 原始論文未報告 α；McGrath et al. (2025) 以 AI 助理為對象 12 題 α = .94（Study 1）、.95（Study 3）
    context: 原始研究以問卷字詞評定建立量表，未在特定系統上驗證；McGrath et al. 2025 以 AI 助理為對象重新驗證
    notes: 題項取自 McGrath, Lack, Tisch & Duenser (2025, Frontiers in Artificial Intelligence, 8, 1582880) Table 1 的重製，原始 DTIC 報告與期刊全文本次打不開。前五題為不信任題需反向計分；Spain et al. (2008) 發現信任／不信任兩個相關因素；Gutzwiller et al.
      (2019) 指出量表有正向偏誤；第 12 題（familiar）常被認為不是信任題而拿掉。短版 S-TIAS 三題：I am confident in the system / The system is reliable / I can trust the system（α = .97）。
  - name: Trusting beliefs & trusting intentions, e-commerce (McKnight, Choudhury & Kacmar 2002)
    source: 'McKnight, D. H., Choudhury, V., & Kacmar, C. (2002). Developing and validating trust measures for e-commerce: An integrative typology. Information Systems Research, 13(3), 334–359.'
    url: https://ideas.repec.org/a/inm/orisre/v13y2002i3p334-359.html
    definition: Trusting beliefs＝相信對方具備可被信任的屬性（competence、benevolence、integrity）；trusting intentions＝願意依賴對方（willingness to depend、subjective probability of depending）。另有 disposition to trust 與 institution-based
      trust，共 16 個子構念。
    items:
    - '[Trusting Beliefs – Benevolence (TBB)]'
    - I believe that LegalAdvice.com would act in my best interest.
    - If I required help, LegalAdvice.com would do its best to help me.
    - LegalAdvice.com is interested in my well-being, not just its own.
    - '[Trusting Beliefs – Integrity (TBI)]'
    - LegalAdvice.com is truthful in its dealings with me.
    - I would characterize LegalAdvice.com as honest.
    - LegalAdvice.com would keep its commitments.
    - LegalAdvice.com is sincere and genuine.
    - '[Trusting Beliefs – Competence (TBC)]'
    - LegalAdvice.com is competent and effective in providing legal advice.
    - LegalAdvice.com performs its role of giving legal advice very well.
    - Overall, LegalAdvice.com is a capable and proficient Internet legal advice provider.
    - In general, LegalAdvice.com is very knowledgeable about the law.
    - '[Trusting Intentions – Willingness to Depend (GN)]'
    - When an important legal issue or problem arises, I would feel comfortable depending on the information provided by LegalAdvice.com.
    - I can always rely on LegalAdvice.com in a tough legal situation.
    - I feel that I could count on LegalAdvice.com to help with a crucial legal problem.
    - Faced with a difficult legal situation that required me to hire a lawyer (for a fee), I would use the firm backing LegalAdvice.com.
    - If I had a challenging legal problem, I would want to use LegalAdvice.com again. (原列於 Subjective Probability of Depending—Follow Advice 第 1 題，作者註明後來改歸 Willingness to Depend)
    - '[Trusting Intentions – Subjective Probability of Depending: Follow Advice (FA)]'
    - I would feel comfortable acting on the landlord/tenant information given to me by LegalAdvice.com.
    - I would not hesitate to use the landlord/tenant information LegalAdvice.com supplied me.
    - I would confidently act on the legal advice I was given by LegalAdvice.com.
    - I would feel secure in using the landlord/tenant information from LegalAdvice.com.
    - Based on the advice I just read, I would serve notice, wait, go ahead and get the repair done, and then deduct the cost of the repair from my rent.
    - '[Trusting Intentions – Subjective Probability of Depending: Give Information (GI)]'
    - I would be willing to provide information like my name, address, and phone number to LegalAdvice.com.
    - I would be willing to provide my social security number to LegalAdvice.com.
    - I would be willing to share the specifics of my legal issue with LegalAdvice.com.
    - '[Trusting Intentions – Subjective Probability of Depending: Make Purchases (MP)]'
    - Faced with a difficult legal situation, I would be willing to pay to access information on the LegalAdvice.com Web site.
    - I would be willing to provide credit card information on the LegalAdvice.com Web site.
    - Given a tough legal issue, I would be willing to pay for a 30-minute phone consultation with a LegalAdvice.com lawyer.
    scale: 原文為 7-point Likert（依 ideas.repec 摘要頁無法確認錨點）
    reliability: 本次未取得全文，未確認數值
    context: 以假想的法律諮詢網站（legal advice Web site）為刺激物的驗證研究
    notes: 題項未能逐字取得：Semantic Scholar 指向的開放取用檔 msu.edu/~mcknig26/Measures.pdf 已隨 MSU AFS 退役而失效，INFORMS、ResearchGate、Semantic Scholar 頁面皆回 403；只留摘要頁。改編時注意 competence／benevolence／integrity 三個 belief 各 3–4
      題、trusting intentions 分兩個子構念，後續研究（如 McKnight et al. 2011 trust in technology）把 benevolence 改成 helpfulness、competence 改成 functionality。需要原題請由圖書館取得 ISR 全文附錄。；補查：題項取自作者自存於 MSU 的 ISR 全文 PDF（Wayback Machine
      2011-12-07 快照）附錄 Measures，完整；附錄另含 Disposition to Trust、Institution-Based Trust、Site Quality 等題，未列入。原 msu.edu 網址現已失效（Incapsula 擋）。
  - name: Trust in online vendor (Gefen 2000; Gefen, Karahanna & Straub 2003)
    source: 'Gefen, D. (2000). E-commerce: The role of familiarity and trust. Omega, 28(6), 725–737.；Gefen, D., Karahanna, E., & Straub, D. W. (2003). Trust and TAM in online shopping: An integrated model.
      MIS Quarterly, 27(1), 51–90.'
    url: https://ideas.repec.org/a/eee/jomega/v28y2000i6p725-737.html
    definition: 消費者相信線上賣家（研究中為 Amazon.com）誠實、可靠、關心顧客且可預測的信念；Gefen 2003 把它與 TAM 整合。
    items:
    - Based on my experience with the online vendor in the past, I know it is honest
    - Based on my experience with the online vendor in the past, I know it cares about customers
    - Based on my experience with the online vendor in the past, I know it is not opportunistic
    - Based on my experience with the online vendor in the past, I know it provides good service
    - Based on my experience with the online vendor in the past, I know it is predictable
    - Based on my experience with the online vendor in the past, I know it is trustworthy
    - Based on my experience with the online vendor in the past, I know it knows its market
    scale: 7-point, strongly agree (1)–strongly disagree (7)（搜尋摘要所引 Gefen 2000 的描述，未在全文核對）
    reliability: Gefen 2000（搜尋摘要所引）：trust in the vendor α = .90、familiarity .91、disposition to trust .85、purchase intentions .78、inquiry intentions .91（N = 217）
    context: Gefen 2000：217 位潛在使用者，情境為在 Amazon.com 查詢與購買書籍；Gefen 2003：MBA 學生對 Amazon.com 的線上購書
    notes: 兩篇全文皆打不開（ScienceDirect／JSTOR 付費；terry.uga.edu 的 PDF 被 Cloudflare 擋、ResearchGate 與 academia.edu 回 403），題項未逐字取得，只留 Drexel esploro 與 ideas.repec 的書目頁（Gefen 2003 書目頁：https://researchdiscovery.drexel.edu/esploro/outputs/journalArticle/Trust-and-TAM-in-online-shopping/991019168361704721）。Gefen
      2003 的 familiarity、disposition to trust、trust、purchase intention 題皆沿用 Gefen 2000；需要原題請由圖書館取得。；補查：題項取自第一作者 Gefen 本人 2020 年開放取用論文 Table 2，文中明寫 Use、Trust、Familiarity 量表「based on Gefen et al. (2003b)」（即
      MISQ 2003）。共 7 題，未能比對 MISQ 原附錄是否即此 7 題或僅取其中數題；Gefen (2000) Omega 的 trust 題未取得。MISQ 原文 PDF（淡江課程網址）已 404。
Purchase Intention:
  zh: 購買意圖
  scales:
  - name: Willingness to buy (Dodds, Monroe & Grewal 1991)
    source: Dodds, W. B., Monroe, K. B., & Grewal, D. (1991). Effects of price, brand, and store information on buyers' product evaluations. Journal of Marketing Research, 28(3), 307–319.
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8987512/
    definition: 在給定價格、品牌、商店資訊下，買者願意購買該產品的程度（willingness to buy）。
    items:
    - If I were going to buy a bicycle, the probability of buying this model is
    - The probability that I would consider buying this bicycle is
    - At the price shown, I would consider buying the product
    - The likelihood of purchasing this laptop is…
    - The likelihood of ever using this laptop is…
    - My desire to own this laptop is…
    scale: 原文為 7-point 雙極量尺（very low–very high 類）；arXiv 2504.05359 的改編版用 5-point bipolar very low–very high；PMC8987512 的改編版用 7-point Likert strongly disagree–strongly agree
    reliability: 原文數值未核對；Sweeney, Soutar & Johnson (1999) 以其中三題測 willingness-to-buy α = .95；arXiv 2504.05359 改編版三題負荷 .723–.915
    context: 原始研究為實驗室實驗，受試者評估計算機與立體聲耳機在不同價格／品牌／商店條件下的品質、價值與購買意願
    notes: 本次找不到可開啟的 JMR 原文，題項來自兩個二手重製頁：前三題取自 Terblanche, Boshoff & Human-Van Eck (2022, PMC8987512) Table 7 標示的「Original three-item scale」，該表把來源合併標為 Capella et al. 2010、Dodds et al. 1991、Grewal et al.
      1998a/b，「bicycle」顯示已是後續改編，第三題在該表只看到改編後句型（At the price shown, I would consider buying the … featured in the advertisement）；後三題取自 arXiv 2504.05359（Dodds 1991 量表改編到筆電）。原始五題的逐字版本請核對 JMR 原文或 Bruner 的 Marketing
      Scales Handbook。
  - name: Purchase Intention, 5-item semantic differential (Spears & Singh 2004)
    source: Spears, N., & Singh, S. N. (2004). Measuring attitude toward the brand and purchase intentions. Journal of Current Issues & Research in Advertising, 26(2), 53–66.
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10904944/
    definition: 個人有意識地計畫去努力購買某品牌的程度（在 attitude-toward-the-ad 架構下與品牌態度區分）。
    items:
    - I will never/definitely buy this brand
    - I definitely do not intend to buy/definitely intend to buy this brand
    - I have very low/high purchase interest
    - I would definitely not buy/definitely buy it
    - I would probably not/probably buy it
    scale: 原文為 7-point 雙極（semantic differential）量尺；Shanbhogue & Ranjith (2024, PMC10904944) 改用 5-point Likert strongly disagree–strongly agree
    reliability: 原文數值未核對（全文付費）；Shanbhogue & Ranjith (2024) 改編版 α = .941（全球品牌）／.945（本土品牌），CR = .952／.957
    context: 原始研究以廣告實驗驗證品牌態度與購買意圖量表的心理計量特性；重製頁為印度消費者對全球／本土品牌
    notes: 題項取自 PMC10904944 Table 1 的重製（Taylor & Francis 原文頁回 403）。原量表應以雙極形容詞方式呈現（例：Definitely do not intend to buy — Definitely intend to buy），改成 Likert 同意度會失去語意差異格式。同文的品牌態度五題（unappealing/appealing、bad/good、unpleasant/pleasant、unfavorable/favorable、unlikable/likable）常與之配套使用。
User Satisfaction:
  zh: 使用者／顧客滿意
  scales:
  - name: IS Continuance Model satisfaction (Bhattacherjee 2001)
    source: 'Bhattacherjee, A. (2001). Understanding information systems continuance: An expectation-confirmation model. MIS Quarterly, 25(3), 351–370.'
    url: https://dm.its.msstate.edu/cob/mw156/intellcont/VedadiWarkentin2016_AISTRR2_7_ContinuanceMobileBanking-1.pdf
    definition: 使用者對先前使用資訊系統整體經驗的情感反應（滿意／不滿意），是持續使用意圖的主要前因。
    items:
    - How do you feel about your overall experience of mobile banking applications use?
    - Very dissatisfied/Very satisfied
    - Very displeased/Very pleased
    - Very frustrated/Very contented
    - Absolutely terrible/Absolutely delighted
    - '[Continuance intention] I intend to continue using mobile banking applications rather than discontinue its use.'
    - '[Continuance intention] My intentions are to continue using mobile banking applications than use any alternative means (traditional or web-based banking).'
    - '[Continuance intention] If I could, I would like to discontinue my use of mobile banking applications (reverse coded).'
    - '[Confirmation] My experience with using mobile banking applications was better than what I expected.'
    - '[Confirmation] The service level provided by mobile banking applications was better than what I expected.'
    - '[Confirmation] Overall, most of my expectations from using mobile banking applications were confirmed.'
    scale: 滿意：7-point semantic differential（四組雙極形容詞）；持續意圖與確認：7-point agree/disagree Likert
    reliability: Vedadi & Warkentin (2016) 複製研究（N = 256 大學生）：Satisfaction CR = .959、Continuance Intention .856、Confirmation .809；Bhattacherjee 2001 原始數值未核對（JSTOR 付費）
    context: 原始研究為線上銀行（online banking services, OBS）使用者；本頁題項取自 Vedadi & Warkentin (2016, AIS Transactions on Replication Research, 2, Paper 7) 把 OBS 改成 mobile banking applications 的複製版
    notes: 原文題幹為 How do you feel about your overall experience of online banking use?，改編時只換系統名、四組形容詞不動。滿意四題改編自 Oliver (1980) 與 Spreng, MacKenzie & Olshavsky (1996) 的語意差異格式。持續意圖第三題是反向題，部分後續研究因負荷低刪除。
  - name: End-User Computing Satisfaction, EUCS (Doll & Torkzadeh 1988)
    source: Doll, W. J., & Torkzadeh, G. (1988). The measurement of end-user computing satisfaction. MIS Quarterly, 12(2), 259–274.
    url: https://aisel.aisnet.org/cgi/viewcontent.cgi?article=1150&context=icis2000
    definition: 終端使用者對特定應用系統的滿意度，由內容、正確性、格式、易用性、及時性五個面向構成的二階構念。
    items:
    - C1. Does the system provide the precise information you need?
    - C2. Does the information content meet your needs?
    - C3. Does the system provide reports that seem to be just about exactly what you need?
    - C4. Does the system provide sufficient information?
    - A1. Is the system accurate?
    - A2. Are you satisfied with the accuracy of the system?
    - F1. Do you think the output is presented in a useful format?
    - F2. Is the information clear?
    - E1. Is the system user friendly?
    - E2. Is the system easy to use?
    - T1. Do you get the information you need in time?
    - T2. Does the system provide up-to-date information?
    scale: '原版 5-point, almost never–almost always；Chin & Lee (2000) 改用 7-point: never / almost never / some of the time / about half of the time / most of the time / almost always / always'
    reliability: 原文整體 α 未在本次來源核對；Doll, Xia & Torkzadeh (1994) 以 409 人 CFA 支持五個一階因素＋一個二階因素；Torkzadeh & Doll (1991) 報告再測信度
    context: 原始研究為 44 家公司 618 位終端使用者；題項取自 Chin & Lee (2000, ICIS Proceedings, Paper 57) Table 1 的逐字重製
    notes: 改編時把「the system」換成具體系統名（例：Does the CAS provide the precise information you need?）。Timeliness 兩題在網站情境常不穩定（Timeliness 需另行修訂）；Chin & Lee 另加整體滿意題 How would you rate your satisfaction with the use
      of the system?（very dissatisfied–very satisfied，-3 至 +3）可作總體滿意的單題。
  - name: ACSI customer satisfaction, 3-item index (Fornell et al. 1996)
    source: 'Fornell, C., Johnson, M. D., Anderson, E. W., Cha, J., & Bryant, B. E. (1996). The American Customer Satisfaction Index: Nature, purpose, and findings. Journal of Marketing, 60(4), 7–18.'
    url: https://en.wikipedia.org/wiki/American_Customer_Satisfaction_Index
    definition: 顧客滿意為潛在變數，由整體滿意、期望落差（expectancy disconfirmation）、與理想比較三題在結構方程模型中加權而成。
    items:
    - Using a scale from 1 to 10, where 1 means Very Dissatisfied and 10 means Very Satisfied, rate your overall satisfaction.
    - Using a scale from 1 to 10, where 1 means Falls Short of Your Expectations and 10 means Exceeds Your Expectations, how well does your experience meet your expectations?
    - Using a scale from 1 to 10, where 1 means Not Very Close to the Ideal and 10 means Very Close to the Ideal, how close was your experience to your "ideal" experience?
    scale: 1–10；三題錨點分別為 Very dissatisfied–Very satisfied、Falls short of your expectations–Exceeds your expectations、Not very close to the ideal–Very close to the ideal
    reliability: ACSI 不報 α；三題權重由 PLS 結構模型估計並換算為 0–100 指數
    context: 美國跨產業顧客滿意指數；題幹取自 CFI Group 為 NASA Planetary Data System 做的 ACSI 方法使用者調查（2020）
    notes: 題幹來源 https://pds.nasa.gov/home/NASAPDSUserSatisfaction2020final2.pdf （CFI Group 版本，另有以產品名代入的版本：how satisfied are you with PDS overall? / how does PDS compare to your expectations? / how does
      PDS compare to this ideal?）。Wikipedia 頁只列錨點。自行使用時常見簡化算法 (Satisfaction + Expectancy + Ideal − 3) / 27 × 100，與官方加權指數不同。
  - name: Satisfaction, expectancy-disconfirmation model (Oliver 1980)
    source: Oliver, R. L. (1980). A cognitive model of the antecedents and consequences of satisfaction decisions. Journal of Marketing Research, 17(4), 460–469.
    url: https://en.wikipedia.org/wiki/Expectation_confirmation_theory
    definition: 滿意是期望與期望落差（disconfirmation）的函數，並影響後續態度與購買意圖。
    items: []
    scale: 原文為六題 Likert 格式整體滿意題（二手文獻描述），錨點未核對
    reliability: α = .82（二手文獻轉述 Oliver 1980 六題內部一致性）
    context: 流感疫苗接種者與未接種者的兩階段現場研究
    notes: 原文在 SAGE 付費牆後（回 403），逐字題項未取得；本次只開到 Wikipedia 的理論頁與二手描述。後續多數研究並不直接沿用 Oliver 1980 原題，而是用 Oliver 的語意差異格式（Bhattacherjee 2001 四題即此類）或 Oliver (1997/2010) Satisfaction 專書中的量表。
Attitude:
  zh: 態度
  scales:
  - name: TPB 態度直接測量（Ajzen 語意差異題，Constructing a TPB Questionnaire）
    source: Ajzen, I.（n.d.）。Constructing a theory of planned behavior questionnaire. 作者自行發布之方法文件（依據 Fishbein & Ajzen, 2010, Predicting and changing behavior 附錄）
    url: https://people.umass.edu/aizen/pdf/tpb.measurement.pdf
    definition: 對執行某特定行為（含目標、行動、情境、時間四要素）的整體好惡評價，分工具性（instrumental）與經驗性（experiential）兩面向。
    items:
    - 'My exercising for at least 20 minutes, three times per week for the next three months would be: bad :___1__:___2__:___3__:___4__:___5__:___6__:___7___: good'
    - 'My exercising for at least 20 minutes, three times per week for the next three months would be: pleasant :___1__:___2__:___3__:___4__:___5__:___6__:___7___: unpleasant'
    scale: 7-point bipolar adjective (semantic differential) scales；文件建議每個構念 5–6 題，前測後保留內部一致性高的題
    reliability: 原文件未報信度（屬方法指引）；二手改編研究常見 α > .85（例：Boudreau & Godin 2009 法語加拿大糖尿病樣本 8 組形容詞對 α = .93，僅自搜尋摘要得知，未開啟原表）
    context: 範例行為為術後病人「未來三個月每週運動三次、每次至少 20 分鐘」，示範如何把題幹寫到與行為準則完全相容
    notes: 文件只示範 bad/good（工具性）與 pleasant/unpleasant（經驗性）兩對；改編時須把題幹改成自己定義的行為（含時間與情境），並兼顧工具性與經驗性兩類形容詞對。常見補充對：harmful/beneficial、worthless/valuable、unenjoyable/enjoyable、foolish/wise。注意正負向錨點要左右交錯以防反應定勢；極端詞（extremely）有無皆可，但同一份問卷要一致。
  - name: Attitude toward using（IS 採用情境；Taylor & Todd 1995 / Davis 式語意差異題）
    source: 'Taylor, S., & Todd, P. A.（1995）。Understanding information technology usage: A test of competing models. Information Systems Research, 6(2), 144–176'
    url: https://isri.sciencesphere.org/index.php?o=model&m=DTPB
    definition: 個人對使用某資訊系統（此處為 Computing Resource Center, CRC）所持的正負向評價。
    items:
    - Using the CRC is a (bad/good) idea.
    - Using the CRC is a (foolish/wise) idea.
    - I (dislike/like) the idea of using the CRC.
    - 'Using the CRC would be: (unpleasant/pleasant).'
    scale: 7-point bipolar (semantic differential) scale（ISRI 整理頁標示 0–7；原文為 7 點）
    reliability: ISRI 整理頁未列；原文報告之 α 未能從可開啟來源核對（依記憶約 .85–.90，未驗證，勿直接引用）
    context: 商學院學生使用校內 Computing Resource Center；同篇論文同時檢驗 TAM、TPB、DTPB 三模型
    notes: 題項取自 ISRI（Information Systems Research Indicators）二手整理頁，非出版社頁；ISRI 第一題印成 (bad I good) 為排版錯誤，此處改回斜線。此組題即 TAM 系統的 attitude toward using 標準寫法，Davis, Bagozzi & Warshaw (1989, Management Science)
      原版題幹為 All things considered, my using [system] in my job is … 配 good/bad 等形容詞對，但 Davis 原文 PDF 為掃描影像、無法逐字核對，未列入。Hsieh, Rai & Keil (2008) 改編版（同 ISRI 頁）：All things considered, using the Internet TV is
      extremely negative … extremely positive / extremely bad … extremely good / extremely harmful … extremely helpful。TAM2 以後（Venkatesh & Davis 2000）已拿掉 attitude 構念，改編 TAM 時要先決定要不要保留。
  - name: Attitude toward the ad / brand（Aad、Ab；MacKenzie & Lutz 1989）
    source: MacKenzie, S. B., & Lutz, R. J.（1989）。An empirical examination of the structural antecedents of attitude toward the ad in an advertising pretesting context. Journal of Marketing, 53(2), 48–65
    url: https://api.semanticscholar.org/graph/v1/paper/DOI:10.1177/002224298905300204?fields=title,abstract,year,venue
    definition: Aad：在特定一次曝光情境中，對特定廣告刺激做出有利或不利反應的傾向（a predisposition to respond in a favorable or unfavorable manner to a particular advertising stimulus during a particular exposure occasion）。
    items:
    - Bad/Good
    - Unpleasant/Pleasant
    - Unfavorable/Favorable
    scale: 7-point semantic differential（依多篇二手引述）
    reliability: 未能從可開啟來源核對
    context: 廣告前測（pretesting）情境，受試者看電視廣告後評價廣告與品牌
    notes: 本份只確認了出處與定義，題項原文無法從任何可開啟來源逐字取得（JSTOR/SAGE 全文、MSU 論文庫 429、CSU 論文庫 403 皆打不開）。文獻常引的 Aad 形容詞對為 good/bad、favorable/unfavorable、pleasant/unpleasant，Ab 常用 good/bad、favorable/unfavorable、satisfactory/unsatisfactory，但這些未經原文核對，建議上線前補查
      Bruner《Marketing Scales Handbook》。可核對的近親量表：Muehling (1987) 的「對廣告整體態度」三題 My attitude toward advertising is Good/Bad, Favorable/Unfavorable, Positive/Negative（7 點語意差異；見 https://pdfs.semanticscholar.org/32a1/2612992cc30dd31e14f9814799886b9b7a17.pdf
      ），以及 MacKenzie, Lutz & Belch (1986) 的單題 To what extent do you like or dislike this ad（7 點 like/not like）。；補查：三組形容詞對取自兩篇開放取用論文（PMC10420879 的測量表、PMC13548771 正文）皆明確標註來源為 MacKenzie & Lutz (1989)；未能打開
      1989 原文，Aad 的順序與原文是否完全一致、以及 attitude toward the brand (Ab) 的題項皆未確認（二手來源對 Ab 說法分歧：有說 1986 年版用 favorable/unfavorable、good/bad、wise/foolish）。
Cognitive Load:
  zh: 認知負荷
  scales:
  - name: Paas 單題心智努力評定量表（Mental Effort Rating Scale）
    source: 'Paas, F. G. W. C.（1992）。Training strategies for attaining transfer of problem-solving skills in statistics: A cognitive-load approach. Journal of Educational Psychology, 84(4), 429–434'
    url: https://learninglab.uni-due.de/node/13339
    definition: 學習者在剛完成的學習活動或解題中，主觀感受到所投入的心智努力（mental effort），作為整體認知負荷的指標。
    items:
    - 'Please choose the category (1, 2, 3, 4, 5, 6, 7, 8, or 9) that applies to you: In the lecture that just finished I invested'
    scale: 9-point scale：1 = very, very low mental effort; 2 = very low mental effort; 3 = low mental effort; 4 = rather low mental effort; 5 = neither low nor high mental effort; 6 = rather high mental
      effort; 7 = high mental effort; 8 = very high mental effort; 9 = very, very high mental effort
    reliability: 重測信度 r = .90（Learning Lab 整理頁，引 Paas 1992）；單題無法算 α
    context: 統計學解題訓練實驗，每題解完後即時作答；上列題幹為 Leppink et al. (2013) Appendix 2 引用 Paas 題目的講課版本
    notes: 題幹依情境改寫（例：In solving or studying the preceding problem I invested …），九個錨點不要改。常見變體：Castro-Alonso 等人改成 1 = extremely small amount 到 9 = extremely large amount；也有人改問 difficulty（very, very easy …
      very, very difficult，見 Ayres 2006 / Leppink 2013 Appendix 2 第 2 題），但「努力」與「難度」是不同構念，報告時要分清。單題量表無法區分內在／外在／增生負荷，要分型就用 Leppink。
  - name: Leppink 等人三類型認知負荷量表（10 題）
    source: Leppink, J., Paas, F., Van der Vleuten, C. P. M., Van Gog, T., & Van Merriënboer, J. J. G.（2013）。Development of an instrument for measuring different types of cognitive load. Behavior Research
      Methods, 45(4), 1058–1072
    url: https://link.springer.com/content/pdf/10.3758/s13428-013-0334-1.pdf
    definition: 依認知負荷理論分成內在負荷（IL，題材本身的複雜度）、外在負荷（EL，教學呈現造成的負荷）、增生負荷（GL，投入在學習與理解上的負荷）三類。
    items:
    - The topic/topics covered in the activity was/were very complex.
    - The activity covered formulas that I perceived as very complex.
    - The activity covered concepts and definitions that I perceived as very complex.
    - The instructions and/or explanations during the activity were very unclear.
    - The instructions and/or explanations were, in terms of learning, very ineffective.
    - The instructions and/or explanations were full of unclear language.
    - The activity really enhanced my understanding of the topic(s) covered.
    - The activity really enhanced my knowledge and understanding of statistics.
    - The activity really enhanced my understanding of the formulas covered.
    - The activity really enhanced my understanding of concepts and definitions.
    scale: 11-point：0 (not at all the case) 到 10 (completely the case)；指導語：All of the following questions refer to the activity (lecture, class, discussion session, skills training or study session) that
      just finished.
    reliability: α = .81（IL，題 1–3）、.75（EL，題 4–6）、.82（GL，題 7–10）；Study I 為 56 位心理與健康科學博士生統計課；CFA 另以三班大學部統計課（n = 171、136、148）確認
    context: 大學統計課（講課、討論、技能訓練）結束後立即施測
    notes: 題 2、3、8、9 寫死「formulas」「statistics」，用到其他學科要改詞；作者 2014 年已出通用版（Leppink et al. 2014，Learning and Instruction）：ICL 四題、ECL 四題、GCL 四題，每類各加一題 I invested a very high mental effort in …。第三因素是否真的是 germane
      load 有爭議（原文 GL 分數與學習表現關聯不如預期，作者後來也承認可能只是「自評理解程度」），引用時要交代。Krieglstein 等人 2022 年後設分析整理了各研究 α（多數 IL .70–.96、EL .40–.91、GL .70–.96），EL 題在部分樣本偏低。
  - name: NASA-TLX（Task Load Index）
    source: 'Hart, S. G., & Staveland, L. E.（1988）。Development of NASA-TLX (Task Load Index): Results of empirical and theoretical research. In P. A. Hancock & N. Meshkati (Eds.), Human mental workload
      (Advances in Psychology, Vol. 52, pp. 139–183). Amsterdam: North-Holland'
    url: https://ntrs.nasa.gov/api/citations/20000021487/downloads/20000021487.pdf
    definition: 主觀工作負荷（workload）：由心智需求、體力需求、時間需求、自評表現、努力、挫折六個子量表加權平均而得的整體負荷分數。
    items:
    - 'MENTAL DEMAND (Low/High): How much mental and perceptual activity was required (e.g., thinking, deciding, calculating, remembering, looking, searching, etc.)? Was the task easy or demanding, simple
      or complex, exacting or forgiving?'
    - 'PHYSICAL DEMAND (Low/High): How much physical activity was required (e.g., pushing, pulling, turning, controlling, activating, etc.)? Was the task easy or demanding, slow or brisk, slack or strenuous,
      restful or laborious?'
    - 'TEMPORAL DEMAND (Low/High): How much time pressure did you feel due to the rate or pace at which the tasks or task elements occurred? Was the pace slow and leisurely or rapid and frantic?'
    - 'EFFORT (Low/High): How hard did you have to work (mentally and physically) to accomplish your level of performance?'
    - 'PERFORMANCE (Good/Poor): How successful do you think you were in accomplishing the goals of the task set by the experimenter (or yourself)? How satisfied were you with your performance in accomplishing
      these goals?'
    - 'FRUSTRATION LEVEL (Low/High): How insecure, discouraged, irritated, stressed and annoyed versus secure, gratified, content, relaxed and complacent did you feel during the task?'
    scale: 每個子量表為 0–100 的視覺類比線（21 格、每格 5 分），兩端錨點 Low/High（Performance 為 Good/Poor）；原版另做 15 組兩兩比較算權重，加權後得 0–100 總分
    reliability: 原文件未報 α（各子量表為單題）；Hart (2006) 回顧指出 Raw TLX（不加權）與加權版高度相關
    context: NASA Ames 航空／模擬操作任務的工作負荷評估，後廣泛用於人因、醫療、HCI
    notes: 以上題目文字取自 NASA 技術備忘錄 NASA-TLX v1.0 使用手冊 Appendix A 的子量表定義（OCR 文字已校正標點）。紙本評定表常見簡化問法 How mentally demanding was the task? 等，屬後來的紙本版。常見改編：Raw TLX（RTLX，省略配對加權）、只取 Mental Demand 與 Effort 當認知負荷指標（教育研究常見）、把
      Physical Demand 拿掉。Performance 子量表方向與其他相反（Good 在左），分析前要注意是否反向。Wikipedia 條目 https://en.wikipedia.org/wiki/NASA-TLX 另有整理。
Job Performance:
  zh: 工作績效
  scales:
  - name: Williams & Anderson 1991 角色內行為（IRB）＋組織公民行為（OCBI／OCBO）
    source: Williams, L. J., & Anderson, S. E.（1991）。Job satisfaction and organizational commitment as predictors of organizational citizenship and in-role behaviors. Journal of Management, 17(3), 601–617
    url: https://scales.arabpsychology.com/?p=324709
    definition: 角色內行為（in-role behavior）指正式工作說明書要求、且為獎酬制度所認可的行為；OCBI 為對特定個人有益的公民行為，OCBO 為對組織整體有益的公民行為。
    items:
    - Adequately completes assigned duties.
    - Fulfills responsibilities specified in job description.
    - Performs tasks that are expected of him/her.
    - Meets formal performance requirements of the job.
    - Engages in activities that will directly affect his/her performance evaluation.
    - Neglects aspects of the job he/she is obligated to perform.
    - Fails to perform essential duties.
    - Helps others who have been absent.
    - Helps others who have heavy work loads.
    - Assists supervisor with his/her work (when not asked).
    - Takes time to listen to co-workers' problems and worries.
    - Goes out of way to help new employees.
    - Takes a personal interest in other employees.
    - Passes along information to co-workers.
    - Attendance at work is above the norm.
    - Gives advance notice when unable to come to work.
    - Takes undeserved work breaks.
    - Great deal of time spent with personal phone conversations.
    - Complains about insignificant things at work.
    - Conserves and protects organizational property.
    - Adheres to informal rules devised to maintain order.
    scale: 5-point Likert（1 = Strongly disagree … 5 = Strongly agree；整理頁所載，原文由主管評）
    reliability: 整理頁彙整：IRB α = .80–.94、OCBI α = .61–.88、OCBO α = .70–.75；原文 127 位主管評部屬
    context: 美國企業員工，由直屬主管評定；原始設計為主管他評，後續多改為自評
    notes: 題項取自二手整理頁（scales.arabpsychology.com），順序為 IRB 7 題（含 2 題反向：Neglects…、Fails…）、OCBI 7 題、OCBO 7 題（含 3 題反向：Takes undeserved work breaks、Great deal of time…、Complains…）。後續 IRT 研究指出 OCBO 的反向題實際上測的是反生產工作行為（CWB）而非
      OCB，許多研究因此拿掉這 3 題；短版常只用 IRB 前 4–5 題正向題。自評時「him/her」改「I」。本量表是「工作績效」研究中最常用的角色內績效自評／他評工具。
  - name: Goodman & Svyantek 1999 任務績效與脈絡績效量表
    source: 'Goodman, S. A., & Svyantek, D. J.（1999）。Person–organization fit and contextual performance: Do shared values matter. Journal of Vocational Behavior, 55(2), 254–275'
    url: https://europeanproceedings.com/pdf/article/10.15405/epsbs.2019.12.03.29
    definition: 任務績效（task performance）為職務核心技術工作的熟練程度；脈絡績效（contextual performance）為支持組織社會與心理環境的自發行為，含利他（altruism）與盡責（conscientiousness）兩子面向。
    items:
    - Helps other employees with their work when they have been absent.
    - Takes initiative to orient new employees to the department even though it is not a part of his/her job description.
    - Achieves the objectives of the job.
    - Performs well in the overall job by carrying out tasks as expected.
    scale: 7-point Likert（原版；Bağcı & Ünal 2019 土耳其版改 6 點 1 = Strongly Disagree … 6 = Strongly Agree）
    reliability: 原文 α 未能核對；Bağcı & Ünal (2019) 486 位公立醫院員工與其主管自評／他評，MTMM 支持兩因素區辨效度
    context: 美國企業員工，由同事或主管評；後續常用於自評＋主管評配對設計
    notes: 只找到 4 題（europeanproceedings 的 MTMM 研究引述的例題），原量表共 25 題：前 16 題為脈絡績效（利他 7 題＋盡責 9 題），後 9 題為任務績效。原文全文（Elsevier）及重印全題項的論文庫均打不開（403），上線前要補齊。常見縮短版只用 altruism 7 題＋task 9 題（共 16 題），盡責面向因與 OCBO 重疊常被拿掉。；補查：不完整：原量表
      25 題（前 16 題 contextual、後 9 題 task，見 https://www.europeanproceedings.com/article/10.15405/epsbs.2019.12.03.29 ）；轉載研究 PMC9518503 附錄 Table A1 只列 9 題 task 與 7 題 contextual（利他／altruism 子構面），contextual
      的另 9 題（conscientiousness 子構面）未在任何開放來源找到。轉載版本可能有輕微編修（如「Meet criteria」），無法與原文核對。
  - name: Individual Work Performance Questionnaire（IWPQ 1.0，Koopmans 2014）
    source: 'Koopmans, L., Bernaards, C. M., Hildebrandt, V. H., de Vet, H. C. W., & van der Beek, A. J.（2014）。Construct validity of the Individual Work Performance Questionnaire. Journal of Occupational
      and Environmental Medicine, 56(3), 331–337；美式英文版見 Koopmans, L.（2015）。Individual Work Performance Questionnaire instruction manual. Amsterdam: TNO Innovation for Life – VU University Medical Center'
    url: https://publications.tno.nl/publication/34643651/pRdMkJME/koopmans-2015-iwpq.pdf
    definition: 個人工作績效為「與組織目標相關的行為或行動」（Campbell, 1990），分任務績效、脈絡績效、反生產工作行為三個面向，只測行為不測結果。
    items:
    - I was able to plan my work so that I finished it on time.
    - I kept in mind the work result I needed to achieve.
    - I was able to set priorities.
    - I was able to carry out my work efficiently.
    - I managed my time well.
    - On my own initiative, I started new tasks when my old tasks were completed.
    - I took on challenging tasks when they were available.
    - I worked on keeping my job-related knowledge up-to-date.
    - I worked on keeping my work skills up-to-date.
    - I came up with creative solutions for new problems.
    - I took on extra responsibilities.
    - I continually sought new challenges in my work.
    - I actively participated in meetings and/or consultations.
    - I complained about minor work-related issues at work.
    - I made problems at work bigger than they were.
    - I focused on the negative aspects of situation at work instead of the positive aspects.
    - I talked to colleagues about the negative aspects of my work.
    - I talked to people outside the organization about the negative aspects of my work.
    scale: 5-point，回溯期 past 3 months；任務與脈絡績效：0 = Seldom、1 = Sometimes、2 = Regularly、3 = Often、4 = Always；反生產工作行為：0 = Never、1 = Seldom、2 = Sometimes、3 = Regularly、4 = Often
    reliability: 荷蘭版（n = 1,424）：任務績效 PSI .81／α .78、脈絡績效 PSI .85、CWB PSI .74（手冊 Table 1）；美式英文版 α = .79、.83、.89（三個量表依序）；西班牙版 α = .83、.87、.77（Ramos-Villagrasa et al. 2019）
    context: 荷蘭各行業員工（藍領、白領、粉領皆有），自評；美式英文版經跨文化調適後在美國工作者驗證
    notes: 題項為 TNO 手冊第 7 節 American-English version 逐字；荷蘭原版英譯（Koopmans 2014 博士論文）措辭略不同（例：I managed to plan my work so that it was done on time / I complained about unimportant matters at work），引用時要註明用的是哪個版本。原
      47 題版還有「適應性績效」面向，1.0 版已併入脈絡績效。三個量表分開計分（各取平均 0–4），不建議加總成單一總分。學術用途免費，商業用途須向 TNO/VUmc 取得授權。
Self-Efficacy:
  zh: 自我效能
  scales:
  - name: Computer Self-Efficacy（CSE；Compeau & Higgins 1995）
    source: 'Compeau, D. R., & Higgins, C. A.（1995）。Computer self-efficacy: Development of a measure and initial test. MIS Quarterly, 19(2), 189–211'
    url: https://learninglab.uni-due.de/node/13917
    definition: 個人對自己有能力使用電腦完成工作的判斷（不是指某個特定軟體技能，而是對完成整體任務的能力信念）。
    items:
    - I could complete the job using the software package… if there was no one around to tell me what to do as I go.
    - I could complete the job using the software package… if I had never used a package like it before.
    - I could complete the job using the software package… if I had only the software manuals for reference.
    - I could complete the job using the software package… if I had seen someone else using it before trying it myself.
    - I could complete the job using the software package… if I could call someone for help if I got stuck.
    - I could complete the job using the software package… if someone else had helped me get started.
    - I could complete the job using the software package… if I had a lot of time to complete the job for which the software was provided.
    - I could complete the job using the software package… if I had just the built-in help facility for assistance.
    - I could complete the job using the software package… if someone showed me how to do it first.
    - I could complete the job using the software package… if I had used similar packages before this one to do the same job.
    scale: 兩段式：先答 Yes/No（能不能做到），答 Yes 再評信心 1 = Not at all confident、5 = Moderately confident、10 = Totally confident（10 點）
    reliability: α = .80（Learning Lab 整理頁所載）；Bao et al. (2013) 中國行動學習樣本 α = .911
    context: 加拿大知識工作者（原文 n ≈ 1,020 位 Financial Post 500 企業經理人與專業人員郵寄問卷）
    notes: 題項對照 Learning Lab 附件 PDF 與 Bao, Xiong, Hu & Kibelloh (2013, Journal of Educational Computing Research 49(1), 111–132；預印本 https://arxiv.org/pdf/1402.4211 ）附錄，兩者一致（附件第 4 題漏印 trying，此處依 Bao 版）。Marakas
      等人批評此量表測的是「一般 CSE」，與特定任務的「特定 CSE」要分開；研究手機 App 或 AI 工具時通常自編特定 CSE 題（I believe I have the ability to …）。多數後續研究省略 Yes/No 那一段，直接用 10 點信心評分。題幹 software package 可依情境改成具體系統名。
  - name: General Self-Efficacy Scale（GSE；Schwarzer & Jerusalem 1995）
    source: 'Schwarzer, R., & Jerusalem, M.（1995）。Generalized Self-Efficacy scale. In J. Weinman, S. Wright, & M. Johnston (Eds.), Measures in health psychology: A user''s portfolio. Causal and control
      beliefs (pp. 35–37). Windsor, UK: NFER-NELSON'
    url: http://userpage.fu-berlin.de/~health/engscal.htm
    definition: 一般性自我效能：相信自己能應付各領域中新的或困難的任務、能因應逆境的樂觀自我信念。
    items:
    - I can always manage to solve difficult problems if I try hard enough.
    - If someone opposes me, I can find the means and ways to get what I want.
    - It is easy for me to stick to my aims and accomplish my goals.
    - I am confident that I could deal efficiently with unexpected events.
    - Thanks to my resourcefulness, I know how to handle unforeseen situations.
    - I can solve most problems if I invest the necessary effort.
    - I can remain calm when facing difficulties because I can rely on my coping abilities.
    - When I am confronted with a problem, I can usually find several solutions.
    - If I am in trouble, I can usually think of a solution.
    - I can usually handle whatever comes my way.
    scale: 4-point：1 = Not at all true、2 = Hardly true、3 = Moderately true、4 = Exactly true；加總 10–40，無反向題
    reliability: 作者網頁：23 國樣本 α = .76–.90，多數在 .80 後段；德國五個樣本 α = .82–.93；Scholz et al. (2002) 25 國 n = 19,120 國際平均 29.55
    context: 一般成人與青少年；原為 1979 年德文 20 題版，1981 年縮為 10 題，英文版 1995 年出版；已有 30 餘種語言版（含中文）
    notes: 題項取自作者 Ralf Schwarzer 的 FU Berlin 官方頁；PsyToolkit 版（ https://psytoolkit.org/survey-library/generalized-self-efficacy-gse.html ）第 3、5、8、9、10 題措辭略有出入（少了 usually 等字），引用時以作者頁為準。非商業研究免申請授權，但要註明出處。有些研究改成
      5 點或 7 點，與常模比較時要換算。中文版已由 Zhang & Schwarzer (1995) 發表。
  - name: New General Self-Efficacy Scale（NGSE；Chen, Gully & Eden 2001）
    source: Chen, G., Gully, S. M., & Eden, D.（2001）。Validation of a new general self-efficacy scale. Organizational Research Methods, 4(1), 62–83
    url: https://sparqtools.org/mobility-measure/new-general-self-efficacy-scale/
    definition: 個人對自己在各種情境中達成表現的整體能力信念（one's belief in one's overall competence to effect requisite performances across a wide variety of achievement situations）。
    items:
    - I will be able to achieve most of the goals that I have set for myself.
    - When facing difficult tasks, I am certain that I will accomplish them.
    - In general, I think that I can obtain outcomes that are important to me.
    - I believe I can succeed at most any endeavor to which I set my mind.
    - I will be able to successfully overcome many challenges.
    - I am confident that I can perform effectively on many different tasks.
    - Compared to other people, I can do most tasks very well.
    - Even when things are tough, I can perform quite well.
    scale: 5-point Likert：1 = Strongly disagree … 5 = Strongly agree；取平均
    reliability: 二手整理頁報 α = .85–.90（scales.arabpsychology.com）；原文兩國（美國、以色列）多個樣本信度高、且比 Sherer 等人的 SGSE 更單向度，但原文確切 α 無法從可開啟頁面核對
    context: 美國與以色列大學生與軍人（管理／組織心理學情境），用來預測各種任務的特定自我效能
    notes: 題項對照 SPARQ 與 UCSD EMERGE 兩頁一致（EMERGE 第 1 題為 that I have set、第 4 題為 almost any；SPARQ 第 1 題 that I set、第 4 題 most any——以原文為準者建議採 EMERGE 版）。與 GSE 的差別：NGSE 由 14 題池篩出 8 題、單因素、題目全為「能達成目標／克服挑戰」的 can-do
      語氣；GSE 混有因應（coping）成分。組織行為研究偏用 NGSE，健康心理學偏用 GSE。
  - name: Bandura 自我效能量表編製指引（領域專屬量表的通用格式）
    source: 'Bandura, A.（2006）。Guide for constructing self-efficacy scales. In F. Pajares & T. Urdan (Eds.), Self-efficacy beliefs of adolescents (Vol. 5, pp. 307–337). Greenwich, CT: Information Age Publishing'
    url: https://readingmatrix.com/files/21-1jkbwrqn.pdf
    definition: 自我效能是對自己「能夠」（can do）組織並執行達成特定成果所需行動的能力判斷，必須針對特定功能領域量身編題，不存在通用題項。
    items:
    - The items should be phrased in terms of can do rather than will do. Can is a judgment of capability; will is a statement of intention.（Bandura 2006, p. 308）
    - Participants record the strength of their efficacy beliefs on a 100-point scale, ranging in 10-unit intervals from 0 (Cannot do); through intermediate degrees of assurance, 50 (Moderately certain
      can do); to complete assurance, 100 (Highly certain can do).（Bandura 2006, p. 312）
    scale: 0–100、每 10 分一格（0 = Cannot do；50 = Moderately certain can do；100 = Highly certain can do）；亦可用 0–10 的 11 點版，但 Bandura 反對 5 點或 7 點（區辨力不足）
    reliability: 不適用（指引非固定量表）
    context: 方法指引；範例量表（學業、自我調節學習、社交等）附於該章
    notes: 本條不是量表，而是編題規則；Bandura 原章 PDF 各鏡像（uky.edu、emory.edu）已失效，引文取自 Reading Matrix 期刊文章（Wyatt 2021 評述）逐字引用的頁碼。編題要點：題目列出不同難度等級的任務（graded difficulty）、避免「will」、避免天花板效應、先讓受試者練習評分、量表要與結果變項的領域對齊。學生常見錯誤是拿 GSE
      這類一般量表去預測特定行為，Bandura 明確反對。
Firm Performance:
  zh: 公司績效
  scales:
  - name: Venkatraman & Ramanujam 1986 企業績效測量架構（分類基模，非題項量表）
    source: 'Venkatraman, N., & Ramanujam, V.（1986）。Measurement of business performance in strategy research: A comparison of approaches. Academy of Management Review, 11(4), 801–814（本條引用其 1985 年 Illinois
      工作論文版）'
    url: https://ideals.illinois.edu/items/29400/bitstreams/97934/data.pdf
    definition: 企業績效是多維構念：最窄的「財務績效」（銷售成長、獲利、EPS 等）包在較寬的「營運績效」（市占、品質、新產品、行銷效能）之內，再外層是「組織效能」；測量途徑依「財務 vs 營運指標」×「初級 vs 次級資料」分成十類。
    items: []
    scale: 不適用（架構論文）；作者主張同時納入財務與營運指標、並用多重資料來源
    reliability: 不適用
    context: 策略管理實證研究的績效操作化回顧
    notes: 這篇是後續所有「主觀自評績效」量表的理論出處，自評量表設計時應交代涵蓋的是哪一層（財務／營運／效能）。工作論文版與 AMR 正式版內容一致，正式版頁碼 801–814。常被一起引用的是 Dess & Robinson (1984) 證明主觀自評績效與客觀財務數據顯著相關，用來合理化自評做法。
  - name: Delaney & Huselid 1996 知覺組織績效／知覺市場績效
    source: Delaney, J. T., & Huselid, M. A.（1996）。The impact of human resource management practices on perceptions of organizational performance. Academy of Management Journal, 39(4), 949–969
    url: https://www.markhuselid.com/pdfs/articles/1996_AMJ_Delaney_Huselid.pdf
    definition: 受訪高階主管將本組織過去三年的表現與同業其他組織相比所做的主觀評價；組織績效面向涵蓋品質、創新、人才、顧客與員工關係，市場績效面向涵蓋行銷、銷售成長、獲利與市占。
    items:
    - How would you compare the organization's performance over the past 3 years to that of other organizations that do the same kind of work? What about... Quality of products, services, or programs?
    - How would you compare the organization's performance over the past 3 years to that of other organizations that do the same kind of work? What about... Development of new products, services, or programs?
    - How would you compare the organization's performance over the past 3 years to that of other organizations that do the same kind of work? What about... Ability to attract essential employees?
    - How would you compare the organization's performance over the past 3 years to that of other organizations that do the same kind of work? What about... Ability to retain essential employees?
    - How would you compare the organization's performance over the past 3 years to that of other organizations that do the same kind of work? What about... Satisfaction of customers or clients?
    - How would you compare the organization's performance over the past 3 years to that of other organizations that do the same kind of work? What about... Relations between management and other employees?
    - How would you compare the organization's performance over the past 3 years to that of other organizations that do the same kind of work? What about... Relations among employees in general?
    - Compared to other organizations that do the same kind of work, how would you compare the organization's performance over the last 3 years in terms of... Marketing?
    - Compared to other organizations that do the same kind of work, how would you compare the organization's performance over the last 3 years in terms of... Growth in sales?
    - Compared to other organizations that do the same kind of work, how would you compare the organization's performance over the last 3 years in terms of... Profitability?
    - Compared to other organizations that do the same kind of work, how would you compare the organization's performance over the last 3 years in terms of... Market share?
    scale: 4-point Likert：1 = worse … 4 = much better（原文 Table 1 標示 range 1–4）
    reliability: 知覺組織績效 7 題 α = .85（N = 590）；知覺市場績效 4 題 α = .86（N = 373，僅上市公司）
    context: 美國 1991 年 National Organizations Survey（GSS 特別模組），590 家營利與非營利組織，由人資或高階主管回答
    notes: 前 7 題與後 4 題是兩個分開的量表，不要合併；市場績效量表只適用營利組織。後續 Rasch 分析（二手引述）指出原兩因素結構不佳，三因素（internal／external／market）較合理。台灣研究改編時常把「past 3 years」改成「過去一年」，並改 5 點或 7 點；也常只取 Quality、New products、Customer satisfaction
      三題加市場績效 4 題。本頁所列題幹依原文表格，What about… 與 in terms of… 為原文題幹的接續語。
  - name: Wiklund & Shepherd 2005 小企業主觀績效（相對競爭者的財務與成長指標）
    source: 'Wiklund, J., & Shepherd, D.（2005）。Entrepreneurial orientation and small business performance: A configurational approach. Journal of Business Venturing, 20(1), 71–91'
    url: https://link.springer.com/content/pdf/10.1007/s11846-011-0062-9.pdf
    definition: 小企業績效以成長（銷售成長率、員工成長）與財務績效（毛利、獲利、現金流）兩類指標合併衡量，由企業主／CEO 相對於競爭者自評。
    items:
    - sales growth rate
    - employee growth
    - gross margin
    - profitability
    - cash flow
    scale: 原文：財務三項為 7-point、相對於競爭者（much less than our competitors … much more than our competitors）；成長兩項以兩個時間點的實際數字計算（依 Kraus et al. 2012 的複製研究描述，原文全文未能開啟）
    reliability: 原文 α 未能核對；Kraus, Rigtering, Hughes & Hosman (2012, Review of Managerial Science) 荷蘭 164 家 SME 複製研究改用 5 點（1 = extremely bad performance … 5 = excellent performance）自評
    context: 瑞典小企業（原文 n = 413，依複製研究所述），CEO 郵寄問卷，兩波資料
    notes: 只找到五個指標名稱，不是完整題幹（原文 JBV 全文與複製研究的 ResearchGate 頁都打不開）；指標名稱取自 Kraus et al. (2012) 第 4 節逐字。同作者 2003 年 SMJ 論文（Knowledge-based resources, entrepreneurial orientation, and the performance of SMEs,
      24(13), 1307–1314）用同一套指標。改編時常見做法是列 8–10 個指標（加 market share、customer satisfaction、new product success）請受訪者相對競爭者或相對預期打分，但那些加項不是 Wiklund & Shepherd 的原設計，標示出處時要分清。
Involvement:
  zh: 涉入
  scales:
  - name: Personal Involvement Inventory（PII，20 題原版）
    source: Zaichkowsky, J. L.（1985）。Measuring the involvement construct。Journal of Consumer Research，12(3)，341–352
    url: https://academic.oup.com/jcr/article/12/3/341/1820588
    definition: 個人依其內在需求、價值與興趣，對某對象所知覺到的個人相關性（a person's perceived relevance of the object based on inherent needs, values, and interests）。
    items:
    - Important/unimportant (1)*
    - Of no concern/of concern to me (2)
    - Irrelevant/relevant (3)
    - Means a lot to me/means nothing to me (4)*
    - Useless/useful (5)
    - Valuable/worthless (6)*
    - Trivial/fundamental (7)
    - Beneficial/not beneficial (8)*
    - Matters to me/doesn't matter (9)*
    - Uninterested/interested (10)
    - Significant/insignificant (11)*
    - Vital/superfluous (12)*
    - Boring/interesting (13)
    - Unexciting/exciting (14)
    - Appealing/unappealing (15)*
    - Mundane/fascinating (16)
    - Essential/nonessential (17)*
    - Undesirable/desirable (18)
    - Wanted/unwanted (19)*
    - Not needed/needed (20)
    scale: 7-point semantic differential（20 組兩極形容詞對）
    reliability: α 平均 .90–.95（跨學生／上班族樣本與手錶、運動鞋、即溶咖啡、彩色電視等多種產品）；三週重測 .90（García et al. 1996 轉述 Zaichkowsky 1985 的數字）
    context: 美國消費者對產品類別（牛仔褲、汽車、即溶咖啡等）的涉入
    notes: 20 題原版的逐字形容詞對未在本次打開的任何來源中完整取得（JCR 原文僅訂閱者可讀；García, Olea, Ponsoda & Scott 1996 Psicothema 8(2) 337–349 只提供西班牙語改編版，見 https://www.psicothema.com/pdf/32.pdf ）。原文主因素佔共同變異 65%（牛仔褲）到 100%（即溶咖啡）。後續研究批評題項冗餘且單一向度（Mittal
      1989；McQuarrie & Munson 1987），作者本人於 1994 年縮為 10 題（見下一筆）。改編時注意：此量表測的是「對物／類別」的持久涉入，不是購買決策涉入。；補查：20 題完整取自 Mittal, B., 'A Parsimonious Version of the Personal Involvement Inventory'（AMS 年會論文集，Springer
      開放 PDF）Table 1，該表註明括號數字為原量表題序，並以 * 標示反向題；已用頁面影像核對 OCR。另 1994 年 10 題修訂版（Unimportant/Important、Boring/Interesting、Irrelevant/Relevant、Unexciting/Exciting、Means nothing to me/Means a lot to me、Unappealing/Appealing、Mundane/Fascinating、Worthless/Valuable、Uninvolving/Involving、Not
      needed/Needed）見 https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9048900/fullTextXML 附錄。信度數字來源：https://www.psicothema.com/pdf/32.pdf
  - name: Revised Personal Involvement Inventory（RPII，10 題修訂版）
    source: 'Zaichkowsky, J. L.（1994）。The personal involvement inventory: Reduction, revision, and application to advertising。Journal of Advertising，23(4)，59–70'
    url: https://learninglab.uni-due.de/node/13959
    definition: 個人依其內在需求、價值與興趣，對某對象所知覺到的個人相關性；修訂版同時涵蓋認知（cognitive）與情感（affective）兩個面向。
    items:
    - important – unimportant
    - boring – interesting
    - relevant – irrelevant
    - exciting – unexciting
    - means nothing – means a lot
    - appealing – unappealing
    - fascinating – mundane
    - worthless – valuable
    - involving – uninvolving
    - not needed – needed
    scale: 7-point semantic differential（題幹「To me, [object] is:」；UNT TAT 計分說明採 7 格；learninglab 資料庫則登錄為 9-point，兩來源不一致）
    reliability: α = .91–.96（learninglab 資料庫轉述原文）
    context: 廣告與產品涉入；修訂版驗證情境為廣告
    notes: 題項逐字取自 UNT 的 TAT 問卷計分文件 https://iittl.unt.edu/sites/default/files/instruments/scoringtat1_1.pdf （該文件標為「Zaichkowsky (1985) Modified PII」，但 10 組形容詞對與 1994 年修訂版一致；文件中第 5 題印為「means nothings」，應為排版錯誤）。反向題：形容詞對負向在左者（boring,
      means nothing, worthless, not needed）需反向計分；TAT 文件列的反向題號是依其自身左右排列而定。常見改編：Celuch & Taylor（1999, JCSDCB 12）在四種服務情境再縮為 8 題，仍維持認知／情感二因素（ https://www.jcsdcb.com/index.php/JCSDCB/article/view/175 ）；Foxall
      & Pallister（1998）用於金融服務。
  - name: Consumer Involvement Profile（CIP）
    source: Laurent, G., & Kapferer, J.-N.（1985）。Measuring consumer involvement profiles。Journal of Marketing Research，22(1)，41–53
    url: https://faculty.essec.edu/research/11670-measuring-consumer-involvement-profiles
    definition: 涉入不是單一程度而是一組剖面：由興趣（interest／perceived importance）、愉悅（pleasure）、符號價值（sign）、風險重要性（risk importance）、誤購機率（risk probability）五個前因構成。
    items:
    - I have a strong interest in ---
    - '--- is very important to me'
    - For me, --- do not matter
    scale: Likert 同意度量尺（原文為法語題項；點數未在打開的來源中確認）
    reliability: 原文信度未在打開的來源中取得；網路彙整頁轉述各面向 α .72–.90，未經核對
    context: 法國家庭主婦（207 位訪談；後擴至 14 個產品類別）
    notes: 英語逐字題項未取得：原文題項為法語，Kapferer & Laurent（1993，Psychology & Marketing 10(4) 347–355）附原始法語題項。五個面向的定義取自 Hosseini et al. 在 African Journal of Business Management 的整理表（ https://academicjournals.org/journal/AJBM/article-full-text-pdf/3303CB615327
      ）：interest＝對產品類別的個人興趣／意義／重要性；pleasure＝產品的享樂價值；sign＝產品表達自我的程度；risk importance＝錯誤選擇之負面後果的重要性；risk probability＝做出錯誤選擇的主觀機率。改編時注意：美國樣本常見 interest 與 pleasure 合併成單一因素（Jain & Srinivasan 1990 只抽出四因素）；Jain
      & Srinivasan 1990 的 New Involvement Profile（NIP）是以 CIP 為基礎的「第二代」語意差異版本，Almeida & Düsenberg（2014，RBGN 16(50) 75–95， https://rbgn.emnuvens.com.br/RBGN/article/download/959/pdf_41/15733 ）給的是巴西葡語回譯英文，不是原始英文。；補查：不完整：只有
      Mittal（同上 Springer PDF）註明「borrowed from Laurent and Kapferer (1985)」的 3 題；CIP 其餘構面（pleasure、sign、risk importance、risk probability）英文題項與 Kapferer & Laurent 1993 全表未取得（HAL 全文被反爬蟲擋）。Jain & Srinivasan
      1990 NIP 僅在巴西轉載研究 Table 4 見到英文「semantic anchors」（如 essential／beneficial／necessary、pleasant／exciting／fun、conveys an image of myself…），屬葡文版本回標英文，非原文逐字，故不列為題項；來源 https://rbgn.emnuvens.com.br/RBGN/article/download/959/pdf_41/15733
  - name: Purchase-Decision Involvement scale（PDI）
    source: Mittal, B.（1989）。Measuring purchase-decision involvement。Psychology & Marketing，6(2)，147–162
    url: https://www.emerald.com/insight/content/doi/10.1108/02652329810228181/full/html
    definition: 消費者在一次購買決策任務上所投入的興趣與關切程度（the interest and concern that an individual brings to bear on the purchase decision task）；屬情境式／購買涉入，與 PII 的持久涉入區分。
    items: []
    scale: 7-point bipolar（4 題，原文 Figure 1, p. 152）
    reliability: α = .77（房貸購買者）–.87（退休金購買者）（Foxall & Pallister 1998，英國 N=308，用的是 Mittal 改為 4 題＋3 題產品重要性的 7 題版）
    context: 一般消費品的購買決策；後續多用於金融服務、觀光活動
    notes: 逐字題項未在打開的來源取得。Warnick & Bojanic（2010，USDA GTR-NRS-P-94， https://research.fs.usda.gov/download/treesearch/40358.pdf ）描述四題分別測：(1) 對市面上有哪些類型與品牌的在乎程度；(2) 各類型／品牌之間的差異程度；(3) 做出正確選擇的重要性；(4) 對選擇結果的關切程度。Mittal（1995）指出「品牌差異」那一題誤差過大，後續研究常刪除；Foxall
      & Pallister 1998 也發現該題 item-total 相關僅 .21–.37。Foxall & Pallister 的 7 題版另含「important to me」「matters a great deal」「important part of my life」三題產品重要性（Table II 為圖檔，未能逐字取得）。
Motivation:
  zh: 動機
  scales:
  - name: Intrinsic Motivation Inventory（IMI）— Interest/Enjoyment 分量表
    source: 'Ryan, R. M.（1982）。Control and information in the intrapersonal sphere: An extension of cognitive evaluation theory。Journal of Personality and Social Psychology，43，450–461；量表全文由 selfdeterminationtheory.org
      發布；效度研究 McAuley, E., Duncan, T., & Tammen, V. V.（1989）。Psychometric properties of the Intrinsic Motivation Inventory in a competitive sport setting。Research Quarterly for Exercise and Sport，60，48–58'
    url: https://selfdeterminationtheory.org/wp-content/uploads/2022/02/IMI_Complete.pdf
    definition: 參與者對某一目標活動的主觀經驗；其中 interest/enjoyment 分量表被視為內在動機的自陳測量（the self-report measure of intrinsic motivation）。
    items:
    - I enjoyed doing this activity very much
    - This activity was fun to do.
    - I thought this was a boring activity. (R)
    - This activity did not hold my attention at all. (R)
    - I would describe this activity as very interesting.
    - I thought this activity was quite enjoyable.
    - While I was doing this activity, I was thinking about how much I enjoyed it.
    scale: 7-point（1 = not at all true, 4 = somewhat true, 7 = very true）
    reliability: 官方文件未報 α；載明 McAuley, Duncan & Tammen（1989）CFA 支持效度，題項入選標準為因素負荷 ≥ .60 且交叉負荷 < .40
    context: 實驗室情境下受試者完成某項活動（拼圖、閱讀教材等）後的事後測量
    notes: 全套 45 題共 7 個分量表（interest/enjoyment、perceived competence、effort/importance、pressure/tension、perceived choice、value/usefulness、relatedness），研究者依問題自選分量表並隨機排序；官方說明允許把「this activity」改成具體活動而不影響信效度。(R)
      題反向計分（8 − 原分）。常用版本：22 題 Task Evaluation Questionnaire（interest/enjoyment 為第 1, 5, 8, 10, 14(R), 17, 20 題，另含 perceived competence、perceived choice、pressure/tension）；9 題閱讀版；25 題內化研究版。官方提醒自陳 interest
      與行為指標相關僅約 .4，且每個因素超過 4 題後增量 R 很小。題項另見 https://psytests.org/sdt/imien-bl.html 。
  - name: Situational Motivation Scale（SIMS）
    source: 'Guay, F., Vallerand, R. J., & Blanchard, C.（2000）。On the assessment of situational intrinsic and extrinsic motivation: The Situational Motivation Scale (SIMS)。Motivation and Emotion，24(3)，175–213'
    url: https://psytests.org.ru/sdt/simsen-bl.html
    definition: 個人在特定時刻、特定情境下從事某活動的動機（motivation toward a particular activity at a specific moment or within a particular situation），區分內在動機、認同調節、外在調節與無動機。
    items:
    - Why are you currently engaged in this activity? — Because I think that this activity is interesting.
    - Because I am doing it for my own good.
    - Because I am supposed to do it.
    - There may be good reasons to do this activity, but personally I don't see any.
    - Because I think that this activity is pleasant.
    - Because I think that this activity is good for me.
    - Because it is something that I have to do.
    - I do this activity but I am not sure if it is worth it.
    - Because this activity is fun.
    - By personal decision.
    - Because I don't have any choice.
    - I don't know; I don't see what this activity brings me.
    - Because I feel good when doing this activity.
    - Because I believe that this activity is important for me.
    - Because I feel that I have to do it.
    - I do this activity, but I am not sure it is a good thing to pursue it.
    scale: 7-point（1 = Corresponds not at all, 2 = Corresponds a very little, 3 = Corresponds a little, 4 = Corresponds moderately, 5 = Corresponds enough, 6 = Corresponds a lot, 7 = Corresponds exactly）
    reliability: 原文各分量表 α 未在打開的來源取得（Springer 原文頁需登入）
    context: 教育與體育活動情境；大學生樣本
    notes: 四個分量表各 4 題，依題意歸類：intrinsic motivation（1, 5, 9, 13）、identified regulation（2, 6, 10, 14）、external regulation（3, 7, 11, 15）、amotivation（4, 8, 12, 16）；此對應依原量表慣例，psytests 頁面本身未標示。Standage, Treasure,
      Duda & Prusak（2003, J Sport & Exercise Psychology）在體育情境刪 2 題成 14 題版並只得到部分恆等性；挪威、西班牙（12 題版）、葡萄牙、印尼驗證也多建議刪題。改編時「this activity」換成具體活動。
  - name: Perceived Enjoyment（內在動機）／Perceived Usefulness（外在動機）
    source: Davis, F. D., Bagozzi, R. P., & Warshaw, P. R.（1992）。Extrinsic and intrinsic motivation to use computers in the workplace。Journal of Applied Social Psychology，22(14)，1111–1132
    url: https://www.scirp.org/reference/referencespapers?referenceid=2021926
    definition: 知覺享樂（perceived enjoyment）＝使用電腦系統這項活動本身被知覺為令人愉快的程度，與工具價值無關（the extent to which the activity of using a computer system is perceived to be personally enjoyable in its own right aside from
      the instrumental value of the technology）；知覺有用性＝外在動機。
    items:
    - I find using online self-regulated learning to be enjoyable
    - The actual process of using online self-regulated learning is pleasant
    - I have fun using online self-regulated learning
    scale: 7-point Likert（依 TAM 系列慣例；本次未從原文核對）
    reliability: 原文信度未在打開的來源取得
    context: 職場電腦使用：Study 1 文書處理軟體、Study 2 商業繪圖程式；有用性對使用意圖 β = .68／.79，享樂 β = .16／.15，兩者合計解釋意圖變異 62%／75%
    notes: 逐字題項未取得（Wiley 原文頁被擋）。定義句引自 Roca & Gagné（2008，Computers in Human Behavior， https://selfdeterminationtheory.org/SDT/documents/2008_RocaGagne_CHP.pdf ）轉述。常見改編版：Turel, Serenko & Giles（2011, MIS Quarterly）附錄以「Using
      eBay.com is enjoyable / pleasurable / fun / exciting / interesting」五題標註出自 Davis et al. 1992（此為搜尋結果摘要，未打開原附錄）。改編時注意：此量表是 TAM 脈絡的「享樂」單一面向，與 SDT 的內在動機概念不同；Venkatesh（2000）把 enjoyment 當成 ease of use 的前因，UTAUT2
      改名 hedonic motivation。；補查：三題結構完整，但轉載研究已將原文的系統名稱置換為「online self-regulated learning」，原文應為「I find using [system] to be enjoyable」等句型，置換處以外逐字相同；轉載表格明確標註來源 Davis et al. (1992)。另一轉載（PMC12135465, GETAMEL）用「I
      find using the VR anatomy software enjoyable」「The actual process of using the VR anatomy software is pleasant」兩題，α = 0.98。JASP 原文全文未取得。
  - name: Work Preference Inventory（WPI）
    source: 'Amabile, T. M., Hill, K. G., Hennessey, B. A., & Tighe, E. M.（1994）。The Work Preference Inventory: Assessing intrinsic and extrinsic motivational orientations。Journal of Personality and Social
      Psychology，66(5)，950–967'
    url: https://people.uncw.edu/caropresoe/edn203/203_Spring_09/Amabile_WPI_&_scoring.doc
    definition: 個人對工作的內在動機取向（因挑戰、好奇、樂趣、自我表達而工作）與外在動機取向（因報酬、評價、他人認可、他人指令而工作）的穩定傾向。
    items:
    - I am not that concerned about what other people think of me.
    - I prefer having someone set clear goals for me in my work.
    - The more difficult the problem, the more I enjoy trying to solve it.
    - I am keenly aware of the goals I have for getting good grades.
    - I want my work to provide me with opportunities for increasing my knowledge and skills.
    - To me, success means doing better than other people.
    - I prefer to figure things out for myself.
    - No matter what the outcome of a project, I am satisfied if I feel I gained a new experience.
    - I enjoy relatively simple, straightforward tasks.
    - I am keenly aware of the GPA goals I have for myself.
    - Curiosity is the driving force behind much of what I do.
    - I'm less concerned with what work I do than what I get for it.
    - I enjoy tackling problems that are completely new to me.
    - I prefer work I know I can do well over work that stretches my abilities.
    - I'm concerned about how other people are going to react to my ideas.
    - I seldom think about grades and awards.
    - I'm more comfortable when I get to set my own goals.
    - I believe there is no point in doing a good job if nobody else knows about it.
    - I am strongly motivated by the grades I can earn.
    - It is important for me to be able to do what I most enjoy.
    - I prefer working on projects with clearly specified procedures.
    - As long as I can do what I enjoy, I'm not that concerned about exactly what grades or awards I can earn.
    - I enjoy doing work that is so absorbing that I forget about everything else.
    - I am strongly motivated by the recognition I can earn from other people.
    - I have to feel that I'm earning something for what I do.
    - I enjoy trying to solve complex problems.
    - It is important for me to have an outlet for self-expression.
    - I want to find out how good I really can be at my work.
    - I want other people to find out how good I really can be at my work.
    - What matters most to me is enjoying what I do.
    scale: 4-point（1 = never or almost never true of me, 4 = always or almost always true of me）
    reliability: 原文 α 未在打開的來源取得
    context: 美國大學生（本份為學生版，題項提到 grades／GPA）；另有工作成人版
    notes: UNCW 課程網頁轉載的是大學生版（college student version）；原文另有成人版把 grades／GPA 改為 salary／promotion 等職場字眼，本次未取得成人版逐字題項。計分：Intrinsic＝3+5+7+8+9(R)+11+13+14(R)+17+20+23+26+27+28+30；Extrinsic＝1(R)+2+4+6+10+12+15+16(R)+18+19+21+22(R)+24+25+29；文件載男女平均分別約
      45 與 39。Intrinsic 下再分 challenge／enjoyment，Extrinsic 下再分 outward／compensation 次量表（依原文；次量表題號本次未核對）。文件中含撇號的題項（12, 15, 17, 22, 25）因文字抽取略去撇號，此處依句意還原「I'm」。
Social Norm:
  zh: 社會規範／主觀規範／社會影響
  scales:
  - name: TPB 主觀規範直接測量（injunctive＋descriptive）
    source: 'Ajzen, I.（2006／無年份）。Constructing a theory of planned behavior questionnaire（依 Fishbein, M., & Ajzen, I.（2010）。Predicting and changing behavior: The reasoned action approach。New York: Psychology
      Press 附錄）'
    url: https://people.umass.edu/aizen/pdf/tpb.measurement.pdf
    definition: 主觀規範＝個人知覺到的社會壓力（perceived social pressure），由規範信念匯集而成；分指令性（important others approve）與描述性（people like me do it）兩面。
    items:
    - Most people who are important to me approve of my exercising for at least 20 minutes, three times per week for the next three months. (agree 1 – 7 disagree)
    - Most people like me exercised for at least 20 minutes, three times per week in the three months following their major surgery (unlikely 1 – 7 likely)
    scale: 7-point bipolar adjective scale（agree–disagree；unlikely–likely）
    reliability: 文件未報 α；要求每構念先用 5–6 題做前測，依內部一致性與區辨效度刪至合適題數
    context: 範例行為：術後病人未來三個月每週運動三次、每次 20 分鐘
    notes: Ajzen 的做法是模板不是固定量表：題項必須與行為準則在目標、行動、情境、時間（TACT）四要素上完全相容，且以第一人稱自述。文件另提供「間接測量」——先以開放式引出規範參照對象（誰會贊成／反對、誰會／不會做），再用「規範信念 × 遵從動機」加總。改編時把「exercising for at least 20 minutes…」整段換成自己的行為定義；不要只留「Most people
      who are important to me think I should…」而漏掉描述性那一面。
  - name: UTAUT Social Influence（SI，4 題）
    source: 'Venkatesh, V., Morris, M. G., Davis, G. B., & Davis, F. D.（2003）。User acceptance of information technology: Toward a unified view。MIS Quarterly，27(3)，425–478'
    url: https://verdi.cs.ucl.ac.uk/constructDB/publications/venkatesh-user-2003.html
    definition: 個人知覺到重要他人認為他／她應該使用新系統的程度（the degree to which an individual perceives that important others believe he or she should use the new system）。
    items:
    - People who influence my behavior think that I should use the system.
    - People who are important to me think that I should use the system.
    - The senior management of this business has been helpful in the use of the system.
    - In general, the organization has supported the use of the system.
    scale: Likert 同意度量尺（原文附錄未標示點數；UTAUT 系列慣用 7 點）
    reliability: ICR = .88（T1）、.94（T2）、.92（T3）（N = 215，縱貫三波）
    context: 四家組織導入新資訊系統的員工，自願與強制使用情境皆有
    notes: 四題分別來自 TAM2／TPB 的 subjective norm（SN1, SN2）與 MPCU 的 social factors（SF2, SF4）；原文 Table 11 另列 image 三題但未納入最終 SI。原文發現 SI 只在強制使用情境、且在使用早期顯著，自願情境不顯著；性別、年齡、經驗、自願性皆調節其效果。題項逐字取自 MIS Quarterly 原文附錄（JSTOR
      版 PDF）；verdi 頁只有書目。改編時把「the system」換成具體系統；後兩題預設組織脈絡，消費者研究常只用前兩題。
  - name: 指令性／描述性規範直接測量（Cialdini 焦點理論取向）
    source: 'Cialdini, R. B., Reno, R. R., & Kallgren, C. A.（1990）。A focus theory of normative conduct: Recycling the concept of norms to reduce littering in public places。Journal of Personality and Social
      Psychology，58(6)，1015–1026；題項模板取自 Warner, L. A., Cantrell, M. S., & Diaz, J. M.（2022）。Social norms for behavior change: A synopsis（AEC745／WC406）。UF/IFAS Extension'
    url: https://edis.ifas.ufl.edu/publication/WC406/pdf
    definition: 指令性規範（injunctive norms）＝他人贊成或反對什麼（what others want us to do or want us to avoid doing）；描述性規範（descriptive norms）＝他人實際做什麼（what others do）。
    items:
    - Most people who are important to me want me to…. (this is a direct measure of injunctive norms)
    - Most people who are like me do…. (this is a direct measure of descriptive norms)
    - Most of my colleagues want me to…. (this is an expectancy-based injunctive normative belief)
    - Most of my family members want me to…. (this is an expectancy-based injunctive normative belief)
    - Most of my colleagues do…. (this is an expectancy-based descriptive normative belief)
    - Most of my family members do…. (this is an expectancy-based descriptive normative belief)
    scale: Likert 同意度（Strongly agree – Strongly disagree；點數由研究者決定）
    reliability: 模板文件未報 α
    context: 環境行為（草坪澆水、節能）推廣；Cialdini 1990 原文為五個亂丟垃圾現場的實驗操弄，不是量表
    notes: Cialdini, Reno & Kallgren 1990（ https://public.websites.umich.edu/~prestos/Consumption/pdfs/Cialdinietal1990.pdf ）只提供概念區分與實驗操弄，沒有自陳量表；文獻中「Cialdini 式」題項多為上述直接測量模板，再依 TACT 原則填入具體行為。Warner et al.
      另列第三種「價值期望」框架：加權「遵從動機」（指令性）或「對參照群體的認同」（描述性）。改編時注意：描述性規範也常改用行為估計（「你認為有多少百分比的人會…」）而非同意度；指令性與描述性兩者可能方向相反，要分開測、分開報。
Job Satisfaction:
  zh: 工作滿意
  scales:
  - name: Minnesota Satisfaction Questionnaire — Short Form（MSQ-SF，20 題）
    source: 'Weiss, D. J., Dawis, R. V., England, G. W., & Lofquist, L. H.（1967）。Manual for the Minnesota Satisfaction Questionnaire。Minnesota Studies in Vocational Rehabilitation，22。Minneapolis: University
      of Minnesota'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12692551/
    definition: 員工對工作各個面向（工作本身、主管、同事、薪酬、升遷、工作條件等）的滿意程度；可分內在滿意、外在滿意與整體滿意。
    items:
    - Being able to keep busy all the time
    - The chance to work alone on the job
    - The chance to do different things from time to time
    - The chance to be “somebody” in the community
    - The way my boss handles his/her workers
    - The competence of my supervisor in making decisions
    - Being able to do things that do not go against my conscience
    - The way my job provides for steady employment
    - The chance to do things for other people
    - The chance to tell people what to do
    - The chance to do something that makes use of my abilities
    - The way company policies are put into practice
    - My pay and the amount of work I do
    - The chances for advancement on this job
    - The freedom to use my own judgment
    - The chance to try my own methods of doing the job
    - The working conditions
    - The way my co-workers get along with each other
    - The praise I get for doing a good job
    - The feeling of accomplishment I get from the job
    scale: 5-point（Very Dissatisfied / Dissatisfied / Neither Satisfied nor Dissatisfied / Satisfied / Very Satisfied；題幹「On my present job, this is how I feel about…」）
    reliability: α = .935（20 題整體；羅馬尼亞私立醫療機構員工，Pîrvu et al. 2026 驗證研究）；該研究引述波蘭研究 .892、希臘裔塞浦路斯研究 .955
    context: 美國職業復健研究；一般員工對現職的滿意
    notes: 題項逐字取自 PMC 文章附錄 Table A1 的英文原題欄（羅馬尼亞語譯文並列）。原手冊將 20 題分為 intrinsic（常見計分為第 1–4、7–11、15、16、20 題）與 extrinsic（5、6、12、13、14、19）兩分量表與 general satisfaction（全 20 題），但本次未打開手冊，分配請以 Vocational Psychology
      Research（University of Minnesota）官方版為準；官方網站 https://vpr.psych.umn.edu/node/26 需授權取得量表。短版是從長版 20 個分量表各取相關最高的一題而成。羅馬尼亞研究 EFA 得到三因素（Task Enrichment、Autonomy Satisfaction、Supervisory Relationships）並建議刪
      8 題，顯示內／外在二分在非美國樣本不一定成立。
  - name: Brayfield–Rothe Index of Job Satisfaction（18 題）
    source: Brayfield, A. H., & Rothe, H. F.（1951）。An index of job satisfaction。Journal of Applied Psychology，35(5)，307–311
    url: https://db.arabpsychology.com/?p=168327
    definition: 員工對工作整體的態度／感受（overall job satisfaction），不分面向。
    items:
    - My job is like a hobby to me.
    - My job is usually interesting enough to keep me from getting bored.
    - It seems that my friends are more interested in their jobs.
    - I consider my job rather unpleasant.
    - I enjoy my work more than my leisure time.
    - I am often bored with my job.
    - I feel fairly well satisfied with my present job.
    - Most of the time I have to force myself to go to work.
    - I am satisfied with my job for the time being.
    - I feel that my job is no more interesting than others I could get.
    - I definitely dislike my work.
    - I feel that I am happier in my work than most other people.
    - Most days I am enthusiastic about my work.
    - Each day of work seems like it will never end.
    - I like my job better than the average worker does.
    - My job is pretty uninteresting.
    - I find real enjoyment in my work.
    - I am disappointed that I ever took this job.
    scale: 5-point Likert（Strongly Agree / Agree / Undecided / Disagree / Strongly Disagree）；總分 18–90
    reliability: 奇偶折半 r = .77，Spearman-Brown 校正後 .87（1951 年原始樣本：231 位女性辦公室員工）
    context: 美國辦公室員工與夜校學生
    notes: 題項取自網路彙整頁（二手整理，原頁另列一題不計分的範例題「There are some conditions concerning my job that could be improved.」）。正向題為第 1, 2, 5, 7, 9, 12, 13, 15, 17 題，其餘 9 題反向計分（依 Hindi 改編版 JSS-18 的計分說明， https://ijip.in/wp-content/uploads/2023/09/18.01.368.20231103.pdf
      ）。原文以 Thurstone 法從 246 題篩選。最常用的縮短版是 Judge et al. 1998 的 5 題版（見下一筆）。
  - name: Brayfield–Rothe 5 題縮短版（Judge et al. 1998）
    source: 'Judge, T. A., Locke, E. A., Durham, C. C., & Kluger, A. N.（1998）。Dispositional effects on job and life satisfaction: The role of core evaluations。Journal of Applied Psychology，83(1)，17–34'
    url: https://www.questionpro.com/a/q/organization-behaviour-3324860
    definition: 整體工作滿意（overall job satisfaction）的情感式自評。
    items:
    - I feel fairly well satisfied with my present job.
    - Most days I am enthusiastic about my work.
    - Each day of work seems like it will never end.
    - I find real enjoyment in my work.
    - I consider my job rather unpleasant.
    scale: 5-point Likert（strongly agree – strongly disagree）；部分研究用 7 點
    reliability: 原文 α 未在打開的來源取得；土耳其驗證研究（N = 253）單因素、α = .929（搜尋結果轉述，未打開原文）
    context: 美國與以色列員工的核心自我評價研究
    notes: 五題逐字沿用 Brayfield & Rothe 1951 原題；第 3 題「Each day of work seems like it will never end」與第 5 題「I consider my job rather unpleasant」反向計分。QuestionPro 範本頁只列前四題且第一題印成「I feel fairly satisfied with my
      present job」，此處依 1951 原題。Judge 的官方量表頁 http://www.timothy-judge.com/JS2.htm 本次被 Cloudflare 擋下未能打開。Thompson & Phua（2012）另提出 4 題 Brief Index of Affective Job Satisfaction（BIAJS），本次未取得題項。
  - name: Michigan Organizational Assessment Questionnaire — Job Satisfaction Subscale（MOAQ-JSS，3 題）
    source: 'Cammann, C., Fichman, M., Jenkins, D., & Klesh, J.（1983）。Assessing the attitudes and perceptions of organizational members。In S. E. Seashore, E. E. Lawler, P. H. Mirvis, & C. Cammann（Eds.），Assessing
      organizational change: A guide to methods, measures, and practices（pp. 71–138）。New York: Wiley'
    url: https://www.qic-wd.org/sites/default/files/Umbrella%20Summary%20-%20Job%20Satisfaction%20111523_1.pdf
    definition: 整體工作滿意（global job satisfaction）。
    items:
    - All in all, I am satisfied with my job
    - In general, I don't like my job
    - In general, I like working here
    scale: 7-point Likert（strongly disagree – strongly agree；依網路彙整頁，本次未打開原書）
    reliability: 各研究 α 介於 .67–.95；Bowling & Hammond（2008）後設分析樣本加權平均內部一致性 .84（以上皆為搜尋結果轉述，未打開原文）
    context: 美國組織變革評估（密西根大學 ISR 品質工作研究計畫，1970 年代中期）
    notes: 題項逐字取自 QIC-WD 的 Job Satisfaction Umbrella Summary（該文件把出處標為 Lawler, Cammann, Nadler & Jenkins 1975 的 MOAQ 進度報告；多數文獻引 Cammann et al. 1983 Table 4-2, p. 84）。第 2 題反向計分。Bowling & Hammond 2008（Journal
      of Vocational Behavior 73, 63–77）的後設分析支持其與工作壓力源、組織知覺等的構念效度。優點是極短，適合放進長問卷；缺點是三題中有一題問「working here」偏組織而非工作本身。Paul Spector 的量表庫頁 https://paulspector.com/assessments/assessment-archive/job-attitudes/michigan-organizational-assessment-questionnaire-moaq/
      提供 docx 原檔。
  - name: Job Descriptive Index（JDI，72 題五面向）
    source: 'Smith, P. C., Kendall, L. M., & Hulin, C. L.（1969）。The measurement of satisfaction in work and retirement: A strategy for the study of attitudes。Chicago: Rand McNally'
    url: https://www.bgsu.edu/arts-and-sciences/psychology/services/job-descriptive-index/measures.html
    definition: 對工作五個面向（工作本身、薪資、升遷機會、主管、同事）的描述式滿意；受訪者不是直接說多滿意，而是勾選形容詞是否描述該面向。
    items:
    - 'Work on Present Job: Fascinating'
    - 'Work on Present Job: Routine'
    - 'Work on Present Job: Satisfying'
    - 'Work on Present Job: Boring'
    - 'Work on Present Job: Good'
    - 'Work on Present Job: Creative'
    - 'Work on Present Job: Respected'
    - 'Work on Present Job: Hot'
    - 'Work on Present Job: Pleasant'
    - 'Work on Present Job: Useful'
    - 'Work on Present Job: Tiresome'
    - 'Work on Present Job: Healthful'
    - 'Work on Present Job: Challenging'
    - 'Work on Present Job: On your feet'
    - 'Work on Present Job: Frustrating'
    - 'Work on Present Job: Simple'
    - 'Work on Present Job: Endless'
    - 'Work on Present Job: Gives a sense of accomplishment'
    - 'Pay: Income adequate for normal expenses'
    - 'Pay: Barely live on income'
    - 'Pay: Bad'
    - 'Pay: Satisfactory profit sharing'
    - 'Pay: Income provides luxuries'
    - 'Pay: Insecure'
    - 'Pay: Less than I deserve'
    - 'Pay: Highly paid'
    - 'Pay: Underpaid'
    - 'Promotion: Good opportunities'
    - 'Promotion: Opportunity somewhat limited'
    - 'Promotion: Promotion on ability'
    - 'Promotion: Dead-end job'
    - 'Promotion: Good chance for promotion'
    - 'Promotion: Unfair promotion'
    - 'Promotion: Infrequent'
    - 'Promotion: Regular promotions'
    - 'Promotion: Fairly good chance'
    - 'Co-workers: Stimulating'
    - 'Co-workers: Slow'
    - 'Co-workers: Ambitious'
    - 'Co-workers: Stupid'
    - 'Co-workers: Responsible'
    - 'Co-workers: Fast'
    - 'Co-workers: Intelligent'
    - 'Co-workers: Easy to make enemies'
    - 'Co-workers: Talk too much'
    - 'Co-workers: Smart'
    - 'Co-workers: Lazy'
    - 'Co-workers: Unpleasant'
    - 'Co-workers: No privacy'
    - 'Co-workers: Narrow interests'
    - 'Co-workers: Loyal'
    - 'Co-workers: Hard to meet'
    - 'Supervision: Asks my advice'
    - 'Supervision: Hard to please'
    - 'Supervision: Impolite'
    - 'Supervision: Praises good work'
    - 'Supervision: Tactful'
    - 'Supervision: Influential'
    - 'Supervision: Up-to-date'
    - 'Supervision: Doesn''t supervise'
    - 'Supervision: Quick tempered'
    - 'Supervision: Tells me where I stand'
    - 'Supervision: Annoying'
    - 'Supervision: Stubborn'
    - 'Supervision: Knows job well'
    - 'Supervision: Bad'
    - 'Supervision: Intelligent'
    - 'Supervision: Leaves me on my own'
    - 'Supervision: Around when needed'
    - 'Supervision: Lazy'
    scale: Adjective checklist：每個形容詞勾 Y（描述）／N（不描述）／?（不確定）；正向詞 Y = 3、? = 1、N = 0，負向詞反向（計分規則依 JDI 手冊，本次未打開手冊）
    reliability: α：work .83–.94、promotion .81–.95、co-workers .82–.96，supervision 兩個研究亦 > .80；pay 在兩個研究低於 .80（Brannick, Kelly & McCarthy 1983，四個愛爾蘭樣本）
    context: 美國一般員工；本次題項來源為 1969 年原版用於愛爾蘭樣本
    notes: '逐字題項取自 Brannick, Kelly & McCarthy（1983）。Measuring job satisfaction: The reliability of the Job Descriptive Index in diverse Irish sample populations。Irish Business and Administrative Research，5(1)，94–（
      https://mural.maynoothuniversity.ie/id/eprint/21045/ ），表內列 work 18、pay 9、promotion 9、co-workers 18、supervision 18，合計 72 題；co-workers 第 2 題與第 15 題在 PDF 文字層缺漏（本次只抽出 16 題，故 co-workers 面向少 2 題）。BGSU JDI
      Research Group 持有版權，1985／1997／2009 年修訂版替換了若干題（例如 work 面向改含 Dull、Awful、Important、Interesting、Uses my abilities），並加上 18 題 Job in General（JIG）整體量表；另有 25 題縮短版 aJDI（每面向 5 題，Stanton et al. 2002）。改編前應向 BGSU
      索取現行版與常模，不要直接用 1969 年詞表。'
Perceived Credibility:
  zh: 知覺可信度／來源可信度
  scales:
  - name: Ohanian Source Credibility Scale（15 組兩極形容詞）
    source: Ohanian, R.（1990）。Construction and validation of a scale to measure celebrity endorsers' perceived expertise, trustworthiness, and attractiveness。Journal of Advertising，19(3)，39–52
    url: https://researchcommons.waikato.ac.nz/server/api/core/bitstreams/b7b47d35-e8c1-4bdc-9382-860385a73c44/content
    definition: 名人代言人被知覺到的三個來源特質：吸引力（attractiveness）、可信賴性（trustworthiness；消費者對來源客觀誠實提供資訊的信心）、專業性（expertise）。
    items:
    - 'Attractiveness: unattractive – attractive'
    - 'Attractiveness: not classy – classy'
    - 'Attractiveness: ugly – beautiful'
    - 'Attractiveness: plain – elegant'
    - 'Attractiveness: not sexy – sexy'
    - 'Trustworthiness: not dependable – dependable'
    - 'Trustworthiness: dishonest – honest'
    - 'Trustworthiness: unreliable – reliable'
    - 'Trustworthiness: insincere – sincere'
    - 'Trustworthiness: untrustworthy – trustworthy'
    - 'Expertise: not an expert – expert'
    - 'Expertise: inexperienced – experienced'
    - 'Expertise: unknowledgeable – knowledgeable'
    - 'Expertise: unqualified – qualified'
    - 'Expertise: unskilled – skilled'
    scale: 7-point semantic differential（每個面向 5 組）
    reliability: 原文 α 未在打開的來源取得（網路轉述 expertise .885）。紐西蘭運動員代言複驗（Waikato 論文，四位名人各一樣本）：attractiveness .89–.93、trustworthiness .96–.98、expertise .93–.97；Clow, James & Stanley 2008（Marketing Management Journal
      18(2)，大學生 N = 560，信用卡廣告）用 5／5／4 題子集：expertise .872、trustworthiness .829、attractiveness .849
    context: 美國消費者對名人代言人的評價（原文以多個樣本建構）
    notes: 三個面向分開計分，不合成單一總分。常見改編：刪除 attractiveness（企業或媒體來源研究常只用 expertise＋trustworthiness）；Clow et al. 2008 把 attractiveness 減為 4 組（去掉 classy）並另加 similarity、liking；印度驗證研究刪 2 題後才達收斂／區辨效度；香港研究擴成 attractiveness、trustworthiness、expertise、familiarity、likability
      五因素。Ohanian 1991 後續發現只有 expertise 顯著預測購買意圖。
  - name: Source Credibility Measure（McCroskey & Teven 1999，18 題三面向）
    source: 'McCroskey, J. C., & Teven, J. J.（1999）。Goodwill: A reexamination of the construct and its measurement。Communication Monographs，66(1)，90–103'
    url: https://www.jamescmccroskey.com/measures/source_credibility.htm
    definition: 來源可信度（ethos）的三個面向：能力（competence）、善意／關懷（goodwill／caring）、可信賴性（trustworthiness）。
    items:
    - Intelligent – Unintelligent
    - Untrained – Trained
    - Cares about me – Doesn't care about me
    - Honest – Dishonest
    - Has my interests at heart – Doesn't have my interests at heart
    - Untrustworthy – Trustworthy
    - Inexpert – Expert
    - Self-centered – Not self-centered
    - Concerned with me – Not concerned with me
    - Honorable – Dishonorable
    - Informed – Uninformed
    - Moral – Immoral
    - Incompetent – Competent
    - Unethical – Ethical
    - Insensitive – Sensitive
    - Bright – Stupid
    - Phony – Genuine
    - Not understanding – Understanding
    scale: 7-point semantic differential（1 與 7 = 非常強烈、2 與 6 = 強烈、3 與 5 = 稍弱、4 = 未定）
    reliability: α 通常 .80–.94（官方量表頁）
    context: 官方範例指示語為評量自己的主管（manager／most recent supervisor）；原文用於一般人際與公眾人物來源
    notes: 計分：Competence＝1, 2, 7, 11, 13, 16；Caring/Goodwill＝3, 5, 8, 9, 15, 18；Trustworthiness＝4, 6, 10, 12, 14, 17；反向題為 1, 3, 4, 5, 8, 9, 10, 11, 12, 16（官方頁以粗體標示，但粗體與形容詞左右排列看來不一致，使用前請對照原文）。三個面向分別計算，不要加總；因面向相關高，官方建議不要用逐步迴歸。常見改編：教師可信度研究（Teacher
      Credibility Scale）沿用同 18 題；網路來源研究常只取 competence 與 trustworthiness 12 題。
  - name: Meyer 新聞可信度指標（Credibility Index，5 題）
    source: 'Meyer, P.（1988）。Defining and measuring credibility of newspapers: Developing an index。Journalism Quarterly，65(3)，567–574'
    url: https://aejmc.us/wp-content/uploads/sites/29/2012/09/Journalism-Quarterly-1986-Gaziano-451-62.pdf
    definition: 新聞媒體（報紙）的可信度／可相信性（believability），由公平、無偏、完整、正確、可信賴五個面向構成。
    items:
    - Is fair or unfair
    - Is biased or unbiased
    - Tells the whole story or doesn't tell the whole story
    - Is accurate or inaccurate
    - Can or cannot be trusted
    scale: 兩極語意差異式題（原文點數未在打開的來源確認；後續研究多用 5 點或 7 點）
    reliability: 原文 α 未在打開的來源取得；後續應用：McComas & Trumbo（2001, Risk Analysis 21(3)）報告跨多次應用皆穩定可靠；2023 年一項研究 α = .85 並稱與 Meyer 原始結果相近（搜尋結果轉述，未打開原文）
    context: 美國報紙讀者對當地日報的評價
    notes: 五題逐字取自 Gaziano & McGrath（1986）。Measuring the concept of credibility。Journalism Quarterly，63(3)，451–462 的 Table 1（12 題可信度因素），Meyer 1988 即從中挑出這五題組成指標；West（1994, JMCQ）以共變結構模型確認此五題為有效可靠的媒體可信度測量（Hanimann
      et al. 2023 IJOC 回顧， https://ijoc.org/index.php/ijoc/article/download/18815/3992 ）。Meyer 原文另主張 believability 與 community affiliation 兩個面向。改編時注意：此量表測的是「媒體／管道」可信度，不是單則訊息；1951–2018 年文獻回顧指出 accurate、believable、credible、fair、trustworthy
      五詞同時出現在訊息、媒體、來源三類量表，導致構念邊界模糊。
  - name: Message Credibility Scale（Appelman & Sundar 2016，3 題）
    source: 'Appelman, A., & Sundar, S. S.（2016）。Measuring message credibility: Construction and validation of an exclusive scale。Journalism & Mass Communication Quarterly，93(1)，59–79'
    url: https://pure.psu.edu/en/publications/measuring-message-credibility-construction-and-validation-of-an-e/
    definition: 個人對傳播內容真實性的判斷（an individual's judgment of the veracity of the content of communication），與來源可信度、媒體可信度區分。
    items:
    - accurate
    - authentic
    - believable
    scale: 請受訪者評定每個形容詞「描述該內容的程度」（rate how well the adjectives describe the content）；後續研究多用 7 點
    reliability: 原文 α／CR 未在打開的來源取得（Sage 與 ScienceDirect 頁面被擋）
    context: 美國成人閱讀新聞訊息（線上實驗）
    notes: 原文以 CFA 從較多候選形容詞（含 complete、concise、consistent、well-presented、objective、representative、no spin、expert、will have impact、professional 等）中收斂為三題；Huschens et al.（2023，arXiv 2309.02524）轉述原文共提出 10 個指標但建議以三形容詞為核心。改編時注意：三題是形容詞評定不是陳述句，題幹要寫清楚評的是「這則內容」；若同時測來源可信度，建議搭配
      McCroskey & Teven 或 Ohanian，不要把 trustworthy 混進訊息題。2022 年 COVID-19 社群媒體研究（Frontiers in Psychology 13:940903）用改編版時 α 僅 .44，顯示在青少年與短訊息情境可能不穩。
PU Perceived Usefulness:
  zh: 知覺有用性
  scales:
  - name: Davis (1989) Perceived Usefulness 六題原版（TAM）
    source: Davis, F. D.（1989）。Perceived usefulness, perceived ease of use, and user acceptance of information technology。MIS Quarterly，13(3)，319–340。doi:10.2307/249008
    url: https://measuringu.com/?p=536
    definition: 個人相信使用某一系統會提升其工作績效的程度
    items:
    - Using [this product] in my job would enable me to accomplish tasks more quickly.
    - Using [this product] would improve my job performance.
    - Using [this product] in my job would increase my productivity.
    - Using [this product] would enhance my effectiveness on the job.
    - Using [this product] would make it easier to do my job.
    - I would find [this product] useful in my job.
    scale: 7-point；Study 1 用 agree/disagree Likert，Study 2 用 likelihood（extremely likely – extremely unlikely，各點皆有標籤）
    reliability: α = .98（usefulness）、.94（ease of use）；兩個研究合計 152 位使用者、四套應用程式（摘要所報）
    context: 組織內員工與 MBA 學生評估辦公室軟體（電子郵件、文書編輯、繪圖等）；題項中的 [this product] 原文為受測系統名稱（如 CHART-MASTER）
    notes: measuringu.com 整理頁標註第 2、3、4、6 題是後續 TAM 延伸（TAM2／TAM3）沿用的四題；反向題在 Study 1 因降低信度被刪除。改編時把 [this product] 換成系統名稱、把 my job 換成情境（如 my studies、my daily life）即可，PMC 等改編版多依此做法。摘要出處另見 https://verdi.cs.ucl.ac.uk/constructDB/publications/davis-perceived-1989.html
  - name: TAM2 Perceived Usefulness 四題版（Venkatesh & Davis 2000）
    source: 'Venkatesh, V., & Davis, F. D.（2000）。A theoretical extension of the technology acceptance model: Four longitudinal field studies。Management Science，46(2)，186–204。doi:10.1287/mnsc.46.2.186.11926'
    url: https://measuringu.com/?p=536
    definition: 個人相信使用某一系統會提升其工作績效的程度（沿用 Davis 1989 定義）
    items:
    - Using [this product] would improve my job performance.
    - Using [this product] in my job would increase my productivity.
    - Using [this product] would enhance my effectiveness on the job.
    - I would find [this product] useful in my job.
    scale: 7-point Likert（strongly disagree – strongly agree）
    reliability: 原文信度未能從開放來源核對
    context: 四個組織、四套系統（N = 156）的縱貫田野研究，含自願與強制使用情境，三個時點施測
    notes: 此處題項是 measuringu 頁面標註「後續 TAM 延伸沿用」的 Davis 四題原文；TAM2 附錄實際用現在式措辭（Using the system improves my performance in my job 等），本次無法從可開啟的來源逐字核對，引用時請以原文附錄為準。Springer 補充檔（https://media.springernature.com/original/springer-static/esm/art%3A10.1007%2Fs12525-022-00593-5/MediaObjects/12525_2022_593_MOESM1_ESM.pdf）將
      Using the system in my job would increase my productivity 歸於 Moore & Benbasat (1991) 的 relative advantage、再由 Venkatesh et al. (2003) 收入。常見縮短版就是這四題，後續 UTAUT 又改成下列四題。
  - name: UTAUT Performance Expectancy 四題（Venkatesh et al. 2003）
    source: 'Venkatesh, V., Morris, M. G., Davis, G. B., & Davis, F. D.（2003）。User acceptance of information technology: Toward a unified view。MIS Quarterly，27(3)，425–478。doi:10.2307/30036540'
    url: https://media.springernature.com/original/springer-static/esm/art%3A10.1007%2Fs12525-022-00593-5/MediaObjects/12525_2022_593_MOESM1_ESM.pdf
    definition: 個人相信使用系統有助於其獲得工作績效增益的程度
    items:
    - I would find the system useful in my job.
    - Using the system enables me to accomplish tasks more quickly.
    - Using the system increases my productivity.
    - If I use the system, I will increase my chances of getting a raise.
    scale: 7-point Likert（strongly disagree – strongly agree）
    reliability: Kaphzan 等（2022，Frontiers in Psychiatry，以色列精神科醫師對遠距精神醫療）五點版 α = .858；Revisiting UTAUT for the Age of AI（arXiv 2510.15142，改成 AI 版）α = .81
    context: 四個組織導入新系統的員工（縱貫）；PE 題項整合自 Davis 的 PU、Moore & Benbasat 的 relative advantage、Compeau & Higgins 的 outcome expectations
    notes: 四題分別來自 PU（useful in my job）、relative advantage（accomplish tasks more quickly）、job-fit／PU（increase my productivity）與 outcome expectations（getting a raise）。第 4 題「加薪」在學生、自願使用或非職場情境常被刪掉或改寫（如 improve
      my grades），改編時注意。Europe PMC 全文可見題項與 α：https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8977602/fullTextXML ；AI 改編版見 https://arxiv.org/pdf/2510.15142 附錄。
Perceived Value:
  zh: 知覺價值
  scales:
  - name: Dodds, Monroe & Grewal (1991) Perceived Value（價格—品質—價值模型）
    source: Dodds, W. B., Monroe, K. B., & Grewal, D.（1991）。Effects of price, brand, and store information on buyers' product evaluations。Journal of Marketing Research，28(3)，307–319。doi:10.2307/3172866
    url: https://vtechworks.lib.vt.edu/handle/10919/54284
    definition: 消費者在所示價格下，對產品「付出與所得」的整體權衡判斷（value for the money）
    items:
    - 'This [product] is a: (very good value for the money – very poor value for the money)'
    - 'At the price shown this [product] is: (very economical – very uneconomical)'
    - I would consider this [product] to be a good buy. (strongly agree – strongly disagree)
    - 'The price shown for this [product] is: (very acceptable – very unacceptable)'
    - This [product] appears to be a bargain. (strongly agree – strongly disagree)
    scale: 7-point 語意差異法與 Likert 混用（各題兩端錨定如上）
    reliability: Dodds 1985 博士論文（同一套工具）報多題指標 Cronbach's α 介於 .892–.958；後續引用研究常報 value 三題版 α ≈ .85
    context: 5（價格）×3（品牌）×3（商店）受試者間實驗，學生樣本，刺激物為商務用口袋計算機與 SONY Walkman 隨身聽，價格以標示牌呈現
    notes: '題項逐字取自 Dodds (1985) Virginia Tech 博士論文第 198 頁 Table 41（1991 JMR 文章即由此論文發展，題項相同；[product] 原文為 Business Use Pocket Calculator 或 SONY WALKMAN FM stereo cassette headset player）。同一表另有 willingness
      to buy 題（The likelihood that I would purchase this … is: very high – very low；If I were going to buy a …, I would consider buying this model at the price shown；At the price shown, I would consider
      buying the …）。常見縮短版只取前三題（value for the money、economical、good buy）。博士論文 PDF：https://vtechworks.lib.vt.edu/bitstreams/5cd86f45-801f-494c-9db8-c314ee5b0500/download'
  - name: PERVAL（Sweeney & Soutar 2001）
    source: 'Sweeney, J. C., & Soutar, G. N.（2001）。Consumer perceived value: The development of a multiple item scale。Journal of Retailing，77(2)，203–220。doi:10.1016/S0022-4359(01)00041-0'
    url: https://eprints.lancs.ac.uk/id/eprint/55470
    definition: 消費者對耐久財的多面向價值知覺，分為品質／績效、情感、價格／金錢價值、社會四個構面
    items:
    - '[Quality]'
    - This video game has consistent quality.
    - This video game is well made.
    - This video game has an acceptable standard of quality.
    - This video game would perform consistently.
    - '[Emotional]'
    - This video game is one that I would enjoy.
    - This video game is one that I would feel relaxed.
    - This video game would make me feel good.
    - This video game would give me pleasure.
    - '[Price]'
    - This video game is reasonably priced.
    - This video game offers value for money.
    - This video game is a good product for the price.
    - This video game would be economical.
    - '[Social]'
    - This video game would help me to feel acceptable.
    - This video game would improve the way I am perceived.
    - This video game would make a good impression on other people.
    - This video game would give its owner social approval.
    scale: 7-point Likert（strongly disagree – strongly agree）
    reliability: 原文各構面信度未能從開放來源核對
    context: 澳洲零售消費者評估耐久財（電器等），19 題四構面
    notes: 本次只找到結構資訊：原版 19 題、四構面（quality、emotional、price/value for money、social）；Walsh, Shiu & Hassan（2014，Journal of Business Research，67(3)，260–267）以原始資料發展 12 題與 8 題短版，Walsh, Kilian & Buxel（2007，Advances
      in Consumer Research，35，688–689）在德國複製並提 12 題版。逐字題項未在任何可開啟的開放來源中取得（ScienceDirect、ResearchGate、PMC 皆被擋），引用前請從 Journal of Retailing 原文附錄或 Walsh et al. (2014) 附錄抄錄。注意與 Petrick (2002) 的 SERV-PERVAL（服務版，含
      is reasonably priced、has outstanding quality 等）是不同工具，不要混用。；補查：不完整且為改編：轉載研究每構面各取 4 題（原量表 quality 6、emotional 5、price 4、social 4 共 19 題），並把主詞改成「This video game」。另一轉載（PMC9022665 線上教育）同樣改編。Journal of
      Retailing 原文與 Walsh et al. 2014 全文皆未取得開放版本。
  - name: Sirdeshmukh, Singh & Sabol (2002) 關係交換中的 Value 四題
    source: Sirdeshmukh, D., Singh, J., & Sabol, B.（2002）。Consumer trust, value, and loyalty in relational exchanges。Journal of Marketing，66(1)，15–37。doi:10.1509/jmkg.66.1.15.18449
    url: https://www.msi.org/wp-content/uploads/2020/06/MSI_Report_01-116.pdf
    definition: 消費者對維持與服務提供者持續關係之「利益減去成本」的知覺（沿用 Zeithaml 1988）
    items:
    - 'For the prices you pay for clothing items at this store, would you say shopping at this store is a: (Very poor deal – Very good deal)'
    - 'For the time you spent in order to shop at this store, would you say shopping at this store is: (Highly unreasonable – Highly reasonable)'
    - 'For the effort involved in shopping at this store, would you say shopping at this store is: (Not at all worthwhile – Very worthwhile)'
    - How you would rate your overall shopping experience at this store? (Extremely poor value – Extremely good value)
    scale: 10-point 語意差異法
    reliability: α = .92（零售與航空兩個情境皆為 .92）
    context: 零售（常去的百貨公司購買主要服飾，N = 246）與航空（常搭航空公司的非商務旅行，N = 113）兩個關係型服務情境的郵寄問卷
    notes: 題項逐字取自 MSI Working Paper 01-116（2001）附錄 1（零售版）；附錄 2 航空版把 clothing items at this store 換成 traveling with this airline、shopping 換成 travelling。作者說明題項改編自 Grisaffe & Kumar (1998) 與 Dodds et al. (1991)，四題分別對應價格、時間、心力三種犧牲與整體價值。改編時保留「付出面（價格／時間／心力）＋整體」四題結構即可，10
      點量尺可改 7 點。
Decision Accuracy:
  zh: 決策正確性
  scales:
  - name: Cognitive Fit 任務表現操作化：決策正確率與決策時間（Vessey 1991）
    source: 'Vessey, I.（1991）。Cognitive fit: A theory-based analysis of the graphs versus tables literature。Decision Sciences，22(2)，219–240；Vessey, I., & Galletta, D.（1991）。Cognitive fit: An empirical study
      of information acquisition。Information Systems Research，2(1)，63–84。doi:10.1287/isre.2.1.63'
    url: https://arxiv.org/pdf/2204.11405
    definition: 問題解決表現以決策輸出的正確性（accuracy）與速度（time）衡量；任務與資訊呈現方式契合時兩者皆較佳
    items:
    - 客觀指標 1：Accuracy —— 受試者在每一題（spatial 或 symbolic 任務，如從圖或表讀出某月存款／提款金額、比較趨勢）的答案是否與正確答案相符，計正確題數或正確率
    - 客觀指標 2：Time —— 從呈現刺激到作答完成的秒數（反應時間）
    - 當代同型操作化（Faas et al. 2024, arXiv 2410.07728，人機協作無人機交接任務）：Decision accuracy was calculated for each participant as the percentage of selected actions that led to a successful outcome（未作答計為錯誤）；Decision
      time was measured as the time after participants saw the available actions until they chose a specific action.
    scale: 客觀指標：正確率（0–100%）與秒數；非自陳量尺
    reliability: 不適用（客觀行為指標）
    context: 實驗室實驗，受試者看圖或表回答資訊擷取題；Samuel 等（2022，Int. J. Information Management，65，102505）回顧指出 cognitive fit 研究一貫以 accuracy and speed of decision output 為依變項
    notes: Vessey 原文全文（Decision Sciences／ISR）未能從開放來源開啟，操作化描述取自 Samuel 等（2022）的回顧與 Faas 等（2024）的當代實作。改編要點：每題要有唯一正解才能算 accuracy；time 通常取對數或與 accuracy 合併成效率指標；多數研究報兩者分開的結果，因為 fit 對 accuracy 與 time 的效果不一定同向。
  - name: Häubl & Trifts (2000) 線上購物決策品質（客觀＋主觀）
    source: 'Häubl, G., & Trifts, V.（2000）。Consumer decision making in online shopping environments: The effects of interactive decision aids。Marketing Science，19(1)，4–21。doi:10.1287/mksc.19.1.4.15178'
    url: https://thesis.eur.nl/pub/9836/Peeters%20Rob%20J.Y.%20%28266481%29.pdf
    definition: 以消費者是否選到（或考慮到）非被支配（non-dominated）方案、事後是否換選，以及對決定的信心，衡量購買決策品質
    items:
    - 客觀指標 1：考慮集合中非被支配方案的比例（share of non-dominated alternatives in the consideration set）；被支配＝至少有另一方案在所有屬性上都不比它差且至少一項更好
    - 客觀指標 2：最終選擇是否為非被支配方案（0/1）
    - 客觀指標 3：事後換選（switching）—— 完成購買決定後給予換選機會，是否改選另一方案（0 = No，1 = Yes）；換選視為初始決策品質不佳
    - 主觀指標：對購買決定的信心（confidence in the purchase decision），單題 7-point Likert（1 = strongly disagree，7 = strongly agree）
    scale: 客觀指標為比例／二元；主觀信心題為 7-point Likert
    reliability: 不適用（單題與客觀指標）
    context: 模擬線上商店的實驗，操弄推薦代理人（RA）與比較矩陣（CM）；Peeters（2011，Erasmus 碩士論文）沿用同一組指標（TV 與筆電兩類產品，confidence 與 switch）
    notes: 原文全文未能開啟，指標說明取自 Peeters (2011) 第 4.2 節與第 5 章對 Häubl & Trifts 的整理。使用非被支配法必須在刺激物中刻意混入已知被支配與非被支配方案；若方案屬性無法客觀排序，改用換選率或信心。Aksoy 等（2011）指出主觀信心是客觀品質的弱代理，兩者最好並列報告。
  - name: Aksoy, Cooil & Lurie (2011) 決策品質指標分類（preference-dependent／preference-independent／subjective）
    source: Aksoy, L., Cooil, B., & Lurie, N. H.（2011）。Decision quality measures in recommendation agents research。Journal of Interactive Marketing，25(2)，110–122。doi:10.1016/j.intmar.2011.01.001
    url: https://ideas.repec.org/a/eee/joinma/v25y2011i2p110-122.html
    definition: 決策品質＝所選方案相對於受試者偏好或客觀屬性的優劣，分成依偏好（preference-dependent）、不依偏好（preference-independent）與主觀三類指標
    items:
    - Preference-dependent：所選方案的相對效用（relative utility，依受試者事前陳述的屬性權重計算所選方案效用，與可得最佳方案效用相比）
    - Preference-independent：所選方案各屬性值加總（sum of the chosen alternative's attribute values），或是否為非被支配方案
    - Subjective：受試者自陳的決策品質／信心／滿意
    scale: 客觀指標為連續值；主觀指標為 Likert 自陳
    reliability: 摘要指出 relative utility 與屬性值加總兩個客觀指標解釋客觀決策品質的大部分變異；主觀指標是客觀指標的弱代理但有增量資訊
    context: 模擬各種推薦代理人的實驗資料
    notes: 全文未開啟，分類與結論取自摘要頁。做公開查詢頁時可用此三分法當「決策正確性」的操作化地圖：有正解的任務用符合率（Vessey 類）、有偏好的選擇任務用 relative utility、再加一條主觀信心題。本次沒有找到經驗證的多題「perceived decision quality」自陳量表（Niese 等 2026 CAIS 與 Vaezi 2019 博士論文有此構念，但 PDF
      被擋，題項未能取得）。
Environmental Uncertainty:
  zh: 環境不確定性
  scales:
  - name: Jaworski & Kohli (1993) Market Turbulence／Technological Turbulence（Mwiru 2017 改編版）
    source: 'Jaworski, B. J., & Kohli, A. K.（1993）。Market orientation: Antecedents and consequences。Journal of Marketing，57(3)，53–70。doi:10.2307/1251854'
    url: https://journals.udsm.ac.tz/index.php/bmr/article/view/1054/980
    definition: 市場動盪＝顧客組成與偏好的變動速度；技術動盪＝產業技術變動的速度
    items:
    - 'Technological turbulence: Technological changes provide opportunities in our industry'
    - 'Technological turbulence: It is difficult to forecast technology in the next two years'
    - 'Technological turbulence: Many new product ideas result from technology breakthrough'
    - 'Technological turbulence: Technological development in our industry are rather minor'
    - 'Market turbulence: New customers tend to have new needs'
    - 'Market turbulence: New customers tend to look for the new products all the time'
    scale: 原文 7-point Likert（1 = strongly disagree，7 = strongly agree）；Mwiru (2017) 改編版為 agree/disagree Likert
    reliability: Mwiru（2017，Business Management Review，坦尚尼亞 178 家服務業）所有量表 α > .80；原文各量表 α 未能從開放來源核對
    context: 美國企業策略事業單位的郵寄問卷（兩組樣本），作為市場導向—績效關係的調節變項；此處題項取自坦尚尼亞服務業（旅館、旅行社、保險）改編版
    notes: 本次只找到改編版題項（技術動盪 4 題、市場動盪 2 題），且 Mwiru 的表格可能未列全市場動盪題；原文附錄（市場動盪與技術動盪各約 4–6 題，含 customers' product preferences change quite a bit over time、the technology in our industry is changing rapidly 等常見引用句）未能從
      JSTOR 以外的來源開啟，逐字引用請回原文。Technological development … are rather minor 為反向題。原文另有 competitive intensity 子量表。
  - name: Miller & Friesen (1982) Environmental Dynamism 五題（Miller & Dröge 1986 所用 Khandwalla 系統）
    source: 'Miller, D., & Friesen, P. H.（1982）。Innovation in conservative and entrepreneurial firms: Two models of strategic momentum。Strategic Management Journal，3(1)，1–25；Miller, D., & Dröge, C.（1986）。Psychological
      and traditional determinants of structure。Administrative Science Quarterly，31(4)，539–560。doi:10.2307/2392963'
    url: https://cejsh.icm.edu.pl/cejsh/element/bwmeta1.element.baztech-327f7dec-e9ef-4baf-b657-5b1f16ff9c82/c/Kwiotkowska_dynamish_org_kwart_3_2018.pdf
    definition: 環境動態性＝顧客與競爭者行為的不可預測性、市場趨勢與產業創新的變動速度（Miller 1987）
    items:
    - Changes in marketing practices are frequent.
    - The ageing rate of products/services is very fast.
    - Competitors' behaviour is unpredictable.
    - The supply of products/services and customers' behaviour are unpredictable.
    - The pace of changes in the production/service provision technology is very fast
    scale: 7-point（1 = I definitely do not agree … 7 = I definitely agree）；Miller 原版為 7-point 對偶陳述語意差異法
    reliability: 原文信度未能從開放來源核對
    context: Miller & Dröge (1986) 以加拿大魁北克中小企業 CEO 問卷，將不確定性（dynamism／heterogeneity／hostility）作為結構的傳統決定因素；此處題項取自 Kwiotkowska（2018，Organization and Management Quarterly，波蘭企業）
    notes: Miller & Dröge (1986) 原文未列題項於開放來源；其 uncertainty 量表承襲 Khandwalla (1977) 與 Miller & Friesen (1982) 的 dynamism 題組。此處五題是 Kwiotkowska 由波蘭文問卷回譯的英文，非 Miller & Friesen 原句（原句常被引為 Our firm must rarely
      change its marketing practices to keep up with the market and competitors … 等對偶陳述，本次未能核對）。Kwiotkowska 同表另有 hostility（Khandwalla 1 題＋Miller & Friesen 2 題）與 complexity（Miller 1987 1 題）。引用時標明為改編版。
  - name: Dess & Beard (1984) 環境面向的檔案指標：Dynamism／Munificence／Complexity
    source: Dess, G. G., & Beard, D. W.（1984）。Dimensions of organizational task environments。Administrative Science Quarterly，29(1)，52–73。doi:10.2307/2393080
    url: https://www.redalyc.org/pdf/3372/337228638003.pdf
    definition: 任務環境以產業層級的客觀統計描述：動態性（不穩定）、豐饒度（成長）、複雜度（集中）
    items:
    - Dynamism（instability）：產業出貨值（value of shipments）、價格—成本邊際、總就業人數、附加價值等序列的離散程度——標準差（或原文：以時間為自變項迴歸該序列後，迴歸斜率的標準誤）除以該序列平均值
    - Munificence（growth）：同一組序列對時間迴歸的斜率係數除以序列平均值；另加事業單位數的年均成長率
    - Complexity（concentration）：產業銷售、附加價值、就業人數、事業單位數在各人口普查分區的地理集中度（各分區值平方和除以總值平方）
    scale: 客觀指標（產業層級；以美國製造業普查資料計算，通常取 5 年窗）
    reliability: 不適用；Porto 等（2008，BASE Revista de Administração e Contabilidade da Unisinos）以 1997–2002 美國 466 個製造業部門複製，因素結構獲得支持
    context: 美國製造業四位數 SIC 產業，1968–1977 普查資料
    notes: 操作化清單取自 Porto, Brito, Silva & Bataglia 的複製研究 Quadro 1（Adaptado de Dess e Beard 1984）；該表的 dynamism 用「標準差／平均」，Dess & Beard 原文與 Keats & Hitt、Misangyi 等的慣用做法是「對時間迴歸的斜率標準誤／平均」（去趨勢後的波動），兩者不同，引用時要說明用哪一種。Sharfman
      & Dean (1991) 批評此法遺漏若干理論面向並提出修訂指標。
  - name: Duncan (1972) Perceived Environmental Uncertainty（simple–complex × static–dynamic）
    source: Duncan, R. B.（1972）。Characteristics of organizational environments and perceived environmental uncertainty。Administrative Science Quarterly，17(3)，313–327。doi:10.2307/2392145
    url: https://www.emerald.com/insight/content/doi/10.1108/00251740210441090/full/html
    definition: 決策單位對環境因素資訊不足、不知決策後果、無法對環境影響賦予機率的知覺；環境以簡單—複雜（因素數量）與靜態—動態（因素變動）兩軸描述
    items: []
    scale: Likert 式題項；第一與第二個不確定性面向各六題（二手文獻描述），例題為「how often do you believe that the information you have about this factor is adequate for decision making?」
    reliability: 多篇回顧指出 Duncan (1972) 與 Lawrence & Lorsch (1967) 量表信度不足；Gerloff 等（1991，Journal of Management，118 位專案經理）以 Duncan 工具得到對應 Milliken 狀態／效果／反應不確定性的三因素
    context: 美國製造與研發組織的 22 個決策單位，對五個外部（顧客、供應商、競爭者、社會政治、技術）與三個內部環境成分評估
    notes: 原文題項未能從開放來源取得（ASQ 全文與 Dulz 1976 密西根州立大學博士論文附錄皆被擋）；emerald 的回顧文章只描述兩軸與成分，rasch.org 的 Yanes-Estévez 等（2006）則用 Duncan 架構以 Rasch 模型重估。改編時多數後續研究改用 Miller (1993) 的 PEU 或 Milliken 三類不確定性，而非 Duncan 原題。
Persistence:
  zh: 堅持
  scales:
  - name: Grit Scale（Grit-O）Perseverance of Effort 子量表（Duckworth et al. 2007）
    source: 'Duckworth, A. L., Peterson, C., Matthews, M. D., & Kelly, D. R.（2007）。Grit: Perseverance and passion for long-term goals。Journal of Personality and Social Psychology，92(6)，1087–1101。doi:10.1037/0022-3514.92.6.1087'
    url: https://www.gwern.net/doc/psychology/personality/conscientiousness/2007-duckworth.pdf
    definition: 恆毅力＝對長期目標的堅持與熱情；perseverance of effort 子向度指面對逆境仍持續努力、把事情做完的傾向
    items:
    - I have achieved a goal that took years of work.
    - I have overcome setbacks to conquer an important challenge.
    - I finish whatever I begin.
    - Setbacks don't discourage me.
    - I am a hard worker.
    - I am diligent.
    scale: 5-point（1 = not at all like me，5 = very much like me）
    reliability: Study 1（1,545 位 25 歲以上成人）：總量表 α = .85，Consistency of Interests α = .84，Perseverance of Effort α = .78；Study 2 總量表 α = .79
    context: 成人網路樣本、常春藤大學生、西點軍校學員、全國拼字比賽選手等六個研究
    notes: Grit-O 共 12 題，另一子向度 Consistency of Interests 六題皆反向計分：I often set a goal but later choose to pursue a different one／New ideas and new projects sometimes distract me from previous ones／I become
      interested in new pursuits every few months／My interests change from year to year／I have been obsessed with a certain idea or project for a short time but later lost interest／I have difficulty maintaining
      my focus on projects that take more than a few months to complete。量表受 APA 版權保護。原文作者以總分為主要指標，但後設分析（Credé et al. 2017）顯示 perseverance of effort 的預測力高於 consistency，單獨用 PE 子量表測「堅持」是常見做法。Grit-S 刪掉 I have
      achieved a goal that took years of work 與 I have overcome setbacks to conquer an important challenge 兩題。
  - name: Short Grit Scale（Grit-S）Perseverance of Effort 四題（Duckworth & Quinn 2009）
    source: Duckworth, A. L., & Quinn, P. D.（2009）。Development and validation of the Short Grit Scale (Grit-S)。Journal of Personality Assessment，91(2)，166–174。doi:10.1080/00223890802634290
    url: https://www.testable.org/scale/grit-s-short-grit-scale
    definition: 同 Grit-O；八題短版，兩子向度各四題
    items:
    - Setbacks don't discourage me
    - I am a hard worker
    - I finish whatever I begin
    - I am diligent
    scale: 5-point（1 = Not like me at all，2 = Not much like me，3 = Somewhat like me，4 = Mostly like me，5 = Very much like me）
    reliability: 總分 α = .73–.83（發展樣本）；Perseverance of Effort α = .60–.78，Consistency of Interest α = .73–.79；Credé 等（2017）後設分析 46 個樣本平均 α 總分 .79、PE .71、CI .74；青少年一年再測 r = .68
    context: 成人與青少年多樣本（含西點軍校、拼字比賽）
    notes: Consistency of Interest 四題（反向）：New ideas and projects sometimes distract me from previous ones／I have been obsessed with a certain idea or project for a short time but later lost interest／I often
      set a goal but later choose to pursue a different one／I have difficulty maintaining my focus on projects that take more than a few months to complete。計分：反向題以 6 減原分，各子向度取平均。無公開常模切點。edutechwiki 另列兩版對照：https://edutechwiki.unige.ch/en/Grit
  - name: Multidimensional Persistence Scale（MPS；Howard & Crayne 2019）
    source: 'Howard, M. C., & Crayne, M. P.（2019）。Persistence: Defining the multidimensional construct and creating a measure。Personality and Individual Differences，139，77–89。doi:10.1016/j.paid.2018.11.005'
    url: https://aquila.usm.edu/fac_pubs/17860
    definition: 堅持＝為達成目標而忍受困難的傾向，分為 persistence despite difficulty（PDD）、persistence despite fear（PDF）與 inappropriate persistence（IP，為無價值目標仍持續）三向度
    items:
    - PDD（例題）：Even if something is hard, I will keep trying at it.
    - PDF（例題）：If something is scary, I will do it anyways.
    - IP（例題）：I will keep trying at something, even if I know my actions are worthless.
    scale: 5-point Likert（土耳其版：1 = Kesinlikle Katılmıyorum／strongly disagree，5 = Kesinlikle Katılıyorum／strongly agree）
    reliability: Howard & Murry（2020，TPM，27(2)，271–277）施測 15 題 MPS：PDF α = .93、PDD α = .83、IP α = .79；Gülbahar 土耳其版（13 題）：PDD .95、PDF .94、IP .80
    context: 六個研究發展的自陳量表；後續用於成人線上樣本與土耳其大學生
    notes: 本次只找到三題例題（各向度一題，取自 Howard & Murry 2020 的方法節）。原文 PAID 全文與 ResearchGate 皆被擋，完整題項請回原文附錄或向作者索取。題數在不同來源不一致：Howard & Murry 說 15 題，土耳其版 13 題（PDD 第 1–5 題、PDF 第 6–10 題、IP 第 11–13 題），原文另有 Goal Time Preference
      補充量表。改編時注意 IP 是「不當堅持」，與 grit 的 perseverance 方向相反，不能加總；Howard & Murry 證明 Courage Measure 與 PDF 幾乎同構（HTMT = .98）。土耳其版全文：https://acikerisim.gelisim.edu.tr/xmlui/handle/11363/6462
  - name: 行為式任務堅持：無解字謎（unsolvable anagrams）與習得無助典範
    source: Feather, N. T., & Simon, J. G.（1971）。Attribution of responsibility and valence of outcome in relation to initial confidence。Journal of Personality and Social Psychology，18(2)，173–188；Määttänen,
      I. 等（2021）。Evidence for a behaviourally measurable perseverance trait in humans。Behavioral Sciences，11(9)，123。doi:10.3390/bs11090123
    url: https://www.millisecond.com/library/unsolvableanagrams
    definition: 堅持＝在無法成功或令人不快的任務上持續投入的時間或嘗試次數
    items:
    - 客觀指標 1：Time on task —— 受試者在無解（或困難）字謎上自願花費的時間（秒），Määttänen 等指出這是文獻中最常用的堅持指標
    - 客觀指標 2：Attempted solutions —— 測驗階段提交的解答次數（the number of submitted solutions for the test）
    - 客觀指標 3：Proportion correct —— 可解題的正確比例（the proportion correctly solved test anagrams），用以區分能力與堅持
    - 程序（Millisecond 版）：5 題練習字謎後接 15 題測驗字謎，其中三分之一無解，每題限時 30 秒，並告知至少答對 8 題才算通過；以練習難度 × 測驗難度做 2×2 設計
    scale: 客觀行為指標（秒數、次數、比例）
    reliability: Määttänen 等（2021，N = 54）以六項行為任務（冷壓、握力、無解字謎、無解語文推理、穿針、無聊影片）得到兩因素結構，共解釋表現時間 37.3% 變異；無解字謎是唯一較受疲勞（depletion）而非特質解釋的任務
    context: 實驗室個別施測；源自 Seligman 習得無助研究中「先經歷不可控失敗、再觀察是否放棄」的典範
    notes: Seligman (1975) 原始論文未在本次開啟，習得無助與字謎堅持的連結取自 Millisecond 與 Määttänen 等的文獻回顧。使用時要注意：(1) 堅持時間會與疲勞、對任務可解性的判斷混淆（在明知無解的題上堅持可能是不理性而非恆毅力）；(2) 需搭配可解題以分離能力；(3) 時間上限（如 30 秒／題）會截斷分布。Behavioral Sciences 全文：https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8468401/
