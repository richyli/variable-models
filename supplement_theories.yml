    desc: Homans（1958）與 Blau（1964）提出：社會關係是報酬與成本的交換歷程，人尋求報酬最大化；在互惠規範下重複交換會累積信任與承諾，使經濟性交換轉為長期的社會性交換關係，替代選擇越有吸引力則依賴與承諾越低。
    refs:
