      - [Feedback, "Goal Specificity -> Job Performance", m]
      - [Task Complexity, "Goal Difficulty -> Job Performance", m]
      - [Self-Efficacy, Goal Commitment, "+"]
  "Two-Factor Theory":
    abbr: Herzberg
    zh: 雙因子理論
    field: 組織行為
    desc: Herzberg（1959）：保健因子不足造成不滿，激勵因子充足才帶來滿意；兩者不是同一連續體。
    edges:
