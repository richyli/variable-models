    desc: Sweller（1988, 1998）提出：工作記憶容量有限，學習總負荷由材料本身的內在負荷、呈現方式造成的外在負荷與建構基模的增生負荷相加；總負荷超出容量會損害學習，教學設計的目標是降低外在負荷、留空間給增生負荷。
    refs:
    - {title: 'IS Theories wiki: Cognitive load theory', url: 'https://is.theorizeit.org/wiki/Cognitive_load_theory'}
    - {title: 'The Decision Lab: Cognitive Load Theory', url: 'https://thedecisionlab.com/reference-guide/psychology/cognitive-load-theory'}
    - {title: 'Learning Scientists: Sources of Cognitive Load', url: 'https://learningscientists.org/blog/2023/7/6'}
    enrich_notes: 保留原四條。依 1998 版三負荷相加模型補 Germane Load -> Cognitive Load（+）；補內在負荷的前因（元素互動性 +、專業知識 −）與外在負荷的前因（教學設計品質 −，涵蓋分散注意、冗餘、形式效應）。Extraneous
      Load -> Germane Load（−）表示外在負荷佔掉可用於基模建構的資源。總負荷超過工作記憶容量才傷害學習，所以把 Working Memory Capacity 畫成調節。Sweller 2010／2019 版把增生負荷改成資源重新分配而非獨立加項，此處採
      1998 版。
  T PT Prospect Theory:
    note: T PT Prospect Theory
    abbr: PT
    zh: 展望理論（框架效應）
    field: 行為經濟
    edges:
    - [Reference Point, Loss Framing, +]
    - [Gain Framing, Risk Seeking, '-']
    - [Loss Framing, Risk Seeking, +]
    - [Loss Aversion, Loss Framing -> Risk Seeking, m]
    - [Certainty Effect, Risk Seeking, '-']
    - [Small Probability Overweighting, Risk Seeking, +]
    - [Loss Aversion, Perceived Risk, +]
    - [Loss Aversion, Switching Intention, '-']
    - [Perceived Risk, Behavioral Intention, '-']
    - [Loss Framing, Behavioral Intention, +]
    - [Reference Point, Gain Framing -> Risk Seeking, m]
    - [Loss Framing, Perceived Risk, +]
    - [Loss Aversion, Risk Seeking, +]
    desc: Kahneman 與 Tversky（1979）提出展望理論：人以參考點判斷得失而非最終財富，價值函數在獲利區凹、損失區凸且損失比等量獲利更痛（損失趨避），機率權重非線性；因此獲利框架下趨避風險、損失框架下尋求風險，描述方式會改變決策。
    refs:
    - {title: Prospect theory - Wikipedia, url: 'https://en.wikipedia.org/wiki/Prospect_theory'}
    - {title: Prospect theory - Britannica, url: 'https://www.britannica.com/topic/prospect-theory'}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 24 章', url: ''}
    enrich_notes: 保留原四條邊。補參考點（Reference Point，新造）：參考點位置決定同一結果被編碼為得或失，故寫成提高損失框架出現的機會。補機率權重兩個效應：確定效應（Certainty Effect）使人偏好確定獲利、降低風險尋求；小機率高估（Small
      Probability Overweighting）使人買彩券、提高風險尋求——兩者在原理論同時作用、產生四重風險態度型態，這裡拆成兩條單向邊以便畫圖。損失趨避→不願轉換（Switching Intention −）是現狀偏誤／稟賦效應的常見應用，Wikipedia
      僅提及應用未展開。Loss Framing -> Behavioral Intention (+) 是健康與說服研究常用的損失框架訊息效果，屬常見實證版本而非原理論命題。
    book_check: Miles 2012 第 24 章對照：補 3 條邊；書中變數我們原本沒有的：Subjective Value、Resistance to Change、Sensation Seeking。框成損失→承擔更多風險、框成獲利→趨避風險為書上明寫（p216）；參考點決定同一選項被框成得或失，故寫成調節。Loss
      Aversion→Risk Seeking 指在損失域寧選「可能的損失」不選「確定的損失」（p216），是我把該敘述轉成邊。Small Probability Overweighting→Risk Seeking 依書上「高估低機率解釋保險、賭博、樂透的吸引力」推的，嚴格說保險是避險、賭博是冒險，方向僅適用賭博面。Loss
      Framing→Perceived Risk 出自管理意涵節（框架影響知覺風險，p220）。書中 risk attitude 對應我們既有 Risk Tolerance。Measuring Variables 列的是 Markowitz
      1952 財富效用問卷、Oreg et al. 2008 抗拒改變量表、Haynes et al. 2000 感官尋求量表、Weber et al. 2002 風險態度量表（DOSPERT）。批評：Levy & Levy（2002）混合展望下得反
      S 形；未納入時間（Kanfer 1990）。
  T CDT Cognitive Dissonance Theory:
    note: T CDT Cognitive Dissonance Theory
    abbr: CDT
    zh: 認知失調理論
    field: 社會心理
    edges:
