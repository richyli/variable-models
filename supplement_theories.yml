      - [Switching cost, "User Satisfaction -> Customer Retention", m]
      - [User Satisfaction, Customer Retention, "+"]
  "Electronic Word-of-Mouth Model":
    abbr: eWOM
    zh: 網路口碑模型
    field: 行銷／數位
    desc: 整理自 eWOM 採用研究（Cheung & Thadani 2012）：訊息品質、來源可信度與評論一致性影響口碑可信度，再影響態度與購買。
    edges:
      - [Review Quality, eWOM Credibility, "+"]
      - [Perceived Credibility, eWOM Credibility, "+"]
      - [Review Consistency, eWOM Credibility, "+"]
      - [Review Volume, Bandwagon Effect, "+"]
      - [eWOM Credibility, Brand Attitude, "+"]
      - [Brand Attitude, Purchase Intention, "+"]
  "Customer Engagement Model":
    abbr: CEng
    zh: 顧客參與（投入）模型
    field: 行銷／顧客
    desc: Brodie et al.（2011）；van Doorn et al.（2010）：滿意、信任與認同驅動顧客的認知、情感與行為投入，投入提升忠誠與口碑。
    edges:
      - [User Satisfaction, Customer Engagement, "+"]
      - [Trust, Customer Engagement, "+"]
      - [Brand Identification, Customer Engagement, "+"]
      - [Customer Engagement, Consumer Loyalty, "+"]
      - [Customer Engagement, Word of Mouth, "+"]
  "Exit, Voice, Loyalty":
    note: "Exit, Voice, Loyalty"
