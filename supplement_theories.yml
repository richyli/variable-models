  Transaction Cost:
    note: Transaction Cost
    abbr: TCE
    zh: 交易成本經濟學
    field: 組織經濟
    edges:
    - [Bounded Rationality, Transaction Cost, +]
    - [Opportunistic Behavior, Transaction Cost, +]
    - [Information Asymmetry, Opportunistic Behavior, +]
    - [Asset Specificity, Opportunistic Behavior, +]
    - [Asset Specificity, Transaction Cost, +]
