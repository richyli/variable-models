    - 'Singh private: I would tell friends and relatives about my bad experience.'
    - 'Singh third-party: I would complain to a consumer agency.'
    scale: ACSI 為 yes/no 與 1–10；Singh 為 6-point likelihood（very unlikely–very likely）
    reliability: ''
