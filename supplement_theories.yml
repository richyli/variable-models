    desc: Hutchins（1995）主張認知分散於人群、內外部結構與時間三面向；Liu、Nersessian 與 Stasko（2008）引入資訊視覺化：工具不只放大記憶，而是把分析任務轉換成較容易的任務，洞見來自內外部表徵耦合。
    edges:
