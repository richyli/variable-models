    desc: Itti、Koch 與 Niebur（1998）提出純由下而上的注意模型：對亮度、色彩對立與方向三類特徵做多尺度中心－周邊差分並正規化，合成一張顯著性地圖，再以勝者全拿與返回抑制機制依顯著度高低逐點轉移注意；局部對比越強的位置越早被注視。
