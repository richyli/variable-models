theories:
  Algorithm Aversion:
    abbr: AlgAv
    zh: 演算法厭惡
    field: AI
    desc: Dietvorst、Simmons 與 Massey（2015, 2018）提出：人看到演算法出錯後，比看到人出錯更快失去信心而改靠人類判斷，即使演算法整體較準；只要讓使用者能小幅修改演算法輸出，滿意、容錯與持續使用都會上升。
    edges:
    - [Algorithm Error Observed, Trust in AI, '-']
    - [Human Error Observed, Trust in AI, +]
    - [Algorithm Error Observed, Reliance on Automation, '-']
    - [Trust in AI, Reliance on Automation, +]
    - [Ability to Modify Algorithm, Reliance on Automation, +]
    - [Ability to Modify Algorithm, User Satisfaction, +]
    - [Ability to Modify Algorithm, Error Tolerance, +]
    - [Error Tolerance, Reliance on Automation, +]
    - [Ability to Modify Algorithm, Algorithm Error Observed -> Reliance on Automation, m]
    - [Reliance on Automation, Decision Accuracy, +]
    refs:
    - {title: 'Dietvorst, Simmons & Massey (2018) Overcoming Algorithm Aversion, Management Science 64(3)', url: 'https://repository.upenn.edu/marketing_papers/389'}
    - {title: 'Wharton working paper PDF: Overcoming Algorithm Aversion', url: 'https://marketing.wharton.upenn.edu/wp-content/uploads/2020/07/Dietvorst-Overcoming-Algorithm-Aversion.pdf'}
    - {title: 'BU: Human Aversion to Algorithms and Ways to Overcome It', url: 'https://www.bu.edu/susilo/?p=59002'}
    enrich_notes: '保留原五條。Human Error Observed -> Trust in AI（+）表示相對信任：看到人類出錯時對演算法的相對信心不降反升。依 2018 年論文補上可修改性提高滿意度、容錯（新造 Error
      Tolerance）與後續使用，並把可修改性畫成「看到錯誤後仍願意依賴」的調節。2015 年原文的 JEP: General 頁面未實際打開，以 2018 年論文頁面與摘要為據。'
  Algorithm Appreciation:
    abbr: AlgApp
    zh: 演算法欣賞
    field: AI
    desc: Logg、Minson 與 Moore（2019）提出：一般人在數值判斷任務上，面對標示為演算法的建議，採納程度反而高於同樣內容的人類建議；但若必須在自己的判斷與演算法之間二選一，或決策者本身是該領域專家，這種欣賞效果就會減弱甚至消失。
    edges:
    - [Algorithmic Advice, Reliance on Automation, +]
    - [Domain Expertise, Reliance on Automation, '-']
    - [Domain Expertise, Algorithmic Advice -> Reliance on Automation, m]
    - [Comparison with Own Judgment, Reliance on Automation, '-']
    - [Task Objectivity, Reliance on Automation, +]
    - [Algorithm Error Observed, Reliance on Automation, '-']
    - [Reliance on Automation, Decision Accuracy, +]
    refs:
    - {title: 'Algorithm appreciation: People prefer algorithmic to human judgment (OBHDP 2019, eScholarship 全文)', url: 'https://escholarship.org/uc/item/9v38k9m6'}
    - {title: Harvard Kennedy School publication record, url: 'https://www.hks.harvard.edu/publications/algorithm-appreciation-people-prefer-algorithmic-human-judgment'}
    - {title: 'IDEAS/RePEc record, OBHDP 151, 90–103', url: 'https://ideas.repec.org/a/eee/jobhdp/v151y2019icp90-103.html'}
    enrich_notes: 保留原三條。依原文六個實驗補上兩個邊界條件：（1）受試者要在自己的估計與演算法估計之間二選一時，欣賞效果消失（新構念 Comparison with Own Judgment）；（2）專家依賴較少，且專家身分同時調節演算法建議的效果。Reliance
      on Automation -> Decision Accuracy 來自原文「依賴演算法建議者準確度較高」的結果。Task Objectivity 一邊不在 Logg 等人原文，而是 Castelo、Bos 與 Lehmann（2019）的發現，作為常見實證版本保留；Algorithm
      Error Observed 一邊來自 Dietvorst 等人（2015）的演算法厭惡，用來標示欣賞效果的另一個邊界。
  AI Avoidance Model:
    abbr: AIAvoid
    zh: AI 迴避（演算法迴避）前因模型
    field: AI
    desc: 整理自演算法厭惡的系統性回顧（Jussupow、Benbasat 與 Heinzl 2020；Mahmud 等人 2022）：演算法的能動性、績效與可修改性、任務的主觀性、使用者的專業與焦慮，以及親眼見到演算法出錯，共同決定人們對演算法的偏見性負評與實際迴避行為。
    edges:
    - [Perceived Uniqueness Neglect, Algorithm Aversion, +]
    - [Algorithm Transparency, Algorithm Aversion, '-']
    - [Automation Reliability, Algorithm Aversion, '-']
    - [Ability to Modify Algorithm, Algorithm Aversion, '-']
    - [Human Involvement, Algorithm Aversion, '-']
    - [Task Subjectivity, Algorithm Aversion, +]
    - [Domain Expertise, Algorithm Aversion, +]
    - [Perceived Anthropomorphism, Algorithm Aversion, '-']
    - [Algorithm Error Observed, Algorithm Aversion, +]
    - [Human Error Observed, Algorithm Aversion, '-']
    - [Algorithm Aversion, AI Avoidance, +]
    - [AI Anxiety, AI Avoidance, +]
    - [Algorithm Aversion, Reliance on Automation, '-']
    refs:
    - {title: 'Why are we averse towards Algorithms? A comprehensive literature Review on Algorithm aversion (ECIS 2020)',
      url: 'https://aisel.aisnet.org/ecis2020_rp/168/'}
    - {title: 'What influences algorithmic decision-making? A systematic literature review on algorithm aversion (Mahmud et
        al. 2022, IDEAS record)', url: 'https://ideas.repec.org/a/eee/tefoso/v175y2022ics0040162521008210.html'}
    - {title: A Systematic Review of Algorithm Aversion in Augmented Decision Making (CBS record), url: 'https://research.cbs.dk/en/publications/a-systematic-review-of-algorithm-aversion-in-augmented-decision-m/'}
    enrich_notes: 保留原八條。依 Jussupow 等人（2020）六類因素補：演算法績效（以名單裡的 Automation Reliability 代表）、人類參與、以及使用者可修改演算法（Dietvorst 等人 2018）；依
      Dietvorst 等人（2015）補「看到人出錯反而較寬容」的對照邊。Perceived Anthropomorphism 的負向在回顧文獻裡並不一致（Jussupow 指出擬人化有時加深厭惡），保留但要讀成「多數實驗方向」。
  Uniqueness Neglect in Medical AI:
    abbr: UNegl
    zh: 獨特性忽視
    field: AI
    desc: Longoni、Bonezzi 與 Morewedge（2019）提出：消費者抗拒 AI 醫療，是因為擔心 AI 比人類更無法考量自己的獨特狀況；自認越獨特的人抗拒越強，但服務框成個人化、對象是他人或 AI 只輔助醫師決策時，抗拒會消失。
    edges:
    - [AI Provider, Perceived Uniqueness Neglect, +]
    - [Perceived Uniqueness Neglect, Utilization Intention, '-']
    - [AI Provider, Utilization Intention, '-']
    - [Perceived Uniqueness Neglect, Willingness to Pay, '-']
    - [Perceived Self-Uniqueness, AI Provider -> Perceived Uniqueness Neglect, m]
    - [Personalization, AI Provider -> Perceived Uniqueness Neglect, m]
    - [Decision Target Is Other, AI Provider -> Utilization Intention, m]
    - [AI in Support Role, AI Provider -> Utilization Intention, m]
    refs:
    - {title: 'Longoni, Bonezzi & Morewedge (2019) Resistance to Medical Artificial Intelligence, JCR 46(4)', url: 'https://ideas.repec.org/a/oup/jconrs/v46y2019i4p629-650..html'}
    - {title: 'NYU Stern research highlight: Patients are resistant to medical AI', url: 'https://www.stern.nyu.edu/experience-stern/faculty-research/patients-are-resistant-medical-ai-and-prefer-human-medical-providers-new-study-finds'}
    - {title: 'Pezzo & Beckstead (2020) critique, Judgment and Decision Making 15(3)', url: 'https://dlab.sauder.ubc.ca/sjdm/journal/19/191111a/jdm191111a.html'}
    enrich_notes: Personalization 原本寫成直接負向前因，依原論文 study 7 改成調節（個人化框架消除 AI 提供者對獨特性忽視的效果）。新增自我獨特性（study 5）、對象是他人（study 8）、AI
      只輔助（study 9）三個邊界條件，以及保留價格（新造 Willingness to Pay，study 2）。Pezzo & Beckstead（2020）指出效果只在 AI 與人類績效相同時成立，AI 明顯較優時反而偏好 AI；這條未畫入，記在此備查。
  Trust in Automation:
    abbr: TiA
    zh: 自動化信任模型
    field: AI
    desc: Lee 與 See（2004）：對自動化的信任是一種態度，由系統的表現（可靠度）、過程（運作方式可理解）、目的（設計意圖與使用者目標一致）三類資訊形成，並受個人信任傾向影響；信任決定依賴，依賴結果回饋再修正信任，信任應校準到系統真實能力。
    edges:
    - [Automation Reliability, Trust in AI, +]
    - [System Transparency, Trust in AI, +]
    - [Purpose Alignment, Trust in AI, +]
    - [Disposition to Trust, Trust in AI, +]
    - [Algorithm Error Observed, Trust in AI, '-']
    - [Trust in AI, Reliance on Automation, +]
    - [Self-Confidence, Reliance on Automation, '-']
    - [Workload, Reliance on Automation, +]
    - [Reliance on Automation, Automation Bias, +]
    - [Reliance on Automation, Decision Accuracy, +]
    - [Automation Reliability, Reliance on Automation -> Decision Accuracy, m]
    refs:
    - {title: 'Trust in Automation: Designing for Appropriate Reliance (Lee & See, 2004; Aalto course copy)', url: 'https://mycourses.aalto.fi/pluginfile.php/1903876/course/section/223217/Lee%20and%20See%20-%202004%20-%20Trust%20in%20Automation%20Designing%20for%20Appropriate%20Rel.pdf'}
    - {title: A Systematic Review on Fostering Appropriate Trust in Human-AI Interaction (arXiv 2311.06305), url: 'https://arxiv.org/pdf/2311.06305'}
    - {title: Development of a Chinese Human-Automation Trust Scale (arXiv 2403.16406), url: 'https://arxiv.org/pdf/2403.16406'}
    enrich_notes: 原五條保留。補 Lee–See 動態迴圈中的信任傾向、觀察到錯誤後的信任下修（回饋邊）、情境因素（工作負荷促進依賴、自我信心抑制依賴）以及「適當信任」的意涵：依賴對決策準確度的效果取決於系統可靠度（可靠度低時依賴反而有害，所以用調節表示）。Reliance
      → Automation Bias 是過度依賴的結果，延續原始寫法。
  Automation Bias and Complacency:
    abbr: AutoBias
    zh: 自動化偏誤與自滿
    field: AI
    desc: Parasuraman 與 Manzey（2010）整合模型主張，自滿與自動化偏誤是同一組注意力機制的不同表現：高可靠度、高信任與多工負荷讓操作者減少監控，傾向順從自動化建議，產生遺漏與誤從錯誤；課責與訓練只能部分抑制。
    edges:
    - [Automation Reliability, Trust, +]
    - [Automation Reliability, Complacency, +]
    - [Trust, Complacency, +]
    - [Workload, Complacency, +]
    - [Workload, Automation Bias, +]
    - [Complacency, Monitoring, '-']
    - [Complacency, Automation Bias, +]
    - [Automation Bias, Reliance on Automation, +]
    - [Accountability, Automation Bias, '-']
    - [Monitoring, Decision Error, '-']
    - [Automation Bias, Decision Error, +]
    - [Automation Reliability, Automation Bias -> Decision Error, m]
    refs:
    - {title: 'Parasuraman & Manzey (2010) Complacency and Bias in Human Use of Automation: An Attentional Integration (TRID
        record)', url: 'https://trid.trb.org/View/1085175'}
    - {title: Merritt et al. (2019) Automation-induced complacency potential (Frontiers in Psychology), url: 'https://www.frontiersin.org/articles/10.3389/fpsyg.2019.00225/full'}
    enrich_notes: 原五條邊保留。依原論文摘要與 Merritt et al. 補注意力機制：可靠度→信任→自滿、多工負荷→自滿（手動任務搶走注意力）、自滿→監控不足→錯誤。自動化偏誤只在自動化不完美時才造成遺漏／誤從錯誤，故以
      Automation Reliability 調節 Automation Bias -> Decision Error（可靠度低時錯誤才會發生）。課責降低自動化偏誤出自 Skitka 等人的早期研究，TRID 摘要未提，保留原邊並在此註明來源不在本次打開的頁面。遺漏錯誤與誤從錯誤合併為
      Decision Error。
  CASA - Computers are social Actors:
    note: CASA - Computers are social Actors
    abbr: CASA
    zh: 電腦是社會行動者
    field: AI
    edges:
    - [Social Cues, Social Response, +]
    - [Mindless Processing, Social Cues -> Social Response, m]
    - [Social Cues, Perceived Anthropomorphism, +]
    - [Perceived Anthropomorphism, Social Response, +]
    - [Social Cues, Social Presence, +]
    - [Social Presence, Social Response, +]
    - [Social Response, Trust in AI, +]
    - [Social Response, User Satisfaction, +]
    desc: Nass 等（1994）與 Nass 與 Moon（2000）提出：只要電腦呈現足夠的社會線索（語言、互動性、聲音），人就會不假思索地把人際社交規則套用到機器上，產生禮貌、互惠、性別刻板印象等社會反應，即使明知對方不是人。
    refs:
    - {title: Computers are social actors (Wikipedia), url: 'https://en.wikipedia.org/wiki/Computers_are_social_actors'}
    - {title: 'Computers Are Social Actors: A New Paradigm and Some Surprising Results (Stanford HCI seminar abstract)', url: 'https://hci.stanford.edu/seminar/abstracts/92-93/921104-nass.html'}
    - {title: 'Human-Machine Communication Journal 2021 (Lombard and Xu, Media Are Social Actors)', url: 'https://doaj.org/article/154961561dca40c8b594f4eb9baadf82'}
    enrich_notes: 原四條保留。CASA 原始主張是社會線索「直接且不經思索」觸發社會反應，所以補上 Social Cues→Social Response 的直接邊，並以 Mindless Processing 當調節（Nass
      與 Moon 2000：專注檢視情境的人會抑制反應）。經擬人化感知的路徑屬 Lombard 與 Xu（2021）MASA 的「mindful」路線，保留為並行機制。信任與滿意度兩條是 AI 研究的常見延伸，原典無。
  MAIN Model:
    abbr: MAIN
    zh: MAIN 模型（模態、行動者、互動性、導航性）
    field: AI
    desc: Sundar（2008）：數位媒介的模態、行動者、互動性、導航性四種可供性各自傳遞線索，觸發真實感、機器、權威、從眾等可信度捷思，在低投入時快速形成品質與可信度判斷，進而影響態度與行為。
    edges:
    - [Modality Cues, Credibility Heuristics, +]
    - [Agency Cues, Credibility Heuristics, +]
    - [Interactivity Cues, Credibility Heuristics, +]
    - [Navigability Cues, Credibility Heuristics, +]
    - [Agency Cues, Machine Heuristic, +]
    - [Bandwagon Cues, Credibility Heuristics, +]
    - [Machine Heuristic, Perceived Credibility, +]
    - [Credibility Heuristics, Perceived Credibility, +]
    - [Credibility Heuristics, Perceived Quality, +]
    - [Involvement, Credibility Heuristics -> Perceived Credibility, m]
    - [Perceived Credibility, Attitude, +]
    refs:
    - {title: 'The MAIN Model: A Heuristic Approach to Understanding Technology Effects on Credibility (IssueLab)', url: 'https://search.issuelab.org/resource/the_main_model_a_heuristic_approach_to_understanding_technology_effects_on_credibility'}
    - {title: 'Designing for Responsible Trust in AI Systems: A Communication Perspective (arXiv, applies MAIN)', url: 'https://arxiv.org/pdf/2204.13828'}
    enrich_notes: 保留原五條。依 Sundar 的捷思清單把名單既有的 Machine Heuristic 與 Bandwagon Cues 掛在行動者（agency）可供性下；捷思同時影響品質與可信度判斷。涉入調節表示捷思在低投入時主導（與
      HSM 一致）。原始章節無統計方向，全部依後續實證（如 Sundar 實驗室研究）取正向。
  Machine Heuristic:
    abbr: MachH
    zh: 機器捷思
    field: AI
    desc: Sundar 與 Kim（2019）提出：介面只要顯示來源是機器（代理線索），就會啟動「機器客觀、不帶偏見、比人安全」的捷思，使人們更願意對機器揭露敏感資訊；原本就相信機器客觀的人效果更強。此捷思源自 Sundar（2008）MAIN
      模型中的代理可供性。
    edges:
    - [Agency Cues, Machine Heuristic, +]
    - [Belief in Machine Objectivity, Agency Cues -> Machine Heuristic, m]
    - [Involvement, Agency Cues -> Machine Heuristic, m]
    - [Machine Heuristic, Message Objectivity, +]
    - [Machine Heuristic, Perceived Credibility, +]
    - [Machine Heuristic, Trust in AI, +]
    - [Message Objectivity, Trust in AI, +]
    - [Machine Heuristic, Privacy Concern, '-']
    - [Trust in AI, Information Disclosure, +]
    - [Privacy Concern, Information Disclosure, '-']
    refs:
    - {title: 'Machine Heuristic: When We Trust Computers More Than Humans with Our Personal Information (CHI 2019, Springer
        Professional record)', url: 'https://www.springerprofessional.de/doi/10.1145/3290605.3300768'}
    - {title: 'Machine heuristic: concept explication and development of a measurement scale (Yang & Sundar 2024, Penn State
        record)', url: 'https://pure.psu.edu/en/publications/machine-heuristic-concept-explication-and-development-of-a-measur/'}
    - {title: 'Designing for Responsible Trust in AI Systems: A Communication Perspective (arXiv)', url: 'https://arxiv.org/pdf/2204.13828'}
    enrich_notes: 保留原四條。補上 2019 原文的依變項（信用卡資料揭露，命名為 Information Disclosure）與「既有機器捷思信念」的調節（Belief in Machine Objectivity）。Involvement
      的調節來自捷思－系統式處理的一般假設（低涉入時捷思作用較強），是 MAIN 模型的脈絡假設，非 2019 原文檢驗。Yang 與 Sundar（2024）的量表把機器捷思視為形成性構念（專家、有效率、僵化、公平等），本結構不展開。
