    desc: Jensen 與 Meckling（1976）提出：委託人將工作交給代理人時，因目標衝突與資訊不對稱產生代理問題（道德風險、逆選擇），衍生監督、保證與剩餘損失等代理成本；Eisenhardt（1989）整理出契約選擇的命題：結果不確定性高、代理人越規避風險，就越不適合用結果導向契約，資訊系統與監督則使行為導向契約可行。
    refs:
    - {title: Agency theory (IS Theories wiki), url: 'https://is.theorizeit.org/wiki/Agency_theory'}
    - {title: 'Agency Theory: An Assessment and Review (Eisenhardt 1989, USP copy)', url: 'https://edisciplinas.usp.br/pluginfile.php/7948441/mod_resource/content/3/Eisenhard%20-%20Agency%20Theory.pdf'}
    - {title: Agency theory (Newcastle open theory library), url: 'https://open.ncl.ac.uk/theories/21/agency-theory/'}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 3 章', url: ''}
    enrich_notes: 保留原六條，調節邊改成本批規定的格式。補 Jensen 與 Meckling 的兩種代理問題型態（道德風險、逆選擇）與「監督本身是代理成本的一部分」（故 Monitoring 同時降低代理問題、提高代理成本，兩條並存不矛盾）。另依
      Eisenhardt（1989）命題 2、3、5、7 補契約選擇的前因：結果不確定性、代理人風險規避、目標衝突、結果可衡量性。原理論是演繹經濟學，方向依命題陳述轉換。
    book_check: Miles 2012 第 3 章對照：補 6 條邊；書中變數我們原本沒有的：Behavior-based Contract、Required Specialized Knowledge、Board Independence、Managerial
      Equity Ownership、Market for Corporate Control。書上明寫：資訊不對稱→逆選擇（代理人誇大能力）與道德危機（少做多拿）；代理人自主性與所需專業知識越高，道德危機越嚴重（Holmstrom 1979）；利益分歧→代理問題；三個抑制手段為董事會獨立、公司控制權市場、經理人持股，且各有成本。但書也引
      Dalton 等（2003, 2007）、Ghoshal（2005）的回顧：獨立董事與董事長／CEO 分任對公司績效無影響，所以 Board Independence→Agency Problem 的負向邊是理論主張、實證不支持。書只列出『結果不確定性、結果可衡量性、風險趨避、目標衝突』是契約效率的條件，未寫方向，調節邊是我依
      Eisenhardt 命題的常識推的。『Autonomy』沿用我們既有名稱（原屬 SDT），此處指代理人的自主程度。量表：Jaworski 與 Young（1992）資訊不對稱量表、Dunk（1993）預算鬆弛與資訊不對稱、Tuttle
      等（1997）道德危機。
