    desc: Gutman（1982）提出：消費者把產品屬性當成達成個人價值的手段，認知結構依「屬性→功能性結果→心理社會結果→工具性價值→終極價值」逐層抽象；價值決定屬性的重要性，並用階梯訪談（laddering）揭露這條鏈。
    refs:
    - {title: Means-end theory and laddering technique (Hochschule Nordhausen teaching page), url: 'https://www.hs-nordhausen.de/en/additional-material/3-3-means-end-theory-and-laddering-technique/'}
