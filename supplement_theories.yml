        services (Exeter repository)', url: 'https://ore.exeter.ac.uk/repository/handle/10871/125289'}
    - {title: 'Huefner & Hunt (1994) Extending the Hirschman Model: When Voice and Exit Don''t Tell the Whole Story (JCSDCB)',
      url: 'https://jcsdcb.com/index.php/JCSDCB/article/view/599'}
    enrich_notes: 原六條邊保留。Hirschman 原書是論述式沒有正負號；方向依最常見的實證轉述：替代選項多則退出而非發聲（故 Alternative Attractiveness -> Voice 為負）、發聲成本（Voice
      Cost，新造）降低發聲、預期影響力（Perceived Influence，新造）提高發聲；忠誠延後退出並提高發聲是 Hirschman 的核心命題，雖然 Exeter 的調查實驗未找到忠誠的調節證據，但找到供應者回應提高滿意、降低退出且效果受忠誠強化，故補
      Service Recovery 的兩條邊與忠誠調節。Neglect（新造）來自 Rusbult 等人的 EVLN 擴充。Wikipedia 條目把模型寫成公民—政府賽局，此處採顧客／組織版本。
