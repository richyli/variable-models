    - [Perceived Severity, Fear, +]
    - [Perceived Susceptibility, Fear, +]
    - [Fear, Protection Motivation, +]
    - [Response Efficacy, Protection Motivation, +]
    - [Self-Efficacy, Protection Motivation, +]
    - [Response Cost, Protection Motivation, '-']
    - [Protection Motivation, Behavior, +]
    refs:
    - {title: 'Newcastle University Open Education: Protection Motivation Theory', url: 'https://open.ncl.ac.uk/theories/10/protection-motivation-theory/'}
