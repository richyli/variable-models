    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 23 章', url: ''}
    - {title: 'Elliott & Thomson (2010) The social cognitive determinants of offending drivers'' speeding behaviour, Accident
        Analysis & Prevention — Strathprints', url: 'https://strathprints.strath.ac.uk/26365/'}
    - {title: 'Conner, Lawton, Parker et al. (2007) Application of the TPB to the prediction of objectively assessed breaking
        of posted speed limits — Cardiff ORCA', url: 'https://orca.cardiff.ac.uk/id/eprint/32791/'}
    - {title: 'Hai, Minh & Huynh (2024) TPB 於駕駛行為的統合分析（42 篇），Int. J. Transportation Science and Technology', url: 'https://doaj.org/article/eacb88cd975740ba8676cf2e6bafbd24'}
    - {title: 'Fishbein & Ajzen (2010), Predicting and Changing Behavior: The Reasoned Action Approach, Psychology Press（Routledge
        書目）', url: 'https://www.routledge.com/Predicting-and-Changing-Behavior-The-Reasoned-Action-Approach/Fishbein-Ajzen/p/book/9781138995215'}
    - {title: Reasoned action approach (Wikipedia 彙整), url: 'https://en.wikipedia.org/wiki/Reasoned_action_approach'}
    enrich_notes: |-
      原檔九條邊中四條符號空白與五條正號重複，去重為五條。補 Ajzen 模型的信念層（Behavioral Beliefs、Normative Beliefs、Control Beliefs 新造）與知覺行為控制調節意圖→行為（Wikipedia：意圖只在控制感高時轉化為行為，且 PBC 須反映實際控制才有預測力）。
      只補 TPB 原型缺的擴充邊，以超速與酒駕研究為實證來源。符號以「焦點行為」為準：Personal Norm（道德規範）是對焦點行為的道德義務感，故正向；超速研究量到的是「不該超速」的義務感，對超速意圖為負，是同一條邊的鏡像。Anticipated Regret 是對做出風險行為的預期後悔，故對意圖與行為皆負。
      只補背景因素→信念的邊；Fishbein & Ajzen（2010）明言背景因素可影響三類信念中的任一類、方向是經驗問題，此處正號僅表示「有影響」，實際方向依議題而定。Media Use（媒體與資訊來源暴露）、Experience（過去經驗）、Knowledge、Personal Values 皆為書中列出的背景因素類別。信念→態度／規範／控制→意圖→行為沿用既有 TPB 條目，不重複。
    book_check: Miles 2012 第 23 章對照：補 3 條邊；書中變數我們原本沒有的：Self-Identity、Descriptive Norm、Intention Stability、Anticipated Regret、Implementation
      Intentions。前五條邊為書上明寫（p207–208）；PBC→Behavior 直接效果書上說證據混雜，Ajzen & Madden（1986）在低控制感時才有直接效果。PBC×Intention 交互作用為 Ajzen（1991）預期但多數研究不支持（p208），故不入邊。Self-Identity
      增加 6–9% 意圖解釋量（Sutton 1998；Rise et al. 2010）、過去行為為控制變數，邊是我依該段推的。意圖→行為的調節變數書上列了一串（時間穩定性、需求滿足、實行意圖、意圖穩定性、預期後悔、描述性規範、人格、年齡），只挑意圖穩定性入邊，其餘列入缺的變數。書中
      moral norms 對應我們既有 Personal Norm（NAM）。PBC 應拆成 Self-Efficacy 與 Controllability 兩構念（Kraft et al. 2005），兩者我們都有。Measuring
      Variables：Elliott et al. 2003、Cordano & Frieze 2000、Carr & Sequeira 2007、Moan & Rise 2006。
