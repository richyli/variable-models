    enrich_notes: 保留原三條，Bandwagon Effect 當作「被觸發的從眾捷思／從眾知覺」中介變數。依 MAIN 模型補上代理線索（Agency Cues）為觸發源、評論數量（Review Volume）為具體線索，以及可信度到態度到意圖的標準說服鏈。Involvement
