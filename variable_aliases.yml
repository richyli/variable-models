# 7. 變數群組（2026-10-16）：依序比對 keywords（正規表示式，不分大小寫，對變數名與別名），第一個命中的群組就是它的群；
#    members 可以手動指定（優先於 keywords）。頁面「相關變數」會列同群變數，側欄可切成依群組瀏覽。
clusters:
  - name: 危機與聲譽
    keywords: ["crisis", "reputation", "responsib", "attribution", "\\blocus\\b", "stability", "controllability"]
  - name: 捐款與利他
    keywords: ["donat", "altruis", "warm glow", "victim", "statistical information", "charit", "helping"]
  - name: 永續與綠色
    keywords: ["green", "ecological", "product lifetime", "sustainab", "csr", "stakeholder"]
  - name: 品牌、廣告與口碑
    keywords: ["brand", "word of mouth", "ewom", "review", "\\bad\\b", "sponsorship", "source (expertise|attractiveness|trustworthiness)"]
  - name: 轉換與留存
