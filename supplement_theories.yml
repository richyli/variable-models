    - [Task Transformation, Cognitive Load, '-']
    - [External Representation Quality, Internal-External Coupling, +]
    - [Interaction Affordance, Internal-External Coupling, +]
    - [Internal-External Coupling, Insight Generation, +]
    - [Artifact Mediation, Cognitive Offloading, +]
    - [Social Distribution of Cognition, Shared Mental Model, +]
    - [Shared Mental Model, Team Performance, +]
    - [Representation Propagation Across Time, Task Transformation, +]
