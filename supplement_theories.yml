    edges:
    - [Perceived Severity, Protection Motivation, +]
    - [Perceived Susceptibility, Protection Motivation, +]
    - [Maladaptive Response Rewards, Protection Motivation, '-']
    - [Perceived Severity, Fear, +]
    - [Perceived Susceptibility, Fear, +]
    - [Fear, Protection Motivation, +]
    - [Response Efficacy, Protection Motivation, +]
    - [Self-Efficacy, Protection Motivation, +]
    - [Response Cost, Protection Motivation, '-']
    - [Protection Motivation, Behavior, +]
    refs:
    - {title: 'Newcastle University Open Education: Protection Motivation Theory', url: 'https://open.ncl.ac.uk/theories/10/protection-motivation-theory/'}
    - {title: 'Encyclopedia.pub: Protection Motivation Theory', url: 'https://encyclopedia.pub/entry/28091'}
    - {title: 'The Behavioral Scientist: What is Protection Motivation Theory', url: 'https://www.thebehavioralscientist.com/glossary/protection-motivation-theory'}
    enrich_notes: 保留原六條。依 Rogers 1983 年修訂版補上威脅評估中的「不採取行動的內外在獎賞」（新造 Maladaptive Response Rewards，負向）與恐懼的中介（嚴重性、易感性 -> 恐懼 ->
      保護動機，Floyd、Prentice-Dunn 與 Rogers 2000 年的完整模型）。1975 年原版是乘法模型，1983 年版改為可分離的加法效果，這裡採 1983 年版。未另建 Perceived Threat／Perceived
      Efficacy 兩個聚合節點，以免與 EPPM 重複。
  Health Belief Model:
