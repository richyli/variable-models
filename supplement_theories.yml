    - [Perceived Behavioral Control, Behavior, +]
    - [Behavioral Intention, Behavior, +]
    - [Perceived Behavioral Control, Behavioral Intention -> Behavior, m]
    - [Self-Identity, Behavioral Intention, +]
    - [Prior Behavior Frequency, Behavioral Intention, +]
    - [Intention Stability, Behavioral Intention -> Behavior, m]
    desc: Ajzen（1985、1991）在理性行動論上加入知覺行為控制，提出計畫行為理論：行為信念、規範信念與控制信念分別形成態度、主觀規範與知覺行為控制，三者決定行為意圖，意圖與知覺行為控制共同預測行為；控制感愈準確，意圖愈能轉化為行為。
    refs:
    - {title: Theory of planned behavior - Wikipedia, url: 'https://en.wikipedia.org/wiki/Theory_of_planned_behavior'}
    - {title: 'What is The Theory Of Planned Behavior In Behavior Change? (The Behavioral Scientist)', url: 'https://www.thebehavioralscientist.com/glossary/theory-of-planned-behavior'}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 23 章', url: ''}
    enrich_notes: 原檔九條邊中四條符號空白與五條正號重複，去重為五條。補 Ajzen 模型的信念層（Behavioral Beliefs、Normative Beliefs、Control Beliefs 新造）與知覺行為控制調節意圖→行為（Wikipedia：意圖只在控制感高時轉化為行為，且
      PBC 須反映實際控制才有預測力）。
    book_check: Miles 2012 第 23 章對照：補 3 條邊；書中變數我們原本沒有的：Self-Identity、Descriptive Norm、Intention Stability、Anticipated Regret、Implementation
      Intentions。前五條邊為書上明寫（p207–208）；PBC→Behavior 直接效果書上說證據混雜，Ajzen & Madden（1986）在低控制感時才有直接效果。PBC×Intention 交互作用為 Ajzen（1991）預期但多數研究不支持（p208），故不入邊。Self-Identity
      增加 6–9% 意圖解釋量（Sutton 1998；Rise et al. 2010）、過去行為為控制變數，邊是我依該段推的。意圖→行為的調節變數書上列了一串（時間穩定性、需求滿足、實行意圖、意圖穩定性、預期後悔、描述性規範、人格、年齡），只挑意圖穩定性入邊，其餘列入缺的變數。書中
      moral norms 對應我們既有 Personal Norm（NAM）。PBC 應拆成 Self-Efficacy 與 Controllability 兩構念（Kraft et al. 2005），兩者我們都有。Measuring
      Variables：Elliott et al. 2003、Cordano & Frieze 2000、Carr & Sequeira 2007、Moan & Rise 2006。
  T Social Identity Theory:
    note: T Social Identity Theory
    abbr: SIT
    zh: 社會認同理論
    field: ''
    edges:
    - [Social Categorization, Social Identity, +]
    - [Social Categorization, Social Groups Distinction, +]
    - [Personal Identify, Social Identity, '-']
