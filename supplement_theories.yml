    enrich_notes: 保留原四條，Behavior 在這裡代表努力（effort）。補上 Vroom 鏈的後段（努力 -> 績效 -> 報酬）與 Wikipedia 條目列出的期望前因（自我效能、目標難度、知覺控制）與工具性前因（對分配者的信任）。原理論是乘法模型，有向圖無法表達相乘，三條到
