    enrich_notes: 原八條其實是四條重複（空符號＋ +），已去重。Behavior 在此指使用（utilization）。把原本的 Benefit 改名為既有變數 Individual Impact，因為 Goodhue 與 Thompson
      的因變數是個人層次的績效影響（performance impacts）。補個人特性作為適配的第三個前因、使用→績效與適配的調節（Goodhue 後來的詮釋），以及 TPC 中使用的前因（期望結果、社會規範、習慣、促成條件）。
  T UTAUT:
    note: T UTAUT
    abbr: UTAUT
    zh: 整合型科技接受模型
