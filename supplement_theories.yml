    enrich_notes: |-
      保留原四條。依 D'Arcy 等人（2009）補：安全意識同時提高嚴厲性知覺、電腦監控提高確定性知覺、道德承諾為負向前因並調節制裁效果（原文發現嚴厲性的嚇阻效果大於確定性）。Informal Sanctions（羞恥、同儕非難）是 Herath 與 Rao（2009）、Siponen 與 Vance（2010）後的常見擴充版本，原始 GDT 只談正式制裁。
      既有 Deterrence Theory 只有資安脈絡的制裁三要素，此處補交通執法版本：Homel 的核心是隨機酒測（執法強度與能見度、媒體宣傳）先拉高「被抓的知覺風險」，再抑制酒駕；確定性效果強於嚴厲性與迅速性是 Homel 與 AIC 回顧的一致結論。Sanction Certainty／Severity／Celerity 沿用既有變數。
