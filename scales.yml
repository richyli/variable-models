    - 'Expectedness: This behavior was [expected – unexpected].'
    - 'Expectedness: [He/she/it] behaved differently from what I expected.'
    - 'Violation valence: The unexpected behavior was [negative – positive].'
    - 'Violation importance: How important was this violation to you?'
