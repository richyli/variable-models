      - [Compatibility, Adoption, "+"]
      - [Complexity, Adoption, "-"]
      - [Trialability, Adoption, "+"]
      - [Observability, Adoption, "+"]
  "Technostress Model":
    abbr: TStress
    zh: 科技壓力模型
    field: 組織／IS
    desc: Tarafdar et al.（2007）；Ragu-Nathan et al.（2008）：超載、入侵、複雜等壓力源降低滿意與持續使用，技術支援可抑制。
    edges:
      - [Techno-overload, Technostress, "+"]
      - [Techno-invasion, Technostress, "+"]
      - [Techno-complexity, Technostress, "+"]
      - [Technical Support, Technostress, "-"]
      - [Technostress, User Satisfaction, "-"]
      - [Technostress, Continuance Intention, "-"]
  "Status Quo Bias Theory":
    abbr: SQB
    zh: 現狀偏誤理論（使用者抗拒）
    field: IS
    desc: Kim & Kankanhalli（2009）：轉換成本提高抗拒、轉換利益降低抗拒；自我效能與組織支持間接作用。
    edges:
      - [Switching cost, User Resistance, "+"]
      - [Switching Benefits, User Resistance, "-"]
      - [Self-Efficacy, Switching cost, "-"]
      - [Organizational Support, Switching cost, "-"]
      - [Social Norm, User Resistance, "-"]

  # ───────── 行銷／顧客 ─────────
  "Push-Pull-Mooring":
    abbr: PPM
    zh: 推拉繫住模型（轉換行為）
    field: 行銷／IS
