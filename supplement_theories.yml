    desc: Small、Loewenstein 與 Slovic（2007）：單一、有名有臉的受害者比統計數字更能引發同情與責任感而促進捐款；受害者人數增加同情反而遞減，深思熟慮會削弱對可辨識受害者的同情，卻不會提高對統計受害者的捐款。
