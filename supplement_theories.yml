# 補充的常見理論（2026-10-16）
# 這些理論在 vault 裡沒有獨立的理論 note（有 note 的用 note: 指回去），結構是依教科書／原始論文整理的標準版本，
# 頁面上一律畫虛線並標「補充理論」。每條邊：[來源, 目標, 符號]；符號 + / - ；調節寫成 [調節變數, "來源 -> 目標", m]。
# 變數名稱盡量沿用 vault 既有變數（Perceived Severity、Skepticism、Crisis Responsibility…），新變數會以虛線灰框顯示。

same:
  - [Customer Retention, Customer Retenion]
  - [Trust, Trusting Beliefs, Interpersonal Trust]
  - [Perceived Credibility, Credibility, Source Credibility]
  - [Trust in AI, Trust in Algorithm, Trust in Automation, Trust in Machine]
  - [Purchase Intention, Buying Intention]
  - [Reliance on Automation, Algorithm Use, Advice Utilization, Algorithm Reliance]

similar:
  - [Trust, Trust in AI, Green Trust, Social Presence]
  - [Behavioral Intention, Purchase Intention, Protection Motivation, Willingness to Speak Out, Utilization Intention]
  - [Behavior, Media Use, Avoidance Behavior, Switching Behavior]
  - [Crisis Responsibility, Ascription of responsibility, Responsibility Attribution]
  - [AI Avoidance, Algorithm Aversion, Avoidance Motivation, User Resistance, Reactance]
  - [Algorithm Transparency, Perceived Transparency, Explanation Quality]
  - [Perceived Risk, Green Perceived Risk, Perceived Threat]
  - [Perceived Credibility, Message Objectivity, Perceived Quality]
  - [Emotions, Fear, Affect, Eeriness]
  - [Social Norm, Social Influence, Normative Pressure, Perceived Majority Support]
  - [Knowledge, AI Literacy, Persuasion Knowledge, Domain Expertise]

theories:

  # ───────── AI／演算法 ─────────
  "Algorithm Aversion":
    abbr: AlgAv
    zh: 演算法厭惡
    field: AI
    desc: Dietvorst, Simmons & Massey（2015）：看過演算法出錯後，人會比看過人出錯更快失去對它的信任，即使演算法整體表現較好。
    edges:
      - [Algorithm Error Observed, Trust in Algorithm, "-"]
      - [Human Error Observed, Trust in Algorithm, "+"]
      - [Trust in Algorithm, Algorithm Use, "+"]
      - [Ability to Modify Algorithm, Algorithm Use, "+"]
      - [Algorithm Use, Decision Accuracy, "+"]
  "Algorithm Appreciation":
    abbr: AlgApp
    zh: 演算法欣賞
    field: AI
    desc: Logg, Minson & Moore（2019）：一般人在客觀判斷上反而更採納演算法建議；專家採納較少。
    edges:
      - [Algorithmic Advice, Advice Utilization, "+"]
      - [Domain Expertise, Advice Utilization, "-"]
      - [Task Objectivity, Advice Utilization, "+"]
  "AI Avoidance Model":
    abbr: AIAvoid
    zh: AI 迴避（演算法迴避）前因模型
    field: AI
    desc: 整理自演算法厭惡的系統性回顧（Jussupow et al. 2020；Mahmud et al. 2022）：演算法特性、任務特性與個人特性共同決定迴避。
    edges:
      - [Perceived Uniqueness Neglect, Algorithm Aversion, "+"]
      - [Algorithm Transparency, Algorithm Aversion, "-"]
      - [Task Subjectivity, Algorithm Aversion, "+"]
      - [Domain Expertise, Algorithm Aversion, "+"]
      - [Perceived Anthropomorphism, Algorithm Aversion, "-"]
      - [Algorithm Error Observed, Algorithm Aversion, "+"]
      - [Algorithm Aversion, AI Avoidance, "+"]
      - [AI Anxiety, AI Avoidance, "+"]
  "Uniqueness Neglect in Medical AI":
    abbr: UNegl
    zh: 獨特性忽視
    field: AI
    desc: Longoni, Bonezzi & Morewedge（2019）：人們擔心 AI 醫療忽略自己的獨特狀況，因而抗拒；個人化可以緩解。
    edges:
      - [AI Provider, Perceived Uniqueness Neglect, "+"]
      - [Personalization, Perceived Uniqueness Neglect, "-"]
      - [Perceived Uniqueness Neglect, Utilization Intention, "-"]
  "Trust in Automation":
    abbr: TiA
    zh: 自動化信任模型
    field: AI
    desc: Lee & See（2004）：信任來自系統的表現、過程與目的三類資訊，並決定依賴程度；過度依賴即自動化偏誤。
    edges:
      - [Automation Reliability, Trust in Automation, "+"]
      - [System Transparency, Trust in Automation, "+"]
      - [Purpose Alignment, Trust in Automation, "+"]
      - [Trust in Automation, Reliance on Automation, "+"]
      - [Reliance on Automation, Automation Bias, "+"]
  "Automation Bias and Complacency":
    abbr: AutoBias
    zh: 自動化偏誤與自滿
    field: AI
    desc: Parasuraman & Manzey（2010）：高可靠度與高工作負荷讓人減少監控，順從自動化的建議而出錯。
    edges:
      - [Automation Reliability, Complacency, "+"]
      - [Workload, Automation Bias, "+"]
      - [Complacency, Automation Bias, "+"]
      - [Accountability, Automation Bias, "-"]
      - [Automation Bias, Decision Error, "+"]
  "CASA - Computers are social Actors":
    note: "CASA - Computers are social Actors"
    abbr: CASA
    zh: 電腦是社會行動者
    field: AI
    edges:
      - [Social Cues, Perceived Anthropomorphism, "+"]
      - [Perceived Anthropomorphism, Social Response, "+"]
      - [Social Response, Trust in AI, "+"]
      - [Social Response, User Satisfaction, "+"]
  "MAIN Model":
    abbr: MAIN
    zh: MAIN 模型（模態、行動者、互動性、導航性）
    field: AI
    desc: Sundar（2008）：數位媒介的四類可供性觸發可信度捷思，進而影響可信度判斷。
    edges:
      - [Modality Cues, Credibility Heuristics, "+"]
      - [Agency Cues, Credibility Heuristics, "+"]
      - [Interactivity Cues, Credibility Heuristics, "+"]
      - [Navigability Cues, Credibility Heuristics, "+"]
      - [Credibility Heuristics, Perceived Credibility, "+"]
  "Machine Heuristic":
    abbr: MachH
    zh: 機器捷思
    field: AI
    desc: Sundar & Kim（2019）：把來源視為機器會啟動「機器客觀、不帶偏見」的捷思，提升客觀性感知與揭露意願。
    edges:
      - [Agency Cues, Machine Heuristic, "+"]
      - [Machine Heuristic, Message Objectivity, "+"]
      - [Message Objectivity, Trust in AI, "+"]
      - [Machine Heuristic, Privacy Concern, "-"]
  "AI Device Use Acceptance":
    abbr: AIDUA
    zh: AI 裝置使用接受模型
    field: AI
    desc: Gursoy et al.（2019）：社會影響、享樂動機與擬人化先影響績效／努力期望，再經情緒決定接受或拒絕。
    edges:
      - [Social Norm, Performance Expectancy, "+"]
      - [Hedonic Motivation, Performance Expectancy, "+"]
      - [Perceived Anthropomorphism, Effort Expectancy, "+"]
      - [Performance Expectancy, Emotions, "+"]
      - [Effort Expectancy, Emotions, "-"]
      - [Emotions, Behavioral Intention, "+"]
  "Uncanny Valley":
    abbr: Uncanny
    zh: 恐怖谷（非線性，此處簡化為高擬人段）
    field: AI
    desc: Mori（1970）：擬人程度接近真人卻不完全時，好感驟降；此處只畫高擬人區段的方向。
    edges:
      - [Perceived Anthropomorphism, Eeriness, "+"]
      - [Eeriness, Trust in AI, "-"]
      - [Eeriness, Behavioral Intention, "-"]
  "Explainable AI Trust Model":
    abbr: XAI
    zh: 可解釋 AI 與信任
    field: AI
    desc: 整理自 XAI 使用者研究（Shin 2021 等）：解釋品質提升透明感與信任，但也增加認知負荷。
    edges:
      - [Explanation Quality, Perceived Transparency, "+"]
      - [Perceived Transparency, Trust in AI, "+"]
      - [Explanation Quality, Cognitive Load, "+"]
      - [Trust in AI, Reliance on Automation, "+"]
  "FAccT Perceptions Model":
    abbr: FAccT
    zh: 公平、可問責、透明的感知模型
    field: AI
    desc: Shin（2020）：使用者對演算法公平、可問責、透明的感知共同形成信任，再影響使用意圖。
    edges:
      - [Perceived Fairness, Trust in AI, "+"]
      - [Perceived Accountability, Trust in AI, "+"]
      - [Perceived Transparency, Trust in AI, "+"]
      - [Trust in AI, Behavioral Intention, "+"]
  "AI Anxiety Model":
    abbr: AIAnx
    zh: AI 焦慮
    field: AI
    desc: Wang & Wang（2022）等：失業威脅、學習壓力推高 AI 焦慮，AI 素養降低焦慮；焦慮導向迴避。
    edges:
      - [Job Replacement Threat, AI Anxiety, "+"]
      - [Learning Pressure, AI Anxiety, "+"]
      - [AI Literacy, AI Anxiety, "-"]
      - [AI Anxiety, AI Avoidance, "+"]
      - [AI Anxiety, Behavioral Intention, "-"]
  "TTAT Technology Threat Avoidance Theory":
    note: "TTAT Technology Threat Avoidance Theory"
    abbr: TTAT
    zh: 科技威脅迴避理論
    field: 資安／AI
    edges:
      - [Perceived Susceptibility, Perceived Threat, "+"]
      - [Perceived Severity, Perceived Threat, "+"]
      - [Perceived Threat, Avoidance Motivation, "+"]
      - [Safeguard Effectiveness, Avoidance Motivation, "+"]
      - [Safeguard Cost, Avoidance Motivation, "-"]
      - [Self-Efficacy, Avoidance Motivation, "+"]
      - [Avoidance Motivation, Avoidance Behavior, "+"]
  "Word-of-Machine Effect":
    abbr: WoM-AI
    zh: 機器之言效應
    field: AI
    desc: Longoni & Cian（2022）：功利目標下偏好 AI 推薦，享樂目標下偏好人類推薦。
    edges:
      - [Utilitarian Goal, Preference for AI Recommender, "+"]
      - [Hedonic Goal, Preference for AI Recommender, "-"]
      - [Preference for AI Recommender, Purchase Intention, "+"]
  "Parasocial Interaction with Conversational Agents":
    abbr: PSI-CA
    zh: 與對話代理的擬社會互動
    field: AI
    desc: 擬人化與互動性提高擬社會互動感，進而提升持續使用。
    edges:
      - [Perceived Anthropomorphism, Parasocial Interaction, "+"]
      - [Interactivity Cues, Parasocial Interaction, "+"]
      - [Parasocial Interaction, Continuance Intention, "+"]
      - [Parasocial Interaction, Trust in AI, "+"]
  "AI Authorship Disclosure Effects":
    abbr: AI-Byline
    zh: AI 署名揭露效果
    field: AI／新聞
    desc: 機器寫作新聞研究（Graefe et al. 2018；Waddell 2018 等）：揭露 AI 作者會降低可信度評價，但提高客觀性感知；期望落差與既有 AI 態度是關鍵。
    edges:
      - [AI Authorship Disclosure, Perceived Credibility, "-"]
      - [AI Authorship Disclosure, Message Objectivity, "+"]
      - [Prior AI Attitude, Perceived Credibility, "+"]
      - [Expectancy Violation, Perceived Credibility, "-"]
      - [Perceived Credibility, Behavioral Intention, "+"]

  # ───────── 健康／風險傳播 ─────────
  "Protection Motivation Theory":
    abbr: PMT
    zh: 保護動機理論
    field: 健康傳播／資安
    desc: Rogers（1975, 1983）：威脅評估（嚴重性、易感性）與因應評估（反應效能、自我效能、反應成本）決定保護動機。
    edges:
      - [Perceived Severity, Protection Motivation, "+"]
      - [Perceived Susceptibility, Protection Motivation, "+"]
      - [Response Efficacy, Protection Motivation, "+"]
      - [Self-Efficacy, Protection Motivation, "+"]
      - [Response Cost, Protection Motivation, "-"]
      - [Protection Motivation, Behavior, "+"]
  "Health Belief Model":
    abbr: HBM
    zh: 健康信念模式
    field: 健康傳播
    desc: Rosenstock（1974）；Janz & Becker（1984）：易感性、嚴重性、利益、障礙、行動線索與自我效能共同預測健康行為。
    edges:
      - [Perceived Susceptibility, Behavior, "+"]
      - [Perceived Severity, Behavior, "+"]
      - [Perceived Health Benefits, Behavior, "+"]
      - [Perceived Barriers, Behavior, "-"]
      - [Cues to Action, Behavior, "+"]
      - [Self-Efficacy, Behavior, "+"]
  "Extended Parallel Process Model":
    abbr: EPPM
    zh: 延伸平行歷程模式
    field: 健康傳播
    desc: Witte（1992）：威脅引發恐懼，效能決定走危險控制（接受建議）還是恐懼控制（否認、迴避）。
    edges:
      - [Perceived Severity, Perceived Threat, "+"]
      - [Perceived Susceptibility, Perceived Threat, "+"]
      - [Response Efficacy, Perceived Efficacy, "+"]
      - [Self-Efficacy, Perceived Efficacy, "+"]
      - [Perceived Threat, Fear, "+"]
      - [Perceived Efficacy, Danger Control, "+"]
      - [Fear, Fear Control, "+"]
      - [Perceived Efficacy, Fear Control, "-"]

  # ───────── 說服／傳播 ─────────
  "ELM":
    note: ELM
    abbr: ELM
    zh: 推敲可能性模式
    field: 說服
    edges:
      - [Argument Quality, Attitude, "+"]
      - [Peripheral Cues, Attitude, "+"]
      - [Involvement, Elaboration, "+"]
      - [Ability, Elaboration, "+"]
      - [Elaboration, "Argument Quality -> Attitude", m]
  "Heuristic-Systematic Model":
    abbr: HSM
    zh: 捷思－系統式處理模式
    field: 說服
    desc: Chaiken（1980）：動機與能力決定系統式處理的程度；捷思線索在低投入時主導態度。
    edges:
      - [Motivation, Systematic Processing, "+"]
      - [Ability, Systematic Processing, "+"]
      - [Heuristic Cues, Attitude, "+"]
      - [Systematic Processing, Attitude Strength, "+"]
  "Source Credibility Theory":
    abbr: SCred
    zh: 來源可信度理論
    field: 說服
    desc: Hovland & Weiss（1951）；Ohanian（1990）：專業性、可信賴性、吸引力構成來源可信度，進而影響態度與意圖。
    edges:
      - [Source Expertise, Perceived Credibility, "+"]
      - [Source Trustworthiness, Perceived Credibility, "+"]
      - [Source Attractiveness, Perceived Credibility, "+"]
      - [Perceived Credibility, Attitude, "+"]
      - [Attitude, Behavioral Intention, "+"]
  "Persuasion Knowledge Model":
    abbr: PKM
    zh: 說服知識模式
    field: 行銷傳播
    desc: Friestad & Wright（1994）：辨識出說服意圖會啟動說服知識，引發懷疑並降低品牌態度。
    edges:
      - [Sponsorship Disclosure, Persuasion Knowledge, "+"]
      - [Persuasion Knowledge, Skepticism, "+"]
      - [Skepticism, Brand Attitude, "-"]
      - [Skepticism, Purchase Intention, "-"]
  "Psychological Reactance Theory":
    abbr: PRT
    zh: 心理抗拒理論
    field: 說服
    desc: Brehm（1966）：威脅自由的訊息引發抗拒，反而降低態度與順從。
    edges:
      - [Threat to Freedom, Reactance, "+"]
      - [Reactance, Attitude, "-"]
      - [Reactance, Behavioral Intention, "-"]
      - [Autonomy, Reactance, "-"]
  "Expectancy Violations Theory":
    abbr: EVioT
    zh: 期望違反理論
    field: 人際傳播
    desc: Burgoon（1978）：違反期望引發喚起與評估；違反的正負取決於傳播者的酬賞價值。
    edges:
      - [Expectancy Violation, Arousal, "+"]
      - [Communicator Reward Valence, Violation Valence, "+"]
      - [Violation Valence, Attitude, "+"]
  "Spiral of Silence":
    abbr: SoS
    zh: 沉默螺旋
    field: 政治傳播
    desc: Noelle-Neumann（1974）：感知自己屬於少數會因害怕孤立而不願表態。
    edges:
      - [Perceived Majority Support, Willingness to Speak Out, "+"]
      - [Fear of Isolation, Willingness to Speak Out, "-"]
      - [Perceived Majority Support, Fear of Isolation, "-"]
  "Third-Person Effect":
    abbr: TPE
    zh: 第三人效果
    field: 媒介效果
    desc: Davison（1983）：人們認為媒體對他人的影響大於對自己，並據此支持管制。
    edges:
      - [Social Distance, Perceived Media Influence on Others, "+"]
      - [Perceived Media Influence on Others, Support for Censorship, "+"]
      - [Perceived Media Influence on Self, Support for Censorship, "-"]
  "Bandwagon Heuristic":
    abbr: Bandwagon
    zh: 從眾捷思
    field: 媒介效果
    desc: Sundar 等：按讚數、觀看數等集體線索觸發從眾捷思，提高可信度與採用。
    edges:
      - [Bandwagon Cues, Bandwagon Effect, "+"]
      - [Bandwagon Effect, Perceived Credibility, "+"]
      - [Bandwagon Effect, Behavioral Intention, "+"]
  "Affective Polarization Model":
    abbr: AffPol
    zh: 情感極化
    field: 政治傳播
    desc: Iyengar et al.（2012, 2019）：黨派認同與同溫層媒體推高對外團體的敵意。
    edges:
      - [Social Identity, Affective Polarization, "+"]
      - [Partisan Media Exposure, Affective Polarization, "+"]
      - [Cross-cutting Exposure, Affective Polarization, "-"]
      - [Affective Polarization, Out-group, "-"]
  "T Uses and Gratifications":
    note: "T Uses and Gratifications"
    abbr: U&G
    zh: 使用與滿足
    field: 媒介
    edges:
      - [Gratifications Sought, Media Use, "+"]
      - [Media Use, Gratifications Obtained, "+"]
      - [Gratifications Obtained, Continuance Intention, "+"]
      - [Gratifications Obtained, Gratifications Sought, "+"]
  "T MRT Media Richness Theory":
    note: "T MRT Media Richness Theory"
    abbr: MRT
    zh: 媒介豐富度理論
    field: 組織傳播
    edges:
      - [Media Richness, Communication Effectiveness, "+"]
      - [Task Equivocality, "Media Richness -> Communication Effectiveness", m]
  "T SPT Social Presence Theory":
    note: "T SPT Social Presence Theory"
    abbr: SPT
    zh: 社會臨場感理論
    field: 傳播／電商
    edges:
      - [Media Richness, Social Presence, "+"]
      - [Social Presence, Trust, "+"]
      - [Social Presence, User Satisfaction, "+"]
      - [Social Presence, Behavioral Intention, "+"]
  "SIDE Model":
    abbr: SIDE
    zh: 去個人化社會認同模式
    field: 社會心理／CMC
    desc: Reicher, Spears & Postmes（1995）：匿名讓社會認同而非個人認同凸顯，強化內團體偏私與外團體貶抑。
    edges:
      - [Anonymity, Social Identity, "+"]
      - [Social Identity, In-group, "+"]
      - [Social Identity, Out-group, "-"]
      - [Social Identity, Social Norm, "+"]

  # ───────── 公關／危機／組織 ─────────
  "T SCCT Situational Crisis Communication":
    note: "T SCCT Situational Crisis Communication"
    abbr: SCCT
    zh: 情境危機溝通理論
    field: 公關
    edges:
      - [Crisis History, Crisis Responsibility, "+"]
      - [Prior Relationship Reputation, Crisis Responsibility, "-"]
      - [Crisis Responsibility, Org Reputation, "-"]
      - [Crisis Responsibility, Emotions, "+"]
      - [Emotions, Org Reputation, "-"]
      - [Org Reputation, Behavioral Intention, "+"]
  "Attribution Theory":
    note: "Attribution Theory"
    abbr: AttrT
    zh: 歸因理論
    field: 社會心理
    edges:
      - [Locus, Responsibility Attribution, "+"]
      - [Stability, Responsibility Attribution, "+"]
      - [Controllability, Responsibility Attribution, "+"]
      - [Responsibility Attribution, Emotions, "+"]
      - [Emotions, Behavior, "+"]
  "T Institutional Theory":
    note: "T Institutional Theory"
    abbr: InstT
    zh: 制度理論（同構壓力）
    field: 組織
    edges:
      - [Coercive Pressure, Adoption, "+"]
      - [Mimetic Pressure, Adoption, "+"]
      - [Normative Pressure, Adoption, "+"]
  "T IDT Innovation Diffusion Theory":
    note: "T IDT Innovation Diffusion Theory"
    abbr: IDT
    zh: 創新擴散理論
    field: 組織／行銷
    edges:
      - [Relative Advantage, Adoption, "+"]
      - [Compatibility, Adoption, "+"]
      - [Complexity, Adoption, "-"]
      - [Trialability, Adoption, "+"]
      - [Observability, Adoption, "+"]
  "Technostress Model":
    abbr: TStress
    zh: 科技壓力模型
    field: 組織／IS
    desc: Tarafdar et al.（2007）；Ragu-Nathan et al.（2008）：超載、入侵、複雜等壓力源降低滿意與持續使用，技術支援可抑制。
    edges:
      - [Techno-overload, Technostress, "+"]
      - [Techno-invasion, Technostress, "+"]
      - [Techno-complexity, Technostress, "+"]
      - [Technical Support, Technostress, "-"]
      - [Technostress, User Satisfaction, "-"]
      - [Technostress, Continuance Intention, "-"]
  "Status Quo Bias Theory":
    abbr: SQB
    zh: 現狀偏誤理論（使用者抗拒）
    field: IS
    desc: Kim & Kankanhalli（2009）：轉換成本提高抗拒、轉換利益降低抗拒；自我效能與組織支持間接作用。
    edges:
      - [Switching cost, User Resistance, "+"]
      - [Switching Benefits, User Resistance, "-"]
      - [Self-Efficacy, Switching cost, "-"]
      - [Organizational Support, Switching cost, "-"]
      - [Social Norm, User Resistance, "-"]

  # ───────── 行銷／顧客 ─────────
  "Push-Pull-Mooring":
    abbr: PPM
    zh: 推拉繫住模型（轉換行為）
    field: 行銷／IS
    desc: Bansal, Taylor & St. James（2005）：不滿意是推力、替代品吸引力是拉力、轉換成本與習慣是繫住力。
    edges:
      - [Dissatisfaction, Switching Intention, "+"]
      - [Alternative Attractiveness, Switching Intention, "+"]
      - [Switching cost, Switching Intention, "-"]
      - [Habit, Switching Intention, "-"]
      - [Switching Intention, Switching Behavior, "+"]
  "Commitment-Trust Theory":
    abbr: KMV
    zh: 承諾－信任理論
    field: 關係行銷
    desc: Morgan & Hunt（1994）：共享價值與溝通建立信任，投機行為破壞信任；信任與承諾是關係的關鍵中介。
    edges:
      - [Shared Values, Trust, "+"]
      - [Communication, Trust, "+"]
      - [Opportunistic Behavior, Trust, "-"]
      - [Trust, Relationship Commitment, "+"]
      - [Relationship Commitment, Customer Retention, "+"]
