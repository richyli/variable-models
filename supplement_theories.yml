    desc: Wernerfelt（1984）與 Barney（1991）提出：企業間資源異質且不可移動，有價值且稀有的資源帶來競爭優勢；若資源同時難以模仿（因果模糊、社會複雜）且無法替代，優勢才能持續，並轉化為較佳的廠商績效。
    refs:
    - {title: Resource-based view (Wikipedia), url: 'https://en.wikipedia.org/wiki/Resource-based_view'}
    - {title: VRIN Framework (Managing Research Library), url: 'https://managingresearchlibrary.org/node/1414'}
    - {title: 'Lockett, Thompson and Morgenstern 2009, The development of the resource-based view of the firm', url: 'https://oeclass.aua.gr/eclass/modules/document/file.php/5565/Required%20Reading_Lockett%20et%20al%202009%20development%20of%20the%20resource%20based%20view%20of%20the%20firm.pdf'}
    - {title: 'Miles, J. A. (2012). Management and Organization Theory: A Jossey-Bass Reader. Jossey-Bass. 第 26 章', url: ''}
    enrich_notes: 改了結構：Barney（1991）區分競爭優勢（有價值＋稀有即可）與持續競爭優勢（再加難以模仿、不可替代），原本把四個條件一律接到 Competitive Advantage 把兩層壓平了，改成 I 與 N
      調節「競爭優勢→持續競爭優勢」。新增兩個基本假設（異質性、不可移動性）與 Barney 提到的模仿障礙（因果模糊、社會複雜）；後兩者在開到的來源中只有學習卡片層級的佐證，但屬 1991 原文內容。VRIO 的 Organization
      條件未納入。
    book_check: Miles 2012 第 26 章對照：補 7 條邊；書中變數我們原本沒有的：Path Dependence、Organizational Capabilities、Sustainable Competitive
      Advantage。VRIN 四項→持續性競爭優勢（SCA）為書上明寫（p232）；書上區分 competitive advantage（對手未用的價值策略）與 sustainable competitive advantage（對手學不會也抄不了），我們只有前者，建議補
      SCA。資源不可移動且昂貴難抄→inimitable 為書上定義（p232）；因果模糊、社會複雜、路徑依賴作為資源差異來源出自批評節（p234），我依 Barney 傳統把它們接到 Inimitability。為守 8 條上限未入邊：Resource
      Immobility→Resource Inimitability「+」、Social Complexity→Resource Inimitability「+」、Dynamic Capabilities→Resource Reconfiguration「+」。「必須有能力吸收與運用資源才能取得
      SCA」（Barney & Clark 2007）寫成 Absorptive Capacity 調節。SCA→績效：書上把績效差異視為資源效率差異帶來的盈餘差距（p233）。Dynamic Capabilities→Resource
      Reconfiguration 出自 Teece et al.（1997）那段（p233）。批評：套套邏輯、難以否證、VRIN 既非必要亦非充分（p233–234）。Measuring Variables 列的是 Chandler
      & Hanks 1994、Eisenhardt & Schoonhoven 1996、Ray et al. 2004（技術資源）、Andersen & Kheam 1998（生產／行銷／管理能力）等測量，皆為能力與資源的操作化，無單一標準量表。
