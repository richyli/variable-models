    verified: false
    items:
    - It makes sense to buy [X] instead of any other brand, even if they are the same.
    - Even if another brand has the same features as [X], I would prefer to buy [X].
    - If there is another brand as good as [X], I prefer to buy [X].
    - If another brand is not different from [X] in any way, it seems smarter to purchase [X].
    scale: 7-point Likert, 1 = strongly disagree（totally disagree）, 7 = strongly agree
    reliability: OBE α = .84（克羅埃西亞複製研究）；原文約 .93（依記憶）
    context: ''
    notes: OBE 題項依記憶轉述，開啟頁面確認四題、7 點與 α。Keller CBBE 另有 brand awareness／image／quality／loyalty 分量表。
Crisis Responsibility:
  zh: ''
  scales:
  - name: Coombs & Holladay (1996, 2001) J. Public Relations Research；
    source: Coombs & Holladay (1996, 2001) J. Public Relations Research；題項改編自 Griffin, Babin & Darden (1992) blame
      量表，另用 McAuley et al. (1992) CDS-II locus/controllability
    url: https://en.wikipedia.org/wiki/Situational_crisis_communication_theory
    verified: false
    items:
    - Circumstances, not the organization, are responsible for the crisis.（反向）
    - The blame for the crisis lies with the organization.
    - The blame for the crisis lies in the circumstances, not the organization.（反向）
    - How much is the organization responsible for the crisis?（1 = not at all, 7 = very much）
    scale: 7-point Likert（或 5 點）
    reliability: α 約 .80–.90（依記憶）
    context: ''
    notes: 題項依記憶轉述；開啟頁面只確認出處與定義。
Environment:
  zh: ''
  scales:
  - name: DePietro, Wiarda & Fleischer (1990)
    source: DePietro, Wiarda & Fleischer (1990) in Tornatzky & Fleischer (eds.) TOE 之 environmental context；調查題常承
      Zhu, Kraemer & Xu (2003, 2006) competitive pressure／regulatory support
    url: https://en.wikipedia.org/wiki/Technology%E2%80%93organization%E2%80%93environment_framework
    verified: false
    items:
    - Our firm is under pressure from competitors to adopt [technology].
    - Our firm would lose customers to competitors if we did not adopt [technology].
    - Our customers/suppliers expect us to use [technology].
    - Government policies support the adoption of [technology].
    - 'Environmental uncertainty: Our industry''s market demands change rapidly.'
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree
    reliability: 衍生研究 α 多在 .80 以上（未逐字確認）
    context: ''
    notes: 依摘要改寫；TOE 原書無量表，研究者自選因子（Zhu & Kraemer 2005 批評其過於籠統）。環境不確定性可用 Miller & Dröge (1986) 題。
Information Quality:
  zh: ''
  scales:
  - name: DeLone & McLean (1992, 2003) 構面；題項常用 Wixom & Todd (2005) ISR
    source: DeLone & McLean (1992, 2003) 構面；題項常用 Wixom & Todd (2005) ISR 16(1)（accuracy, completeness, currency,
      format）或 Bailey & Pearson (1983)
    url: https://en.wikipedia.org/wiki/Information_systems_success_model
    verified: false
    items:
    - '[System] produces correct information.'
    - '[System] provides me with all the information I need.（completeness）'
    - '[System] provides me with the most recent information.（currency）'
    - The information provided by [system] is well formatted.（format）
    - The information from [system] is relevant to my tasks.
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree
    reliability: Wixom & Todd 各構面 α > .85（依記憶）
    context: ''
    notes: 題項依記憶轉述；D&M 原文列構面與既有指標（accuracy, relevance, completeness…）而非固定題。
Normative Commitment:
  zh: ''
  scales:
  - name: Meyer, Allen & Smith (1993)
    source: Meyer, Allen & Smith (1993) J. Applied Psychology 78(4) 修訂六題版（原 Allen & Meyer 1990 J. Occupational Psychology
      63(1) 八題）
    url: https://verdi.cs.ucl.ac.uk/constructDB/publications/allen-measurement-1990.html
    verified: false
    items:
    - I do not feel any obligation to remain with my current employer.（反向）
    - Even if it were to my advantage, I do not feel it would be right to leave my organization now.
    - I would feel guilty if I left my organization now.
    - This organization deserves my loyalty.
    - I would not leave my organization right now because I have a sense of obligation to the people in it.
    - I owe a great deal to my organization.
    scale: 7-point, 1 = strongly disagree, 7 = strongly agree
    reliability: α 約 .73–.79（依記憶；1990 版 .79）
    context: ''
    notes: 題項依記憶轉述；開啟頁面確認出處與 7 點量尺但未列題。
Perceived Barriers:
  zh: ''
  scales:
  - name: Champion (1984)
    source: Champion (1984) ANS Adv Nurs Sci 6(3) HBM 量表；Champion (1999) Res Nurs Health 22(4) 乳房攝影修訂版 barriers
      分量表
    url: https://en.wikipedia.org/wiki/Health_belief_model
    verified: false
    items:
    - I am afraid to have a mammogram because I might find out something is wrong.
    - Having a mammogram is too embarrassing.
    - Having a mammogram takes too much time.
    - Having a mammogram is too painful.
    - I don't know where to go to get a mammogram.
    scale: 5-point Likert, 1 = strongly disagree, 5 = strongly agree
    reliability: barriers 分量表 α .76–.88（各國驗證）
    context: ''
    notes: 題項依記憶轉述（乳房攝影版）；開啟頁面只確認構念定義與 Maiman et al. (1977) 早期量表。科技採用脈絡的 barriers 多自編。
Protection Motivation:
  zh: ''
  scales:
  - name: Rogers (1975, 1983) PMT；protection motivation 通常以行為意圖題操作化（Mi
    source: Rogers (1975, 1983) PMT；protection motivation 通常以行為意圖題操作化（Milne, Sheeran & Orbell 2000 後設分析慣例；Boer 2005
      題例）
    url: https://en.wikipedia.org/wiki/Protection_motivation_theory
    verified: false
    items:
    - I intend to [protective behavior] in the next [period].
    - I plan to [protective behavior].
    - I am motivated to protect myself from [threat].
    - Boer 2005 相關構念題例：If I do not use condoms, I will run a high risk of getting HIV/AIDS.（vulnerability）
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree
    reliability: 意圖題 α 多 > .85（未逐字確認）
    context: ''
    notes: 前三題依慣例改寫；PMT 無單一標準量表，各構念題依威脅情境自編。
Resource Rarity:
  zh: ''
  scales:
  - name: Barney (1991)
    source: Barney (1991) J. Management 17(1) VRIN 之 rarity；未找到公認標準量表，實證多自編或用 Jugdev & Mathur VRIO 問卷
    url: https://en.wikipedia.org/wiki/Resource-based_view
    verified: false
    items:
    - Our [resource/capability] is rare among our competitors.
    - Few competitors possess [resource] of the same quality as ours.
    - '[Resource] is not available to other firms in our industry.'
    scale: 7-point Likert
    reliability: ''
    context: ''
    notes: 依摘要改寫；RBV 實證以概念討論為主，量表零散。Talaja (2012) 亦有 VRIN 題組（未開啟）。
Social Persuasion:
  zh: ''
  scales:
  - name: Usher & Pajares (2009)
    source: Usher & Pajares (2009) Contemporary Educational Psychology 34(1) Sources of Self-Efficacy in Mathematics
      之 social persuasions 分量表（6 題）
    url: https://scholars.uky.edu/en/publications/sources-of-self-efficacy-in-mathematics-a-validation-study/
    verified: false
    items:
    - My math teachers have told me that I am good at learning math.
    - People have told me that I have a talent for math.
    - Adults in my family have told me what a good math student I am.
    - I have been praised for my ability in math.
    - Other students have told me that I'm good at learning math.
    - My classmates like to work with me in math because they think I'm good at it.
    scale: 6-point, 1 = definitely false, 6 = definitely true
    reliability: social persuasions α 約 .88（依記憶）
    context: ''
    notes: 題項依記憶轉述；開啟頁面確認 24 題四因子但未列題。可把 math 換成目標領域。
Technology Characteristics:
  zh: ''
  scales:
  - name: Goodhue & Thompson (1995)
    source: Goodhue & Thompson (1995) MIS Quarterly 19(2) TTF 之技術特性／TTF 八構面（quality, locatability, authorization,
      compatibility, production timeliness, systems reliability, ease of use/training, relationship with users）
    url: https://open.ncl.ac.uk/theories/3/task-technology-fit/
    verified: false
    items:
    - 'Systems reliability: The system I use is subject to frequent problems and crashes.（反向）'
    - 'Ease of use: It is easy to learn how to use the system.'
    - 'Currency/quality: The data is up to date enough for my purposes.'
    - 'Locatability: It is easy to locate the data I need.'
    - 'Compatibility: Data from different sources can be combined easily.'
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree
    reliability: 各構面 2–10 題，信度多 > .70（原文）
    context: ''
    notes: 題項依摘要改寫（開啟頁面列構面名稱而非題句）。後續研究常用單一 TTF 構面（Lin & Huang 2008 八題）。
Affective Commitment:
  zh: ''
  scales:
  - name: Allen & Meyer (1990)
    source: Allen & Meyer (1990) Affective Commitment Scale 8 題；Meyer, Allen & Smith (1993) 修訂 6 題
    url: https://cio-wiki.com/wiki/Organizational_Commitment_Questionnaire_(OCQ)
    verified: true
    items:
    - I would be very happy to spend the rest of my career in this organization
    - I really feel as if this organization's problems are my own
    - I do not feel like 'part of the family' at this organization (R)
    - I do not feel 'emotionally attached' to this organization (R)
    - This organization has a great deal of personal meaning for me
    - I do not feel a strong sense of belonging to this organization (R)
    scale: 7-point Likert, 1=strongly disagree to 7=strongly agree
    reliability: Allen & Meyer (1990) ACS α = .87；Meyer et al. (1993) 6 題版 α ≈ .82–.85【未核對】
    context: ''
    notes: 題項已從 cio-wiki 頁逐字抄錄（6 題版）。另一常用量表 Mowday, Steers & Porter (1979) OCQ 15 題，POS／LMX 研究也常用。Merritt (2012)
      指出反向題會形成第二因素，可改用全正向題。
Perceived Risk:
  zh: ''
  scales:
  - name: Featherman & Pavlou (2003)
    source: Featherman & Pavlou (2003) perceived risk facets（performance / financial / time / psychological / social
      / privacy / overall）；Jarvenpaa, Tractinsky & Vitale (2000) 整體風險
    url: https://cancercontrol.cancer.gov/brp/research/constructs/perceived-vulnerability
    verified: false
    items:
    - How would you characterize the decision to use [e-service]? very negative situation – very positive situation
      (R)
    - Using [e-service] would be risky
    - There is a significant risk involved in using [e-service]
    - 'Performance risk: [e-service] might not perform well and create problems with my [task]'
    - 'Financial risk: Using [e-service] would lead to a financial loss for me'
    - 'Privacy risk: Using [e-service] would cause me to lose control over the privacy of my information'
    scale: 7-point Likert (1=strongly disagree to 7=strongly agree) 或 7 點語意差異
    reliability: Featherman & Pavlou (2003) 各面向 α：time .796、psychological .891、privacy .857、financial .857、performance
      .797、social .814、overall .850（二手轉載，依摘要）
    context: ''
    notes: 題項依 Featherman & Pavlou (2003) 常見轉述改寫【未核對】；α 值來自 Bertea (2010) 表格轉載。健康／風險溝通脈絡（Cultivation、Availability）改用
      perceived vulnerability：『How likely is it that you will get X?』0–100% 或 almost certainly will not–will（已開啟
      NCI 頁）。Privacy Calculus 用 Malhotra et al. (2004) IUIPC 或 Dinev & Hart (2006) perceived privacy risk。
Experience:
  zh: ''
  scales:
  - name: Venkatesh et al. (2003)
    source: Venkatesh et al. (2003) UTAUT 經驗調節變項；Taylor & Todd (1995) 有／無經驗分組
    url: https://technologyadoptionbarriers.org/bibliography-1-15-unified-theory-utaut-venkatesh-2003/
    verified: true
    items:
    - How long have you been using [the system]? (months / years)
    - Have you used [the system] before? (yes / no)
    - How would you rate your level of experience with [the technology]? (none – extensive)
    - 'Measured waves: T1 (post-training), T2 (1 month), T3 (3 months) as ordinal experience levels'
    scale: 連續值（月／年）、二分（有／無）或 5–7 點自評
    reliability: ''
    context: ''
    notes: 這是客觀／背景指標，不是態度量表。UTAUT 原始研究以三波施測時間代表經驗層級。Endowment／AIM 脈絡的 experience 指先前接觸或擁有經驗，多用二分或次數。
Systematic Processing:
  zh: ''
  scales:
  - name: Griffin, Neuwirth, Giese & Dunwoody (2002)
    source: Griffin, Neuwirth, Giese & Dunwoody (2002) / Kahlor et al. (2003) RISP 模型 systematic processing 量表；Chaiken
      (1980) HSM
    url: https://en.wikipedia.org/wiki/Heuristic-systematic_model_of_information_processing
    verified: false
    items:
    - After I encounter information about [topic], I am likely to stop and think about it
    - When I encounter information about [topic], I read or listen to most of it, even though I may not agree with
      its perspective
    - If I need to act on [topic], the more viewpoints I get the better
    - When I see or hear information about [topic], I rarely spend much time thinking about it (R)
    - 'Thought-listing: number of message-relevant thoughts generated after exposure (objective index of elaboration)'
    scale: 5-point Likert, 1=strongly disagree to 5=strongly agree（RISP）；思考列舉為計數
    reliability: RISP 研究 systematic processing α 約 .70–.80【未核對】
    context: ''
    notes: 題項依 RISP 文獻常見轉述改寫【未核對】。HSM／ELM 實驗傳統多用 thought-listing 與論證品質×涉入交互作為處理深度的操作定義，而非自陳量表；NFCC 脈絡可另配 Webster
      & Kruglanski (1994) NFCC 量表。
Brand Attitude:
  zh: ''
  scales:
  - name: Spears & Singh (2004)
    source: Spears & Singh (2004) attitude toward the brand 5 題語意差異，Journal of Current Issues & Research in Advertising
    url: https://www.tandfonline.com/doi/abs/10.1080/10641734.2004.10505164
    verified: true
    items:
    - 'This brand is: unappealing – appealing'
    - 'This brand is: bad – good'
    - 'This brand is: unpleasant – pleasant'
    - 'This brand is: unfavorable – favorable'
    - 'This brand is: unlikable – likable'
    scale: 7-point semantic differential
    reliability: 實證引用多報 α ≥ .90（依摘要；原文數值未從網頁核對）
    context: ''
    notes: 五對形容詞依搜尋結果引述的 PMC10904944 表格（該表逐題標註 Spears & Singh 2004）。Aad／HoE 脈絡的 attitude toward the ad 常用 MacKenzie
      & Lutz (1989) 的 good–bad、favorable–unfavorable、pleasant–unpleasant 三題。
Learning Performance:
  zh: ''
  scales:
  - name: 'Mayer (2001/2009) CTML 的 retention test 與 transfer test；CLT '
    source: Mayer (2001/2009) CTML 的 retention test 與 transfer test；CLT 研究的測驗分數＋心智負荷
    url: ''
    verified: true
    items:
    - 'Retention test: free recall of the lesson content, scored by number of idea units correctly recalled'
    - 'Transfer test: open-ended problem-solving questions applying the material, scored by acceptable answers'
    - Post-test score (% correct) on a knowledge test, optionally minus pre-test score (learning gain)
    - Task completion time and error rate during practice
    scale: 客觀計分（分數、正確率、作答時間）
    reliability: ''
    context: ''
    notes: 這是客觀學習成果指標，不是態度量表。Flow／EVT 研究可另配自評 perceived learning（Rovai et al. 2009 CAP）。本次未開啟到專門頁面。
Reliance on Automation:
  zh: ''
  scales:
  - name: Harvey & Fischer (1997)
    source: Harvey & Fischer (1997) / Yaniv (2004) weight of advice (WOA)；Lee & See (2004)、Parasuraman & Manzey
      (2010) 自動化依賴行為
    url: https://en.wikipedia.org/wiki/Judge%E2%80%93advisor_system
    verified: true
    items:
    - WOA = |final judgment − initial judgment| / |advice − initial judgment|（0=完全忽略建議，1=完全採納）
    - Reliance rate = proportion of trials on which the participant followed the algorithm's / automation's recommendation
    - 'Choice measure: whether the participant chose the algorithm''s forecast over their own (binary, Dietvorst
      et al. 2015)'
    - 'Automation bias: commission errors (following incorrect automated advice) and omission errors (missing events
      the aid failed to flag)'
    scale: 行為比率或 0–1 連續值
    reliability: ''
    context: ''
    notes: 這是行為指標，不是態度量表。WOA 公式為 Harvey & Fischer (1997) 慣例；Wikipedia 頁只給概念定義，未列公式。若要態度面，改用 Trust in Automation
      量表（Jian, Bisantz & Drury 2000，12 題 7 點）。
Alternative Attractiveness:
  zh: ''
  scales:
  - name: Jones, Mothersbaugh & Beatty (2000)
    source: Jones, Mothersbaugh & Beatty (2000) attractiveness of alternatives，Journal of Retailing；源自 Ping (1993)
    url: ''
    verified: false
    items:
    - If I needed to change [service providers], there are other good [providers] to choose from
    - I would probably be happy with the products and services of another [provider]
    - Compared to this [provider], there are other [providers] with which I would probably be equally or more satisfied
    - Compared to this [provider], there are not very many other [providers] with whom I could be satisfied (R)
    scale: 7-point Likert, 1=strongly disagree to 7=strongly agree
    reliability: Jones et al. (2000) α ≈ .85【未核對】
    context: ''
    notes: 題項依 Jones et al. (2000) 常見轉述改寫【未核對】；搜尋被 Ping 高爾夫球具結果淹沒，未找到可開啟的量表頁。PPM 遷移研究（Bansal, Taylor & St. James
      2005）沿用此量表作 pull 因素。
Expectancy:
  zh: ''
  scales:
  - name: Vroom (1964)
    source: Vroom (1964) expectancy theory 的 E→P expectancy；Eccles & Wigfield (1995) expectancy of success
    url: https://en.wikipedia.org/wiki/Expectancy_theory
    verified: false
    items:
    - If I put forth more effort, my performance on [task] will improve
    - Working hard will lead to high performance on [task]
    - What is the probability (0–100%) that your effort will result in successful performance?
    - How well do you expect to do in [domain] this year? (not at all well – very well)
    - How good are you at [domain]? (not at all good – very good)
    scale: Vroom 傳統用 0–1 主觀機率或 7 點 Likert；Eccles 量表 7 點
    reliability: Eccles & Wigfield (1995) expectancy/ability beliefs α ≈ .92【未核對】；VIE 自編題 α 多 .70–.85
    context: ''
    notes: Vroom 理論沒有單一標準量表，各研究自編 E、I、V 題；Wikipedia 頁只給定義。前三題為 VIE 常見題式，後兩題為 Eccles 量表【未核對】。Sunk cost、GST 脈絡可改用
      self-efficacy 式題（Bandura）。
Information Asymmetry:
  zh: ''
  scales:
  - name: Pavlou, Liang & Xue (2007)
    source: Pavlou, Liang & Xue (2007) perceived information asymmetry，MIS Quarterly；市場層次則用 Akerlof (1970) 代理指標
    url: https://en.wikipedia.org/wiki/Adverse_selection
    verified: false
    items:
    - This seller has more information about the true quality of the product than I do
    - I do not have enough information to judge whether this seller's product is as described
    - The seller knows things about this product that I cannot verify before purchase
    - 'Objective proxies: bid–ask spread, analyst forecast dispersion, probability of informed trading (PIN)'
    scale: 7-point Likert, 1=strongly disagree to 7=strongly agree
    reliability: Pavlou et al. (2007) perceived information asymmetry CR ≈ .90【未核對】
    context: ''
    notes: 題項依 Pavlou et al. (2007) 概念改寫【未核對】。Signaling／Agency 的經濟學研究多用客觀代理指標而非量表；傳播研究可用 perceived knowledge gap。
Prior Behavior Frequency:
  zh: ''
  scales:
  - name: Ouellette & Wood (1998)
    source: Ouellette & Wood (1998) past behavior frequency；Ajzen (2002) TPB 的 past behavior 單題；Verplanken & Orbell
      (2003) SRHI 為習慣替代量表
    url: https://people.umass.edu/aizen/tpb.html
    verified: true
    items:
    - How often have you [performed behavior X] in the past month? (never – very often)
    - In the past year, how many times did you [perform behavior X]? (open count)
    - I have [performed behavior X] frequently in the past
    - 'Recall measure: number of days in the last 7 days on which you [performed behavior X]'
    scale: 次數計數或 5–7 點頻率（never / rarely / sometimes / often / very often）
    reliability: 單題或 2 題；SRHI 12 題 α ≈ .90（替代方案）
    context: ''
    notes: 這是自陳行為頻率指標，不是態度量表。Habit-ISC（Limayem, Hirt & Cheung 2007）另用 habit 量表『Using X has become automatic to me』。
Ability:
  zh: ''
  scales:
  - name: ELM／HSM 中 ability 多為操弄（干擾、時間壓力）或以先備知識／專業測量；Flynn & Goldsmith (1999)
    source: ELM／HSM 中 ability 多為操弄（干擾、時間壓力）或以先備知識／專業測量；Flynn & Goldsmith (1999) subjective knowledge 量表
    url: ''
    verified: false
    items:
    - 'Manipulation: distraction task / time pressure to lower ability to process the message'
    - Objective knowledge quiz on the topic (number correct)
    - I know pretty much about [topic]
    - I do not feel very knowledgeable about [topic] (R)
    - Among my circle of friends, I am one of the experts on [topic]
    scale: 知識測驗為計分；subjective knowledge 7 點 Likert
    reliability: Flynn & Goldsmith (1999) subjective knowledge 5 題 α ≈ .90【未核對】
    context: ''
    notes: ELM 傳統 ability 不是量表而是情境條件或個別差異（知識、智力）。GST 脈絡的 ability 則多指工作能力測驗或主管評分。題項依 Flynn & Goldsmith (1999) 常見轉述改寫【未核對】。
Attitude Change:
  zh: ''
  scales:
  - name: 前後測差分：同一態度量表（Ajzen 語意差異或 Likert）在訊息暴露前後施測；Inoculation 研究（McG
    source: 前後測差分：同一態度量表（Ajzen 語意差異或 Likert）在訊息暴露前後施測；Inoculation 研究（McGuire 1964；Banas & Rains 2010）
    url: https://people.umass.edu/aizen/tpb.html
    verified: true
    items:
    - Attitude change = post-message attitude score − pre-message attitude score on the same semantic-differential
      scale
    - 'Attitude toward [issue]: bad – good; foolish – wise; negative – positive (measured at T1 and T2)'
    - 'Between-subjects version: attitude score of message group minus control group'
    - 'Single item: Has your opinion about [issue] changed after reading this? (not at all – completely)'
    scale: 7-point semantic differential；差分為連續值
    reliability: 沿用所採態度量表的 α（通常 ≥ .85）
    context: ''
    notes: 沒有獨立的『態度改變量表』；是態度量表的重複施測或組間差。CDT 研究另用 attitude–behavior discrepancy；Balance Theory 研究用三元組評價的一致性。
Effort:
  zh: ''
  scales:
  - name: Brown & Peterson (1994)
    source: Brown & Peterson (1994) 自陳努力量表；Yeo & Neal (2004) task effort；NASA-TLX effort 子量表（Hart & Staveland 1988）
    url: ''
    verified: false
    items:
    - I worked hard on this task
    - I put a lot of effort into completing this task
    - I tried my best to do well on this task
    - 'NASA-TLX: How hard did you have to work to accomplish your level of performance? (very low – very high)'
    - 'Objective: time on task / number of attempts / persistence after failure'
    scale: 7-point Likert 或 NASA-TLX 0–100 視覺類比量尺
    reliability: 自陳努力 3 題版 α 多 .80–.90【未核對】
    context: ''
    notes: SF、SCT 脈絡常以客觀持續時間或產出量當 effort；Control Theory 研究用自陳 3 題。題項依常見用法改寫【未核對】。
Media Use:
  zh: ''
  scales:
  - name: Gerbner et al. 涵化研究的每日收視時數；U&G 研究的使用頻率與時數
    source: Gerbner et al. 涵化研究的每日收視時數；U&G 研究的使用頻率與時數
    url: https://en.wikipedia.org/wiki/Cultivation_theory
    verified: true
    items:
    - On an average day, how many hours do you watch television? (open or 0 / <1 / 1–2 / 2–4 / >4 hours)
    - How often do you use [medium / platform]? (never – several times a day)
    - In the past week, how many days did you read news on [platform]?
    - 'Viewer categories: light (<2 h/day), medium (2–4 h/day), heavy (>4 h/day)'
    scale: 時數連續值或 5–7 點頻率；涵化研究再切成輕／中／重度
    reliability: ''
    context: ''
    notes: 這是使用行為指標，不是態度量表。MRT 脈絡的 media use 指對某媒介的選用次數；IDT 指採用時間。
Perceived Severity:
  zh: ''
  scales:
  - name: Witte, Cameron, McKeon & Berkowitz (1996)
    source: Witte, Cameron, McKeon & Berkowitz (1996) Risk Behavior Diagnosis Scale 的 severity 3 題；Champion (1984)
      HBM severity
    url: https://cancercontrol.cancer.gov/brp/research/constructs/perceived-severity
    verified: false
    items:
    - I believe that [health threat] is severe
    - I believe that [health threat] is serious
    - I believe that [health threat] is significant
    - 'Champion: If I had breast cancer my career would be endangered'
    - 'Champion: Breast cancer is a hopeless disease'
    scale: Witte 3 題：5-point（NCI 頁）或原 RBD 7-point strongly disagree–strongly agree；Champion 5-point
    reliability: Witte et al. (1996) severity α = .90（n=179）；Champion (1984) α = .78、兩週重測 .76
    context: ''
    notes: 題項從 NCI 頁逐字抄錄。TTAT／PMT 的資安脈絡（Johnston & Warkentin 2010）直接改寫 Witte 三題為 'threat severity'。
Price:
  zh: ''
  scales:
  - name: 客觀價格水準（實驗操弄）；知覺價格 Dodds, Monroe & Grewal (1991)
    source: 客觀價格水準（實驗操弄）；知覺價格 Dodds, Monroe & Grewal (1991)；price consciousness Lichtenstein, Ridgway & Netemeyer
      (1993)；price fairness Xia, Monroe & Cox (2004)
    url: ''
    verified: false
    items:
    - 'Objective: actual price level manipulated or recorded (e.g., NT$ shown on the label)'
    - 'The price shown for [product] is: low – high'
    - 'The price of [product] is: very reasonable – very unreasonable'
    - 'Price fairness: The price I paid for [product] is fair / acceptable / reasonable'
    - 'Price consciousness: I am willing to go to extra effort to find lower prices'
    scale: 知覺價格 7 點語意差異；price fairness 7-point Likert
    reliability: Dodds et al. (1991) perceived price α ≈ .80；Lichtenstein et al. (1993) price consciousness α ≈
      .78【未核對】
    context: ''
    notes: Mental Accounting、EoS、PLL 研究中 price 多是操弄變項或次級資料，不是量表；Perceived Value Model 才用知覺價格題項。題項依常見文獻改寫【未核對】。
Relationship Commitment:
  zh: ''
  scales:
  - name: Morgan & Hunt (1994)
    source: Morgan & Hunt (1994) relationship commitment，Journal of Marketing（源自 Mowday et al. 1979 改寫）
    url: https://verdi.cs.ucl.ac.uk/constructDB/publications/morgan-commitmenttrust-1994.html
    verified: false
    items:
    - The relationship that my firm has with [partner] is something we are very committed to
    - The relationship that my firm has with [partner] is something my firm intends to maintain indefinitely
    - The relationship that my firm has with [partner] deserves our firm's maximum effort to maintain
    - The relationship that my firm has with [partner] is very important to my firm
    scale: 7-point Likert, 1=strongly disagree to 7=strongly agree
    reliability: Morgan & Hunt (1994) commitment α ≈ .90【未核對】
    context: ''
    notes: 題項依 Morgan & Hunt (1994) 常見轉述改寫【未核對】；constructDB 頁只有書目。消費者脈絡（CEng、PPM）常改用 Garbarino & Johnson (1999)
      或 Fullerton (2003) 的 affective commitment to the brand。
Subjective Norm:
  zh: ''
  scales:
  - name: Ajzen (1991, 2002/2006) TPB 直接測量；Taylor & Todd (1995) IS 脈絡版
    source: Ajzen (1991, 2002/2006) TPB 直接測量；Taylor & Todd (1995) IS 脈絡版
    url: https://people.umass.edu/aizen/tpb.html
    verified: true
    items:
    - Most people who are important to me think I should [perform behavior X] (I should – I should not)
    - People who are important to me would approve of my [performing behavior X]
    - Most people whose opinions I value would [perform behavior X]（描述性規範）
    - It is expected of me that I [perform behavior X]
    - People who influence my behavior think that I should use [the system]（Taylor & Todd 1995）
    scale: 7-point bipolar（should–should not）或 7-point Likert
    reliability: 藥師前測 α = .691（依摘要）；Taylor & Todd (1995) α ≈ .88；TAM2 (Venkatesh & Davis 2000) 2 題 α .81–.88【後兩者未核對】
    context: ''
    notes: 第一題為 Ajzen sample questionnaire 原題式（搜尋結果引述）。Ajzen 建議同時含指令性與描述性規範題；UTAUT 改名 social influence。
User Resistance:
  zh: ''
  scales:
  - name: Kim & Kankanhalli (2009)
    source: Kim & Kankanhalli (2009) user resistance，MIS Quarterly；Innovation Resistance Theory 則用 Ram & Sheth (1989)
      的五種障礙
    url: ''
    verified: false
    items:
    - I will not comply with the change to the new way of working with [the new system]
    - I will not cooperate with the change to the new way of working with [the new system]
    - I oppose the change to the new way of working with [the new system]
    - I do not agree with the change to the new way of working with [the new system]
    scale: 7-point Likert, 1=strongly disagree to 7=strongly agree
    reliability: Kim & Kankanhalli (2009) 4 題 CR ≈ .95【未核對】
    context: ''
    notes: 題項依 Kim & Kankanhalli (2009) 常見轉述改寫【未核對】；原文 PDF（floppybunny、AIS eLibrary）本次無法解析。IRT 脈絡改用 Laukkanen (2016)
      usage / value / risk / tradition / image barriers 各 3–4 題；AIDUA（Gursoy et al. 2019）的 objection 用 'I would
      object to using AI devices' 式 3 題。
Adverse Selection:
  zh: ''
  scales:
  - name: Akerlof (1970)
    source: Akerlof (1970) 市場層次概念；實證辨識：Chiappori & Salanié (2000) 正相關檢定；知覺層次：Pavlou, Liang & Xue (2007) fears of
      seller opportunism
    url: https://en.wikipedia.org/wiki/Adverse_selection
    verified: false
    items:
    - 'Market test: positive correlation between buyer''s hidden risk type and contract/insurance uptake (Chiappori
      & Salanié 2000)'
    - 'Quality signal: share of low-quality (''lemon'') sellers remaining in the market as price falls'
    - 'Perceptual (Pavlou et al. 2007): I am worried that this seller may misrepresent the quality of the product'
    - 'Perceptual: There is a chance that the seller will not deliver what was promised'
    scale: 市場層次為計量迴歸係數；知覺題 7-point Likert
    reliability: Pavlou et al. (2007) fears of seller opportunism CR ≈ .92【未核對】
    context: ''
    notes: 這是經濟學市場現象，不是態度量表；多數研究不直接測量，而以資訊不對稱或投機疑慮的知覺題代理。知覺題依 Pavlou et al. (2007) 概念改寫【未核對】。
Anxiety:
  zh: ''
  scales:
  - name: Spielberger et al. (1983)
    source: Spielberger et al. (1983) State-Trait Anxiety Inventory (STAI)；科技脈絡：Heinssen, Glass & Knight (1987)
      Computer Anxiety Rating Scale；AI 脈絡：Wang & Wang (2022) AI anxiety scale
    url: https://en.wikipedia.org/wiki/State-Trait_Anxiety_Inventory
    verified: false
    items:
    - I feel worried (state)
    - I feel secure (state, R)
    - I feel tense / I am jittery (state)
    - I worry too much over something that really doesn't matter (trait)
    - 'Computer anxiety: I feel apprehensive about using computers'
    scale: STAI 4-point：state 用 not at all / somewhat / moderately so / very much so；trait 用 almost never / sometimes
      / often / almost always
    reliability: STAI 各 20 題 α 多 ≥ .90（Wikipedia 頁未列數值）【未核對】
    context: ''
    notes: 前兩題為 Wikipedia 頁所列原題；其餘為常見題式【未核對】。STAI 為商業版權量表（Mind Garden）。Appraisal 研究常用 PANAS 的 nervous / jittery
      / scared 項目當 anxiety 指標。
Communication:
  zh: ''
  scales:
  - name: Morgan & Hunt (1994)
    source: Morgan & Hunt (1994) communication；Anderson & Narus (1990) communication；SERVQUAL 的 responsiveness /
      empathy 含溝通面
    url: https://verdi.cs.ucl.ac.uk/constructDB/publications/morgan-commitmenttrust-1994.html
    verified: false
    items:
    - '[Partner] keeps us informed of new developments'
    - '[Partner] communicates well its expectations for our firm''s performance'
    - '[Partner] provides us with timely and accurate information'
    - In our relationship, information is shared openly and frequently
    scale: 7-point Likert, 1=strongly disagree to 7=strongly agree
    reliability: Morgan & Hunt (1994) communication α ≈ .84【未核對】
    context: ''
    notes: 題項依 Morgan & Hunt (1994)／Anderson & Narus (1990) 常見轉述改寫【未核對】。IDT 脈絡的 communication channels 多為客觀指標（大眾媒介
      vs 人際管道的接觸次數）。
Confirmation of Expectations:
  zh: ''
  scales:
  - name: Bhattacherjee (2001)
    source: Bhattacherjee (2001) IS continuance model 的 confirmation 3 題，MIS Quarterly；源自 Oliver (1980) ECT
    url: https://technologyadoptionbarriers.org/bibliography-1-14-expectation-confirmation-model-ecm-bhattacherjee-2001/
    verified: false
    items:
    - My experience with using [online banking] was better than what I expected
    - The service level provided by [online banking] was better than what I expected
    - Overall, most of my expectations from using [online banking] were confirmed
    scale: 7-point Likert, 1=strongly disagree to 7=strongly agree
    reliability: Bhattacherjee (2001) confirmation CR = .82（Table 3）；AVE .60–.65
    context: ''
    notes: CR 值已從開啟頁核對；題項文字為該研究廣被沿用的三題【未核對逐字】。Oliver (1980) 原始 disconfirmation 題式為 'better than expected – worse
      than expected' 7 點。
Customer Retention:
  zh: ''
  scales:
  - name: 客觀：續約率／回購率／流失率（churn）；意向：Zeithaml, Berry & Parasuraman (1996)
    source: 客觀：續約率／回購率／流失率（churn）；意向：Zeithaml, Berry & Parasuraman (1996) behavioral intentions battery 的 loyalty
      子量表
    url: ''
    verified: false
    items:
    - 'Objective: proportion of customers still active after 12 months (retention rate); renewal rate; churn rate'
    - I will do more business with [company] in the next few years
    - I consider [company] my first choice to buy [service]
    - I will continue to use [company] even if its prices increase somewhat
    - I would recommend [company] to someone who seeks my advice
    scale: 客觀為比率；意向題 7-point（extremely unlikely – extremely likely）
    reliability: Zeithaml et al. (1996) loyalty 子量表 α ≈ .93【未核對】
    context: ''
    notes: 這是行為／客觀指標，意向題只是代理。ACSI 用 repurchase likelihood 與 price tolerance 兩題 10 點；SCE 研究常把 retention 當二分依變項。意向題依
      Zeithaml et al. (1996) 常見轉述改寫【未核對】。
Facilitating Conditions:
  zh: ''
  scales:
  - name: Venkatesh, Morris, Davis & Davis (2003)
    source: Venkatesh, Morris, Davis & Davis (2003) UTAUT 4 題（Appendix A）
    url: https://open.ncl.ac.uk/concepts/4/facilitating-conditions/
    verified: true
    items:
    - I have the resources necessary to use the system
    - I have the knowledge necessary to use the system
    - The system is not compatible with other systems I use (R)
    - A specific person (or group) is available for assistance with system difficulties
    scale: 7-point Likert, 1=strongly disagree to 7=strongly agree
    reliability: Venkatesh et al. (2003) α > .70（TheoryHub 摘錄，n=645）；UTAUT2 (2012) 4 題 CR ≈ .88
    context: ''
    notes: 四題文字依搜尋結果引述的 ResearchGate 討論串與 PMC9731221 表格（FC1）；原文 Appendix A 未直接開啟。TIB 脈絡同義詞為 facilitating conditions（Triandis
      1980）；TTF 脈絡則拆成 training / support 面向。
Helping Behavior:
  zh: ''
  scales:
  - name: Podsakoff, MacKenzie, Moorman & Fetter (1990)
    source: Podsakoff, MacKenzie, Moorman & Fetter (1990) OCB altruism 5 題；Smith, Organ & Near (1983)
    url: https://en.wikipedia.org/wiki/Organizational_citizenship_behavior
    verified: false
    items:
    - Willingly helps others who have work related problems
    - Helps others who have been absent
    - Helps others who have heavy work loads
    - Is always ready to lend a helping hand to those around him/her
    - Helps orient new people even though it is not required
    scale: 7-point Likert, 1=strongly disagree to 7=strongly agree（主管或同事評）
    reliability: Podsakoff et al. (1990) altruism α ≈ .85【未核對】
    context: ''
    notes: 前兩題為 Wikipedia 頁所列原題；其餘依 Podsakoff 1990 常見轉述【未核對】。Attachment／SMSC 的實驗研究多用行為觀察（捐款金額、是否協助撿拾物品）而非量表。
Innovativeness:
  zh: ''
  scales:
  - name: Agarwal & Prasad (1998)
    source: Agarwal & Prasad (1998) Personal Innovativeness in IT (PIIT) 4 題，Information Systems Research；Rogers
      (1962/2003) 以採用時間分類
    url: https://en.wikipedia.org/wiki/Diffusion_of_innovations
    verified: false
    items:
    - If I heard about a new information technology, I would look for ways to experiment with it
    - Among my peers, I am usually the first to try out new information technologies
    - In general, I am hesitant to try out new information technologies (R)
    - I like to experiment with new information technologies
    - 'Rogers: time of adoption relative to the social system (innovators / early adopters / early majority / late
      majority / laggards)'
    scale: 7-point Likert, 1=strongly disagree to 7=strongly agree（PIIT）；Rogers 為採用時間的類別
    reliability: Agarwal & Prasad (1998) PIIT α ≈ .84【未核對】
    context: ''
    notes: PIIT 四題依常見轉述改寫【未核對】。TRI（Parasuraman 2000）的 innovativeness 子量表另有 7 題（TRI 2.0 為 4 題）。IRT 脈絡的『創新屬性』若指產品特性，改用
      Moore & Benbasat (1991) 各面向。
Loss Aversion:
  zh: ''
  scales:
  - name: Tversky & Kahneman (1992)
    source: Tversky & Kahneman (1992) 損失趨避係數 λ；Gächter, Johnson & Herrmann (2007/2022) 彩券接受法；Kahneman, Knetsch &
      Thaler (1990) 稟賦效應實驗
    url: https://en.wikipedia.org/wiki/Loss_aversion
    verified: true
    items:
    - 'Gamble acceptance: Would you accept a 50/50 gamble to win $6 or lose $X? (series with X varied; λ = gain/loss
      ratio at indifference)'
    - WTA/WTP ratio from endowment experiments (sellers' minimum price ÷ buyers' maximum price)
    - λ estimated from prospect theory value function fitted to choice data (typical λ ≈ 2)
    - 'Self-report (rare): I am more upset by losing $100 than I am pleased by winning $100'
    scale: 行為任務；λ 為連續值（≈2 表示損失感受約為等額獲利的兩倍）
    reliability: ''
    context: ''
    notes: 這是行為／參數指標，不是態度量表；Wikipedia 頁未提 λ 一詞。Default／Nudge 研究通常操弄框架而不測個體損失趨避。
Organization Size:
  zh: ''
  scales:
  - name: 客觀指標：員工人數（常取對數）、年營收、總資產（Tornatzky & Fleischer 1990 TOE；組織生態學
    source: 客觀指標：員工人數（常取對數）、年營收、總資產（Tornatzky & Fleischer 1990 TOE；組織生態學常用）
    url: https://en.wikipedia.org/wiki/Technology%E2%80%93organization%E2%80%93environment_framework
    verified: true
    items:
    - Number of full-time employees (log-transformed)
    - Annual sales revenue / total assets
    - 'Categorical: micro (<10) / small (10–49) / medium (50–249) / large (250+) employees'
    - 'Self-report: Approximately how many people work in your organization?'
    scale: 連續值或類別
    reliability: ''
    context: ''
    notes: 客觀結構指標，不是量表；Wikipedia TOE 頁僅給架構，未列操作化。台灣可用經濟部中小企業認定標準（製造業實收資本額／員工 200 人）切類。
Perceived Cost:
  zh: ''
  scales:
  - name: Luarn & Lin (2005)
    source: Luarn & Lin (2005) perceived financial cost（mobile banking）；Kim, Chan & Gupta (2007) perceived fee；SET
      脈絡則為知覺付出
    url: ''
    verified: false
    items:
    - I think using [mobile banking] is expensive
    - The fee that I have to pay for the use of [service] is too high
    - The fee that I have to pay for the use of [service] is reasonable (R)
    - Using [the service] requires a lot of time and effort（非財務成本）
    scale: 7-point Likert, 1=strongly disagree to 7=strongly agree
    reliability: Luarn & Lin (2005) perceived financial cost α ≈ .90；Kim et al. (2007) perceived fee CR ≈ .90【未核對】
    context: ''
    notes: 題項依常見文獻改寫【未核對】。RCT／EVT 脈絡的 cost 常含時間、努力、心理成本，可用 Kim et al. (2007) 的 technicality / perceived fee 兩面向；EVT（Eccles）的
      cost 另有 Flake et al. (2015) 量表。
Perceived Reward:
  zh: ''
  scales:
  - name: Bock, Zmud, Kim & Lee (2005)
    source: Bock, Zmud, Kim & Lee (2005) anticipated extrinsic rewards；Kankanhalli, Tan & Wei (2005) organizational
      reward；VIE 的 valence × instrumentality
    url: https://en.wikipedia.org/wiki/Expectancy_theory
    verified: false
    items:
    - I will receive a higher salary in return for [behavior X]
    - I will receive a bonus in return for [behavior X]
    - I will receive additional points for promotion in return for [behavior X]
    - '[Behavior X] should be rewarded with a higher salary / bonus / promotion'
    scale: 7-point Likert, 1=strongly disagree to 7=strongly agree
    reliability: Bock et al. (2005) anticipated extrinsic rewards α ≈ .91【未核對】
    context: ''
    notes: 題項依 Bock et al. (2005) 常見轉述改寫【未核對】。本變數在檔案被歸到『情緒／愉悅』子群，若實際指內在酬賞，改用 Davis et al. (1992) enjoyment 3 題或
      PANAS 正向情緒。
Personal Values:
  zh: ''
  scales:
  - name: Schwartz (1992)
    source: Schwartz (1992) Schwartz Value Survey (SVS, 57 題)；Schwartz et al. (2001) Portrait Values Questionnaire
      (PVQ-40 / ESS 用 PVQ-21)；Kahle (1983) List of Values 為行銷替代
    url: https://en.wikipedia.org/wiki/Theory_of_basic_human_values
    verified: false
    items:
    - 'PVQ: It is important to him/her to listen to people who are different from him/her. Even when he/she disagrees
      with them, he/she still wants to understand them (universalism)'
    - 'PVQ: It is very important to him/her to help the people around him/her. He/she wants to care for their well-being
      (benevolence)'
    - 'PVQ: He/she strongly believes that people should care for nature. Looking after the environment is important
      to him/her (universalism–nature)'
    - 'SVS: rate the importance of each value (e.g., EQUALITY, A WORLD OF BEAUTY, HELPFUL) as a guiding principle
      in my life'
    scale: PVQ 6-point：very much like me – not like me at all；SVS −1 到 7（0=not important, 7=of supreme importance）
    reliability: PVQ-21 各價值 α 多 .50–.75（短題組偏低）；PVQ-40 多 .60–.85【未核對】
    context: ''
    notes: 量表格式與錨點已從 Wikipedia 頁核對；PVQ 具體題文依 ESS 常見版本改寫【未核對】。MEC 脈絡用 laddering 訪談而非量表；U&G 脈絡多用 LOV 9 項。
Relative Advantage:
  zh: ''
  scales:
  - name: Moore & Benbasat (1991)
    source: Moore & Benbasat (1991) Perceived Characteristics of Innovating 的 relative advantage 子量表，Information
      Systems Research（與 TAM 的 perceived usefulness 高度重疊）
    url: https://en.wikipedia.org/wiki/Diffusion_of_innovations
    verified: false
    items:
    - Using [the system] enables me to accomplish tasks more quickly
    - Using [the system] improves the quality of work I do
    - Using [the system] makes it easier to do my job
    - Using [the system] enhances my effectiveness on the job
    - Using [the system] increases my productivity
    scale: 7-point Likert, extremely disagree to extremely agree
    reliability: Moore & Benbasat (1991) relative advantage α ≈ .90；Miller, Rainer & Harper (1997) 驗證單維且信度良好【α 值未核對】
    context: ''
    notes: 題項依 Moore & Benbasat (1991) 常見轉述改寫【未核對】；MISQ 的題項頁（misq.umn.edu）回 403。TOE 組織層研究改寫主詞為 'our firm'。
Search Time:
  zh: ''
  scales:
  - name: Treisman & Gelade (1980)
    source: Treisman & Gelade (1980) 特徵整合理論、Wolfe (1994) Guided Search 的視覺搜尋反應時間
    url: https://en.wikipedia.org/wiki/Visual_search
    verified: true
    items:
    - Reaction time (ms) from display onset to target-present / target-absent response
    - 'RT × set size slope (ms per item): flat slope = efficient (pre-attentive) search; steep slope = serial search'
    - Accuracy / error rate on target-present and target-absent trials
    - 'Eye-tracking: time to first fixation on target; number of fixations before locating target'
    scale: 客觀毫秒值與斜率
    reliability: ''
    context: ''
    notes: 這是客觀反應時間指標，不是態度量表。資訊視覺化研究常報 median RT 與正確率，並以 set size slope 判定是否 pre-attentive。
Service Quality:
  zh: ''
  scales:
  - name: Parasuraman, Zeithaml & Berry (1988)
    source: Parasuraman, Zeithaml & Berry (1988) SERVQUAL 22 題 × 5 面向；Cronin & Taylor (1992) SERVPERF 只測知覺
    url: https://en.wikipedia.org/wiki/SERVQUAL
    verified: false
    items:
    - 'Tangibles: [XYZ company] has modern-looking equipment'
    - 'Reliability: [XYZ company] provides its services at the promised time'
    - 'Responsiveness: Employees of [XYZ] are never too busy to respond to your requests'
    - 'Assurance: The behaviour of employees of [XYZ] instils confidence in you'
    - 'Empathy: [XYZ] has operating hours convenient to all its customers'
    scale: 7-point Likert, 1=strongly disagree to 7=strongly agree；SERVQUAL 計分 = 知覺 − 期望（每題成對）
    reliability: PZB (1988) 各面向 α .52–.84、整體 .92；SERVPERF 整體 α ≈ .96【依常見轉述，未核對】
    context: ''
    notes: 題項從 Wikipedia 頁的 perception 題抄錄。D&M IS 成功模型的 service quality 沿用 SERVQUAL 改寫為 IS 部門（Pitt, Watson & Kavan
      1995）；SPC 脈絡則多用員工自評或顧客滿意代理。
Social Distance:
  zh: ''
  scales:
  - name: 'Bogardus (1925/1947) Social Distance Scale；CLT 脈絡以 self vs. '
    source: Bogardus (1925/1947) Social Distance Scale；CLT 脈絡以 self vs. other 操弄；Affective Polarization 用 Iyengar,
      Sood & Lelkes (2012) 社會距離題
    url: https://en.wikipedia.org/wiki/Bogardus_social_distance_scale
    verified: false
    items:
    - I would be willing to accept [group members] as close relatives by marriage
    - I would be willing to accept [group members] as my close personal friends
    - I would be willing to accept [group members] as neighbors on the same street
    - I would be willing to accept [group members] as co-workers in the same occupation
    - 'Affective polarization: How would you feel if your son or daughter married a supporter of the [other party]?
      (not at all upset – very upset)'
    scale: Bogardus 為 Guttman 累積量表，分數 1（無距離）到 7（拒絕入境）；Iyengar 題 4–5 點
    reliability: Guttman 量表報再生係數而非 α（Wikipedia 頁未列）
    context: ''
    notes: Bogardus 七階已從 Wikipedia 頁核對。TPE 研究的 social distance 通常是操弄（自己／同校學生／一般大眾）而非量表；Iyengar 題依常見轉述【未核對】。
Stereotyping:
  zh: ''
  scales:
  - name: Fiske, Cuddy, Glick & Xu (2002)
    source: Fiske, Cuddy, Glick & Xu (2002) Stereotype Content Model 的 warmth / competence 評定；Katz & Braly (1933)
      形容詞勾選法
    url: https://en.wikipedia.org/wiki/Stereotype_content_model
    verified: false
    items:
    - As viewed by society, how warm are members of this group? (1=not at all to 5=extremely)
    - As viewed by society, how friendly / good-natured / sincere are members of this group?
    - As viewed by society, how competent are members of this group?
    - As viewed by society, how capable / skillful / confident are members of this group?
    - 'Adjective checklist: percentage of respondents assigning trait X to the group (Katz & Braly 1933)'
    scale: SCM 5-point (not at all – extremely)；形容詞勾選為比例
    reliability: SCM warmth 與 competence 各 4 題 α 多 ≥ .80【未核對】
    context: ''
    notes: Wikipedia 頁僅列書目，未列題項；題項依 Fiske et al. (2002) 常見轉述改寫【未核對】。NFCC／Schema 研究常改用內隱測量（IAT）或記憶偏誤任務當刻板化指標。
Argument Quality:
  zh: ''
  scales:
  - name: Bhattacherjee & Sanford (2006)
    source: Bhattacherjee & Sanford (2006) argument quality，MIS Quarterly；ELM 實驗傳統（Petty & Cacioppo 1986）以強／弱論證操弄並做操弄檢核
    url: ''
    verified: false
    items:
    - 'The arguments presented in the message were: informative'
    - 'The arguments presented in the message were: helpful'
    - 'The arguments presented in the message were: valuable'
    - 'The arguments presented in the message were: persuasive'
    - 'Manipulation check: The message presented strong / convincing arguments'
    scale: 7-point Likert, 1=strongly disagree to 7=strongly agree
    reliability: Bhattacherjee & Sanford (2006) CR ≈ .9【未核對】；後續研究 4 題 perceived argument quality α = .850（依摘要）
    context: ''
    notes: 題項依 Bhattacherjee & Sanford (2006) 常見轉述改寫【未核對】；搜尋結果顯示後續健康傳播研究將其操作為 informative / persuasive 等 4 題。HSM
      脈絡也常用 Zhang (1996) 的 argument strength 操弄檢核。
Brand Awareness:
  zh: ''
  scales:
  - name: Yoo & Donthu (2001)
    source: Yoo & Donthu (2001) 多面向顧客基礎品牌權益量表的 brand awareness/associations，Journal of Business Research；Keller
      (1993) CBBE 的回憶／辨識測驗
    url: ''
    verified: false
    items:
    - I can recognize [X] among other competing brands
    - I am aware of [X]
    - Some characteristics of [X] come to my mind quickly
    - I can quickly recall the symbol or logo of [X]
    - 'Objective: unaided recall (top-of-mind) and aided recognition tasks'
    scale: 5-point Likert, 1=strongly disagree to 5=strongly agree（Yoo & Donthu 亦有 7 點版本）
    reliability: Yoo & Donthu (2001) awareness/associations α ≈ .86–.90【未核對】；二手研究 3 題版 α .748、5 題版 .752（依摘要）
    context: ''
    notes: 題項依 Yoo & Donthu (2001) 常見轉述改寫【未核對】；原文為 ScienceDirect 付費。HoE 脈絡建議搭配客觀回憶測驗。
Ecological Worldview:
  zh: ''
  scales:
  - name: Dunlap, Van Liere, Mertig & Jones (2000)
    source: Dunlap, Van Liere, Mertig & Jones (2000) 修訂版 New Ecological Paradigm (NEP) 15 題，Journal of Social Issues
    url: ''
    verified: false
    items:
    - We are approaching the limit of the number of people the earth can support
    - Humans have the right to modify the natural environment to suit their needs (R)
    - When humans interfere with nature it often produces disastrous consequences
    - The balance of nature is strong enough to cope with the impacts of modern industrial nations (R)
    - Humans are severely abusing the environment
    - If things continue on their present course, we will soon experience a major ecological catastrophe
    scale: 5-point Likert, 1=strongly disagree to 5=strongly agree（7 題反向）
    reliability: Dunlap et al. (2000) α = .83【未核對】；VBN 研究（Stern et al. 1999）用 6 題短版 α ≈ .75
    context: ''
    notes: 題項依 NEP 常見轉述改寫【未核對】；Wikipedia 'New Ecological Paradigm' 頁內容為環境社會學概述，未列題項，midss 頁回 403。VBN 模型中 ecological
      worldview 即 NEP。
In-group:
  zh: ''
  scales:
  - name: Leach et al. (2008)
    source: Leach et al. (2008) 多成分團體認同量表 14 題（solidarity / satisfaction / centrality / self-stereotyping / homogeneity）；Mael
      & Ashforth (1992) 組織認同 6 題；SIDE 研究多為操弄
    url: ''
    verified: false
    items:
    - I feel a bond with [in-group] (solidarity)
    - I feel solidarity with [in-group] (solidarity)
    - I am glad to be [in-group member] (satisfaction)
    - I often think about the fact that I am [in-group member] (centrality)
    - I have a lot in common with the average [in-group member] (self-stereotyping)
    - 'Mael & Ashforth: When someone criticizes [group], it feels like a personal insult'
    scale: 7-point Likert, 1=strongly disagree to 7=strongly agree
    reliability: Leach et al. (2008) 各子量表 α .80–.95（搜尋摘要稱 high internal consistency，數值未核對）
    context: ''
    notes: 題項依 Leach et al. (2008) 常見轉述改寫【未核對】；搜尋結果確認 14 題五成分結構。若 in-group 是實驗操弄（minimal group / SIDE 的匿名＋群體線索），則不需量表，只做操弄檢核。
Perceived Behavioral Control:
  zh: ''
  scales:
  - name: 'Ajzen (1991, 2002/2006) TPB 直接測量（capacity / self-efficacy ＋ '
    source: Ajzen (1991, 2002/2006) TPB 直接測量（capacity / self-efficacy ＋ autonomy / controllability）
    url: https://people.umass.edu/aizen/tpb.html
    verified: false
    items:
    - 'For me to [perform behavior X] would be: extremely difficult – extremely easy'
    - I am confident that I could [perform behavior X] if I wanted to
    - Whether or not I [perform behavior X] is entirely up to me
    - I have complete control over whether I [perform behavior X]
    - There are factors outside my control that could prevent me from [performing behavior X] (R)
    scale: 7-point bipolar 或 7-point Likert（strongly disagree – strongly agree）
    reliability: 藥師前測 α = .422（刪一題後提高，依摘要）；Ajzen 指出 PBC 兩成分常使 α 偏低，實證多在 .60–.85
    context: ''
    notes: 第一題為 Ajzen sample questionnaire 題式（搜尋結果引述）；其餘為 Ajzen 指引常見題式【未核對逐字】。VIE 脈絡則改用 expectancy 題。
Task Characteristics:
  zh: ''
  scales:
  - name: Goodhue & Thompson (1995)
    source: Goodhue & Thompson (1995) TTF 的 task non-routineness / interdependence；Withey, Daft & Cooper (1983)
      task variety / analyzability；CFT 以任務型態操弄（spatial vs. symbolic）
    url: ''
    verified: false
    items:
    - I frequently deal with ad-hoc, non-routine business problems (non-routineness)
    - I frequently deal with ill-defined business problems (non-routineness)
    - The business problems I deal with frequently involve more than one business function (interdependence)
    - How many of the tasks you do are the same from day to day? (variety, R)
    - To what extent is there a clearly known way to do the major types of work you normally encounter? (analyzability)
    scale: 7-point Likert（Goodhue & Thompson）或 5–7 點程度題（Withey et al.）
    reliability: Goodhue & Thompson (1995) non-routineness α ≈ .76、interdependence 單題；Withey et al. (1983) variety
      α ≈ .83、analyzability α ≈ .82【未核對】
    context: ''
    notes: 題項依 TTF／Withey 常見轉述改寫【未核對】；Wikipedia TTF 頁回 404。CFT 研究中任務特性是實驗操弄（spatial / symbolic task），不用量表。
Agency Problem:
  zh: ''
  scales:
  - name: Jensen & Meckling (1976)
    source: Jensen & Meckling (1976) 代理成本概念；實證代理指標：Ang, Cole & Lin (2000) 費用率與資產周轉率；Jensen & Murphy (1990) 薪酬敏感度
    url: https://en.wikipedia.org/wiki/Principal%E2%80%93agent_problem
    verified: false
    items:
    - 'Agency cost proxy 1: operating expenses ÷ annual sales (higher = more perquisite consumption)'
    - 'Agency cost proxy 2: annual sales ÷ total assets (asset utilization; lower = more agency cost)'
    - 'Pay–performance sensitivity: change in CEO wealth per $1,000 change in shareholder wealth'
    - 'Ownership structure: insider ownership %, free cash flow, board independence as agency-conflict indicators'
    scale: 客觀財務比率
    reliability: ''
    context: ''
    notes: 這是客觀／概念性指標，不是態度量表；Wikipedia 頁未提 Ang et al. (2000)，該兩項代理指標為財務文獻常用【未核對】。若需知覺題，可改用 Pavlou et al. (2007)
      的 fears of opportunism。
Burnout:
  zh: ''
  scales:
  - name: Maslach & Jackson (1981)
    source: Maslach & Jackson (1981) Maslach Burnout Inventory (MBI-HSS 22 題：EE 9 / DP 5 / PA 8)；MBI-GS 16 題（Exhaustion
      / Cynicism / Professional Efficacy）；JD-R 研究也常用 OLBI、CBI
    url: https://en.wikipedia.org/wiki/Maslach_Burnout_Inventory
    verified: false
    items:
    - I feel emotionally drained from my work (EE)
    - I feel used up at the end of the workday (EE)
    - I feel burned out from my work (EE)
    - I have become more callous toward people since I took this job (DP)
    - I deal very effectively with the problems of my recipients (PA, reverse-indicates burnout)
    scale: 7-point frequency, 0=never 到 6=every day（never / a few times a year or less / once a month or less /
      a few times a month / once a week / a few times a week / every day）
    reliability: Maslach & Jackson (1981) EE α = .90、DP .79、PA .71【未核對】；meta-analyses 顯示 EE 信度穩定、DP 與 PA 較弱（Wikipedia
      頁）
    context: ''
    notes: 第一題為搜尋結果引述 PMC8369754 表格的 E1 原題；其餘為常見題例【未核對】。MBI 為版權量表（Mind Garden）；開放替代：Oldenburg Burnout Inventory
      (Demerouti 2003)、Copenhagen Burnout Inventory (Kristensen 2005)。
Cues to Action:
  zh: ''
  scales:
  - name: Rosenstock (1974)
    source: Rosenstock (1974) HBM 的 cues to action（內在症狀／外在提醒）；Champion & Skinner (2008) 與多數 HBM 問卷用自編 3–5 題
    url: https://en.wikipedia.org/wiki/Health_belief_model
    verified: false
    items:
    - A doctor or nurse has recommended that I get [screening / vaccine]
    - I have recently seen or heard information about [health issue] in the media
    - Someone close to me (family / friend) has had [health condition]
    - I have received a reminder (letter / message) to [perform health behavior]
    - I have experienced symptoms that made me think about [health condition]
    scale: yes/no 計數（cue index）或 5-point Likert（strongly disagree – strongly agree）
    reliability: 自編題，α 多 .60–.80；Wikipedia 頁指出 cues 'often difficult to assess'
    context: ''
    notes: 無公認標準量表；題項依 HBM 問卷常見作法改寫【未核對】。多數研究把 cues 視為事件計數或單題，而非態度量表。
Fear Control:
  zh: ''
  scales:
  - name: Witte (1994)
    source: Witte (1994) EPPM 首次實證；Witte et al. (1996) Risk Behavior Diagnosis Scale 配套的 fear control 反應（defensive
      avoidance / message minimization / perceived manipulation）
    url: https://en.wikipedia.org/wiki/Extended_parallel_process_model
    verified: false
    items:
    - 'Defensive avoidance: When I think about [health threat], I want to avoid thinking about it any further'
    - 'Defensive avoidance: When I think about [health threat], my first instinct is to not think about it'
    - 'Message minimization: The message about [threat] was exaggerated / overblown / overstated'
    - 'Perceived manipulation: The message about [threat] was manipulative / misleading / distorted'
    - 'Reactance: This message tried to pressure me / threatened my freedom to choose'
    scale: 7-point Likert (strongly disagree – strongly agree) 或 7 點語意差異（minimization 用 not at all – very much）
    reliability: Witte (1994) defensive avoidance α ≈ .80、minimization α ≈ .85【未核對】
    context: ''
    notes: Wikipedia 頁僅列概念與 Witte 1992/1994 書目；題項依 EPPM 實證常見作法改寫【未核對】。RBD 量表的『discriminating value』= 效能分數 − 威脅分數，為正表示
      danger control、為負表示 fear control，可當替代指標。
Instrumentality:
  zh: ''
  scales:
  - name: Vroom (1964)
    source: Vroom (1964) expectancy theory 的 P→O instrumentality；各研究自編題（如 Sanchez, Truxillo & Bauer 2000；Chiang
      & Jang 2008）
    url: https://en.wikipedia.org/wiki/Expectancy_theory
    verified: false
    items:
    - 'If I perform well on [task], I will receive [outcome: bonus / promotion / recognition]'
    - Good performance in my job leads to a pay raise
    - High performance is rewarded in this organization
    - What is the probability (0–100%) that good performance will lead to [outcome]?
    scale: 7-point Likert 或 0–1 主觀機率；常與 valence 相乘後加總
    reliability: 自編 I 題組 α 多 .75–.90【未核對】
    context: ''
    notes: 無單一標準量表；Wikipedia 頁只給定義。題項依 VIE 研究常見題式改寫【未核對】。
Organization:
  zh: ''
  scales:
  - name: Tornatzky & Fleischer (1990)
    source: Tornatzky & Fleischer (1990) TOE 的 organizational context（firm size, top management support, slack resources,
      centralization/formalization, IT expertise）；Oliveira & Martins (2011) 綜述
    url: https://en.wikipedia.org/wiki/Technology%E2%80%93organization%E2%80%93environment_framework
    verified: false
    items:
    - 'Firm size: number of employees / annual revenue (objective)'
    - 'Top management support: Top management is interested in the adoption of [technology]'
    - 'Top management support: Top management considers [technology] adoption important to the organization'
    - 'Organizational readiness: Our firm has the financial resources to adopt [technology]'
    - 'Organizational readiness: Our employees have the IT skills needed to use [technology]'
    scale: 客觀值 ＋ 7-point Likert (strongly disagree – strongly agree)
    reliability: top management support 3 題 α 多 ≥ .85【未核對】
    context: ''
    notes: 『Organization／Organizational Context』是 TOE 的一個情境面，不是單一構念；各研究挑子因素測。Wikipedia 頁僅給三情境架構；子因素題項依 TOE 實證常見作法改寫【未核對】。
Perceived Health Benefits:
  zh: ''
  scales:
  - name: Champion (1999)
    source: Champion (1999) Benefits Scale for mammography（HBM）；Champion (1984) 乳房自我檢查版
    url: https://cancercontrol.cancer.gov/brp/research/constructs/perceived-benefits
    verified: false
    items:
    - If I get a mammogram and nothing is found, I do not worry as much about breast cancer
    - Having a mammogram will help me find breast lumps early
    - If I find a lump through a mammogram, my treatment for breast cancer may not be as bad
    - 'Rawl et al. (2001): Finding colorectal cancer early will save your life'
    scale: '5-point Likert: strongly disagree / disagree / neutral / agree / strongly agree'
    reliability: Champion (1999) α = .75；Rawl et al. (2001) α .65–.70；Wardle et al. (2003) α = .83
    context: ''
    notes: 題項從 NCI 頁逐字抄錄，需依目標健康行為改寫。
Relatedness:
  zh: ''
  scales:
  - name: Deci & Ryan (2000)
    source: Deci & Ryan (2000) / Gagné (2003) Basic Psychological Need Satisfaction Scale (BPNS, 21 題) 的 relatedness
      子量表；Chen et al. (2015) BPNSFS 24 題（含 relatedness satisfaction / frustration）
    url: https://selfdeterminationtheory.org/basic-psychological-need-satisfaction-scales/
    verified: false
    items:
    - I really like the people I interact with (BPNS)
    - I get along with people I come into contact with (BPNS)
    - People in my life care about me (BPNS)
    - I feel that the people I care about also care about me (BPNSFS satisfaction)
    - I feel connected with people who care for me, and for whom I care (BPNSFS satisfaction)
    - I feel excluded from the group I want to belong to (BPNSFS frustration)
    scale: BPNS 7-point (1=not at all true 到 7=very true)；BPNSFS 5-point (1=completely untrue 到 5=completely true)
    reliability: BPNS relatedness α ≈ .80–.85；BPNSFS relatedness satisfaction α ≈ .80【未核對】
    context: ''
    notes: 官方頁面列出量表與引用，題項 PDF 需同意條款後下載；題項依常見轉述改寫【未核對】。
Resource Value:
  zh: ''
  scales:
  - name: Barney (1991)
    source: Barney (1991) VRIN 判準的 value；實證多為質性 VRIO 評估或自評題（如 Talaja 2012、Newbert 2008 的 resource value / rareness
      量表）
    url: https://en.wikipedia.org/wiki/Resource-based_view
    verified: false
    items:
    - This resource enables our firm to exploit opportunities in its environment
    - This resource enables our firm to neutralize threats in its environment
    - This resource helps our firm to implement strategies that improve efficiency and effectiveness
    - 'Qualitative VRIO audit: is the resource valuable / rare / costly to imitate / organized to capture value?
      (yes/no)'
    scale: 7-point Likert 或 VRIO 勾選
    reliability: Newbert (2008) resource value 題組 α ≈ .80【未核對】
    context: ''
    notes: 無公認標準量表；多數 RBV 研究以績效或次級資料推論資源價值。題項依 Barney (1991) 定義改寫【未核對】。
System Quality:
  zh: ''
  scales:
  - name: DeLone & McLean (1992, 2003) IS 成功模型；Wixom & Todd (2005) sys
    source: DeLone & McLean (1992, 2003) IS 成功模型；Wixom & Todd (2005) system quality 子構念（reliability / flexibility
      / integration / accessibility / timeliness）
    url: https://en.wikipedia.org/wiki/Information_systems_success_model
    verified: false
    items:
    - Overall, I would give the quality of [the system] a high rating
    - In terms of system quality, I would rate [the system] highly
    - '[The system] operates reliably / is subject to few unexpected failures (reliability)'
    - '[The system] allows information to be readily accessed (accessibility)'
    - '[The system] provides information in a timely fashion (timeliness)'
    - '[The system] can be adapted to meet a variety of needs (flexibility)'
    scale: 7-point Likert, 1=strongly disagree to 7=strongly agree
    reliability: Wixom & Todd (2005) system quality 4 題 CR ≈ .94【未核對】
    context: ''
    notes: Wikipedia 頁僅給模型關係，未列題項；題項依 Wixom & Todd (2005) 常見轉述改寫【未核對】。Petter, DeLone & McLean (2008) 彙整的 system
      quality 指標含 ease of use、response time、flexibility、reliability。
Transaction Frequency:
  zh: ''
  scales:
  - name: Williamson (1985)
    source: Williamson (1985) 交易屬性之一；實證多用客觀交易次數或自評頻率（如 Heide & John 1990、Grover & Malhotra 2003）
    url: https://en.wikipedia.org/wiki/Transaction_cost
    verified: true
    items:
    - 'Objective: number of transactions / orders with this partner per year'
    - How frequently does your firm transact with this supplier? (very rarely – very frequently)
    - We purchase from this supplier on a continuous / recurring basis
    - Share of total purchases sourced from this supplier (%)
    scale: 次數計數或 7 點頻率
    reliability: ''
    context: ''
    notes: 這是客觀／頻率指標，不是態度量表；Wikipedia 頁只給概念定義。TCE 研究中 frequency 常以 recurrent vs. occasional 二分。
Continuance Intention:
  zh: ''
  scales:
  - name: Bhattacherjee (2001)
    source: Bhattacherjee (2001), MIS Quarterly 25(3), 351–370, IS continuance intention 3 題
    url: ''
    verified: false
    items:
    - I intend to continue using [the system] rather than discontinue its use.
    - My intentions are to continue using [the system] than use any alternative means.
    - If I could, I would like to discontinue my use of [the system]. (R)
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree
    reliability: 原始研究 α 約 .80 以上（未核對）；後續研究常見 α .85–.95
    context: ''
    notes: '[記憶重建] 搜尋只確認出處（線上銀行樣本、ECT 基礎），開到的 Vedadi & Warkentin (2016) 複製研究為 PDF 無法讀取，PMC 表格被 reCAPTCHA 擋下。ECT
      脈絡另需 confirmation、satisfaction 題（同一篇附錄）。'
Trust in AI:
  zh: ''
  scales:
  - name: Jian, Bisantz & Drury (2000)
    source: Jian, Bisantz & Drury (2000), International Journal of Cognitive Ergonomics 4(1), 53–71, Trust in Automation
      Scale（TIAS, 12 題）；短版 S-TIAS 3 題（McGrath et al. 2025）
    url: https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1582880/full
    verified: true
    items:
    - The system is deceptive. (R)
    - The system behaves in an underhanded manner. (R)
    - I am suspicious of the system's intent, action, or output. (R)
    - I am wary of the system. (R)
    - The system's action will have a harmful or injurious outcome. (R)
    - I am confident in the system.
    - The system provides security.
    - The system has integrity.
    - The system is dependable.
    - The system is reliable.
    - I can trust the system.
    - I am familiar with the system.
    scale: 7-point, 1 = not at all, 7 = extremely
    reliability: α = .94–.95（McGrath et al. 2025 四個研究，N = 270/270/182/180）；S-TIAS 三題 α = .97
    context: ''
    notes: '[逐字] 原始論文未報信度；Spain et al. (2008) 與 Perrig et al. (2023) 發現 trust／distrust 兩因子；Gutzwiller et al. (2019)
      指出有正向偏誤。S-TIAS 三題：I am confident in the AI assistant / The AI assistant is reliable / I can trust the AI assistant。替代：Madsen
      & Gregor (2000) HCT、Chancey et al. (2017)、演算法脈絡的 Trust in Algorithm。'
Knowledge:
  zh: ''
  scales:
  - name: 主觀知識：Flynn & Goldsmith (1999)
    source: 主觀知識：Flynn & Goldsmith (1999), Journal of Business Research 46, 57–66, 5 題 subjective knowledge；客觀知識：題目式測驗（答對題數）
    url: ''
    verified: false
    items:
    - I know pretty much about [product/topic].
    - I do not feel very knowledgeable about [product/topic]. (R)
    - Among my circle of friends, I'm one of the experts on [product/topic].
    - Compared to most other people, I know less about [product/topic]. (R)
    - When it comes to [product/topic], I really don't know a lot. (R)
    scale: 5- 或 7-point Likert, strongly disagree – strongly agree
    reliability: 原始研究 α 約 .80–.90（未核對）
    context: ''
    notes: '[記憶重建] 搜尋沒有命中原文或附錄。[客觀指標] 若指先備知識／health knowledge（HBM、NTT、ELM 的 prior knowledge），常見操作化是研究者自編的 true/false
      或選擇題測驗，以答對比例計分，報 KR-20；ELM 脈絡也常用 Zaichkowsky 式的 familiarity 題。'
Working Memory Capacity:
  zh: ''
  scales:
  - name: Unsworth, Heitz, Schrock & Engle (2005)
    source: Unsworth, Heitz, Schrock & Engle (2005), Behavior Research Methods 37, 498–505, Automated Operation
      Span (AOSPAN)；複雜廣度作業（operation / symmetry / reading span）
    url: https://www.psytoolkit.org/library/aospan.html
    verified: true
    items:
    - '[作業] 交替呈現簡單算式（判斷對錯）與待記字母，每組 3–7 個，結束後依序回憶字母；標準版 15 試題（每個組長各 3 題），滿分 75'
    - '[計分] absolute score（整組全對才得分）或 partial-credit（每個正確位置計 1 分）；處理作業正確率需 ≥ 85% 才納入'
    - '[短版] Oswald et al. (2015) 6 試題（組長 4–6 各 2 題），滿分 30；Foster et al. (2015) 可選 1–3 個 block'
    scale: 行為作業，無 Likert 錨定
    reliability: Redick et al. (2012) 以 6,000+ 年輕成人資料報告 AOSPAN 信度與效度良好（原 PDF 無法讀取，數字未核對；一般引用 α 約 .78–.80）
    context: ''
    notes: '[客觀指標] 不是自陳量表。CLT 脈絡若要自陳，用 Paas 的 mental effort 題；WMC 本身一律用複雜廣度作業，單一作業信度不足時建議三種 span 合成 latent factor（Conway
      et al. 2005）。'
Competitive Advantage:
  zh: ''
  scales:
  - name: 無單一標準量表；常見為自陳相對績效題（相較主要競爭者）；Li, Ragu-Nathan & Rao (2006)
    source: 無單一標準量表；常見為自陳相對績效題（相較主要競爭者）；Li, Ragu-Nathan & Rao (2006) Omega 34, 107–124 的 competitive advantage 量表（price/cost,
      quality, delivery dependability, product innovation, time to market）被引用最多
    url: ''
    verified: false
    items:
    - We offer competitive prices.
    - We are able to offer prices as low or lower than our competitors.
    - We are able to compete based on quality.
    - We deliver customer orders on time.
    - We provide dependable delivery.
    - We provide customized products.
    - We are first in the market in introducing new products.
    scale: 5-point Likert, 1 = strongly disagree, 5 = strongly agree（Li et al. 2006）
    reliability: Li et al. (2006) 各構面 α .77–.88（未核對）；Hakkak & Ghodsi (2015) 自編量表 α .74（搜尋摘要）
    context: ''
    notes: '[記憶重建] 搜尋命中 Salim & Azo (2025) 的「相對競爭者」式題項（customer loyalty / brand reputation compared to rivals）但
      Springer 頁面需登入未能開啟。RBV／DCT 研究也常用客觀指標：相對 ROA、市佔率、Tobin''s Q 相對產業平均。'
Perceived Ease of Use:
  zh: ''
  scales:
  - name: Davis (1989)
    source: Davis (1989), MIS Quarterly 13(3), 319–340, Perceived Ease of Use 6 題（TAM）；UTAUT 的 effort expectancy
      4 題為其簡化版
    url: https://ii.tudelft.nl/willem-paul/node/8
    verified: true
    items:
    - Learning to operate [system] would be easy for me.
    - I would find it easy to get [system] to do what I want it to do.
    - My interaction with [system] would be clear and understandable.
    - I would find [system] to be flexible to interact with.
    - It would be easy for me to become skillful at using [system].
    - I would find [system] easy to use.
    scale: 7-point likelihood scale, 1 = extremely unlikely, 7 = extremely likely（Davis 原版）；後續多改成 agree–disagree
    reliability: α = .94（Davis 1989 摘要）；usefulness .98
    context: ''
    notes: '[逐字] Venkatesh et al. (2003) UTAUT effort expectancy 4 題：My interaction with the system would be clear
      and understandable / It would be easy for me to become skillful at using the system / I would find the system
      easy to use / Learning to operate the system is easy for me。'
Self-Esteem:
  zh: ''
  scales:
  - name: Rosenberg (1965)
    source: Rosenberg (1965), Society and the Adolescent Self-Image, Rosenberg Self-Esteem Scale（RSES, 10 題）
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3285741
    verified: false
    items:
    - On the whole, I am satisfied with myself.
    - At times I think I am no good at all. (R)
    - I feel that I have a number of good qualities.
    - I am able to do things as well as most other people.
    - I feel I do not have much to be proud of. (R)
    - I certainly feel useless at times. (R)
    - I feel that I'm a person of worth, at least on an equal plane with others.
    - I wish I could have more respect for myself. (R)
    - All in all, I am inclined to feel that I am a failure. (R)
    - I take a positive attitude toward myself.
    scale: 4-point, strongly agree (3) – strongly disagree (0)（或 1–4），無中點；總分 0–30 或 10–40；反向題 2, 4, 5, 6, 8（PMC
      文章另把第 9 題列為反向）
    reliability: α = .77（Rosenberg 1965）；跨樣本 α .72–.87；重測 .85（2 週）、.63（7 個月）；Sinclair et al. 樣本 α .86
    context: ''
    notes: '[摘要改寫] 開啟頁面逐字給了第 1、2、5 題，其餘 7 題依記憶補齊（公共領域量表，字句穩定）。SIT／ODT 脈絡若要測集體自尊，改用 Luhtanen & Crocker (1992) Collective
      Self-Esteem Scale。'
Attitude Strength:
  zh: ''
  scales:
  - name: 無單一量表；最常用的兩個指標為 attitude certainty（Petrocelli, Tormala & Ruc
    source: 無單一量表；最常用的兩個指標為 attitude certainty（Petrocelli, Tormala & Rucker 2007, JPSP 92, 30–41：clarity + correctness）與
      attitude importance（Krosnick 系列）
    url: ''
    verified: false
    items:
    - '[Certainty–global] How certain are you of your attitude toward [X]?'
    - '[Clarity] How certain are you that you know what your true attitude toward [X] really is?'
    - '[Clarity] To what extent is your true attitude toward [X] clear in your mind?'
    - '[Correctness] How certain are you that your attitude toward [X] is the correct attitude to have?'
    - '[Correctness] To what extent do you think other people should have the same attitude as you toward [X]?'
    - '[Importance] How important is [X] to you personally?'
    - '[Extremity] 由態度分數與中點的絕對差計算（客觀指標）'
    scale: 9-point, 1 = not at all certain/important, 9 = extremely certain/important（Petrocelli 等用 9 點；Krosnick
      常用 5 點 not at all – extremely）
    reliability: Petrocelli et al. (2007) clarity 與 correctness 各 α 約 .90 以上（未核對）
    context: ''
    notes: '[記憶重建] 搜尋只確認 2007 論文將 certainty 分成 clarity 與 correctness，以及 Krosnick 認為 strength 不是單一潛在構念（importance、knowledge、elaboration、certainty、ambivalence、accessibility
      等應分開報）。Krosnick 2006 PDF 無法讀取。Inoculation 研究多用 certainty 單題或 3 題合成。'
Feedback:
  zh: ''
  scales:
  - name: Hackman & Oldham (1975)
    source: Hackman & Oldham (1975), Journal of Applied Psychology 60, 159–170, Job Diagnostic Survey, Feedback
      from the Job 3 題
    url: https://knowledgejump.com/leader/jobsurvey.html
    verified: false
    items:
    - My job provides feedback on how well I am performing as I am working.
    - My job provides me with the opportunity to find out how well I am doing.
    - My job provides me with the feeling that I know whether I am performing well or poorly.
    scale: 原版 JDS 7-point（1 = very inaccurate, 7 = very accurate）；開啟的教學版為 4-point disagree – agree
    reliability: Hackman & Oldham (1975) feedback from job 內部一致性約 .71（未核對）；印尼版各構面 α ≥ .825（搜尋摘要）
    context: ''
    notes: '[逐字] 開啟頁面為教學改寫版，字句與原版 JDS 略有差異（原版題幹如 ''Just doing the work required by the job provides many chances
      for me to figure out how well I am doing''）。GST／SDT／SCT 脈絡若指主管回饋，改用 Steelman, Levy & Snell (2004) Feedback
      Environment Scale。'
Monitoring:
  zh: ''
  scales:
  - name: 無公認標準量表；常見為 Alge, Ballinger & Green (2004)
    source: 無公認標準量表；常見為 Alge, Ballinger & Green (2004), Personnel Psychology 57, 監控強度（monitoring intensity）與秘密性，或實驗中操弄監控有／無
    url: ''
    verified: false
    items:
    - My work activities are closely monitored by my supervisor/organization.
    - The organization keeps track of how I spend my time at work.
    - My computer/online activities are recorded and reviewed.
    - I am aware of being watched while I work.
    scale: 5- 或 7-point Likert, strongly disagree – strongly agree
    reliability: ''
    context: ''
    notes: '[摘要改寫／操弄] 搜尋只確認 Alge (2001, JAP 86) 以實驗操弄電腦監控層級，Alge et al. (2004) 測監控強度與秘密性，題項未取得；上列四題是依這兩篇的構念定義改寫的示例，不是已驗證量表。Agency／deterrence
      脈絡另有 perceived monitoring 或 detection certainty 題（D''Arcy et al. 2009）。'
Responsibility Attribution:
  zh: ''
  scales:
  - name: Griffin, Babin & Attaway (1991/1992) 的 attribution of respon
    source: Griffin, Babin & Attaway (1991/1992) 的 attribution of responsibility 3 題，經 Coombs & Holladay (1996 起)
      改成 SCCT 的 crisis responsibility 量表
    url: https://en.wikipedia.org/wiki/Situational_crisis_communication_theory
    verified: false
    items:
    - Circumstances, not the organization, are responsible for the crisis. (R)
    - The blame for the crisis lies with the organization.
    - The blame for the crisis lies in the circumstances, not the organization. (R)
    - '[Coombs 另加 personal control 題] The organization could have done something to prevent the crisis.'
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree
    reliability: Coombs 系列研究 α 多在 .80 以上（未核對）
    context: ''
    notes: '[記憶重建] 搜尋確認 Griffin 等人研究產品召回的責任歸因與 Coombs 把 blame 與 personal control 合併；題項字句未在開啟頁面核對。AttrT／AppT 脈絡若測一般歸因向度，改用
      McAuley, Duncan & Russell (1992) Revised Causal Dimension Scale (CDS-II) 的 locus / controllability 題。'
Absorptive Capacity:
  zh: ''
  scales:
  - name: Jansen, Van den Bosch & Volberda (2005)
    source: Jansen, Van den Bosch & Volberda (2005), Academy of Management Journal 48(6), 999–1015（acquisition /
      assimilation / transformation / exploitation 共 21 題）；另有 Flatten et al. (2011) 14 題
    url: https://www.scielo.br/j/rbi/a/7b4RyjqkSmCHqnzQjgcjZgP/?lang=en&format=html
    verified: false
    items:
    - '[Assimilation] New opportunities to serve our customers are quickly understood.'
    - '[Transformation] In the company, there are regular meetings to discuss the consequences of market trends
      and the development of new products.'
    - '[Transformation] The company recognizes the usefulness of new external knowledge for existing knowledge.'
    - '[Acquisition, Flatten] The search for relevant information about our sector is constant in the company''s
      day-to-day activities.'
    - '[Exploitation, Flatten] The company regularly reconsiders technologies and adapts them according to the new
      knowledge.'
    - '[Acquisition, Jansen 記憶] We frequently scan the environment for new technologies.'
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree（Jansen 2005）
    reliability: Jansen et al. (2005) 四構面 α .75–.86（未核對）；開啟的巴西研究未報信度
    context: ''
    notes: '[摘要改寫] 前五題逐字抄自 SciELO 頁面（該文由葡文翻回英文，與 AMJ 原文字句可能有出入），第六題依記憶補。Cohen & Levinthal 傳統另以 R&D 強度（R&D／銷售額）當客觀代理指標。'
Autonomy:
  zh: ''
  scales:
  - name: Deci & Ryan / Gagné (2003)
    source: Deci & Ryan / Gagné (2003), Basic Psychological Need Satisfaction Scale（BPNSS, general 21 題，autonomy
      7 題）；工作版 Deci et al. (2001)；新版 Chen et al. (2015) BPNSFS（autonomy satisfaction 4 題）
    url: https://selfdeterminationtheory.org/basic-psychological-need-satisfaction-scales/
    verified: false
    items:
    - I feel like I am free to decide for myself how to live my life.
    - I feel pressured in my life. (R)
    - I generally feel free to express my ideas and opinions.
    - In my daily life, I frequently have to do what I am told. (R)
    - People I interact with on a daily basis tend to take my feelings into consideration.
    - I feel like I can pretty much be myself in my daily situations.
    - There is not much opportunity for me to decide for myself how to do things in my daily life. (R)
    scale: 7-point, 1 = not at all true, 7 = very true
    reliability: autonomy α .76（Sheldon & Niemiec 2006 的 9 題短版，搜尋摘要）；21 題版 autonomy α 常見 .69–.80
    context: ''
    notes: '[記憶重建] 官網題項在下載 PDF 內，本次未取得；上列 7 題依記憶重建。PRT／POT／AgT 脈絡若指工作自主性，改用 JDS autonomy 3 題或 Morgeson & Humphrey
      (2006) WDQ 的 decision-making autonomy。'
Graph Comprehension:
  zh: ''
  scales:
  - name: Galesic & Garcia-Retamero (2011)
    source: Galesic & Garcia-Retamero (2011), Medical Decision Making 31(3), 444–457, Graph Literacy Scale（13 題客觀測驗）；視覺化領域另用
      Lee, Kim & Kwon (2017) VLAT（53 題）
    url: https://www.tuftsmedicine.org/research-clinical-trials/research-institutes-research-specialty/center-health-literacy-research-and-practice/health-literacy-tool-shed/graphliter
    verified: true
    items:
    - '[作業] 受試者看長條圖、折線圖、圓餅圖、icon array，回答讀值、比較、趨勢推論題，例如判斷哪一年罹病人數最多、兩組比例差多少（13 題，答對計 1 分）'
    - '[短版] 4 題 Short Graph Literacy Scale（Okan et al. 2019）'
    scale: 客觀測驗，總分 0–13；美德樣本平均約 9.3–9.4
    reliability: Tufts Tool Shed 記載：平均題間相關 .42（美國）、item-total 相關 .07–.63（平均 .38）；與 IALS/NAALS r = .50、與教育 r = .54
    context: ''
    notes: '[客觀指標] 不是 Likert 量表。GraphPerc／DataInk 的判讀準確度研究通常自編作業（答對率、反應時間、估計誤差）。VLAT 相關文章在 Springer 頁面需登入未能開啟。'
Opportunistic Behavior:
  zh: ''
  scales:
  - name: John (1984)
    source: John (1984), Journal of Marketing Research 21(3), 278–289 的 opportunism 5 題；後續 Rokkan, Heide & Wathne
      (2003) 等沿用
    url: ''
    verified: false
    items:
    - On occasion, [the partner] lies about certain things in order to protect its interests.
    - '[The partner] sometimes promises to do things without actually doing them later.'
    - '[The partner] sometimes alters the facts slightly in order to get what it needs.'
    - '[The partner] will not always be completely honest with us.'
    - '[The partner] sometimes tries to breach informal agreements to maximize its own benefit.'
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree
    reliability: 原始研究 α 約 .80（未核對）；Kelly, Wagner & Ramsay (2018) 回顧指出各量表對 guile 的掌握不一
    context: ''
    notes: '[記憶重建] 搜尋確認出處、Kelly et al. (2018) 的量表回顧與一個 2024 農業研究（Springer 頁面需登入）；題項字句未核對。'
Perceived Susceptibility:
  zh: ''
  scales:
  - name: Witte (1996)
    source: Witte (1996), Journal of Health Communication 1(4), 317–342, Risk Behavior Diagnosis Scale（RBD, 12 題；susceptibility
      3 題）；HBM 傳統另有 Champion (1984) 的 susceptibility 題
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4721383
    verified: false
    items:
    - I am at risk for [threat].
    - It is likely that I will [get threat].
    - It is possible that I will [get threat].
    - '[Gould 2015 改編] I believe I am seriously at risk of getting ill from smoking.'
    - '[Gould 2015 改編] It is likely that I will get ill from smoking.'
    scale: 7-point, 1 = strongly disagree, 7 = strongly agree（Witte）；Gould 用 5 點
    reliability: Gould et al. (2015, N = 121) susceptibility α .55（刪一題 .62）、severity .78、total threat .79；Gould
      整體 .65–1.0；法文版 12 題三因子結構穩定
    context: ''
    notes: '[摘要改寫] 前三題為 RBD 的通用題幹（依記憶），後兩題逐字抄自 Gould 2015。PMT／TTAT 脈絡常改稱 perceived vulnerability；Hinssen & Dohle
      (2023) 的 COVID 版 vulnerability 3 題 ρ .94（見 Response Cost 的 refs）。'
Prior Knowledge Base:
  zh: ''
  scales:
  - name: 無獨立量表；依脈絡用 (a) 先備知識測驗（客觀答對數）、(b) Flynn & Goldsmith (1999) 主觀
    source: 無獨立量表；依脈絡用 (a) 先備知識測驗（客觀答對數）、(b) Flynn & Goldsmith (1999) 主觀知識 5 題、(c) 組織層次的 prior related knowledge（Cohen
      & Levinthal 1990：R&D 強度、員工教育程度）
    url: ''
    verified: false
    items:
    - '[客觀] 針對作業領域自編的先備知識前測（選擇題／填充），以答對率計分'
    - '[主觀] I know pretty much about [domain].'
    - '[主觀] Compared to most other people, I know less about [domain]. (R)'
    - '[組織] R&D 支出佔銷售額比例；具備相關技術背景員工比例'
    scale: 客觀：答對率；主觀：7-point Likert
    reliability: 客觀測驗報 KR-20；主觀知識見 Knowledge 條
    context: ''
    notes: '[客觀指標／摘要改寫] Schema／FIT／WMT 脈絡的 prior knowledge 幾乎都是前測或專家／新手分組，不用態度量表。'
Rivalry Intensity:
  zh: ''
  scales:
  - name: Jaworski & Kohli (1993)
    source: Jaworski & Kohli (1993), Journal of Marketing 57(3), competitive intensity 6 題；常用其中 3 題
    url: https://zalozba.upr.si/ISBN/978-961-7023-54-1/files/basic-html/page177.html
    verified: false
    items:
    - Competition in our industry is cutthroat.
    - Anything that one competitor can offer, others can match readily.
    - Price competition is a hallmark of our industry.
    - There are many promotion wars in our industry.
    - One hears of a new competitive move almost every day.
    - Our competitors are relatively weak. (R)
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree
    reliability: Hojnik (2017, N = 223) 三題版 α .62、CR .63；Jaworski & Kohli 原版 α 約 .81（未核對）
    context: ''
    notes: '[摘要改寫] 前三題逐字抄自 Hojnik 頁面，後三題依記憶補 Jaworski & Kohli 原版。五力／OE 脈絡也可用客觀指標：HHI 或四廠集中度（CR4）、產業內廠商密度。'
Switching Intention:
  zh: ''
  scales:
  - name: Bansal & Taylor (1999)
    source: Bansal & Taylor (1999), Journal of Service Research 2(2) 服務轉換模型的 switching intention 3 題；PPM 研究（Bansal,
      Taylor & St. James 2005）沿用
    url: ''
    verified: false
    items:
    - I am considering switching from [current provider] to [alternative].
    - The chance of me switching to [alternative] is high.
    - I am determined to switch to [alternative].
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree（或 very unlikely – very likely）
    reliability: PPM 研究常見 α .85–.95；Marx (2025) 統合分析 148 篇指出測量方式差異大
    context: ''
    notes: '[記憶重建] 搜尋只確認框架出處與 2025 統合分析；題項未核對。'
Word of Mouth:
  zh: ''
  scales:
  - name: Zeithaml, Berry & Parasuraman (1996)
    source: Zeithaml, Berry & Parasuraman (1996), Journal of Marketing 60(2), 31–46, Behavioral Intentions Battery
      的 loyalty／word-of-mouth 題
    url: ''
    verified: false
    items:
    - Say positive things about [XYZ] to other people.
    - Recommend [XYZ] to someone who seeks your advice.
    - Encourage friends and relatives to do business with [XYZ].
    scale: 7-point likelihood, 1 = not at all likely, 7 = extremely likely
    reliability: 原始研究 loyalty 構面 α .93–.94（未核對）
    context: ''
    notes: '[記憶重建] 搜尋確認出處與 13 題 battery（loyalty / switch / pay more / external response / internal response 五構面），題項字句未在開啟頁面核對。eWOM
      脈絡另有 Goyette et al. (2010) eWOM 量表。'
Affect:
  zh: ''
  scales:
  - name: Watson, Clark & Tellegen (1988)
    source: Watson, Clark & Tellegen (1988), JPSP 54(6), 1063–1070, Positive and Negative Affect Schedule（PANAS,
      20 題）
    url: https://en.wikipedia.org/wiki/Positive_and_Negative_Affect_Schedule
    verified: true
    items:
    - '[PA] interested, excited, strong, enthusiastic, proud, alert, inspired, determined, attentive, active'
    - '[NA] distressed, upset, guilty, scared, hostile, irritable, ashamed, nervous, jittery, afraid'
    scale: 5-point, 1 = very slightly or not at all, 5 = extremely；時間框架可為 right now / today / past few weeks / in
      general
    reliability: 原始 α PA .86–.90、NA .84–.87（未核對）；8 週重測 momentary PA .54、NA .45，general PA .68、NA .71；西班牙臨床樣本 PA
      .92、NA .81
    context: ''
    notes: '[逐字] 形容詞逐字抄自 Wikipedia。AIM／LMX／TIB 脈絡若指對特定對象的情感（affect toward X），常用語意差異 3 題（good–bad, pleasant–unpleasant,
      favorable–unfavorable）。'
Automation Reliability:
  zh: ''
  scales:
  - name: 多為實驗操弄（自動化輔助正確率，例如 70% vs 90%）；若測知覺，用 Madsen & Gregor (2000)
    source: 多為實驗操弄（自動化輔助正確率，例如 70% vs 90%）；若測知覺，用 Madsen & Gregor (2000) Human-Computer Trust Scale 的 Perceived
      Reliability 5 題，或 Jian et al. (2000) 的 dependable／reliable 題
    url: https://arxiv.org/abs/2403.16406
    verified: false
    items:
    - '[操弄] 設定自動化系統在試驗中的正確率（如 60% / 80% / 95%），檢核題問受試者估計的可靠度'
    - '[Madsen & Gregor, 依摘要] The system always provides the advice I require to make my decision.'
    - '[Madsen & Gregor, 依摘要] The system performs reliably.'
    - '[Madsen & Gregor, 依摘要] The system responds the same way under the same conditions at different times.'
    - '[Madsen & Gregor, 依摘要] I can rely on the system to function properly.'
    - '[Madsen & Gregor, 依摘要] The system analyzes problems consistently.'
    scale: 5- 或 7-point Likert, strongly disagree – strongly agree
    reliability: Madsen & Gregor 各子量表 α 多在 .80 以上（未核對）
    context: ''
    notes: '[操弄／摘要改寫] Madsen & Gregor 題項是依搜尋摘要的轉述改寫，原 PDF 無法讀取。AutoBias 研究（Parasuraman & Manzey 2010）通常把 reliability
      當自變數操弄，知覺端用單題 ''How reliable was the aid?''（0–100%）。'
Communication Effectiveness:
  zh: ''
  scales:
  - name: 無公認標準量表；MRT／SPT 研究多自編 3–5 題或用 Rice, D'Ambra & More (1998)
    source: 無公認標準量表；MRT／SPT 研究多自編 3–5 題或用 Rice, D'Ambra & More (1998) 的 media appropriateness／richness 題
    url: https://rrice.faculty.comm.ucsb.edu/a59.htm
    verified: false
    items:
    - Communication through [medium] was effective.
    - The message was conveyed accurately and completely.
    - I was able to understand what the other party meant.
    - The communication achieved its purpose.
    scale: 7-point Likert, strongly disagree – strongly agree
    reliability: 自編量表常見 α .85–.93（一項健康傳播 14 題版 α .93，搜尋摘要）
    context: ''
    notes: '[摘要改寫] 上列四題為依構念定義改寫的示例，不是已驗證量表。EVioT 脈絡常改測 communication satisfaction（Hecht 1978）。'
Cooperation:
  zh: ''
  scales:
  - name: Morgan & Hunt (1994)
    source: Morgan & Hunt (1994), Journal of Marketing 58(3), 20–38 的 cooperation 題（KMV 模型）
    url: ''
    verified: false
    items:
    - In the future, we expect to work with [partner] in joint planning and goal setting.
    - We and [partner] cooperate in joint problem solving.
    - Our relationship with [partner] is characterized by mutual effort to achieve common goals.
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree
    reliability: Morgan & Hunt cooperation α 約 .83（未核對）
    context: ''
    notes: '[記憶重建] 搜尋只命中書目頁，附錄未取得。Game theory 脈絡改用行為指標（囚徒困境合作率、公共財賽局貢獻額）；SIT 脈絡可用 Tyler & Blader 的 cooperative behavior
      題。'
Employee Retention:
  zh: ''
  scales:
  - name: 通常以 turnover intention 反向測量：Michaels & Spector (1982)
    source: 通常以 turnover intention 反向測量：Michaels & Spector (1982) 3 題，或 Mobley, Horner & Hollingsworth (1978) 3
      題；客觀指標為實際留任率
    url: https://paulspector.com/assessments/pauls-no-cost-assessments/turnover-intentions/
    verified: false
    items:
    - I often think about quitting.
    - I will probably look for a new job in the next year.
    - It is likely that I will actively look for a new job next year.
    scale: 5- 或 7-point Likert, strongly disagree – strongly agree
    reliability: 三題版 α 常見 .80–.90（搜尋摘要未給 Michaels & Spector 原始值）；TIS-6 六題版已驗證可預測實際離職
    context: ''
    notes: '[摘要改寫] 題項取自搜尋摘要中北京醫護研究與 COVID 研究使用的三題，與 Mobley 1978 原版字句相近但非逐字。SPC／TCM 脈絡的組織層次留任率＝期末在職人數／期初人數。'
Fear:
  zh: ''
  scales:
  - name: Witte (1994)
    source: Witte (1994), Communication Monographs 61 的 fear arousal 6 個形容詞（EPPM）
    url: https://en.wikipedia.org/wiki/Extended_parallel_process_model
    verified: false
    items:
    - '[The message made me feel] frightened'
    - tense
    - nervous
    - anxious
    - uncomfortable
    - nauseous
    scale: 7-point, 1 = not at all, 7 = very much
    reliability: Witte 系列 α 約 .90 以上（未核對）
    context: ''
    notes: '[記憶重建] Popova (2012) 的 EPPM 回顧 Table 1 整理了各研究的 fear 測法，PDF 無法讀取。Cultivation 脈絡的 fear of crime 另有 Ferraro
      (1995) 量表。'
Heuristic Processing:
  zh: ''
  scales:
  - name: Griffin, Neuwirth, Giese & Dunwoody (2002)
    source: Griffin, Neuwirth, Giese & Dunwoody (2002), Communication Research 29(6), 705–732（RISP）的 heuristic／systematic
      processing 題；Smerecnik et al. (2012) Information-Processing Questionnaire 15 題
    url: ''
    verified: false
    items:
    - When I encounter information about [risk], I rarely spend much time thinking about it.
    - I skim through the information without paying much attention.
    - If I need to act on this matter, the advice of an expert is good enough for me.
    - I rely on my first impression of the information.
    scale: 5-point Likert, strongly disagree – strongly agree
    reliability: Smerecnik et al. (2012) 兩因子（systematic / heuristic）α 約 .80（未核對）
    context: ''
    notes: '[記憶重建] 搜尋確認 2002 論文與 Smerecnik 2012 的兩因子結構，題項未核對。DPT 研究也用客觀指標：反應時間、論點品質操弄的交互作用、思考列表（thought listing）。'
Interactivity Cues:
  zh: ''
  scales:
  - name: McMillan & Hwang (2002)
    source: McMillan & Hwang (2002), Journal of Advertising 31(3), 29–42, Measures of Perceived Interactivity（MPI,
      18 題：direction of communication / user control / time）；Liu (2003) 12 題（active control / two-way communication
      / synchronicity）
    url: ''
    verified: false
    items:
    - '[Two-way] The site enables two-way communication.'
    - '[Two-way] The site facilitates concurrent communication.'
    - '[Control] I felt that I had a lot of control over my visiting experiences at this site.'
    - '[Time] The site loads fast / responds quickly to my input.'
    - '[Global] The site is interactive.'
    scale: 7-point Likert, strongly disagree – strongly agree
    reliability: MPI 三構面 α 約 .80–.90（未核對）；學習者–AI 互動版整體 α .95（不同工具，搜尋摘要）
    context: ''
    notes: '[記憶重建] 搜尋只確認 18 題三構面與 Liu 的替代量表。MAIN 模型把互動性當 affordance cue 操弄（有／無回覆功能），知覺端常用 Sundar 的 3 題 perceived
      interactivity。'
Machine Heuristic:
  zh: ''
  scales:
  - name: Yang & Sundar (2024)
    source: Yang & Sundar (2024), Journal of Computer-Mediated Communication 29(5), zmae019, Machine Heuristic scale（反映式
      7 題；另 6 個形成式標籤 expert / efficient / rigid / superfluous / fair / complex）
    url: https://academic.oup.com/jcmc/article/doi/10.1093/jcmc/zmae019/7775449
    verified: false
    items:
    - Machines are better than humans in performing such tasks.
    - I trust machines more than humans in performing such tasks.
    - Machines are more reliable than humans in performing these tasks.
    - '[其餘 4 題在 Supplementary Table 10，本次未取得]'
    scale: 7-point Likert agreement
    reliability: 反映式 7 題 α .93（mechanical tasks）／ .98（human tasks），Study 3 CFA；形成式各標籤 α .80–.93
    context: ''
    notes: '[逐字] 前三題逐字抄自正文，完整 7 題在補充資料。Sundar & Kim (2019) 之前用 4 題 ''Machines are more accurate / objective / free
      from bias / secure than humans'' 式題項（依記憶）。'
Organizational Survival:
  zh: ''
  scales:
  - name: 客觀事件指標：組織是否在觀察期內退出（dissolution / bankruptcy / merger），以事件史分析
    source: 客觀事件指標：組織是否在觀察期內退出（dissolution / bankruptcy / merger），以事件史分析估 hazard rate（Hannan & Freeman 組織生態學傳統）
    url: ''
    verified: true
    items:
    - '[事件] 組織在年 t 是否解散（1 = 退出，0 = 存續）；區分自願歇業、破產、被併購三類退出'
    - '[模型] Cox proportional hazards 或 piecewise exponential，共變數含組織年齡（liability of newness）、規模（liability of smallness）、族群密度'
    - '[合法性脈絡] 以取得認證／加入協會／媒體報導量當 legitimacy 代理變數'
    scale: 無量表
    reliability: ''
    context: ''
    notes: '[客觀指標] 搜尋摘要（Sage Encyclopedia 的 organizational mortality 條目）指出有些研究把退出視為二元，有些區分退出類型，併購不應與破產等同。本次未開啟任何頁面。'
Perceived Efficacy:
  zh: ''
  scales:
  - name: Witte (1996)
    source: Witte (1996) Risk Behavior Diagnosis Scale 的 response efficacy 3 題 + self-efficacy 3 題（EPPM）；NAM／IVE
      脈絡則為 outcome efficacy（Steg & de Groot 2010）
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4721383
    verified: false
    items:
    - '[Response efficacy] [Recommended response] is effective in preventing [threat].'
    - '[Response efficacy] [Recommended response] works in preventing [threat].'
    - '[Self-efficacy] I am able to [perform recommended response] to prevent [threat].'
    - '[Self-efficacy] It is easy to [perform recommended response].'
    - '[Gould 2015 逐字] It is easy to stop smoking.'
    scale: 7-point, strongly disagree – strongly agree（Witte）；Gould 5 點
    reliability: Gould et al. (2015) response efficacy α .69、self-efficacy .71（刪一題 .82）、total efficacy .65；Hinssen
      & Dohle (2023) response efficacy ρ .94–.97、self-efficacy .84–.93
    context: ''
    notes: '[摘要改寫] 通用題幹依記憶，Gould 逐字一題。NAM 的 outcome efficacy 例：''I can contribute to reducing environmental problems
      by…''。'
Perceived Similarity:
  zh: ''
  scales:
  - name: McCroskey, Richmond & Daly (1975)
    source: McCroskey, Richmond & Daly (1975), Human Communication Research 1, 323–332, Perceived Homophily（attitude
      4 題 + background 4 題）；新版 McCroskey, McCroskey & Richmond (2006) Likert 式
    url: http://www.jamescmccroskey.com/measures/homophily.htm
    verified: true
    items:
    - '[Attitude] Is like me – Is unlike me'
    - '[Attitude] Is different from me – Is similar to me'
    - '[Attitude] Thinks like me – Does not think like me'
    - '[Attitude] Doesn''t behave like me – Behaves like me'
    - '[Background] Has status like mine – Has status different from mine'
    - '[Background] Is from a different social class – Is from the same social class'
    - '[Background] Is culturally different – Is culturally similar'
    - '[Background] Has an economic situation like mine – Does not have an economic situation like mine'
    scale: 7-point bipolar, 1 與 7 = 極強感受, 4 = 不確定；各子量表加總 4–28
    reliability: 舊版 α 可接受但 background 常低於 .70；2006 新版 Likert 題 α 一致高於 .80（McCroskey 官網）
    context: ''
    notes: '[逐字] SC／SocProof 脈絡若指與訊息來源的相似性，attitude homophily 4 題最常用；LMX 脈絡常用 Turban & Jones (1988) perceived similarity。'
Personalization:
  zh: ''
  scales:
  - name: Komiak & Benbasat (2006)
    source: Komiak & Benbasat (2006), MIS Quarterly 30(4), 941–960, perceived personalization 4 題（推薦代理人）
    url: ''
    verified: false
    items:
    - This [RA] understands my needs.
    - This [RA] knows what I want.
    - This [RA] takes my needs as its own preferences.
    - This [RA] does what I want.
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree
    reliability: 原始研究 CR 約 .93（未核對）
    context: ''
    notes: '[記憶重建] 搜尋只確認論文與結果（perceived personalization 透過認知與情感信任影響採用意圖），附錄未取得。UNegl／WoM-AI 脈絡的 personalization
      常為操弄（個人化 vs 一般化推薦）。'
Review Volume:
  zh: ''
  scales:
  - name: 客觀指標：產品／服務頁面上的評論則數（常取自然對數）；Chevalier & Mayzlin (2006)
    source: 客觀指標：產品／服務頁面上的評論則數（常取自然對數）；Chevalier & Mayzlin (2006) 等 eWOM 研究傳統
    url: ''
    verified: true
    items:
    - '[客觀] 評論總數 N（ln(N+1)）；或評分人數'
    - '[實驗操弄] 呈現「12 則評論」vs「1,240 則評論」等高低組'
    - '[知覺] ''This product has been reviewed by many people.''（檢核題）'
    scale: 無量表
    reliability: ''
    context: ''
    notes: '[客觀指標／操弄] Bandwagon 研究把 volume 當 bandwagon cue 操弄；本次未對此構念做網路查詢。'
Selective Exposure:
  zh: ''
  scales:
  - name: 行為指標：Knobloch-Westerwick 系列（如 Knobloch-Westerwick & Meng 200
    source: 行為指標：Knobloch-Westerwick 系列（如 Knobloch-Westerwick & Meng 2009, Communication Research 36）以軟體記錄瀏覽時間與選讀文章
    url: ''
    verified: true
    items:
    - '[行為] 提供等量態度一致／相反文章，軟體記錄每篇閱讀秒數；selective exposure = 一致文章閱讀時間 − 相反文章閱讀時間（或比例）'
    - '[行為] 點選次數、眼動注視時間'
    - '[自陳] 回溯性媒體使用：''How often do you watch/read sources that share your political views?'''
    scale: 無量表
    reliability: ''
    context: ''
    notes: '[客觀指標] 搜尋摘要指出 2009 研究一致文章閱讀時間多 36%；另有批評指等量供給的實驗不像真實搜尋，2021 研究改用自由搜尋＋眼動。本次未開啟頁面。'
Skepticism:
  zh: ''
  scales:
  - name: Obermiller & Spangenberg (1998)
    source: Obermiller & Spangenberg (1998), Journal of Consumer Psychology 7(2), 159–186, SKEP 量表（9 題）
    url: https://www.psytoolkit.org/survey-library/skepticism-skep.html
    verified: true
    items:
    - We can depend on getting the truth in most advertising. (R)
    - Advertising's aim is to inform the consumer. (R)
    - I believe advertising is informative. (R)
    - Advertising is generally truthful. (R)
    - Advertising is a reliable source of information about the quality and performance of products. (R)
    - Advertising is truth well told. (R)
    - In general, advertising presents a true picture of the product being advertised. (R)
    - I feel I've been accurately informed after viewing most advertisements. (R)
    - Most advertising provides consumers with essential information. (R)
    scale: 5-point Likert, strongly disagree – strongly agree；全部反向後加總 9–45，分數越高越懷疑
    reliability: 原始研究 α .85 以上（未核對）；PsyToolkit 頁未報
    context: ''
    notes: '[逐字] PsyToolkit 版把其中 4 題寫成否定句；上列依原版正向句呈現並標 (R)。GreenW 脈絡請改用 green advertising skepticism（Mohr, Eroğlu
      & Ellen 1998 的 4 題）或 Leonidou & Skarmeas (2017) 的 consumer skepticism toward CSR。'
Social Presence:
  zh: ''
  scales:
  - name: Gefen & Straub (2004)
    source: Gefen & Straub (2004), Omega 32(6), 407–424, social presence 5 題（電子商務）；原始概念 Short, Williams & Christie
      (1976) 語意差異
    url: ''
    verified: false
    items:
    - There is a sense of human contact in the website.
    - There is a sense of personalness in the website.
    - There is a sense of sociability in the website.
    - There is a sense of human warmth in the website.
    - There is a sense of human sensitivity in the website.
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree
    reliability: 原始研究 α 約 .93–.95（未核對）
    context: ''
    notes: '[記憶重建] 搜尋未命中原文或轉載頁。CASA／PSI-CA 脈絡若用 Short et al. 語意差異版：impersonal–personal, cold–warm, insensitive–sensitive,
      unsociable–sociable；HRI 另有 Harms & Biocca (2004) Networked Minds。'
Switching Behavior:
  zh: ''
  scales:
  - name: 行為指標：實際更換供應商／平台（Keaveney 1995 的轉換事件）；問卷中以回溯自陳或面板資料記錄
    source: 行為指標：實際更換供應商／平台（Keaveney 1995 的轉換事件）；問卷中以回溯自陳或面板資料記錄
    url: ''
    verified: true
    items:
    - '[行為] 觀察期內是否已更換服務供應商（1/0）；更換次數'
    - '[自陳回溯] In the past 12 months, have you switched from [A] to another provider?'
    - '[面板] 帳號停用／註銷後在競品註冊的紀錄'
    scale: 無量表
    reliability: ''
    context: ''
    notes: '[客觀指標] PPM 研究多以 switching intention 代替；NetFx 研究用平台使用者流失率。本次未對此構念做網路查詢。'
Ascription of responsibility:
  zh: ''
  scales:
  - name: De Groot & Steg (2009)
    source: De Groot & Steg (2009), Journal of Social Psychology 149(4), 425–449（NAM 五研究）；Steg & de Groot (2010)
      的 ascription of responsibility 題
    url: ''
    verified: false
    items:
    - I feel jointly responsible for the exhaustion of energy sources.
    - I feel jointly responsible for global warming.
    - My contribution to the environmental problems of [X] is negligible. (R)
    - Not only the government and industry are responsible for high energy consumption levels, but me too.
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree
    reliability: Steg 系列 α 約 .70–.85（未核對）
    context: ''
    notes: '[記憶重建] 搜尋確認 De Groot & Steg 2009 五研究與 NAM 四變數，題項未核對（Bournemouth 開放存取檔為 PDF）。VBN 原始 Stern et al. (1999)
      用類似題。'
Brand Image:
  zh: ''
  scales:
  - name: 無單一標準量表；Low & Lamb (2000)
    source: 無單一標準量表；Low & Lamb (2000), Journal of Product & Brand Management 9(6), 350–370 建議依產品類別自建形容詞；常用 Aaker
      (1997) brand personality 或 Keller (1993) 的聯想強度／喜好／獨特性
    url: ''
    verified: false
    items:
    - '[Low & Lamb 範例] friendly – unfriendly; modern – outdated; useful – not useful; popular – unpopular; gentle
      – harsh; artificial – natural'
    - '[通用] This brand has a good image.'
    - '[通用] This brand has a positive reputation.'
    scale: 7-point semantic differential 或 Likert
    reliability: Low & Lamb 各產品類別 α .70–.85（未核對）
    context: ''
    notes: '[記憶重建] 搜尋確認 Low & Lamb 的三向度（brand image / brand attitude / perceived quality）與「題項應隨產品類別變動」的主張，形容詞未核對。CBBE
      脈絡建議直接用 Yoo & Donthu (2001) 的 brand equity 量表。'
Empathy:
  zh: ''
  scales:
  - name: Parasuraman, Zeithaml & Berry (1988)
    source: Parasuraman, Zeithaml & Berry (1988), Journal of Retailing 64(1), 12–40, SERVQUAL empathy 構面 5 題（期望／知覺配對）
    url: https://en.wikipedia.org/wiki/SERVQUAL
    verified: false
    items:
    - XYZ gives you individual attention.
    - XYZ has operating hours convenient to all its customers.
    - XYZ has employees who give you personal attention.
    - XYZ has your best interests at heart.
    - Employees of XYZ understand your specific needs.
    scale: 7-point, 1 = strongly disagree, 7 = strongly agree；SERVQUAL 分數 = 知覺 − 期望
    reliability: 原始研究 empathy α 約 .80–.87（未核對）
    context: ''
    notes: '[摘要改寫] Wikipedia 僅給每構面一題範例，其餘依記憶。WarmGlow 脈絡的 empathy 是情緒反應，改用 Batson 的 empathic concern 形容詞（sympathetic,
      compassionate, moved…）。'
Observability:
  zh: ''
  scales:
  - name: Moore & Benbasat (1991)
    source: Moore & Benbasat (1991), Information Systems Research 2(3), 192–222：visibility 4 題 + result demonstrability
      3 題（Rogers 的 observability 拆成兩個）
    url: https://is.theorizeit.org/wiki/Diffusion_of_innovations_theory
    verified: false
    items:
    - '[Visibility] In my organization, one sees [innovation] on many computers.'
    - '[Visibility] [Innovation] is not very visible in my organization. (R)'
    - '[Visibility] I have seen what others do using [innovation].'
    - '[Result demonstrability] I would have no difficulty telling others about the results of using [innovation].'
    - '[Result demonstrability] I believe I could communicate to others the consequences of using [innovation].'
    - '[Result demonstrability] The results of using [innovation] are apparent to me.'
    scale: 7-point Likert, extremely disagree – extremely agree
    reliability: Moore & Benbasat visibility α .79、result demonstrability .79（短版，未核對）
    context: ''
    notes: '[記憶重建] MISQ 問卷頁（misq.umn.edu）回 403，題項依記憶。SigT 脈絡的 observability 指訊號可觀察性，多為操弄。'
Resource Inimitability:
  zh: ''
  scales:
  - name: 無公認標準量表；RBV 實證多自編 'difficult for competitors to imitate' 式題（
    source: 無公認標準量表；RBV 實證多自編 'difficult for competitors to imitate' 式題（如 Ray, Barney & Muhanna 2004；Newbert 2008）
    url: ''
    verified: false
    items:
    - Our [resource/capability] would be difficult for competitors to imitate.
    - Competitors would need a long time to replicate our [resource].
    - The way we developed [resource] is unique to our firm's history.
    - Our [resource] is socially complex and hard to copy.
    scale: 7-point Likert, strongly disagree – strongly agree
    reliability: 自編量表 α 常見 .75–.90
    context: ''
    notes: '[摘要改寫] 搜尋只命中 VRIN／VRIO 概念頁與一篇克羅埃西亞研討會論文，無驗證過的題項；注意 ''VRIN scale'' 搜尋會撞到 MMPI 的 VRIN 效度量表。'
Transaction Cost:
  zh: ''
  scales:
  - name: 無單一標準量表；常拆成 search / negotiation / monitoring(enforcement) c
    source: 無單一標準量表；常拆成 search / negotiation / monitoring(enforcement) cost 自陳題（Pilling, Crosby & Jackson 1994,
      JBR 30；Buckley & Chapman 1997 主張交易成本本質上是知覺）
    url: ''
    verified: false
    items:
    - '[Search] It takes a lot of time and effort to find suitable suppliers/products.'
    - '[Negotiation] Negotiating and drawing up agreements with [partner] is costly.'
    - '[Monitoring] We spend considerable resources monitoring whether [partner] meets the agreement.'
    - '[Enforcement] Enforcing the terms of the agreement is difficult and costly.'
    scale: 7-point Likert, strongly disagree – strongly agree
    reliability: 咖啡生產者交易成本工具（UPO 期刊）報 α 與 CR 可接受，三因子：information / negotiation / supervision（搜尋摘要）
    context: ''
    notes: '[摘要改寫] 上列題項依文獻常見分類改寫，不是已驗證量表；Pilling et al. 全文在付費牆。IAT 脈絡可用資訊搜尋時間等客觀指標。'
Asset Specificity:
  zh: ''
  scales:
  - name: Heide & John (1990)
    source: Heide & John (1990), Journal of Marketing Research 27(1), 24–36 的 transaction-specific investments 題；Ganesan
      (1994) 沿用
    url: ''
    verified: false
    items:
    - We have made significant investments in tooling and equipment dedicated to our relationship with [partner].
    - If we switched to a competing [partner], we would lose a lot of the investment we have made in this relationship.
    - Our production system has been tailored to the particular requirements of dealing with [partner].
    - Training our people to deal with [partner] has involved substantial commitments of time and money.
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree
    reliability: Heide & John α 約 .80（未核對）
    context: ''
    notes: '[記憶重建] 搜尋只命中概念定義（Williamson）與回顧，題項未核對。'
Continuance Commitment:
  zh: ''
  scales:
  - name: Meyer & Allen (1991)
    source: Meyer & Allen (1991), Human Resource Management Review 1(1), 61–89；Allen & Meyer (1990) Continuance
      Commitment Scale 8 題（1993 修訂 6 題）
    url: https://en.wikipedia.org/wiki/Organizational_commitment
    verified: false
    items:
    - Right now, staying with my organization is a matter of necessity as much as desire.
    - It would be very hard for me to leave my organization right now, even if I wanted to.
    - Too much of my life would be disrupted if I decided I wanted to leave my organization now.
    - I feel that I have too few options to consider leaving this organization.
    - One of the few negative consequences of leaving this organization would be the scarcity of available alternatives.
    - If I had not already put so much of myself into this organization, I might consider working elsewhere.
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree
    reliability: CCS 信度常偏低：韓國樣本「低」、哈薩克樣本 α .66（搜尋摘要）；原始 Allen & Meyer (1990) α .75（未核對）
    context: ''
    notes: '[記憶重建] 題項依記憶重建；CCS 常拆成 high sacrifice 與 low alternatives 兩個次構面，信度與因素結構被多次質疑（Hackett et al. 1994）。'
Danger Control:
  zh: ''
  scales:
  - name: Witte (1994)
    source: Witte (1994) EPPM：danger control 以 attitude、intention、behavior 三種訊息接受反應測量；Gould et al. (2015) 稱 protection
      response
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4721383
    verified: false
    items:
    - '[Attitude] 對建議行為的態度語意差異（good–bad, beneficial–harmful…）'
    - '[Intention] I intend to [perform recommended response] in the next [period].'
    - '[Behavior] 追蹤期實際是否採行建議行為'
    - '[Fear control 對照] I prefer not to think about the health risks of smoking.（Gould 2015 逐字）'
    scale: 7-point Likert；Gould 用 5 點
    reliability: Gould et al. (2015) protection response α .67、fear control .58（刪一題 .67）
    context: ''
    notes: '[摘要改寫] Witte 原文把 danger control 當結果變數群（態度／意圖／行為），不是單一量表；fear control 則測 defensive avoidance、reactance、message
      minimization。'
Goal Conflict:
  zh: ''
  scales:
  - name: 無直接的 agency-theory 量表；最接近的是 Vancouver & Schmitt (1991)
    source: 無直接的 agency-theory 量表；最接近的是 Vancouver & Schmitt (1991), Personnel Psychology 44, 333–352 的 Goal Congruence（14
      個目標重要性評分的 profile 差距 D）；自陳替代為 perceived goal congruence 量表
    url: https://db.arabpsychology.com/?p=76572
    verified: false
    items:
    - '[Profile] 受訪者與主管各自評 14 項組織目標的重要性，D = sqrt(Σ(差)^2)，D 越大代表目標衝突越大'
    - '[自陳替代] My goals and the goals of [principal/organization] are very similar. (R)'
    - '[自陳替代] What I want to achieve in my job often conflicts with what my supervisor wants.'
    scale: 目標重要性 7-point, 0 = of no importance, 6 = of primary importance
    reliability: 原始研究以校內 ICC 估計一致性，約 .24（屬跨單位一致性，不是 α）
    context: ''
    notes: '[逐字（profile 版）／摘要改寫（自陳替代）] 14 個目標是學校情境的，套用其他組織要重寫；agency 研究多把 goal conflict 當操弄（委託人與代理人誘因是否一致）。'
Job Demands:
  zh: ''
  scales:
  - name: Karasek (1985)
    source: Karasek (1985) Job Content Questionnaire psychological job demands 5 題；JD-R 研究也常用 Bakker 的 JD-R 問卷或
      COPSOQ 的 quantitative demands
    url: https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2024.1433331/full
    verified: false
    items:
    - My job requires working very fast.
    - My job requires working very hard.
    - I am not asked to do an excessive amount of work. (R)
    - I have enough time to get the job done. (R)
    - I am free from conflicting demands that others make. (R)
    scale: 4-point, 1 = strongly disagree, 4 = strongly agree（JCQ）；JD-R 問卷多為 5 點頻率或 6 點同意度
    reliability: JCQ psychological demands α 約 .63–.73（未核對）；UDRQ 學生版 demands 各次構面 α .75–.87、CR .76–.87（Frontiers
      2024）
    context: ''
    notes: '[記憶重建] JCQ 題項依記憶；開啟的 Frontiers 文章題項在附錄未取得。Bakker 的 JD-R 問卷 workload 題例：''Do you have too much work to
      do?''、''Do you have to work very fast?''（依搜尋摘要）。'
Organizational Impact:
  zh: ''
  scales:
  - name: DeLone & McLean (1992/2003) IS Success 的 organizational impa
    source: DeLone & McLean (1992/2003) IS Success 的 organizational impact；Gable, Sedera & Chan (2008), JAIS 9(7),
      IS-Impact 模型的 organizational impact 8 題
    url: https://aisel.aisnet.org/jais/vol9/iss7/
    verified: false
    items:
    - '[The system] is cost effective.'
    - '[The system] has resulted in reduced staff costs.'
    - '[The system] has resulted in cost reductions (e.g., inventory holding costs, administration expenses).'
    - '[The system] has resulted in overall productivity improvement.'
    - '[The system] has resulted in improved outcomes or outputs.'
    - '[The system] has resulted in an increased capacity to manage a growing volume of activity.'
    - '[The system] has resulted in improved business processes.'
    scale: 7-point Likert, strongly disagree – strongly agree
    reliability: Gable et al. (2008) organizational impact CR 約 .90（未核對）
    context: ''
    notes: '[記憶重建] 題項依記憶；原文 PDF 未讀。亦可用客觀指標（ROA、成本節省金額）。'
Peripheral Cues:
  zh: ''
  scales:
  - name: ELM 實驗操弄變數：來源吸引力／專業性、論點數量、他人同意比例等；知覺端常以 manipulation check 單
    source: ELM 實驗操弄變數：來源吸引力／專業性、論點數量、他人同意比例等；知覺端常以 manipulation check 單題測
    url: ''
    verified: true
    items:
    - '[操弄] 來源為名人／專家 vs 一般人；論點 3 個 vs 9 個；''90% 的人同意'' vs ''20% 的人同意'''
    - '[檢核] The source of the message was attractive / an expert.（7 點）'
    - '[檢核] How many arguments did the message contain?'
    scale: 無量表
    reliability: ''
    context: ''
    notes: '[客觀指標／操弄] Petty & Cacioppo 傳統把 peripheral cue 當自變數，不當構念測；若要測「依賴線索的程度」，見 Heuristic Processing 條。本次未對此構念做網路查詢。'
Reliability:
  zh: ''
  scales:
  - name: Parasuraman, Zeithaml & Berry (1988)
    source: Parasuraman, Zeithaml & Berry (1988) SERVQUAL reliability 構面 5 題（1988 版 5 題、1991 修訂亦 5 題）
    url: https://en.wikipedia.org/wiki/SERVQUAL
    verified: false
    items:
    - When XYZ promises to do something by a certain time, it does so.
    - When you have a problem, XYZ shows a sincere interest in solving it.
    - XYZ performs the service right the first time.
    - XYZ provides its services at the time it promises to do so.
    - XYZ keeps its records accurately / insists on error-free records.
    scale: 7-point, 1 = strongly disagree, 7 = strongly agree；期望與知覺各問一次，取差
    reliability: 原始研究 reliability 構面 α 約 .80–.90（未核對）
    context: ''
    notes: '[摘要改寫] Wikipedia 給了兩題（期望版與知覺版），其餘依記憶。Llosa et al. (1998) 指出 reliability、assurance、responsiveness 三構面在顧客心中常混在一起。'
Response Cost:
  zh: ''
  scales:
  - name: Milne, Sheeran & Orbell (2000)
    source: Milne, Sheeran & Orbell (2000) PMT 回顧的 response cost 題；IS 安全領域常引 Woon, Tan & Low (2005) 7 題（α .74, N
      = 189）或 Liang & Xue (2010) 7 題（α .89）
    url: https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2023.1195607/full
    verified: false
    items:
    - It is uncomfortable to [perform recommended behavior].
    - It is inconvenient to [perform recommended behavior].
    - '[Performing recommended behavior] can cause difficulties for me.'
    - '[Performing recommended behavior] would be too time consuming.'
    - '[Performing recommended behavior] would require considerable effort.'
    scale: 7-point Likert, 1 = disagree strongly, 7 = agree strongly
    reliability: Hinssen & Dohle (2023) perceived costs 3 題 ρ .88–.90；Woon et al. (2005) α .74；Liang & Xue (2010)
      α .89
    context: ''
    notes: '[摘要改寫] 前三題依 Hinssen & Dohle 的 ''uncomfortable / inconvenient / can cause difficulties'' 題型改寫，後兩題為 PMT
      常見補充。'
TTF:
  zh: ''
  scales:
  - name: Goodhue & Thompson (1995)
    source: Goodhue & Thompson (1995), MIS Quarterly 19(2), 213–236：8 構面（quality, locatability, authorization, compatibility,
      ease of use/training, production timeliness, systems reliability, relationship with users）；後續多用「fit-as-match」短版（如
      Lin & Huang 2008 的 8 題）
    url: https://is.theorizeit.org/wiki/Task-technology_fit
    verified: false
    items:
    - '[Fit-as-match 短版] The functions of [system] fit my task requirements.'
    - '[Fit-as-match] Using [system] fits well with the way I work.'
    - '[Fit-as-match] [System] is adequate / compatible for my tasks.'
    - '[Goodhue 構面例, quality] The data that I use or would like to use is accurate enough for my purposes.'
    - '[Goodhue 構面例, locatability] It is easy to locate the data I need.'
    - '[Goodhue 構面例, timeliness] The information I need is available in time.'
    scale: 7-point Likert, strongly disagree – strongly agree
    reliability: Goodhue & Thompson 各構面 α 多在 .70–.90（未核對）；短版 α 常見 .85 以上
    context: ''
    notes: '[摘要改寫] 開啟頁面只給構面與量表格式；題例依記憶改寫。'
Trialability:
  zh: ''
  scales:
  - name: Moore & Benbasat (1991)
    source: Moore & Benbasat (1991), Information Systems Research 2(3), 192–222, trialability 5 題（短版 2 題）
    url: https://is.theorizeit.org/wiki/Diffusion_of_innovations_theory
    verified: false
    items:
    - I have had a great deal of opportunity to try various [innovation] applications.
    - I know where I can go to satisfactorily try out various uses of [innovation].
    - Before deciding whether to use any [innovation] applications, I was able to properly try them out.
    - I was permitted to use [innovation] on a trial basis long enough to see what it could do.
    - '[Innovation] was available to me to adequately test run various applications. '
    scale: 7-point Likert, extremely disagree – extremely agree
    reliability: Moore & Benbasat trialability α .71（短版，未核對）
    context: ''
    notes: '[記憶重建] MISQ 問卷頁回 403；題項依記憶重建。'
Domain Expertise:
  zh: ''
  scales:
  - name: Flynn & Goldsmith (1999)
    source: Flynn & Goldsmith (1999) Journal of Business Research 46(1), 57–66, Subjective Knowledge scale (5 items)
    url: https://ideas.repec.org/a/eee/jbrese/v46y1999i1p57-66.html
    verified: false
    items:
    - I know pretty much about [domain].
    - I do not feel very knowledgeable about [domain]. (R)
    - Among my circle of friends, I'm one of the experts on [domain].
    - Compared to most other people, I know less about [domain]. (R)
    - When it comes to [domain], I really don't know a lot. (R)
    scale: 5-point 或 7-point Likert, strongly disagree – strongly agree
    reliability: α 多在 .85–.93（跨領域樣本，依摘要）
    context: ''
    notes: 題項依常見引用改寫（頁面只有書目）。替代操作化：客觀知識測驗（正確題數）、職業年資／專業證照（在演算法欣賞／厭惡與 CLT 實驗中常以「專家 vs 新手」分組操弄）。
Adoption:
  zh: ''
  scales:
  - name: Rogers (1962/2003) Diffusion of Innovations; 實證上為二元採用（adopte
    source: Rogers (1962/2003) Diffusion of Innovations; 實證上為二元採用（adopter / non-adopter）或採用時點
    url: https://en.wikipedia.org/wiki/Diffusion_of_innovations
    verified: true
    items:
    - Has your organization / Have you adopted [the innovation]? (yes / no)
    - When did you first adopt [the innovation]? (year / month, used to classify adopter categories)
    - 'Extent of adoption: number of functions or modules of [the innovation] currently in use'
    - 'Stage of adoption: not considering / evaluating / trial / adopted / institutionalized'
    scale: 二元（0/1）、採用時間（連續或 adopter categories：innovators, early adopters, early majority, late majority, laggards）、或使用廣度計數
    reliability: ''
    context: ''
    notes: 客觀／行為指標，非態度量表。IDT／TOE 研究常用二元 logistic 的依變項；Taiwan 社群媒體研究也用 all-/partial-/minimum-adopters 多類別。
Organizational Citizenship Behavior:
  zh: ''
  scales:
  - name: Williams & Anderson (1991)
    source: Williams & Anderson (1991) Journal of Management 17(3), OCBI (7) + OCBO (7)；替代主量表 Podsakoff, MacKenzie,
      Moorman & Fetter (1990) 24 題五構面
    url: https://scales.arabpsychology.com/s/organizational-citizenship-behaviors/
    verified: true
    items:
    - Helps others who have been absent.（OCBI）
    - Helps others who have heavy work loads.（OCBI）
    - Goes out of way to help new employees.（OCBI）
    - Takes time to listen to co-workers' problems and worries.（OCBI）
    - Attendance at work is above the norm.（OCBO）
    - Gives advance notice when unable to come to work.（OCBO）
    - Conserves and protects organizational property.（OCBO）
    - Adheres to informal rules devised to maintain order.（OCBO）
    scale: 5-point Likert, 1 = strongly disagree, 5 = strongly agree（主管、同儕或自評）
    reliability: OCBI α = .61–.88；OCBO α = .70–.75（跨研究）
    context: ''
    notes: Podsakoff et al. (1990) 量表（altruism, conscientiousness, sportsmanship, courtesy, civic virtue）引用更多，但開過的頁面未列題項；Williams
      & Anderson 兩構面版在 LMX／POS／SET 研究亦極常見。
Arousal:
  zh: ''
  scales:
  - name: Bradley & Lang (1994)
    source: Bradley & Lang (1994) J. Behavior Therapy and Experimental Psychiatry 25(1), 49–59, Self-Assessment
      Manikin (SAM) arousal dimension；文字版 Mehrabian & Russell (1974) PAD arousal semantic differential
    url: https://en.wikipedia.org/wiki/Self-Assessment_Manikin
    verified: false
    items:
    - 'SAM arousal row: pictorial figures from calm/sleepy to excited/wide-awake (single item)'
    - 'PAD semantic differential: stimulated – relaxed'
    - 'PAD semantic differential: excited – calm'
    - 'PAD semantic differential: frenzied – sluggish'
    - 'PAD semantic differential: jittery – dull'
    - 'PAD semantic differential: wide-awake – sleepy'
    - 'PAD semantic differential: aroused – unaroused'
    scale: SAM 5 圖／9 點（1 = calm … 5/9 = excited）；PAD 7 點雙極語意差異
    reliability: PAD arousal 在 SOR 研究 α 多 .80 以上（依摘要）；SAM 為單題無 α
    context: ''
    notes: PAD 題對依常見引用改寫。生理指標：皮膚電導反應（SCR/EDA）、心率，常用於負面偏誤與社會促進實驗。
Decision Error:
  zh: ''
  scales:
  - name: Mosier, Skitka, Heers & Burdick (1998)
    source: Mosier, Skitka, Heers & Burdick (1998) Int. J. Aviation Psychology 8(1), automation bias errors; Mosier
      et al. (1996) NASA TR 20020041010
    url: https://ntrs.nasa.gov/citations/20020041010
    verified: true
    items:
    - 'Commission error: following an incorrect automated recommendation despite contradictory valid cues (count
      per scripted event)'
    - 'Omission error: failing to notice/act on a problem the automation did not flag (count per scripted event)'
    - Error rate = number of incorrect decisions / number of decision opportunities
    - Reaction time to unannounced events (latency) as secondary indicator
    scale: 行為計數（0/1 per trial）、錯誤率、反應時間
    reliability: ''
    context: ''
    notes: 客觀行為指標而非量表。代表性／沉沒成本研究則以「偏離規範解的比例」或「選擇違反貝氏規則的比例」計錯。
Perceived Quality:
  zh: ''
  scales:
  - name: Dodds, Monroe & Grewal (1991)
    source: Dodds, Monroe & Grewal (1991) JMR 28(3), perceived quality scale (5 items)；服務情境則用 SERVQUAL/SERVPERF
    url: https://tesify.es/escalas-validadas-tfg-marketing-intencion-compra-lealtad-valor-marca-comparativa-2026
    verified: false
    items:
    - The likelihood that this product is reliable is very high.
    - The workmanship of this product would be very high.
    - This product should be of very good quality.
    - The likelihood that this product is dependable is very high.
    - This product would seem to be durable.
    scale: 7-point, strongly disagree – strongly agree
    reliability: α = .93（Sweeney, Soutar & Johnson 1999 沿用 4 題版）
    context: ''
    notes: 題項依常見引用改寫（開過的頁面未逐字列出）。ACSI 用 3 題 10 點（overall quality, reliability, customization）；MAIN 模型用 message credibility／quality
      題。
Task Complexity:
  zh: ''
  scales:
  - name: Maynard & Hakel (1997)
    source: Maynard & Hakel (1997) Human Performance 10(4), 303–330, subjective task complexity (5 items)；客觀複雜度依
      Wood (1986) 成分／協調／動態複雜度操弄
    url: https://arxiv.org/pdf/2509.24643
    verified: false
    items:
    - I found this to be a complex task.
    - This task was mentally demanding.
    - This task required a lot of thought and problem-solving.
    - I found this to be a challenging task.
    - This task was difficult to complete.
    scale: 7-point Likert, strongly disagree – strongly agree
    reliability: α ≈ .90（Maynard & Hakel 1997，依常見引用）
    context: ''
    notes: 題項依常見引用改寫，未在開過的頁面逐字核對。實驗多直接操弄（子任務數、資訊線索數），SOR／社會促進研究常用簡單 vs 複雜兩水準。
Consumer Loyalty:
  zh: ''
  scales:
  - name: Zeithaml, Berry & Parasuraman (1996)
    source: Zeithaml, Berry & Parasuraman (1996) Journal of Marketing 60(2), 31–46, behavioral intentions battery,
      Loyalty dimension (5 items)
    url: https://verdi.cs.ucl.ac.uk/constructDB/publications/zeithaml-behavioral-1996.html
    verified: false
    items:
    - Say positive things about XYZ to other people.
    - Recommend XYZ to someone who seeks your advice.
    - Encourage friends and relatives to do business with XYZ.
    - Consider XYZ your first choice to buy services.
    - Do more business with XYZ in the next few years.
    scale: 7-point, 1 = not at all likely, 7 = extremely likely
    reliability: loyalty 分量表 α 多 .90 以上（後續研究）
    context: ''
    notes: 題項依常見引用改寫（頁面描述 5 題內容：正面口碑、推薦、續留、增加消費、首選）。替代：Oliver (1999) 四階段忠誠；CBBE 脈絡用 Yoo & Donthu (2001) brand loyalty
      3 題。
Habit:
  zh: ''
  scales:
  - name: Verplanken & Orbell (2003)
    source: Verplanken & Orbell (2003) Journal of Applied Social Psychology 33(6), 1313–1330, Self-Report Habit
      Index (SRHI, 12 items)
    url: https://www.frontiersin.org/articles/10.3389/fpsyg.2016.01364/full
    verified: true
    items:
    - '[Behavior X] is something I do frequently.'
    - '[Behavior X] is something I do automatically.'
    - '[Behavior X] is something I do without having to consciously remember.'
    - '[Behavior X] is something that makes me feel weird if I do not do it.'
    - '[Behavior X] is something I do without thinking.'
    - '[Behavior X] is something that would require effort not to do.'
    - '[Behavior X] is something that belongs to my daily routine.'
    - '[Behavior X] is something that is typically ''me''.'
    scale: 5-point 或 7-point, strongly disagree – strongly agree
    reliability: α = .96（閱讀習慣版，Frontiers 2016）；原始研究 α .89–.92
    context: ''
    notes: IS 續用脈絡（Limayem, Hirt & Cheung 2007）用 4 題 habit：'Using X has become automatic to me' 等；自動性短版 SRBAI（Gardner
      2012）4 題。
Negative Emotional Arousal:
  zh: ''
  scales:
  - name: Watson, Clark & Tellegen (1988)
    source: Watson, Clark & Tellegen (1988) JPSP 54(6), 1063–1070, PANAS Negative Affect (10 items)
    url: https://en.wikipedia.org/wiki/Positive_and_Negative_Affect_Schedule
    verified: true
    items:
    - Distressed
    - Upset
    - Guilty
    - Scared
    - Hostile
    - Irritable
    - Ashamed
    - Nervous
    - Jittery
    - Afraid
    scale: 5-point, 1 = very slightly or not at all, 5 = extremely；時距可改（此刻／今天／過去一週／一般）
    reliability: NA α = .84–.87；一週再測 r = .81（Watson et al. 1988）
    context: ''
    notes: 若要同時抓「負向」與「喚起度」，可併用 SAM 的 valence 與 arousal 兩題；評價理論研究常用離散情緒（anger, fear, sadness）多題。
Time Pressure:
  zh: ''
  scales:
  - name: Denovan & Dagnall (2019)
    source: Denovan & Dagnall (2019) Frontiers in Psychology 10:2717, Chronic Time Pressure Inventory (CTPI, 13
      items)；實驗操弄則用倒數計時
    url: https://www.frontiersin.org/articles/10.3389/fpsyg.2019.02717/full
    verified: true
    items:
    - I feel rushed to do the things that I have to do.
    - I am often in a hurry.
    - I feel pressured to fit everything in.
    - There aren't enough hours in the day.
    - I always run out of time.
    - The days fly by without me ever getting everything done.
    - I have enough time to do the things that I want to do. (R)
    - I feel in control of how I spend my time. (R)
    scale: 5-point, 1 = strongly disagree, 5 = strongly agree
    reliability: 總量表 α = .85–.86；Feeling Harried α = .80–.82；Cognitive Awareness of Time Shortage α = .76–.80
    context: ''
    notes: 決策實驗（錨定、選擇過載、NFCC）多以操弄為主：限時 vs 不限時、倒數計時器；操弄檢核用 1–2 題「I felt time pressure while deciding」。
Algorithm Error Observed:
  zh: ''
  scales:
  - name: Dietvorst, Simmons & Massey (2015)
    source: 'Dietvorst, Simmons & Massey (2015) JEP: General 144(1), 114–126; 實驗操弄：受試者是否看到演算法預測出錯'
    url: https://en.wikipedia.org/wiki/Algorithm_aversion
    verified: true
    items:
    - 'Manipulation: participants observe the algorithm''s forecasts and outcomes over N trials (algorithm errs
      visibly) vs. no observation'
    - 'Manipulation check: How accurate was the model''s forecast? (1 = very inaccurate, 7 = very accurate)'
    - 'Dependent measure: choice to rely on algorithm vs. human forecast (binary) or weight placed on algorithm
      advice (WOA)'
    - 'Alternative: number / magnitude of algorithm errors shown (0, small, large) as between-subjects factor'
    scale: 操弄變項（between-subjects）；操弄檢核 7 點
    reliability: ''
    context: ''
    notes: 客觀／操弄變項，非量表。Trust in Automation 脈絡以自動化可靠度（% correct）操弄，見 Lee & See (2004)。
Benefit:
  zh: ''
  scales:
  - name: Dinev & Hart (2006)
    source: Dinev & Hart (2006) Information Systems Research 17(1), personal Internet interest / perceived benefit；一般化版本為
      Perceived Benefits（privacy calculus）
    url: https://verdi.cs.ucl.ac.uk/constructDB/publications/dinev-extended-2006.html
    verified: false
    items:
    - I find personal Internet use to be of personal interest to me.
    - I find personal Internet use to be of interest to me.
    - I am interested in using the Internet for personal reasons.
    - Using [the service] provides me with benefits that outweigh the risks.
    - Overall, I feel that using [the service] is beneficial.
    scale: 5-point 或 7-point, strongly disagree – strongly agree
    reliability: personal Internet interest α ≈ .89（Dinev & Hart 2006，依摘要）
    context: ''
    notes: 題項依摘要改寫（頁面列構念與量尺，未列題項）。RCT／TTF 脈絡的 benefit 常直接沿用 Davis 的 PU 題；SEF 脈絡則用 outcome expectations 題。
Knowledge Sharing:
  zh: ''
  scales:
  - name: Bock, Zmud, Kim & Lee (2005)
    source: Bock, Zmud, Kim & Lee (2005) MIS Quarterly 29(1), 87–111, intention to share knowledge (5 items)
    url: https://verdi.cs.ucl.ac.uk/constructDB/publications/bock-behavioral-2005.html
    verified: false
    items:
    - I will share my work reports and official documents with members of my organization more frequently in the
      future.
    - I will always provide my manuals, methodologies and models for members of my organization.
    - I intend to share my experience or know-how from work with other organizational members more frequently in
      the future.
    - I will always provide my know-where or know-whom at the request of other organizational members.
    - I will try to share my expertise from my education or training with other organizational members in a more
      effective way.
    scale: 5-point Likert（very frequently – very rarely；extremely likely – extremely unlikely）
    reliability: α ≈ .92（Bock et al. 2005，依常見引用）
    context: ''
    notes: 題項依常見引用改寫（頁面只給量尺）。行為版：Van den Hooff & de Ridder (2004) knowledge donating / collecting 各 4 題。
Past Performance:
  zh: ''
  scales:
  - name: Usher & Pajares (2009)
    source: Usher & Pajares (2009) Contemporary Educational Psychology 34(1), 89–101, Sources of Self-Efficacy scale,
      Mastery Experience subscale (6 items)
    url: https://scholars.uky.edu/en/publications/sources-of-self-efficacy-in-mathematics-a-validation-study/
    verified: false
    items:
    - I make excellent grades on [math] tests.
    - I have always been successful with [math].
    - Even when I study very hard, I do poorly in [math]. (R)
    - I got good grades in [math] on my last report card.
    - I do well on [math] assignments.
    - I do well on even the most difficult [math] assignments.
    scale: 6-point 或 100 點（0 = definitely false … 100 = definitely true）
    reliability: Mastery experience α = .88（Usher & Pajares 2009，依摘要）
    context: ''
    notes: 題項依常見引用改寫。效率市場／EVT 脈絡的 past performance 是客觀指標（前期報酬率、前期成績），非量表。
Perceived Threat:
  zh: ''
  scales:
  - name: Witte (1996)
    source: Witte (1996) Journal of Health Communication 1(4), 317–342, Risk Behavior Diagnosis (RBD) Scale, Perceived
      Threat = Severity (3) + Susceptibility (3)
    url: https://cancercontrol.cancer.gov/brp/research/constructs/perceived-severity
    verified: false
    items:
    - I believe that [threat] is severe.
    - I believe that [threat] is serious.
    - I believe that [threat] is significant.
    - I am at risk for [threat].
    - It is likely that I will experience [threat].
    - It is possible that I will experience [threat].
    scale: 7-point（原始 5–7 點）, strongly disagree – strongly agree
    reliability: severity / susceptibility 分量表 α 多 .80 以上；跨研究 .65–1.0
    context: ''
    notes: severity 3 題為頁面逐字；susceptibility 3 題依常見引用改寫。TTAT 用 Liang & Xue (2010) perceived threat 題；TMSC 用 threat
      appraisal 題。
Privacy Concern:
  zh: ''
  scales:
  - name: Malhotra, Kim & Agarwal (2004)
    source: 'Malhotra, Kim & Agarwal (2004) Information Systems Research 15(4), 336–355, Internet Users'' Information
      Privacy Concerns (IUIPC, 10 items: Collection 4, Control 3, Awareness 3)'
    url: https://verdi.cs.ucl.ac.uk/constructDB/publications/malhotra-internet-2004.html
    verified: false
    items:
    - It usually bothers me when online companies ask me for personal information.
    - When online companies ask me for personal information, I sometimes think twice before providing it.
    - I am concerned that online companies are collecting too much personal information about me.
    - Consumer online privacy is really a matter of consumers' right to exercise control and autonomy over decisions
      about how their information is collected, used, and shared.
    - Consumer control of personal information lies at the heart of consumer privacy.
    - Companies seeking information online should disclose the way the data are collected, processed, and used.
    - A good consumer online privacy policy should have a clear and conspicuous disclosure.
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree
    reliability: Collection α ≈ .83–.88, Control ≈ .78–.86, Awareness ≈ .74–.89（原研究與複製研究，依摘要）
    context: ''
    notes: 題項依常見引用改寫（開過的頁面皆只有摘要）。替代：Smith, Milberg & Burke (1996) CFIP 15 題；APCO 架構建議依脈絡選 CFIP 或 IUIPC。
Social Environment:
  zh: ''
  scales:
  - name: Bandura (1986)
    source: Bandura (1986) Social Foundations of Thought and Action（三元交互決定論的環境因子）；實證常以 Zimet et al. (1988) MSPSS
      或 subjective norm 題操作化
    url: https://en.wikipedia.org/wiki/Social_cognitive_theory
    verified: false
    items:
    - There is a special person who is around when I am in need.（MSPSS）
    - My family really tries to help me.（MSPSS）
    - I can count on my friends when things go wrong.（MSPSS）
    - Most people who are important to me think I should [perform behavior].（subjective norm）
    - People around me (family, friends, colleagues) frequently [perform behavior].（descriptive norm）
    scale: 7-point, very strongly disagree – very strongly agree（MSPSS）；7-point unlikely – likely（norm）
    reliability: MSPSS 總量表 α = .88（Zimet et al. 1988，依常見引用）
    context: ''
    notes: 「社會環境」在 SCT／U&G／沉默螺旋脈絡無單一標準量表；沉默螺旋用「意見氣候知覺」題（多數人支持哪一方）。此處題項依常見引用改寫。
Technology:
  zh: ''
  scales:
  - name: Tornatzky & Fleischer (1990)
    source: Tornatzky & Fleischer (1990) The Processes of Technological Innovation（TOE 的 technological context）；實證常用
      Zhu, Kraemer & Xu (2006) technology competence / IT infrastructure 題
    url: https://en.wikipedia.org/wiki/Technology%E2%80%93organization%E2%80%93environment_framework
    verified: false
    items:
    - Our firm has the IT infrastructure (hardware, network, databases) needed to support [the technology].
    - Our firm has employees with the technical skills needed to implement and use [the technology].
    - Our existing systems are compatible with [the technology].
    - '[The technology] is readily available in the market for our industry.'
    - Perceived relative advantage of [the technology] over existing practices.
    scale: 7-point Likert（TOE 調查）；TTF 脈絡用 Goodhue & Thompson (1995) 的 technology characteristics 題
    reliability: ''
    context: ''
    notes: 無單一標準量表；TOE 文獻自承「too generic」，題項依研究各異。此處題項為 TOE 研究常見操作化的大意改寫（依摘要），非逐字引用。
Workload:
  zh: ''
  scales:
  - name: Hart & Staveland (1988)
    source: Hart & Staveland (1988) in Hancock & Meshkati (Eds.), Human Mental Workload, pp. 139–183, NASA Task
      Load Index (NASA-TLX, 6 subscales)
    url: https://en.wikipedia.org/wiki/NASA-TLX
    verified: true
    items:
    - 'Mental Demand: How mentally demanding was the task?'
    - 'Physical Demand: How physically demanding was the task?'
    - 'Temporal Demand: How hurried or rushed was the pace of the task?'
    - 'Performance: How successful were you in accomplishing what you were asked to do?'
    - 'Effort: How hard did you have to work to accomplish your level of performance?'
    - 'Frustration: How insecure, discouraged, irritated, stressed, and annoyed were you?'
    scale: 每題 0–100（5 點一格）, Low – High（Performance 為 Good – Poor）；加權版另做 15 組兩兩比較，Raw TLX 直接平均
    reliability: 單題分量表不報 α；再測信度 r ≈ .77–.83（Hart 2006 回顧，依摘要）
    context: ''
    notes: MRT／自動化研究也用次要作業績效與生理指標（瞳孔、HRV）當客觀負荷；分量表問句為官方版常見措辭（頁面給定義、未逐字）。
Age:
  zh: ''
  scales:
  - name: 人口變項（UTAUT 調節變項；Venkatesh et al. 2003）
    source: 人口變項（UTAUT 調節變項；Venkatesh et al. 2003）
    url: https://en.wikipedia.org/wiki/Unified_theory_of_acceptance_and_use_of_technology
    verified: true
    items:
    - What is your age? (years, open-ended)
    - 'Age group: 18–24 / 25–34 / 35–44 / 45–54 / 55–64 / 65+'
    - Year of birth
    scale: 連續（歲）或序位類別；UTAUT 分析時常中位數切分或當連續調節變項
    reliability: ''
    context: ''
    notes: 客觀指標，無量表。負面偏誤／不注意視盲研究以年齡組（young vs older adults）分組。
Bandwagon Cues:
  zh: ''
  scales:
  - name: Sundar (2008)
    source: Sundar (2008) MAIN model；Sundar, Oeldorf-Hirsch & Xu (2008) / Waddell & Sundar (2017)：操弄介面上的集體線索（likes、views、ratings、評論數），並以
      bandwagon perception 題檢核
    url: https://arxiv.org/abs/2505.14861
    verified: false
    items:
    - 'Manipulation: number of likes / shares / views / star ratings / number of reviews (low vs. high)'
    - 'Bandwagon perception: Many other people have viewed/liked this content.'
    - 'Bandwagon perception: This content is popular among other users.'
    - 'Bandwagon perception: Other users recommend this content.'
    - 'Bandwagon perception: Most people would agree with this content.'
    scale: 操弄變項（between-subjects）；知覺題 7-point strongly disagree – strongly agree
    reliability: bandwagon perception α 多 .85 以上（Xu 2013; Waddell & Sundar 2017，依摘要）
    context: ''
    notes: 線索本身是操弄變項；知覺題依摘要改寫。Penn State 研究發現中等 likes 數效果最強，兩水準設計可能漏掉非線性。
Compatibility:
  zh: ''
  scales:
  - name: Moore & Benbasat (1991)
    source: Moore & Benbasat (1991) Information Systems Research 2(3), 192–222, Perceived Characteristics of Innovating
      (PCI), Compatibility subscale (4 items; short version 3)
    url: https://verdi.cs.ucl.ac.uk/constructDB/publications/moore-development-1991.html
    verified: false
    items:
    - Using [the innovation] is compatible with all aspects of my work.
    - Using [the innovation] is completely compatible with my current situation.
    - I think that using [the innovation] fits well with the way I like to work.
    - Using [the innovation] fits into my work style.
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree
    reliability: Compatibility α = .86（Moore & Benbasat 1991，依常見引用）
    context: ''
    notes: 題項依常見引用改寫（開過的頁面只有書目與結構：38 題 8 量表、短版 25 題）。Rogers IDT 的 compatibility 定義為與既有價值、經驗、需求一致。
Creativity:
  zh: ''
  scales:
  - name: Zhou & George (2001)
    source: Zhou & George (2001) Academy of Management Journal 44(4), 682–696, employee creativity (13 items, supervisor-rated;
      部分題承 Scott & Bruce 1994)
    url: https://scales.arabpsychology.com/s/creativity-continuance-commitment/
    verified: true
    items:
    - Suggests new ways to achieve goals or objectives.
    - Comes up with new and practical ideas to improve performance.
    - Searches out new technologies, processes, techniques, and/or product ideas.
    - Suggests new ways to increase quality.
    - Is a good source of creative ideas.
    - Often has new and innovative ideas.
    - Comes up with creative solutions to problems.
    - Suggests new ways of performing work tasks.
    scale: 5-point, 1 = not at all characteristic, 5 = very characteristic（主管評）
    reliability: α = .96（Zhou & George 2001，依常見引用）
    context: ''
    notes: 開過的頁面把 13 題歸給 Scott & Bruce (1994)；實際上 Zhou & George (2001) 的 13 題版是最常引用的主管評創造力量表。客觀替代：Torrance TTCT、Guilford
      替代用途測驗（流暢、變通、獨創）。
Estimation Error:
  zh: ''
  scales:
  - name: Cleveland & McGill (1984)
    source: Cleveland & McGill (1984) JASA 79(387), 531–554, graphical perception elementary tasks；誤差指標
    url: https://en.wikipedia.org/wiki/Graphical_perception
    verified: true
    items:
    - 'Task: judge what percentage the smaller of two marked values is of the larger (0–100)'
    - Absolute error = |judged percent − true percent|
    - Log absolute error = log2(|judged percent − true percent| + 1/8)（Cleveland & McGill 的標準轉換）
    - 'Alternative: proportion of correct magnitude comparisons; time to answer'
    scale: 連續誤差量（百分點或 log2 單位）
    reliability: ''
    context: ''
    notes: 客觀行為指標非量表；log2 公式依常見引用（Heer & Bostock 2010 亦沿用），開過的頁面未列公式。
Gain Framing:
  zh: ''
  scales:
  - name: Tversky & Kahneman (1981)
    source: Tversky & Kahneman (1981) Science 211(4481), 453–458, Asian disease problem；分類見 Levin, Schneider & Gaeth
      (1998) attribute / goal / risky-choice framing
    url: https://en.wikipedia.org/wiki/Framing_effect_(psychology)
    verified: true
    items:
    - 'Gain frame (risky choice): If Program A is adopted, 200 people will be saved. If Program B is adopted, there
      is a 1/3 probability that 600 people will be saved and a 2/3 probability that no people will be saved.'
    - 'Loss frame (risky choice): If Program C is adopted, 400 people will die. If Program D is adopted, there is
      a 1/3 probability that nobody will die and a 2/3 probability that 600 people will die.'
    - 'Attribute framing: ground beef described as 75% lean (gain) vs. 25% fat (loss)'
    - 'Goal framing (health message): If you do X, you will gain benefit Y (gain) vs. If you do not do X, you will
      lose benefit Y (loss)'
    - 'Manipulation check: The message emphasized the benefits of acting (gain) / the costs of not acting (loss).'
    scale: 操弄變項（between-subjects）；依變項為選擇比例或 7 點態度／意圖
    reliability: ''
    context: ''
    notes: 操弄變項非量表。Regulatory Focus 脈絡另配 RFQ（Higgins 2001）測促進／預防焦點。
Identification:
  zh: ''
  scales:
  - name: Cohen (2001)
    source: Cohen (2001) Mass Communication & Society 4(3), 245–264, identification with media characters (10 items)；團體認同則用
      Leach et al. (2008) in-group identification
    url: https://revistas.uma.es/index.php/espsi/article/view/13358
    verified: false
    items:
    - While viewing [program], I felt as if I were part of the action.
    - While viewing [program], I forgot myself and was fully absorbed.
    - I was able to understand the events in the program in a manner similar to that in which [character] understood
      them.
    - I think I have a good understanding of [character].
    - I tend to understand the reasons why [character] does what he/she does.
    - While viewing, I could feel the emotions [character] portrayed.
    - During viewing, I felt I could really get inside [character]'s head.
    - At key moments in the show, I felt I knew exactly what [character] was going through.
    scale: 5-point, 1 = strongly disagree, 5 = strongly agree
    reliability: α 多 .85–.95（後續研究，依摘要）
    context: ''
    notes: 題項依常見引用改寫（開過的頁面未列題項）。Cohen 自承原 10 題未經驗證；SIT 脈絡的 identification 改用 Mael & Ashforth (1992) 6 題組織認同。
Intrinsic Motivation:
  zh: ''
  scales:
  - name: Ryan (1982)
    source: Ryan (1982); Intrinsic Motivation Inventory (IMI), Interest/Enjoyment subscale (7 items)；McAuley, Duncan
      & Tammen (1989) 驗證
    url: https://selfdeterminationtheory.org/intrinsic-motivation-inventory/
    verified: false
    items:
    - I enjoyed doing this activity very much.
    - This activity was fun to do.
    - I thought this was a boring activity. (R)
    - This activity did not hold my attention at all. (R)
    - I would describe this activity as very interesting.
    - I thought this activity was quite enjoyable.
    - While I was doing this activity, I was thinking about how much I enjoyed it.
    scale: 7-point, 1 = not at all true, 4 = somewhat true, 7 = very true
    reliability: Interest/Enjoyment α = .85–.90（跨研究）
    context: ''
    notes: 題項為 IMI 官方版常見題（開過的頁面只列一題樣本，其餘依常見引用改寫）。工作脈絡可用 WEIMS 的 intrinsic 3 題。
Mental Imagery:
  zh: ''
  scales:
  - name: Babin & Burns (1998)
    source: Babin & Burns (1998) Psychology & Marketing 15(3), 261–278, communication-evoked mental imagery scale
      (vividness 5, quantity 4, elaboration 4)
    url: https://aquila.usm.edu/fac_pubs/4962
    verified: false
    items:
    - 'Vividness (semantic differential): the images that came to mind were clear – unclear'
    - 'Vividness: vivid – vague'
    - 'Vividness: sharp – dull'
    - 'Quantity: I experienced many images – few images'
    - 'Quantity: lots of images – no images'
    - 'Elaboration: I fantasized about the product / situation described.'
    - 'Elaboration: While reading/viewing, I imagined what it would be like to use the product.'
    scale: 7-point 語意差異（vividness, quantity）與 7-point Likert（elaboration）
    reliability: vividness α ≈ .93, quantity ≈ .91, elaboration ≈ .80（Babin & Burns 1998，依摘要）
    context: ''
    notes: 題項依摘要改寫（頁面只有三構面與摘要）。一般意象能力用 Marks (1973) VVIQ；敘事傳輸研究常用 Green & Brock (2000) transportation 中的 imagery
      題。
Outcome Expectations:
  zh: ''
  scales:
  - name: Compeau & Higgins (1995)
    source: 'Compeau & Higgins (1995) MIS Quarterly 19(2), 189–211, outcome expectations: performance-related (6)
      + personal (4)'
    url: https://verdi.cs.ucl.ac.uk/constructDB/publications/compeau-computer-1995.html
    verified: false
    items:
    - If I use a computer, I will increase my effectiveness on the job.
    - If I use a computer, I will spend less time on routine job tasks.
    - If I use a computer, I will increase the quality of output of my job.
    - If I use a computer, I will increase the quantity of output for the same amount of effort.
    - If I use a computer, I will be seen as more competent by my coworkers.
    - If I use a computer, I will increase my chances of obtaining a promotion.
    - If I use a computer, I will have more opportunities for advancement.
    scale: 5-point, 1 = strongly disagree, 5 = strongly agree
    reliability: performance-related α ≈ .88, personal ≈ .83（Compeau & Higgins 1995，依常見引用）
    context: ''
    notes: 題項依常見引用改寫（頁面只有結構與量尺）。歸因理論脈絡的 outcome expectation 多用單題「期望下次成功的機率」。
Perceived Fairness:
  zh: ''
  scales:
  - name: Colquitt (2001)
    source: Colquitt (2001) Journal of Applied Psychology 86(3), 386–400, Organizational Justice Scale (procedural
      7, distributive 4, interpersonal 4, informational 5)
    url: https://qic-wd.org/node/547
    verified: true
    items:
    - To what extent have you been able to express your views and feelings during those procedures?（procedural）
    - To what extent have those procedures been free of bias?（procedural）
    - To what extent have those procedures been applied consistently?（procedural）
    - To what extent have those procedures been based on accurate information?（procedural）
    - To what extent has (he/she) treated you with respect?（interpersonal）
    - To what extent has (he/she) refrained from improper remarks or comments?（interpersonal）
    - To what extent has (he/she) explained the procedures thoroughly?（informational）
    - To what extent were (his/her) explanations regarding the procedures reasonable?（informational）
    scale: 5-point, 1 = to a small extent, 5 = to a large extent
    reliability: procedural α = .93, distributive .93, interpersonal .92, informational .90（Colquitt 2001 Study
      1，依常見引用）
    context: ''
    notes: 前 2 題與後 4 題為頁面逐字；procedural 第 3、4 題依常見引用補。FAccT／演算法公平脈絡常改用 Shin (2020) 或 Lee (2018) 的 algorithmic fairness
      3–4 題。
Performance Expectancy:
  zh: ''
  scales:
  - name: Venkatesh, Morris, Davis & Davis (2003)
    source: Venkatesh, Morris, Davis & Davis (2003) MIS Quarterly 27(3), 425–478, UTAUT Performance Expectancy (4
      items)
    url: https://en.wikipedia.org/wiki/Unified_theory_of_acceptance_and_use_of_technology
    verified: false
    items:
    - I would find the system useful in my job.
    - Using the system enables me to accomplish tasks more quickly.
    - Using the system increases my productivity.
    - If I use the system, I will increase my chances of getting a raise.
    scale: 7-point Likert, 1 = strongly disagree, 7 = strongly agree
    reliability: α ≥ .88（Venkatesh et al. 2003 各時點，依常見引用）
    context: ''
    notes: 題項依常見引用改寫（開過的頁面只有定義與書目）。AIDUA（Gursoy et al. 2019）亦沿用 PE 4 題改成 AI 裝置版；XAI 信任模型多沿用。
Purchase:
  zh: ''
  scales:
  - name: 行為指標：實際購買（self-reported purchase、交易紀錄、掃描器資料、實驗中的真實購買／付費選擇）
    source: 行為指標：實際購買（self-reported purchase、交易紀錄、掃描器資料、實驗中的真實購買／付費選擇）
    url: https://pubsonline.informs.org/doi/10.1287/mksc.1.3.243
    verified: true
    items:
    - Did you purchase [the product/brand] in the past [period]? (yes / no)
    - How many times / how much did you spend on [product] in the past [period]?
    - 'Observed transaction: purchase recorded in panel / scanner / platform data (0/1, amount)'
    - 'Incentive-compatible choice: participant chooses to buy with real money or endowment'
    scale: 二元、計數、金額；實驗中為真實選擇
    reliability: ''
    context: ''
    notes: 客觀指標非量表；Hierarchy of Effects 把 purchase 當最後階段。意圖量表與實際購買的預測效度見 Kalwani & Silk (1982)。
Risk Seeking:
  zh: ''
  scales:
  - name: Blais & Weber (2006)
    source: Blais & Weber (2006) Judgment and Decision Making 1(1), 33–47, DOSPERT 30-item risk-taking scale (5
      domains × 6)
    url: https://dlab.sauder.ubc.ca/sjdm/journal/06005/jdm06005.htm
    verified: true
    items:
    - Betting a day's income at the horse races.（financial/gambling）
    - Investing 10% of your annual income in a new business venture.（financial/investment）
    - Driving a car without wearing a seat belt.（health/safety）
    - Taking a weekend sky-diving class.（recreational）
    - Passing off somebody else's work as your own.（ethical）
    - Disagreeing with an authority figure on a major issue.（social）
    scale: 7-point, 1 = extremely unlikely, 4 = not sure, 7 = extremely likely（另有 risk-perception 與 expected-benefit
      平行量尺）
    reliability: risk-taking 各領域 α：ethical .68, financial .80, health/safety .66, recreational .84, social .70（Blais
      & Weber 2006 Table 2）
    context: ''
    notes: 展望理論脈絡常改用行為指標：在彩券選擇任務中選風險選項的比例、Holt & Laury (2002) 風險偏好序列。
Self-Concept:
  zh: ''
  scales:
  - name: Campbell et al. (1996)
    source: Campbell et al. (1996) JPSP 70(1), 141–156, Self-Concept Clarity Scale (SCCS, 12 items)；自尊面向用 Rosenberg
      (1965)
    url: https://dlab.sauder.ubc.ca/sjdm/dmidi/Self-Concept%20Clarity.html
    verified: false
    items:
    - My beliefs about myself often conflict with one another. (R)
    - On one day I might have one opinion of myself and on another day I might have a different opinion. (R)
    - I spend a lot of time wondering about what kind of person I really am. (R)
    - Sometimes I feel that I am not really the person that I appear to be. (R)
    - In general, I have a clear sense of who I am and what I am.
    - Even if I wanted to, I don't think I could tell someone what I'm really like. (R)
    scale: 5-point, 1 = strongly disagree, 5 = strongly agree
    reliability: α = .86；4 個月再測 r = .79（Campbell et al. 1996，依常見引用）
    context: ''
    notes: 頁面只列 2 題，其餘依常見引用改寫。Self-concept 是上位構念；印象管理（IMT）脈絡常改用 self-monitoring（Snyder 1974）或 public self-consciousness。
Social Categorization:
  zh: ''
  scales:
  - name: Tajfel et al. (1971)
    source: Tajfel et al. (1971) minimal group paradigm；操弄：以瑣碎標準分組，測量：分配矩陣與內／外團體特質評價
    url: https://en.wikipedia.org/wiki/Minimal_group_paradigm
    verified: true
    items:
    - 'Manipulation: random / trivial assignment to Group A vs. Group B (e.g., painting preference, coin toss)'
    - 'Allocation matrices: points distributed to anonymous in-group vs. out-group members (in-group favoritism
      index)'
    - 'Trait ratings: rate in-group and out-group members on positive/negative traits (7-point)'
    - 'Categorization accuracy / speed: who-said-what paradigm (memory confusions within vs. between categories)'
    - 'Self-report: I see [target] as a member of my own group vs. another group (7-point)'
    scale: 操弄變項；分配矩陣得分；7 點評價
    reliability: ''
    context: ''
    notes: 多為操弄或行為指標；表徵性捷思／認知吝嗇脈絡用刻板印象推論題。團體認同強度可配 Leach et al. (2008) 14 題。
Socialization:
  zh: ''
  scales:
  - name: Chao, O'Leary-Kelly, Wolf, Klein & Gardner (1994)
    source: Chao, O'Leary-Kelly, Wolf, Klein & Gardner (1994) Journal of Applied Psychology 79(5), 730–743, Organizational
      Socialization content scale (34 items, 6 dimensions)
    url: https://qic-wd.org/node/521
    verified: false
    items:
    - I have learned how to successfully perform my job in an efficient manner.（performance proficiency）
    - I have mastered the required tasks of my job.（performance proficiency）
    - I have learned how things 'really work' on the inside of this organization.（politics）
    - I know who the most influential people are in my organization.（politics）
    - I understand the goals of my organization.（goals and values）
    - I know the organization's long-held traditions, customs, myths, and rituals.（history）
    - I have mastered this organization's slang and special jargon.（language）
    - Within my work group, I would be easily identified as 'one of the gang'.（people）
    scale: 5-point, 1 = strongly disagree, 5 = strongly agree
    reliability: 六構面 α = .78–.86（Chao et al. 1994，依常見引用）
    context: ''
    notes: 題項依常見引用改寫（頁面未列題項）。社會化「策略」用 Jones (1986) 30 題；心理契約脈絡亦可用 Haueter et al. (2003) 的 newcomer socialization。
Time Since Exposure:
  zh: ''
  scales:
  - name: Hovland, Lumsdaine & Sheffield (1949)
    source: Hovland, Lumsdaine & Sheffield (1949) / Hovland & Weiss (1951) sleeper effect 設計：立即 vs 延宕測量；可得性捷思則操弄回憶距今時間
    url: https://en.wikipedia.org/wiki/Sleeper_effect
    verified: true
    items:
    - 'Manipulation: attitude measured immediately after exposure vs. after delay (e.g., 1 week, 3–5 weeks, 9 weeks)'
    - 'Self-report: How long ago did you see / hear about [message/event]? (days / weeks)'
    - 'Recall check: Do you remember the source of the message? (yes / no)'
    - 'Log data: timestamp difference between exposure and outcome measurement'
    scale: 連續時間（天／週）或 between-subjects 延宕條件
    reliability: ''
    context: ''
    notes: 客觀／設計變項非量表。單純曝光效應改計曝光次數與間隔；頁面指出文獻無標準延宕長度，見 Kumkale & Albarracín (2004) 統合分析。
Awareness of Consequence:
  zh: ''
  scales:
  - name: Schwartz (1977)
    source: Schwartz (1977) Norm Activation Model；量表沿用 Stern, Dietz & Kalof (1993) AC scale 與 De Groot & Steg (2009)
      J. Social Psychology 149(4) 的 AC 題
    url: https://mpra.ub.uni-muenchen.de/23900/
    verified: false
    items:
    - '[Behavior/problem] causes serious harm to the environment.'
    - '[Behavior/problem] is a serious problem for society.'
    - '[Behavior/problem] has negative consequences for future generations.'
    - Reducing [behavior] would help protect the environment.
    - The consequences of [behavior] are exaggerated. (R)
    scale: 5-point 或 7-point, strongly disagree – strongly agree
    reliability: AC α 多 .70–.85（De Groot & Steg 2009 各研究，依摘要）
    context: ''
    notes: 題項依摘要改寫；Ryan & Spash 指出 AC 量表實際測的是「支持／反對環境行動的信念」，題項依議題替換，無單一固定版本。
Competence:
  zh: ''
  scales:
  - name: Deci, Ryan, Gagné, Leone, Usunov & Kornazheva (2001)
    source: Deci, Ryan, Gagné, Leone, Usunov & Kornazheva (2001) PSPB 27(8), Basic Psychological Need Satisfaction
      at Work (21 items), Competence subscale (6)
    url: https://selfdeterminationtheory.org/basic-psychological-need-satisfaction-scales/
    verified: false
    items:
    - I do not feel very competent when I am at work. (R)
    - People at work tell me I am good at what I do.
    - I have been able to learn interesting new skills on my job.
    - Most days I feel a sense of accomplishment from working.
    - On my job I do not get much of a chance to show how capable I am. (R)
    - When I am working I often do not feel very capable. (R)
    scale: 7-point, 1 = not at all true, 4 = somewhat true, 7 = very true
    reliability: competence α ≈ .70–.80（Deci et al. 2001 跨國樣本，依摘要）；BPNSFS（Chen et al. 2015）competence 4 題 α ≈ .85
    context: ''
    notes: 第 1 題為搜尋摘要逐字；其餘依常見引用改寫。LMX 脈絡的 competence 多指成員能力評價，可改用主管評 task performance。
Goal Difficulty:
  zh: ''
  scales:
  - name: Locke & Latham (1990/2002) goal-setting theory；量表版：Lee, Bobk
    source: Locke & Latham (1990/2002) goal-setting theory；量表版：Lee, Bobko, Earley & Locke (1991) Goal Setting Questionnaire,
      goal difficulty 題；實驗版為操弄
    url: https://en.wikipedia.org/wiki/Goal_setting
    verified: false
    items:
    - My goals are very difficult to achieve.
    - It takes a high degree of skill and know-how to attain my goals.
    - The goals I have are challenging.
    - I have to work very hard to reach my goals.
    - 'Manipulation: easy / do-your-best / specific difficult goal (set at ~90th percentile of prior performance)'
    scale: 5-point 或 7-point, strongly disagree – strongly agree；實驗為 between-subjects 條件
    reliability: goal difficulty α ≈ .70–.80（Lee et al. 1991，依常見引用）
    context: ''
    notes: 題項依常見引用改寫（頁面只說明操弄方式）。VIE 脈絡常以 expectancy（達成機率）反向代表難度。
Org Reputation:
  zh: ''
  scales:
  - name: Coombs & Holladay (1996/2002) Organizational Reputation Scal
    source: Coombs & Holladay (1996/2002) Organizational Reputation Scale (10 items; 2002 版常用 5 題短版), Management
      Communication Quarterly 16(2)
    url: https://en.wikipedia.org/wiki/Situational_crisis_communication_theory
    verified: false
    items:
    - The organization is basically honest.
    - The organization is concerned with the well-being of its publics.
    - I do not trust the organization to tell the truth about the incident. (R)
    - Under most circumstances, I would be likely to believe what the organization says.
    - The organization is not concerned with the well-being of its publics. (R)
    scale: 5-point 或 7-point, strongly disagree – strongly agree
    reliability: α = .81–.91（Coombs & Holladay 各研究，依常見引用）
    context: ''
    notes: 題項依常見引用改寫（開過的頁面未列題項）。利害關係人理論脈絡可改用 Fombrun, Gardberg & Sever (2000) RepTrak／Reputation Quotient 20 題。
Response Efficacy:
  zh: ''
  scales:
  - name: Witte (1996)
    source: Witte (1996) Journal of Health Communication 1(4), Risk Behavior Diagnosis Scale, Response Efficacy
      subscale (3 items)；PMT 脈絡同
    url: https://verdi.cs.ucl.ac.uk/constructDB/publications/witte-predicting-1996.html
    verified: false
    items:
    - '[Recommended response] is effective in preventing [threat].'
    - '[Recommended response] works in preventing [threat].'
    - If I [do recommended response], I am less likely to get [threat].
    scale: 7-point（或 5 點）, strongly disagree – strongly agree
    reliability: response efficacy α 多 .80 以上（跨研究 .65–1.0）
    context: ''
    notes: 題項依常見引用改寫（頁面只有 severity 題逐字）。
Vicarious Exp:
  zh: ''
  scales:
  - name: Usher & Pajares (2009)
    source: Usher & Pajares (2009) Contemporary Educational Psychology 34(1), Sources of Self-Efficacy, Vicarious
      Experience subscale (6 items)
    url: https://scholars.uky.edu/en/publications/sources-of-self-efficacy-in-mathematics-a-validation-study/
    verified: false
    items:
    - Seeing adults do well in [math] pushes me to do better.
    - When I see how my [math] teacher solves a problem, I can picture myself solving the problem in the same way.
    - Seeing kids do better than me in [math] pushes me to do better.
    - When I see how another student solves a [math] problem, I can see myself solving the problem in the same way.
    - I imagine myself working through challenging [math] problems successfully.
    - I compete with myself in [math].
    scale: 6-point 或 100 點 (0 = definitely false, 100 = definitely true)
    reliability: vicarious experience α = .84（Usher & Pajares 2009，依摘要；早期量表此構面 α 偏低 ≈ .56）
    context: ''
    notes: 題項依常見引用改寫。實驗中 vicarious experience 常為操弄：觀看相似他人成功示範 vs 無示範。
Assurance:
  zh: ''
  scales:
  - name: Parasuraman, Zeithaml & Berry (1988)
    source: Parasuraman, Zeithaml & Berry (1988) Journal of Retailing 64(1), 12–40, SERVQUAL Assurance (4–5 items)
    url: https://en.wikipedia.org/wiki/SERVQUAL
    verified: false
    items:
    - The behaviour of employees in [XYZ] instils confidence in you.
    - You feel safe in your transactions with [XYZ].
    - Employees of [XYZ] are consistently courteous with you.
    - Employees of [XYZ] have the knowledge to answer your questions.
    scale: 7-point, 1 = strongly disagree, 7 = strongly agree；期望與知覺各答一次，差距分數或只用知覺（SERVPERF）
    reliability: assurance α ≈ .87（PZB 1988 跨樣本 .76–.87，依常見引用）
    context: ''
    notes: 第 1 題為頁面逐字，其餘依常見引用改寫。
Crisis History:
  zh: ''
  scales:
  - name: Coombs (2004)
    source: Coombs (2004) Journal of Business Communication 41(3), 265–289；SCCT 強化因子，實驗中為操弄
    url: https://en.wikipedia.org/wiki/Situational_crisis_communication_theory
    verified: true
    items:
    - 'Manipulation: news story states the organization has had similar crises before (history) vs. no prior crises
      (no history)'
    - 'Manipulation check: This organization has experienced similar crises in the past. (7-point agree)'
    - 'Manipulation check: How many similar crises has this organization had before? (none / one / several)'
    - 'Archival: count of prior crises of same type in media coverage over past N years'
    scale: 操弄變項（between-subjects）；檢核 7 點
    reliability: ''
    context: ''
    notes: 客觀／操弄變項非量表；頁面只有定義，未載測量細節。
Elaboration:
  zh: ''
  scales:
  - name: Petty & Cacioppo (1986)
    source: Petty & Cacioppo (1986) ELM；客觀測量：thought-listing（Cacioppo & Petty 1981）；主觀自陳：elaboration 自評題
    url: https://queensu.scholaris.ca//items/15f723eb-9589-4132-8fad-f85d5e1def73
    verified: false
    items:
    - 'Thought listing: please list all the thoughts you had while reading the message (coded: number of message-relevant
      thoughts; valence)'
    - 'Self-report: How much attention did you pay to the message? (1 = none, 7 = a great deal)'
    - 'Self-report: How much did you think about the arguments in the message?'
    - 'Self-report: I carefully considered the information presented.'
    - 'Self-report: I thought deeply about the content of the message.'
    scale: 計數（thought-listing）；自評 7 點
    reliability: 自評 elaboration α 多 .80 以上（依摘要）
    context: ''
    notes: 自評題依摘要改寫。客觀與主觀兩種測法可能不一致（該論文指出主觀題效果方向相反）。
Hierarchical Governance:
  zh: ''
  scales:
  - name: Williamson (1975, 1985) Transaction Cost Economics；實證操作化：mak
    source: Williamson (1975, 1985) Transaction Cost Economics；實證操作化：make-or-buy／垂直整合程度，或 Heide (1994) 的治理型態題
    url: https://en.wikipedia.org/wiki/Transaction_cost
    verified: false
    items:
    - 'Binary: activity performed in-house (hierarchy) vs. purchased from the market (0/1)'
    - 'Degree of vertical integration: share of inputs produced internally (%)'
    - Decisions about [activity] are made centrally by our firm rather than negotiated with partners.
    - Our firm monitors and controls the partner's activities through formal authority.
    - Disputes with the partner are settled by our firm's managers rather than by contract or market.
    scale: 二元／比例；態度題 7 點 strongly disagree – strongly agree
    reliability: ''
    context: ''
    notes: 多為客觀／結構指標；態度題依常見引用改寫，無單一標準量表。
Job Resources:
  zh: ''
  scales:
  - name: Bakker & Demerouti (2007)
    source: Bakker & Demerouti (2007) Journal of Managerial Psychology 22(3), 309–328, JD-R model；資源題多沿用 Karasek
      JCQ（decision latitude, social support）與 feedback 題
    url: https://en.wikipedia.org/wiki/Job_demands-resources_model
    verified: false
    items:
    - I have a lot of say over what happens on my job.（autonomy / decision latitude）
    - My job allows me to make a lot of decisions on my own.（autonomy）
    - My supervisor is helpful in getting the job done.（supervisor support）
    - People I work with are helpful in getting the job done.（coworker support）
    - I receive sufficient information about the results of my work.（feedback）
    - My job offers me opportunities for personal growth and development.（development）
    scale: 4-point（JCQ, strongly disagree – strongly agree）或 5-point
    reliability: decision latitude α ≈ .80, social support ≈ .80（JCQ，依常見引用）
    context: ''
    notes: 無單一標準量表；題項依常見引用改寫。JD-R 作者也用 Bakker 的 Job Demands-Resources Questionnaire，但未公開標準版。
Out-group:
  zh: ''
  scales:
  - name: Reicher, Spears & Postmes (1995)
    source: Reicher, Spears & Postmes (1995) SIDE model；操弄：互動對象標示為內／外團體；測量：團體認同與外團體評價
    url: https://en.wikipedia.org/wiki/Social_identity_model_of_deindividuation_effects
    verified: false
    items:
    - 'Manipulation: partner / source labeled as member of own group (in-group) vs. another group (out-group)'
    - 'Manipulation check: The other participants belonged to my group / a different group.'
    - 'Out-group evaluation: rate out-group members on warmth, competence (7-point)'
    - 'Social distance: I would be willing to work closely with members of [out-group]. (7-point)'
    - 'Identification: I identify with my group. (Leach et al. 2008)'
    scale: 操弄變項；評價題 7 點
    reliability: ''
    context: ''
    notes: 操弄變項；測量題依摘要改寫。
Prior Relationship Reputation:
  zh: ''
  scales:
  - name: Coombs & Holladay (2001)
    source: Coombs & Holladay (2001) Journal of Public Relations Research 13(4), 321–340；SCCT 強化因子，實驗操弄為主
    url: https://en.wikipedia.org/wiki/Situational_crisis_communication_theory
    verified: true
    items:
    - 'Manipulation: background states the organization has treated stakeholders well (favorable prior reputation)
      vs. poorly (unfavorable) vs. no information'
    - 'Manipulation check: Before the crisis, this organization had a good reputation. (7-point agree)'
    - Pre-crisis reputation measured with Organizational Reputation Scale items (e.g., The organization is basically
      honest.)
    scale: 操弄變項；檢核與量表 5–7 點
    reliability: ''
    context: ''
    notes: 操弄變項；量表版沿用 Org Reputation 條目。
Resource Non-substitutability:
  zh: ''
  scales:
  - name: Barney (1991)
    source: Barney (1991) Journal of Management 17(1), 99–120, VRIN；實證多以自評題操作化（如 Newbert 2008）
    url: https://en.wikipedia.org/wiki/Resource-based_view
    verified: false
    items:
    - Competitors cannot achieve the same benefits by using a different, more readily available resource.
    - There are no strategically equivalent substitutes for this resource / capability.
    - If competitors lacked this resource, they could not easily replace it with another resource.
    - This resource is difficult for competitors to substitute.
    scale: 7-point, strongly disagree – strongly agree（經理人自評）
    reliability: ''
    context: ''
    notes: 無公認標準量表；題項依定義改寫。頁面指出同時滿足 VRIN 的資源在實證上極難辨識與測量。
Responsiveness:
  zh: ''
  scales:
  - name: Parasuraman, Zeithaml & Berry (1988)
    source: Parasuraman, Zeithaml & Berry (1988) Journal of Retailing 64(1), SERVQUAL Responsiveness (4 items)
    url: https://en.wikipedia.org/wiki/SERVQUAL
    verified: false
    items:
    - Employees of [XYZ] tell you exactly when services will be performed.
    - Employees of [XYZ] give you prompt service.
    - Employees of [XYZ] are always willing to help you.
    - '[XYZ] employees are never too busy to help you.'
    scale: 7-point, strongly disagree – strongly agree；期望／知覺雙答
    reliability: responsiveness α ≈ .80（PZB 1988 跨樣本 .69–.80，依常見引用）
    context: ''
    notes: 第 4 題為頁面逐字，其餘依常見引用改寫。
Tangibles:
  zh: ''
  scales:
  - name: Parasuraman, Zeithaml & Berry (1988)
    source: Parasuraman, Zeithaml & Berry (1988) Journal of Retailing 64(1), SERVQUAL Tangibles (4 items)
    url: https://en.wikipedia.org/wiki/SERVQUAL
    verified: false
    items:
    - '[XYZ] has modern-looking equipment.'
    - '[XYZ]''s physical facilities are visually appealing.'
    - '[XYZ]''s employees are neat-appearing.'
    - Materials associated with the service (such as pamphlets or statements) are visually appealing at [XYZ].
    scale: 7-point, strongly disagree – strongly agree；期望／知覺雙答
    reliability: tangibles α ≈ .52–.72（PZB 1988，各構面中最低，依常見引用）
    context: ''
    notes: 第 1 題為頁面逐字，其餘依常見引用改寫。
Work Engagement:
  zh: ''
  scales:
  - name: Schaufeli, Bakker & Salanova (2006)
    source: Schaufeli, Bakker & Salanova (2006) Educational and Psychological Measurement 66(4), 701–716, UWES-9
      (vigor 3, dedication 3, absorption 3)
    url: https://www.frontiersin.org/articles/10.3389/fpsyg.2019.02771/full
    verified: true
    items:
    - At my work, I feel bursting with energy.（vigor）
    - At my job, I feel strong and vigorous.（vigor）
    - When I get up in the morning, I feel like going to work.（vigor）
    - I am enthusiastic about my job.（dedication）
    - My job inspires me.（dedication）
    - I am proud of the work that I do.（dedication）
    - I feel happy when I am working intensely.（absorption）
    - I get carried away when I am working.（absorption）
    - I am immersed in my work.（absorption）
    scale: 7-point frequency, 0 = never, 6 = always / all the time
    reliability: 總量表 α = .947（Frontiers 2019 樣本）；原始 10 國樣本各分量表 α .70–.90
    context: ''
    notes: 全 9 題為頁面逐字。
