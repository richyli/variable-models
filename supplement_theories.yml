    - {title: Revisiting UTAUT for the Age of AI (arXiv 2510.15142), url: 'https://arxiv.org/pdf/2510.15142'}
    - {title: 'UTAUT applied: cultural dimensions and demographic characteristics on e-learning acceptance (arXiv 1607.01492)',
      url: 'https://arxiv.org/pdf/1607.01492'}
    enrich_notes: 原十條其實是五條重複（空符號＋ +），已去重；五條主效果與 Venkatesh 等（2003）一致。沿用既有變數名：Perceived Ease of Use 代表努力期望、Social Norm 代表社會影響。四個調節變數依原文的調節假設掛到對應路徑，為控制邊數省略性別對努力期望與社會影響的調節（原文有）。UTAUT2
      新增的享樂動機、價格價值、習慣與促成條件→意圖未納入。
  T ECT Expectation Confirmation Theory:
    note: T ECT Expectation Confirmation Theory
    abbr: ECT
    zh: 期望確認理論
    field: ''
    edges:
    - [Expectation, Confirmation of Expectations, '-']
    - [Perceived Performance, Confirmation of Expectations, +]
    - [Expectation, User Satisfaction, +]
    - [Perceived Performance, User Satisfaction, +]
    - [Confirmation of Expectations, User Satisfaction, +]
    - [Confirmation of Expectations, PU Perceived Usefulness, +]
    - [PU Perceived Usefulness, User Satisfaction, +]
    - [PU Perceived Usefulness, Continuance Intention, +]
    - [User Satisfaction, Continuance Intention, +]
    desc: Oliver（1980）提出：消費者在使用前形成期望，使用後比較實際績效與期望，產生正向或負向的失驗，失驗與期望共同決定滿意度，滿意度再影響態度與再購意圖；Bhattacherjee（2001）把它移植到資訊系統，以確認、使用後的知覺有用性與滿意度解釋持續使用意圖。
    refs:
    - {title: Expectation confirmation theory (IS Theories wiki), url: 'https://is.theorizeit.org/wiki/Expectation_confirmation_theory'}
    - {title: Expectation confirmation theory (Wikipedia), url: 'https://en.wikipedia.org/wiki/Expectation_confirmation_theory'}
    - {title: Expectation confirmation theory (Newcastle open theory library), url: 'https://open.ncl.ac.uk/theories/14/expectation-confirmation-theory/'}
    enrich_notes: 原五條都沒有符號，依 Oliver（1980）與 Bhattacherjee（2001）補上。Expectation -> Confirmation 給負號：在期望固定的情況下期望越高越難被確認（Oliver
      的失驗定義、Bhattacherjee 也採負向）；Expectation -> User Satisfaction 給正號對應 Oliver 的同化效果。補上 Perceived Performance（Oliver 的知覺績效，原
      desc 已提及但 edges 沒有）。依變項從 Behavioral Intention 改為名單裡已有的 Continuance Intention，因 ECT／ECM 的結果變項明確是再購或持續使用意圖。原本 Expectation
      -> PU 一條在 Bhattacherjee 模型裡不存在，刪除。
  TAM:
    note: TAM
